<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
  <title>Level 20 Character Console</title>
  <style>
    :root{color-scheme:dark;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1320;color:#f8f1d6}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 0%,rgba(126,182,214,.18),transparent 30rem),#0b1320}
    .loader{max-width:620px;border:1px solid rgba(234,215,164,.22);border-radius:24px;padding:26px;background:linear-gradient(135deg,rgba(22,34,55,.96),rgba(13,22,36,.96));box-shadow:0 26px 72px rgba(0,0,0,.38)}
    .loader strong{display:block;font:800 1.35rem Georgia,Cambria,serif;margin-bottom:8px}.loader p{color:#b8c4cf;line-height:1.5;margin:0}.loader .rail{height:4px;margin-top:18px;border-radius:99px;background:rgba(234,215,164,.13);overflow:hidden}.loader .rail:after{content:"";display:block;width:42%;height:100%;background:#c7a35a;animation:load 1.1s ease-in-out infinite}@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(250%)}}@media(prefers-reduced-motion:reduce){.loader .rail:after{animation:none;width:100%}}
  </style>
</head>
<body>
  <main class="loader" id="loader" role="status" aria-live="polite">
    <strong>Loading the table-state ledger…</strong>
    <p>Preparing Lisa Blesslie and Steph Scurry with sheet math, action economy, resources, spells, inventory, conditions, and journal tools.</p>
    <div class="rail" aria-hidden="true"></div>
  </main>
  <script src="payload-01.js"></script>
  <script src="payload-02a.js"></script>
  <script src="payload-02b.js"></script>
  <script src="payload-03.js"></script>
  <script src="payload-04.js"></script>
  <script src="payload-05.js"></script>
  <script src="payload-06.js"></script>
  <script src="payload-07.js"></script>
  <script src="payload-08.js"></script>
  <script src="boot.js"></script>
</body>
</html>
