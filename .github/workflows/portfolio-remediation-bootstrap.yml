name: Portfolio remediation bootstrap

on:
  push:
    branches: [codex/portfolio-quality-remediation-20260805]

permissions:
  contents: write

concurrency:
  group: portfolio-remediation-bootstrap
  cancel-in-progress: false

jobs:
  remediate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/portfolio-quality-remediation-20260805
          fetch-depth: 0
          lfs: true
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply source-first portfolio remediation
        run: python scripts/apply_portfolio_remediation.py

      - name: Install website dependencies
        run: npm --prefix site install

      - name: Run portfolio governance audit
        run: npm --prefix site run audit:portfolio

      - name: Run complete unit and policy suite
        run: npm run site:test

      - name: Build production site and enforce public/private boundary
        run: npm run site:build

      - name: Install Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Run complete professional-site browser suite
        working-directory: site
        run: npx playwright test --reporter=line --grep-invert "Table Ledger D&D console"

      - name: Run Table Ledger isolated browser suite
        working-directory: site
        run: npx playwright test tests/dnd-console.spec.ts --reporter=line

      - name: Install and verify RAMIE backend
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-scribe/requirements.txt
          python -m compileall services/ai-scribe
          python -m pytest services/ai-scribe/tests -q

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-remediation-verification-${{ github.sha }}
          path: |
            site/portfolio-audit.json
            site/test-results
            site/playwright-report
          if-no-files-found: warn
          retention-days: 14

      - name: Remove bootstrap-only files and publish clean source commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/portfolio-remediation-bootstrap.yml scripts/apply_portfolio_remediation.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: establish portfolio governance and strict app acceptance gates'
          git push origin HEAD:codex/portfolio-quality-remediation-20260805
