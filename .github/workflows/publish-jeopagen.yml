name: Publish qualified JeopaGen release

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish-jeopagen.yml

permissions:
  contents: read

concurrency:
  group: jeopagen-qualified-publish
  cancel-in-progress: false

env:
  RELEASE_URL: 'https://sdmntpreastus.oaiusercontent.com/files/00000000-0524-81f9-bfdc-0ca95a7dbbd9/raw?se=2026-08-04T23:42:04Z&sp=r&sv=2026-02-06&sr=b&scid=47b67ff8-4d90-5f5f-8506-198a377b98d4&skoid=a1be202a-6464-476c-a496-723317c4a4db&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T11:02:50Z&ske=2026-08-05T11:02:50Z&sks=b&skv=2026-02-06&sig=/r8XvMIDN%2BUIJ8BLPO4m6X0bfM6BFgXa5Q24TQhw%2Bgc%3D'
  RELEASE_ZIP_SHA256: '8446e2c67908f885c425b501c765196f4abf80b006b7617fb490f19901614ad8'
  RELEASE_COMMIT: '99d9d85cba36cda6a231c64f0bf612f6d26a0c8f'
  PUBLISH_BRANCH: 'codex/publish-jeopagen-static-20260804'
  JEOPAGEN_URL: 'https://ramiefathy.com/tools/jeopagen/'

jobs:
  prepare-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    outputs:
      publish_commit: ${{ steps.publish.outputs.commit }}
    steps:
      - name: Check out public website
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'

      - name: Download and verify qualified release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/jeopagen-release.zip"
          release="$RUNNER_TEMP/jeopagen-release"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 300 "$RELEASE_URL" --output "$archive"
          echo "$RELEASE_ZIP_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$release"
          unzip -q "$archive" -d "$release"
          (
            cd "$release"
            sed 's#  dist/#  #' SHA256SUMS | sha256sum --check --strict
          )
          jq -e --arg commit "$RELEASE_COMMIT" \
            '.repository == "ramiefathy/JeopaGen" and .commit == $commit and .workflow_run == "30960374650"' \
            "$release/release-manifest.json" >/dev/null
          grep -Fq '<title>JeopaGen · AI game studio</title>' "$release/index.html"
          grep -Fq './assets/' "$release/index.html"
          if grep -R -n -E 'VITE_GOOGLE_API_KEY|live-verification-placeholder-key' "$release"; then
            echo 'Credential marker detected in qualified release.'
            exit 1
          fi

      - name: Stage production route and minimize public assets
        shell: bash
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/jeopagen-release"
          target='site/public/tools/jeopagen'
          rm -rf "$target"
          mkdir -p "$target"
          cp -a "$release"/. "$target"/
          rm -f "$target/.nojekyll"
          find "$target/assets" -type f -name '*.map' -delete
          find "$target/assets" -type f -name '*.js' -exec sed -i '/^\/\/# sourceMappingURL=.*$/d' {} +
          jq \
            --arg route '/tools/jeopagen/' \
            --arg artifact_sha "$RELEASE_ZIP_SHA256" \
            '. + {public_route:$route, source_artifact_sha256:$artifact_sha}' \
            "$target/release-manifest.json" > "$target/release-manifest.tmp"
          mv "$target/release-manifest.tmp" "$target/release-manifest.json"
          (
            cd "$target"
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          test -s "$target/assets/pdf.worker.min-yatZIOMy.mjs"
          test -s "$target/assets/index-FIX_h62x.js"
          test -s "$target/assets/index-DY3sOHbc.css"
          test "$(find "$target/assets" -type f -name '*.map' | wc -l)" -eq 0

      - name: Install website dependencies
        run: npm --prefix site install

      - name: Run website unit tests
        run: npm run site:test

      - name: Build complete Astro site
        run: npm run site:build

      - name: Verify built JeopaGen route
        shell: bash
        run: |
          set -euo pipefail
          root='site/dist/tools/jeopagen'
          test -s "$root/index.html"
          test -s "$root/release-manifest.json"
          test -s "$root/SHA256SUMS"
          test -s "$root/assets/pdf.worker.min-yatZIOMy.mjs"
          grep -Fq '<title>JeopaGen · AI game studio</title>' "$root/index.html"
          jq -e --arg commit "$RELEASE_COMMIT" '.commit == $commit and .public_route == "/tools/jeopagen/"' \
            "$root/release-manifest.json" >/dev/null
          if grep -R -n -E 'VITE_GOOGLE_API_KEY|live-verification-placeholder-key' "$root"; then
            echo 'Credential marker detected in built public route.'
            exit 1
          fi

      - name: Persist qualified route on publication branch
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$PUBLISH_BRANCH"
          git add site/public/tools/jeopagen
          git commit -m 'feat: publish qualified JeopaGen application'
          commit=$(git rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${PUBLISH_BRANCH}"

      - name: Upload complete Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/dist

  deploy:
    needs: prepare-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy complete public site
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  live-smoke:
    needs: [prepare-and-build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out publication branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.PUBLISH_BRANCH }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'

      - name: Install website dependencies
        run: npm --prefix site install

      - name: Install Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Wait for qualified route
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/release-manifest.json"
          for attempt in $(seq 1 36); do
            cache_key="${GITHUB_RUN_ID}-${attempt}"
            code=$(curl --silent --show-error --location --connect-timeout 15 --max-time 30 \
              --output "$manifest" --write-out '%{http_code}' \
              "${JEOPAGEN_URL}release-manifest.json?deploy=${cache_key}" || true)
            if [[ "$code" == 200 ]] && jq -e --arg commit "$RELEASE_COMMIT" '.commit == $commit' "$manifest" >/dev/null 2>&1; then
              echo "Qualified JeopaGen route ready on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}/36 not ready."
            sleep 10
          done
          echo 'Qualified JeopaGen route did not become ready.'
          exit 1

      - name: Write live desktop/mobile test
        shell: bash
        run: |
          cat > site/playwright.jeopagen-live.config.mjs <<'EOF'
          import { defineConfig, devices } from '@playwright/test';
          export default defineConfig({
            testDir: './tests',
            testMatch: 'jeopagen-live-release.spec.mjs',
            outputDir: 'jeopagen-live-results',
            fullyParallel: false,
            retries: 1,
            workers: 1,
            timeout: 120000,
            expect: { timeout: 20000 },
            reporter: [['line'], ['html', { outputFolder: 'jeopagen-live-report', open: 'never' }]],
            use: {
              baseURL: process.env.JEOPAGEN_URL,
              actionTimeout: 20000,
              navigationTimeout: 45000,
              trace: 'retain-on-failure',
              screenshot: 'only-on-failure',
              video: 'retain-on-failure',
            },
            projects: [
              { name: 'live-desktop-chromium', use: { ...devices['Desktop Chrome'], viewport: { width: 1440, height: 1000 } } },
              { name: 'live-mobile-chromium', use: { ...devices['Pixel 7'] } },
            ],
          });
          EOF
          cat > site/tests/jeopagen-live-release.spec.mjs <<'EOF'
          import { expect, test } from '@playwright/test';
          const SNAPSHOT_KEY = 'jeopa_snapshots';
          const SESSION_KEY = 'jeopagen.gemini-api-key';
          const gameData = [{
            categoryName: 'Live Verification',
            questions: [100, 200, 300, 400, 500].map((points, index) => ({
              id: `live-${points}`, points,
              clue: `Live verification clue ${index + 1}.`,
              response: `What is live verification response ${index + 1}?`,
              topic: `Live topic ${index + 1}`,
              rationale: 'Deterministic live deployment verification fixture.',
            })),
          }];
          const recoveryHtml = '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Live recovery fixture</title></head><body><main><h1>Live recovery game</h1><p>Deployment recovery evidence.</p></main></body></html>';
          const snapshot = {
            id: 'live-release-snapshot', name: 'Live release verification', savedAt: 1786000000000,
            payload: {
              sourceText: 'Live deployment recovery fixture.', selectedTopics: ['Live Verification'],
              gameOptions: { categories: 'Live Verification', audience: 'Medical Student', style: 'Board Exam Review', instructions: '', enableQuestionTopicSelection: false },
              questionTopicsData: null, candidateData: null, userSelections: null,
              gameData, generatedHtml: recoveryHtml, activeStep: 7, maxStepReached: 8,
            },
          };
          const runtimeErrors = (page) => {
            const errors = [];
            page.on('pageerror', (error) => errors.push(`pageerror: ${error.message}`));
            page.on('console', (message) => { if (message.type() === 'error') errors.push(`console: ${message.text()}`); });
            return errors;
          };
          const noOverflow = async (page) => {
            const value = await page.evaluate(() => ({ innerWidth, scrollWidth: document.documentElement.scrollWidth }));
            expect(value.scrollWidth).toBeLessThanOrEqual(value.innerWidth + 1);
          };
          const shot = (name, suffix) => `${name.replace(/[^a-z0-9]+/gi, '-').toLowerCase()}-${suffix}.png`;
          test('live JeopaGen supports key lifecycle, recovery, editing, preview, and export', async ({ page }, testInfo) => {
            const errors = runtimeErrors(page);
            await page.goto(`./?deploy=${Date.now()}`, { waitUntil: 'networkidle' });
            await expect(page.getByRole('heading', { name: 'JEOPAGEN' })).toBeVisible();
            await expect(page.getByTestId('api-key-panel')).toContainText('Add your Gemini API key');
            await expect(page.locator('#file-input')).toBeDisabled();
            await noOverflow(page);
            await page.screenshot({ path: testInfo.outputPath(shot(testInfo.project.name, '01-initial')), fullPage: true });
            await page.getByLabel('Gemini API key').fill('live-verification-placeholder-key');
            await page.getByRole('button', { name: 'Save for this tab' }).click();
            await expect(page.locator('#file-input')).toBeEnabled();
            expect(await page.evaluate((key) => sessionStorage.getItem(key), SESSION_KEY)).toBe('live-verification-placeholder-key');
            await page.getByRole('button', { name: 'Clear key' }).click();
            await expect(page.locator('#file-input')).toBeDisabled();
            await page.evaluate(({ key, value }) => localStorage.setItem(key, JSON.stringify([value])), { key: SNAPSHOT_KEY, value: snapshot });
            await page.reload({ waitUntil: 'networkidle' });
            await expect(page.getByTestId('saved-work-recovery')).toBeVisible();
            await page.getByRole('button', { name: 'Restore snapshot' }).click();
            await expect(page.getByRole('heading', { name: 'Board editor' })).toBeVisible();
            const preview = page.frameLocator('iframe[title="Jeopardy Game Preview"]');
            await expect(preview.getByRole('heading', { name: 'Live recovery game' })).toBeVisible();
            await page.getByRole('button', { name: /Live Verification, \$100: preview clue/i }).click();
            await page.getByRole('button', { name: 'Reveal response' }).click();
            await expect(page.getByText('What is live verification response 1?')).toBeVisible();
            await noOverflow(page);
            await page.screenshot({ path: testInfo.outputPath(shot(testInfo.project.name, '02-recovered-review')), fullPage: true });
            await page.getByRole('button', { name: /Download Your Game/ }).click();
            await expect(page.getByRole('heading', { name: 'Download Your Game' })).toBeVisible();
            await noOverflow(page);
            await page.screenshot({ path: testInfo.outputPath(shot(testInfo.project.name, '03-download')), fullPage: true });
            const downloadPromise = page.waitForEvent('download');
            await page.getByRole('button', { name: 'DOWNLOAD HTML' }).click();
            expect((await downloadPromise).suggestedFilename()).toMatch(/jeopardy-game\.html/i);
            expect(errors, errors.join('\n')).toEqual([]);
          });
          EOF

      - name: Run live desktop/mobile smoke matrix
        working-directory: site
        env:
          JEOPAGEN_URL: ${{ env.JEOPAGEN_URL }}
        run: npx playwright test --config playwright.jeopagen-live.config.mjs

      - name: Upload live JeopaGen evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jeopagen-live-evidence-${{ needs.prepare-and-build.outputs.publish_commit }}
          path: |
            site/jeopagen-live-results
            site/jeopagen-live-report
          if-no-files-found: error
          retention-days: 14
