name: Finalize temporary remediation workflows

on:
  push:
    branches:
      - codex/portfolio-quality-remediation-20260806
    paths:
      - .github/workflows/codex-finalize-temporary-workflows.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: codex/portfolio-quality-remediation-20260806
          persist-credentials: true

      - name: Verify RAMIE source hook and governed catalog assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<script src="research-boundary.js" defer></script>' site/public/apps/dermatology-scribe/index.html
          grep -Fq 'Research prototype' site/public/apps/dermatology-scribe/research-boundary.js
          grep -Fq 'public demo is not approved for PHI' site/public/apps/dermatology-scribe/research-boundary.js
          grep -Fq ".app-plate:not(.cat-learning):visible" site/tests/field-console.spec.ts

      - name: Remove all temporary remediation workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/codex-one-time-catalog-test-fix.yml \
            .github/workflows/codex-one-time-ramie-boundary-hook.yml \
            .github/workflows/codex-finalize-temporary-workflows.yml

      - name: Commit clean source-only head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          if git diff --cached --quiet; then
            echo 'No temporary workflows remained.'
            exit 0
          fi
          git commit -m 'chore(ci): finalize source-only portfolio remediation head'
          git push origin HEAD:codex/portfolio-quality-remediation-20260806
