name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm --prefix site install
      - name: Build Astro site
        run: npm run site:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify production Table Ledger application
        env:
          DND_URL: https://ramiefathy.com/tools/dnd-l20-console-f2c7a9/
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/dnd-smoke"
          mkdir -p "$work"
          assets=(index.html styles.css data.js app.js manifest.webmanifest icon.svg sw.js)
          for attempt in $(seq 1 30); do
            ready=1
            cache_key="${GITHUB_SHA}-${attempt}"
            for asset in "${assets[@]}"; do
              url="${DND_URL}${asset#index.html}"
              [[ "$asset" == index.html ]] && url="${DND_URL}"
              code=$(curl --silent --show-error --location --connect-timeout 15 --max-time 30 --output "$work/$asset" --write-out '%{http_code}' "${url}?deploy=${cache_key}" || true)
              [[ "$code" == 200 ]] || ready=0
            done
            if [[ "$ready" == 1 ]] \
              && grep -Fq '<title>Table Ledger — D&D Character Console</title>' "$work/index.html" \
              && grep -Fq 'styles.css' "$work/index.html" \
              && grep -Fq 'data.js' "$work/index.html" \
              && grep -Fq 'app.js' "$work/index.html" \
              && ! grep -Eq 'payload-[0-9]|boot\.js' "$work/index.html" \
              && grep -Fq '4.0.0-srd521' "$work/data.js" \
              && grep -Fq '"count":337' "$work/data.js" \
              && grep -Fq 'Lisa Blesslie' "$work/data.js" \
              && grep -Fq 'Steph Scurry' "$work/data.js" \
              && grep -Fq 'Gloves of Thievery' "$work/data.js" \
              && grep -Fq 'Boon of Speed' "$work/data.js" \
              && grep -Fq 'calculateCurrentCharacter' "$work/app.js" \
              && grep -Fq 'renderDefenses' "$work/app.js" \
              && grep -Fq 'calculateEncumbrance' "$work/app.js" \
              && grep -Fq 'renderBuilder' "$work/app.js" \
              && grep -Fq 'calculateSpellSlots' "$work/app.js" \
              && grep -Fq '"display": "standalone"' "$work/manifest.webmanifest" \
              && grep -Fq 'table-ledger-4.0.0-srd521' "$work/sw.js"; then
              echo "Production Table Ledger smoke test passed on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}/30 not ready."
            sleep 10
          done
          echo "Production Table Ledger did not pass substantive smoke checks after 5 minutes."
          exit 1

  report-production-status:
    if: ${{ always() }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Pages deployment status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DND_URL: https://ramiefathy.com/tools/dnd-l20-console-f2c7a9/
        run: |
          set -euo pipefail
          state=failure
          description="Pages build, deploy, or Table Ledger smoke test failed"
          if [[ "$BUILD_RESULT" == success && "$DEPLOY_RESULT" == success ]]; then
            state=success
            description="Pages deploy and substantive Table Ledger smoke test passed"
          fi
          payload=$(jq -n --arg state "$state" --arg target_url "$DND_URL" --arg description "$description" --arg context "deploy/pages-production" '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --fail-with-body --silent --show-error --location --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
