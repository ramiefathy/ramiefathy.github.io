name: Live URL check (diagnostic)

on:
  workflow_dispatch:
    inputs:
      path:
        description: Site path to probe
        default: /apps/countcraft-blackjack-academy/
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe origins with a cache-busting query
        env:
          P: ${{ inputs.path }}
        run: |
          set -u
          for host in https://ramiefathy.com https://ramiefathy.github.io https://ramiefathy-github-io.pages.dev; do
            for variant in "" "?deploy=${GITHUB_RUN_ID}"; do
              url="${host}${P}${variant}"
              echo "== ${url}"
              curl -sS -L --max-time 30 -o body.html -D headers.txt -w 'status=%{http_code} size=%{size_download}\n' "$url" || true
              grep -iE '^(server|cache-control|cf-cache-status|age|last-modified|x-github-request-id|location):' headers.txt || true
              grep -o '<title>[^<]*' body.html | head -1 || true
              grep -c "Coach" body.html || true
            done
          done
