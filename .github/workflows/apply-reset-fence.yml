name: Apply encounter reset boundary
on:
  push:
    branches: [audit/clinical-apps-20260904]
    paths: [.github/workflows/apply-reset-fence.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/audit/clinical-apps-20260904'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preserve immutable source delta
        run: cp .audit-transfer/reset-fixes.b64 /tmp/reset-fixes.b64
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: audit/clinical-reference-safety-20260904
          persist-credentials: false
      - name: Verify exact base and all source hashes
        run: |
          test "$(git rev-parse HEAD)" = b25dbb32f06ffbdd8668344018a63b7f878f6783
          python - <<'PY'
          import base64,gzip,hashlib,json,pathlib,subprocess
          raw=gzip.decompress(base64.b64decode(pathlib.Path('/tmp/reset-fixes.b64').read_bytes(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='c606d72aefd7ffabeb5881cd345b1cf75fdd87491d7d4c7675de6b293ea8016b'
          paths=[]
          for item in json.loads(raw):
              path=pathlib.Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] in ('docs','services','site')
              assert not path.is_symlink()
              old=path.read_bytes()
              assert hashlib.sha256(old).hexdigest()==item['before'],f'Base mismatch: {path}'
              text=old.decode('utf-8')
              end=0
              for a,b,new in item['ops']:
                  assert end<=a<=b<=len(text)
                  end=b
              for a,b,new in reversed(item['ops']): text=text[:a]+new+text[b:]
              content=text.encode('utf-8')
              assert hashlib.sha256(content).hexdigest()==item['after'],f'Result mismatch: {path}'
              path.write_bytes(content)
              paths.append(str(path))
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git diff --cached --check
          python -m compileall -q services/ai-scribe
          node --check site/public/apps/dermatology-scribe/app.js
      - name: Commit verified reset isolation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/audit/clinical-apps-20260904
          test "$(git branch --show-current)" = audit/clinical-reference-safety-20260904
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/public/apps/dermatology-scribe/app.js services/ai-scribe/app.py services/ai-scribe/tests/test_generation_safety.py site/tests/clinical-reference-safety.spec.ts docs/audits/2026-09-04-clinical-app-verification.md
          git commit -m 'agent(codex): fence queued clinical output until matching encounter reset acknowledgment'
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:refs/heads/audit/clinical-reference-safety-20260904
          git rev-parse HEAD
