name: Recover verified Atlas source records
on:
  push:
    branches: [audit/atlas-publish-staging-20260905]
    paths: [.github/workflows/atlas-verified-source-recovery.yml]
permissions:
  contents: read
concurrency:
  group: atlas-verified-source-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/audit/atlas-publish-staging-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: staged
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fe42b9d2ae5695f853d0f360ac60f665bed1e5f4
          persist-credentials: false
          lfs: true
          path: release
      - name: Retrieve exact previously captured public-source evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas-archives /tmp/atlas-verified
          gh api repos/ramiefathy/ramiefathy.github.io/actions/artifacts/9970225993/zip > /tmp/atlas-archives/identity.zip
          gh api repos/ramiefathy/ramiefathy.github.io/actions/artifacts/9970312007/zip > /tmp/atlas-archives/ontology.zip
          gh api repos/ramiefathy/ramiefathy.github.io/actions/artifacts/9970364892/zip > /tmp/atlas-archives/atopic.zip
      - name: Verify all recovered source and ledger bytes
        run: |
          python3 staged/.atlas-recovery/recover_verified.py --staged staged --root release --archives /tmp/atlas-archives --receipt /tmp/atlas-verified
          git -C release add --pathspec-from-file=/tmp/atlas-verified/source-paths.txt
          git -C release diff --cached --check
          git -C release write-tree > /tmp/atlas-verified/TREE.txt
          tar -C release -czf /tmp/atlas-verified/recovered-source.tar.gz -T /tmp/atlas-verified/source-paths.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: release/.nvmrc
      - name: Clean install, complete unit suite and dependency audit
        working-directory: release
        run: |
          npm --prefix site ci
          npm --prefix site test -- --reporter=default --reporter=json --outputFile=unit-results.json
          npm --prefix site audit --json > site/dependency-audit.json
      - name: Production build and source invariance
        working-directory: release
        run: |
          npm run site:build
          test "$(git write-tree)" = "$(cat /tmp/atlas-verified/TREE.txt)"
          git diff --cached --check
      - name: Publish isolated source branch for full PR verification
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/audit/atlas-publish-staging-20260905
          test "$(git rev-parse HEAD)" = fe42b9d2ae5695f853d0f360ac60f665bed1e5f4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'agent(codex): restore clinical corrections and both Atlas evidence workbenches'
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:refs/heads/audit/clinical-atlas-review-20260905
          git rev-parse HEAD > /tmp/atlas-verified/PUBLISHED_COMMIT.txt
      - name: Preserve diagnostics and raw verification receipts
        if: always()
        run: |
          mkdir -p /tmp/atlas-verified
          for file in release/site/unit-results.json release/site/dependency-audit.json; do
            if test -f "$file"; then cp "$file" /tmp/atlas-verified/; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atlas-verified-source-and-tests
          path: /tmp/atlas-verified
          if-no-files-found: error
          retention-days: 7
