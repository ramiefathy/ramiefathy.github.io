name: One-time governed catalog browser assertion fix

on:
  push:
    branches:
      - codex/portfolio-quality-remediation-20260806
    paths:
      - .github/workflows/codex-one-time-catalog-test-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: codex/portfolio-quality-remediation-20260806
          persist-credentials: true

      - name: Use Node.js from repository pin
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Apply exact assertion migration
        shell: python
        run: |
          from pathlib import Path

          path = Path('site/tests/field-console.spec.ts')
          source = path.read_text()
          replacements = {
              "  await expect(filterButtons).toContainText(['All', 'Featured', 'Clinical workflow', 'Research', 'Reference', 'Learning', 'Productivity'])":
                  "  const expectedFilters = ['All', 'Featured', 'Clinical workflow', 'Research', 'Reference', 'Learning', 'Productivity']\n  for (let index = 0; index < expectedFilters.length; index += 1) {\n    await expect(filterButtons.nth(index)).toContainText(expectedFilters[index])\n  }",
              "  await expect(page.locator('.app-plate:not(.cat-learning)')).toBeHidden()":
                  "  await expect(page.locator('.app-plate:not(.cat-learning):visible')).toHaveCount(0)",
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence of {old!r}; found {count}')
              source = source.replace(old, new)
          path.write_text(source)

      - name: Install website dependencies
        run: npm --prefix site install

      - name: Install Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Run focused governed-catalog browser test
        working-directory: site
        run: npx playwright test field-console.spec.ts --grep "Apps catalog filter buttons work" --reporter=line

      - name: Commit corrected test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/tests/field-console.spec.ts
          git commit -m 'test(catalog): make governed filter assertions deterministic'
          git push origin HEAD:codex/portfolio-quality-remediation-20260806
