name: Harden Rheum-Derm Atlas P1-P2 integration

on:
  push:
    branches:
      - tmp/p2-publication-probe

permissions:
  contents: write

concurrency:
  group: harden-rheum-derm-atlas-p1-p2
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/rheum-derm-atlas-p0-integrity
          fetch-depth: 0
          persist-credentials: true

      - name: Correct lexical globals, array normalization, semantics, and pointer fallback
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('site/public/apps/rheum-derm-immune-atlas/explorer/p1-p2-governance.js')
          source = path.read_text(encoding='utf-8')

          source = source.replace(
              "  const unique = values => [...new Set((values || []).filter(Boolean))]\n",
              "  const asArray = value => Array.isArray(value) ? value : value == null || value === '' ? [] : [value]\n"
              "  const unique = values => [...new Set(asArray(values).filter(Boolean))]\n"
              "  const atlasData = typeof DATA !== 'undefined' ? DATA : window.DATA\n"
              "  const atlasPathways = typeof PATHWAY_ONTOLOGY !== 'undefined' ? PATHWAY_ONTOLOGY : (window.PATHWAY_ONTOLOGY || [])\n"
              "  const atlasCanonicalRules = typeof canonicalBackgroundRules !== 'undefined' ? canonicalBackgroundRules : (window.canonicalBackgroundRules || window.__ATLAS_P0__?.canonicalBackgroundRules || [])\n"
              "  const atlasCausalRules = typeof causalRules !== 'undefined' ? causalRules : (window.causalRules || [])\n"
          )
          source = source.replace('window.DATA', 'atlasData')
          source = source.replace('window.PATHWAY_ONTOLOGY', 'atlasPathways')
          source = source.replace('(window.canonicalBackgroundRules || window.__ATLAS_P0__?.canonicalBackgroundRules || [])', 'atlasCanonicalRules')
          source = source.replace("if (window.causalRules?.length && !$('#networkCanonicalBackground')?.checked)", "if (atlasCausalRules.length && !$('#networkCanonicalBackground')?.checked)")
          source = source.replace('class="atlas-task-grid" role="list"', 'class="atlas-task-grid" role="group"')
          source = source.replace(' role="listitem" aria-pressed=', ' aria-pressed=')

          needle = "        canvas.dispatchEvent(new PointerEvent('pointerup', { pointerId: 1, clientX: centerX + dx, clientY: centerY + dy, button: 0, shiftKey: shift, bubbles: true }))\n"
          replacement = needle + "        canvas.dispatchEvent(new MouseEvent('mousedown', { clientX: centerX, clientY: centerY, button: 0, shiftKey: shift, bubbles: true }))\n        canvas.dispatchEvent(new MouseEvent('mousemove', { clientX: centerX + dx, clientY: centerY + dy, buttons: 1, shiftKey: shift, bubbles: true }))\n        canvas.dispatchEvent(new MouseEvent('mouseup', { clientX: centerX + dx, clientY: centerY + dy, button: 0, shiftKey: shift, bubbles: true }))\n"
          if needle in source and "new MouseEvent('mousedown'" not in source:
              source = source.replace(needle, replacement)

          if 'atlasDataData' in source or 'atlasPathways ||' in source:
              raise SystemExit('unsafe replacement result')
          path.write_text(source, encoding='utf-8')
          PY

          node --check site/public/apps/rheum-derm-immune-atlas/explorer/p1-p2-governance.js
          grep -q "const atlasData = typeof DATA" site/public/apps/rheum-derm-immune-atlas/explorer/p1-p2-governance.js
          ! grep -q 'window.DATA' site/public/apps/rheum-derm-immune-atlas/explorer/p1-p2-governance.js
          ! grep -q 'role="listitem"' site/public/apps/rheum-derm-immune-atlas/explorer/p1-p2-governance.js
          git diff --check

      - name: Commit and push with rebase retry
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No hardening changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/public/apps/rheum-derm-immune-atlas/explorer/p1-p2-governance.js
          git commit -m 'fix(atlas): harden governed interface runtime'
          for attempt in 1 2 3; do
            git pull --rebase origin fix/rheum-derm-atlas-p0-integrity
            if git push origin HEAD:fix/rheum-derm-atlas-p0-integrity; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
