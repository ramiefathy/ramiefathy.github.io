name: Migrate Pages to governed portfolio smoke

on:
  push:
    branches:
      - codex/portfolio-quality-remediation-20260806
    paths:
      - .github/workflows/codex-pages-governed-smoke.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/portfolio-quality-remediation-20260806
          persist-credentials: true

      - name: Replace Pages workflow
        shell: bash
        run: |
          cat > .github/workflows/pages.yml <<'EOF'
          name: Deploy governed Astro site to GitHub Pages

          on:
            push:
              branches: [master]
            workflow_dispatch:

          concurrency:
            group: pages
            cancel-in-progress: true

          permissions:
            contents: read

          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                  with:
                    lfs: true
                    persist-credentials: false
                - uses: actions/setup-node@v4
                  with:
                    node-version-file: '.nvmrc'
                - name: Install website dependencies
                  run: npm --prefix site install
                - name: Write exact-source deployment manifest
                  shell: bash
                  run: |
                    cat > site/public/deploy-manifest.json <<JSON
                    {
                      "schemaVersion": 1,
                      "repository": "${GITHUB_REPOSITORY}",
                      "commit": "${GITHUB_SHA}",
                      "workflowRun": "${GITHUB_RUN_ID}",
                      "classification": "governed portfolio site"
                    }
                    JSON
                - name: Run policy and unit tests
                  run: npm run site:test
                - name: Build Astro site
                  run: npm run site:build
                - name: Verify governed built surfaces
                  shell: bash
                  run: |
                    set -euo pipefail
                    test -s site/dist/apps/index.html
                    test -s site/dist/apps/dermatology-scribe/index.html
                    test -s site/dist/research/dermoscopy-llm-dashboard/index.html
                    test -s site/dist/deploy-manifest.json
                    jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' site/dist/deploy-manifest.json >/dev/null
                    grep -Fq 'Tools with' site/dist/apps/index.html
                    grep -Fq 'research-boundary.js' site/dist/apps/dermatology-scribe/index.html
                    grep -Fq '100 unique images' site/dist/research/dermoscopy-llm-dashboard/index.html
                - uses: actions/upload-pages-artifact@v3
                  with:
                    path: site/dist

            deploy:
              needs: build
              runs-on: ubuntu-latest
              permissions:
                pages: write
                id-token: write
              environment:
                name: github-pages
                url: ${{ steps.deploy.outputs.page_url }}
              steps:
                - name: Deploy to Pages
                  id: deploy
                  uses: actions/deploy-pages@v4

            production-smoke:
              needs: [build, deploy]
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - name: Verify exact deployed commit and governed boundaries
                  shell: bash
                  env:
                    SITE_URL: https://ramiefathy.com
                  run: |
                    set -euo pipefail
                    work="$RUNNER_TEMP/site-smoke"
                    mkdir -p "$work"
                    for attempt in $(seq 1 36); do
                      key="${GITHUB_RUN_ID}-${attempt}"
                      manifest_code=$(curl --silent --show-error --location --connect-timeout 15 --max-time 30 \
                        --output "$work/deploy-manifest.json" --write-out '%{http_code}' \
                        "$SITE_URL/deploy-manifest.json?deploy=$key" || true)
                      apps_code=$(curl --silent --show-error --location --connect-timeout 15 --max-time 30 \
                        --output "$work/apps.html" --write-out '%{http_code}' \
                        "$SITE_URL/apps?deploy=$key" || true)
                      ramie_code=$(curl --silent --show-error --location --connect-timeout 15 --max-time 30 \
                        --output "$work/ramie.html" --write-out '%{http_code}' \
                        "$SITE_URL/apps/dermatology-scribe/index.html?deploy=$key" || true)
                      dermoscopy_code=$(curl --silent --show-error --location --connect-timeout 15 --max-time 30 \
                        --output "$work/dermoscopy.html" --write-out '%{http_code}' \
                        "$SITE_URL/research/dermoscopy-llm-dashboard?deploy=$key" || true)
                      if [[ "$manifest_code" == 200 && "$apps_code" == 200 && "$ramie_code" == 200 && "$dermoscopy_code" == 200 ]] \
                        && jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' "$work/deploy-manifest.json" >/dev/null 2>&1 \
                        && grep -Fq 'Tools with' "$work/apps.html" \
                        && grep -Fq 'research-boundary.js' "$work/ramie.html" \
                        && grep -Fq '100 unique images' "$work/dermoscopy.html"; then
                        echo "Governed exact-source site verified on attempt ${attempt}."
                        exit 0
                      fi
                      sleep 10
                    done
                    echo 'Governed exact-source production smoke did not pass.'
                    exit 1

            report-status:
              if: ${{ always() }}
              needs: [build, deploy, production-smoke]
              runs-on: ubuntu-latest
              permissions:
                statuses: write
              steps:
                - name: Publish combined deployment status
                  shell: bash
                  env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    BUILD_RESULT: ${{ needs.build.result }}
                    DEPLOY_RESULT: ${{ needs.deploy.result }}
                    SMOKE_RESULT: ${{ needs.production-smoke.result }}
                  run: |
                    set -euo pipefail
                    state=failure
                    description='Governed build, deploy, or production smoke failed'
                    if [[ "$BUILD_RESULT" == success && "$DEPLOY_RESULT" == success && "$SMOKE_RESULT" == success ]]; then
                      state=success
                      description='Governed exact-source production smoke passed'
                    fi
                    payload=$(jq -n --arg state "$state" --arg target_url "https://ramiefathy.com/apps" --arg description "$description" --arg context 'deploy/pages-production' '{state:$state,target_url:$target_url,description:$description,context:$context}')
                    curl --fail-with-body --silent --show-error --location --request POST \
                      --header 'Accept: application/vnd.github+json' \
                      --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                      --header 'X-GitHub-Api-Version: 2022-11-28' \
                      "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
                      --data "$payload"
          EOF

      - name: Verify no D&D-specific production dependency remains
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eiq 'dnd|table ledger|Lisa Blesslie|Steph Scurry' .github/workflows/pages.yml
          grep -Fq 'deploy-manifest.json' .github/workflows/pages.yml
          grep -Fq 'dermatology-scribe' .github/workflows/pages.yml
          grep -Fq '100 unique images' .github/workflows/pages.yml

      - name: Remove migration workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/codex-pages-governed-smoke.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pages.yml .github/workflows/codex-pages-governed-smoke.yml
          git commit -m 'ci(deploy): use governed exact-source portfolio smoke'
          git push origin HEAD:codex/portfolio-quality-remediation-20260806
