name: Atlas primary trial source check
on:
  push:
    branches: [audit/atlas-publish-staging-20260905]
    paths: [.github/workflows/atlas-primary-trials.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact PubMed identities for internal source review
        run: |
          mkdir -p /tmp/atlas-primary-trials
          python - <<'PY'
          import urllib.request,urllib.parse,hashlib,json,pathlib,datetime
          ids=['31851795','32937045','33971155','36198179','23124935','31112379','38279402','27469583','32866440','33007286','33667402']
          url='https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?'+urllib.parse.urlencode({'db':'pubmed','id':','.join(ids),'retmode':'xml','tool':'AtlasSourceReview'})
          req=urllib.request.Request(url,headers={'User-Agent':'AtlasSourceReview/1.1'})
          with urllib.request.urlopen(req,timeout=60) as response: raw=response.read(); status=response.status
          dest=pathlib.Path('/tmp/atlas-primary-trials')
          (dest/'pubmed.xml').write_bytes(raw)
          (dest/'receipt.json').write_text(json.dumps({'requestUrl':url,'httpStatus':status,'retrievedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'responseSha256':hashlib.sha256(raw).hexdigest(),'pmids':ids,'scope':'Internal publication review; no clinical acceptance or permission to redistribute full abstracts.'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-primary-trials
          path: /tmp/atlas-primary-trials
          if-no-files-found: error
          retention-days: 3
