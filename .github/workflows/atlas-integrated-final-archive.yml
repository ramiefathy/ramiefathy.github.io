name: Archive integrated Atlas review
on:
  push:
    branches: [audit/atlas-publish-staging-20260905]
    paths: [.github/workflows/atlas-integrated-final-archive.yml]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 23f64f6fc54ada0c9487437ea4a79756f1a3bf3f
          persist-credentials: false
      - name: Archive only changed source, never font or dependency files
        run: |
          git fetch --no-tags --depth=1 origin fe42b9d2ae5695f853d0f360ac60f665bed1e5f4
          mkdir -p /tmp/atlas-final-archive
          python - <<'PY'
          import pathlib,subprocess,tarfile,io,json,hashlib
          base='fe42b9d2ae5695f853d0f360ac60f665bed1e5f4'
          head='23f64f6fc54ada0c9487437ea4a79756f1a3bf3f'
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()==head
          files=subprocess.check_output(['git','diff','--name-only','-z',base,head]).decode().split('\0')
          dest=pathlib.Path('/tmp/atlas-final-archive')
          manifest={'base':base,'head':head,'files':[],'excluded':[],'deleted':[]}
          allowed=[]
          with tarfile.open(dest/'source.tar.gz','w:gz') as archive:
              for name in filter(None,files):
                  path=pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  if path.suffix.lower() in {'.woff','.woff2','.ttf','.otf','.eot'} or 'node_modules' in path.parts:
                      manifest['excluded'].append(name);continue
                  if not pathlib.Path(name).exists():manifest['deleted'].append(name);continue
                  assert not pathlib.Path(name).is_symlink()
                  content=subprocess.check_output(['git','show',head+':'+name])
                  item=tarfile.TarInfo('source/'+name);item.size=len(content);item.mode=0o644;item.mtime=0
                  archive.addfile(item,io.BytesIO(content));allowed.append(name)
                  manifest['files'].append({'path':name,'bytes':len(content),'sha256':hashlib.sha256(content).hexdigest()})
          (dest/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          patch=subprocess.check_output(['git','diff','--binary',base,head,'--',*allowed,*manifest['deleted']])
          (dest/'against-pr184.patch').write_bytes(patch)
          (dest/'README.txt').write_text('Incremental exact source against PR 184 at '+base+'.\nHead: '+head+'.\nVerify every source file against manifest.json. This archive alone is not a complete repository or a clinical validation certificate.\n')
          print('Archived',len(allowed),'files; excluded',manifest['excluded'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrated-atlas-final-source
          path: /tmp/atlas-final-archive
          if-no-files-found: error
          retention-days: 7
