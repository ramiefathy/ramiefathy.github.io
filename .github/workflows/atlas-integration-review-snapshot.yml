name: Atlas integration review snapshot
on:
  push:
    branches: [audit/atlas-publish-staging-20260905]
    paths: [.github/workflows/atlas-integration-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f2d9abc818dc99d9b7054dc448ccddcd59705947
          persist-credentials: false
          fetch-depth: 2
      - name: Archive exact integration delta
        run: |
          mkdir -p /tmp/integration-source
          git diff --binary 02ca13167576e48d54a82c9a0811703b71ae06be HEAD > /tmp/integration-source/changes.patch
          python - <<'PY'
          import pathlib,subprocess,json,hashlib,tarfile,io
          base='02ca13167576e48d54a82c9a0811703b71ae06be'
          paths=subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines()
          manifest={'base':base,'head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'files':[]}
          with tarfile.open('/tmp/integration-source/source.tar.gz','w:gz') as tar:
              for name in paths:
                  path=pathlib.Path(name)
                  if not path.exists():manifest['files'].append({'path':name,'deleted':True});continue
                  raw=subprocess.check_output(['git','show','HEAD:'+name]);info=tarfile.TarInfo(name);info.size=len(raw);info.mode=0o644;tar.addfile(info,io.BytesIO(raw))
                  manifest['files'].append({'path':name,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)})
          pathlib.Path('/tmp/integration-source/manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-integrated-source
          path: /tmp/integration-source
          retention-days: 7
          if-no-files-found: error
