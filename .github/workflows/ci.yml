name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read
  statuses: write

jobs:
  vendor-srd-spells:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and compact SRD 5.2.1 spell catalog
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            https://raw.githubusercontent.com/howard-branch/ai-dm/a7dcb41743c046e9ab7ceb031c45962f946951ff/assets/srd5_2/spells.json \
            --output /tmp/spells.json
          node - <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('/tmp/spells.json', 'utf8'));
          const compact = Object.values(source.spells).map((spell) => ({
            id: spell.id,
            name: spell.name,
            level: spell.level,
            school: spell.school,
            classes: spell.classes || [],
            time: spell.casting_time?.raw || 'Action',
            ritual: Boolean(spell.casting_time?.ritual),
            range: spell.range,
            concentration: Boolean(spell.duration?.concentration),
            duration: spell.duration?.raw || '',
            components: [spell.components?.v && 'V', spell.components?.s && 'S', spell.components?.m && 'M'].filter(Boolean).join(', '),
            material: spell.components?.material || '',
            damage: spell.damage?.dice || '',
            damageType: spell.damage?.type || '',
            description: spell.description || ''
          })).sort((a,b) => a.level - b.level || a.name.localeCompare(b.name));
          fs.writeFileSync('srd-521-spells-compact.json', JSON.stringify({version:'SRD-5.2.1', count:compact.length, spells:compact}));
          if (compact.length !== 337) throw new Error(`Expected 337 spells, received ${compact.length}`);
          NODE
      - name: Upload compact SRD spell catalog
        uses: actions/upload-artifact@v4
        with:
          name: srd-521-spell-catalog
          path: srd-521-spells-compact.json
          if-no-files-found: error
          retention-days: 1

  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install site dependencies
        run: npm --prefix site install
      - name: Run site unit tests
        run: npm run site:test
      - name: Build site
        run: npm run site:build
      - name: Guard against simulated RAMIE scribe
        run: |
          echo "Checking that the deployed RAMIE AI Scribe is not simulated..."
          if grep -R -n -E "AI Generation Functions \(Placeholders\)|Simulated response" site/dist/apps/dermatology-scribe/index.html; then
            echo "❌ Simulation markers detected in deployed scribe entrypoint"
            exit 1
          fi
          echo "✅ No simulation markers found"
      - name: Upload rheum-derm dashboard payload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rheum-derm-dashboard-payload
          path: site/public/apps/rheum-derm-clinical-trials
          if-no-files-found: error
          retention-days: 1
      - name: Upload built D&D console for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnd-console-built-route
          path: site/dist/tools/dnd-l20-console-f2c7a9
          if-no-files-found: error
          retention-days: 3

  e2e-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install site dependencies
        run: npm --prefix site install
      - name: Install Playwright (Chromium)
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e
        working-directory: site
        run: npx playwright test --reporter=line
      - name: Upload D&D Playwright audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnd-console-playwright-audit
          path: |
            site/test-results/dnd-console-audit
            site/playwright-report
          if-no-files-found: ignore
          retention-days: 3

  ai-scribe-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-scribe/requirements.txt
      - name: Lint (syntax check)
        run: python -m compileall services/ai-scribe
      - name: Run backend tests
        run: python -m pytest services/ai-scribe/tests -q

  report-master-ci-status:
    if: ${{ always() && github.event_name == 'push' }}
    needs:
      - build-site
      - e2e-playwright
      - ai-scribe-lint
    runs-on: ubuntu-latest
    steps:
      - name: Publish combined master CI status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RESULT: ${{ needs.build-site.result }}
          E2E_RESULT: ${{ needs.e2e-playwright.result }}
          SCRIBE_RESULT: ${{ needs.ai-scribe-lint.result }}
        run: |
          set -euo pipefail
          state=failure
          description="Master CI failed"
          if [[ "$BUILD_RESULT" == "success" && "$E2E_RESULT" == "success" && "$SCRIBE_RESULT" == "success" ]]; then
            state=success
            description="Build, Playwright, and scribe checks passed"
          fi
          payload=$(jq -n \
            --arg state "$state" \
            --arg target_url "https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            --arg description "$description" \
            --arg context "ci/master" \
            '{state: $state, target_url: $target_url, description: $description, context: $context}')
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
