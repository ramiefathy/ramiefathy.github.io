name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - name: Install site dependencies
        run: npm --prefix site ci
      - name: Run site unit tests
        run: npm --prefix site test -- --reporter=default --reporter=json --outputFile=unit-results.json
      - name: Audit locked dependencies
        run: npm --prefix site audit --json > site/dependency-audit.json
      - name: Build site
        run: npm run site:build
      - name: Verify direct D&D static build contract
        run: |
          set -euo pipefail
          root=site/dist/tools/dnd-l20-console-f2c7a9
          expected=$(printf '%s\n' app.js data.js icon.svg index.html manifest.webmanifest styles.css sw.js | LC_ALL=C sort)
          actual=$(find "$root" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected D&D static asset set"
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          while IFS= read -r file; do test -s "$root/$file"; done <<< "$expected"
          grep -Fq '<title>Table Ledger — D&amp;D Character Console</title>' "$root/index.html"
          grep -Fq '4.0.0-srd521' "$root/data.js"
          grep -Fq '4.0.1-ci-remediation' "$root/index.html"
          grep -Fq 'Lisa Blesslie' "$root/data.js"
          grep -Fq 'Steph Scurry' "$root/data.js"
          grep -Fq '"count":337' "$root/data.js"
          grep -Fq 'calculateCurrentCharacter' "$root/app.js"
          grep -Fq 'renderDefenses' "$root/app.js"
          grep -Fq 'calculateEncumbrance' "$root/app.js"
          grep -Fq 'renderBuilder' "$root/app.js"
          grep -Fq 'calculateSpellSlots' "$root/app.js"
          grep -Fq 'table-ledger-4.0.1-ci-remediation' "$root/sw.js"
      - name: Guard against simulated RAMIE scribe
        run: |
          if grep -R -n -E "AI Generation Functions \(Placeholders\)|Simulated response" site/dist/apps/dermatology-scribe/index.html; then
            echo "Simulation markers detected in deployed scribe entrypoint"
            exit 1
          fi
      - name: Upload unit and dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-unit-evidence
          path: |
            site/unit-results.json
            site/dependency-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload rheum-derm dashboard payload audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rheum-derm-dashboard-payload
          path: site/public/apps/rheum-derm-clinical-trials
          if-no-files-found: error
          retention-days: 1
      - name: Upload built D&D console for audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dnd-console-built-route
          path: site/dist/tools/dnd-l20-console-f2c7a9
          if-no-files-found: error
          retention-days: 3

  e2e-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - name: Install site dependencies
        run: npm --prefix site ci
      - name: Install Playwright (Chromium)
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e and visual inventory
        working-directory: site
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: browser-results.json
          PHASE7_SCREENSHOTS: '1'
          VISUAL_AUDIT: '1'
          VISUAL_AUDIT_RUN_ID: ci
        run: npx playwright test --reporter=line,json
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-playwright-evidence
          path: |
            site/test-results
            site/browser-results.json
            site/playwright-report
          if-no-files-found: ignore
          retention-days: 3

  ai-scribe-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-scribe/requirements.txt
      - name: Lint
        run: python -m compileall services/ai-scribe
      - name: Run backend tests
        run: python -m pytest services/ai-scribe/tests -q --junitxml=services/ai-scribe/test-results.xml
      - name: Test source-excerpt gate with synthetic failure injection
        run: python -m pytest scripts/tests/test_source_excerpt_gate.py -q --junitxml=scripts/source-gate-results.xml
      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-scribe-test-evidence
          path: |
            services/ai-scribe/test-results.xml
            scripts/source-gate-results.xml
          if-no-files-found: error
          retention-days: 7

  report-master-ci-status:
    if: ${{ always() && github.event_name == 'push' }}
    needs: [build-site, e2e-playwright, ai-scribe-lint]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish combined master CI status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RESULT: ${{ needs.build-site.result }}
          E2E_RESULT: ${{ needs.e2e-playwright.result }}
          SCRIBE_RESULT: ${{ needs.ai-scribe-lint.result }}
        run: |
          set -euo pipefail
          state=failure
          description="Master CI failed"
          if [[ "$BUILD_RESULT" == success && "$E2E_RESULT" == success && "$SCRIBE_RESULT" == success ]]; then
            state=success
            description="Build, Playwright, and scribe checks passed"
          fi
          payload=$(jq -n --arg state "$state" --arg target_url "https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" --arg description "$description" --arg context "ci/master" '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --fail-with-body --silent --show-error --location --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
