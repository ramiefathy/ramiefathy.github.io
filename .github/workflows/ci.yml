name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install site dependencies
        run: npm --prefix site install
      - name: Build site
        run: npm run site:build
      - name: Check CDN Links
        run: |
          echo "Checking CDN URLs used in clinic-scheduler-pro..."
          curl -f --connect-timeout 10 "https://esm.sh/date-fns@2.30.0?bundle" || (echo "❌ date-fns CDN failed" && exit 1)
          curl -f --connect-timeout 10 "https://esm.sh/recharts@2.5.0?bundle" || (echo "❌ recharts CDN failed" && exit 1)
          curl -f --connect-timeout 10 "https://esm.sh/papaparse@5.4.1?bundle" || (echo "❌ papaparse CDN failed" && exit 1)
          curl -f --connect-timeout 10 "https://esm.sh/lucide@0.462.0?bundle" || (echo "❌ lucide CDN failed" && exit 1)
          curl -f --connect-timeout 10 "https://esm.sh/framer-motion@11.0.3?bundle" || (echo "❌ framer-motion CDN failed" && exit 1)
          curl -f --connect-timeout 10 https://cdn.tailwindcss.com || (echo "❌ tailwindcss CDN failed" && exit 1)
          echo "✅ All CDN links verified"
      # Removed Playwright console regression checks; they are run locally as needed

  ai-scribe-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-scribe/requirements.txt
      - name: Lint (syntax check)
        run: python -m compileall services/ai-scribe
