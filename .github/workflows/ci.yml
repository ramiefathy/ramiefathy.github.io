name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  statuses: write

jobs:
  bootstrap-dnd-static:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Expand staged D&D implementation
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.dnd-static-bundle.part*)
          test ${#parts[@]} -gt 0
          cat "${parts[@]}" | base64 --decode > /tmp/dnd-static-bundle.tar.gz
          echo '90ccfd2aed69f10c0d10691c6ab4dd67b4c8f485bd13b43e61950b30c25312bb  /tmp/dnd-static-bundle.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/dnd-static-bundle.tar.gz
          curl --fail-with-body --silent --show-error --location https://raw.githubusercontent.com/howard-branch/ai-dm/a7dcb41743c046e9ab7ceb031c45962f946951ff/assets/srd5_2/spells.json --output /tmp/srd-521-spells.json
          node site/scripts/vendor-dnd-spells.mjs /tmp/srd-521-spells.json tools/dnd-l20-console-f2c7a9/data.js
          rm -f tools/dnd-l20-console-f2c7a9/payload-*.js tools/dnd-l20-console-f2c7a9/boot.js tools/dnd-l20-console-f2c7a9/styles-*.css tools/dnd-l20-console-f2c7a9/app-*.js
          rm -f .dnd-static-bundle.part* .github/workflows/dnd-static-bootstrap.yml
          node --check tools/dnd-l20-console-f2c7a9/data.js
          node --check tools/dnd-l20-console-f2c7a9/app.js
          test "$(find tools/dnd-l20-console-f2c7a9 -maxdepth 1 -type f | wc -l)" -eq 7
          grep -Fq '4.0.0-srd521' tools/dnd-l20-console-f2c7a9/data.js
          grep -Fq '"count":337' tools/dnd-l20-console-f2c7a9/data.js
          ! grep -Rq 'payload-01.js\|DecompressionStream\|window.__DND_PAYLOAD' tools/dnd-l20-console-f2c7a9
          tar -czf /tmp/dnd-final-tree.tar.gz .github/workflows/ci.yml .github/workflows/pages.yml site/scripts/vendor-dnd-spells.mjs site/tests/dnd-console.spec.ts site/src/pages/tools/dnd-l20-console-f2c7a9 tools/dnd-l20-console-f2c7a9
      - name: Upload expanded D&D source tree
        uses: actions/upload-artifact@v4
        with:
          name: dnd-static-final-tree
          path: /tmp/dnd-final-tree.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install site dependencies
        run: npm --prefix site install
      - name: Run site unit tests
        run: npm run site:test
      - name: Build site
        run: npm run site:build
      - name: Verify direct D&D static build contract
        run: |
          set -euo pipefail
          root=site/dist/tools/dnd-l20-console-f2c7a9
          for file in index.html styles.css data.js app.js manifest.webmanifest icon.svg sw.js; do
            test -s "$root/$file"
          done
          ! find "$root" -maxdepth 1 -type f \( -name 'payload-*' -o -name 'boot.js' \) | grep -q .
          grep -Fq '4.0.0-srd521' "$root/data.js"
          grep -Fq 'Lisa Blesslie' "$root/data.js"
          grep -Fq 'Steph Scurry' "$root/data.js"
          grep -Fq '"count":337' "$root/data.js"
          grep -Fq 'calculateCurrentCharacter' "$root/app.js"
          grep -Fq 'renderDefenses' "$root/app.js"
          grep -Fq 'calculateEncumbrance' "$root/app.js"
          grep -Fq 'renderBuilder' "$root/app.js"
          grep -Fq 'calculateSpellSlots' "$root/app.js"
      - name: Guard against simulated RAMIE scribe
        run: |
          if grep -R -n -E "AI Generation Functions \(Placeholders\)|Simulated response" site/dist/apps/dermatology-scribe/index.html; then
            echo "Simulation markers detected in deployed scribe entrypoint"
            exit 1
          fi
      - name: Upload rheum-derm dashboard payload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rheum-derm-dashboard-payload
          path: site/public/apps/rheum-derm-clinical-trials
          if-no-files-found: error
          retention-days: 1
      - name: Upload built D&D console for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnd-console-built-route
          path: site/dist/tools/dnd-l20-console-f2c7a9
          if-no-files-found: error
          retention-days: 3

  e2e-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install site dependencies
        run: npm --prefix site install
      - name: Install Playwright (Chromium)
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e
        working-directory: site
        run: npx playwright test --reporter=line
      - name: Upload D&D Playwright audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnd-console-playwright-audit
          path: |
            site/test-results/dnd-console-audit
            site/playwright-report
          if-no-files-found: ignore
          retention-days: 3

  ai-scribe-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-scribe/requirements.txt
      - name: Lint
        run: python -m compileall services/ai-scribe
      - name: Run backend tests
        run: python -m pytest services/ai-scribe/tests -q

  report-master-ci-status:
    if: ${{ always() && github.event_name == 'push' }}
    needs: [build-site, e2e-playwright, ai-scribe-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Publish combined master CI status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RESULT: ${{ needs.build-site.result }}
          E2E_RESULT: ${{ needs.e2e-playwright.result }}
          SCRIBE_RESULT: ${{ needs.ai-scribe-lint.result }}
        run: |
          set -euo pipefail
          state=failure
          description="Master CI failed"
          if [[ "$BUILD_RESULT" == success && "$E2E_RESULT" == success && "$SCRIBE_RESULT" == success ]]; then
            state=success
            description="Build, Playwright, and scribe checks passed"
          fi
          payload=$(jq -n --arg state "$state" --arg target_url "https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" --arg description "$description" --arg context "ci/master" '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --fail-with-body --silent --show-error --location --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
