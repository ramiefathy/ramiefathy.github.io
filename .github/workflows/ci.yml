name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install site dependencies
        run: npm --prefix site install
      - name: Install Playwright (Chromium)
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e (smoke)
        working-directory: site
        run: npm run test:e2e
      - name: Build site
        run: npm run site:build
      - name: Guard against simulated RAMIE scribe
        run: |
          echo "Checking that the deployed RAMIE AI Scribe is not simulated..."
          if grep -R -n -E "AI Generation Functions \\(Placeholders\\)|Simulated response" site/dist/apps/dermatology-scribe/index.html; then
            echo "❌ Simulation markers detected in deployed scribe entrypoint"
            exit 1
          fi
          echo "✅ No simulation markers found"
      # Removed Playwright console regression checks; they are run locally as needed

  ai-scribe-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-scribe/requirements.txt
      - name: Lint (syntax check)
        run: python -m compileall services/ai-scribe
      - name: Run backend tests
        run: python -m pytest services/ai-scribe/tests -q
