name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install site dependencies
        run: npm --prefix site install
      - name: Build site
        run: npm run site:build
      - name: Check CDN Links
        run: |
          echo "Checking CDN URLs used in clinic-scheduler-pro..."
          curl -f --connect-timeout 10 "https://esm.sh/react-hot-toast@2.4.1?bundle" || (echo "❌ react-hot-toast CDN failed" && exit 1)
          curl -f --connect-timeout 10 "https://esm.sh/date-fns@2.30.0?bundle" || (echo "❌ date-fns CDN failed" && exit 1)
          curl -f --connect-timeout 10 "https://esm.sh/recharts@2.5.0?bundle" || (echo "❌ recharts CDN failed" && exit 1)
          curl -f --connect-timeout 10 "https://esm.sh/papaparse@5.4.1?bundle" || (echo "❌ papaparse CDN failed" && exit 1)
          curl -f --connect-timeout 10 "https://esm.sh/lucide@0.462.0?bundle" || (echo "❌ lucide CDN failed" && exit 1)
          curl -f --connect-timeout 10 https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/tailwind.min.css || (echo "❌ tailwindcss CDN failed" && exit 1)
          echo "✅ All CDN links verified"
      - name: Install Playwright
        run: npm install @playwright/test
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Test for Console Errors
        run: npx playwright test tests/console-errors.spec.js --reporter=line

  ai-scribe-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-scribe/requirements.txt
      - name: Lint (syntax check)
        run: python -m compileall services/ai-scribe
