name: Atlas primary-source excerpt verification

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/atlas-source-excerpts.yml'
      - 'scripts/verify-vasculitis-source-excerpts.py'
      - 'scripts/tests/test_source_excerpt_gate.py'
      - 'site/public/apps/rheum-derm-immune-atlas/explorer/vasculitis-evidence.js'
      - 'site/public/apps/rheum-derm-immune-atlas/explorer/connective-tissue-evidence.js'
  push:
    branches: [master]
    paths:
      - '.github/workflows/atlas-source-excerpts.yml'
      - 'scripts/verify-vasculitis-source-excerpts.py'
      - 'scripts/tests/test_source_excerpt_gate.py'
      - 'site/public/apps/rheum-derm-immune-atlas/explorer/vasculitis-evidence.js'
      - 'site/public/apps/rheum-derm-immune-atlas/explorer/connective-tissue-evidence.js'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        packet: [vasculitis, connective-tissue]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exercise source-gate failure contracts
        run: python -m unittest discover -s scripts/tests -p 'test_source_excerpt_gate.py' -v
      - name: Verify current PubMed identities and literal short excerpts
        env:
          PACKET: ${{ matrix.packet }}
        run: |
          mkdir -p source-receipts
          git rev-parse HEAD > source-receipts/TESTED_COMMIT.txt
          python scripts/verify-vasculitis-source-excerpts.py --packet "$PACKET" --receipt "source-receipts/$PACKET.json"
      - name: Retain bounded source-verification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-source-excerpts-${{ matrix.packet }}
          path: source-receipts
          if-no-files-found: error
          retention-days: 7
