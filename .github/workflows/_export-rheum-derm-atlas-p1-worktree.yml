name: Export Rheum-Derm Atlas P1 worktree

on:
  push:
    branches:
      - fix/rheum-derm-atlas-p0-integrity

permissions:
  contents: read
  issues: write

jobs:
  export:
    if: ${{ contains(github.event.head_commit.message, '[p1-export]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          lfs: true
          persist-credentials: false
      - name: Package exact checked-out worktree
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=test-results \
            --exclude=playwright-report \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf /tmp/ramiefathy-github-io-p1-worktree.tar.gz .
          sha256sum /tmp/ramiefathy-github-io-p1-worktree.tar.gz | tee /tmp/ramiefathy-github-io-p1-worktree.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rheum-derm-atlas-p1-worktree-${{ github.run_id }}
          path: |
            /tmp/ramiefathy-github-io-p1-worktree.tar.gz
            /tmp/ramiefathy-github-io-p1-worktree.sha256
          if-no-files-found: error
          retention-days: 3
      - name: Publish export receipt to PR 175
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest="$(cut -d' ' -f1 /tmp/ramiefathy-github-io-p1-worktree.sha256)"
          jq -n \
            --arg body "P1 worktree export complete: run ${GITHUB_RUN_ID}; artifact \`rheum-derm-atlas-p1-worktree-${GITHUB_RUN_ID}\`; source \`${GITHUB_SHA}\`; tar.gz SHA-256 \`${digest}\`." \
            '{body: $body}' > /tmp/comment.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/175/comments" \
            --data-binary @/tmp/comment.json
