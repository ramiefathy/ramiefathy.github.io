name: One-time RAMIE research boundary hook

on:
  push:
    branches:
      - codex/portfolio-quality-remediation-20260806
    paths:
      - .github/workflows/codex-one-time-ramie-boundary-hook.yml

permissions:
  contents: write

jobs:
  hook:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: codex/portfolio-quality-remediation-20260806
          persist-credentials: true

      - name: Insert source-controlled preflight script
        shell: python
        run: |
          from pathlib import Path

          path = Path('site/public/apps/dermatology-scribe/index.html')
          source = path.read_text()
          old = '    <script src="ui-enhancements.js" defer></script>\n    <script src="app.js" defer></script>'
          new = '    <script src="research-boundary.js" defer></script>\n    <script src="ui-enhancements.js" defer></script>\n    <script src="app.js" defer></script>'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected one RAMIE script insertion point; found {count}')
          source = source.replace(old, new)
          path.write_text(source)

      - name: Verify public entrypoint markers
        run: |
          set -euo pipefail
          grep -Fq '<script src="research-boundary.js" defer></script>' site/public/apps/dermatology-scribe/index.html
          grep -Fq 'Research prototype' site/public/apps/dermatology-scribe/research-boundary.js
          grep -Fq 'public demo is not approved for PHI' site/public/apps/dermatology-scribe/research-boundary.js

      - name: Commit entrypoint hook
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/public/apps/dermatology-scribe/index.html
          git commit -m 'feat(ramie): require session data-flow preflight'
          git push origin HEAD:codex/portfolio-quality-remediation-20260806
