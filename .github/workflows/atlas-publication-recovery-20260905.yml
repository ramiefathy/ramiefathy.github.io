name: Recover staged Atlas publication

on:
  push:
    branches: [audit/atlas-publish-staging-20260905]
    paths: [.github/workflows/atlas-publication-recovery-20260905.yml]

permissions:
  contents: read

concurrency:
  group: atlas-publication-recovery
  cancel-in-progress: false

jobs:
  recover-and-verify:
    if: github.ref == 'refs/heads/audit/atlas-publish-staging-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE: fe42b9d2ae5695f853d0f360ac60f665bed1e5f4
      STAGED: f72a3425905bb9c6c8a580d0298be035be1529a4
      RELEASE_BRANCH: audit/atlas-clinical-review-recovered-20260905
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f72a3425905bb9c6c8a580d0298be035be1529a4
          persist-credentials: false
          path: staged
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fe42b9d2ae5695f853d0f360ac60f665bed1e5f4
          persist-credentials: false
          lfs: true
          path: release
      - name: Recover only a complete, hash-verified source delta
        run: |
          mkdir -p /tmp/atlas-recovery
          python - <<'PY'
          import base64, gzip, hashlib, json, lzma, os, pathlib, re, subprocess
          staged=pathlib.Path('staged').resolve(); root=pathlib.Path('release').resolve()
          receipt=pathlib.Path('/tmp/atlas-recovery')
          sha=lambda b: hashlib.sha256(b).hexdigest()
          groups={}
          for path in staged.rglob('*.b64'):
              if '.git' in path.parts: continue
              match=re.fullmatch(r'(.*?)(\d+)\.b64',path.name)
              if match: groups.setdefault((path.parent,match[1]),[]).append((int(match[2]),path))
          diagnostics=[]; candidates=[]
          for (parent,prefix),parts in groups.items():
              parts.sort(); info={'directory':str(parent.relative_to(staged)),'prefix':prefix,'parts':[p.name for _,p in parts]}
              try:
                  indexes=[i for i,_ in parts]
                  if indexes != list(range(indexes[0],indexes[0]+len(indexes))): raise ValueError('Noncontiguous transfer parts')
                  encoded=''.join(p.read_text().strip() for _,p in parts)
                  compressed=base64.b64decode(encoded,validate=True)
                  if compressed.startswith(b'\xfd7zXZ\x00'):
                      decoder=lzma.LZMADecompressor(); raw=decoder.decompress(compressed)
                      if not decoder.eof or decoder.unused_data: raise ValueError('Incomplete or concatenated XZ transfer')
                  elif compressed.startswith(b'\x1f\x8b'):
                      raw=gzip.decompress(compressed)
                  else: raise ValueError('Unknown transfer compression')
                  document=json.loads(raw)
                  entries=document if isinstance(document,list) else document.get('files',document.get('changes'))
                  if not isinstance(entries,list) or not entries: raise ValueError('Missing source-entry array')
                  if not all(isinstance(e,dict) and 'path' in e and 'before' in e and 'after' in e for e in entries):
                      raise ValueError('Unsupported delta format: every entry must have path/before/after')
                  info.update(status='complete',payload_sha256=sha(raw),entries=len(entries))
                  candidates.append((entries,info))
              except Exception as exc:
                  info.update(status='not_recovered',error=f'{type(exc).__name__}: {exc}')
              diagnostics.append(info)
          (receipt/'transfer-diagnostics.json').write_text(json.dumps(diagnostics,indent=2)+'\n')
          if len(candidates)!=1: raise SystemExit(f'Expected exactly one complete source delta; found {len(candidates)}. No source published.')
          entries,transfer=candidates[0]; prepared=[]; seen=set()
          for item in entries:
              name=item['path']; rel=pathlib.PurePosixPath(name)
              if rel.is_absolute() or '..' in rel.parts or str(rel)!=name or not rel.parts or rel.parts[0] not in {'site','docs','services'}:
                  raise ValueError(f'Disallowed source path: {name!r}')
              if name in seen: raise ValueError(f'Duplicate source path: {name}')
              seen.add(name); path=root/rel
              if any(part.is_symlink() for part in [path,*path.parents] if part!=root.parent):
                  raise ValueError(f'Symlink in source path: {name}')
              if any(part in {'.git','node_modules','.env'} for part in rel.parts): raise ValueError(f'Forbidden generated/secret path: {name}')
              old=path.read_bytes() if path.exists() else b''
              if (sha(old) if path.exists() else None)!=item['before']: raise ValueError(f'Base checksum mismatch: {name}')
              if 'ops' in item:
                  text=old.decode('utf-8'); end=0
                  for operation in item['ops']:
                      a,b,new=operation
                      if not isinstance(a,int) or not isinstance(b,int) or not isinstance(new,str) or not end<=a<=b<=len(text):
                          raise ValueError(f'Invalid text operations: {name}')
                      end=b
                  for a,b,new in reversed(item['ops']): text=text[:a]+new+text[b:]
                  content=text.encode('utf-8')
              elif isinstance(item.get('content'),str) and item.get('encoding','utf-8')=='utf-8':
                  content=item['content'].encode('utf-8')
              else: raise ValueError(f'Unsupported source representation: {name}')
              if sha(content)!=item['after']: raise ValueError(f'Result checksum mismatch: {name}')
              prepared.append((path,content,name,item['after']))
          required={'site/public/apps/rheum-derm-immune-atlas/index.html','site/public/apps/dermatotarget-atlas/app.js'}
          if not required<=seen: raise ValueError('The recovered delta does not include both Atlas applications')
          for path,content,_,_ in prepared:
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(content)
          subprocess.run(['git','-C',str(root),'add','--',*[name for _,_,name,_ in prepared]],check=True)
          subprocess.run(['git','-C',str(root),'diff','--cached','--check'],check=True)
          manifest={'base':os.environ['BASE'],'staged':os.environ['STAGED'],'transfer':transfer,'files':[{'path':name,'sha256':digest,'bytes':len(content)} for _,content,name,digest in prepared]}
          (receipt/'recovered-source-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(f'Recovered {len(prepared)} files. Every base and result hash matched.')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: release/.nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Locked install and complete unit suite
        working-directory: release
        run: |
          npm --prefix site ci
          npm --prefix site test -- --reporter=default --reporter=json --outputFile=unit-results.json
          npm --prefix site audit --json > site/dependency-audit.json
      - name: Backend regression suite
        working-directory: release
        run: |
          pip install -r services/ai-scribe/requirements.txt
          python -m pytest services/ai-scribe/tests -q --junitxml=services/ai-scribe/test-results.xml
      - name: Production build
        working-directory: release
        run: npm run site:build
      - name: Browser installation
        working-directory: release/site
        run: npx playwright install --with-deps chromium
      - name: Complete browser suite and visual inventory
        working-directory: release/site
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: browser-results.json
          PHASE7_SCREENSHOTS: '1'
          VISUAL_AUDIT: '1'
          VISUAL_AUDIT_RUN_ID: atlas-recovery
        run: npx playwright test --reporter=line,json
      - name: Verify the staged source is unchanged by build/test assembly
        working-directory: release
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          manifest=json.load(open('/tmp/atlas-recovery/recovered-source-manifest.json'))
          for item in manifest['files']:
              staged=subprocess.check_output(['git','show',':'+item['path']])
              assert hashlib.sha256(staged).hexdigest()==item['sha256'],item['path']
          PY
          git diff --cached --check
      - name: Publish an isolated clean branch and review PR
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/audit/atlas-publish-staging-20260905
          test "$(git rev-parse HEAD)" = "$BASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'agent(codex): publish verified clinical corrections and Atlas evidence interfaces'
          git rev-parse HEAD > /tmp/atlas-recovery/PUBLISHED_COMMIT.txt
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          cat > /tmp/atlas-recovery/pr-body.md <<'EOF'
          ## Scope
          Recover the previously prepared clinical source corrections and both Atlas evidence interfaces from a complete checksum-verified transfer. This branch is based on PR #184 and includes its unmerged prerequisite changes when compared with master. PR #175 remains a separate integration workstream unless explicitly represented by the recovered source.

          ## Verification
          Publication was gated on every source before/after checksum, a clean locked npm install, unit tests, npm audit, backend tests, production build, and the complete Chromium suite with visual inventory enabled. The attached workflow artifact contains the source manifest and raw reports. Screenshot capture is not a claim of manual visual approval. The PR's normal CI must also be inspected before merge.

          ## Evidence boundaries
          This is not exhaustive clinical validation of every monograph, node, or mapping. The current association recapture remains separate from historical scores. A pair not returned by a query is not a negative association; an association does not establish therapeutic direction or indication-specific efficacy. Quarantined records must remain excluded from active efficacy inference. No merge or production deployment is performed by this workflow.
          EOF
          printf '\nRecovered commit: `%s`\nRecovery run: %s/%s/actions/runs/%s\n' "$(git rev-parse HEAD)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> /tmp/atlas-recovery/pr-body.md
          gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$RELEASE_BRANCH" --draft --title 'Clinical-source corrections and Atlas evidence interfaces' --body-file /tmp/atlas-recovery/pr-body.md | tee /tmp/atlas-recovery/PR_URL.txt
      - name: Preserve recovery diagnostics and test reports
        if: always()
        run: |
          mkdir -p /tmp/atlas-recovery/reports
          for file in release/site/unit-results.json release/site/dependency-audit.json release/site/browser-results.json release/services/ai-scribe/test-results.xml; do
            if test -f "$file"; then cp "$file" /tmp/atlas-recovery/reports/; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atlas-publication-recovery-evidence
          path: |
            /tmp/atlas-recovery
            release/site/test-results
          if-no-files-found: error
          retention-days: 7
