name: Atlas integration inputs
on:
  push:
    branches: [audit/atlas-publish-staging-20260905]
    paths: [.github/workflows/atlas-integration-inputs.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 02ca13167576e48d54a82c9a0811703b71ae06be
          persist-credentials: false
          lfs: true
      - name: Capture source and cross-branch diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/atlas-inputs
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' fetch --no-tags --depth=1 origin a0a9394a4a073a92f4b57d6b83cb692241d7bce0 78d89be4b75ffa4ddb72563dffe6ed2c734f8eb6
          git diff --binary 78d89be4b75ffa4ddb72563dffe6ed2c734f8eb6 a0a9394a4a073a92f4b57d6b83cb692241d7bce0 > /tmp/atlas-inputs/pr175.patch
          git diff --name-only 78d89be4b75ffa4ddb72563dffe6ed2c734f8eb6 a0a9394a4a073a92f4b57d6b83cb692241d7bce0 > /tmp/atlas-inputs/pr175-files.txt
          git archive a0a9394a4a073a92f4b57d6b83cb692241d7bce0 $(cat /tmp/atlas-inputs/pr175-files.txt) | gzip > /tmp/atlas-inputs/pr175.tar.gz
          git show 78d89be4b75ffa4ddb72563dffe6ed2c734f8eb6:site/public/apps/rheum-derm-immune-atlas/index.html > /tmp/atlas-inputs/pr175-base-index.html
          git ls-tree -rz HEAD > /tmp/atlas-inputs/pr186-tree.bin
          git show HEAD:site/public/apps/rheum-derm-immune-atlas/index.html > /tmp/atlas-inputs/pr186-index.html
          git rev-parse HEAD > /tmp/atlas-inputs/HEAD.txt
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/atlas-inputs')
          rows=[{'file':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for p in sorted(root.iterdir())]
          (root/'manifest.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-integration-inputs
          path: /tmp/atlas-inputs
          if-no-files-found: error
          retention-days: 7
