name: Apply verified clinical audit
on:
  push:
    branches: [audit/clinical-apps-20260904]
    paths: [.github/workflows/apply-clinical-audit.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/audit/clinical-apps-20260904'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate and apply exact source bytes
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,pathlib,subprocess
          parts=[pathlib.Path(f'.audit-transfer/part{i}.b64').read_text().strip() for i in range(3)]
          corrections=[(0,'735328e2d3038718b58e45b23c1b350fccc8212ccdec03c4b6fec5f1b4228349',4379,'0'),(1,'6f53d532cecfc862d4abc34e221ccce92d1c9ff27d098cd1f19f598c074ac6a1',1019,'/')]
          for index,before,offset,value in corrections:
              assert hashlib.sha256(parts[index].encode()).hexdigest()==before
              parts[index]=parts[index][:offset]+value+parts[index][offset:]
          raw=gzip.decompress(base64.b64decode(''.join(parts),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='5f46a946cb23927137fa1c868159ef55373eb36dd62c30f15b8e07b59c6ecbbc','Transfer checksum mismatch'
          staged=[]
          for item in json.loads(raw):
              path=pathlib.Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] in ('.github','docs','services','site')
              assert not path.is_symlink()
              old=path.read_bytes() if path.exists() else b''
              assert (hashlib.sha256(old).hexdigest() if path.exists() else None)==item['before'],f'Base mismatch: {path}'
              text=old.decode('utf-8')
              end=0
              for a,b,new in item['ops']:
                  assert end<=a<=b<=len(text)
                  end=b
              for a,b,new in reversed(item['ops']): text=text[:a]+new+text[b:]
              content=text.encode('utf-8')
              assert hashlib.sha256(content).hexdigest()==item['after'],f'Result mismatch: {path}'
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(content)
              if path.parts[0]!='.github': staged.append(str(path))
              print(str(path),item['after'])
          subprocess.run(['git','add','--',*staged],check=True)
          PY
          git diff --cached --check
      - name: Publish only the audited source to the isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/audit/clinical-apps-20260904
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'agent(codex): harden clinical references, encounter isolation, exports, and evidence integrity'
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:refs/heads/audit/clinical-apps-20260904
