name: Repair audit lock reproducibility
on:
  push:
    branches: [audit/clinical-apps-20260904]
    paths: [.github/workflows/repair-audit-lock.yml]
permissions:
  contents: read
jobs:
  repair:
    if: github.ref == 'refs/heads/audit/clinical-apps-20260904'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: audit/clinical-reference-safety-20260904
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Resolve complete cross-platform lock and prove a clean install
        run: |
          mkdir -p /tmp/lock-receipt
          node --version > /tmp/lock-receipt/runtime.txt
          npm --version >> /tmp/lock-receipt/runtime.txt
          git rev-parse HEAD > /tmp/lock-receipt/before.txt
          npm --prefix site install --package-lock-only --ignore-scripts
          npm --prefix site ci
          npm --prefix site audit --json > /tmp/lock-receipt/dependency-audit.json
          git diff --check
          git diff -- site/package-lock.json > /tmp/lock-receipt/lock.patch
      - name: Commit only the validated lock correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/audit/clinical-apps-20260904
          test "$(git branch --show-current)" = audit/clinical-reference-safety-20260904
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/package-lock.json
          git commit -m 'agent(codex): complete optional dependency lock for clean npm ci installs'
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:refs/heads/audit/clinical-reference-safety-20260904
          git rev-parse HEAD > /tmp/lock-receipt/COMMIT.txt
      - name: Preserve exact dependency evidence
        if: always()
        run: |
          mkdir -p /tmp/lock-receipt
          cp site/package-lock.json /tmp/lock-receipt/
          cp -r "$HOME/.npm/_logs" /tmp/lock-receipt/ || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: clean-install-lock-receipt
          path: /tmp/lock-receipt
          if-no-files-found: error
          retention-days: 3
