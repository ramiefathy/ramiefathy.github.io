name: Verify Atlas context and primary trial scope
on:
  push:
    branches: [audit/atlas-publish-staging-20260905]
    paths: [.github/workflows/atlas-context-trials-verify.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/audit/atlas-publish-staging-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preserve submitted source delta
        run: |
          mkdir -p /tmp/atlas-context-receipt
          cp .atlas-session/part*.b64 /tmp/atlas-context-receipt/
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: audit/clinical-atlas-review-20260905
          lfs: true
          persist-credentials: false
      - name: Materialize cached LFS objects after the second checkout
        run: |
          git lfs checkout
          git lfs fsck
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path.cwd(); rows=[]
          for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              if not name or pathlib.Path(name).suffix.lower() not in {'.pdf','.mp3','.mp4'}:continue
              pointer=subprocess.check_output(['git','show','HEAD:'+name])
              if not pointer.startswith(b'version https://git-lfs.github.com/spec/v1'):continue
              fields=dict(line.split(' ',1) for line in pointer.decode().splitlines())
              content=(root/name).read_bytes();expected=fields['oid'].removeprefix('sha256:')
              assert hashlib.sha256(content).hexdigest()==expected and len(content)==int(fields['size']),name
              rows.append({'path':name,'bytes':len(content),'sha256':expected})
          assert rows
          pdf=root/'site/public/apps/dermatotarget-atlas/publication_pdf/DermatoTarget_Atlas_publication_package_2026-06-03.pdf'
          assert pdf.read_bytes().startswith(b'%PDF')
          pathlib.Path('/tmp/atlas-context-receipt/lfs-materialization.json').write_text(json.dumps(rows,indent=2)+'\n')
          print('Verified materialized LFS files:',len(rows))
          PY
      - name: Validate exact source base and reconstruction
        run: |
          test "$(git rev-parse HEAD)" = 23f64f6fc54ada0c9487437ea4a79756f1a3bf3f
          python - <<'PY'
          import pathlib,base64,gzip,hashlib,json,subprocess
          receipt=pathlib.Path('/tmp/atlas-context-receipt')
          encoded=''.join((receipt/f'part{i}.b64').read_text().strip() for i in range(2))
          # Correct one transport transcription; the original full hash remains required.
          encoded=encoded.replace('CSOYUU/s5','CSOYU/s5',1)
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='c312aef3a8a39ba39c3a8fab3cc090aa3eebddef86114bccdbe07cf759bf8fad'
          items=json.loads(raw); assert len(items)==15
          prepared=[]; seen=set()
          for item in items:
              path=pathlib.Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] in ('docs','site','scripts')
              assert str(path) not in seen and not path.is_symlink(); seen.add(str(path))
              old=path.read_bytes() if path.exists() else b''
              assert (hashlib.sha256(old).hexdigest() if path.exists() else None)==item['before'],f'Base mismatch: {path}'
              text=old.decode('utf-8');end=0
              for a,b,new in item['ops']:
                  assert end<=a<=b<=len(text);end=b
              for a,b,new in reversed(item['ops']):text=text[:a]+new+text[b:]
              content=text.encode('utf-8');assert hashlib.sha256(content).hexdigest()==item['after'],f'Result mismatch: {path}'
              prepared.append((path,content))
          for path,content in prepared:path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(content)
          subprocess.run(['git','add','-f','--',*[str(p) for p,c in prepared]],check=True)
          (receipt/'source-manifest.json').write_text(json.dumps({'base':'23f64f6fc54ada0c9487437ea4a79756f1a3bf3f','files':[{k:v for k,v in item.items() if k!='ops'} for item in items]},indent=2)+'\n')
          print('All 15 exact source reconstructions verified.')
          PY
          git diff --cached --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Locked dependencies, unit suite, and audit
        run: |
          npm --prefix site ci
          npm --prefix site test -- --reporter=json --outputFile=/tmp/atlas-context-receipt/unit-results.json
          npm --prefix site audit --json > /tmp/atlas-context-receipt/dependency-audit.json
          pip install -r services/ai-scribe/requirements.txt
          python -m pytest services/ai-scribe/tests -q --junitxml=/tmp/atlas-context-receipt/backend-results.xml
          python -m pytest scripts/tests/test_source_excerpt_gate.py -q --junitxml=/tmp/atlas-context-receipt/source-gate-results.xml
      - name: Verify current primary-source identities and excerpts
        run: |
          python scripts/verify-vasculitis-source-excerpts.py --packet connective-tissue --receipt /tmp/atlas-context-receipt/connective-tissue-live.json
          python scripts/verify-vasculitis-source-excerpts.py --packet vasculitis --receipt /tmp/atlas-context-receipt/vasculitis-live.json
      - name: Build and install Chromium
        run: |
          npm run site:build
          cd site
          npx playwright install --with-deps chromium
      - name: Complete Chromium and visual inventory
        working-directory: site
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: /tmp/atlas-context-receipt/browser-results.json
          PHASE7_SCREENSHOTS: '1'
          VISUAL_AUDIT: '1'
          VISUAL_AUDIT_RUN_ID: atlas-context
        run: npx playwright test --reporter=line,json
      - name: Commit only the exact reviewed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/audit/atlas-publish-staging-20260905
          test "$(git rev-parse HEAD)" = 23f64f6fc54ada0c9487437ea4a79756f1a3bf3f
          python - <<'PY'
          import hashlib,json,subprocess
          for item in json.load(open('/tmp/atlas-context-receipt/source-manifest.json'))['files']:
              raw=subprocess.check_output(['git','show',':'+item['path']])
              assert hashlib.sha256(raw).hexdigest()==item['after'],item['path']
          PY
          git diff --cached --check
          git diff --cached > /tmp/atlas-context-receipt/staged-source.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'agent(codex): preserve indication navigation and qualify primary-trial evidence'
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:refs/heads/audit/clinical-atlas-review-20260905
          git rev-parse HEAD > /tmp/atlas-context-receipt/COMMIT.txt
      - name: Preserve source patch on verification failure
        if: failure()
        run: git diff --cached > /tmp/atlas-context-receipt/staged-source.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atlas-context-trials-verification
          path: |
            /tmp/atlas-context-receipt
            site/test-results
          if-no-files-found: error
          retention-days: 7
