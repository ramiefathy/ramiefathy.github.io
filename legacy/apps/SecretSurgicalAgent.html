<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derm Ops: Mission Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #0c1427;
            background-image:
                radial-gradient(at 27% 37%, hsla(215, 98%, 43%, 0.1) 0px, transparent 50%),
                radial-gradient(at 97% 21%, hsla(125, 98%, 43%, 0.1) 0px, transparent 50%),
                radial-gradient(at 52% 99%, hsla(355, 98%, 43%, 0.1) 0px, transparent 50%),
                radial-gradient(at 10% 29%, hsla(256, 96%, 43%, 0.1) 0px, transparent 50%),
                radial-gradient(at 97% 96%, hsla(38, 60%, 74%, 0.1) 0px, transparent 50%),
                radial-gradient(at 33% 50%, hsla(222, 67%, 73%, 0.1) 0px, transparent 50%),
                radial-gradient(at 79% 53%, hsla(343, 68%, 79%, 0.1) 0px, transparent 50%);
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .glass-panel {
            background: rgba(18, 26, 51, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .btn-glow { box-shadow: 0 0 5px #0ea5e9, 0 0 10px #0ea5e9; }
        .option-btn:hover, .mission-btn:hover {
            background-color: #1e40af;
            transform: translateY(-2px);
            box-shadow: 0 0 8px #38bdf8, 0 0 12px #38bdf8;
        }
        .modal-enter { opacity: 0; transform: scale(0.9); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: all 300ms ease-out; }
        .modal-leave { opacity: 1; transform: scale(1); }
        .modal-leave-active { opacity: 0; transform: scale(0.9); transition: all 300ms ease-in; }
    </style>
</head>
<body class="text-gray-200 flex items-center justify-center min-h-screen p-4">
    <div id="app" class="w-full max-w-5xl mx-auto">
        <!-- Mission Selection Screen -->
        <div id="mission-selection-screen" class="text-center glass-panel p-8 rounded-2xl">
            <h1 class="font-orbitron text-4xl md:text-5xl font-bold text-sky-300 mb-4">MISSION TERMINAL</h1>
            <p class="text-lg mb-8 max-w-2xl mx-auto">Select your training module, Agent. Each dossier contains critical intelligence. Master them all.</p>
            <div id="mission-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
        <!-- Game Screen -->
        <div id="game-screen" class="hidden">
            <div class="glass-panel p-6 md:p-8 rounded-2xl">
                <div class="flex justify-between items-center mb-2">
                    <h2 id="mission-title" class="font-orbitron text-xl md:text-2xl text-sky-300"></h2>
                    <button id="back-to-missions-btn" class="text-sky-400 hover:text-sky-200 transition-colors">&larr; Back to Terminal</button>
                </div>
                <div class="flex justify-between items-center mb-6">
                    <p class="text-lg">Mission <span id="mission-number"></span></p>
                    <div class="text-right">
                        <p class="text-sm text-gray-400">Progress</p>
                        <p class="font-orbitron text-lg"><span id="current-progress">0</span> / <span id="total-missions"></span></p>
                    </div>
                </div>
                <div class="w-full bg-gray-700 rounded-full h-2.5 mb-6">
                    <div id="progress-bar" class="bg-sky-400 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <div class="bg-black bg-opacity-20 p-6 rounded-lg mb-6 border border-sky-800 min-h-[10rem] flex items-center">
                    <p id="question-text" class="text-lg md:text-xl font-semibold leading-relaxed"></p>
                </div>
                <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </div>
        <!-- Final Screen -->
        <div id="final-screen" class="hidden text-center glass-panel p-8 rounded-2xl">
            <svg class="w-24 h-24 mx-auto mb-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
            <h1 class="font-orbitron text-4xl md:text-5xl font-bold text-green-300 mb-4">DOSSIER COMPLETE</h1>
            <p class="text-lg mb-8 max-w-2xl mx-auto">Congratulations, Agent. You have successfully mastered this dossier. Return to the terminal to select a new training module.</p>
            <button id="restart-btn" class="bg-sky-500 text-white font-bold py-3 px-8 rounded-lg text-xl font-orbitron transition-all duration-300 hover:bg-sky-400 btn-glow">RETURN TO TERMINAL</button>
        </div>
    </div>
    <!-- Debriefing Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50 hidden modal-enter">
        <div id="modal-content" class="glass-panel p-8 rounded-2xl w-full max-w-2xl text-center">
            <h2 id="modal-title" class="font-orbitron text-3xl font-bold mb-4"></h2>
            <div id="modal-icon" class="w-16 h-16 mx-auto mb-4"></div>
            <p id="modal-text" class="text-lg leading-relaxed mb-6 text-left"></p>
            <button id="modal-btn" class="bg-sky-500 text-white font-bold py-2 px-6 rounded-lg text-lg font-orbitron transition-all duration-300 hover:bg-sky-400 btn-glow">PROCEED</button>
        </div>
    </div>
    <!-- Combined Questions Data -->
    <script type="module">
        document.addEventListener('DOMContentLoaded', async () => {
         const questions = {
  electrosurgery: {
    title: "Electrosurgery",
    questions: [ 
      { question: "You need to achieve hemostasis in a patient with a pacemaker. To avoid electromagnetic interference, you opt for a device that uses a heated element to transfer thermal energy directly to the tissue without passing current through the patient. What is this modality called?", options: ["Electrodesiccation", "Electrocoagulation", "Electrocautery", "Electrosection"], correctAnswer: 2, correctDebriefing: "The correct and safe choice, Agent. **Electrocautery** is the indicated modality here. It uses a direct current to heat a wire tip, which then physically burns the tissue. No alternating current passes through the patient, so there is no electromagnetic field to interfere with a pacemaker or AICD.", incorrectDebriefing: "That is a dangerous choice, Agent. All other options are forms of electrosurgery, which pass a high-frequency alternating current through the patient, creating an electromagnetic field. The only modality that uses direct thermal transfer without patient current is **Electrocautery**, making it the safest for patients with cardiac devices."},
      { question: "An operative needs to perform a clean cut through tissue with minimal peripheral heat damage or coagulation. Which electrosurgical mode, characterized by a pure, undamped sine wave, is designed for this purpose?", options: ["Electrodesiccation", "Electrofulguration", "Electrocoagulation", "Electrosection"], correctAnswer: 3, correctDebriefing: "Excellent waveform knowledge. **Electrosection** uses a continuous, undamped (pure) sine wave. This waveform delivers energy smoothly, causing rapid vaporization of water in the cells, which parts the tissue cleanly with minimal collateral thermal damage. This is 'pure cutting'.", incorrectDebriefing: "That modality will coagulate, not cut cleanly, Agent. For pure cutting, you need **Electrosection**. Its key feature is an **undamped** waveform, which provides continuous energy for clean tissue vaporization, unlike the interrupted, damped waveforms used for coagulation."},
      { question: "You are treating superficial telangiectasias. You touch the electrode tip directly to the skin to deliver a damped current that causes dehydration and seals the vessel. What is this monoterminal modality called?", options: ["Electrofulguration", "Electrodesiccation", "Electrocoagulation", "Electrocautery"], correctAnswer: 1, correctDebriefing: "Correct. **Electrodesiccation** is the direct application of a monoterminal electrode to the tissue surface. It works by ohmic heating, causing cellular dehydration and superficial destruction. This is ideal for fine, superficial work.", incorrectDebriefing: "You've confused two similar terms, Agent. When the electrode **touches the skin**, it is **Electrodesiccation**. If the electrode is held away from the skin to create a spark, it is electrofulguration. Both are monoterminal and use a damped wave."},
      { question: "To destroy a larger vascular lesion like a pyogenic granuloma, you use biterminal forceps to grasp the lesion. A moderately damped wave passes between the tips of the forceps, causing deep vessel thrombosis and tissue coagulation. What is this modality?", options: ["Electrofulguration", "Electrodesiccation", "Electrocoagulation", "Electrosection"], correctAnswer: 2, correctDebriefing: "Perfect. This is the definition of **Electrocoagulation**. It is a biterminal modality that uses a high-amperage, low-voltage current to generate deep heat, causing coagulation of proteins and fusion of collagen in vessel walls, leading to thrombosis. The field must be dry for it to be effective.", incorrectDebriefing: "Incorrect, Agent. The use of two electrodes (biterminal) to create deep tissue coagulation and thrombosis is **Electrocoagulation**. Desiccation and fulguration are monoterminal and cause superficial destruction."},
      { question: "An agent is treating multiple flat warts. They hold the electrode tip slightly away from the skin, allowing a spark to jump to the lesion, causing superficial epidermal carbonization or 'char'. What is this technique called?", options: ["Electrodesiccation", "Electrofulguration", "Electrocoagulation", "Electrosection"], correctAnswer: 1, correctDebriefing: "Correct. This technique is **Electrofulguration** (from the Latin *fulgur*, meaning lightning). It is a monoterminal modality where the electrode does not touch the tissue. A spark arcs across the air gap, causing more superficial heating and carbonization than desiccation.", incorrectDebriefing: "Incorrect technique, Agent. When the electrode is held away from the skin and a spark jumps to the tissue, the modality is **Electrofulguration**. If you touch the skin, it's desiccation. This distinction is crucial."},
      { question: "The waveform of an electrosurgical unit determines its tissue effect. What type of waveform is characteristic of electrocoagulation and electrodesiccation?", options: ["Undamped", "Highly damped", "Pure sine wave", "Discontinuous undamped"], correctAnswer: 1, correctDebriefing: "Correct. Coagulation modalities like electrodesiccation and electrocoagulation use a **highly damped** waveform. This waveform consists of short bursts of high-voltage energy that quickly decay. This pattern is excellent for heating tissue and achieving hemostasis, but poor for cutting.", incorrectDebriefing: "Incorrect, Agent. An undamped wave is for cutting. To achieve coagulation, you need a **highly damped** waveform. The interrupted bursts of energy heat the tissue effectively to cause coagulation rather than vaporization."},
      { question: "Electrosurgery in a patient with an Automatic Implantable Cardioverter Defibrillator (AICD) carries a unique risk. How might the AICD misinterpret the electrosurgical signal?", options: ["As a flatline, causing it to pace", "As tachyarrhythmia, causing it to deliver an inappropriate shock", "As a normal rhythm, causing it to shut down", "It cannot misinterpret the signal"], correctAnswer: 1, correctDebriefing: "A critical piece of safety intelligence. An AICD is designed to detect and treat life-threatening arrhythmias. It may misinterpret the electromagnetic interference from electrosurgery as ventricular fibrillation or tachycardia and deliver a powerful, painful, and potentially pro-arrhythmic **inappropriate shock** to the patient.", incorrectDebriefing: "You are gravely underestimating the risk, Agent. The danger with an AICD is that it will misread the electrical noise of electrosurgery as a lethal arrhythmia and **deliver an inappropriate shock**. This is a major adverse event that must be prevented."},
      { question: "In biterminal electrosurgery like electrosection, a grounding pad is used. What is the fundamental purpose of this indifferent electrode?", options: ["To concentrate the current at the surgical site", "To cool the patient's skin", "To complete the electrical circuit by safely returning the current to the generator", "To monitor the patient's heart rate"], correctAnswer: 2, correctDebriefing: "Correct. The grounding pad, or indifferent electrode, serves as a low-resistance pathway for the high-frequency current to exit the patient's body and **return safely to the electrosurgical generator, thereby completing the circuit**. Its large surface area disperses the current, preventing a burn at the exit site.", incorrectDebriefing: "Incorrect, Agent. The grounding pad does not concentrate the current; the active electrode does. The purpose of the grounding pad is to **complete the circuit**, providing a safe, dispersed path for the electrical current to leave the body and return to the machine."},
      { question: "What type of electrical current, characterized by electron flow that continually switches direction at a very high frequency, is used in all forms of electrosurgery?", options: ["Direct current", "Pulsed current", "Galvanic current", "Alternating current"], correctAnswer: 3, correctDebriefing: "Fundamental physics, correct. All electrosurgery (not electrocautery) uses **high-frequency alternating current**. The rapid oscillation of ions within the tissue generates heat via friction. The frequency is too high to stimulate nerves or muscle, thus preventing electrocution.", incorrectDebriefing: "Incorrect, Agent. Direct current would cause dangerous neuromuscular stimulation. Electrosurgery relies on **high-frequency alternating current** to generate heat within the tissue without causing life-threatening electrocution."},
      { question: "According to Table 1, which electrosurgical modality uses a low voltage but high amplitude current to achieve its effect?", options: ["Electrodesiccation", "Electrofulguration", "Electrocoagulation", "Both A and B"], correctAnswer: 2, correctDebriefing: "Correct interpretation of the intelligence. **Electrocoagulation** utilizes a low-voltage, high-amplitude (high amperage) current. This combination is effective at driving current deep into the tissue to achieve profound coagulation and hemostasis.", incorrectDebriefing: "Incorrect. According to the provided data, desiccation and fulguration use high voltage and low amplitude. It is **Electrocoagulation** that employs a low-voltage, high-amplitude current for deep tissue effects."},
      { question: "Conversely, which electrosurgical modalities are characterized by a high voltage but low amplitude current?", options: ["Electrocoagulation and Electrosection", "Electrodesiccation and Electrofulguration", "Only Electrosection", "Only Electrocoagulation"], correctAnswer: 1, correctDebriefing: "Correct. **Electrodesiccation and Electrofulguration** both use a high-voltage, low-amplitude current. The high voltage is necessary to overcome the high impedance of dehydrated tissue and to allow the spark to jump the air gap in fulguration.", incorrectDebriefing: "Incorrect interpretation of the data, Agent. The high-voltage, low-amplitude profile is characteristic of **Electrodesiccation and Electrofulguration**. This allows them to function effectively on the skin surface but limits their depth of penetration."},
      { question: "You are preparing a patient's skin for a procedure involving electrosurgery. Which of these skin prep agents is flammable and must be completely removed or allowed to fully dry before activating the device?", options: ["Povidone-iodine", "Chlorhexidine", "Normal Saline", "Aluminum chloride"], correctAnswer: 3, correctDebriefing: "Excellent safety awareness. **Aluminum chloride**, a common hemostatic agent, is often in an alcohol or acetone base, making it **flammable**. It must be thoroughly wiped away from the surgical field before using any electrosurgical device to prevent ignition and a surgical fire.", incorrectDebriefing: "You've missed a fire hazard, Agent. While alcohol preps are a known risk, the hemostatic agent **Aluminum chloride** is also flammable and must be completely removed from the field before electrosurgery is performed. Never create a fuel source in the surgical field."},
      { question: "The smoke plume generated during electrosurgery is a biohazard. It has been shown to contain aerosolized viral particles. Which virus, in particular, has been documented as being transmissible via the electrosurgical plume?", options: ["Hepatitis B Virus", "Human Immunodeficiency Virus (HIV)", "Human Papillomavirus (HPV)", "Herpes Simplex Virus (HSV)"], correctAnswer: 2, correctDebriefing: "Correct. The smoke plume is not sterile. Viable **Human Papillomavirus (HPV)** particles can be aerosolized during the electrosurgical treatment of warts, posing an inhalation risk to the surgical team. This necessitates the use of a smoke evacuator and proper personal protective equipment.", incorrectDebriefing: "Incorrect, Agent. While other viruses are a concern via blood, it is **Human Papillomavirus (HPV)** that has been proven to be aerosolized and remain viable in the electrosurgical smoke plume. Always use a smoke evacuator when treating warts."},
      { question: "What is the primary tissue effect of a monoterminal electrosurgical device like a Hyfrecator®?", options: ["Pure cutting and vaporization", "Deep tissue coagulation and thrombosis", "Superficial dehydration and carbonization", "Direct thermal burn from a hot wire"], correctAnswer: 2, correctDebriefing: "Correct. Monoterminal devices, which include those used for electrodesiccation and electrofulguration, cause **superficial dehydration** of cells via ohmic heating. The effect is limited in depth and is used for destroying superficial lesions or achieving pinpoint hemostasis.", incorrectDebriefing: "Incorrect, Agent. Monoterminal devices are for superficial work. Their primary effect is **dehydration and carbonization** of the upper layers of the skin. Deep coagulation is the domain of biterminal devices."},
      { question: "What does the brand name 'Hyfrecator®' stand for?", options: ["High Yield Frequency Cauterizer", "High Frequency Eradicator", "Hydrating Frequency Applicator", "Hygienic Fractionated Electrocautery"], correctAnswer: 1, correctDebriefing: "Correct. A 'Hyfrecator' is a brand name that has become synonymous with office-based electrosurgical units. The name is a portmanteau of **High Frequency Eradicator**, accurately describing its function of using high-frequency current to destroy (eradicate) lesions.", incorrectDebriefing: "Incorrect, Agent. While it is a common tool, you must know its nomenclature. 'Hyfrecator' stands for **High Frequency Eradicator**. It is a form of electrosurgery, not electrocautery."},
      { question: "During a biterminal procedure, a patient receives a burn on their leg, far from the surgical site. This could be caused by the patient's leg being in contact with what object?", options: ["The surgeon's chair", "A plastic instrument tray", "A grounded metal object like the operating table frame", "The patient's own hand"], correctAnswer: 2, correctDebriefing: "A critical safety failure, correctly identified. This is called 'current channeling' or an alternate site burn. It occurs when the current finds a path of lower resistance to ground than the grounding pad itself, such as a point of contact with a **grounded metal object**. The current concentrates at this small point, causing a deep burn.", incorrectDebriefing: "You've misidentified the cause of the burn, Agent. This is a classic alternate site burn. It occurs when the patient's body provides a path to ground through an object other than the grounding pad, such as the **metal frame of the operating table**. Proper patient positioning is critical to prevent this."},
      { question: "To achieve hemostasis in a bleeding vessel with electrocoagulation, what is the underlying mechanism that seals the vessel?", options: ["The current vaporizes the blood", "The heat generated fuses collagen and elastin fibers in the vessel wall", "The electricity causes a muscle spasm that constricts the vessel", "The current directly clots the blood proteins"], correctAnswer: 1, correctDebriefing: "Excellent understanding of the mechanism. Electrocoagulation doesn't just 'boil' the blood. The intense heat generated by the current **fuses the collagen and elastin fibers** within the vessel wall. This effectively melts the wall shut, creating a durable, thrombosed seal.", incorrectDebriefing: "That's an oversimplification, Agent. The primary mechanism of hemostasis in electrocoagulation is the thermal **fusion of collagen and elastin fibers** in the vessel wall itself. This creates a much more robust seal than simply clotting the blood inside."},
      { question: "Which form of electrosurgery carries the greatest risk of interference with a pacemaker due to its use of a continuous, undamped waveform and the large current path through the body?", options: ["Electrodesiccation", "Electrofulguration", "Electrocoagulation", "Electrosection"], correctAnswer: 3, correctDebriefing: "Correct risk assessment. **Electrosection** carries the highest risk for pacemaker interference. It uses a biterminal setup (creating a large current loop through the torso) and an undamped, continuous waveform, which is more likely to be misinterpreted by a cardiac device than the short, interrupted bursts of other modalities.", incorrectDebriefing: "You've underestimated the risk of that modality, Agent. While all electrosurgery carries some risk, **Electrosection** is the most dangerous for pacemaker patients. The combination of a biterminal setup and a continuous, undamped waveform creates the most potential for electromagnetic interference."},
      { question: "The tip of an electrosurgical instrument can act as a fomite. What pathogen has been shown to be transmitted from patient to patient via a contaminated Hyfrecator® electrode tip?", options: ["Staphylococcus aureus", "Hepatitis B Virus", "Pseudomonas aeruginosa", "Herpes Simplex Virus"], correctAnswer: 3, correctDebriefing: "Correct. This highlights a critical infection control principle. Studies have shown that **Herpes Simplex Virus (HSV)** can survive on the tip of an electrosurgical instrument and be transmitted to subsequent patients if the tip is not properly sterilized or replaced between uses. The tip must be considered a contaminated sharp.", incorrectDebriefing: "While other infections are possible, you missed the specific documented vector. It has been demonstrated that **Herpes Simplex Virus** can be transmitted via a contaminated electrosurgery tip. Never assume the heat of use sterilizes the instrument."},
      { question: "Why must the surgical field be kept as dry as possible for electrocoagulation to be effective?", options: ["Fluid prevents the electrode from touching the tissue", "Fluid disperses the electrical current, preventing focused heat", "Fluid is flammable and creates a fire risk", "Fluid cools the tissue too quickly"], correctAnswer: 1, correctDebriefing: "Correct. Electrocoagulation relies on generating focused, intense heat. If the field is wet, the electrical current will be **dispersed throughout the fluid**, which has low resistance. This prevents the concentration of energy needed to heat the target vessel to the point of coagulation. A dry field ensures the current passes directly through the tissue.", incorrectDebriefing: "Incorrect reason, Agent. While cooling is a factor, the primary issue is **current dispersal**. Fluid in the field provides an alternate, low-resistance path for the electricity, shunting it away from the target tissue. To coagulate effectively, the field must be dry."},
      { question: "Which type of current, characterized by electron flow in only one direction, is used in electrocautery but NOT in electrosurgery?", options: ["Alternating Current", "Sinusoidal Current", "Damped Current", "Direct Current"], correctAnswer: 3, correctDebriefing: "Correct. **Direct Current (DC)** is used in true electrocautery to heat the filament. **Alternating Current (AC)** is used in electrosurgery to generate heat within the patient's tissue. This is the fundamental difference between the two technologies.", incorrectDebriefing: "Incorrect, Agent. You're confusing the two main modalities. Electrosurgery uses high-frequency AC. True electrocautery uses **Direct Current (DC)** to heat the instrument tip itself. The current does not pass through the patient."},
      { question: "In a patient with a ventricular-inhibited pacemaker, what is the potential dangerous outcome if the device misinterprets electrosurgical interference?", options: ["Tachycardia", "Ventricular fibrillation", "Asystole", "No effect"], correctAnswer: 2, correctDebriefing: "A critical piece of intelligence. A ventricular-inhibited pacemaker works by 'listening' for the heart's own rhythm. If it senses electrical activity (the QRS complex), it remains inhibited. If it senses the noise from electrosurgery, it may mistake it for a native heartbeat and stop pacing, potentially leading to bradycardia or **asystole**.", incorrectDebriefing: "Incorrect outcome, Agent. With a ventricular-inhibited pacemaker, the risk is that it will sense the electrical noise and *stop* pacing because it thinks the heart is beating on its own. This can lead to profound bradycardia or **asystole**."},
      { question: "What is the primary physical principle by which high-frequency alternating current in electrosurgery generates heat in tissue?", options: ["Inductive heating", "Dielectric heating", "Ohmic heating (resistance)", "Convective heating"], correctAnswer: 2, correctDebriefing: "Correct. Electrosurgery works via **Ohmic heating**. The patient's tissues provide resistance to the flow of the high-frequency alternating current. As the current flows against this resistance, electrical energy is converted into thermal energy (heat), causing the desired tissue effect.", incorrectDebriefing: "Incorrect principle, Agent. The fundamental mechanism is **Ohmic heating**. The body's natural electrical resistance converts the flow of current into heat. The higher the resistance or current density, the more heat is generated."},
      { question: "What type of electrosurgical unit is defined as being single-electrode and non-grounded?", options: ["Biterminal unit", "Monopolar unit with grounding pad", "Electrocautery unit", "Monoterminal unit"], correctAnswer: 3, correctDebriefing: "Correct terminology. A **monoterminal** unit, such as a Hyfrecator®, uses a single active electrode. The patient's body itself acts as the ground, with the current dissipating due to the body's natural capacitance. There is no separate grounding pad.", incorrectDebriefing: "Incorrect terminology, Agent. A single-electrode, non-grounded system is known as a **monoterminal** unit. A monopolar unit still uses a grounding pad, and a biterminal unit uses two active electrodes (like forceps)."},
      { question: "You are attempting to perform electrosection with a unit set to a highly damped waveform. What will be the result?", options: ["A clean, bloodless cut", "The machine will not activate", "Poor cutting with significant coagulation and charring", "A deeper cut than intended"], correctAnswer: 2, correctDebriefing: "Correct. A damped waveform is for coagulation, not cutting. Attempting to cut with this waveform will result in the electrode sticking to the tissue, producing significant **coagulation, charring, and thermal damage**, with very poor cutting efficiency. You must use an undamped (cutting) waveform for electrosection.", incorrectDebriefing: "Incorrect result, Agent. You cannot cut with a coagulation waveform. A highly damped wave will produce excessive heat without the explosive vaporization needed for cutting. The result will be **inefficient cutting with extensive collateral thermal damage and char**." }
    ]
  },
  flaps: {
    title: "Flaps",
    questions: [
      { question: "Agent, you are designing a flap that relies on a specific, named artery and vein within its pedicle for its blood supply. What is this type of flap, which is more robust than one based on the random subdermal plexus, called?", options: ["Random pattern flap", "Advancement flap", "Axial pattern flap", "Transposition flap"], correctAnswer: 2, correctDebriefing: "Correct. An **axial pattern flap** is designed around a known, named arteriovenous system. This provides a robust, reliable blood supply, allowing for longer and more complex flaps than a random pattern flap, which relies on the more tenuous dermal-subdermal plexus.", incorrectDebriefing: "Incorrect terminology, Agent. A flap based on a named vessel is an **axial pattern flap**. The paramedian forehead flap is a classic example. Most flaps used in dermatologic surgery are random pattern flaps."},
      { question: "The paramedian forehead flap is a workhorse for large nasal reconstructions. It is an axial flap based on which artery?", options: ["Superficial temporal artery", "Facial artery", "Angular artery", "Supratrochlear artery"], correctAnswer: 3, correctDebriefing: "Correct vascular anatomy. The **paramedian forehead flap** is a robust axial flap that receives its blood supply from the **supratrochlear artery**, a terminal branch of the ophthalmic artery from the internal carotid system. This reliable blood supply allows it to perfuse the entire length of the flap.", incorrectDebriefing: "Incorrect blood supply, Agent. The paramedian forehead flap survives on the **supratrochlear artery**. Knowing the vascular basis of your flaps is critical to their design and survival."},
      { question: "You are closing a defect with a rotation flap. There is a point at the base of the flap around which all the movement occurs and where the tissue is most constrained. What is this point called?", options: ["Primary defect", "Tension vector", "Pivot point", "Secondary defect"], correctAnswer: 2, correctDebriefing: "Correct. The **pivot point** is the corner of tissue at the base of a rotation or transposition flap that remains stationary. All movement arcs around this point. The inherent stiffness of the tissue at the pivot point ('pivotal restraint') is the main factor limiting the flap's movement.", incorrectDebriefing: "Incorrect term, Agent. The stationary point around which a rotation or transposition flap moves is called the **pivot point**. Understanding and managing the tension at this point is key to flap design."},
      { question: "An H-plasty is performed on the forehead, consisting of two opposing advancement flaps. Where is the key stitch placed to initiate this closure?", options: ["At the tips of each Burow's triangle", "At the advancing edges of both flaps, closing the primary defect", "At the far end of one of the advancement arms", "At the midpoint of the horizontal incision"], correctAnswer: 1, correctDebriefing: "Correct suturing sequence. In an H-plasty, the **key stitch** (or stitches) is the one that brings the leading edge of each advancement flap to the center, closing the primary defect first. This sets the tension and position for the rest of the closure.", incorrectDebriefing: "Incorrect placement, Agent. The key stitch for an H-plasty is placed to **close the central, primary defect**. This approximates the two advancing flaps to one another, converting the 'H' shape into two 'T' closures."},
      { question: "A patient's surgical wound has healed, but the scar is weak and thin. At 2 weeks post-op, what percentage of its original strength has the skin regained?", options: ["3-5%", "15-20%", "35%", "80%"], correctAnswer: 0, correctDebriefing: "Correct. Wound strength returns very slowly. At **2 weeks**, when sutures are typically removed, the wound has only regained **3-5%** of its original tensile strength. This highlights the critical importance of deep sutures to provide support during the early healing phase.", incorrectDebriefing: "You are vastly overestimating the wound's strength, Agent. At 2 weeks, a wound is extremely fragile, having only regained **3-5%** of its original strength. This is a critical period where it is vulnerable to dehiscence."},
      { question: "By one year after surgery, what is the maximum percentage of its original tensile strength a scar can be expected to achieve?", options: ["50%", "65%", "80%", "100%"], correctAnswer: 2, correctDebriefing: "Correct. A scar will never be as strong as unwounded skin. After the remodeling phase is complete, at approximately **1 year**, a mature scar will have achieved its maximum tensile strength, which is about **80%** of the original tissue strength.", incorrectDebriefing: "A scar never regains full strength, Agent. The maximum tensile strength a scar can achieve is approximately **80%** of that of normal skin, a plateau it reaches at about one year."},
      { question: "You are designing an island pedicle flap (V-to-Y advancement) on the upper lip. This flap moves forward based on its attachment to a central pillar of subcutaneous tissue. What is this pillar of tissue called?", options: ["The Burow's triangle", "The axial vessel", "The subcutaneous pedicle", "The pivot point"], correctAnswer: 2, correctDebriefing: "Correct. The island pedicle flap is unique because it is completely islandized (cut free) in the dermal layer but remains attached to a **subcutaneous pedicle** containing its vascular supply. The flap slides forward on this pedicle to close the defect.", incorrectDebriefing: "Incorrect term, Agent. The island pedicle flap is defined by its attachment to a deep **subcutaneous pedicle**, which contains the blood vessels that keep the overlying island of skin alive as it is advanced."},
      { question: "A patient develops a 'trapdoor' deformity after a bilobed flap, where the flap appears puffy and elevated above the surrounding skin. Which of the following is a proposed cause for this complication?", options: ["Inadequate undermining", "Concentric contraction of a curvilinear scar", "Flap was made too small", "Sutures were removed too early"], correctAnswer: 1, correctDebriefing: "Correct analysis. The trapdoor phenomenon is complex, but a leading theory is the **concentric contraction of the curvilinear scar** around the flap. This 'purse-string' effect, combined with lymphedema, forces the flap to bulge upwards. Flaps with curved borders, like bilobed flaps, are most susceptible.", incorrectDebriefing: "Incorrect, Agent. The 'trapdoor' deformity is classically associated with the **concentric contraction of a curved scar**, which pushes the flap upwards like a rising door. This is why bilobed flaps are particularly at risk."},
      { question: "A Rieger flap, or dorsal nasal rotation flap, is used to repair a defect on the distal nose. To ensure the flap includes its blood supply, in what plane must it be elevated?", options: ["Intradermal plane", "Superficial subcutaneous fat", "At the level of the perichondrium/periosteum, including the nasal musculature", "Sub-galeal plane"], correctAnswer: 2, correctDebriefing: "Correct plane of dissection. The Rieger flap is a large rotation flap of the entire dorsal nasal skin. To capture the blood supply that runs on the surface of the bone and cartilage, the flap must be elevated deep, at the level of the **perichondrium and periosteum**, thereby including the overlying procerus and nasalis muscles.", incorrectDebriefing: "That is too superficial, Agent, and would lead to flap necrosis. The Rieger flap must be elevated in a deep plane, right on top of the **perichondrium and periosteum**, to include its muscular and vascular supply."},
      { question: "Which type of flap is characterized by being lifted over a bridge of intact skin to be placed into a nearby, but not adjacent, defect?", options: ["Advancement flap", "Rotation flap", "Transposition flap", "Interpolation flap"], correctAnswer: 3, correctDebriefing: "Correct. An **interpolation flap** (or staged flap) is moved over or under a bridge of intact skin to reach the defect. This requires a second-stage procedure, typically at 3 weeks, to divide the pedicle. The paramedian forehead flap and the Abbé flap are classic examples.", incorrectDebriefing: "Incorrect flap type, Agent. A flap that is passed over a bridge of normal skin is an **interpolation flap**. This is a staged procedure. A transposition flap moves over intact skin but is immediately adjacent to the defect and is a single-stage procedure."},
      { question: "A large defect on the lower eyelid is repaired with a Mustarde flap, which rotates tissue from the cheek. What is the primary advantage of this flap in preventing ectropion?", options: ["It is a very thin flap", "The tension vector is directed superiorly and laterally, supporting the eyelid", "It has its own axial blood supply", "It does not require undermining"], correctAnswer: 1, correctDebriefing: "Excellent. The genius of the Mustarde flap is its redirection of tension. The arc of rotation directs the wound closure tension **superolaterally toward the temple and medially toward the cheek**, rather than vertically. This provides a sling of support for the lower eyelid, actively preventing ectropion.", incorrectDebriefing: "You've missed the key mechanical advantage, Agent. The Mustarde flap prevents ectropion by **directing the tension vector away from the free margin** of the eyelid. The pull is horizontal and superior, which supports the lid rather than pulling it down."},
      { question: "A patient requires prophylactic antibiotics for a procedure on an infected leg ulcer. According to guidelines, when should the single dose of antibiotics be administered?", options: ["The night before surgery", "As a single preoperative dose", "Immediately after the procedure", "For three days following the procedure"], correctAnswer: 1, correctDebriefing: "Correct timing. When prophylactic antibiotics are indicated, they should be given as a **single preoperative dose**, typically 30-60 minutes before the incision. This ensures that therapeutic tissue levels of the antibiotic are present at the moment the skin barrier is broken.", incorrectDebriefing: "Incorrect timing, Agent. Post-operative antibiotics are for treatment, not prophylaxis. For prevention, a **single preoperative dose** is the standard of care to ensure adequate tissue concentration at the time of incision."},
      { question: "What is the key identifying feature of a classic rhombic transposition flap closure?", options: ["A single, straight line", "A lazy-S shape", "A 'question mark' or 'Z' shape", "An 'H' shape"], correctAnswer: 2, correctDebriefing: "Correct. The closure of a classic Limberg rhombic flap and its secondary defect results in a characteristic **'Z' shape or a slightly curved 'question mark' appearance**. Recognizing this scar pattern is key to identifying the type of repair used.", incorrectDebriefing: "Incorrect, Agent. The distinct closure pattern of a rhombic flap is a **'Z' or 'question mark' shape**. You must be able to recognize these surgical signatures."},
      { question: "In a bilobed flap, designed according to Zitelli, what is the proper sequence for closing the three defects (primary, secondary, tertiary)?", options: ["Primary, then secondary, then tertiary", "The order does not matter", "The tertiary defect (secondary lobe donor site) is closed first", "The primary and secondary lobes are placed first, then the defects are closed"], correctAnswer: 2, correctDebriefing: "Correct sequence. The key to the bilobed flap is to close the defect with the least tension first, which facilitates the movement of the other lobes. Therefore, the **tertiary defect (where the second lobe was harvested from) is closed first**. This is followed by placing the primary lobe, then finally the secondary lobe.", incorrectDebriefing: "Incorrect sequence, Agent. You must close from least tension to most. In a bilobed flap, you must close the **tertiary defect first**. This frees up the tissue and allows the rest of the flap to move with maximal ease."},
      { question: "A surgeon is performing a wedge excision repair on the lip. This requires a meticulous 4-layer closure. What is the most critical layer to approximate accurately to prevent a retracted, notched, or depressed scar?", options: ["The mucosal layer", "The muscle (orbicularis oris) layer", "The dermal layer", "The epidermal layer"], correctAnswer: 1, correctDebriefing: "Correct. In a full-thickness lip repair, the precise approximation of the **orbicularis oris muscle** is the most critical step. This restores the muscular sphincter of the mouth, provides bulk, and prevents a weak, notched, or depressed scar that would result from muscle retraction.", incorrectDebriefing: "Incorrect, Agent. While all layers are important, the key to a functional and cosmetically acceptable lip repair is the reapproximation of the **muscle layer**. Failure to do so results in a functional and aesthetic disaster."},
      { question: "Which type of flap is essentially two opposing rotation flaps, commonly used to close large circular defects on the scalp?", options: ["H-plasty", "Bilobed flap", "O-to-Z plasty", "Rhombic flap"], correctAnswer: 2, correctDebriefing: "Correct. An **O-to-Z plasty** is the standard technique for closing large scalp defects. It involves making two opposing curvilinear incisions off the circular ('O') defect, creating two large rotation flaps that close in the center to form a 'Z' shaped scar.", incorrectDebriefing: "Incorrect flap type, Agent. The closure of a large circular defect with two opposing rotation flaps is called an **O-to-Z plasty**. It is a workhorse flap for the scalp."},
      { question: "The Dufourmentel flap is a modification of which classic transposition flap?", options: ["Bilobed flap", "Rotation flap", "Advancement flap", "Rhombic flap"], correctAnswer: 3, correctDebriefing: "Correct. The **Dufourmentel flap** is a modification of the classic Limberg **rhombic flap**. It alters the angles of the flap tip, which allows for sharing of tension between the primary and secondary defects, making it more versatile in some locations.", incorrectDebriefing: "Incorrect, Agent. The Dufourmentel and Webster flaps are both well-known modifications of the classic **rhombic flap**. They are designed to better distribute tension."},
      { question: "The Abbé flap, or lip-switch flap, is used to reconstruct a large defect of one lip using tissue from the opposing lip. This flap is an axial pattern flap based on which artery?", options: ["Facial artery", "Mental artery", "Superior or inferior labial artery", "Infraorbital artery"], correctAnswer: 2, correctDebriefing: "Correct. The Abbé flap is a robust axial flap that carries a full-thickness portion of the lip, including mucosa, muscle, and skin. It is based on the **superior or inferior labial artery** (depending on whether the flap comes from the upper or lower lip).", incorrectDebriefing: "Incorrect vessel, Agent. The Abbé flap is a staged interpolation flap based on the **labial artery**. This reliable blood supply ensures the survival of this thick, composite flap."},
      { question: "A patient presents with a 'pig nose' deformity (upward retraction of the nasal tip) after a Rieger flap. What technical error during the flap elevation likely caused this?", options: ["The flap was made too small", "The dissection plane was too deep", "Inadequate undermining and release of the flap", "The pedicle was made too wide"], correctAnswer: 2, correctDebriefing: "Correct. The Rieger flap must be extensively undermined to allow it to rotate and redrape without tension. **Inadequate undermining** or failure to release the deep attachments of the nasal musculature will cause the flap to pull upwards as it heals, resulting in elevation and retraction of the nasal tip—the 'pig nose' deformity.", incorrectDebriefing: "Incorrect analysis, Agent. The classic cause of a 'pig nose' deformity after a dorsal nasal rotation flap is **inadequate undermining**. The flap was not sufficiently freed from its deep attachments, causing it to contract and pull the tip upwards."},
      { question: "A cheek advancement flap is used to repair a medial cheek defect. A common and prolonged side effect of this flap is persistent swelling of the lower eyelid area. What is the cause of this?", options: ["Nerve damage", "Hematoma formation", "Disruption of lymphatic drainage pathways", "Allergic reaction to suture"], correctAnswer: 2, correctDebriefing: "Correct. A large cheek advancement flap requires an incision that cuts across the lymphatic vessels that drain the lower eyelid and medial cheek. This **disruption of lymphatic drainage** can lead to persistent lymphedema, which can last for weeks to months, or in some cases, be permanent.", incorrectDebriefing: "Incorrect cause, Agent. The persistent swelling after a cheek advancement flap is **lymphedema**, caused by the transection of the lymphatic drainage channels of the lower eyelid during the creation of the flap."},
      { question: "What is the primary movement of an advancement flap?", options: ["Rotation around a pivot point", "Lifting over intact skin", "Linear or sliding motion", "Inward folding"], correctAnswer: 2, correctDebriefing: "Correct. An advancement flap has a **linear or sliding motion**. The tissue is mobilized by incisions parallel to the direction of movement and simply slides forward to cover the defect.", incorrectDebriefing: "Incorrect movement, Agent. An advancement flap does not rotate or lift. It has a **linear, sliding motion**."},
      { question: "What is the primary tension vector in a unilateral advancement flap?", options: ["Perpendicular to the flap movement", "In the direction of the flap movement", "At the pivot point", "There is no tension"], correctAnswer: 1, correctDebriefing: "Correct. In an advancement flap, the tension is entirely **in the direction of the flap's movement**. The goal is to advance the leading edge to close the defect, and all tension is oriented along this line.", incorrectDebriefing: "Incorrect, Agent. The tension vector in an advancement flap is simple and linear: it is **in the direction the flap is being moved**."},
      { question: "A painful, expanding hematoma is noted 6 hours after a flap repair. What is the appropriate management?", options: ["Apply a tighter pressure dressing", "Aspirate the clot with a small needle", "Immediately remove sutures, explore the wound, evacuate the clot, and control the bleeding vessel", "Prescribe pain medication and observe"], correctAnswer: 2, correctDebriefing: "Correct. An expanding hematoma is a surgical emergency that is compromising the flap's blood supply. The only appropriate action is to **return to the operating room, remove the sutures, evacuate the hematoma, and achieve hemostasis**. Simple aspiration is insufficient for an active, expanding bleed.", incorrectDebriefing: "That is inadequate and dangerous, Agent. An expanding hematoma requires **immediate surgical exploration**. You must remove the sutures, find the bleeder, and stop it. Anything less will result in flap failure."},
      { question: "A clean surgical wound completely dehisces 12 hours after closure. What is the best course of action?", options: ["Allow it to heal by secondary intention", "Repair it immediately with new sutures", "Cover it with a skin graft", "Apply tissue adhesive"], correctAnswer: 1, correctDebriefing: "Correct. A clean wound that dehisces in the first 24 hours can generally be **repaired immediately by re-suturing**. The wound edges are still fresh and uninfected. If dehiscence occurs after 24-48 hours, the wound is considered contaminated and is often left to heal by secondary intention.", incorrectDebriefing: "Incorrect management, Agent. For a clean dehiscence within the first 24 hours, the standard protocol is to **re-suture the wound immediately**. After this window, the risk of infection is too high, and secondary intention healing is preferred."},
      { question: "Impending ischemia of a skin flap is suspected. Upon pinprick, the flap is cool and does not bleed. What type of vascular compromise does this indicate?", options: ["Venous congestion", "Arterial insufficiency", "Hematoma formation", "Infection"], correctAnswer: 1, correctDebriefing: "Correct. A pale, cool flap with slow or absent capillary refill and **no bleeding on pinprick** is the classic sign of **arterial insufficiency**. There is not enough blood getting into the flap. This is a surgical emergency.", incorrectDebriefing: "Incorrect diagnosis, Agent. The signs—pallor, coolness, no bleeding—point directly to **arterial insufficiency**. Not enough blood is flowing in. Venous congestion would present as a purple, edematous flap with brisk, dark bleeding."},
      { question: "A flap appears swollen, purple-blue, and when pricked with a needle, bleeds briskly with dark, deoxygenated blood. What is the vascular problem?", options: ["Arterial insufficiency", "Venous congestion", "Normal healing", "Seroma"], correctAnswer: 1, correctDebriefing: "Correct. These are the classic signs of **venous congestion**. Arterial inflow is intact, but the venous outflow is blocked. Blood can get in but can't get out, leading to edema, a dusky color, and brisk bleeding of dark blood. This is more rapidly fatal to a flap than arterial insufficiency.", incorrectDebriefing: "Incorrect diagnosis, Agent. An edematous, purple flap with brisk, dark bleeding is suffering from **venous congestion**. The drain is clogged. This can lead to flap necrosis in as little as 3 hours and must be addressed immediately."},
      { question: "A patient develops a contracture band across their neck from a linear scar. Which surgical technique is specifically designed to lengthen a scar by changing its direction?", options: ["M-plasty", "Dermabrasion", "Z-plasty", "Subcision"], correctAnswer: 2, correctDebriefing: "Correct. A **Z-plasty** is the classic technique for scar revision to achieve two goals: **lengthening a contracted scar** and reorienting the central limb to be more favorable. By transposing two triangular flaps, it breaks up the linear tension and increases the scar's functional length.", incorrectDebriefing: "Incorrect technique, Agent. The specific procedure for lengthening a contracted scar is the **Z-plasty**. It works by transposing two interdigitating triangular flaps to break up the line of tension."},
      { question: "A patient develops an ectropion (pulling down of the lower eyelid) after a cheek flap. To temporarily support the eyelid and counteract the downward pull of gravity and edema during healing, what type of suture can be placed?", options: ["A key stitch", "An anchoring suture", "A Frost suspension suture", "A running subcuticular suture"], correctAnswer: 2, correctDebriefing: "Correct. A **Frost suspension suture** is placed through the tarsus of the lower lid and then taped or sutured to the eyebrow. This creates a temporary sling that **suspends the lower eyelid**, protecting it from downward tension and edema during the crucial first 5-7 days of healing.", incorrectDebriefing: "Incorrect suture type, Agent. The specific suture used to temporarily suspend the lower eyelid and prevent post-operative ectropion is a **Frost suspension suture**."},
      { question: "What is the key stitch in an advancement flap?", options: ["The one that closes the Burow's triangle", "The one that brings the leading edge of the flap to the opposite wound edge", "The stitch at the far corner of the flap", "There is no key stitch"], correctAnswer: 1, correctDebriefing: "Correct. In a simple advancement flap, the **key stitch** is the first one placed, which **advances the leading edge of the flap** across the primary defect to meet the opposite wound margin. This stitch sets the position and tension for the entire closure.", incorrectDebriefing: "Incorrect, Agent. The key stitch in an advancement flap is the one that does the work of **advancing the flap's leading edge** to close the primary defect. All other sutures are secondary."},
      { question: "Infection is a risk with any surgery. On the ear, an infection can be particularly dangerous. Which bacterial organism should be specifically suspected in a post-operative ear wound infection?", options: ["Staphylococcus aureus", "Streptococcus pyogenes", "Pseudomonas aeruginosa", "Propionibacterium acnes"], correctAnswer: 2, correctDebriefing: "Excellent regional knowledge. While Staph and Strep are always possibilities, infections of the ear, particularly those involving cartilage, have a high incidence of **Pseudomonas aeruginosa**. Antibiotic coverage must be chosen accordingly.", incorrectDebriefing: "While Staph is common, you must consider the specific location. For post-operative ear infections, you must have a high index of suspicion for **Pseudomonas aeruginosa** and select antibiotics that will cover this dangerous organism."},
      { question: "A mucosal advancement flap is used to repair the lip vermilion. To ensure the flap can be advanced, in what plane should the undermining be performed?", options: ["In the superficial dermis", "Superficial to the minor salivary glands and deep to the orbicularis oris", "Deep to the orbicularis oris muscle", "The mucosa cannot be undermined"], correctAnswer: 1, correctDebriefing: "Correct. To mobilize the lip mucosa, the dissection plane is critical. You must undermine **superficial to the orbicularis oris muscle** but **deep to the minor salivary glands** that lie just under the mucosa. This creates a pliable flap of mucosa with its submucosal plexus intact.", incorrectDebriefing: "Incorrect plane, Agent. You will either fail to mobilize the flap or damage the muscle. The correct plane for a mucosal advancement flap is **above the orbicularis oris muscle but below the minor salivary glands**."},
      { question: "Which of the following flaps has the highest risk of developing a 'trapdoor' deformity?", options: ["Unilateral advancement flap", "H-plasty", "Bilobed transposition flap", "Wedge repair"], correctAnswer: 2, correctDebriefing: "Correct. The **bilobed transposition flap** is notorious for developing a trapdoor deformity. Its curved incisions and the complex rotation of the lobes create ideal conditions for the concentric scar contraction and lymphedema that cause the flap to bulge.", incorrectDebriefing: "Incorrect, Agent. While any flap can trapdoor, the **bilobed flap** is the classic culprit due to its extensively curved borders and complex tissue rearrangement. The risk is high with this flap."},
      { question: "A patient undergoing a skin flap has a prosthetic hip joint placed 1 year ago. According to the 2008 guidelines, do they routinely require prophylactic antibiotics for this clean cutaneous surgery?", options: ["Yes, anyone with a joint replacement needs antibiotics", "No, prophylaxis is not routinely required unless other high-risk factors are present", "Yes, but only if the surgery is on the same leg as the joint", "Only if the surgery takes longer than one hour"], correctAnswer: 1, correctDebriefing: "Correct. According to the 2008 advisory statement, patients with joint replacements (even those less than 2 years old) do **not routinely require antibiotic prophylaxis** for standard, clean cutaneous surgery. Prophylaxis is reserved for procedures on infected skin or oral mucosa, or in immunocompromised hosts.", incorrectDebriefing: "Your protocol is outdated, Agent. The 2008 guidelines state that routine antibiotic prophylaxis for patients with prosthetic joints is **not necessary** for clean cutaneous surgery. The risk of hematogenous seeding is extremely low."},
      { question: "In designing a rhombic flap, the defect is visualized as a parallelogram with two sets of opposing angles. What are these angles?", options: ["90 and 90 degrees", "45 and 135 degrees", "60 and 120 degrees", "30 and 150 degrees"], correctAnswer: 2, correctDebriefing: "Correct geometry. The classic Limberg rhombic flap is designed around a defect shaped like a rhombus with opposing angles of **60 and 120 degrees**. All design principles for this flap are based on this specific geometry.", incorrectDebriefing: "Incorrect geometry, Agent. The basis of the Limberg rhombic flap is a rhombus with angles of **60 and 120 degrees**. This specific shape is what allows the flap to transpose and close with predictable tension."},
      { question: "What is a 'key stitch' in the context of flap surgery?", options: ["The final suture placed", "Any suture that uses a large-gauge thread", "The initial suture placed to accurately position the flap and set the tension", "A suture that is left in for more than two weeks"], correctAnswer: 2, correctDebriefing: "Correct. A **key stitch** is the strategically placed first suture that moves the flap into its intended position. It aligns the flap correctly, defines the primary tension, and serves as the anchor point for the rest of the closure.", incorrectDebriefing: "Incorrect definition, Agent. A **key stitch** is the critical first suture that defines the flap's final position and tension. All other sutures are placed relative to this initial, pivotal stitch."},
      { question: "What is the primary purpose of an anchoring or tacking suture?", options: ["To close the epidermis", "To provide hemostasis", "To suture the flap to a fixed deep structure like periosteum to prevent distortion of a free margin", "To mark the location for a Burow's triangle"], correctAnswer: 2, correctDebriefing: "Correct. An **anchoring suture** (or tacking suture) is used to secure the deep surface of the flap to an immobile structure like the periosteum or deep fascia. This is done to **resist the pull of the flap on a nearby free margin** (like an eyelid or lip), to recreate a concavity (like the alar groove), or to reduce tension.", incorrectDebriefing: "Incorrect purpose, Agent. An anchoring suture is a deep stitch used to **fasten the flap to a fixed structure like bone or fascia**. This is a powerful technique to control the position of the flap and prevent distortion of nearby landmarks."},
      { question: "A surgeon designs a flap that is incised and lifted, then moved over adjacent intact skin to be placed into the primary defect. The donor site is immediately next to the primary defect. What type of flap is this?", options: ["Advancement flap", "Rotation flap", "Transposition flap", "Interpolation flap"], correctAnswer: 2, correctDebriefing: "Correct. A **transposition flap** involves lifting a flap of tissue and moving it over an adjacent bridge of intact skin into a nearby defect. The key is that it 'transposes' its position with the adjacent normal skin. The rhombic and bilobed flaps are classic examples.", incorrectDebriefing: "Incorrect classification, Agent. A flap that is lifted and moved over adjacent skin into a defect is a **transposition flap**. An interpolation flap moves over skin but into a more distant defect and requires a second stage."},
      { question: "A cheek-to-nose interpolation flap is used for an alar defect. How is this flap different from a nasolabial transposition flap?", options: ["It is a one-stage procedure", "It is an axial flap based on the facial artery", "It is a two-stage procedure requiring pedicle division", "It does not blunt the alar crease"], correctAnswer: 2, correctDebriefing: "Correct. The cheek-to-nose interpolation flap is a **two-stage procedure**. A pedicle of skin is left intact to nourish the flap for approximately 3 weeks, after which it is divided. A nasolabial transposition flap is a single-stage procedure where the flap is fully moved and inset on the same day.", incorrectDebriefing: "Incorrect, Agent. The key difference is the staging. A cheek-to-nose interpolation flap is a **two-stage flap** that requires a second surgery to divide the pedicle. A nasolabial transposition flap is a single-stage repair."},
      { question: "A patient develops a 'spitting' stitch 5 weeks after a flap repair. What is this phenomenon?", options: ["An allergic reaction to the suture material", "A sign of a deep wound infection", "The body rejecting and extruding a piece of buried, absorbable suture", "A suture that was accidentally left on the skin surface"], correctAnswer: 2, correctDebriefing: "Correct. A 'spitting' stitch occurs when a piece of buried absorbable suture, often the knot, fails to dissolve properly and elicits a foreign body reaction. The body then **extrudes the suture material** through the path of least resistance, which is the incision line. It typically presents as a small, inflamed papule that resolves once the suture fragment is removed.", incorrectDebriefing: "Incorrect, Agent. A 'spitting' stitch is not an infection. It is a foreign body granulomatous reaction to a piece of **buried suture that the body is pushing out**. It's a common, minor complication of layered closures."},
      { question: "What is the primary motion of a rotation flap?", options: ["Linear sliding", "Pivoting along an arc", "Lifting and transposing", "V-to-Y advancement"], correctAnswer: 1, correctDebriefing: "Correct. As its name implies, a rotation flap's primary movement is **pivoting along an arc** around its base to fill an adjacent, typically triangular, defect. The incision creating the flap is curvilinear to facilitate this rotational movement.", incorrectDebriefing: "Incorrect motion, Agent. The primary movement of a rotation flap is **rotation around a pivot point**. The flap moves along a defined arc." }
    ]
  },
  neurotoxins: {
    title: "Neurotoxins",
    questions: [
      { question: "Agent, you are tasked with neutralizing the dynamic rhytides of the glabella. Botulinum toxin serotype A achieves its effect by cleaving a specific protein required for acetylcholine release. What is this target protein?", options: ["VAMP (synaptobrevin)", "Syntaxin", "SNAP-25", "Acetylcholinesterase"], correctAnswer: 2, correctDebriefing: "A precise hit. Correct. Botulinum toxin A's light chain acts as a zinc-dependent endopeptidase that specifically cleaves **SNAP-25** (Synaptosome-Associated Protein 25 kDa). Without intact SNAP-25, the SNARE complex cannot form, and vesicles containing acetylcholine cannot fuse with the presynaptic membrane for release.", incorrectDebriefing: "You're targeting the wrong protein, Agent. Serotypes B, D, F, and G cleave VAMP. Serotype A specifically targets and cleaves **SNAP-25**. This is the fundamental mechanism of action."},
      { question: "A patient develops eyelid ptosis (a droopy eyelid) a few days after receiving injections for glabellar frown lines. This complication is due to the unwanted diffusion of toxin into which muscle?", options: ["The frontalis muscle", "The orbicularis oculi muscle", "The levator palpebrae superioris muscle", "The corrugator supercilii muscle"], correctAnswer: 2, correctDebriefing: "Correct. Eyelid ptosis is caused by the toxin spreading through the orbital septum and weakening the **levator palpebrae superioris**, the primary muscle responsible for elevating the upper eyelid. This can be treated temporarily with apraclonidine (Iopidine) eye drops, which stimulate an accessory lid elevator muscle (Müller's muscle).", incorrectDebriefing: "Incorrect muscle, Agent. A droopy eyelid (ptosis) is caused by weakening of the **levator palpebrae superioris**. This is a direct result of toxin migrating posteriorly from an injection placed too low or too centrally near the brow."},
      { question: "To correct a 'gummy smile,' where a patient shows excessive gingiva upon smiling, which muscle should be targeted with a small dose of neurotoxin?", options: ["Zygomaticus major", "Depressor anguli oris", "Levator labii superioris alaeque nasi", "Mentalis"], correctAnswer: 2, correctDebriefing: "Excellent anatomical targeting. The 'gummy smile' is caused by hyperfunction of the **levator labii superioris alaeque nasi** muscle, which aggressively elevates the central upper lip. A precise, small injection into this muscle, near the nasal ala, can relax it enough to lower the lip and conceal the gums without affecting the smile's width.", incorrectDebriefing: "Incorrect muscle, Agent. To correct a 'gummy smile,' you must weaken the muscle that pulls the upper lip too high. This is the **levator labii superioris alaeque nasi**. Targeting the other muscles would affect different parts of the mouth."},
      { question: "Which of the following commercially available botulinum toxin A products is unique because it is free from the complexing proteins that surround the core neurotoxin?", options: ["Botox® (onabotulinumtoxinA)", "Dysport™ (abobotulinumtoxinA)", "Xeomin® (incobotulinumtoxinA)", "Myobloc® (rimabotulinumtoxinB)"], correctAnswer: 2, correctDebriefing: "Correct. **Xeomin® (incobotulinumtoxinA)** is often referred to as a 'naked' neurotoxin because it consists of the 150 kDa core toxin without any of the associated hemagglutinin and non-hemagglutinin complexing proteins. It is theorized that this may reduce the risk of antibody formation.", incorrectDebriefing: "Incorrect, Agent. Botox® and Dysport™ both contain complexing proteins. **Xeomin®** is the product that is uniquely formulated without these proteins, containing only the pure 150 kDa neurotoxin."},
      { question: "A patient taking an aminoglycoside antibiotic (e.g., gentamicin) for an infection wishes to have a neurotoxin treatment. What is the significance of this concurrent medication?", options: ["It will diminish the effect of the neurotoxin", "It will enhance the effect of the neurotoxin", "It has no interaction with the neurotoxin", "It will cause an allergic reaction to the neurotoxin"], correctAnswer: 1, correctDebriefing: "A critical piece of intelligence. Aminoglycoside antibiotics can interfere with calcium channels at the neuromuscular junction, thereby reducing acetylcholine release on their own. This action **enhances or potentiates the effect of botulinum toxin**, potentially leading to an excessive or unintended degree of muscle weakness. The dose of the toxin should be reduced, or the treatment postponed.", incorrectDebriefing: "You've missed a critical drug interaction, Agent. **Aminoglycoside antibiotics potentiate the effect of botulinum toxin**. This can lead to an exaggerated response and increased risk of side effects. You must adjust your dose or defer treatment."},
      { question: "The horizontal lines across the forehead are caused by the contraction of which vertically oriented muscle?", options: ["Corrugator supercilii", "Procerus", "Orbicularis oculi", "Frontalis"], correctAnswer: 3, correctDebriefing: "Correct. Dynamic rhytides form perpendicular to the direction of muscle contraction. The **frontalis muscle** is a large, vertically oriented sheet of muscle responsible for raising the eyebrows. Its contraction bunches the skin, creating horizontal forehead lines.", incorrectDebriefing: "Incorrect, Agent. Remember the principle: wrinkles form perpendicular to muscle fibers. The vertical **frontalis** muscle creates the horizontal forehead lines."},
      { question: "A patient complains of a downturned mouth, giving them a perpetually sad or angry appearance. To correct this, which muscle should be injected with neurotoxin?", options: ["Mentalis", "Levator anguli oris", "Depressor anguli oris", "Zygomaticus minor"], correctAnswer: 2, correctDebriefing: "Correct. The **depressor anguli oris (DAO)** is the muscle responsible for pulling down the corners of the mouth. Injecting the DAO with neurotoxin weakens this downward pull, allowing the opposing elevator muscles to lift the oral commissures, resulting in a more neutral or slightly upturned mouth at rest.", incorrectDebriefing: "Incorrect, Agent. To lift a downturned mouth, you must weaken the muscle that pulls it down. That muscle is the **depressor anguli oris**. Injecting it allows the corner of the mouth to lift."},
      { question: "After injection for crow's feet, a patient notes their cheek droops and their smile is asymmetric. This is due to toxin diffusion into which muscle complex?", options: ["Orbicularis oris", "Zygomaticus complex (major and minor)", "Masseter", "Buccinator"], correctAnswer: 1, correctDebriefing: "Correct. This is a classic complication of placing crow's feet injections too low and too medially. The toxin diffuses inferiorly and weakens the **zygomaticus major and minor muscles**, which are responsible for elevating the corner of the mouth and cheek during a smile. This results in a flattened cheek and a crooked smile.", incorrectDebriefing: "Incorrect muscle group, Agent. A droopy cheek or asymmetric smile after crow's feet injections is caused by the toxin migrating down into the **zygomaticus complex**. Your injections were too low and medial."},
      { question: "What is the mechanism of action of botulinum toxin serotype B (Myobloc®)?", options: ["It cleaves SNAP-25", "It cleaves VAMP (synaptobrevin)", "It cleaves Syntaxin", "It blocks acetylcholine receptors"], correctAnswer: 1, correctDebriefing: "Correct. Different serotypes target different SNARE proteins. While serotype A cleaves SNAP-25, serotype **B** (along with D, F, and G) specifically targets and cleaves **VAMP** (vesicle-associated membrane protein), also known as synaptobrevin. The end result—prevention of acetylcholine release—is the same.", incorrectDebriefing: "Incorrect target, Agent. You must know your serotypes. Serotype A cleaves SNAP-25. Serotype **B** cleaves a different SNARE protein called **VAMP**."},
      { question: "The 'bunny lines' on the bridge and sides of the nose are caused by the contraction of which muscle?", options: ["Procerus", "Nasalis", "Depressor septi nasi", "Levator labii superioris alaeque nasi"], correctAnswer: 1, correctDebriefing: "Correct. The transverse and oblique lines on the superior aspect of the nose, often called 'bunny lines,' are caused by the contraction of the **nasalis muscle**. A small amount of neurotoxin injected into this muscle can effectively soften these rhytides.", incorrectDebriefing: "Incorrect muscle, Agent. 'Bunny lines' are the territory of the **nasalis muscle**. The procerus causes horizontal lines at the root of the nose."},
      { question: "A patient develops brow ptosis (a heavy, drooping eyebrow) after treatment for forehead lines. What was the most likely injection error?", options: ["The injections were too superficial", "Too much volume was used per point", "The injections were placed too low on the forehead, weakening the frontalis elevators", "The toxin was expired"], correctAnswer: 2, correctDebriefing: "Correct. This is a common and avoidable error. The frontalis muscle is the only elevator of the brow. If injections are placed **too low on the forehead** (typically within 1-2 cm of the brow), it will weaken the lifting fibers of the frontalis, causing the brow to drop. The depressor muscles (corrugator, procerus) will then pull unopposed.", incorrectDebriefing: "Incorrect error analysis, Agent. The cause of brow ptosis is injecting **too low on the forehead**. You have paralyzed the part of the frontalis muscle that holds the brow up. Always stay high on the forehead."},
      { question: "The deep vertical '11' lines in the glabella are primarily caused by the contraction of which two muscles?", options: ["Frontalis and Procerus", "Corrugator supercilii and Procerus", "Orbicularis oculi and Depressor supercilii", "Nasalis and Zygomaticus minor"], correctAnswer: 1, correctDebriefing: "Correct. The glabellar complex is responsible for frowning. The vertical frown lines are caused by the powerful, medially-pulling **corrugator supercilii muscles**. The horizontal line at the root of the nose is caused by the **procerus** muscle. Both must be treated to effectively erase the '11s'.", incorrectDebriefing: "Incorrect muscle group, Agent. The glabellar frown lines are caused by the **corrugator supercilii** and the **procerus** muscles. You must target both to achieve a good result."},
      { question: "A patient being treated for cervical dystonia has a history of myasthenia gravis. Why is botulinum toxin contraindicated in this patient?", options: ["It will cause a severe allergic reaction", "The patient will be resistant to the toxin's effects", "It will profoundly exacerbate their underlying muscle weakness", "It will interfere with their myasthenia gravis medication"], correctAnswer: 2, correctDebriefing: "A critical contraindication. Myasthenia gravis is a disease of the neuromuscular junction where acetylcholine receptors are blocked by antibodies. The patient already has profound muscle weakness. Adding botulinum toxin, which further blocks acetylcholine release, can **profoundly exacerbate their weakness**, potentially leading to respiratory compromise. It is absolutely contraindicated.", incorrectDebriefing: "This is a deadly combination, Agent. Patients with myasthenia gravis, Eaton-Lambert, or ALS have a compromised neuromuscular junction at baseline. Adding botulinum toxin can cause a **dramatic and dangerous increase in their muscle weakness**."},
      { question: "What is the purpose of adding human serum albumin to a vial of botulinum toxin?", options: ["To act as the active neurotoxin", "To increase the volume of the product", "To prevent the active toxin from adhering to the glass vial", "To act as a preservative"], correctAnswer: 2, correctDebriefing: "Correct. The amount of neurotoxin protein in a vial is infinitesimally small. Without a bulking agent, the toxin molecules would stick to the inside of the glass vial through electrostatic forces. **Human serum albumin** is added as an excipient to prevent this adhesion and ensure the full dose can be withdrawn.", incorrectDebriefing: "Incorrect, Agent. The albumin is not a preservative. Its purpose is to **prevent the tiny amount of active neurotoxin from sticking to the glass vial**, ensuring accurate dosing."},
      { question: "A patient wants to treat the fine vertical lines on their upper lip, often called 'smoker's lines'. Which muscle is responsible for these rhytides?", options: ["Mentalis", "Orbicularis oris", "Depressor labii inferioris", "Risorius"], correctAnswer: 1, correctDebriefing: "Correct. The vertical perioral lines are caused by the contraction of the **orbicularis oris muscle**, the circular muscle that purses the lips. Very small, superficial injections of neurotoxin can soften these lines, but must be done with extreme caution to avoid affecting speech and mouth function.", incorrectDebriefing: "Incorrect muscle, Agent. The 'smoker's lines' are caused by the pursing action of the **orbicularis oris muscle**. Treatment in this area is high-risk and requires expert technique."},
      { question: "In the treatment of axillary hyperhidrosis, what is the purpose of the Iodine-Starch test?", options: ["To numb the area before injection", "To identify the specific areas of sweat production", "To sterilize the skin", "To measure the depth of the sweat glands"], correctAnswer: 1, correctDebriefing: "Correct. The Iodine-Starch test, also known as the Minor test, is used to map out the areas of active sweating. Iodine is painted on the axilla, and starch is then dusted over it. When the patient sweats, the sweat dissolves the iodine, which reacts with the starch to turn a **dark brown/black color**. This creates a precise map for injection.", incorrectDebriefing: "Incorrect purpose, Agent. The Iodine-Starch test is a visual tool used to **identify the exact location of active sweat glands**, allowing for a more targeted and effective treatment for hyperhidrosis."},
      { question: "The potency units of Botox® and Dysport™ are not interchangeable. Is the dose equivalency ratio considered to be 1:1?", options: ["Yes, 1 unit of Botox® is equivalent to 1 unit of Dysport™", "No, more Botox® units are needed to equal one Dysport™ unit", "No, more Dysport™ units are needed to equal one Botox® unit", "The ratio varies by muscle group"], correctAnswer: 2, correctDebriefing: "A critical point for safety and efficacy. The units are not equivalent. While debate continues on the exact ratio, it is universally accepted that **more Dysport™ units are required to achieve the same effect as one Botox® unit**. The most commonly cited ratios range from 2.5:1 to 3:1 (Dysport™:Botox®).", incorrectDebriefing: "That is a dangerous assumption, Agent. The units are not 1:1. You need significantly **more Dysport™ units to equal the effect of Botox® units**, typically at a ratio of 2.5:1 or 3:1. Confusing the two can lead to massive overdosing or underdosing."},
      { question: "How does the heavy chain of the botulinum toxin A molecule contribute to its mechanism of action?", options: ["It cleaves the SNAP-25 protein", "It is responsible for binding to the presynaptic nerve terminal and translocation across the cell membrane", "It acts as a stabilizer for the light chain", "It is an inert complexing protein"], correctAnswer: 1, correctDebriefing: "Correct. The heavy chain has two crucial functions. First, it **binds with high specificity to its receptor on the presynaptic motor neuron terminal**. Second, after endocytosis, it forms a channel that allows the light chain to **translocate across the endosomal membrane** into the cytoplasm, where it can then cleave SNAP-25.", incorrectDebriefing: "Incorrect, Agent. The light chain does the cleaving. The **heavy chain is responsible for binding and entry**. It is the targeting system and the key that lets the active light chain into the cell."},
