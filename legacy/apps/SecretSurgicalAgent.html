      { question: "What is the primary advantage of using tissue adhesives like Dermabond over traditional sutures for epidermal closure?", options: ["They provide stronger wound eversion", "They are less expensive than sutures", "They eliminate the risk of suture 'track marks'", "They have higher tensile strength"], correctAnswer: 2, correctDebriefing: "Correct. The key cosmetic advantage of tissue adhesives is that they **eliminate the risk of suture 'track marks'**. Because no needles puncture the epidermis, there is no chance of forming epithelialized tracts, which can lead to permanent scarring. This makes them an excellent choice for low-tension facial wounds.", incorrectDebriefing: "While they have several advantages, the most significant one, especially cosmetically, is that tissue adhesives **eliminate the risk of suture 'track marks'**. They do not provide eversion and their strength is only equivalent to a 5-0 suture, but the lack of needle punctures is their main selling point."},
      { question: "What is the primary disadvantage of using surgical staples for closing a wound, especially a surgical flap?", options: ["They have high tissue reactivity", "They are very slow to place", "They can compromise blood supply and cause flap necrosis", "They provide poor tensile strength"], correctAnswer: 2, correctDebriefing: "Correct. The main concern with staples, particularly on a flap with a tenuous blood supply, is that the pressure from the staple can **compromise the microcirculation** at the wound edge, leading to ischemia and potentially flap necrosis. While fast, they must be used with caution.", incorrectDebriefing: "Incorrect. Staples are very strong, fast, and have low reactivity. Their primary and most dangerous disadvantage is the risk of **compromising blood supply** to the skin edges, which can be catastrophic for a surgical flap."},
      { question: "A suture is defined as 'absorbable' by the USP if it loses the majority of its tensile strength within what time frame?", options: ["14 days", "30 days", "60 days", "120 days"], correctAnswer: 2, correctDebriefing: "Correct. The official definition of an absorbable suture is one that loses the majority of its tensile strength by **60 days**. It's crucial to remember this is about strength loss, not the complete disappearance of the material, which can take much longer.", incorrectDebriefing: "That is incorrect. The standard time frame used to define an absorbable suture is the loss of most of its tensile strength by **60 days**. This is a key definition in understanding and choosing suture materials."},
      { question: "Which of the following absorbable sutures is a monofilament known for its excellent handling, pliability, and good knot security, making it a popular choice for deep dermal stitches?", options: ["Chromic Gut", "Polyglactin 910 (Vicryl)", "Polydioxanone (PDS)", "Poliglecaprone 25 (Monocryl)"], correctAnswer: 3, correctDebriefing: "Correct. **Poliglecaprone 25 (Monocryl)** is widely praised for these properties. As a monofilament, it has a low infection risk, but unlike others such as PDS or polypropylene, it is very soft, pliable, and easy to handle, with excellent knot security. This makes it a favorite for many surgeons for subcuticular and deep dermal closures.", incorrectDebriefing: "You've missed the unique combination of properties. While Vicryl is a popular deep suture, it is braided. PDS is a stiff monofilament. The suture that is a *monofilament* and is known for its exceptional *handling and pliability* is **Poliglecaprone 25 (Monocryl)**."},
      { question: "The property of a braided suture that allows it to harbor bacteria between its fibers is known as:", options: ["Memory", "Plasticity", "Capillarity", "Reactivity"], correctAnswer: 2, correctDebriefing: "Correct. **Capillarity** is the wicking action of a braided suture that allows it to draw in and trap fluid and bacteria within its interstices. This is the primary reason braided sutures carry a higher risk of infection compared to monofilaments.", incorrectDebriefing: "Incorrect. The property that describes the wicking action of a braided suture is **Capillarity**. This is what allows it to harbor bacteria and is its main disadvantage from an infection-risk standpoint."},
      { question: "A 'pulley suture' is a modified version of which standard suturing technique, designed to provide extra mechanical advantage in closing high-tension wounds?", options: ["Simple interrupted suture", "Horizontal mattress suture", "Vertical mattress suture", "Running locked suture"], correctAnswer: 2, correctDebriefing: "Correct. The pulley suture is a clever modification of the **vertical mattress suture**. By creating an extra loop, it provides a 2-to-1 mechanical advantage, effectively doubling the force a surgeon can apply to close a wound under very high tension.", incorrectDebriefing: "Incorrect. The pulley suture is a specialized modification of the **vertical mattress suture**. It uses the principles of a pulley to multiply the closing force for very high-tension wounds."},
      { question: "Which of the following is NOT considered one of the three main parts of a surgical needle?", options: ["The Tip", "The Body", "The Shank (Swage)", "The Hub"], correctAnswer: 3, correctDebriefing: "Correct. A surgical needle consists of the tip, the body, and the shank or swage (the part where the suture is attached). The **Hub** is the part of a hypodermic needle that attaches to the syringe, not a component of a surgical suture needle.", incorrectDebriefing: "Incorrect. The three recognized parts of a surgical needle are the tip, the body, and the shank/swage. The **Hub** is a component of a hypodermic needle, not a suturing needle."},
      { question: "Which of the following is a primary advantage of using a reverse cutting needle over a conventional cutting needle for skin closure?", options: ["It is less likely to bend", "It has a sharper point for easier penetration", "It is less likely to tear through tissue during suturing", "It is designed for use in deep tissues only"], correctAnswer: 2, correctDebriefing: "Correct. The key advantage of a **reverse cutting needle** is its decreased risk of tearing tissue. Because its third cutting edge is on the outer, convex curve, it is stronger and more resistant to 'cutting out' of the tissue, especially when upward pressure is applied. This makes for a more secure bite.", incorrectDebriefing: "That is not the primary advantage. The main reason to choose a **reverse cutting needle** over a conventional one is that it is stronger and **less likely to tear or 'cut out' of the tissue**, providing a more secure closure. This is due to the placement of the third cutting edge on the outer curve."},
      { question: "A surgeon wishes to tack a skin graft temporarily to the wound bed. They need a suture that will lose its strength and dissolve very quickly to avoid the need for removal. Which suture is best suited for this purpose?", options: ["Polydioxanone (PDS)", "Plain Gut", "Fast-absorbing gut", "Polyglactin 910 (Vicryl)"], correctAnswer: 2, correctDebriefing: "Correct. **Fast-absorbing gut** is the ideal choice for this scenario. It is specifically treated to maintain strength for only 3-5 days and absorb rapidly thereafter. This makes it perfect for situations like tacking down skin grafts where you want temporary hold without the trauma of suture removal.", incorrectDebriefing: "Those sutures last too long. For a very temporary hold, such as tacking a skin graft, **fast-absorbing gut** is the correct choice. It is designed to lose its strength and disappear within a week, which is exactly what is needed." }
    ]
  },
  fillers: {
    title: "Soft-tissue Fillers",
    questions: [
      { question: "Agent, you are injecting a hyaluronic acid filler into the nasolabial folds. The injection is too superficial, resulting in a visible bluish nodule under the skin. What is the physical phenomenon responsible for this discoloration?", options: ["Rayleigh scattering", "The Tyndall effect", "The Compton effect", "The Doppler effect"], correctAnswer: 1, correctDebriefing: "Correct. The **Tyndall effect** occurs when light is scattered by particles in a colloid, such as hyaluronic acid gel. When this clear gel is placed too superficially in the dermis, shorter blue wavelengths of light are reflected back to the observer's eye, while longer wavelengths pass through, resulting in a bluish hue. The filler itself is not blue.", incorrectDebriefing: "Incorrect physical principle, Agent. The bluish discoloration from a superficially placed hyaluronic acid filler is a classic example of the **Tyndall effect**. It is an optical illusion caused by light scattering, not a property of the filler itself."},
      { question: "A patient is dissatisfied with their hyaluronic acid filler result and wishes to have it removed. What substance can be injected to rapidly dissolve the HA filler?", options: ["Lidocaine", "Saline", "Corticosteroids", "Hyaluronidase"], correctAnswer: 3, correctDebriefing: "Correct. The antidote for hyaluronic acid filler is **hyaluronidase**, an enzyme that specifically breaks down hyaluronic acid. Injecting hyaluronidase into an area of overcorrection or a misplaced nodule will dissolve the filler, typically within 24-48 hours. This reversibility is a key safety feature of HA fillers.", incorrectDebriefing: "Incorrect, Agent. The only substance that can dissolve a hyaluronic acid filler is the enzyme **hyaluronidase**. This is the 'eraser' for HA fillers and a critical tool to have on hand for managing complications."},
      { question: "A patient is being treated for HIV-associated lipoatrophy with a filler that requires reconstitution from a powder and stimulates the body's own collagen production over several months. This filler also requires a specific post-injection massage protocol. What filler is this?", options: ["Calcium hydroxylapatite (Radiesse®)", "Polymethylmethacrylate (ArteFill®)", "Autologous fat", "Poly-L-lactic acid (Sculptra™)"], correctAnswer: 3, correctDebriefing: "Correct. **Poly-L-lactic acid (PLLA) / Sculptra™** is a biostimulatory filler that comes as a powder and must be reconstituted. It works by stimulating fibroblasts to produce new collagen over several months. The 'Rule of 5s' massage protocol (5 minutes, 5 times a day, for 5 days) is crucial to ensure even distribution of the particles and prevent nodule formation.", incorrectDebriefing: "Incorrect filler, Agent. The product that comes as a powder, requires reconstitution, and has a mandatory post-procedure massage regimen is **Poly-L-lactic acid (Sculptra™)**. It is a collagen stimulator, not a simple volumizer."},
      { question: "Which type of filler is considered permanent and works by suspending microspheres in a collagen gel, which then stimulates the body to form a fibrous capsule around each particle?", options: ["Hyaluronic acid", "Calcium hydroxylapatite", "Poly-L-lactic acid", "Polymethylmethacrylate (PMMA)"], correctAnswer: 3, correctDebriefing: "Correct. **Polymethylmethacrylate (PMMA) / ArteFill®** is a permanent filler. The PMMA microspheres are non-biodegradable. The body recognizes them as foreign and encapsulates them in collagen, which is what provides the long-term volume. Because it contains bovine collagen, a skin test is required.", incorrectDebriefing: "Incorrect, Agent. The only permanent filler listed that works via encapsulation of microspheres is **Polymethylmethacrylate (PMMA)**. Its effects are irreversible, making patient selection and injection technique paramount."},
      { question: "A patient is injected with Calcium Hydroxylapatite (CaHA / Radiesse®). This filler is radio-opaque. What does this mean in a clinical context?", options: ["It cannot be used in patients who need X-rays", "It will appear white (opaque) on an X-ray or CT scan", "It interferes with MRI scans", "It is radioactive"], correctAnswer: 1, correctDebriefing: "Correct. Because it is composed of calcium-based microspheres, CaHA is **radio-opaque**, meaning it will show up as a bright white density on radiographic imaging like X-rays and CT scans. This can be useful as a tissue marker but can also be mistaken for a calcification or foreign body by an unsuspecting radiologist.", incorrectDebriefing: "Incorrect, Agent. Radio-opaque means it is visible on radiographic imaging. Calcium Hydroxylapatite will appear as a **white density on an X-ray or CT scan**. The treating physician must be aware of this to avoid future diagnostic confusion."},
      { question: "Natural hyaluronic acid in the body has a very short half-life of 1-2 days. What is done to the HA used in fillers to make it last for months?", options: ["It is purified from animal sources", "It is combined with lidocaine", "It is cross-linked", "It is frozen before injection"], correctAnswer: 2, correctDebriefing: "Correct. To increase its longevity, the individual hyaluronic acid polymer chains are bound together through a process called **cross-linking**. This creates a more stable, gel-like macromolecule that is resistant to enzymatic degradation by the body's hyaluronidases, allowing it to persist for 6-18 months instead of just a couple of days.", incorrectDebriefing: "Incorrect, Agent. The key to a filler's longevity is **cross-linking**. This process ties the HA molecules together, making them much more difficult for the body to break down."},
      { question: "A patient experiences a vasovagal episode during a filler injection. What is the appropriate immediate management?", options: ["Continue the injection quickly", "Sit the patient fully upright", "Place the patient in a tilted or Trendelenburg position", "Administer smelling salts and call for emergency services"], correctAnswer: 2, correctDebriefing: "Correct. A vasovagal response involves a sudden drop in heart rate and blood pressure, leading to lightheadedness or syncope. The immediate response is to stop the procedure and place the patient in a **tilted position (Trendelenburg)** with their feet elevated above their head. This uses gravity to restore blood flow to the brain.", incorrectDebriefing: "Incorrect response, Agent. For a vasovagal episode, you must immediately get the patient's head down and feet up. Placing them in a **tilted or Trendelenburg position** is the standard and effective response."},
      { question: "Some HA fillers, such as Restylane®, are derived from a bacterial fermentation process. Which bacterial species is used for this purpose?", options: ["Staphylococcus aureus", "Escherichia coli", "Streptococcus equi", "Pseudomonas aeruginosa"], correctAnswer: 2, correctDebriefing: "Correct. Most modern hyaluronic acid fillers, like Restylane® and Juvéderm®, are produced through a bio-fermentation process using non-pathogenic strains of **Streptococcus equi**. The resulting HA is then purified, making it identical to human HA and eliminating the need for skin testing.", incorrectDebriefing: "Incorrect bacterium, Agent. The workhorse for producing non-animal stabilized hyaluronic acid (NASHA) via fermentation is **Streptococcus equi**."},
      { question: "A rare but serious delayed reaction has been reported with Poly-L-lactic acid, presenting 9-12 months after injection as sudden inflammatory nodules with cellulitis. What is the proposed mechanism?", options: ["A bacterial infection of the particles", "An idiopathic immunologic response", "Incomplete degradation of the particles", "Migration of the product into lymph nodes"], correctAnswer: 1, correctDebriefing: "Correct. While the exact cause is unknown, these delayed inflammatory nodules are thought to be due to a late-onset, **idiopathic immunologic response** to the PLLA particles or their breakdown products. It is a granulomatous reaction that can be challenging to treat.", incorrectDebriefing: "Incorrect, Agent. This is not an infection. This delayed reaction is thought to be an **idiopathic immunologic or granulomatous response** to the PLLA particles themselves, occurring long after the initial treatment."},
      { question: "What is the primary mechanism by which 'stimulatory' fillers like Calcium Hydroxylapatite and Poly-L-lactic acid provide long-term volume?", options: ["They physically occupy space permanently", "They hydrate and bind large amounts of water", "They stimulate the patient's own fibroblasts to produce new collagen", "They cause a controlled scarring reaction"], correctAnswer: 2, correctDebriefing: "Correct. These are not just passive space-fillers. The microspheres of CaHA and PLLA act as a scaffold that **stimulates the patient's own fibroblasts** to lay down a new network of Type I collagen. While the carrier gel and the particles themselves are eventually absorbed, this new collagen provides the durable, long-term correction.", incorrectDebriefing: "Incorrect mechanism, Agent. Stimulatory fillers work by **inducing neocollagenesis**. They provide a scaffold that tricks the body into building its own volume by stimulating fibroblast activity."},
      { question: "Which HA filler product is formulated with an antioxidant (sodium metabisulfite) and is therefore contraindicated in patients with a sulfite allergy?", options: ["Restylane®", "Juvéderm®", "Hydrelle™", "Belotero Balance®"], correctAnswer: 2, correctDebriefing: "A critical piece of intelligence for patient safety. **Hydrelle™** is unique in that it contains sodium metabisulfite as an antioxidant. This poses a risk for patients with a known **sulfite allergy**, and the product is contraindicated in this population.", incorrectDebriefing: "Incorrect, Agent. You must know your product formulations. **Hydrelle™** is the filler that contains sulfites and is contraindicated in patients with a sulfite allergy."},
      { question: "What is isovolemic degradation, a property of hyaluronic acid gel fillers?", options: ["The filler degrades into an equal volume of water", "The filler maintains its volume for a time as it degrades by binding more water", "The filler shrinks rapidly as it degrades", "The filler causes the surrounding tissue to lose volume"], correctAnswer: 1, correctDebriefing: "Correct. **Isovolemic degradation** is a key property of HA gels. As the HA chains are slowly broken down, the remaining gel becomes less concentrated. To maintain osmotic equilibrium, it **binds more water** from the surrounding tissue. This allows the filler to maintain its corrective volume for a period, even as the gel itself is degrading.", incorrectDebriefing: "Incorrect definition, Agent. Isovolemic degradation means 'same volume'. As the HA gel degrades, it **compensates by absorbing more water**, thus maintaining its volume and corrective effect for a longer period."},
      { question: "During an autologous fat transfer procedure, what is the purpose of centrifuging the harvested lipoaspirate?", options: ["To sterilize the fat", "To activate the fat cells", "To separate the viable adipocytes from the tumescent fluid, blood, and oil", "To mix the fat with lidocaine"], correctAnswer: 2, correctDebriefing: "Correct. The harvested tissue is a mixture of fat, blood, oil from ruptured fat cells, and a large volume of tumescent anesthetic fluid. **Centrifugation** is used to separate these components by density. This allows the surgeon to isolate a purified layer of viable **adipocytes** for injection, removing the inflammatory and non-viable components.", incorrectDebriefing: "Incorrect, Agent. The purpose of centrifugation is **separation and purification**. It concentrates the viable fat cells by separating them from the unwanted fluid, blood, and oil in the lipoaspirate."},
      { question: "A new type of filler, azficel-T, has been developed for nasolabial folds. What is unique about the source of this filler?", options: ["It is derived from bovine collagen", "It is a synthetic polymer", "It is created by harvesting and culturing the patient's own fibroblasts", "It is a purified form of hyaluronic acid"], correctAnswer: 2, correctDebriefing: "Correct. Azficel-T is a form of cellular therapy. A skin sample is taken from the patient, and from it, **fibroblasts are harvested and cultured in a lab**. These millions of new, autologous fibroblasts are then injected back into the patient's wrinkles, where they produce new collagen. It is a completely individualized treatment.", incorrectDebriefing: "Incorrect source, Agent. Azficel-T is a living, autologous product. It is composed of **the patient's own fibroblasts** that have been harvested and grown in a laboratory."},
      { question: "Which complication of fillers can lead to a persistent, yellowish-brown discoloration, especially in the thin skin of the periorbital area?", options: ["Tyndall effect", "Hemosiderin deposition", "Overcorrection", "Granuloma formation"], correctAnswer: 1, correctDebriefing: "Correct. If significant bruising occurs during the injection, red blood cells can break down and release iron-containing hemoglobin. Macrophages can then process this iron into **hemosiderin**, a pigment that gets trapped in the dermis. This leads to a persistent, tattoo-like brownish or yellowish stain that can be very difficult to treat.", incorrectDebriefing: "Incorrect complication, Agent. The persistent brownish stain left behind after a significant bruise is due to **hemosiderin deposition**. This is a major reason to minimize bruising, especially around the eyes."},
      { question: "A catastrophic complication of filler injection is skin necrosis due to accidental arterial injection. If this is suspected, what is the immediate first step?", options: ["Apply a warm compress and massage the area", "Immediately inject hyaluronidase (if an HA filler was used)", "Administer oral antibiotics", "Observe for 24 hours"], correctAnswer: 1, correctDebriefing: "Correct. If an arterial occlusion is suspected (heralded by immediate, severe pain and blanching), time is critical. If a hyaluronic acid filler was used, the first and most important step is to **flood the entire affected area with hyaluronidase** in an attempt to dissolve the intravascular plug and restore blood flow. All other measures are secondary.", incorrectDebriefing: "Waiting is not an option, Agent! This is a true emergency. If you used an HA filler, you must immediately inject **hyaluronidase** throughout the compromised area to try and dissolve the embolus. The window to save the tissue is measured in hours."},
      { question: "Which facial area is considered highest risk for vascular complications like ulceration, necrosis, or even blindness from filler injection?", options: ["The cheeks", "The chin", "The glabella and periorbital area", "The lips"], correctAnswer: 2, correctDebriefing: "Correct. The **glabella** and periorbital areas are considered the highest risk 'danger zones'. The vascular anatomy here is complex, with numerous anastomoses between the internal and external carotid systems (e.g., via the supratrochlear and supraorbital arteries). An intravascular injection here can lead to retrograde embolization into the ophthalmic artery, causing blindness, or widespread skin necrosis.", incorrectDebriefing: "Incorrect, Agent. While risk exists everywhere, the **glabella and periorbital region** are the most dangerous areas for filler injection due to their complex vascular anatomy and connection to the ophthalmic circulation. Extreme caution is required."},
      { question: "Which injectable filler should NOT be used in the lips due to its high propensity for forming palpable nodules?", options: ["Hyaluronic acid (Juvéderm®)", "Calcium Hydroxylapatite (Radiesse®)", "Autologous fat", "Hyaluronic acid (Restylane®)"], correctAnswer: 1, correctDebriefing: "Correct. **Calcium Hydroxylapatite** is a thick, particulate filler designed for deep structural volumizing. Its firm consistency and tendency to form nodules make it unsuitable for use in the dynamic and sensitive tissues of the lips. Hyaluronic acid fillers are the standard of care for lip augmentation.", incorrectDebriefing: "Incorrect, Agent. **Calcium Hydroxylapatite (Radiesse®)** is contraindicated for use in the lips. It is too firm and prone to nodule formation in this highly mobile area. Use an appropriate HA filler for this mission."},
      { question: "A patient develops a firm, inflammatory nodule 6 months after a filler injection. This is most likely what type of hypersensitivity reaction?", options: ["An immediate Type I reaction", "A delayed Type IV (granulomatous) reaction", "The Tyndall effect", "A sterile abscess"], correctAnswer: 1, correctDebriefing: "Correct. A firm nodule appearing months after injection is the hallmark of a delayed-type hypersensitivity reaction. This is a **Type IV or foreign body granulomatous reaction**, where the immune system attempts to 'wall off' the filler material it recognizes as foreign. This can occur with almost any filler type.", incorrectDebriefing: "Incorrect timing, Agent. An immediate reaction is Type I. A firm, inflammatory nodule appearing months later is a classic **delayed-type, granulomatous reaction**. This is the body's attempt to wall off the foreign material."},
      { question: "What is the primary reason that collagen fillers like Zyderm® and CosmoDerm® have largely been replaced by hyaluronic acid fillers in the U.S. market?", options: ["They were not effective", "They were too expensive", "They had a high rate of allergic reactions and required pre-treatment skin testing", "They were difficult to inject"], correctAnswer: 2, correctDebriefing: "Correct. Bovine collagen fillers required skin testing due to a ~3% rate of allergic reactions. Even human-derived collagens, while safer, had issues with rapid degradation and less impressive results compared to modern HA fillers. The combination of **allergy risk, need for skin testing, and shorter duration** made them inferior to the immunologically inert and longer-lasting HA products.", incorrectDebriefing: "Incorrect, Agent. The downfall of collagen fillers was primarily due to the **risk of allergic reactions and the need for skin testing**, combined with their shorter duration compared to the new generation of hyaluronic acid fillers." }
    ]
  },
  cryosurgery: {
    title: "Cryosurgery",
    questions: [
      // --- New Questions Based on Chapter 9 ---
                    { question: "Agent, your mission is to obliterate a target lesion using extreme cold. To ensure maximum intracellular damage, what is the optimal freeze-thaw protocol?", options: ["Slow freeze, fast thaw", "Fast freeze, fast thaw", "Slow freeze, slow thaw", "Fast freeze, slow thaw"], correctAnswer: 3, correctDebriefing: "Perfect execution of cryo-theory. The protocol for maximum cell destruction is **fast freeze, slow thaw**. A rapid freeze promotes the formation of damaging intracellular ice crystals. A slow thaw allows those crystals to recrystallize into larger, even more destructive forms, and allows for osmotic shifts that cause the cell to swell and rupture.", incorrectDebriefing: "Incorrect protocol, Agent. You've reversed the optimal parameters. Maximum cell kill is achieved by a **fast freeze and a slow thaw**. This combination maximizes the formation of intracellular ice crystals and the subsequent osmotic damage during the thawing phase."},
      { question: "You are treating a superficial BCC with cryosurgery. To ensure complete tumor necrosis, what is the target temperature that must be achieved at the base of the lesion?", options: ["-4°C", "-20°C", "-35°C", "-50°C"], correctAnswer: 3, correctDebriefing: "Correct. For malignant lesions like BCC or SCC, a tissue temperature of at least **-50°C** is required to ensure complete destruction of the tumor cells. This is significantly colder than the temperature required for benign lesions and necessitates a more aggressive freeze.", incorrectDebriefing: "That temperature is insufficient for a malignancy, Agent. While melanocytes die at -4°C and keratinocytes at -20°C, you must achieve a temperature of **-50°C** at the tumor base to reliably destroy a malignant lesion like a BCC."},
      { question: "A patient develops significant hypopigmentation at the site of a previous cryosurgery treatment. This is due to the destruction of which highly cryosensitive cell type?", options: ["Keratinocytes", "Melanocytes", "Fibroblasts", "Langerhans cells"], correctAnswer: 1, correctDebriefing: "Correct. **Melanocytes** are extremely sensitive to cold, with destruction occurring in the -4°C to -7°C range. This is why hypopigmentation is a very common and often permanent side effect of cryosurgery, as the melanocytes are destroyed long before the target keratinocytes or tumor cells are.", incorrectDebriefing: "Incorrect, Agent. The cell type most sensitive to cold is the **melanocyte**, which is destroyed at only -4°C to -7°C. This extreme sensitivity is the reason hypopigmentation is a common and predictable side effect of cryotherapy."},
      { question: "You are using the open spray technique to treat an actinic keratosis. What is the standard distance the spray tip should be held from the lesion to be effective and safe?", options: ["Directly touching the skin", "1-2 cm away", "5-6 cm away", "10 cm away"], correctAnswer: 1, correctDebriefing: "Correct. The standard open technique involves holding the cryosurgery spray tip **1-2 cm** from the lesion's surface. This distance allows for a controlled, focused spray that can achieve the desired freeze time and depth without excessive lateral spread of the cryogen.", incorrectDebriefing: "Your distance is incorrect, Agent. For the standard open spray technique, the tip should be held **1-2 cm** from the skin. Too close and the pressure can be excessive; too far and the spray becomes ineffective and diffuse."},
      { question: "A patient asks why their cryosurgery treatment for a BCC involves two freeze-thaw cycles. What is the primary reason for the second cycle?", options: ["To make the first freeze colder", "To ensure the patient is numb", "The second freeze causes additional and more profound cell damage", "To sterilize the area"], correctAnswer: 2, correctDebriefing: "Correct. The initial freeze-thaw cycle causes significant cell injury and alters the tissue's thermal conductivity. A **second freeze-thaw cycle** is more lethal, achieving a colder temperature faster and causing more extensive intracellular ice formation, which is crucial for eradicating resilient malignant cells.", incorrectDebriefing: "Incorrect, Agent. A single freeze is often insufficient for a malignancy. A **second freeze-thaw cycle** is performed because it is significantly more destructive than the first, ensuring a higher likelihood of complete tumor eradication."},
      { question: "What is the primary mechanism by which a slow thaw time enhances cell destruction after cryosurgery?", options: ["It allows the skin to re-warm gently", "It prevents scarring", "It increases the probability of intracellular ice recrystallization", "It reduces post-operative pain"], correctAnswer: 2, correctDebriefing: "Excellent understanding of cryobiology. A **slow thaw** is cytotoxic because it provides more time for ice crystals within the cell to reorganize and grow into larger, more damaging structures (a process called recrystallization). It also allows for damaging osmotic shifts as water moves back into the cell.", incorrectDebriefing: "Incorrect, Agent. A slow thaw is not for comfort; it is for lethality. It enhances cell destruction by allowing for **intracellular ice recrystallization**, where small ice crystals merge into larger, more mechanically destructive ones."},
      { question: "Which cryosurgical technique involves placing a pre-cooled metal tip directly onto a lesion and is particularly useful for round lesions on flat surfaces?", options: ["Open spray technique", "Chamber technique", "Slush therapy", "Closed technique (contact therapy)"], correctAnswer: 3, correctDebriefing: "Correct. The **closed technique**, also known as contact therapy, uses a cryoprobe—a pre-cooled metal tip—that is placed in direct contact with the lesion. This allows for a very controlled, predictable freeze zone, ideal for well-demarcated lesions on flat planes.", incorrectDebriefing: "Incorrect, Agent. The use of a pre-cooled metal tip placed directly on the skin is the definition of the **closed technique**, or contact therapy. The open technique involves a spray."},
      { question: "A patient presents with a firm, keratotic lesion on their ear helix that is very tender to the touch. A diagnosis of chondrodermatitis nodularis helicis (CNH) is made. Is cryosurgery a viable treatment option for this benign but painful condition?", options: ["Yes, it is listed as an amenable benign lesion", "No, it is contraindicated on the ear", "No, it is considered a malignant lesion", "Yes, but only with the chamber technique"], correctAnswer: 0, correctDebriefing: "Correct. **Chondrodermatitis nodularis helicis (CNH)** is listed as a benign lesion that is amenable to cryotherapy. The treatment can help resolve the inflammation and pain associated with this condition.", incorrectDebriefing: "Incorrect, Agent. According to the provided intelligence, **chondrodermatitis nodularis helicis** is a benign condition for which cryosurgery is a valid treatment option. You must be aware of all indicated targets."},
      { question: "Which cryogen has the coldest boiling point, making it the most potent agent for clinical cryosurgery?", options: ["Solid carbon dioxide (-79°C)", "Liquid nitrous oxide (-90°C)", "Liquid nitrogen (-196°C)", "Freon (-30°C)"], correctAnswer: 2, correctDebriefing: "Correct. **Liquid nitrogen** is the gold standard for clinical cryosurgery due to its extremely low boiling point of **-196°C**. This allows it to achieve the cell-lethal temperatures required for treating both benign and malignant lesions far more effectively than other cryogens.", incorrectDebriefing: "Incorrect, Agent. The most potent cryogen used in dermatology is **liquid nitrogen**, with a boiling point of **-196°C**. The other agents are significantly warmer and less effective for most applications."},
      { question: "Which of the following is NOT a common or expected side effect immediately following cryosurgery?", options: ["Edema and redness", "Vesicle or bulla formation", "Pseudoepitheliomatous hyperplasia", "Exudate and tissue sloughing"], correctAnswer: 2, correctDebriefing: "Correct. Edema, blistering, and sloughing are all expected parts of the acute healing process after cryosurgery. **Pseudoepitheliomatous hyperplasia** is a potential *late* complication, a benign reactive overgrowth of epidermis that can mimic a carcinoma and typically appears months later, not immediately.", incorrectDebriefing: "Incorrect, Agent. Blistering and sloughing are normal. **Pseudoepitheliomatous hyperplasia** is a rare, delayed reaction that occurs months after treatment. It is not an immediate side effect."},
      { question: "What is the primary cellular event that occurs during the initial phase of a fast freeze in cryosurgery?", options: ["Water leaves the cell via osmosis", "Ice crystals form in the extracellular space", "Intracellular ice crystals form", "Cell membranes dissolve"], correctAnswer: 1, correctDebriefing: "Excellent recall of the cryo-process. The initial event is the rapid freezing of the **extracellular space**. This creates an osmotic gradient, causing water to rush out of the cells, leading to cellular dehydration and an increased intracellular solute concentration.", incorrectDebriefing: "You've missed the first step, Agent. The very first event in the freezing process is the formation of ice crystals in the **extracellular space**. This is what sets up the osmotic gradient that drives subsequent cellular damage."},
      { question: "A few months after aggressive cryosurgery to the scalp for an actinic keratosis, a patient notes a permanent patch of hair loss at the treatment site. What is this side effect called?", options: ["Eschar formation", "Nail dystrophy", "Alopecia", "Milia"], correctAnswer: 2, correctDebriefing: "Correct. Hair follicles are sensitive to cold and can be permanently destroyed by cryosurgery. The resulting hair loss is known as **alopecia**. This is a predictable side effect when treating lesions in hair-bearing areas.", incorrectDebriefing: "Incorrect term, Agent. Permanent hair loss resulting from the destruction of hair follicles is called **alopecia**. This is an important potential side effect to counsel patients about when treating lesions on the scalp or eyebrows."},
      { question: "To treat a large, flat malignancy, a surgeon places a cone-shaped device on the skin and sprays the liquid nitrogen through it. What is this specialized variant of the open technique called?", options: ["Cryoprobe technique", "Chamber technique", "Contact technique", "Slush technique"], correctAnswer: 1, correctDebriefing: "Correct. This is the **Chamber technique**. By containing the liquid nitrogen spray within a chamber pressed against the skin, a much colder temperature is achieved more rapidly and with less lateral spread than a simple open spray. This makes it ideal for treating malignancies where a deep, uniform freeze is required.", incorrectDebriefing: "Incorrect technique, Agent. Using a device to contain the cryogen spray against the skin is known as the **Chamber technique**. It is a more aggressive variant of the open spray, reserved for lesions like malignancies that require a deeper, faster freeze."},
      { question: "What is the name of the cryotherapy technique that uses crushed solid carbon dioxide mixed with acetone?", options: ["Open spray", "Contact therapy", "Slush therapy", "Cryo-peel"], correctAnswer: 2, correctDebriefing: "Correct. **Slush therapy** is an older technique that involves creating a 'slush' of crushed solid carbon dioxide (dry ice) and acetone. This mixture is then dabbed onto the skin, typically for treating acne or other superficial conditions.", incorrectDebriefing: "Incorrect, Agent. The technique involving crushed dry ice and acetone is specifically known as **Slush therapy**. It is less common today with the wide availability of liquid nitrogen."},
      { question: "A patient experiences significant post-operative pain and blistering after cryosurgery. Is this an indication of an allergic reaction or a complication?", options: ["It indicates an allergic reaction to nitrogen", "It is a sign of secondary infection", "It is an expected part of the inflammatory response to tissue destruction", "It indicates the treatment was not cold enough"], correctAnswer: 2, correctDebriefing: "Correct. Pain, edema, redness, and blistering are not complications; they are the **expected and normal inflammatory response** to the acute tissue necrosis caused by freezing. Counseling the patient about these expected side effects beforehand is a critical part of the procedure.", incorrectDebriefing: "You have misidentified a normal reaction as a complication, Agent. Pain and blistering are **normal, expected outcomes** of cryosurgery. They are signs that the treatment was effective in causing tissue destruction. Proper patient counseling is key to managing these expectations."},
      { question: "Which cell type is the most resistant to cryosurgical destruction, requiring temperatures of -30°C to -35°C for necrosis?", options: ["Melanocytes", "Keratinocytes", "Dermal fibroblasts", "Basal cells"], correctAnswer: 2, correctDebriefing: "Correct. **Dermal fibroblasts**, the cells responsible for producing collagen and creating scars, are the most cryo-resistant of the cell types listed. They require temperatures of -30 to -35°C for destruction. This is why scarring can occur after aggressive cryosurgery deep enough to affect the dermis.", incorrectDebriefing: "Incorrect, Agent. Keratinocytes are destroyed at -20°C. The most resistant cells listed are the **dermal fibroblasts**, requiring temperatures down to -35°C. Their survival is why some wounds heal with scarring after cryosurgery."},
      { question: "What is the term for the ring of frozen tissue that extends beyond the visible border of the lesion during cryosurgery?", options: ["Freeze zone", "Ice halo", "Cryo-margin", "Thaw time"], correctAnswer: 1, correctDebriefing: "Correct terminology. The frozen margin of tissue extending beyond the lesion itself is known as the **ice halo** or halo freeze. The size of this halo is a clinical indicator of the depth and adequacy of the freeze, with a larger halo required for malignant lesions.", incorrectDebriefing: "Incorrect term, Agent. The frozen tissue margin beyond the lesion is called the **ice halo**. Monitoring the size of this halo is a key part of judging the adequacy of the treatment, especially for malignancies."},
      { question: "A patient undergoes cryosurgery for actinic cheilitis on the lip. Which of the following potential side effects is particularly important to warn them about in this location?", options: ["Alopecia", "Nail dystrophy", "Hypopigmentation and altered texture", "Prurigo nodularis"], correctAnswer: 2, correctDebriefing: "Correct. The lips are highly visible and cosmetically sensitive. **Hypopigmentation** is a very common side effect of cryosurgery due to the sensitivity of melanocytes. The patient must be warned that the treated area may become permanently lighter than the surrounding lip, and the texture may also be altered.", incorrectDebriefing: "While other side effects exist, you missed the most relevant one for this location. On the lip, the most important potential side effects to counsel a patient on are **hypopigmentation and textural changes**, as these will be highly visible and can be permanent."},
      { question: "Why is a slow freezing velocity less effective at cell destruction than a fast freezing velocity?", options: ["It allows the cell to repair itself during the freeze", "It causes only extracellular ice to form, allowing the cell to dehydrate but survive", "It is not as cold as a fast freeze", "It prevents the formation of any ice crystals"], correctAnswer: 1, correctDebriefing: "A key concept, correctly identified. A **slow freeze** allows time for water to move out of the cell via osmosis as the extracellular space freezes. This leads to cell dehydration, but the cell itself may survive the process. A fast freeze 'traps' water inside the cell, causing lethal intracellular ice formation.", incorrectDebriefing: "Incorrect, Agent. A slow freeze is less effective because it gives the cell time to adapt. Water moves out, and the cell simply dehydrates. A **fast freeze** is required to form the more lethal **intracellular** ice crystals."},
      { question: "What is the typical relationship between the freeze time and the thaw time in a properly executed cryosurgical procedure?", options: ["Thaw time is roughly half the freeze time", "Thaw time is roughly equal to the freeze time", "Thaw time is roughly twice the freeze time", "There is no relationship between the two"], correctAnswer: 2, correctDebriefing: "Correct. A good clinical rule of thumb is that the **thaw time will be approximately twice as long as the freeze time**. Monitoring this 'halo thaw time' is a useful way to gauge the depth and intensity of the freeze you delivered.", incorrectDebriefing: "Incorrect, Agent. There is a predictable relationship. The **thaw time is generally about double the freeze time**. If it thaws too quickly, your freeze was likely too superficial. This is a critical parameter for judging treatment adequacy."},
      { question: "The formation of milia (small keratin-filled cysts) can be a side effect of cryosurgery. This occurs due to the damage and subsequent abnormal healing of what skin structure?", options: ["Hair follicles", "Sebaceous glands", "Eccrine sweat ducts", "Blood vessels"], correctAnswer: 2, correctDebriefing: "Correct. Milia form when keratin becomes trapped beneath the skin surface. After cryosurgery, this can occur if the superficial portion of an **eccrine sweat duct** is damaged or occluded during the healing process, leading to the retention of keratin.", incorrectDebriefing: "Incorrect, Agent. Milia are cysts of trapped keratin. In the context of post-procedural healing, they often arise from damage to the superficial **eccrine sweat ducts**."},
      { question: "A surgeon is treating a small, superficial BCC with cryosurgery. How many freeze-thaw cycles are generally required to treat a malignant lesion effectively?", options: ["One short cycle", "One long cycle", "Two cycles", "Three or more cycles"], correctAnswer: 2, correctDebriefing: "Correct protocol. While benign lesions often require only one freeze-thaw cycle, malignant tumors like BCC are more resilient. The standard of care is to use **two cycles** to ensure a higher probability of complete tumor destruction.", incorrectDebriefing: "That is insufficient for a malignancy, Agent. A single cycle is for benign lesions. The standard protocol for treating a malignant tumor with cryosurgery is **two freeze-thaw cycles** to maximize cell kill."},
      { question: "What is the boiling point of liquid nitrous oxide, one of the cryogens used in cryosurgery?", options: ["-196°C", "-79°C", "-90°C", "-50°C"], correctAnswer: 2, correctDebriefing: "Correct. You've memorized your cryogen data. The boiling point of liquid nitrous oxide is **-90°C**. While colder than dry ice (-79°C), it is significantly warmer than liquid nitrogen (-196°C).", incorrectDebriefing: "Incorrect temperature, Agent. -196°C is for liquid nitrogen, and -79°C is for carbon dioxide. The boiling point of liquid nitrous oxide is **-90°C**."},
      { question: "Can cryotherapy be used to treat a keratoacanthoma (KA)?", options: ["No, KAs always require surgical excision", "Yes, it is listed as a potential treatment for premalignant/malignant lesions", "No, KAs are benign and do not require treatment", "Yes, but only if the lesion is on the trunk"], correctAnswer: 1, correctDebriefing: "Correct. According to the provided intelligence, a **keratoacanthoma** is listed among the premalignant and malignant lesions amenable to cryotherapy. While surgery is often preferred, cryosurgery is a recognized treatment modality for this SCC variant.", incorrectDebriefing: "Incorrect, Agent. You must know your treatment options. The provided list of lesions amenable to cryotherapy explicitly includes **keratoacanthoma**. While considered an SCC variant, it can be treated with cryosurgery."},
      { question: "A potential complication of cryosurgery on the distal digits, particularly near the nail or at the alar rim of the nose, is tissue notching or contracture. This is due to the destruction of what underlying structural tissue?", options: ["Epidermis", "Muscle", "Cartilage", "Bone"], correctAnswer: 2, correctDebriefing: "Correct. The ear and nose are supported by **cartilage**, which is avascular and susceptible to damage from deep cryosurgery. Destruction of this cartilage can lead to a permanent loss of structural support, resulting in a visible **notch** or deformity. This is a serious potential complication.", incorrectDebriefing: "Incorrect, Agent. The structural tissue at risk in the ear and nose is **cartilage**. A freeze deep enough to damage the perichondrium and underlying cartilage can lead to permanent structural deformity, or notching. This is a critical risk to consider." }
    ]

  wounds: {
    title: "Wound Management: Healing, Dressings and Care",
    questions: [
      { question: "Agent, you are assessing a wound. What is the single most important cell type for coordinating the entire wound healing cascade, responsible for everything from bacterial killing to angiogenesis and fibroblast recruitment?", options: ["Neutrophil", "Fibroblast", "Keratinocyte", "Macrophage"], correctAnswer: 3, correctDebriefing: "Correct. The **macrophage** is the master coordinator of wound healing. Arriving after the initial neutrophil wave, it cleans up debris, is potently bactericidal, and, most importantly, secretes a host of growth factors that orchestrate the subsequent proliferative phase, including angiogenesis and fibroplasia.", incorrectDebriefing: "Incorrect, Agent. While other cells are key players, the **macrophage** is the undisputed field commander of wound healing. Without it, the process stalls and fails."},
      { question: "During the proliferative phase of wound healing, fibroblasts begin to produce new extracellular matrix. What is the initial, predominant type of collagen laid down in a new wound?", options: ["Type I Collagen", "Type II Collagen", "Type III Collagen", "Type IV Collagen"], correctAnswer: 1, correctDebriefing: "Correct. Initially, fibroblasts rapidly secrete **Type II Collagen**. This is a weaker, more disorganized form of collagen that acts as a temporary scaffold. During the later remodeling phase, this is replaced by the much stronger and more organized Type I collagen. Note: some sources cite Type III, but the provided intel specifies Type II.", incorrectDebriefing: "Incorrect, Agent. The strong Type I collagen is the final product. The initial, weaker scaffold laid down by fibroblasts in a new wound is **Type II Collagen**, which is later remodeled."},
      { question: "A patient with scurvy presents with poor wound healing. This is due to a deficiency in Vitamin C, which is a required cofactor for what critical step in collagen biosynthesis?", options: ["Transcription of collagen genes", "Translation of collagen proteins", "Hydroxylation of proline and lysine residues", "Cross-linking of collagen fibers"], correctAnswer: 2, correctDebriefing: "Excellent biochemical knowledge. Vitamin C is essential for the **hydroxylation** of proline and lysine residues on pro-collagen chains. Without this step, the collagen molecule cannot form a stable triple helix, resulting in weak, defective connective tissue and impaired wound healing.", incorrectDebriefing: "Incorrect, Agent. Vitamin C's critical role is as a cofactor for the enzymes responsible for the **hydroxylation** of collagen. Without it, stable collagen cannot be formed, leading to the classic symptoms of scurvy, including poor wound healing."},
      { question: "What is the primary glycosaminoglycan found in the ground substance of wounded tissue, responsible for absorbing water and creating a hydrated environment for cell migration?", options: ["Chondroitin sulfate", "Dermatan sulfate", "Heparan sulfate", "Hyaluronic acid"], correctAnswer: 3, correctDebriefing: "Correct. **Hyaluronic acid** is the primary glycosaminoglycan in the provisional wound matrix. Its ability to bind vast amounts of water creates the moist, gel-like environment that is essential for nutrient diffusion and the migration of cells like keratinocytes and fibroblasts.", incorrectDebriefing: "Incorrect, Agent. The key component of the ground substance in early wounds, responsible for hydration and facilitating cell movement, is **hyaluronic acid**."},
      { question: "Which type of occlusive dressing is composed of a hydrophobic polyurethane, is highly absorbent, and is ideal for moderate to highly exudative wounds?", options: ["Film dressing", "Hydrogel dressing", "Foam dressing", "Hydrocolloid dressing"], correctAnswer: 2, correctDebriefing: "Correct. **Foam dressings** are made of polyurethane and are designed to be highly absorbent. They can wick away and hold large amounts of exudate, making them the ideal choice for wounds with moderate to heavy drainage.", incorrectDebriefing: "Incorrect dressing, Agent. For a highly exudative wound, you need a highly absorbent dressing. The correct choice is a **foam dressing**. A hydrogel would be for a dry wound, and a film dressing cannot handle significant exudate."},
      { question: "A surgeon chooses a hydrocolloid dressing for a pressure ulcer. When the dressing is removed, a yellow-brown, foul-smelling gel is present in the wound bed. What is this gel?", options: ["It is a sign of a severe Pseudomonas infection", "It is the result of the hydrophilic particles of the dressing interacting with wound exudate", "It indicates the wound is becoming necrotic", "It is an allergic reaction to the dressing"], correctAnswer: 1, correctDebriefing: "Correct. This is a classic and important finding. The yellow-brown, malodorous gel is **not pus**. It is the expected result of the hydrophilic colloidal particles in the dressing absorbing wound fluid and forming a gel. This can be easily confused with infection by an inexperienced operative.", incorrectDebriefing: "Do not be fooled, Agent. That is not an infection. The yellow, smelly gel under a hydrocolloid dressing is the **normal by-product of the dressing interacting with wound exudate**. It is an expected finding."},
      { question: "Which type of dressing is derived from seaweed, contains calcium, and is best suited for highly exudative wounds like refractory decubitus ulcers?", options: ["Foam dressing", "Hydrogel dressing", "Film dressing", "Alginate dressing"], correctAnswer: 3, correctDebriefing: "Correct. **Alginate dressings**, derived from seaweed, are extremely absorbent and form a gel upon contact with wound exudate. The calcium ions in the dressing can also contribute to hemostasis. They are a primary choice for managing wounds with very heavy drainage.", incorrectDebriefing: "Incorrect dressing, Agent. The dressing derived from seaweed and used for highly exudative wounds is an **alginate dressing**. Remember to soak it with saline before removal to prevent trauma."},
      { question: "What is the primary advantage of maintaining a moist wound environment with an occlusive dressing?", options: ["It prevents all scar formation", "It allows the wound to be checked less frequently", "It speeds re-epithelialization and decreases pain and infection risk", "It promotes the formation of a dry, hard scab"], correctAnswer: 2, correctDebriefing: "Correct. A moist environment is the cornerstone of modern wound care. It **speeds up keratinocyte migration (re-epithelialization)**, reduces pain by keeping nerve endings hydrated, and lowers infection rates by preventing the formation of a scab, which can trap bacteria. This is far superior to the old method of letting a wound 'air out'.", incorrectDebriefing: "Your thinking is outdated, Agent. A dry scab impedes healing. The goal is a **moist wound environment**, which has been definitively shown to accelerate re-epithelialization, reduce pain, and lower infection risk."},
      { question: "A patient with a venous leg ulcer is being treated with compression therapy. Prior to applying compression, adequate arterial flow must be verified. What is the Ankle-Brachial Index (ABI) value below which compression therapy is contraindicated?", options: ["< 1.0", "< 0.8", "< 0.5", "ABI does not affect the decision"], correctAnswer: 2, correctDebriefing: "A critical safety parameter. An Ankle-Brachial Index **less than 0.5** indicates severe peripheral arterial disease. Applying external compression in this setting could overcome the arterial pressure and lead to limb-threatening ischemia. Compression is absolutely contraindicated in these patients.", incorrectDebriefing: "That is a dangerous decision, Agent. You must check the ABI first. An ABI of **< 0.5** indicates severe arterial insufficiency, and applying compression could result in the loss of the limb. It is an absolute contraindication."},
      { question: "What is the most important cell in the proliferative phase of wound healing, responsible for producing the extracellular matrix and driving wound contraction?", options: ["Macrophage", "Keratinocyte", "Fibroblast", "Endothelial cell"], correctAnswer: 2, correctDebriefing: "Correct. The **fibroblast** is the workhorse of the proliferative phase. It migrates into the wound and begins synthesizing the components of the new extracellular matrix, including collagen and ground substance. A specialized phenotype, the myofibroblast, is responsible for wound contraction.", incorrectDebriefing: "Incorrect, Agent. The macrophage is the director, but the **fibroblast** is the builder. It is the cell responsible for producing the collagen and matrix that fill the wound defect during the proliferative phase."},
      { question: "A wound that involves loss of the epidermis and the entire dermis is classified as what depth?", options: ["Erosion", "Partial-thickness", "Full-thickness", "Superficial"], correctAnswer: 2, correctDebriefing: "Correct. A **full-thickness** wound extends through the epidermis and the entire dermal layer, potentially into the subcutaneous fat. Because all adnexal structures are lost, these wounds heal with significant scar formation and contraction.", incorrectDebriefing: "Incorrect classification, Agent. Loss of both the epidermis and the entire dermis defines a **full-thickness** wound. An erosion is epidermis only, and a partial-thickness wound spares some dermis."},
      { question: "Which type of non-biologic occlusive dressing is composed primarily of water (80-96%) in a hydrophilic polymer, making it ideal for hydrating dry wounds?", options: ["Foam", "Film", "Hydrogel", "Hydrocolloid"], correctAnswer: 2, correctDebriefing: "Correct. As its name implies, a **hydrogel** dressing has a very high water content. This makes it an excellent choice for donating moisture to a dry wound bed, promoting autolytic debridement, and providing a cooling, soothing effect.", incorrectDebriefing: "Incorrect dressing, Agent. For a dry wound that needs hydration, the choice is a **hydrogel**. Foam and alginates are for absorbing exudate, not providing it."},
      { question: "What is the most common type of chronic ulcer?", options: ["Arterial ulcers", "Diabetic/neuropathic ulcers", "Pressure ulcers", "Venous ulcers"], correctAnswer: 3, correctDebriefing: "Correct. **Venous ulcers**, caused by chronic venous insufficiency and hypertension, are by far the most common type of chronic leg ulcer, accounting for approximately 80% of all cases.", incorrectDebriefing: "Incorrect, Agent. You must know the most common adversary. **Venous ulcers** are the most prevalent type of chronic ulcer encountered."},
      { question: "The remodeling phase of wound healing can last for a year or more. What is the primary process occurring during this phase?", options: ["Inflammation and angiogenesis", "Re-epithelialization", "Production of new collagen", "Re-structuring of the extracellular matrix and replacement of Type II collagen with Type I"], correctAnswer: 3, correctDebriefing: "Correct. The remodeling phase is a long-term process of reorganizing the scar. The primary event is the replacement of the weak, disorganized Type II collagen with the stronger, more organized **Type I collagen**. This process increases the tensile strength of the wound, although it never reaches 100% of its original strength.", incorrectDebriefing: "Incorrect, Agent. The remodeling phase is all about improving strength and structure. The key process is the replacement of weak Type II collagen with strong **Type I collagen**, leading to a more mature and durable scar."},
      { question: "Which topical agent used in post-operative wound care has the lowest risk of causing allergic contact dermatitis?", options: ["Neomycin", "Bacitracin", "Polymyxin B", "White petrolatum"], correctAnswer: 3, correctDebriefing: "Correct. While topical antibiotics are widely used, they carry a significant risk of causing allergic contact dermatitis. Studies have shown that plain **white petrolatum** provides a comparable moist healing environment and low infection rate without the risk of sensitization. It is often the preferred agent.", incorrectDebriefing: "Incorrect, Agent. Topical antibiotics, especially neomycin and bacitracin, are common sensitizers. The agent with the lowest risk of contact dermatitis is simple **white petrolatum**."},
      { question: "Which of the following is NOT a primary function of a wound dressing?", options: ["Absorption of wound drainage", "Permanent closure of the wound", "Maintenance of a moist environment", "Providing compression"], correctAnswer: 1, correctDebriefing: "Correct. A dressing is a temporary measure. Its functions include providing coverage, managing exudate, maintaining a moist environment, and offering compression. It does **not provide permanent wound closure**; that is the job of sutures, staples, or the body's own healing processes.", incorrectDebriefing: "Incorrect, Agent. A dressing is a cover, not a closure method. Its functions are protection, exudate management, and maintaining a moist environment. It does **not permanently close the wound**."},
      { question: "Which type of non-biologic dressing is a thin, transparent polyurethane membrane that is permeable to gas but impermeable to fluid and bacteria?", options: ["Foam", "Film", "Hydrogel", "Alginate"], correctAnswer: 1, correctDebriefing: "Correct. A **film dressing** (e.g., Tegaderm, Opsite) is a thin, transparent sheet of polyurethane. It is semi-permeable, allowing oxygen and water vapor to pass through, but provides a barrier against liquid and bacteria. It is ideal for covering IV sites or low-exudate wounds.", incorrectDebriefing: "Incorrect dressing type, Agent. The thin, transparent, semi-permeable dressing is a **film dressing**. It allows you to visualize the wound while protecting it."},
      { question: "A patient develops an allergic contact dermatitis reaction after using a standard adhesive bandage. This is most often a reaction to the adhesive itself and is caused by what mechanism?", options: ["A true IgE-mediated allergy", "An irritant reaction from the chemicals", "Tape stripping of the epidermis with daily dressing changes", "A sign of wound infection"], correctAnswer: 2, correctDebriefing: "Correct. While true allergy to adhesives can occur, the most common 'tape reaction' is not a true allergy but rather mechanical irritation caused by **tape stripping**. With each daily dressing change, the adhesive rips off the outermost layer of the epidermis, leading to cumulative irritation, inflammation, and breakdown of the skin barrier.", incorrectDebriefing: "Incorrect mechanism, Agent. Most tape reactions are not true allergies. They are a form of mechanical irritant dermatitis caused by the repeated **stripping of the epidermis** with each dressing change."},
      { question: "What is the primary goal of treatment for an arterial ulcer?", options: ["To apply high-level compression", "To aggressively debride the wound", "To re-establish arterial flow to the limb", "To keep the wound as dry as possible"], correctAnswer: 2, correctDebriefing: "Correct. An arterial ulcer is caused by a lack of blood supply (ischemia). While wound care is important, the ulcer will not heal unless the underlying problem is addressed. The ultimate goal is to **re-establish arterial flow**, either through medical management (e.g., anti-platelet agents, risk factor reduction) or surgical re-vascularization.", incorrectDebriefing: "You are treating the wound, not the cause, Agent. An arterial ulcer is an ischemic problem. The primary goal must be to **re-establish arterial blood flow** to the affected limb."},
      { question: "For patients with pressure ulcers, what is the single most important intervention?", options: ["Application of advanced dressings", "Nutritional optimization", "Pressure relief", "Surgical debridement"], correctAnswer: 2, correctDebriefing: "Correct. A pressure ulcer is caused by sustained, unrelieved pressure on the skin, which cuts off blood flow and causes tissue necrosis. While dressings and nutrition are vital, the ulcer cannot heal, and new ones will form, unless the causative factor—**pressure**—is removed. Frequent repositioning and specialized mattresses are the cornerstones of treatment.", incorrectDebriefing: "Incorrect, Agent. You can't heal a pressure ulcer while the pressure is still on. The absolute primary intervention is **pressure relief**. All other treatments will fail without it." }
    ]

            const modalBtn = document.getElementById('modal-btn');
            const backToMissionsBtn = document.getElementById('back-to-missions-btn');

            let currentMissionKey = null;
            let currentMissionQuestions = [];
            let currentQuestionIndex = 0;

            function initializeTerminal() {
                missionList.innerHTML = '';
                Object.keys(missionData).forEach(key => {
                    const mission = missionData[key];
                    const btn = document.createElement('button');
                    btn.textContent = mission.title;
                    btn.className = 'w-full p-6 rounded-lg text-xl font-semibold transition-all duration-300 border-2 border-sky-700 bg-blue-900 bg-opacity-50 mission-btn';
                    btn.onclick = () => startMission(key);
                    missionList.appendChild(btn);
                });
                missionSelectionScreen.classList.remove('hidden');
                gameScreen.classList.add('hidden');
                finalScreen.classList.add('hidden');
            }

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            function startMission(key) {
                currentMissionKey = key;
                currentMissionQuestions = [...missionData[key].questions];
                shuffleArray(currentMissionQuestions);
                currentQuestionIndex = 0;
                missionSelectionScreen.classList.add('hidden');
                gameScreen.classList.remove('hidden');
                finalScreen.classList.add('hidden');
                missionTitleEl.textContent = missionData[key].title;
                totalMissionsEl.textContent = currentMissionQuestions.length;
                showQuestion();
            }

            function showQuestion() {
                if (currentQuestionIndex >= currentMissionQuestions.length) { showFinalScreen(); return; }
                const q = currentMissionQuestions[currentQuestionIndex];
                missionNumberEl.textContent = `${currentQuestionIndex + 1}`;
                currentProgressEl.textContent = currentQuestionIndex;
                progressBar.style.width = `${((currentQuestionIndex) / currentMissionQuestions.length) * 100}%`;
                questionTextEl.textContent = q.question;
                optionsContainer.innerHTML = '';
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.textContent = opt;
                    btn.className = 'w-full p-4 rounded-lg text-lg font-semibold text-left transition-all duration-300 border-2 border-sky-700 bg-blue-900 bg-opacity-50 option-btn';
                    btn.onclick = () => selectAnswer(idx);
                    optionsContainer.appendChild(btn);
                });
            }

            function selectAnswer(idx) {
                const q = currentMissionQuestions[currentQuestionIndex];
                const correct = idx === q.correctAnswer;
                showDebriefing(correct, correct ? q.correctDebriefing : q.incorrectDebriefing);
            }

            function showDebriefing(isCorrect, text) {
    modalTitle.textContent = isCorrect ? "Analysis Confirmed" : "Mission Compromised";
    modalTitle.className = `font-orbitron text-3xl font-bold mb-4 ${isCorrect ? 'text-green-300' : 'text-red-400'}`;

    // Set the icon for correct/incorrect
    modalIcon.innerHTML = isCorrect ? 
        `<svg class="w-16 h-16 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>` :
        `<svg class="w-16 h-16 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;

    modalText.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong class="text-sky-300">$1</strong>'); // Support markdown bolding

    modal.classList.remove('hidden', 'modal-leave', 'modal-leave-active');
    modal.classList.add('modal-enter', 'modal-enter-active');
}
            modalBtn.addEventListener('click', () => {
    currentQuestionIndex++;
    modal.classList.remove('modal-enter-active');
    modal.classList.add('modal-leave-active');
    // Wait for animation to finish before hiding
    setTimeout(() => {
        modal.classList.add('hidden');
        showQuestion();
    }, 300);
});
            backToMissionsBtn.addEventListener('click', initializeTerminal);
            restartBtn.addEventListener('click', initializeTerminal);
            initializeTerminal();
        });
    </script>
</body>
</html>
