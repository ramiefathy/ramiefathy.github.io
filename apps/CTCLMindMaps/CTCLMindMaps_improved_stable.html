<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTCL Diagnostic Workup Mind Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include the D3.js library -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CTCL/css/main.css">
</head>
<body class="bg-slate-50 flex flex-col items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-6xl text-center mb-4">
        <h1 class="text-3xl md:text-4xl font-bold text-slate-800">CTCL Diagnostic Workup</h1>
        <p class="text-slate-600 mt-2 text-lg">An interactive mind map of key labs and studies.</p>
    </div>

    <div class="w-full max-w-6xl mb-4 relative z-20">
        <div class="flex gap-2 justify-center">
            <input type="text" id="search-input" placeholder="Search conditions, treatments, mechanisms..." 
                   class="w-full max-w-md px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="clear-search" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300 transition">
                Clear
            </button>
        </div>
        <!-- Container for Global Search Results -->
        <div id="search-results-container" class="absolute top-full left-1/2 -translate-x-1/2 w-full max-w-md mt-1"></div>
    </div>

    <div class="w-full max-w-6xl px-2">
        <div class="border-b border-slate-200">
            <div id="tab-bar" class="flex justify-center tab-container">
                <div id="tab-question" class="tab active tab-group-blue" data-tab="question">View by Question</div>
                <div id="tab-test" class="tab tab-group-blue" data-tab="test">View by Test Type</div>
                <div id="tab-staging" class="tab tab-group-blue mr-4" data-tab="staging">Staging</div>
                <div id="tab-subtypes" class="tab tab-group-purple mr-4">
                    Subtypes ▾
                    <div class="dropdown">
                        <a href="#" class="dropdown-item" data-tab="subtypes-overall">Overall View</a>
                        <a href="#" class="dropdown-item" data-tab="subtypes-immuno">By Immunophenotype</a>
                        <a href="#" class="dropdown-item" data-tab="subtypes-pattern">By Histologic Pattern</a>
                        <a href="#" class="dropdown-item" data-tab="subtypes-ebv">By EBV Association</a>
                    </div>
                </div>
                <div id="tab-treatment" class="tab tab-group-green">
                    Treatment ▾
                    <div class="dropdown">
                        <a href="#" class="dropdown-item" data-tab="treatment">By Therapy Type</a>
                        <a href="#" class="dropdown-item" data-tab="treatment-stage">By Disease Stage</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="mind-map-container" class="w-full max-w-6xl aspect-[4/3] bg-white rounded-xl shadow-lg border border-slate-200 mt-4 relative">
        <div class="absolute top-4 right-4 flex flex-col gap-2 z-10">
            <div class="flex gap-2">
                <button id="expand-all" class="px-3 py-1 bg-blue-500 text-white rounded-lg text-sm hover:bg-blue-600 transition" title="Expand All Nodes">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                </button>
                <button id="collapse-all" class="px-3 py-1 bg-gray-500 text-white rounded-lg text-sm hover:bg-gray-600 transition" title="Collapse All Nodes">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
                </button>
            </div>
            <div class="flex gap-2">
                <button id="zoom-in" class="px-3 py-1 bg-slate-500 text-white rounded-lg text-sm hover:bg-slate-600 transition" title="Zoom In (+)">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"></path></svg>
                </button>
                <button id="zoom-out" class="px-3 py-1 bg-slate-500 text-white rounded-lg text-sm hover:bg-slate-600 transition" title="Zoom Out (-)">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7"></path></svg>
                </button>
                <button id="zoom-reset" class="px-3 py-1 bg-slate-500 text-white rounded-lg text-sm hover:bg-slate-600 transition" title="Reset Zoom (Ctrl+0)">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>
        </div>
        <div id="mind-map-view-container" class="w-full h-full"></div>
    </div>
    <div id="tooltip" class="tooltip"></div>

    <!-- Data for this specific mind map -->
    <script src="CTCL/js/data.js"></script>
    
    <!-- Shared library -->
    <script src="../shared/d3-renderer.js"></script>
    <script src="../shared/app.js"></script>

    <!-- App-specific initialization -->
    <script src="CTCL/js/main.js"></script>
</body>
</html>
