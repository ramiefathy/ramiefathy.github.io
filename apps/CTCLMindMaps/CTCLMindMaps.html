<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTCL Diagnostic Workup Mind Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include the D3.js library -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-slate-50 flex flex-col items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-6xl text-center mb-4">
        <h1 class="text-3xl md:text-4xl font-bold text-slate-800">Cutaneous T-Cell Lymphoma (CTCL)</h1>
        <p class="text-slate-600 mt-2 text-lg">An Interactive Guide to Diagnosis, Staging, and Management.</p>
    </div>

    <!-- Search Section -->
    <div class="w-full max-w-6xl mb-4 relative z-20">
        <div class="flex gap-2 justify-center">
            <input type="text" id="search-input" placeholder="Search subtypes, tests, treatments..."
                   class="w-full max-w-md px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button id="clear-search" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300 transition">
                Clear
            </button>
        </div>
        <!-- Container for Global Search Results -->
        <div id="search-results-container" class="absolute top-full left-1/2 -translate-x-1/2 w-full max-w-md mt-1"></div>
    </div>

    <div class="w-full max-w-6xl px-2">
        <div class="border-b border-slate-200">
            <div id="tab-bar" class="tab-container">
                <!-- First row: Workup & Staging -->
                <div class="flex justify-center flex-wrap">
                    <div id="tab-question" class="tab active tab-group-blue" data-tab="question">Workup: By Question</div>
                    <div id="tab-test" class="tab tab-group-blue" data-tab="test">Workup: By Test</div>
                    <div id="tab-staging" class="tab tab-group-blue" data-tab="staging">TNMB Staging</div>
                </div>
                <!-- Second row: Subtypes -->
                <div class="flex justify-center flex-wrap mt-1">
                    <div id="tab-subtypes-overall" class="tab tab-group-purple" data-tab="subtypes-overall">Subtypes: Overview</div>
                    <div id="tab-subtypes-immuno" class="tab tab-group-purple" data-tab="subtypes-immuno">Subtypes: Immunophenotype</div>
                    <div id="tab-subtypes-pattern" class="tab tab-group-purple" data-tab="subtypes-pattern">Subtypes: Histologic Pattern</div>
                    <div id="tab-subtypes-ebv" class="tab tab-group-purple" data-tab="subtypes-ebv">Subtypes: EBV Association</div>
                </div>
                <!-- Third row: Treatment -->
                <div class="flex justify-center flex-wrap mt-1">
                    <div id="tab-treatment" class="tab tab-group-green" data-tab="treatment">Treatment: By Therapy Type</div>
                    <div id="tab-treatment-stage" class="tab tab-group-green" data-tab="treatment-stage">Treatment: By Stage</div>
                </div>
            </div>
        </div>
    </div>

    <div id="mind-map-container" class="w-full max-w-6xl aspect-[4/3] bg-white rounded-xl shadow-lg border border-slate-200 mt-4 relative overflow-hidden">
        <!-- UI Controls -->
        <div class="absolute top-4 right-4 flex flex-col gap-2 z-10">
            <div class="flex gap-2">
                <button id="expand-all" class="px-3 py-1 bg-indigo-500 text-white rounded-lg text-sm hover:bg-indigo-600 transition" title="Expand All Nodes">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                </button>
                <button id="collapse-all" class="px-3 py-1 bg-gray-500 text-white rounded-lg text-sm hover:bg-gray-600 transition" title="Collapse All Nodes">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
                </button>
            </div>
            <div class="flex gap-2">
                <button id="zoom-in" class="px-3 py-1 bg-slate-500 text-white rounded-lg text-sm hover:bg-slate-600 transition" title="Zoom In (+)">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"></path></svg>
                </button>
                <button id="zoom-out" class="px-3 py-1 bg-slate-500 text-white rounded-lg text-sm hover:bg-slate-600 transition" title="Zoom Out (-)">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7"></path></svg>
                </button>
                <button id="zoom-reset" class="px-3 py-1 bg-slate-500 text-white rounded-lg text-sm hover:bg-slate-600 transition" title="Reset Zoom (Ctrl+0)">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>
        </div>
        <!-- Single view container - reduces HTML by 85% -->
        <div id="mind-map-view-container" class="w-full h-full" data-current-tab="question"></div>
    </div>
    <div id="tooltip" class="tooltip"></div>

    <script src="js/data.js"></script>
    <script src="../../shared/d3-renderer.js"></script>
    <script src="../../shared/app.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
