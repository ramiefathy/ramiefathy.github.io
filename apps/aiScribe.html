<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Medical Scribe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .transcript-container { min-height: 200px; }
        .loading { display: none; }
        .loading.active { display: block; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .note-section { border: 1px solid #e5e7eb; border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem; }
        .note-section h3 { font-weight: 600; margin-bottom: 0.5rem; }
        .note-section textarea { width: 100%; min-height: 100px; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.375rem; }
        .suggestion { background-color: #f3f4f6; padding: 0.5rem; border-radius: 0.375rem; margin-bottom: 0.5rem; cursor: pointer; }
        .suggestion:hover { background-color: #e5e7eb; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">AI Medical Scribe</h1>
            <p class="text-gray-600">Transcribe and enhance your medical notes with AI assistance</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Left Column: Recording and Transcription -->
            <div class="space-y-6">
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-xl font-semibold mb-4">Voice Recording</h2>
                    <div class="flex space-x-4 mb-4">
                        <button id="startRecording" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                            Start Recording
                        </button>
                        <button id="stopRecording" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded" disabled>
                            Stop Recording
                        </button>
                    </div>
                    <div class="loading mb-4">
                        <div class="spinner mx-auto"></div>
                        <p class="text-center text-gray-600 mt-2">Processing audio...</p>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-xl font-semibold mb-4">Transcription</h2>
                    <div class="transcript-container bg-gray-50 p-4 rounded-lg">
                        <p id="transcript" class="text-gray-700"></p>
                    </div>
                </div>
            </div>

            <!-- Right Column: Note Sections -->
            <div class="space-y-6">
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-xl font-semibold mb-4">Structured Note</h2>
                    
                    <div class="note-section">
                        <h3>Chief Complaint</h3>
                        <textarea id="chiefComplaint" placeholder="Enter chief complaint..."></textarea>
                    </div>

                    <div class="note-section">
                        <h3>History of Present Illness</h3>
                        <textarea id="hpi" placeholder="Enter history of present illness..."></textarea>
                    </div>

                    <div class="note-section">
                        <h3>Physical Examination</h3>
                        <textarea id="physicalExam" placeholder="Enter physical examination findings..."></textarea>
                    </div>

                    <div class="note-section">
                        <h3>Assessment & Plan</h3>
                        <textarea id="assessmentPlan" placeholder="Enter assessment and plan..."></textarea>
                    </div>

                    <div class="flex justify-end space-x-4 mt-4">
                        <button id="generateNote" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
                            Generate Note
                        </button>
                        <button id="clearAll" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">
                            Clear All
                        </button>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-xl font-semibold mb-4">AI Suggestions</h2>
                    <div id="suggestions" class="space-y-2">
                        <!-- Suggestions will be populated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const startRecordingBtn = document.getElementById('startRecording');
        const stopRecordingBtn = document.getElementById('stopRecording');
        const transcriptEl = document.getElementById('transcript');
        const loadingEl = document.querySelector('.loading');
        const generateNoteBtn = document.getElementById('generateNote');
        const clearAllBtn = document.getElementById('clearAll');
        const suggestionsEl = document.getElementById('suggestions');

        // State
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        // Initialize
        async function initializeRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    await processAudio(audioBlob);
                };

                startRecordingBtn.disabled = false;
            } catch (err) {
                console.error('Error accessing microphone:', err);
                alert('Error accessing microphone. Please ensure you have granted microphone permissions.');
            }
        }

        // Event Listeners
        startRecordingBtn.addEventListener('click', () => {
            audioChunks = [];
            mediaRecorder.start();
            isRecording = true;
            startRecordingBtn.disabled = true;
            stopRecordingBtn.disabled = false;
            transcriptEl.textContent = 'Recording...';
        });

        stopRecordingBtn.addEventListener('click', () => {
            mediaRecorder.stop();
            isRecording = false;
            startRecordingBtn.disabled = false;
            stopRecordingBtn.disabled = true;
            loadingEl.classList.add('active');
        });

        generateNoteBtn.addEventListener('click', async () => {
            const noteData = {
                chiefComplaint: document.getElementById('chiefComplaint').value,
                hpi: document.getElementById('hpi').value,
                physicalExam: document.getElementById('physicalExam').value,
                assessmentPlan: document.getElementById('assessmentPlan').value
            };

            try {
                loadingEl.classList.add('active');
                const response = await generateAISuggestions(noteData);
                displaySuggestions(response);
            } catch (err) {
                console.error('Error generating suggestions:', err);
                alert('Error generating suggestions. Please try again.');
            } finally {
                loadingEl.classList.remove('active');
            }
        });

        clearAllBtn.addEventListener('click', () => {
            document.getElementById('chiefComplaint').value = '';
            document.getElementById('hpi').value = '';
            document.getElementById('physicalExam').value = '';
            document.getElementById('assessmentPlan').value = '';
            transcriptEl.textContent = '';
            suggestionsEl.innerHTML = '';
        });

        // Helper Functions
        async function processAudio(audioBlob) {
            try {
                // Here you would typically send the audio to a speech-to-text service
                // For now, we'll simulate a response
                await new Promise(resolve => setTimeout(resolve, 1000));
                transcriptEl.textContent = "This is a simulated transcription. In a real implementation, this would be the output from a speech-to-text service.";
                
                // Generate suggestions based on the transcription
                const suggestions = await generateAISuggestions({
                    transcription: transcriptEl.textContent
                });
                displaySuggestions(suggestions);
            } catch (err) {
                console.error('Error processing audio:', err);
                alert('Error processing audio. Please try again.');
            } finally {
                loadingEl.classList.remove('active');
            }
        }

        async function generateAISuggestions(data) {
            // Simulate AI suggestions
            // In a real implementation, this would call an AI service
            return [
                {
                    section: "HPI",
                    suggestion: "Consider adding duration and severity of symptoms."
                },
                {
                    section: "Physical Exam",
                    suggestion: "Add vital signs if available."
                },
                {
                    section: "Assessment",
                    suggestion: "Consider adding differential diagnoses."
                }
            ];
        }

        function displaySuggestions(suggestions) {
            suggestionsEl.innerHTML = suggestions.map(s => `
                <div class="suggestion" onclick="applySuggestion('${s.section}', '${s.suggestion}')">
                    <strong>${s.section}:</strong> ${s.suggestion}
                </div>
            `).join('');
        }

        function applySuggestion(section, suggestion) {
            const textarea = document.getElementById(section.toLowerCase().replace(/\s+/g, ''));
            if (textarea) {
                const currentText = textarea.value;
                textarea.value = currentText ? `${currentText}\n${suggestion}` : suggestion;
            }
        }

        // Initialize the app
        initializeRecording();
    </script>
</body>
</html>
