<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Scheduler Pro - Firebase Edition</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React and dependencies -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script type="module">
        import * as dateFns from 'https://esm.sh/date-fns@2.30.0?bundle';
        import * as Recharts from 'https://esm.sh/recharts@2.5.0?bundle';
        import Papa from 'https://esm.sh/papaparse@5.4.1?bundle';
        import * as lucide from 'https://esm.sh/lucide@0.462.0?bundle';
        window['date-fns'] = dateFns;
        window.Recharts = Recharts;
        window.Papa = Papa;
        window.lucide = lucide;
    </script>

    <!-- Additional Libraries -->

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                            950: '#172554'
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'scale-in': 'scaleIn 0.2s ease-out',
                        'gradient': 'gradient 15s ease infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        scaleIn: {
                            '0%': { transform: 'scale(0.95)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        },
                        gradient: {
                            '0%, 100%': {
                                'background-size': '200% 200%',
                                'background-position': 'left center'
                            },
                            '50%': {
                                'background-size': '200% 200%',
                                'background-position': 'right center'
                            }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Modern scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Animated gradient background */
        .animated-gradient {
            background: linear-gradient(-45deg, #eff6ff, #dbeafe, #bfdbfe, #93c5fd);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Calendar styles */
        .calendar-grid {
            display: grid;
            grid-template-columns: 100px repeat(5, 1fr);
            grid-auto-rows: minmax(120px, auto);
            gap: 1px;
            background: #e5e7eb;
        }

        .time-slot {
            background: white;
            position: relative;
            min-height: 120px;
        }

        .time-slot.continuity {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
        }

        .time-slot.protected {
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
        }

        .assignment-card {
            background-color: #ffffff;
            border-radius: 0.5rem;
            padding: 0.5rem;
            margin: 0.25rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e7eb;
            font-size: 0.75rem;
            line-height: 1rem;
            cursor: move;
            transition: all 0.2s ease-in-out;
        }

        .assignment-card:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        .assignment-card.dragging {
            opacity: 0.5;
        }

        .drop-indicator {
            border: 2px dashed #60a5fa;
            background-color: #eff6ff;
        }

        /* Smooth transitions for all interactive elements */
        button, a, .card, .assignment-card {
            transition: all 0.2s ease;
        }

        /* Pulse animation for live indicator */
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="modal-root"></div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import {
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            signOut,
            onAuthStateChanged,
            sendPasswordResetEmail
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import {
            initializeFirestore,
            getFirestore,
            persistentLocalCache,
            persistentMultipleTabManager,
            doc,
            setDoc,
            getDoc,
            getDocs,
            collection,
            query,
            where,
            orderBy,
            limit,
            onSnapshot,
            addDoc,
            updateDoc,
            deleteDoc,
            serverTimestamp,
            writeBatch,
            arrayUnion,
            arrayRemove,
            increment
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import {
            getFunctions,
            httpsCallable,
            connectFunctionsEmulator
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js';

        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAbXy67A6-YqAvpVTlNpEmUGLSmg7sveKU",
            authDomain: "ramie-89f9f.firebaseapp.com",
            projectId: "ramie-89f9f",
            storageBucket: "ramie-89f9f.firebasestorage.app",
            messagingSenderId: "945513436571",
            appId: "1:945513436571:web:b821a821e29bc52f63c9f6",
            measurementId: "G-JHWKCQNPNR"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        let db;
        try {
            db = initializeFirestore(app, {
                localCache: persistentLocalCache({
                    tabManager: persistentMultipleTabManager()
                })
            });
        } catch (error) {
            console.warn('Falling back to in-memory Firestore cache', error);
            db = getFirestore(app);
        }
        const functions = getFunctions(app);

        // Connect to Functions emulator if in development
        if (location.hostname === 'localhost') {
            connectFunctionsEmulator(functions, 'localhost', 5001);
        }

        // Make Firebase available globally
        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebase = {
            auth: {
                signInWithEmailAndPassword,
                createUserWithEmailAndPassword,
                signOut,
                onAuthStateChanged,
                sendPasswordResetEmail
            },
            firestore: {
                doc,
                setDoc,
                getDoc,
                getDocs,
                collection,
                query,
                where,
                orderBy,
                limit,
                onSnapshot,
                addDoc,
                updateDoc,
                deleteDoc,
                serverTimestamp,
                writeBatch,
                arrayUnion,
                arrayRemove,
                increment
            },
            functions: {
                httpsCallable: (name) => httpsCallable(functions, name)
            }
        };
    </script>

        <script src="./assets/main-animated.js" defer></script>
</body>
</html>
