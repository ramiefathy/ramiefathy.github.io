<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Scheduler Pro - Firebase Edition</title>

    <!-- Tailwind CSS -->
    <link href="https://unpkg.com/tailwindcss@3.4.0/dist/tailwind.min.css" rel="stylesheet">

    <!-- React and dependencies -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script type="module">
        import { toast, Toaster } from 'https://esm.sh/react-hot-toast@2.4.1?bundle';
        import * as dateFns from 'https://esm.sh/date-fns@2.30.0?bundle';
        import * as Recharts from 'https://esm.sh/recharts@2.5.0?bundle';
        import Papa from 'https://esm.sh/papaparse@5.4.1?bundle';
        import * as lucide from 'https://esm.sh/lucide@0.462.0?bundle';
        window['react-hot-toast'] = { toast, Toaster };
        window['date-fns'] = dateFns;
        window.Recharts = Recharts;
        window.Papa = Papa;
        window.lucide = lucide;
    </script>

    <!-- Additional Libraries -->

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                            950: '#172554'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Modern scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Calendar styles */
        .calendar-grid {
            display: grid;
            grid-template-columns: 100px repeat(5, 1fr);
            grid-auto-rows: minmax(120px, auto);
            gap: 1px;
            background: #e5e7eb;
        }

        .time-slot {
            background: white;
            position: relative;
            min-height: 120px;
        }

        .time-slot.continuity {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
        }

        .time-slot.protected {
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
        }

        .assignment-card {
            background-color: #ffffff;
            border-radius: 0.5rem;
            padding: 0.5rem;
            margin: 0.25rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e7eb;
            font-size: 0.75rem;
            line-height: 1rem;
            cursor: move;
            transition: all 0.2s ease-in-out;
        }

        .assignment-card:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        .assignment-card.dragging {
            opacity: 0.5;
        }

        .drop-indicator {
            border: 2px dashed #60a5fa;
            background-color: #eff6ff;
        }

        /* Site colors */
        .site-gss { border-left: 4px solid #10b981; }
        .site-jhoc { border-left: 4px solid #f59e0b; }
        .site-hoco { border-left: 4px solid #ef4444; }


        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        /* Loading skeleton */
        .skeleton {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            background-color: #e5e7eb;
            border-radius: 0.25rem;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>
    <div id="modal-root"></div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import {
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            signOut,
            onAuthStateChanged,
            sendPasswordResetEmail
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import {
            initializeFirestore,
            getFirestore,
            persistentLocalCache,
            persistentMultipleTabManager,
            doc,
            setDoc,
            getDoc,
            getDocs,
            collection,
            query,
            where,
            orderBy,
            limit,
            onSnapshot,
            addDoc,
            updateDoc,
            deleteDoc,
            serverTimestamp,
            writeBatch,
            arrayUnion,
            arrayRemove,
            increment
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import {
            getFunctions,
            httpsCallable,
            connectFunctionsEmulator
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC-f7H_RLTbwaKOhwDiYPfF3knzPMKWVeQ",
            authDomain: "autoclinicscheduler.firebaseapp.com",
            projectId: "autoclinicscheduler",
            storageBucket: "autoclinicscheduler.firebasestorage.app",
            messagingSenderId: "1032685115214",
            appId: "1:1032685115214:web:fec2c2ed4999a8eb84701f",
            measurementId: "G-JHWKCQNPNR"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        let db;
        try {
            db = initializeFirestore(app, {
                localCache: persistentLocalCache({
                    tabManager: persistentMultipleTabManager()
                })
            });
        } catch (error) {
            console.warn('Falling back to in-memory Firestore cache', error);
            db = getFirestore(app);
        }
        const functions = getFunctions(app);

        // Connect to Functions emulator if in development
        if (location.hostname === 'localhost') {
            connectFunctionsEmulator(functions, 'localhost', 5001);
        }

        // Make Firebase available globally
        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebase = {
            auth: {
                signInWithEmailAndPassword,
                createUserWithEmailAndPassword,
                signOut,
                onAuthStateChanged,
                sendPasswordResetEmail
            },
            firestore: {
                doc,
                setDoc,
                getDoc,
                getDocs,
                collection,
                query,
                where,
                orderBy,
                limit,
                onSnapshot,
                addDoc,
                updateDoc,
                deleteDoc,
                serverTimestamp,
                writeBatch,
                arrayUnion,
                arrayRemove,
                increment
            },
            functions: {
                httpsCallable: (name) => httpsCallable(functions, name)
            }
        };
    </script>

        <script src="./assets/main.js" defer></script>
</body>
</html>
