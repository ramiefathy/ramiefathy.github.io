<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dermatopathology Navigator Pro</title>

    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Custom CSS -->
    <style>
        /* Design System using CSS Variables */
        :root {
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            --font-mono: 'Fira Code', 'Courier New', monospace;

            /* Light Theme */
            --color-bg: #f3f4f6; /* gray-100 */
            --color-bg-alt: #ffffff; /* white */
            --color-text: #1f2937; /* gray-800 */
            --color-text-muted: #6b7280; /* gray-500 */
            --color-border: #d1d5db; /* gray-300 */
            --color-primary: #3b82f6; /* blue-500 */
            --color-primary-hover: #2563eb; /* blue-600 */
            --color-accent: #f59e0b; /* amber-500 */
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        /* Dark Theme Logic */
        html.dark {
                --color-bg: #111827;
                --color-bg-alt: #1f2937;
                --color-text: #f9fafb;
                --color-text-muted: #9ca3af;
                --color-border: #374151;
                --color-primary: #60a5fa;
                --color-primary-hover: #3b82f6;
                --color-accent: #fcd34d;
        }

        /* Base Styles */
        body {
            font-family: var(--font-sans);
            background-color: var(--color-bg);
            color: var(--color-text);
            transition: background-color 0.3s, color 0.3s;
        }

        /* Loading Spinner */
        #loading-overlay {
            background-color: rgba(0,0,0,0.7);
        }
        .spinner {
            border-top-color: var(--color-primary);
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--color-bg-alt); }
        ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-text-muted); }

        /* Component Styles */
        .main-card { background-color: var(--color-bg-alt); border: 1px solid var(--color-border); }
        .tab-button { color: var(--color-text-muted); }
        .tab-button.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
        .tab-button:hover { color: var(--color-primary); }
        .btn-primary { background-color: var(--color-primary); color: white; }
        .btn-primary:hover { background-color: var(--color-primary-hover); }
        .btn-secondary { background-color: transparent; border: 1px solid var(--color-border); color: var(--color-text); }
        .btn-secondary:hover { background-color: var(--color-bg); }
        
        /* Flashcard Styles */
        .flashcard-scene { perspective: 1000px; }
        .flashcard {
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }
        .flashcard.is-flipped { transform: rotateY(180deg); }
        .flashcard-face {
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
        }
        .flashcard-back { transform: rotateY(180deg); }
        
        /* Toast Notifications */
        #toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 100; }
        .toast {
            animation: toast-in 0.5s, toast-out 0.5s 4.5s;
        }
        @keyframes toast-in {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes toast-out {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        /* Print Styles */
        @media print {
            body { background-color: white; color: black; }
            .no-print { display: none !important; }
            main { margin: 0; padding: 0; }
            .main-card { border: none; box-shadow: none; }
            #results-content { max-height: none !important; }
            a { text-decoration: none; color: inherit; }
            .diagnosis-card, .table { page-break-inside: avoid; }
        }
    </style>
</head>
<body class="antialiased">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 z-50 flex items-center justify-center transition-opacity duration-300">
        <div class="absolute inset-0 bg-gray-900 bg-opacity-75"></div>
        <div class="z-10 flex flex-col items-center">
            <div class="spinner h-12 w-12 rounded-full border-4 border-gray-300"></div>
            <p class="mt-4 text-white text-lg font-semibold">Initializing Navigator...</p>
        </div>
    </div>

    <!-- Header -->
    <header class="p-4 shadow-md bg-white dark:bg-gray-800 no-print">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Dermatopathology Navigator Pro</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400">An Advanced Learning & Reference Tool</p>
            </div>
             <button id="theme-toggle-btn" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">
                <svg id="theme-icon-light" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <svg id="theme-icon-dark" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto p-4 md:p-6">
        <!-- Search and Filter Section -->
        <div class="mb-6 p-4 rounded-lg bg-white dark:bg-gray-800 shadow-md no-print">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Fuzzy Search -->
                <div class="relative">
                    <label for="finding-search-input" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Search Histologic Findings</label>
                    <input type="text" id="finding-search-input" placeholder="e.g., 'spindle cell', 'acantholysis'..." class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-blue-500 focus:ring-blue-500 dark:bg-gray-700 dark:text-white">
                    <div id="search-suggestions" class="absolute z-10 w-full mt-1 bg-white dark:bg-gray-700 rounded-md shadow-lg hidden max-h-60 overflow-y-auto"></div>
                </div>
                <!-- Dropdown Selector -->
                <div>
                    <label for="finding-selector" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Or Select a Finding</label>
                    <select id="finding-selector" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-blue-500 focus:ring-blue-500 dark:bg-gray-700 dark:text-white">
                        <option value="">-- Select a Finding --</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Main Results Container -->
        <div id="results-container" class="main-card rounded-lg shadow-lg overflow-hidden">
            <!-- Header -->
            <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex flex-wrap justify-between items-center gap-4">
                <h2 id="results-title" class="text-xl font-bold text-gray-800 dark:text-white flex-shrink-0">Welcome! Select a finding to begin.</h2>
                <div id="action-buttons" class="flex-shrink-0 flex flex-wrap gap-2 no-print hidden">
                    <button id="export-pdf-btn" class="btn-secondary text-xs px-3 py-1.5 rounded-md flex items-center gap-1">PDF <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h8a2 2 0 012 2v12a1 1 0 110 2h-3a1 1 0 01-1-1v-2a1 1 0 00-1-1H9a1 1 0 00-1 1v2a1 1 0 01-1 1H4a1 1 0 110-2V4zm5 1a1 1 0 00-1 1v1a1 1 0 001 1h2a1 1 0 001-1V6a1 1 0 00-1-1H9z" clip-rule="evenodd" /></svg></button>
                    <button id="export-excel-btn" class="btn-secondary text-xs px-3 py-1.5 rounded-md flex items-center gap-1">Excel <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M2 5a2 2 0 012-2h12a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2V5zm3.5 1a.5.5 0 00-.5.5v2.5a.5.5 0 00.5.5h2.5a.5.5 0 00.5-.5V6.5a.5.5 0 00-.5-.5h-2.5zM14.5 6a.5.5 0 00-.5.5v2.5a.5.5 0 00.5.5h.5a.5.5 0 00.5-.5V6.5a.5.5 0 00-.5-.5h-.5zM5.5 11a.5.5 0 00-.5.5v2.5a.5.5 0 00.5.5h2.5a.5.5 0 00.5-.5v-2.5a.5.5 0 00-.5-.5h-2.5zM11 11.5a.5.5 0 00-.5.5v2.5a.5.5 0 00.5.5h2.5a.5.5 0 00.5-.5v-2.5a.5.5 0 00-.5-.5h-2.5z" /></svg></button>
                    <button id="print-btn" class="btn-secondary text-xs px-3 py-1.5 rounded-md flex items-center gap-1">Print <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 4v3H4a2 2 0 00-2 2v6a2 2 0 002 2h12a2 2 0 002-2V9a2 2 0 00-2-2h-1V4a2 2 0 00-2-2H7a2 2 0 00-2 2zm8 0H7v3h6V4zm0 8H7v4h6v-4z" clip-rule="evenodd" /></svg></button>
                    <button id="share-btn" class="btn-secondary text-xs px-3 py-1.5 rounded-md flex items-center gap-1">Share <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M15 8a3 3 0 10-2.977-2.63l-4.94 2.47a3 3 0 100 4.319l4.94 2.47a3 3 0 10.895-1.789l-4.94-2.47a3.027 3.027 0 000-.74l4.94-2.47C13.456 7.68 14.19 8 15 8z" /></svg></button>
                </div>
            </div>

            <!-- Tab Navigation -->
            <div class="border-b border-gray-200 dark:border-gray-700 no-print">
                <nav id="tab-nav" class="flex flex-wrap -mb-px px-4" aria-label="Tabs" role="tablist">
                    <button role="tab" data-tab="list" class="tab-button active text-sm font-medium text-center border-b-2 border-transparent px-3 py-2">List</button>
                    <button role="tab" data-tab="table" class="tab-button text-sm font-medium text-center border-b-2 border-transparent px-3 py-2">Table</button>
                    <button role="tab" data-tab="flashcards" class="tab-button text-sm font-medium text-center border-b-2 border-transparent px-3 py-2">Flashcards</button>
                    <button role="tab" data-tab="network" class="tab-button text-sm font-medium text-center border-b-2 border-transparent px-3 py-2">Network</button>
                    <button role="tab" data-tab="favorites" class="tab-button text-sm font-medium text-center border-b-2 border-transparent px-3 py-2 flex items-center gap-1">Favorites <span id="favorites-count" class="bg-blue-100 text-blue-800 text-xs font-medium px-1.5 py-0.5 rounded-full dark:bg-blue-900 dark:text-blue-300">0</span></button>
                    <button role="tab" data-tab="compare" class="tab-button text-sm font-medium text-center border-b-2 border-transparent px-3 py-2 disabled:opacity-50" disabled>Compare</button>
                    <button role="tab" data-tab="quiz" class="tab-button text-sm font-medium text-center border-b-2 border-transparent px-3 py-2 disabled:opacity-50" disabled>Quiz</button>
                    <button role="tab" data-tab="analytics" class="tab-button text-sm font-medium text-center border-b-2 border-transparent px-3 py-2">Analytics</button>
                </nav>
            </div>
            
            <!-- Content -->
            <div id="results-content" class="p-4 md:p-6 bg-gray-50 dark:bg-gray-900/50 max-h-[65vh] overflow-y-auto">
                <!-- Welcome message -->
                <div id="welcome-message" class="text-center py-16">
                    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                    </svg>
                    <h3 class="mt-2 text-lg font-medium text-gray-900 dark:text-white">No Finding Selected</h3>
                    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Use the search or dropdown above to view differential diagnoses.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Modals -->
    <!-- Note Modal -->
    <div id="note-modal" class="fixed inset-0 z-40 hidden items-center justify-center bg-black bg-opacity-50">
        <div class="main-card rounded-lg shadow-xl w-11/12 md:w-1/2 lg:w-1/3">
            <div class="p-4 border-b dark:border-gray-700">
                <h3 id="note-modal-title" class="text-lg font-semibold">Add/Edit Note</h3>
            </div>
            <div class="p-4">
                <textarea id="note-textarea" rows="6" class="w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-blue-500 focus:ring-blue-500 dark:bg-gray-700 dark:text-white" placeholder="Your personal notes..."></textarea>
            </div>
            <div class="p-4 bg-gray-50 dark:bg-gray-800/50 flex justify-end gap-3">
                <button id="note-cancel-btn" class="btn-secondary px-4 py-2 rounded-md">Cancel</button>
                <button id="note-save-btn" class="btn-primary px-4 py-2 rounded-md">Save</button>
            </div>
        </div>
    </div>
    
    <!-- Share Modal -->
    <div id="share-modal" class="fixed inset-0 z-40 hidden items-center justify-center bg-black bg-opacity-50">
        <div class="main-card rounded-lg shadow-xl w-11/12 md:w-1/2 lg:w-1/3">
            <h3 class="p-4 text-lg font-semibold border-b dark:border-gray-700">Share Link</h3>
            <div class="p-4">
                <p class="text-sm text-gray-600 dark:text-gray-300 mb-2">Copy this link to share the current view:</p>
                <input id="share-link-input" type="text" readonly class="w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm dark:bg-gray-700 dark:text-white">
            </div>
            <div class="p-4 bg-gray-50 dark:bg-gray-800/50 flex justify-end gap-3">
                 <button id="share-close-btn" class="btn-secondary px-4 py-2 rounded-md">Close</button>
            </div>
        </div>
    </div>
    
    <!-- Toast Notification Container -->
    <div id="toast-container"></div>
    
    <!-- Data and App Logic -->
    <script src="dermpathDifferentialsData.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        'use strict';

        // --- STATE MANAGEMENT ---
        const state = {
            dataMap: new Map(),
            findings: [],
            selectedFinding: null,
            activeTab: 'list',
            favorites: {}, // { "diagnosisName": "findingName" }
            notes: {}, // { "diagnosisName": "note text" }
            analytics: {
                startTime: Date.now(),
                views: {}, // { "findingName": { count: 1, lastViewed: timestamp } }
                tabUsage: {},
                actions: { favorites: 0, notes: 0, exports: 0 }
            }
        };

        let fuse;

        // --- DOM ELEMENT SELECTORS ---
        const dom = {
            loadingOverlay: document.getElementById('loading-overlay'),
            findingSearchInput: document.getElementById('finding-search-input'),
            searchSuggestions: document.getElementById('search-suggestions'),
            findingSelector: document.getElementById('finding-selector'),
            resultsContainer: document.getElementById('results-container'),
            resultsTitle: document.getElementById('results-title'),
            actionButtons: document.getElementById('action-buttons'),
            resultsContent: document.getElementById('results-content'),
            tabNav: document.getElementById('tab-nav'),
            favoritesCount: document.getElementById('favorites-count'),
            welcomeMessage: document.getElementById('welcome-message'),
            noteModal: {
                el: document.getElementById('note-modal'),
                title: document.getElementById('note-modal-title'),
                textarea: document.getElementById('note-textarea'),
                saveBtn: document.getElementById('note-save-btn'),
                cancelBtn: document.getElementById('note-cancel-btn')
            },
            shareModal: {
                el: document.getElementById('share-modal'),
                input: document.getElementById('share-link-input'),
                closeBtn: document.getElementById('share-close-btn')
            },
            exportPdfBtn: document.getElementById('export-pdf-btn'),
            exportExcelBtn: document.getElementById('export-excel-btn'),
            printBtn: document.getElementById('print-btn'),
            shareBtn: document.getElementById('share-btn'),
            themeToggleBtn: document.getElementById('theme-toggle-btn'),
            themeIconLight: document.getElementById('theme-icon-light'),
            themeIconDark: document.getElementById('theme-icon-dark'),
        };

        // --- INITIALIZATION ---
        function initializeApplication() {
            console.log("Starting application initialization...");
            
            loadStateFromLocalStorage();
            processData();
            setupEventListeners();
            initializeFuse();
            populateDropdown();
            checkURLParameters();
            
            // Initial theme setup
            const savedTheme = localStorage.getItem('theme') || 'system';
            updateThemeUI(savedTheme);
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if (localStorage.getItem('theme') === 'system') {
                    updateThemeUI('system');
                }
            });

            dom.loadingOverlay.style.opacity = '0';
            setTimeout(() => dom.loadingOverlay.style.display = 'none', 300);
            
            console.log("Application initialized successfully.");
        };

        function processData() {
            if (!window.dermDifferentialData || window.dermDifferentialData.length === 0) {
                console.error("Differential data not found or is empty.");
                showToast("Error: Could not load differential data.", "error");
                return;
            }

            window.dermDifferentialData.forEach(item => {
                state.dataMap.set(item.finding, item);
            });
            
            state.findings = Array.from(state.dataMap.keys()).sort((a, b) => a.localeCompare(b));
            console.log(`Processed ${state.dataMap.size} findings.`);
        }

        function initializeFuse() {
            const options = {
                includeScore: true,
                keys: ['finding'],
                threshold: 0.4
            };
            const fuseData = state.findings.map(f => ({ finding: f }));
            fuse = new Fuse(fuseData, options);
        }

        function populateDropdown() {
            state.findings.forEach(finding => {
                const option = document.createElement('option');
                option.value = finding;
                option.textContent = finding;
                dom.findingSelector.appendChild(option);
            });
        }
        
        // --- EVENT LISTENERS ---
        function setupEventListeners() {
            dom.findingSelector.addEventListener('change', handleFindingSelect);
            dom.findingSearchInput.addEventListener('input', handleFuzzySearch);
            dom.findingSearchInput.addEventListener('blur', () => setTimeout(() => dom.searchSuggestions.classList.add('hidden'), 200));
            dom.tabNav.addEventListener('click', handleTabClick);
            dom.resultsContent.addEventListener('click', handleCardActions);
            
            // Modals
            dom.noteModal.saveBtn.addEventListener('click', handleSaveNote);
            dom.noteModal.cancelBtn.addEventListener('click', () => dom.noteModal.el.classList.add('hidden'));
            dom.shareModal.closeBtn.addEventListener('click', () => dom.shareModal.el.classList.add('hidden'));
            dom.shareModal.input.addEventListener('click', e => e.target.select());

            // Action Buttons
            dom.exportPdfBtn.addEventListener('click', handleExportPDF);
            dom.exportExcelBtn.addEventListener('click', handleExportExcel);
            dom.printBtn.addEventListener('click', () => window.print());
            dom.shareBtn.addEventListener('click', handleShare);

            // Theme Toggle
            dom.themeToggleBtn.addEventListener('click', toggleTheme);
        }

        // --- EVENT HANDLERS ---
        function handleFindingSelect(event) {
            const findingName = event.target.value;
            if (findingName) {
                renderFinding(findingName);
                dom.findingSearchInput.value = '';
                dom.searchSuggestions.classList.add('hidden');
            }
        }
        
        function handleFuzzySearch(event) {
            const query = event.target.value;
            if (query.length < 2) {
                dom.searchSuggestions.innerHTML = '';
                dom.searchSuggestions.classList.add('hidden');
                return;
            }
            
            const results = fuse.search(query).slice(0, 5);
            dom.searchSuggestions.innerHTML = '';
            
            if (results.length > 0) {
                results.forEach(result => {
                    const item = document.createElement('div');
                    item.textContent = result.item.finding;
                    item.className = 'p-2 hover:bg-gray-100 dark:hover:bg-gray-600 cursor-pointer';
                    item.addEventListener('click', () => {
                        renderFinding(result.item.finding);
                        dom.findingSearchInput.value = result.item.finding;
                        dom.searchSuggestions.classList.add('hidden');
                    });
                    dom.searchSuggestions.appendChild(item);
                });
                dom.searchSuggestions.classList.remove('hidden');
            } else {
                dom.searchSuggestions.classList.add('hidden');
            }
        }

        function handleTabClick(event) {
            const button = event.target.closest('button[role="tab"]');
            if (button && !button.disabled) {
                const tab = button.dataset.tab;
                if (tab !== state.activeTab) {
                    state.activeTab = tab;
                    trackEvent('tab_view', { tab });
                    render();
                }
            }
        }

        function handleCardActions(event) {
            const button = event.target.closest('button');
            if (!button) return;

            const diagnosisCard = button.closest('[data-diagnosis-name]');
            if (!diagnosisCard) return;

            const diagnosisName = diagnosisCard.dataset.diagnosisName;

            if (button.dataset.action === 'favorite') {
                toggleFavorite(diagnosisName, state.selectedFinding || state.favorites[diagnosisName]);
            } else if (button.dataset.action === 'note') {
                openNoteModal(diagnosisName);
            }
        }

        function handleSaveNote() {
            const diagnosisName = dom.noteModal.saveBtn.dataset.diagnosisName;
            const noteText = dom.noteModal.textarea.value.trim();

            if (noteText) {
                state.notes[diagnosisName] = noteText;
                showToast("Note saved successfully.", "success");
                trackEvent('action', { type: 'note_add_edit' });
            } else {
                delete state.notes[diagnosisName];
                showToast("Note removed.", "info");
            }
            saveStateToLocalStorage();
            dom.noteModal.el.classList.add('hidden');
            render(); // Re-render to show note indicator
        }
        
        function handleShare() {
            if (!state.selectedFinding) return;
            const link = generateDeepLink();
            dom.shareModal.input.value = link;
            dom.shareModal.el.classList.remove('hidden');
            dom.shareModal.input.focus();
            dom.shareModal.input.select();
            try {
                navigator.clipboard.writeText(link);
                showToast("Share link copied to clipboard!", "success");
            } catch (err) {
                console.warn("Could not copy to clipboard:", err);
            }
        }

        // --- CORE LOGIC & RENDERING ---
        function render() {
            updateActiveTab();

            if (state.activeTab === 'favorites') {
                renderFavoritesView();
                return;
            }
             if (state.activeTab === 'analytics') {
                renderAnalyticsView();
                return;
            }

            const findingData = state.dataMap.get(state.selectedFinding);
            if (!findingData) {
                dom.welcomeMessage.classList.remove('hidden');
                dom.actionButtons.classList.add('hidden');
                dom.resultsTitle.textContent = "Welcome! Select a finding to begin.";
                dom.resultsContent.innerHTML = '';
                dom.resultsContent.appendChild(dom.welcomeMessage);
                return;
            }
            
            dom.welcomeMessage.classList.add('hidden');
            dom.actionButtons.classList.remove('hidden');
            dom.resultsTitle.textContent = findingData.finding;

            switch (state.activeTab) {
                case 'list': renderListView(findingData.diagnoses); break;
                case 'table': renderTableView(findingData.diagnoses); break;
                case 'flashcards': renderFlashcardsView(findingData.diagnoses); break;
                case 'network': renderNetworkView(findingData); break;
                default:
                    dom.resultsContent.innerHTML = `<div class="p-8 text-center text-gray-500">This feature is coming soon!</div>`;
            }
        }

        function renderFinding(findingName) {
            if (!state.dataMap.has(findingName)) return;

            state.selectedFinding = findingName;
            dom.findingSelector.value = findingName;
            trackEvent('view_finding', { finding: findingName });
            
            if (state.activeTab === 'favorites' || state.activeTab === 'analytics') {
                state.activeTab = 'list';
            }
            
            render();
        }

        function updateActiveTab() {
            dom.tabNav.querySelectorAll('button').forEach(btn => {
                if (btn.dataset.tab === state.activeTab) {
                    btn.classList.add('active', 'border-blue-500', 'dark:border-blue-400', 'text-blue-600', 'dark:text-blue-400');
                    btn.classList.remove('text-gray-500', 'dark:text-gray-400', 'border-transparent');
                    btn.setAttribute('aria-selected', 'true');
                } else {
                    btn.classList.remove('active', 'border-blue-500', 'dark:border-blue-400', 'text-blue-600', 'dark:text-blue-400');
                    btn.classList.add('text-gray-500', 'dark:text-gray-400', 'border-transparent');
                    btn.setAttribute('aria-selected', 'false');
                }
            });
        }
        
        // --- VIEW RENDERERS ---
        function renderListView(diagnoses) {
            if (!diagnoses || diagnoses.length === 0) {
                dom.resultsContent.innerHTML = `<div class="text-center p-8 text-gray-500">No diagnoses found for this finding.</div>`;
                return;
            }

            const html = diagnoses.map(dx => {
                const isFavorite = !!state.favorites[dx.name];
                const hasNote = !!state.notes[dx.name];
                return `
                <div class="diagnosis-card bg-white dark:bg-gray-800 rounded-lg shadow-md border border-gray-200 dark:border-gray-700 p-4 mb-4" data-diagnosis-name="${dx.name}">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="text-lg font-bold text-gray-900 dark:text-white">${dx.name}</h4>
                            <p class="text-xs font-mono text-gray-500 dark:text-gray-400">Source: ${formatSources(dx.sources)}</p>
                        </div>
                        <div class="flex items-center gap-1 flex-shrink-0 ml-2">
                             ${hasNote ? `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500" viewBox="0 0 20 20" fill="currentColor"><path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z" /><path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd" /></svg>` : ''}
                            <button data-action="note" class="p-1 rounded-full hover:bg-gray-200 dark:hover:bg-gray-600">
                               <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" /></svg>
                            </button>
                            <button data-action="favorite" class="p-1 rounded-full hover:bg-gray-200 dark:hover:bg-gray-600">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ${isFavorite ? 'text-amber-500' : 'text-gray-400'}" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="mt-2 text-sm text-gray-700 dark:text-gray-300">
                        <p><strong>Key Features:</strong> ${dx.keyFeatures}</p>
                        ${state.notes[dx.name] ? `<div class="mt-2 p-2 bg-blue-50 dark:bg-blue-900/50 border-l-4 border-blue-400 text-sm"><p class="font-semibold">My Note:</p><p>${state.notes[dx.name].replace(/\n/g, '<br>')}</p></div>` : ''}
                    </div>
                </div>`;
            }).join('');
            dom.resultsContent.innerHTML = html;
        }

        function renderTableView(diagnoses) {
            if (!diagnoses || diagnoses.length === 0) {
                 dom.resultsContent.innerHTML = `<div class="text-center p-8 text-gray-500">No diagnoses found for this finding.</div>`;
                return;
            }
            const html = `
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-100 dark:bg-gray-700 dark:text-gray-400">
                            <tr>
                                <th scope="col" class="px-4 py-3">Diagnosis</th>
                                <th scope="col" class="px-4 py-3">Key Features</th>
                                <th scope="col" class="px-4 py-3">Source(s)</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${diagnoses.map(dx => `
                                <tr class="bg-white dark:bg-gray-800 border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">
                                    <th scope="row" class="px-4 py-4 font-medium text-gray-900 dark:text-white whitespace-nowrap">${dx.name}</th>
                                    <td class="px-4 py-4">${dx.keyFeatures}</td>
                                    <td class="px-4 py-4 whitespace-nowrap">${formatSources(dx.sources)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            dom.resultsContent.innerHTML = html;
        }

        function renderFavoritesView() {
            dom.resultsTitle.textContent = "My Favorites";
            dom.actionButtons.classList.add('hidden');

            const favoriteNames = Object.keys(state.favorites);
            if (favoriteNames.length === 0) {
                dom.resultsContent.innerHTML = `<div class="text-center p-8 text-gray-500">You haven't favorited any diagnoses yet.</div>`;
                return;
            }
            
            const allDiagnoses = [];
            state.dataMap.forEach(findingData => {
                findingData.diagnoses.forEach(dx => {
                    if (favoriteNames.includes(dx.name)) {
                        allDiagnoses.push(dx);
                    }
                });
            });

            renderListView(allDiagnoses);
        }

        function renderFlashcardsView(diagnoses) {
             if (!diagnoses || diagnoses.length === 0) {
                 dom.resultsContent.innerHTML = `<div class="text-center p-8 text-gray-500">No diagnoses to create flashcards for.</div>`;
                return;
            }
            
            const flashcardHTML = diagnoses.map((dx, index) => `
                <div class="flashcard-scene w-full h-64 mb-6">
                    <div class="flashcard relative w-full h-full" id="flashcard-${index}">
                        <!-- Front Face -->
                        <div class="flashcard-face absolute w-full h-full p-6 flex flex-col items-center justify-center bg-white dark:bg-gray-800 rounded-lg shadow-md border dark:border-gray-700">
                            <h3 class="text-xl font-bold text-center">${dx.name}</h3>
                            <p class="text-sm text-gray-500 mt-2">Click to flip</p>
                        </div>
                        <!-- Back Face -->
                        <div class="flashcard-back absolute w-full h-full p-6 flex flex-col justify-center bg-blue-100 dark:bg-blue-900/50 rounded-lg shadow-md border border-blue-300 dark:border-blue-700">
                            <p class="text-sm text-gray-800 dark:text-gray-200"><strong class="font-semibold">Key Features:</strong> ${dx.keyFeatures}</p>
                            <p class="text-xs font-mono text-gray-600 dark:text-gray-400 mt-3">Source: ${formatSources(dx.sources)}</p>
                        </div>
                    </div>
                </div>
            `).join('');

            dom.resultsContent.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${flashcardHTML}</div>`;
            
            diagnoses.forEach((_, index) => {
                const card = document.getElementById(`flashcard-${index}`);
                if (card) {
                    card.addEventListener('click', () => card.classList.toggle('is-flipped'));
                }
            });
        }
        
        function renderNetworkView(findingData) {
            dom.resultsContent.innerHTML = '<div id="network-svg-container" class="w-full h-[60vh] flex items-center justify-center bg-gray-100 dark:bg-gray-800 rounded-md"></div>';
            const container = document.getElementById('network-svg-container');
            
            const nodes = [
                { id: findingData.finding, group: 0, r: 30 },
                ...findingData.diagnoses.map(dx => ({ id: dx.name, group: 1, r: 15 }))
            ];
            const links = findingData.diagnoses.map(dx => ({ source: findingData.finding, target: dx.name }));

            const width = container.clientWidth;
            const height = container.clientHeight;

            const svg = d3.select(container).append("svg")
                .attr("width", width)
                .attr("height", height)
                .attr("viewBox", [-width / 2, -height / 2, width, height])
                .style("font", "10px sans-serif");
            
            const simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id).distance(100))
                .force("charge", d3.forceManyBody().strength(-200))
                .force("center", d3.forceCenter());

            const link = svg.append("g")
                .attr("stroke", "var(--color-text-muted)")
                .attr("stroke-opacity", 0.6)
                .selectAll("line")
                .data(links)
                .join("line");

            const node = svg.append("g")
                .selectAll("g")
                .data(nodes)
                .join("g")
                .call(drag(simulation));

            node.append("circle")
                .attr("r", d => d.r)
                .attr("fill", d => d.group === 0 ? "var(--color-primary)" : "var(--color-accent)");

            node.append("text")
                .text(d => d.id)
                .attr("x", d => d.r + 5)
                .attr("y", 3)
                .attr("fill", "var(--color-text)")
                .style("pointer-events", "none");
                
            simulation.on("tick", () => {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);
                node
                    .attr("transform", d => `translate(${d.x},${d.y})`);
            });
            
            function drag(simulation) {
              return d3.drag()
                  .on("start", (event, d) => {
                    if (!event.active) simulation.alphaTarget(0.3).restart();
                    d.fx = d.x;
                    d.fy = d.y;
                  })
                  .on("drag", (event, d) => {
                    d.fx = event.x;
                    d.fy = event.y;
                  })
                  .on("end", (event, d) => {
                    if (!event.active) simulation.alphaTarget(0);
                    d.fx = null;
                    d.fy = null;
                  });
            }
        }
        
        function renderAnalyticsView() {
            dom.resultsTitle.textContent = "My Learning Analytics";
            dom.actionButtons.classList.add('hidden');
            
            const totalTime = ((Date.now() - state.analytics.startTime) / 60000).toFixed(1);
            const viewedFindingsCount = Object.keys(state.analytics.views).length;
            
            const topViewed = Object.entries(state.analytics.views)
                .sort(([,a],[,b]) => b.count - a.count)
                .slice(0, 5)
                .map(([name, data]) => `<li>${name} (${data.count} views)</li>`)
                .join('');
            
            const topTabs = Object.entries(state.analytics.tabUsage)
                .sort(([,a],[,b]) => b - a)
                .slice(0, 3)
                .map(([name, count]) => `<li>${name} (${count} uses)</li>`)
                .join('');

            const html = `
                <div class="space-y-6">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                        <div class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow"><div class="text-2xl font-bold">${totalTime}</div><div class="text-sm text-gray-500">Mins Studied</div></div>
                        <div class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow"><div class="text-2xl font-bold">${viewedFindingsCount}</div><div class="text-sm text-gray-500">Findings Viewed</div></div>
                        <div class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow"><div class="text-2xl font-bold">${state.analytics.actions.favorites}</div><div class="text-sm text-gray-500">Favorites Added</div></div>
                        <div class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow"><div class="text-2xl font-bold">${state.analytics.actions.notes}</div><div class="text-sm text-gray-500">Notes Taken</div></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow">
                            <h4 class="font-semibold mb-2">Most Viewed Findings</h4>
                            <ul class="list-disc list-inside text-sm space-y-1">${topViewed || '<li>None yet</li>'}</ul>
                        </div>
                        <div class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow">
                            <h4 class="font-semibold mb-2">Most Used Features</h4>
                            <ul class="list-disc list-inside text-sm space-y-1">${topTabs || '<li>None yet</li>'}</ul>
                        </div>
                    </div>
                </div>
            `;
            dom.resultsContent.innerHTML = html;
        }

        // --- UTILITY FUNCTIONS ---
        function formatSources(sources) {
            if (Array.isArray(sources)) return sources.join(', ');
            if (typeof sources === 'string') return sources;
            return 'Unknown';
        }
        
        function toggleFavorite(diagnosisName, findingName) {
            if (state.favorites[diagnosisName]) {
                delete state.favorites[diagnosisName];
                showToast(`${diagnosisName} removed from favorites.`, "info");
            } else {
                state.favorites[diagnosisName] = findingName;
                showToast(`${diagnosisName} added to favorites!`, "success");
                trackEvent('action', { type: 'favorite_add' });
            }
            dom.favoritesCount.textContent = Object.keys(state.favorites).length;
            saveStateToLocalStorage();
            render();
        }

        function openNoteModal(diagnosisName) {
            dom.noteModal.title.textContent = `Add/Edit Note for ${diagnosisName}`;
            dom.noteModal.textarea.value = state.notes[diagnosisName] || '';
            dom.noteModal.saveBtn.dataset.diagnosisName = diagnosisName;
            dom.noteModal.el.classList.remove('hidden');
            dom.noteModal.textarea.focus();
        }
        
        function generateDeepLink() {
            const url = new URL(window.location.href);
            url.searchParams.set('finding', state.selectedFinding);
            return url.toString();
        }
        
        // URL updates disabled to keep URL stable during navigation
        function updateURL(findingName) {
            return; // no-op
        }

        function checkURLParameters() {
            const params = new URLSearchParams(window.location.search);
            const finding = params.get('finding');
            if (finding) {
                // Try raw
                if (state.dataMap.has(finding)) {
                    renderFinding(finding);
                    return;
                }
                // Try single decode
                try {
                    const decoded1 = decodeURIComponent(finding);
                    if (state.dataMap.has(decoded1)) {
                        renderFinding(decoded1);
                        return;
                    }
                    // Try double decode (handles legacy double-encoded links)
                    const decoded2 = decodeURIComponent(decoded1);
                    if (state.dataMap.has(decoded2)) {
                        renderFinding(decoded2);
                        return;
                    }
                } catch (e) {}
            }
        }
        
        function showToast(message, type = "info") {
            const colors = {
                info: 'bg-blue-500',
                success: 'bg-green-500',
                error: 'bg-red-500',
            };
            const toast = document.createElement('div');
            toast.className = `toast text-white px-6 py-3 rounded-md shadow-lg ${colors[type]}`;
            toast.textContent = message;
            
            document.getElementById('toast-container').appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 5000);
        }

        // --- EXPORT FUNCTIONS ---
        function handleExportPDF() {
            if (!state.selectedFinding) return;
            trackEvent('action', { type: 'export_pdf' });

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const data = state.dataMap.get(state.selectedFinding);

            doc.setFontSize(18);
            doc.text(`Differential Diagnosis for: ${data.finding}`, 14, 22);

            const tableData = data.diagnoses.map(dx => [
                dx.name,
                dx.keyFeatures,
                formatSources(dx.sources)
            ]);
            
            doc.autoTable({
                head: [['Diagnosis', 'Key Features', 'Source(s)']],
                body: tableData,
                startY: 30,
                styles: { fontSize: 8 },
                headStyles: { fillColor: [41, 128, 185] },
            });
            
            doc.save(`${data.finding.replace(/ /g, '_')}_DDx.pdf`);
        }
        
        function handleExportExcel() {
            if (!state.selectedFinding) return;
            trackEvent('action', { type: 'export_excel' });

            const data = state.dataMap.get(state.selectedFinding);
            const worksheet = XLSX.utils.json_to_sheet(data.diagnoses);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Differentials");
            
            const meta = [{
                Finding: data.finding,
                'Export Date': new Date().toISOString(),
                'Number of Diagnoses': data.diagnoses.length
            }];
            const metaSheet = XLSX.utils.json_to_sheet(meta);
            XLSX.utils.book_append_sheet(workbook, metaSheet, "Metadata");

            XLSX.writeFile(workbook, `${data.finding.replace(/ /g, '_')}_DDx.xlsx`);
        }

        // --- LOCAL STORAGE & PERSISTENCE ---
        function saveStateToLocalStorage() {
            try {
                const persistentState = {
                    favorites: state.favorites,
                    notes: state.notes,
                    analytics: state.analytics
                };
                localStorage.setItem('dermpathNavigatorState', JSON.stringify(persistentState));
            } catch (e) {
                console.error("Failed to save state to localStorage", e);
            }
        }
        
        function loadStateFromLocalStorage() {
            try {
                const savedState = localStorage.getItem('dermpathNavigatorState');
                if (savedState) {
                    const parsed = JSON.parse(savedState);
                    state.favorites = parsed.favorites || {};
                    state.notes = parsed.notes || {};
                    state.analytics = parsed.analytics || state.analytics;
                    // Restore start time if it exists, otherwise it gets reset on every load
                    state.analytics.startTime = parsed.analytics.startTime || Date.now();
                }
                dom.favoritesCount.textContent = Object.keys(state.favorites).length;
            } catch (e) {
                console.error("Failed to load state from localStorage", e);
                state.favorites = {};
                state.notes = {};
            }
        }
        
        // --- ANALYTICS ---
        function trackEvent(eventName, eventData) {
            const now = Date.now();
            switch(eventName) {
                case 'view_finding':
                    const view = state.analytics.views[eventData.finding] || { count: 0 };
                    view.count++;
                    view.lastViewed = now;
                    state.analytics.views[eventData.finding] = view;
                    break;
                case 'tab_view':
                    state.analytics.tabUsage[eventData.tab] = (state.analytics.tabUsage[eventData.tab] || 0) + 1;
                    break;
                case 'action':
                    if (eventData.type === 'favorite_add') state.analytics.actions.favorites++;
                    if (eventData.type === 'note_add_edit') state.analytics.actions.notes++;
                    if (eventData.type.startsWith('export')) state.analytics.actions.exports++;
                    break;
            }
            saveStateToLocalStorage();
        }

        // --- THEME TOGGLE ---
        function toggleTheme() {
            const currentTheme = localStorage.getItem('theme') || 'system';
            let newTheme = (currentTheme === 'dark') ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            updateThemeUI(newTheme);
        }

        function updateThemeUI(theme) {
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (theme === 'dark' || (theme === 'system' && systemPrefersDark)) {
                document.documentElement.classList.add('dark');
                dom.themeIconDark.classList.remove('hidden');
                dom.themeIconLight.classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                dom.themeIconLight.classList.remove('hidden');
                dom.themeIconDark.classList.add('hidden');
            }
        }

        // --- KICK OFF THE APP ---
        initializeApplication();
    });
    </script>
