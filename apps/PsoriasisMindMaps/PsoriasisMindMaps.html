<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psoriasis & Psoriatic Arthritis Mind Maps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include the D3.js library -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #334155;
        }
        .tab-container {
            overflow-x: auto;
            white-space: nowrap;
        }
        #tab-bar {
            padding-bottom: 180px; 
            margin-bottom: -180px;
        }
        .tab {
            cursor: pointer;
            padding: 10px 16px;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
            display: inline-block;
            position: relative;
            border-radius: 6px 6px 0 0;
        }
        .tab-group-sky { color: #0369a1; }
        .tab-group-indigo { color: #4338ca; }
        .tab-group-fuchsia { color: #a21caf; }
        .tab-group-sky.active { font-weight: 600; background-color: #e0f2fe; border-color: #0369a1; }
        .tab-group-indigo.active { font-weight: 600; background-color: #e0e7ff; border-color: #4338ca; }
        .tab-group-fuchsia.active { font-weight: 600; background-color: #fae8ff; border-color: #a21caf; }
        
        .dropdown {
            display: none; position: absolute; background-color: white;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 10;
            top: 100%; left: 0; border-radius: 0 0 8px 8px; overflow: hidden;
        }
        .dropdown-item {
            color: #334155; padding: 12px 16px; text-decoration: none;
            display: block; text-align: left; white-space: nowrap;
        }
        .dropdown-item:hover { background-color: #f1f5f9; }
        .tab.dropdown-active .dropdown { display: block; }
        @media (hover: hover) { .tab:hover .dropdown { display: block; } }

        .mind-map-view { display: none; }
        .mind-map-view.active { display: flex; align-items: center; justify-content: center; }
        .loading-indicator { color: #64748b; font-size: 1.25rem; }
        
        /* D3-specific styles */
        .node { cursor: pointer; }
        .node-text { font-weight: 500; pointer-events: none; text-anchor: middle; dominant-baseline: central; fill: #1e293b; }
        .link {
            fill: none;
            stroke: #cbd5e1;
            stroke-width: 2px;
            opacity: 0.6;
        }
        .node circle {
            stroke: #1d4ed8;
            stroke-width: 1.5px;
            transition: stroke-width 0.2s ease, stroke 0.2s ease;
        }
        .node .collapsible {
            stroke: #2563eb;
            stroke-width: 3px;
        }
        
        .tooltip {
            position: absolute; background-color: rgba(0, 0, 0, 0.85); color: white;
            padding: 10px 15px; border-radius: 8px; font-size: 14px; line-height: 1.5;
            max-width: 450px; visibility: hidden; opacity: 0;
            transition: opacity 0.3s, visibility 0.3s; pointer-events: none; z-index: 20;
        }
        .tooltip-title { font-weight: 700; margin-bottom: 5px; color: #7dd3fc; }
        .tooltip-content ul { list-style-position: inside; padding-left: 0; margin: 0; }
        .tooltip-content li { margin-bottom: 5px; }
        .tooltip-content strong { color: #facc15; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-6xl text-center mb-4">
        <h1 class="text-3xl md:text-4xl font-bold text-slate-800">Psoriasis & Psoriatic Arthritis</h1>
        <p class="text-slate-600 mt-2 text-lg">An Interactive Guide to Pathogenesis, Diagnosis, and Management.</p>
    </div>

    <div class="w-full max-w-6xl">
        <div class="border-b border-slate-200">
            <div id="tab-bar" class="flex justify-center tab-container">
                <div id="tab-patho" class="tab active tab-group-sky" data-tab="patho">Pathophysiology</div>
                <div id="tab-subtypes" class="tab tab-group-sky" data-tab="subtypes">Clinical Subtypes</div>
                <div id="tab-comorbid" class="tab tab-group-sky mr-4" data-tab="comorbid">Comorbidities</div>
                <div id="tab-psa" class="tab tab-group-indigo mr-4" data-tab="psa">Psoriatic Arthritis (PsA)</div>
                <div id="tab-treatment" class="tab tab-group-fuchsia">
                    Treatment ▾
                    <div class="dropdown">
                        <a href="#" class="dropdown-item" data-tab="treatment-modality">By Modality</a>
                        <a href="#" class="dropdown-item" data-tab="treatment-skin">Psoriasis (Skin)</a>
                        <a href="#" class="dropdown-item" data-tab="treatment-psa">Psoriatic Arthritis (Joints)</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="mind-map-container" class="w-full max-w-6xl aspect-[4/3] bg-white rounded-xl shadow-lg border border-slate-200 mt-4">
        <div id="view-patho" class="mind-map-view active h-full"></div>
        <div id="view-subtypes" class="mind-map-view h-full"></div>
        <div id="view-comorbid" class="mind-map-view h-full"></div>
        <div id="view-psa" class="mind-map-view h-full"></div>
        <div id="view-treatment-modality" class="mind-map-view h-full"></div>
        <div id="view-treatment-skin" class="mind-map-view h-full"></div>
        <div id="view-treatment-psa" class="mind-map-view h-full"></div>
    </div>
    <div id="tooltip" class="tooltip"></div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        (function() {
            // --- DATA STRUCTURES ---
            const mindMapDataByPatho = {id:'root',name:'Pathogenesis',tooltip:{title:'The Immune Basis of Psoriasis',content:'Psoriasis is a chronic immune-mediated disease where an interplay of genetic and environmental factors triggers a cascade of inflammation, primarily driven by the IL-23/Th17 axis.'},children:[{id:'genetics',name:'Genetic & Environmental',tooltip:{title:'Genetic & Environmental Factors',content:'The initial phase where susceptibility meets a trigger, initiating the inflammatory process.'},children:[{id:'hla',name:'Genetic Susceptibility',tooltip:{title:'Genetic Susceptibility',content:'<ul><li><strong>HLA-C*06:02:</strong> The main genetic risk factor for psoriasis.</li><li><strong>HLA-B*27:</strong> A strong genetic marker for axial disease in Psoriatic Arthritis (PsA).</li><li><strong>Other Genes:</strong> Loci related to IL23R and other immune pathways are also implicated.</li></ul>'}},{id:'env_triggers',name:'Environmental Triggers',tooltip:{title:'Environmental Triggers',content:'<ul><li><strong>Infections:</strong> Streptococcal pharyngitis is a classic trigger for guttate psoriasis.</li><li><strong>Trauma (Koebner):</strong> Psoriatic lesions appearing at sites of skin injury.</li><li><strong>Stress:</strong> Both physical and psychological stress can trigger or exacerbate psoriasis.</li><li><strong>Medications:</strong> Beta-blockers, lithium, and antimalarials are known triggers.</li></ul>'}}]}, {id:'il23_th17',name:'IL-23/Th17 Axis',tooltip:{title:'The IL-23/Th17 Axis',content:'The core inflammatory pathway driving the clinical manifestations of psoriasis.'},children:[{id:'apc',name:'Antigen Presentation',tooltip:{title:'Antigen-Presenting Cells (APCs)',content:'Dendritic cells in the skin are activated by triggers and produce key cytokines, including IL-23 and IL-12.'}},{id:'th17',name:'T-Helper 17 (Th17) Cells',tooltip:{title:'Th17 Cell Activation',content:'IL-23 acts as a "master cytokine" that promotes the survival and proliferation of Th17 cells. These cells are the primary source of IL-17. [1]'}},{id:'il17_22',name:'Effector Cytokines',tooltip:{title:'Effector Cytokines (IL-17 & IL-22)',content:'<ul><li><strong>IL-17:</strong> A key pro-inflammatory cytokine that stimulates keratinocytes to produce chemokines, recruiting inflammatory cells (like neutrophils) into the skin.</li><li><strong>IL-22:</strong> Directly drives the hyperproliferation of keratinocytes, leading to the thick, scaly plaques characteristic of psoriasis. [1]</li><li><strong>TNF-α:</strong> Another critical cytokine that contributes to the overall inflammatory milieu.</li></ul>'}}]}, {id:'kc_hyper',name:'Keratinocyte Hyperproliferation',tooltip:{title:'Clinical Manifestation',content:'The result of the cytokine cascade on the skin.'},children:[{id:'plaque',name:'Plaque Formation',tooltip:{title:'Plaque Formation',content:'The combined effects of IL-17 and IL-22 lead to:<ul><li><strong>Hyperproliferation:</strong> Epidermal cell turnover is dramatically increased.</li><li><strong>Inflammation:</strong> Influx of neutrophils and other immune cells into the epidermis and dermis.</li><li><strong>Vascular Changes:</strong> Dilation of blood vessels in the dermis.</li></ul>This results in the characteristic erythematous, indurated, and scaly psoriatic plaque.'}}]}]};
            const mindMapDataBySubtypes = {id:'root',name:'Clinical Subtypes',tooltip:{title:'Clinical Presentations of Psoriasis',content:'Psoriasis is a heterogeneous disease that can manifest in several distinct clinical forms. A patient can have more than one type at a time or over their lifetime. [4, 16]'},children:[{id:'plaque_sub',name:'Plaque Psoriasis',tooltip:{title:'Plaque Psoriasis (Psoriasis Vulgaris)',content:'<ul><li><strong>Prevalence:</strong> Most common type, affecting 80-90% of patients. [4, 16]</li><li><strong>Manifestations:</strong> Well-demarcated, raised, erythematous plaques with a silvery-white scale. [22, 23]</li><li><strong>Locations:</strong> Typically affects extensor surfaces like elbows and knees, scalp, and the lumbosacral area. [4]</li></ul>'}},{id:'guttate_sub',name:'Guttate Psoriasis',tooltip:{title:'Guttate Psoriasis',content:'<ul><li><strong>Prevalence:</strong> Affects about 8% of patients. [16]</li><li><strong>Manifestations:</strong> Characterized by small, "drop-like," erythematous papules and plaques. [16, 22]</li><li><strong>Triggers:</strong> Often appears suddenly after a streptococcal infection, especially in children and young adults. [4]</li></ul>'}},{id:'inverse_sub',name:'Inverse Psoriasis',tooltip:{title:'Inverse (Flexural) Psoriasis',content:'<ul><li><strong>Prevalence:</strong> Affects about 25% of patients. [16]</li><li><strong>Manifestations:</strong> Smooth, shiny, erythematous plaques without significant scaling. [4]</li><li><strong>Locations:</strong> Occurs in skin folds such as the axillae, groin, inframammary, and gluteal cleft.</li></ul>'}},{id:'pustular_sub',name:'Pustular Psoriasis',tooltip:{title:'Pustular Psoriasis',content:'<ul><li><strong>Prevalence:</strong> Affects about 3% of patients. [16]</li><li><strong>Manifestations:</strong> Characterized by sterile, pus-filled pustules. Can be localized (e.g., palmoplantar pustulosis) or generalized (von Zumbusch), which is a medical emergency. [4, 23]</li></ul>'}},{id:'erythro_sub',name:'Erythrodermic Psoriasis',tooltip:{title:'Erythrodermic Psoriasis',content:'<ul><li><strong>Manifestations:</strong> A severe form involving generalized erythema and scaling of >90% of the body surface area. [4]</li><li><strong>Complications:</strong> Can lead to severe systemic complications like dehydration, electrolyte imbalance, and cardiac failure, often requiring hospitalization.</li></ul>'}},{id:'nail_sub',name:'Nail Psoriasis',tooltip:{title:'Nail Psoriasis',content:'<ul><li><strong>Manifestations:</strong> Can affect fingernails and toenails. Findings include pitting, onycholysis (lifting of the nail plate), subungual hyperkeratosis, and "oil drop" spots. [23]</li><li><strong>Association:</strong> Strongly associated with the presence of psoriatic arthritis.</li></ul>'}}]};
            const mindMapDataByComorbid = {id:'root',name:'Comorbidities',tooltip:{title:'Psoriasis as a Systemic Disease',content:'Psoriasis is not just a skin disease; it is a systemic inflammatory condition associated with numerous significant comorbidities. [2, 7]'},children:[{id:'psa_comorbid',name:'Psoriatic Arthritis (PsA)',tooltip:{title:'Psoriatic Arthritis (PsA)',content:'<ul><li><strong>Prevalence:</strong> The most common comorbidity, affecting up to 30% of patients with psoriasis. [25]</li><li><strong>Impact:</strong> An inflammatory arthritis that can lead to irreversible joint damage and disability if not treated early.</li></ul>'}},{id:'cardio_comorbid',name:'Cardiometabolic Disease',tooltip:{title:'Cardiometabolic & Cardiovascular Disease',content:'<ul><li><strong>Association:</strong> Patients with moderate-to-severe psoriasis have an increased risk of obesity, hypertension, dyslipidemia, type 2 diabetes, and metabolic syndrome. [2, 5]</li><li><strong>Mechanism:</strong> Believed to be driven by shared systemic inflammatory pathways.</li><li><strong>Risk:</strong> Leads to a higher risk of major adverse cardiovascular events (MACE), including myocardial infarction and stroke. [7]</li></ul>'}},{id:'psych_comorbid',name:'Psychosocial Burden',tooltip:{title:'Psychosocial Comorbidities',content:'<ul><li><strong>Conditions:</strong> Increased prevalence of depression and anxiety.</li><li><strong>Impact:</strong> The visible nature of the disease can lead to social stigmatization, low self-esteem, and a significantly reduced quality of life, comparable to other major chronic diseases like cancer and heart disease. [2]</li></ul>'}},{id:'other_comorbid',name:'Other Comorbidities',tooltip:{title:'Other Associated Conditions',content:'<ul><li><strong>Inflammatory Bowel Disease:</strong> Increased risk of Crohn\'s disease.</li><li><strong>Uveitis:</strong> Inflammation of the eye, particularly common in patients with PsA.</li><li><strong>Fatty Liver Disease:</strong> Increased risk of non-alcoholic fatty liver disease (NAFLD).</li></ul>'}}]};
            const mindMapDataByPSA = {id:'root',name:'Psoriatic Arthritis (PsA)',tooltip:{title:'Psoriatic Arthritis (PsA) for the Dermatologist',content:'PsA is a seronegative inflammatory arthritis strongly associated with psoriasis. Dermatologists are on the front line for early detection, as skin disease precedes arthritis in ~85% of cases. [24]'},children:[{id:'screening',name:'Screening',tooltip:{title:'Screening for PsA in Psoriasis Patients',content:'Early diagnosis is critical to prevent irreversible joint damage. Dermatologists should screen psoriasis patients regularly.'},children:[{id:'mnemonic',name:'"PSA" Mnemonic',tooltip:{title:'The "PSA" Mnemonic',content:'A simple tool to remember key symptoms:<ul><li><strong>P:</strong> Pain in joints</li><li><strong>S:</strong> Stiffness (especially morning stiffness >30 min) / Swelling / Sausage digit</li><li><strong>A:</strong> Axial (inflammatory back pain)</li></ul>'}},{id:'tools_psa',name:'Screening Tools',tooltip:{title:'Validated Screening Questionnaires',content:'Tools like the PEST (Psoriasis Epidemiology Screening Tool) can be used in the clinic to identify patients at high risk who require referral to a rheumatologist.'}}]}, {id:'domains',name:'Clinical Domains',tooltip:{title:'The Domains of PsA',content:'PsA is a heterogeneous disease that can affect multiple musculoskeletal sites.'},children:[{id:'peripheral_psa',name:'Peripheral Arthritis',tooltip:{title:'Peripheral Arthritis',content:'Inflammation of joints in the limbs. Can be oligoarticular (<5 joints) or polyarticular (≥5 joints), and is often asymmetric.'}},{id:'axial_psa',name:'Axial Disease',tooltip:{title:'Axial Disease',content:'Inflammation of the spine (spondylitis) and sacroiliac joints (sacroiliitis), causing inflammatory back pain.'}},{id:'enthesitis_psa',name:'Enthesitis',tooltip:{title:'Enthesitis',content:'Inflammation at the site of tendon or ligament insertion into bone. Classic locations include the Achilles tendon and plantar fascia insertion on the heel.'}},{id:'dactylitis_psa',name:'Dactylitis',tooltip:{title:'Dactylitis ("Sausage Digit")',content:'Inflammation of the entire digit (finger or toe), including the joint, tendon, and soft tissue, leading to diffuse swelling.'}},{id:'skin_nails_psa',name:'Skin & Nails',tooltip:{title:'Skin and Nail Disease',content:'The presence of psoriasis, particularly nail psoriasis (pitting, onycholysis), is a key feature and a risk factor for developing PsA.'}}]}]};
            const mindMapDataByTreatmentModality = {id:'root',name:'By Modality',tooltip:{title:'Therapeutic Armamentarium',content:'An overview of psoriasis treatment options, organized by their mode of delivery and mechanism.'},children:[{id:'topical_tx',name:'Topical Therapies',tooltip:{title:'Topical Therapies',content:'First-line for limited or mild disease (<3-5% BSA) and used as adjuncts in moderate-to-severe disease.'},children:[{id:'top_steroids',name:'Corticosteroids',tooltip:{title:'Topical Corticosteroids',content:'The mainstay of topical treatment. Available in various potencies and vehicles (creams, ointments, foams, solutions).'}},{id:'vit_d',name:'Vitamin D Analogs',tooltip:{title:'Vitamin D Analogs',content:'(e.g., Calcipotriene, Calcitriol) Work by inhibiting keratinocyte proliferation. Often used in combination with steroids.'}},{id:'top_other',name:'Other Topicals',tooltip:{title:'Other Topical Agents',content:'Includes topical retinoids (Tazarotene), calcineurin inhibitors (for face/flexures), and newer agents like Tapinarof (Aryl hydrocarbon receptor agonist) and Roflumilast (PDE4 inhibitor).'}}]}, {id:'photo_tx',name:'Phototherapy',tooltip:{title:'Phototherapy',content:'The use of ultraviolet (UV) light to treat widespread psoriasis. A second-line option for moderate-to-severe disease.'},children:[{id:'nb_uvb',name:'Narrowband UVB (NB-UVB)',tooltip:{title:'Narrowband UVB',content:'The most common and effective form of phototherapy, using a specific wavelength (311 nm) of UV light.'}},{id:'puva_tx',name:'PUVA',tooltip:{title:'PUVA',content:'Psoralen plus UVA light. Highly effective but less commonly used now due to increased skin cancer risk and logistical challenges.'}},{id:'excimer_tx',name:'Excimer Laser',tooltip:{title:'Excimer Laser',content:'A targeted form of UVB therapy for localized, persistent plaques.'}}]}, {id:'systemic_tx',name:'Systemic Therapies',tooltip:{title:'Systemic Therapies',content:'Oral or injectable medications for moderate-to-severe psoriasis and psoriatic arthritis that work throughout the body.'},children:[{id:'oral_sys',name:'Traditional Oral Systemics',tooltip:{title:'Traditional Oral Systemics',content:'<ul><li><strong>Methotrexate:</strong> An immunomodulator effective for both skin and joints.</li><li><strong>Acitretin:</strong> An oral retinoid, particularly useful for pustular psoriasis.</li><li><strong>Cyclosporine:</strong> A potent immunosuppressant used for rapid control of severe flares.</li><li><strong>Apremilast:</strong> An oral PDE4 inhibitor.</li></ul>'}},{id:'biologics_sys',name:'Biologic Agents',tooltip:{title:'Biologic Agents',content:'Targeted monoclonal antibodies or fusion proteins that block specific cytokines or immune cells.'},children:[{id:'tnfi',name:'TNF-α inhibitors'},{id:'il17i',name:'IL-17 inhibitors'},{id:'il23i',name:'IL-23 inhibitors'},{id:'il1223i',name:'IL-12/23 inhibitors'}]},{id:'jak_sys_modality', name: 'Oral Targeted Synthetics', tooltip: {title:'Oral Targeted Synthetic DMARDs', content: 'Small molecule drugs that inhibit intracellular signaling pathways.'}, children: [{id:'jak_inhib', name: 'JAK inhibitors'}, {id:'tyk2_inhib', name: 'TYK2 inhibitors'}]}]}]};
            const mindMapDataByTreatmentSkin = {id:'root',name:'Psoriasis (Skin)',tooltip:{title:'Treatment Algorithm for Psoriasis',content:'Treatment is stratified based on disease severity (Body Surface Area affected) and location.'},children:[{id:'mild_skin',name:'Mild/Limited Disease',tooltip:{title:'Mild to Moderate Plaque Psoriasis (<5-10% BSA)',content:'Typically managed with topical therapies.'},children:[{id:'mild_first',name:'First Line',tooltip:{title:'First-Line for Mild Psoriasis',content:'<ul><li><strong>High-potency topical corticosteroids</strong> (e.g., clobetasol).</li><li>Combination topicals (e.g., <strong>steroid + vitamin D analog</strong>) are often more effective.</li></ul>'}},{id:'mild_second',name:'Second Line / Special Sites',tooltip:{title:'Second-Line & Special Sites',content:'<ul><li><strong>Face/Flexures:</strong> Lower potency steroids, topical calcineurin inhibitors.</li><li><strong>Refractory Plaques:</strong> Topical retinoids (Tazarotene), intralesional steroid injections.</li></ul>'}}]}, {id:'mod_sev_skin',name:'Moderate-to-Severe Disease',tooltip:{title:'Moderate to Severe Plaque Psoriasis (>5-10% BSA or impacting sensitive areas)',content:'Requires phototherapy or systemic treatment.'},children:[{id:'photo_skin',name:'Phototherapy',tooltip:{title:'Phototherapy',content:'An excellent option for patients with widespread disease who have access and no contraindications. <strong>Narrowband UVB</strong> is the preferred modality.'}},{id:'systemic_skin',name:'Systemic Therapy',tooltip:{title:'Systemic Therapy',content:'The mainstay for most patients with moderate-to-severe disease.'},children:[{id:'biologics_skin',name:'Biologics First-Line',tooltip:{title:'Biologics as First-Line Systemic',content:'Due to their high efficacy and favorable safety profiles, biologics are often preferred. Choice depends on comorbidities and patient factors.<ul><li><strong>IL-17 / IL-23 inhibitors:</strong> Generally offer the highest levels of skin clearance (PASI 90/100).</li><li><strong>TNF-α inhibitors:</strong> Broadly effective, especially if PsA is also present.</li></ul>'}},{id:'orals_skin',name:'Oral Systemics',tooltip:{title:'Oral Systemics',content:'Still important options.<ul><li><strong>Methotrexate:</strong> A cost-effective choice for skin and joints.</li><li><strong>Apremilast:</strong> Oral option with a favorable safety profile (no lab monitoring).</li><li><strong>Deucravacitinib:</strong> A newer oral selective TYK2 inhibitor with efficacy comparable to some biologics.</li></ul>'}}]}]}]};
            const mindMapDataByTreatmentPSA = {id:'root',name:'Psoriatic Arthritis (PsA)',tooltip:{title:'Treatment Algorithm for PsA',content:'Treatment choice is guided by the specific domains of disease involved (e.g., peripheral arthritis, axial disease, enthesitis).'},children:[{id:'nsaids_psa',name:'Initial Symptom Control',tooltip:{title:'Initial Symptom Control',content:'Non-steroidal anti-inflammatory drugs (NSAIDs) can be used for mild pain and stiffness but do not prevent joint damage.'}},{id:'csdmards_psa',name:'csDMARDs',tooltip:{title:'Conventional Synthetic DMARDs',content:'<strong>Methotrexate:</strong> Often the first-line DMARD, especially for peripheral arthritis. It treats both skin and joints but is not effective for axial disease.'}},{id:'biologics_psa',name:'Biologics & tsDMARDs',tooltip:{title:'Biologics and Targeted Synthetic DMARDs (tsDMARDs)',content:'The primary treatment for moderate-to-severe or progressive PsA. The choice is based on the dominant clinical domain.'},children:[{id:'peripheral_tx',name:'Peripheral Arthritis Dominant',tooltip:{title:'Treatment for Peripheral Arthritis',content:'<ul><li><strong>TNF-α inhibitors:</strong> The gold-standard first-line biologic class, effective for all PsA domains.</li><li><strong>IL-17 inhibitors:</strong> Highly effective for joints and skin.</li><li><strong>IL-23 inhibitors:</strong> Effective, particularly with prominent skin disease.</li><li><strong>Oral JAK inhibitors:</strong> An effective oral alternative to biologics.</li></ul>'}},{id:'axial_tx',name:'Axial Disease Dominant',tooltip:{title:'Treatment for Axial Disease',content:'<ul><li><strong>First Line:</strong> TNF-α inhibitors.</li><li><strong>Second Line:</strong> IL-17 inhibitors.</li><li>(Note: IL-23 and IL-12/23 inhibitors are generally not effective for axial disease).</li></ul>'}},{id:'enthesitis_dactylitis_tx',name:'Enthesitis/Dactylitis Dominant',tooltip:{title:'Treatment for Enthesitis and Dactylitis',content:'Generally responds well to the same biologics used for peripheral arthritis, particularly <strong>TNF-α</strong> and <strong>IL-17 inhibitors</strong>.'}},{id:'comorbid_tx_consider',name:'Comorbidity Considerations',tooltip:{title:'Considering Comorbidities',content:'<ul><li><strong>Inflammatory Bowel Disease:</strong> Prefer TNF-α inhibitors or IL-12/23 inhibitors. AVOID IL-17 inhibitors.</li><li><strong>Uveitis:</strong> Prefer monoclonal antibody TNF-α inhibitors (e.g., adalimumab, infliximab).</li></ul>'}}]}]};

            const tooltip = document.getElementById('tooltip');
            const container = document.getElementById('mind-map-container');
            const tabBar = document.getElementById('tab-bar');
            const treatmentTab = document.getElementById('tab-treatment');
            
            const dataMap = {
                'patho': mindMapDataByPatho,
                'subtypes': mindMapDataBySubtypes,
                'comorbid': mindMapDataByComorbid,
                'psa': mindMapDataByPSA,
                'treatment-modality': mindMapDataByTreatmentModality,
                'treatment-skin': mindMapDataByTreatmentSkin,
                'treatment-psa': mindMapDataByTreatmentPSA,
            };

            // --- D3 Drawing Logic ---
            function drawMindMap(data, svgId) {
                const svgElement = document.getElementById(svgId);
                if (!svgElement || !svgElement.parentElement) return;
                
                const container = svgElement.parentElement;
                const width = container.clientWidth;
                const height = container.clientHeight;
                const isMobile = width < 768;
                
                const root = d3.hierarchy(data);
                root.descendants().forEach(d => { d.x0 = 0; d.y0 = 0; });
                if (root.children) { root.children.forEach(collapse); }

                const svg = d3.select(svgElement).attr("viewBox", [-width / 2, -height / 2, width, height]);
                svg.selectAll("*").remove();
                const g = svg.append("g");
                
                const treeLayout = d3.tree()
                    .size([2 * Math.PI, Math.min(width, height) / 2 - (isMobile ? 60 : 100)])
                    .separation((a, b) => (a.parent === b.parent ? 1 : 2) / (a.depth || 1));
                
                let i = 0;
                root.eachBefore(d => d.id = `node-${i++}`);

                function update(source) {
                    const duration = 500;
                    const treeData = treeLayout(root);
                    const nodes = treeData.descendants().reverse();
                    const links = treeData.links();

                    const visibleNodeCount = nodes.filter(d => !d.children && !d._children ? true : d.children ? true : false).length;
                    
                    let sizeMultiplier = 1.0;
                    if (visibleNodeCount <= 10) sizeMultiplier = 1.2;
                    else if (visibleNodeCount <= 20) sizeMultiplier = 1.0;
                    else sizeMultiplier = 0.85;
                    
                    const baseRadii = [isMobile ? 30 : 36, isMobile ? 24 : 28, isMobile ? 20 : 24, isMobile ? 16 : 20, isMobile ? 14 : 17];
                    const baseFontSizes = [isMobile ? 9 : 11, isMobile ? 8 : 9, isMobile ? 7 : 8, isMobile ? 6 : 7, isMobile ? 5 : 6];
                    const radii = baseRadii.map(r => Math.round(r * sizeMultiplier));
                    const fontSizes = baseFontSizes.map(s => Math.round(s * sizeMultiplier) + 'px');
                    const colors = ['#a5b4fc', '#c7d2fe', '#e0e7ff', '#eef2ff', '#f9fafb'];
                    
                    const gLink = g.selectAll(".link-group").data([null]);
                    gLink.enter().append("g").attr("class", "link-group").lower();
                    const gNode = g.selectAll(".node-group").data([null]);
                    gNode.enter().append("g").attr("class", "node-group");

                    const link = g.select(".link-group").selectAll(".link").data(links, d => d.target.id);
                    const linkEnter = link.enter().append("path").attr("class", "link")
                        .attr("d", d => {
                            const o = {x: source.x0 || 0, y: source.y0 || 0};
                            return d3.linkRadial().angle(d => d.x || 0).radius(d => d.y || 0)({source: o, target: o});
                        });
                    link.merge(linkEnter).transition().duration(duration).attr("d", d3.linkRadial().angle(d => d.x).radius(d => d.y));
                    link.exit().transition().duration(duration).attr("d", d => {
                        const o = {x: source.x || 0, y: source.y || 0};
                        return d3.linkRadial().angle(d => d.x || 0).radius(d => d.y || 0)({source: o, target: o});
                    }).remove();

                    const node = g.select(".node-group").selectAll(".node").data(nodes, d => d.id);
                    const nodeEnter = node.enter().append("g").attr("class", "node")
                        .attr("transform", d => `translate(${radialPoint(source.x0 || 0, source.y0 || 0)})`)
                        .on("click", click);
                    nodeEnter.append("circle").attr("r", 1e-6);
                    nodeEnter.append("text").attr("class", "node-text")
                        .style("font-size", d => fontSizes[d.depth] || fontSizes[fontSizes.length-1])
                        .each(function(d) { wrapText(this, d, radii); });
                    
                    const nodeUpdate = nodeEnter.merge(node);
                    nodeUpdate.transition().duration(duration).attr("transform", d => `translate(${radialPoint(d.x, d.y)})`);
                    nodeUpdate.select("circle").transition().duration(duration)
                        .attr("r", d => radii[d.depth] || radii[radii.length-1])
                        .attr("fill", d => colors[d.depth] || colors[colors.length-1])
                        .attr("class", d => d._children ? "collapsible" : "");

                    nodeUpdate
                        .on('mousemove', (event, d) => {
                            tooltip.style.visibility = 'visible';
                            tooltip.style.opacity = '1';
                            const tooltipRect = tooltip.getBoundingClientRect();
                            let left = event.pageX + 15, top = event.pageY + 15;
                            if (left + tooltipRect.width > window.innerWidth) left = event.pageX - tooltipRect.width - 15;
                            if (top + tooltipRect.height > window.innerHeight) top = event.pageY - tooltipRect.height - 15;
                            tooltip.style.left = `${left}px`;
                            tooltip.style.top = `${top}px`;
                            tooltip.innerHTML = `<div class="tooltip-title">${d.data.tooltip.title}</div><div class="tooltip-content">${d.data.tooltip.content}</div>`;
                        }).on('mouseleave', () => {
                            tooltip.style.visibility = 'hidden';
                            tooltip.style.opacity = '0';
                        });

                    node.exit().transition().duration(duration)
                        .attr("transform", d => `translate(${radialPoint(source.x || 0, source.y || 0)})`).remove()
                        .select("circle").attr("r", 1e-6);
                    nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
                }

                function click(event, d) {
                    if (event.defaultPrevented) return;
                    if (d.children) { d._children = d.children; d.children = null; } 
                    else if (d._children) {
                        d.children = d._children; d._children = null;
                        if (d.children) { d.children.forEach(child => { if (child.x0 === undefined) child.x0 = d.x0 || 0; if (child.y0 === undefined) child.y0 = d.y0 || 0; }); }
                    }
                    update(d);
                }

                function collapse(d) {
                    if(d.children) { d._children = d.children; d._children.forEach(collapse); d.children = null; }
                    if (d.x0 === undefined) d.x0 = 0; if (d.y0 === undefined) d.y0 = 0;
                }

                function radialPoint(x, y) { return [(y = +y) * Math.cos(x -= Math.PI / 2), y * Math.sin(x)]; }

                function wrapText(element, d, radii) {
                    const textElement = d3.select(element);
                    const words = d.data.name.split(/\s+/).filter(w => w.length > 0);
                    const lineHeight = 1.1;
                    const radius = radii[d.depth] || radii[radii.length-1];
                    const maxLineWidth = (radius - 5) * 2;
                    textElement.text(null);
                    const lines = []; let line = [];
                    let tempTspan = textElement.append("tspan");
                    words.forEach(word => {
                        line.push(word);
                        tempTspan.text(line.join(" "));
                        if (tempTspan.node().getComputedTextLength() > maxLineWidth && line.length > 1) {
                            line.pop(); lines.push(line.join(" ")); line = [word];
                        }
                    });
                    lines.push(line.join(" "));
                    tempTspan.remove();
                    const startY = -(lines.length - 1) * 0.5 * lineHeight;
                    lines.forEach((lineText, i) => {
                        textElement.append("tspan").attr("x", 0).attr("dy", i === 0 ? `${startY}em` : `${lineHeight}em`).text(lineText);
                    });
                }
                
                update(root);
            }
            
            // --- Core Application Logic ---
            function switchTab(tabName) {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.mind-map-view').forEach(v => v.classList.remove('active'));
                
                const mainTabId = `tab-${tabName.startsWith('treatment') ? 'treatment' : tabName}`;
                const mainTabEl = document.getElementById(mainTabId);
                if (mainTabEl) mainTabEl.classList.add('active');

                const viewId = `view-${tabName}`;
                const view = document.getElementById(viewId);
                if (view) {
                    view.classList.add('active');
                    view.innerHTML = '<div class="loading-indicator">Loading Interactive Map...</div>';
                    setTimeout(() => {
                        const svgId = `mind-map-svg-${tabName}`;
                        const data = dataMap[tabName];
                        if (data) {
                            view.innerHTML = `<svg id="${svgId}"></svg>`;
                            drawMindMap(data, svgId);
                        }
                    }, 10);
                }
            }

            // --- Event Listeners ---
            tabBar.addEventListener('click', (e) => {
                e.preventDefault();
                const target = e.target;
                
                const dropdownItem = target.closest('.dropdown-item');
                const targetTab = target.closest('.tab');

                if (dropdownItem && dropdownItem.dataset.tab) {
                    switchTab(dropdownItem.dataset.tab);
                    if (treatmentTab) treatmentTab.classList.remove('dropdown-active');
                } else if (targetTab && targetTab.id === 'tab-treatment') {
                    targetTab.classList.toggle('dropdown-active');
                } else if (targetTab && targetTab.dataset.tab) {
                    switchTab(targetTab.dataset.tab);
                }
            });

            window.addEventListener('click', (e) => {
                if (treatmentTab && !treatmentTab.contains(e.target)) {
                    treatmentTab.classList.remove('dropdown-active');
                }
            });

            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    const activeView = document.querySelector('.mind-map-view.active');
                    if (activeView) {
                        const activeTabName = activeView.id.replace('view-', '');
                        switchTab(activeTabName);
                    }
                }, 250);
            });
            
            // --- Initial Load ---
            switchTab('patho');

        })();
    });
    </script>
</body>
</html>
