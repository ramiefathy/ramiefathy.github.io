	    // CHANGE #1: Model selector summary + modal (reduces scrolling)

	      for (const m of DATA.modelSummary) {
	        if (!selected.has(m.model)) continue;
	        counts.total += 1;
	        if (m.provider === 'openai') counts.openai += 1;
	        if (m.provider === 'gemini') counts.gemini += 1;
	      }
	      return counts;
	    };

	    const ModelSelectorModal = ({ isOpen, onClose, selectedModels, setSelectedModels }) => {
	      const closeBtnRef = useRef(null);

	      useEffect(() => {
	        if (!isOpen) return;
	        const prevOverflow = document.body.style.overflow;
	        document.body.style.overflow = 'hidden';
	        return () => { document.body.style.overflow = prevOverflow; };
	      }, [isOpen]);

	      useEffect(() => {
	        if (!isOpen) return;
	        const onKeyDown = (e) => { if (e.key === 'Escape') onClose(); };
	        window.addEventListener('keydown', onKeyDown);
	        return () => window.removeEventListener('keydown', onKeyDown);
	      }, [isOpen, onClose]);

	      useEffect(() => {
	        if (!isOpen) return;
	        setTimeout(() => closeBtnRef.current?.focus(), 0);
	      }, [isOpen]);

	      if (!isOpen) return null;

	      return (
	        <div className="modalOverlay" onMouseDown={onClose} role="presentation">

		              <div style={{ fontSize: 12, color: '#6b7280' }}>{selectedModels.length} selected</div>

	          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap', padding: '10px 12px', background: '#f9fafb', border: '1px solid #e5e7eb', borderRadius: 10 }}>
	            <div style={{ fontSize: 13, color: '#374151', fontWeight: 650 }}>
	              {counts.total} models selected · OpenAI {counts.openai} · Gemini {counts.gemini}
	            </div>

	          <ModelSelectorModal

	            setSelectedModels={setSelectedModels}
	          />
	        </div>
	      );
	    };

	    // CHANGE #2: Scrollable containers (max-height + sticky headers + scroll shadows)
	    const ScrollableShell = ({ maxHeight = 400, children }) => {
	      const frameRef = useRef(null);
	      const [shadowTop, setShadowTop] = useState(false);
	      const [shadowBottom, setShadowBottom] = useState(false);

	      const updateShadows = () => {
	        const el = frameRef.current;
	        if (!el) return;
	        const top = el.scrollTop > 0;
	        const bottom = el.scrollTop + el.clientHeight < el.scrollHeight - 1;
	        setShadowTop(top);
	        setShadowBottom(bottom);
	      };

	      useEffect(() => { updateShadows(); }, [maxHeight, children]);

	      useEffect(() => {
	        const el = frameRef.current;
	        if (!el) return;
	        updateShadows();
	        const onScroll = () => updateShadows();
	        el.addEventListener('scroll', onScroll, { passive: true });
	        window.addEventListener('resize', updateShadows);
	        return () => {
	          el.removeEventListener('scroll', onScroll);
	          window.removeEventListener('resize', updateShadows);
	        };
	      }, []);

	      return (
	        <div className="scrollShell" data-shadow-top={shadowTop} data-shadow-bottom={shadowBottom}>
	          <div ref={frameRef} className="scrollFrame" style={{ maxHeight }}>
	            {children}
	          </div>
	        </div>
	      );

	    // Stat Card
	    const StatCard = ({ value, label, color = '#111', format = 'number' }) => (

	                Key Finding

	              <div style={{ fontSize: 18, fontWeight: 850, color: '#111827', lineHeight: 1.25 }}>
	                {headlineModelName(top?.model || '')} achieved {(topAcc * 100).toFixed(1)}% accuracy — the highest among all {totalModels} models tested.
	              </div>
	              <div style={{ marginTop: 8, fontSize: 13, color: '#6b7280' }}>

	              <div style={{ display: 'grid', gap: 10 }}>
	                {top3.map((m, i) => {
	                  const color = getModelColor(m.model, m.provider);

	                    <div key={m.model} style={{ display: 'grid', gridTemplateColumns: '110px 1fr 56px', alignItems: 'center', gap: 10 }}>

	                        <div style={{ width: `${widthPct}%`, height: '100%', background: color, borderRadius: 999 }}></div>
	                      </div>
	                      <div style={{ fontSize: 12, fontWeight: 850, color: '#111827', textAlign: 'right' }}>{(m.accuracy * 100).toFixed(1)}%</div>
	                    </div>
	                  );
	                })}
	              </div>
	            </div>
	          </div>
	        </div>
	      );
	    };

	    // Overview Tab
	    const OverviewTab = ({ selectedModels }) => {
	      const stats = DATA.overallStats;
	      const defaultOpen = useMemo(() => (typeof window !== 'undefined' ? window.innerWidth >= 900 : true), []);

	      return (

	            <StatCard value={stats.malignantSensitivity} label="Sensitivity" format="percent" color={COLORS.openai.primary} />
	            <StatCard value={stats.benignSpecificity} label="Specificity" format="percent" color={COLORS.gemini.primary} />
	          </div>
	          <div style={S.grid2}>
	            <CollapsibleCard id="overview-prompting" title="Prompting Strategy" defaultOpen={defaultOpen}>
	              <div style={{ height: 280 }}>
	                <ResponsiveContainer>
	                  <BarChart data={armData} layout="vertical" margin={{ left: 180, right: 30 }}>
	                    <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0" />
	                    <XAxis type="number" domain={[0, 1]} tickFormatter={v => `${(v * 100).toFixed(0)}%`} tick={{ fontSize: 11 }} />
	                    <YAxis type="category" dataKey="name" tick={{ fontSize: 11 }} width={170} />

	                    <Bar dataKey="accuracy" radius={[0, 4, 4, 0]}>
	                      {armData.map((e, i) => <Cell key={i} fill={e.accuracy > 0.7 ? COLORS.gemini.primary : e.accuracy > 0.6 ? '#f59e0b' : '#ef4444'} />)}
	                    </Bar>

	            <CollapsibleCard id="overview-diagnosis" title="By Diagnosis" defaultOpen={defaultOpen}>

    // Leaderboard Tab
    const LeaderboardTab = ({ selectedModels }) => {

      const [diagFilter, setDiagFilter] = useState('all');
      const [armFilter, setArmFilter] = useState('all');
      const [sortKey, setSortKey] = useState('accuracy');
      const [sortDir, setSortDir] = useState('desc');
      const diagKeys = ['basal_cell_carcinoma', 'melanoma', 'squamous_cell_carcinoma', 'seborrheic_keratosis', 'melanocytic_nevus', 'dermatofibroma', 'verruca_vulgaris', 'lichen_planus'];

      const rankedData = useMemo(() => {
        let data = DATA.modelSummary.filter(m => selectedModels.includes(m.model)).map(m => {

          if (rankBy === 'diagnosis' && diagFilter !== 'all') {
            const d = DATA.modelDiagMatrix.find(x => x.model === m.model);
            acc = d ? d[diagFilter] || 0 : 0;
          } else if (rankBy === 'arm' && armFilter !== 'all') {
            const a = DATA.modelArmMatrix.find(x => x.model === m.model);
            acc = a ? a[`arm${armFilter}`] || 0 : 0;
          }
          return { ...m, displayAccuracy: acc };
        });
        const key = sortKey === 'accuracy' ? 'displayAccuracy' : sortKey;
        data.sort((a, b) => (sortDir === 'desc' ? -1 : 1) * ((a[key] || 0) - (b[key] || 0)));
        return data.map((d, i) => ({ ...d, rank: i + 1 }));

	    // Heatmaps Tab
	    const HeatmapsTab = ({ selectedModels }) => {

	      const getColor = (v, min = 0.3, max = 0.95) => { if (!v) return '#f9fafb'; const n = Math.max(0, Math.min(1, (v - min) / (max - min))); return n < 0.33 ? '#ef4444' : n < 0.66 ? '#f59e0b' : '#22c55e'; };

	        <div>

		                          {arms.map(a => (
		                            <td key={a} style={{ ...S.td, padding: 4 }}>
		                              <div style={{ background: getColor(row[`arm${a}`], 0.35, 0.92), padding: '10px 8px', textAlign: 'center', borderRadius: 4, fontWeight: 600, fontSize: 13, color: row[`arm${a}`] > 0.65 ? 'white' : '#1f2937' }}>
		                                {row[`arm${a}`] ? (row[`arm${a}`] * 100).toFixed(0) + '%' : '-'}
		                              </div>
		                            </td>
		                          ))}
		                        </tr>
		                      );
		                    })}
		                  </tbody>
		                </table>
		              </ScrollableShell>
		            </div>

		            <div id="heatmaps-diagnosis" className="jumpTarget" style={{ ...S.card, marginBottom: 0 }}>
		              <div style={S.cardTitle}>Model × Diagnosis</div>
		              <ScrollableShell maxHeight={400}>
		                <table style={S.table}>
		                  <thead>
		                    <tr>
		                      <th style={{ ...S.th, width: 180 }}>Model</th>
		                      {diagKeys.map(d => <th key={d} style={{ ...S.th, textAlign: 'center', width: 80, fontSize: 10 }}>{diagLabels[d]}</th>)}
		                    </tr>
		                  </thead>
		                  <tbody>
		                    {filteredDiag.map(row => {
		                      const info = DATA.modelSummary.find(m => m.model === row.model);
		                      return (
		                        <tr key={row.model}>
		                          <td style={{ ...S.td, fontWeight: 600, color: getModelColor(row.model, info?.provider) }}>{shortModelName(row.model)}</td>
		                          {diagKeys.map(d => (
		                            <td key={d} style={{ ...S.td, padding: 4 }}>
		                              <div style={{ background: getColor(row[d], 0.1, 1.0), padding: '10px 4px', textAlign: 'center', borderRadius: 4, fontWeight: 600, fontSize: 12, color: row[d] > 0.55 ? 'white' : '#1f2937' }}>
		                                {row[d] ? (row[d] * 100).toFixed(0) + '%' : '-'}
		                              </div>
		                            </td>
		                          ))}
		                        </tr>
		                      );
		                    })}
		                  </tbody>
		                </table>
		              </ScrollableShell>
		            </div>
	          </div>
	          <div style={{ display: 'flex', justifyContent: 'center', gap: 16, marginTop: 16, fontSize: 12 }}>
	            <span><span style={{ display: 'inline-block', width: 20, height: 12, background: '#ef4444', borderRadius: 2, marginRight: 6 }}></span>&lt;50%</span>
	            <span><span style={{ display: 'inline-block', width: 20, height: 12, background: '#f59e0b', borderRadius: 2, marginRight: 6 }}></span>50-70%</span>
	            <span><span style={{ display: 'inline-block', width: 20, height: 12, background: '#22c55e', borderRadius: 2, marginRight: 6 }}></span>&gt;70%</span>
	          </div>
	        </div>
	      );
	    };

    // Errors Tab
	    const ErrorsTab = () => {
	      const data = DATA.errorDistribution.map(e => ({ ...e, label: e.type.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()), percent: (e.count / DATA.overallStats.totalTrials * 100).toFixed(1) }));
	      const colors = { 'correct': COLORS.gemini.primary, 'within_malignant': '#f59e0b', 'malignant_to_benign': '#dc2626', 'benign_to_malignant': '#7c3aed', 'within_benign': COLORS.openai.primary, 'pred_other': '#6b7280' };

	      return (
	        <div style={S.grid2}>
	          <div id="errors-distribution" className="jumpTarget" style={S.card}>
	            <div style={S.cardTitle}>Error Type Distribution</div>
	            <div style={{ height: 320 }}>
	              <ResponsiveContainer>
	                <BarChart data={data} layout="vertical" margin={{ left: 130, right: 40 }}>
	                  <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0" />
                  <XAxis type="number" tick={{ fontSize: 11 }} />
                  <YAxis type="category" dataKey="label" tick={{ fontSize: 12 }} width={120} />
                  <Tooltip formatter={(v, n, p) => [`${v.toLocaleString()} (${p.payload.percent}%)`, 'Count']} />
                  <Bar dataKey="count" radius={[0, 4, 4, 0]}>
                    {data.map((e, i) => <Cell key={i} fill={colors[e.type]} />)}
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
	            </div>
	          </div>
	          <div>
	            <div id="errors-clinical" className="jumpTarget" style={{ ...S.card, background: '#fef2f2', border: '1px solid #fecaca' }}>
	              <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 12, color: '#991b1b' }}>Clinical Impact Summary</div>
	              <div style={{ fontSize: 13, color: '#7f1d1d' }}>
	                <div style={{ marginBottom: 8 }}><strong style={{ fontSize: 20 }}>{data.find(e => e.type === 'malignant_to_benign')?.count.toLocaleString()}</strong> missed malignancies ({data.find(e => e.type === 'malignant_to_benign')?.percent}%)</div>
	                <div style={{ marginBottom: 8 }}><strong style={{ fontSize: 20 }}>{data.find(e => e.type === 'benign_to_malignant')?.count.toLocaleString()}</strong> false alarms ({data.find(e => e.type === 'benign_to_malignant')?.percent}%)</div>
	                <div><strong style={{ fontSize: 20 }}>{data.find(e => e.type === 'within_malignant')?.count.toLocaleString()}</strong> cancer type confusions ({data.find(e => e.type === 'within_malignant')?.percent}%)</div>
	              </div>
	            </div>
	          </div>
	        </div>
	      );
	    };

    // Performance Tab
	    const PerformanceTab = ({ selectedModels }) => {
	      const filteredCost = DATA.costPerformance.filter(m => selectedModels.includes(m.model));
	      const filteredLatency = DATA.latencyData.filter(m => selectedModels.includes(m.model));

	      return (
	        <div className="dual-chart-container">
	          <div id="performance-cost" className="jumpTarget" style={{ ...S.card, marginBottom: 0 }}>
	            <div style={S.cardTitle}>Cost-Efficiency Frontier</div>
	            <div style={{ height: 420 }}>
	              <ResponsiveContainer>
	                <ScatterChart margin={{ left: 20, right: 60, top: 20, bottom: 30 }}>
	                  <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0" />
                  <XAxis type="number" dataKey="cost" name="Cost" tick={{ fontSize: 11 }} label={{ value: 'Cost per trial (¢)', position: 'bottom', offset: 10, fontSize: 12 }} />
                  <YAxis type="number" dataKey="accuracy" domain={[0.55, 0.85]} tickFormatter={v => `${(v*100).toFixed(0)}%`} tick={{ fontSize: 11 }} label={{ value: 'Accuracy', angle: -90, position: 'insideLeft', fontSize: 12 }} />
                  <Tooltip content={({ payload }) => { if (!payload?.length) return null; const d = payload[0].payload; return (<div style={{ background: 'white', border: '1px solid #e5e7eb', padding: 12, borderRadius: 8 }}><div style={{ fontWeight: 700, marginBottom: 6, color: getModelColor(d.model, d.provider) }}>{shortModelName(d.model)}</div><div style={{ fontSize: 12 }}>Accuracy: <strong>{(d.accuracy * 100).toFixed(1)}%</strong></div><div style={{ fontSize: 12 }}>Cost: <strong>{d.cost.toFixed(2)}¢/trial</strong></div></div>); }} />
                  <Scatter data={filteredCost}>
                    {filteredCost.map((d, i) => <Cell key={i} fill={getModelColor(d.model, d.provider)} r={8} />)}
                  </Scatter>
                </ScatterChart>
              </ResponsiveContainer>
            </div>
	            <div style={{ display: 'flex', justifyContent: 'center', gap: 32, marginTop: 16, fontSize: 12 }}>
	              <span><span style={{ display: 'inline-block', width: 14, height: 14, background: COLORS.openai.primary, borderRadius: '50%', marginRight: 8 }}></span>OpenAI</span>
	              <span><span style={{ display: 'inline-block', width: 14, height: 14, background: COLORS.gemini.primary, borderRadius: '50%', marginRight: 8 }}></span>Gemini</span>
	            </div>
	          </div>
	          <div id="performance-latency" className="jumpTarget" style={{ ...S.card, marginBottom: 0 }}>
	            <div style={S.cardTitle}>Mean Response Latency</div>
	            <div style={{ height: 380 }}>
	              <ResponsiveContainer>
	                <BarChart data={filteredLatency} margin={{ left: 20, right: 20, bottom: 90 }}>
	                  <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0" />
                  <XAxis dataKey="model" tick={{ fontSize: 10 }} angle={-45} textAnchor="end" height={90} tickFormatter={shortModelName} interval={0} />
                  <YAxis tick={{ fontSize: 11 }} label={{ value: 'Latency (s)', angle: -90, position: 'insideLeft', fontSize: 11 }} />
                  <Tooltip content={({ payload }) => { if (!payload?.length) return null; const d = payload[0].payload; return (<div style={{ background: 'white', border: '1px solid #e5e7eb', padding: 12, borderRadius: 8 }}><div style={{ fontWeight: 700, marginBottom: 6 }}>{shortModelName(d.model)}</div><div style={{ fontSize: 12 }}>Mean: {d.mean.toFixed(2)}s</div><div style={{ fontSize: 12 }}>Median: {d.median.toFixed(2)}s</div></div>); }} />
                  <Bar dataKey="mean" radius={[4, 4, 0, 0]}>
                    {filteredLatency.map((d, i) => { const info = DATA.modelSummary.find(m => m.model === d.model); return <Cell key={i} fill={getModelColor(d.model, info?.provider)} />; })}
                  </Bar>
	                </BarChart>
	              </ResponsiveContainer>
	            </div>
	          </div>
	        </div>
	      );
	    };

	    // CHANGE #3: Jump-to menu options per tab (scrollIntoView targets)
	    const JUMP_TO = {
	      overview: [
	        { id: 'overview-key-stats', label: 'Key Stats' },
	        { id: 'overview-prompting', label: 'Prompting Strategy Chart' },
	        { id: 'overview-diagnosis', label: 'Diagnosis Chart' },
	      ],
	      leaderboard: [
	        { id: 'leaderboard-table', label: 'Rankings Table' },
	        { id: 'leaderboard-bar', label: 'Bar Chart Comparison' },
	      ],
	      heatmaps: [
	        { id: 'heatmaps-arm', label: 'Model × Arm' },
	        { id: 'heatmaps-diagnosis', label: 'Model × Diagnosis' },
	      ],
	      errors: [
	        { id: 'errors-distribution', label: 'Error Distribution' },
	        { id: 'errors-clinical', label: 'Clinical Impact' },
	      ],
	      performance: [
	        { id: 'performance-cost', label: 'Cost-Efficiency Scatter' },
	        { id: 'performance-latency', label: 'Latency Chart' },
	      ],
	    };

	    // Main App
	    function App() {
	      const [tab, setTab] = useState('overview');
	      const [selectedModels, setSelectedModels] = useState(DATA.modelSummary.map(m => m.model));
	      const [jumpToValue, setJumpToValue] = useState('');
	      const [compactMode, setCompactMode] = useState(false);
	      const tabs = [
	        { id: 'overview', label: 'Overview', icon: '📊' },
	        { id: 'leaderboard', label: 'Leaderboard', icon: '🏆' },
	        { id: 'heatmaps', label: 'Heatmaps', icon: '🗺️' },
	        { id: 'errors', label: 'Error Analysis', icon: '⚠️' },
	        { id: 'performance', label: 'Cost & Latency', icon: '⚡' },
	      ];

	      const jumpOptions = JUMP_TO[tab] || [];

	      useEffect(() => { setJumpToValue(''); }, [tab]);

	      const handleJump = (e) => {
	        const id = e.target.value;
	        if (!id) return;
	        const el = document.getElementById(id);
	        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
	        setJumpToValue('');
	      };

	      return (
	        <div className={`dashboardRoot${compactMode ? ' compact-mode' : ''}`} style={S.container}>
	          <a href="/apps" className="back-link">← Back to Apps</a>
	          <header style={S.header}>
	            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 16 }}>
	              <div>
	                <h1 style={S.title}>Dermoscopy LLM Evaluation Dashboard</h1>
	                <p className="subtitle" style={S.subtitle}>Multimodal LLM performance across 17 models, 6 prompting strategies, 8 diagnoses</p>
	              </div>
	              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 10 }}>
	                <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', justifyContent: 'flex-end' }}>
	                  <span style={{ ...S.badge, background: COLORS.openai.bg, color: COLORS.openai.dark, padding: '6px 12px' }}>
	                    <span style={{ width: 10, height: 10, borderRadius: '50%', background: COLORS.openai.primary, display: 'inline-block', marginRight: 8 }}></span>OpenAI
	                  </span>
	                  <span style={{ ...S.badge, background: COLORS.gemini.bg, color: COLORS.gemini.dark, padding: '6px 12px' }}>
	                    <span style={{ width: 10, height: 10, borderRadius: '50%', background: COLORS.gemini.primary, display: 'inline-block', marginRight: 8 }}></span>Gemini
	                  </span>
	                </div>
	                <button
	                  type="button"
	                  className="switchBtn"
	                  role="switch"
	                  aria-checked={compactMode}
	                  onClick={() => setCompactMode(v => !v)}
	                >
	                  <span className={`switchTrack${compactMode ? ' switchTrackOn' : ''}`}>
	                    <span className={`switchKnob${compactMode ? ' switchKnobOn' : ''}`}></span>
	                  </span>
	                  Compact View
	                </button>
	              </div>
	            </div>
	          </header>
	          <div className="stickyNavBar">
	            <div className="stickyNavInner">
	              <nav style={S.nav} aria-label="Dashboard tabs">
	                {tabs.map(t => (
	                  <button
	                    key={t.id}
	                    onClick={() => setTab(t.id)}
	                    aria-pressed={tab === t.id}
	                    style={{ ...S.navBtn, ...(tab === t.id ? S.navBtnActive : {}) }}
	                  >
	                    <span style={{ marginRight: 6 }}>{t.icon}</span>{t.label}
	                  </button>
	                ))}
	              </nav>
	              <div className="navRight">
	                <span style={{ fontSize: 12, fontWeight: 700, color: '#374151' }}>Jump to:</span>
	                <select style={{ ...S.select, borderRadius: 10 }} value={jumpToValue} onChange={handleJump} aria-label="Jump to section">
	                  <option value="">Jump to…</option>
	                  {jumpOptions.map(o => <option key={o.id} value={o.id}>{o.label}</option>)}
	                </select>
	              </div>
	            </div>
	          </div>
	          <ModelSelectionControls selectedModels={selectedModels} setSelectedModels={setSelectedModels} />
	          <main style={{ minHeight: 500 }}>
	            {tab === 'overview' && <OverviewTab selectedModels={selectedModels} />}
	            {tab === 'leaderboard' && <LeaderboardTab selectedModels={selectedModels} />}
	            {tab === 'heatmaps' && <HeatmapsTab selectedModels={selectedModels} />}
	            {tab === 'errors' && <ErrorsTab />}
	            {tab === 'performance' && <PerformanceTab selectedModels={selectedModels} />}
	          </main>
	          <footer style={{ marginTop: 'var(--footer-mt, 32px)', paddingTop: 20, borderTop: '1px solid #e5e7eb', fontSize: 12, color: '#9ca3af', textAlign: 'center' }}>
	            <p>Dermoscopy LLM Evaluation Study • 10,200 trials • Data from Nov 2025</p>
	            <p style={{ marginTop: 8 }}>© 2025 Ramie Fathy, MD. All rights reserved.</p>
	          </footer>
	        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
