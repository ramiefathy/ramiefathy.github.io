<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Scheduler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for better button appearance and layout */
        body {
            font-family: 'Inter', sans-serif; /* Use Inter font */
            background-color: #f3f4f6; /* bg-gray-100 */
        }
        .tab-button {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem; /* rounded-md */
            transition: background-color 0.2s ease-in-out, color 0.2s ease-in-out;
            cursor: pointer;
            font-weight: 500;
        }
        .tab-button-active {
            background-color: #3b82f6; /* bg-blue-500 */
            color: white;
        }
        .tab-button-inactive {
            background-color: #e5e7eb; /* bg-gray-200 */
            color: #374151; /* text-gray-700 */
        }
        .tab-button-inactive:hover {
            background-color: #d1d5db; /* hover:bg-gray-300 */
        }
         .tab-button-disabled {
            background-color: #f3f4f6; /* bg-gray-100 */
            color: #9ca3af; /* text-gray-400 */
            cursor: not-allowed;
        }
        .input-field, .select-field {
            border: 1px solid #d1d5db; /* border-gray-300 */
            padding: 0.5rem;
            border-radius: 0.375rem; /* rounded-md */
            font-size: 0.875rem; /* text-sm */
            background-color: white;
        }
        .action-button {
             padding: 0.5rem 1rem;
             border-radius: 0.375rem; /* rounded-md */
             background-color: #10b981; /* bg-emerald-500 */
             color: white;
             font-weight: 500; /* font-medium */
             transition: background-color 0.2s ease-in-out;
             cursor: pointer;
        }
        .action-button:hover {
            background-color: #059669; /* hover:bg-emerald-600 */
        }
        .delete-button {
            padding: 0.25rem 0.5rem; /* size-sm */
            border-radius: 0.375rem; /* rounded-md */
            background-color: transparent;
            color: #ef4444; /* text-red-500 */
            font-size: 0.875rem; /* text-sm */
            transition: background-color 0.2s ease-in-out, color 0.2s ease-in-out;
        }
        .delete-button:hover {
            background-color: #fee2e2; /* hover:bg-red-100 */
            color: #dc2626; /* hover:text-red-600 */
        }
        .availability-button {
            font-size: 0.75rem; /* text-xs */
            padding: 0.25rem 0; /* py-1 */
            border: 1px solid #e5e7eb; /* border-gray-200 */
            border-radius: 0.25rem; /* rounded-sm */
            transition: background-color 0.2s ease-in-out;
        }
        .availability-button-active {
            background-color: #7dd3fc; /* bg-sky-300 */
        }
         .availability-button-inactive {
            background-color: #f9fafb; /* bg-gray-50 */
        }
        .availability-button-inactive:hover {
            background-color: #f3f4f6; /* hover:bg-gray-100 */
        }
        /* Add some spacing and card-like appearance */
        .tab-content {
            margin-top: 1rem;
            padding: 1.5rem;
            background-color: white;
            border-radius: 0.5rem; /* rounded-lg */
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1); /* shadow-md */
        }
        /* Calendar grid styles */
        .calendar-grid {
            display: grid;
            gap: 0.25rem; /* gap-1 */
            grid-template-columns: repeat(5, minmax(0, 1fr)); /* grid-cols-5 */
        }
        .calendar-header {
            text-align: center;
            font-weight: 600; /* font-semibold */
            border-bottom: 1px solid #d1d5db; /* border-b */
            padding-bottom: 0.25rem; /* pb-1 */
            font-size: 0.875rem; /* text-sm */
            color: #4b5563; /* text-gray-600 */
        }
        .calendar-card {
            border: 1px solid #e5e7eb; /* border */
            border-radius: 0.375rem; /* rounded-md */
            height: 7rem; /* h-28 */
            position: relative;
            overflow: hidden; /* Ensure content fits */
            background-color: #ffffff; /* bg-white */
            display: flex;
            flex-direction: column;
        }
        /* Style for days outside the current month */
        .calendar-card-disabled {
            background-color: #f3f4f6; /* bg-gray-100 */
            pointer-events: none; /* Disable clicks */
            color: #9ca3af; /* text-gray-400 */
        }
        .calendar-card-disabled .calendar-day-number {
             color: #9ca3af; /* text-gray-400 */
        }
         .calendar-card-disabled .calendar-slot,
         .calendar-card-disabled .calendar-slot-select,
         .calendar-card-disabled .calendar-slot-locked {
            background-color: #f3f4f6 !important; /* bg-gray-100, use !important to override other potential background colors */
            color: #9ca3af !important; /* text-gray-400 */
            cursor: default;
         }
        .calendar-day-number {
            position: absolute;
            top: 0.125rem; /* top-0.5 */
            right: 0.25rem; /* right-1 */
            font-size: 0.7rem; /* text-[10px] */
            color: #6b7280; /* text-gray-500 */
        }
        .calendar-slot { /* For Site Planner */
            height: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem; /* text-[10px] */
            border-top: 1px solid #e5e7eb; /* border-t */
            cursor: pointer;
            transition: background-color 0.15s ease-in-out;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 0.25rem; /* Add padding */
        }
         .calendar-slot:first-child {
            border-top: none;
         }
        .calendar-slot:not(.calendar-card-disabled *):hover { /* Allow hover only on active days */
            background-color: #e0f2fe; /* hover:bg-sky-100 */
        }
        .calendar-slot-select { /* For Resident Schedule Dropdowns */
             height: 50%;
             width: 100%;
             border-top: 1px solid #e5e7eb; /* border-t */
             font-size: 0.65rem; /* text-[10px] */
             padding: 0.1rem 0.25rem;
             /* background-color: white; */ /* Base background set dynamically */
             border-radius: 0;
             border-left: 0;
             border-right: 0;
             border-bottom: 0;
             cursor: pointer;
             -webkit-appearance: none; /* Remove default styling */
             -moz-appearance: none;
             appearance: none;
             text-align: center; /* Center text in select */
        }
         .calendar-slot-select:first-child {
             border-top: none;
         }
         .calendar-slot-select:disabled {
            background-color: #e5e7eb !important; /* bg-gray-200 - Use important to override dynamic color */
            color: #6b7280 !important; /* text-gray-500 */
            cursor: not-allowed;
            font-style: italic;
         }
         /* Style for locked slots (Continuity, Didactics) */
        .calendar-slot-locked {
            height: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem; /* text-[10px] */
            border-top: 1px solid #e5e7eb; /* border-t */
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 0.25rem;
            cursor: default;
        }
        .calendar-slot-locked:first-child {
             border-top: none;
        }
        /* Specific colors for locked types */
        .locked-continuity { background-color: #fef9c3; color: #854d0e; } /* yellow-100 text-yellow-700 */
        .locked-didactics { background-color: #f3e8ff; color: #6b21a8; } /* purple-100 text-purple-700 */

        /* Rotation-specific colors for assignable slots */
        .rotation-gss { background-color: #dcfce7; color: #166534; } /* green-100 text-green-700 */
        .rotation-jhoc { background-color: #ffedd5; color: #9a3412; } /* orange-100 text-orange-700 */
        .rotation-hoco { background-color: #fee2e2; color: #991b1b; } /* red-100 text-red-700 */
        .rotation-peds { background-color: #cffafe; color: #0e7490; } /* cyan-100 text-cyan-700 */
        .rotation-dermatopathology { background-color: #ffe4e6; color: #9f1239; } /* rose-100 text-rose-700 */
        .rotation-float { background-color: #f1f5f9; color: #334155; } /* slate-100 text-slate-700 */
        .rotation-jhh-consults { background-color: #ccfbf1; color: #0f766e; } /* teal-100 text-teal-700 */
        .rotation-bayview-peds-consults { background-color: #e0f2fe; color: #0369a1; } /* sky-100 text-sky-700 */
        /* Add classes for other potential rotations if needed */
        .rotation-default { background-color: white; color: #1f2937; } /* default text-gray-800 */

         /* Site-specific colors for assigned slots (used as override) */
        .site-gss { background-color: #dcfce7; color: #166534; } /* green-100 text-green-700 */
        .site-jhoc { background-color: #ffedd5; color: #9a3412; } /* orange-100 text-orange-700 */
        .site-hoco { background-color: #fee2e2; color: #991b1b; } /* red-100 text-red-700 */
        .site-default { background-color: white; color: #1f2937; } /* default text-gray-800 */


    </style>

<body class="p-4">

    <div class="container mx-auto max-w-6xl">

        <div class="flex flex-wrap gap-2 mb-4">

            <button id="tab-btn-residents" class="tab-button" onclick="showTab('residents')">Residents</button>
            <button id="tab-btn-site" class="tab-button" onclick="showTab('site')">Site Planner</button>
            <button id="tab-btn-residentSchedules" class="tab-button" onclick="showTab('residentSchedules')">Resident Schedules</button>

        <div id="tab-content-area">

                <div class="flex flex-wrap gap-3 items-end p-4 bg-gray-50 rounded-lg border">
                    <div class="flex-grow min-w-[150px]">
                        <label for="att-name" class="block text-sm font-medium text-gray-600 mb-1">Name</label>
                        <input id="att-name" type="text" placeholder="Attending Name" class="input-field w-full">
                    </div>
                    <div class="flex-grow min-w-[100px]">
                        <label for="att-site" class="block text-sm font-medium text-gray-600 mb-1">Site</label>
                        <select id="att-site" class="select-field w-full"></select>
                    </div>
                     <div class="flex-grow min-w-[80px]">

                        <select id="att-cap" class="select-field w-full"></select>
                    </div>
                    <button class="action-button" onclick="addAttending()">Add Attending</button>
                </div>
                <div id="attendings-list" class="space-y-4">
                    </div>
            </div>

            <div id="tab-residents" class="tab-content space-y-6 hidden">

                 <div class="p-4 bg-gray-50 rounded-lg border space-y-3">

                         <div class="flex-grow">

                             <input id="res-name" type="text" placeholder="Resident Name" class="input-field w-full">
                         </div>
                         <div>
                             <label for="res-pgy" class="block text-sm font-medium text-gray-600 mb-1">PGY</label>
                             <select id="res-pgy" class="select-field w-full"></select>

                         <div>
                             <label for="res-rotation" class="block text-sm font-medium text-gray-600 mb-1">Rotation</label>
                             <select id="res-rotation" class="select-field w-full"></select>
                         </div>
                         <div>
                             <label for="res-contLoc" class="block text-sm font-medium text-gray-600 mb-1">Cont. Loc</label>
                             <select id="res-contLoc" class="select-field w-full"></select>
                         </div>
                         <div>
                             <label for="res-contDay" class="block text-sm font-medium text-gray-600 mb-1">Cont. Day</label>
                             <select id="res-contDay" class="select-field w-full"></select>
                         </div>
                         <div>
                              <label for="res-contTime" class="block text-sm font-medium text-gray-600 mb-1">Cont. Time</label>
                             <select id="res-contTime" class="select-field w-full"></select>
                         </div>
                         <button class="action-button self-end" onclick="addResident()">Add Resident</button>
                     </div>
                 </div>
                 <div id="residents-list" class="space-y-4">

            </div>

            <div id="tab-site" class="tab-content space-y-6 hidden">

                         <select id="site-plan-site" class="select-field" onchange="handleSitePlanControlChange()"></select>
                     </div>
                     <div>
                         <label for="site-plan-year" class="block text-sm font-medium text-gray-600 mb-1">Year</label>
                         <input id="site-plan-year" type="number" class="input-field w-24" onchange="handleSitePlanControlChange()">
                     </div>
                     <div>

                     </div>

                     </div>
            </div>

        // Generates Date objects for Mon-Fri of the weeks covering the given month
        const weekdayGrid = (y, m) => {
            const first = new Date(y, m - 1, 1);
            const last = new Date(y, m, 0);
            const start = monday(first); // Find Monday of the week the month starts in
            const end = new Date(monday(last)); // Find Monday of the week the month ends in
            end.setDate(end.getDate() + 4); // Go to the Friday of that week
            const days = [];
            for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                // Only include actual weekdays (Mon=1 to Fri=5)
                if (d.getDay() >= 1 && d.getDay() <= 5) {
                    days.push(new Date(d));
                }
            }
            return days;
        };

        // Find Attending ID from string (e.g., "Aguh HoCo", "Smith")
        function findAttendingId(nameStr) {
            if (!nameStr || typeof nameStr !== 'string') return "";
            const lowerNameStr = nameStr.toLowerCase().trim();

            // Handle special non-attending activities first
            const nonClinical = ["sst", "are", "didactics", "admin", "day of learning", "basic exam", "interview", "path", "peds consults", "jhh consults", "bv/peds consults", "maternity leave", "vacation", "on call", "grossberg rub", "grossberg laser", "smith rub", "wan rub", "cc", "surgery", "elective", "float a"];
            if (nonClinical.some(nc => lowerNameStr.includes(nc))) {
                return ""; // Treat as "off" / unassigned clinically
            }

            // Try direct match first (e.g., "aguh-hoco")
            const directKey = lowerNameStr.replace(/\s+/g, '-'); // Replace spaces with hyphens
            if (attendingNameMap[directKey] && attendingNameMap[directKey].length === 1) {
                return attendingNameMap[directKey][0].toString();
            }

            // Try splitting name and potential site
            const parts = lowerNameStr.split(/[\s-]+/);
            let potentialName = parts[0];
            let potentialSite = "";
            let idList = [];

            if (parts.length > 1) {
                const lastPart = parts[parts.length - 1];
                if (SITES.map(s => s.toLowerCase()).includes(lastPart)) {
                    potentialSite = lastPart;
                    potentialName = parts.slice(0, -1).join(' ');
                    const siteKey = `${potentialName}-${potentialSite}`;
                    idList = attendingNameMap[siteKey] || [];
                } else {
                    potentialName = parts.join(' '); // Assume full name if last part isn't a site
                    idList = attendingNameMap[potentialName] || [];
                }
            } else {
                 potentialName = parts[0]; // Single word name
                 idList = attendingNameMap[potentialName] || [];
            }


            if (idList.length === 1) {
                return idList[0].toString(); // Found unique match
            } else if (idList.length > 1) {
                 console.warn(`Ambiguous attending string: "${nameStr}". Found IDs: ${idList.join(', ')}`);
                 return ""; // Ambiguous
            } else {
                console.warn(`Could not map attending string: "${nameStr}" to an ID.`);
                return ""; // Not found
            }
        }

                     const scoreA = a.site === currentResident.rotation ? -1 : 1;
                     const scoreB = b.site === currentResident.rotation ? -1 : 1;
                     if (scoreA !== scoreB) return scoreA - scoreB;
                 }
                 return a.name.localeCompare(b.name);
             });
            const daysInGrid = weekdayGrid(year, month);
            daysInGrid.forEach(d => {
                const card = document.createElement('div');
                const dateStr = iso(d);
                const isCurrentMonth = d.getMonth() === month - 1;
                const dayOfWeekIndex = (d.getDay() + 6) % 7;
                card.className = `calendar-card ${!isCurrentMonth ? 'calendar-card-disabled' : ''}`;
                card.dataset.date = dateStr;
                const dayNum = document.createElement('span');
                dayNum.className = 'calendar-day-number';
                dayNum.textContent = d.getDate();
                card.appendChild(dayNum);
                ['AM', 'PM'].forEach(half => {
                    const isContinuitySlot = isCurrentMonth && currentResident && DOW_INDEX_MAP[currentResident.contDay] === dayOfWeekIndex && currentResident.contTime === half;
                    const isDidacticsSlot = isCurrentMonth && d.getDay() === 3 && half === 'AM';
                    if (isDidacticsSlot) {
                        const didacticsSlot = document.createElement('div');
                        didacticsSlot.className = 'calendar-slot-locked locked-didactics';
                        didacticsSlot.textContent = 'Didactics';
                        didacticsSlot.title = 'Didactics Session';
                        card.appendChild(didacticsSlot);
                    } else if (isContinuitySlot) {
                        const lockedSlot = document.createElement('div');
                        lockedSlot.className = 'calendar-slot-locked locked-continuity';
                        lockedSlot.textContent = `Continuity @ ${currentResident.contLoc}`;
                        lockedSlot.title = `Resident's continuity clinic at ${currentResident.contLoc}`;
                        card.appendChild(lockedSlot);
                    } else {
                        const select = document.createElement('select');
                        select.dataset.half = half;
                        let rotationColorClass = 'rotation-default';
                        if (currentResident) {
                            switch (currentResident.rotation) {
                                case 'GSS': rotationColorClass = 'rotation-gss'; break;
                                case 'JHOC': rotationColorClass = 'rotation-jhoc'; break;
                                case 'HoCo': rotationColorClass = 'rotation-hoco'; break;
                                case 'peds': rotationColorClass = 'rotation-peds'; break;
                                case 'dermatopathology': rotationColorClass = 'rotation-dermatopathology'; break;
                                case 'float': rotationColorClass = 'rotation-float'; break;
                                case 'JHH consults': rotationColorClass = 'rotation-jhh-consults'; break;
                                case 'Bayview/Peds Consults': rotationColorClass = 'rotation-bayview-peds-consults'; break;
                                // Handle other potential rotation names if needed
                                default: rotationColorClass = 'rotation-default'; // Use default for Surgery, Elective, Leave, Float A etc.
                            }
                        }
                        select.className = `calendar-slot-select ${rotationColorClass}`;
                        if (isCurrentMonth) { select.onchange = (e) => changeResidentAssignment(d, half, e.target.value); }
                        else { select.disabled = true; }
                        const assignKey = `${selectedResId}|${dateStr}|${half}`;
                        const assignedAttId = assign[assignKey] || "";
                        const assignedAttending = attendings.find(a => a.id == assignedAttId);
                        if(assignedAttending){ // Override background if assigned
                             let siteColorClass = 'site-default';
                             switch (assignedAttending.site) {
                                case 'GSS': siteColorClass = 'site-gss'; break;
                                case 'JHOC': siteColorClass = 'site-jhoc'; break;
                                case 'HoCo': siteColorClass = 'site-hoco'; break;
                             }
                             select.className = `calendar-slot-select ${siteColorClass}`;
                        }
                        const offOption = document.createElement('option');
                        offOption.value = ""; offOption.textContent = "(off)";
                        select.appendChild(offOption);
                        sortedAttendings.forEach(att => {
                            const option = document.createElement('option');
                            option.value = att.id.toString();
                            const load = getAttendingLoad(att.id, dateStr, half);
                            const remainingCap = Math.max(0, att.cap - load);
                            option.textContent = `${att.name}-${att.site} (${remainingCap})`;
                            select.appendChild(option);
                        });
                        select.value = assignedAttId;
                        card.appendChild(select);
                    }
                });
                calendarDiv.appendChild(card);
            });
        };


        // --- Event Handlers & Logic --- (No changes below this line)

        const addAttending = () => {
            const nameInput = document.getElementById('att-name'); const siteSelect = document.getElementById('att-site');
            const capSelect = document.getElementById('att-cap'); const name = nameInput.value.trim();
            if (!name) { alert('Please enter an attending name.'); return; }
            const newAttending = { id: nextA, name: name, site: siteSelect.value, cap: parseInt(capSelect.value, 10) };
            attendings.push(newAttending); weeklyPatterns[nextA] = { AM: Array(5).fill(false), PM: Array(5).fill(false) }; nextA++;
            nameInput.value = ''; siteSelect.selectedIndex = 0; capSelect.selectedIndex = 0;
            saveData(); renderAttendings();
            if (currentTab === 'site') populateSitePlannerAttendings(); if (currentTab === 'residentSchedules') renderResidentSchedules();
        };
        const deleteAttending = (id) => {
             if (confirm('Are you sure you want to delete this attending? This will also remove them from any planned sessions and resident assignments.')) {
                attendings = attendings.filter(a => a.id !== id); delete weeklyPatterns[id];
                Object.keys(sessions).forEach(key => { if (sessions[key] === id) { sessions[key] = null; } });
                Object.keys(assign).forEach(key => { if (assign[key] === id.toString()) { assign[key] = ""; } });
                saveData(); renderAttendings();
                if (currentTab === 'site') { populateSitePlannerAttendings(); renderSitePlanner(); }
                if (currentTab === 'residentSchedules') renderResidentSchedules();
            }
        };
        const toggleAvailability = (id, half, dayIndex) => {
            const pattern = weeklyPatterns[id];
            if (pattern && pattern[half]) {
                 const newHalfPattern = [...pattern[half]]; newHalfPattern[dayIndex] = !newHalfPattern[dayIndex];
                 weeklyPatterns[id] = { ...pattern, [half]: newHalfPattern };
                saveData(); renderAttendings();
            }
        };
        const addResident = () => {
            const nameInput = document.getElementById('res-name'); const pgySelect = document.getElementById('res-pgy');
            const rotationSelect = document.getElementById('res-rotation'); const contLocSelect = document.getElementById('res-contLoc');
            const contDaySelect = document.getElementById('res-contDay'); const contTimeSelect = document.getElementById('res-contTime');
            const name = nameInput.value.trim(); if (!name) { alert('Please enter a resident name.'); return; }
            const newResident = { id: nextR, name: name, pgy: pgySelect.value, rotation: rotationSelect.value, contLoc: contLocSelect.value, contDay: contDaySelect.value, contTime: contTimeSelect.value };
            residents.push(newResident); nextR++; nameInput.value = '';
            saveData(); renderResidents(); if (currentTab === 'residentSchedules') populateResidentScheduleResidents();
        };
         const deleteResident = (id) => {
             if (confirm('Are you sure you want to delete this resident? This will also remove their schedule assignments.')) {
                residents = residents.filter(r => r.id !== id);
                 Object.keys(assign).forEach(key => { if (key.startsWith(`${id}|`)) { delete assign[key]; } });
                saveData(); renderResidents();
                if (currentTab === 'residentSchedules') { populateResidentScheduleResidents(); renderResidentSchedules(); }
            }
        };
        const updateResident = (id, field, value) => {
            let needsRescheduleRender = false;
            residents = residents.map(r => {
                if (r.id === id) {
                     if (field === 'rotation' && currentTab === 'residentSchedules' && document.getElementById('res-sched-res').value == id) { needsRescheduleRender = true; }
                     if (['contDay', 'contTime'].includes(field) && currentTab === 'residentSchedules' && document.getElementById('res-sched-res').value == id) { needsRescheduleRender = true; }
                    return { ...r, [field]: value };
                } return r;
            });
            saveData();
             if (field === 'rotation') { renderResidents(); }
             if (needsRescheduleRender) { renderResidentSchedules(); }
        };
        const populateSitePlannerAttendings = () => {
            const siteSelect = document.getElementById('site-plan-site'); const attSelect = document.getElementById('site-plan-att');
            const site = siteSelect.value; const siteAttendings = attendings.filter(a => a.site === site);
            populateSelect('site-plan-att', siteAttendings, 'id', 'name', siteAttendings.length === 0 ? "(No attendings for this site)" : "-- Select Attending --");
        };
        const handleSitePlanControlChange = (attendingChanged = false) => {
             const siteSelect = document.getElementById('site-plan-site'); const yearInput = document.getElementById('site-plan-year');
             const monthInput = document.getElementById('site-plan-month'); const attSelect = document.getElementById('site-plan-att');
             const site = siteSelect.value; const year = parseInt(yearInput.value, 10); const month = parseInt(monthInput.value, 10);
             const selectedAttId = attSelect.value ? parseInt(attSelect.value, 10) : null;
             if (!attendingChanged) { populateSitePlannerAttendings(); }
             if (attendingChanged && selectedAttId) {
                 const pattern = weeklyPatterns[selectedAttId]; const daysInGrid = weekdayGrid(year, month);
                 const hasExistingSessions = daysInGrid.some(d => { const dateStr = iso(d); return sessions[`${site}|${dateStr}|AM`] === selectedAttId || sessions[`${site}|${dateStr}|PM`] === selectedAttId; });
                 if (!hasExistingSessions && pattern) {
                     console.log(`Applying pattern for Attending ID: ${selectedAttId} for ${month}/${year}`); let patternApplied = false;
                     daysInGrid.forEach(d => {
                         if (d.getMonth() === month - 1) {
                             const dateStr = iso(d); const dayOfWeekIndex = DOW_INDEX_MAP[DOW[(d.getDay() + 6) % 7]];
                             if (pattern.AM[dayOfWeekIndex] && !sessions[`${site}|${dateStr}|AM`]) { sessions[`${site}|${dateStr}|AM`] = selectedAttId; patternApplied = true; }
                             if (pattern.PM[dayOfWeekIndex] && !sessions[`${site}|${dateStr}|PM`]) { sessions[`${site}|${dateStr}|PM`] = selectedAttId; patternApplied = true; }
                         }
                     });
                     if (patternApplied) { saveData(); }
                 }
             }
             renderSitePlanner();
        };
        const toggleSiteSession = (date, half) => {
            const siteSelect = document.getElementById('site-plan-site'); const attSelect = document.getElementById('site-plan-att');
            const site = siteSelect.value; const selectedAttId = attSelect.value ? parseInt(attSelect.value, 10) : null;
            if (!selectedAttId) { alert("Please select an attending first."); return; }
            const dateStr = iso(date); const sessionKey = `${site}|${dateStr}|${half}`; const currentAssignment = sessions[sessionKey];
            if (currentAssignment === selectedAttId) { sessions[sessionKey] = null; }
            else { sessions[sessionKey] = selectedAttId; }
            saveData(); renderSitePlanner();
        };
        const populateResidentScheduleResidents = () => { populateSelect('res-sched-res', residents, 'id', 'name', residents.length === 0 ? "(No residents added)" : "-- Select Resident --"); };
        const handleResSchedControlChange = () => { renderResidentSchedules(); };
        const getAttendingLoad = (attendingId, dateIso, half) => {
            let load = 0;
            for (const key in assign) { if (key.endsWith(`|${dateIso}|${half}`)) { if (assign[key] === attendingId.toString()) { load++; } } }
            return load;
        };
        const changeResidentAssignment = (date, half, attendingIdStr) => {
             const resSelect = document.getElementById('res-sched-res'); const selectedResId = resSelect.value;
             if (!selectedResId) return;
             const dateStr = iso(date); const assignKey = `${selectedResId}|${dateStr}|${half}`;
             if (attendingIdStr === "") { delete assign[assignKey]; }
             else { assign[assignKey] = attendingIdStr; }
             saveData(); renderResidentSchedules();
         };
        const showTab = (tabId) => {
            currentTab = tabId; document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
            document.querySelectorAll('.tab-button').forEach(btn => { btn.classList.remove('tab-button-active'); if (!btn.classList.contains('tab-button-disabled')) { btn.classList.add('tab-button-inactive'); } });
            const tabContent = document.getElementById(`tab-${tabId}`); if (tabContent) { tabContent.classList.remove('hidden'); }
            const activeBtn = document.getElementById(`tab-btn-${tabId}`); if(activeBtn && !activeBtn.disabled) { activeBtn.classList.remove('tab-button-inactive'); activeBtn.classList.add('tab-button-active'); }
            if (tabId === 'attendings') { renderAttendings(); } else if (tabId === 'residents') { renderResidents(); }
            else if (tabId === 'site') { if (!document.getElementById('site-plan-year').value) { document.getElementById('site-plan-year').value = new Date().getFullYear(); } if (!document.getElementById('site-plan-month').value) { document.getElementById('site-plan-month').value = new Date().getMonth() + 1; } if (!document.getElementById('site-plan-site').value) { populateSelect('site-plan-site', SITES); } populateSitePlannerAttendings(); renderSitePlanner(); }
            else if (tabId === 'residentSchedules') { if (!document.getElementById('res-sched-year').value) { document.getElementById('res-sched-year').value = new Date().getFullYear(); } if (!document.getElementById('res-sched-month').value) { document.getElementById('res-sched-month').value = new Date().getMonth() + 1; } populateResidentScheduleResidents(); renderResidentSchedules(); }
        };
        const updatePlannerTabsAvailability = () => {
            const sitePlannerBtn = document.getElementById('tab-btn-site'); const residentSchedulesBtn = document.getElementById('tab-btn-residentSchedules');
            const hasAttendings = attendings.length > 0; const hasResidents = residents.length > 0;
            sitePlannerBtn.disabled = !hasAttendings; sitePlannerBtn.classList.toggle('tab-button-disabled', !hasAttendings); sitePlannerBtn.classList.toggle('tab-button-inactive', hasAttendings && currentTab !== 'site'); if (!hasAttendings) sitePlannerBtn.classList.remove('tab-button-active');
            residentSchedulesBtn.disabled = !hasResidents; residentSchedulesBtn.classList.toggle('tab-button-disabled', !hasResidents); residentSchedulesBtn.classList.toggle('tab-button-inactive', hasResidents && currentTab !== 'residentSchedules'); if (!hasResidents) residentSchedulesBtn.classList.remove('tab-button-active');
             if (currentTab === 'site' && hasAttendings) { sitePlannerBtn.classList.remove('tab-button-inactive'); sitePlannerBtn.classList.add('tab-button-active'); }
             if (currentTab === 'residentSchedules' && hasResidents) { residentSchedulesBtn.classList.remove('tab-button-inactive'); residentSchedulesBtn.classList.add('tab-button-active'); }
         };
        window.onload = () => {
            loadData();
            populateSelect('att-site', SITES); populateSelect('att-cap', CAPS); populateSelect('res-pgy', PGY); populateSelect('res-rotation', ROTATIONS); populateSelect('res-contLoc', CONT_LOC); populateSelect('res-contDay', DOW); populateSelect('res-contTime', CONT_TIME);
            showTab(currentTab); updatePlannerTabsAvailability();
        };
    </script>
