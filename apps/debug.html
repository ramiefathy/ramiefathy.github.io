<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dermatopathology Data Debug</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
        select { padding: 10px; font-size: 16px; width: 300px; }
        .test-results { margin-top: 20px; }
    </style>
    <script src="data.js"></script>
</head>
<body>
    <h1>Dermatopathology Data Debug</h1>
    
    <div id="status"></div>
    
    <h2>Test Dropdown</h2>
    <select id="finding-select">
        <option value="">-- Loading... --</option>
    </select>
    
    <div class="test-results">
        <h3>Test Results:</h3>
        <div id="results"></div>
    </div>

    <script>
        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        function runTests() {
            const results = document.getElementById('results');
            let html = '';
            
            // Test 1: Check if raw data exists
            html += `<p><strong>Test 1:</strong> Raw differentialsData exists: ${typeof differentialsData !== 'undefined' ? '✅ YES' : '❌ NO'}</p>`;
            if (typeof differentialsData !== 'undefined') {
                html += `<p>&nbsp;&nbsp;→ Length: ${differentialsData.length}</p>`;
                html += `<p>&nbsp;&nbsp;→ First item: ${differentialsData[0]?.finding || 'undefined'}</p>`;
            }
            
            // Test 2: Check if processed data exists
            html += `<p><strong>Test 2:</strong> window.dermDifferentialData exists: ${typeof window.dermDifferentialData !== 'undefined' ? '✅ YES' : '❌ NO'}</p>`;
            if (typeof window.dermDifferentialData !== 'undefined') {
                html += `<p>&nbsp;&nbsp;→ Length: ${window.dermDifferentialData.length}</p>`;
                html += `<p>&nbsp;&nbsp;→ First item: ${window.dermDifferentialData[0]?.finding || 'undefined'}</p>`;
                html += `<p>&nbsp;&nbsp;→ First item sources: ${JSON.stringify(window.dermDifferentialData[0]?.sources || [])}</p>`;
            }
            
            results.innerHTML = html;
        }

        function populateDropdown() {
            const select = document.getElementById('finding-select');
            
            if (typeof window.dermDifferentialData !== 'undefined' && window.dermDifferentialData.length > 0) {
                select.innerHTML = '<option value="">-- Select a Finding --</option>';
                
                window.dermDifferentialData.forEach((item, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = item.finding;
                    select.appendChild(option);
                });
                
                updateStatus(`Successfully loaded ${window.dermDifferentialData.length} findings into dropdown`, 'success');
            } else {
                updateStatus('No data available to populate dropdown', 'error');
            }
        }

        // Check immediately
        setTimeout(() => {
            console.log('Running initial tests...');
            runTests();
            populateDropdown();
        }, 100);

        // Check again after a delay to see if data loads later
        setTimeout(() => {
            console.log('Running delayed tests...');
            runTests();
            populateDropdown();
        }, 1000);
    </script>
</body>
</html>
