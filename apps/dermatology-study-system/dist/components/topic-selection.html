<!-- Topic Selection Modal -->
<div id="topicSelectionModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden">
    <div class="relative top-20 mx-auto p-5 border w-3/4 max-w-4xl shadow-lg rounded-md bg-white">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-medium text-gray-900">Select Quiz Topics</h3>
            <button id="closeTopicSelectionBtn" class="text-gray-400 hover:text-gray-500">
                <span class="sr-only">Close</span>
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div class="mb-4">
            <p class="text-gray-600">Select one or more topics to include in your quiz. You can select entire categories or specific subtopics.</p>
        </div>

        <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
            <!-- Topic Categories -->
            <div class="space-y-4" id="topicCategories">
                <!-- Categories will be dynamically populated -->
            </div>
        </div>

        <div class="mt-6 flex justify-end space-x-3">
            <button id="cancelTopicSelectionBtn" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                Cancel
            </button>
            <button id="confirmTopicSelectionBtn" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                Continue
            </button>
        </div>
    </div>
</div>

<!-- Quiz Configuration Modal -->
<div id="quizConfigModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden">
    <div class="relative top-20 mx-auto p-5 border w-3/4 max-w-4xl shadow-lg rounded-md bg-white">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-medium text-gray-900">Configure Quiz</h3>
            <button id="closeQuizConfigBtn" class="text-gray-400 hover:text-gray-500">
                <span class="sr-only">Close</span>
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div class="space-y-6">
            <!-- Number of Questions -->
            <div>
                <label for="questionCount" class="block text-sm font-medium text-gray-700">Number of Questions</label>
                <input type="number" id="questionCount" name="questionCount" min="1" max="50" value="10"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>

            <!-- Timer Option -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Timer</label>
                <div class="mt-2 space-y-2">
                    <div class="flex items-center">
                        <input type="radio" id="timerEnabled" name="timer" value="enabled" class="h-4 w-4 text-blue-600 focus:ring-blue-500">
                        <label for="timerEnabled" class="ml-3 block text-sm text-gray-700">Enable timer</label>
                    </div>
                    <div class="flex items-center">
                        <input type="radio" id="timerDisabled" name="timer" value="disabled" checked class="h-4 w-4 text-blue-600 focus:ring-blue-500">
                        <label for="timerDisabled" class="ml-3 block text-sm text-gray-700">No timer</label>
                    </div>
                </div>
            </div>

            <!-- Question Navigation -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Question Navigation</label>
                <div class="mt-2 space-y-2">
                    <div class="flex items-center">
                        <input type="radio" id="sequentialNav" name="navigation" value="sequential" checked class="h-4 w-4 text-blue-600 focus:ring-blue-500">
                        <label for="sequentialNav" class="ml-3 block text-sm text-gray-700">Sequential (one question at a time)</label>
                    </div>
                    <div class="flex items-center">
                        <input type="radio" id="freeNav" name="navigation" value="free" class="h-4 w-4 text-blue-600 focus:ring-blue-500">
                        <label for="freeNav" class="ml-3 block text-sm text-gray-700">Free navigation (jump between questions)</label>
                    </div>
                </div>
            </div>

            <!-- Question Selection -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Question Selection</label>
                <div class="mt-2 space-y-2">
                    <div class="flex items-center">
                        <input type="checkbox" id="includeMissedQuestions" name="includeMissedQuestions" class="h-4 w-4 text-blue-600 focus:ring-blue-500">
                        <label for="includeMissedQuestions" class="ml-3 block text-sm text-gray-700">Include previously missed questions</label>
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" id="includeWeakTopics" name="includeWeakTopics" class="h-4 w-4 text-blue-600 focus:ring-blue-500">
                        <label for="includeWeakTopics" class="ml-3 block text-sm text-gray-700">Focus on weak topics</label>
                    </div>
                    <div class="flex items-center">
                        <input type="number" id="missedQuestionsPercentage" name="missedQuestionsPercentage" min="0" max="100" value="20"
                            class="ml-6 w-20 rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        <label for="missedQuestionsPercentage" class="ml-3 block text-sm text-gray-700">% of questions from missed questions</label>
                    </div>
                </div>
            </div>

            <!-- Selected Topics Summary -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Selected Topics</label>
                <div id="selectedTopicsSummary" class="mt-2 p-3 bg-gray-50 rounded-md">
                    <!-- Will be populated dynamically -->
                </div>
            </div>
        </div>

        <div class="mt-6 flex justify-end space-x-3">
            <button id="backToTopicsBtn" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                Back to Topics
            </button>
            <button id="startQuizBtn" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                Start Quiz
            </button>
        </div>
    </div>
</div>
