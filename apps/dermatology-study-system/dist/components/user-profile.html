<!-- User Profile Modal -->
<div id="userProfileModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full">
    <div class="relative top-20 mx-auto p-5 border w-3/4 max-w-4xl shadow-lg rounded-md bg-white">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-medium text-gray-900">User Profile</h3>
            <button id="closeProfileModalBtn" class="text-gray-400 hover:text-gray-500">
                <span class="sr-only">Close</span>
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Profile Content -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- User Info -->
            <div class="md:col-span-1">
                <div class="bg-gray-50 p-4 rounded-lg">
                    <div class="text-center">
                        <div class="w-24 h-24 mx-auto bg-gray-200 rounded-full flex items-center justify-center">
                            <span class="text-2xl text-gray-500" id="profileInitials">JD</span>
                        </div>
                        <h4 class="mt-2 text-lg font-medium text-gray-900" id="profileName">John Doe</h4>
                        <p class="text-sm text-gray-500" id="profileEmail">john@example.com</p>
                    </div>
                    <div class="mt-4">
                        <button id="editProfileBtn" class="w-full bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                            Edit Profile
                        </button>
                        <button id="signOutBtn" class="w-full mt-2 bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300">
                            Sign Out
                        </button>
                    </div>
                </div>
            </div>

            <!-- Study Progress -->
            <div class="md:col-span-2">
                <div class="bg-white p-4 rounded-lg border">
                    <h4 class="text-lg font-medium text-gray-900 mb-4">Study Progress</h4>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-blue-50 p-4 rounded-lg">
                            <p class="text-sm text-blue-600">Quizzes Completed</p>
                            <p class="text-2xl font-bold text-blue-700" id="quizzesCompleted">0</p>
                        </div>
                        <div class="bg-green-50 p-4 rounded-lg">
                            <p class="text-sm text-green-600">Average Score</p>
                            <p class="text-2xl font-bold text-green-700" id="averageScore">0%</p>
                        </div>
                    </div>
                    <div class="mt-4">
                        <h5 class="text-sm font-medium text-gray-700 mb-2">Topics Mastered</h5>
                        <div class="flex flex-wrap gap-2" id="topicsMastered">
                            <!-- Topics will be added dynamically -->
                        </div>
                    </div>
                </div>

                <!-- Study Preferences -->
                <div class="mt-6 bg-white p-4 rounded-lg border">
                    <h4 class="text-lg font-medium text-gray-900 mb-4">Study Preferences</h4>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Quiz Difficulty</label>
                            <select id="quizDifficulty" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md">
                                <option value="easy">Easy</option>
                                <option value="medium">Medium</option>
                                <option value="hard">Hard</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Study Focus Areas</label>
                            <div class="mt-2 space-y-2">
                                <label class="inline-flex items-center">
                                    <input type="checkbox" class="form-checkbox text-blue-600" value="general">
                                    <span class="ml-2">General Dermatology</span>
                                </label>
                                <label class="inline-flex items-center">
                                    <input type="checkbox" class="form-checkbox text-blue-600" value="pathology">
                                    <span class="ml-2">Dermatopathology</span>
                                </label>
                                <label class="inline-flex items-center">
                                    <input type="checkbox" class="form-checkbox text-blue-600" value="surgery">
                                    <span class="ml-2">Dermatologic Surgery</span>
                                </label>
                                <label class="inline-flex items-center">
                                    <input type="checkbox" class="form-checkbox text-blue-600" value="pediatric">
                                    <span class="ml-2">Pediatric Dermatology</span>
                                </label>
                            </div>
                        </div>
                        <div>
                            <label class="inline-flex items-center">
                                <input type="checkbox" id="notifications" class="form-checkbox text-blue-600">
                                <span class="ml-2">Enable Notifications</span>
                            </label>
                        </div>
                    </div>
                    <div class="mt-4">
                        <button id="savePreferencesBtn" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                            Save Preferences
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
