version: '3.8'

services:
  db:
    image: postgres:13-alpine
    restart: always
    environment:
      POSTGRES_DB: dermrefgen_db
      POSTGRES_USER: dermrefgen_user
      POSTGRES_PASSWORD: dermrefgen_password
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dermrefgen_user -d dermrefgen_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql://dermrefgen_user:dermrefgen_password@db:5432/dermrefgen_db
      REDIS_BROKER_URL: redis://redis:6379/0
    env_file:
      - .env # Load environment variables (e.g., GEMINI_API_KEY) from a .env file
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"] # Assumes your Flask backend exposes a /health endpoint
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s # Give the Flask app time to fully initialize before checking health
    command: ["flask", "run", "--host=0.0.0.0", "--port=5000"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://dermrefgen_user:dermrefgen_password@db:5432/dermrefgen_db
      REDIS_BROKER_URL: redis://redis:6379/0
    env_file:
      - .env # Load environment variables (e.g., GEMINI_API_KEY) from a .env file
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started # Worker needs backend app code to be available, but not necessarily fully healthy HTTP service
    command: ["celery", "-A", "app.celery", "worker", "--loglevel=info"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Avoid overwriting node_modules inside container
    depends_on:
      backend:
        condition: service_healthy # Frontend waits for the backend's API to be healthy and ready
    command: ["npm", "start"]

volumes:
  db_data: