"text":"This symposium examines how earlier AMD trials could select higher-risk participants and measure meaningful progression before conventional geographic atrophy (GA) develops. The central challenge is connecting structural change to visual loss while keeping recruitment and trial duration feasible.","evidence":[{"start":24,"end":44},{"start":132,"end":156},{"start":3520,"end":3598}]}],"key_findings":[{"title":"Enrichment has a cost","text":"Combining structural and functional risk markers can increase progression rates in a trial population, but narrows the eligible pool and increases screening demands.","evidence":[{"start":333,"end":444},{"start":2840,"end":2909}]},{"title":"Anatomy needs functional meaning","text":"The speakers distinguish promising prognostic biomarkers, proposed trial endpoints and regulatory acceptance. Their shared goal is a reproducible structural measure linked to consequential photoreceptor or visual-function loss.","evidence":[{"start":1161,"end":1264},{"start":1730,"end":1776},{"start":2499,"end":2532}]}],"limitations":[{"text":"These are congress reports of observational analyses, consensus work and trial-design proposals, not evidence that treating a particular biomarker improves patients’ outcomes. Endpoint qualification and validation remain active work.","evidence":[{"start":1228,"end":1264},{"start":1730,"end":1776},{"start":3539,"end":3616}]}],"source_note":"Original summary based on the complete automated transcript, official chapter metadata and targeted slide checks. It is not a full manual audio audit or independent clinical or regulatory validation."},"chapter_summaries":[{"start_seconds":0,"title":"Introduction","speaker":"Zhichao Wu","overview":[{"text":"Wu frames better severity and progression measures as essential for evaluating potential preventive treatments and, if effective treatments emerge, future clinical management.","evidence":[{"start":0,"end":44}]}],"key_findings":[],"limitations":[]},{"start_seconds":81,"title":"Structural Biomarkers in Intermediate AMD","speaker":"Marlene Saßmannshausen","overview":[{"text":"Four-year MACUSTAR analyses combine imaging, function, patient-reported outcomes and genetics. Pigmentary abnormalities and hyperreflective foci (HRF) were common; combinations of risk markers identified faster-progressing subgroups.","evidence":[{"start":157,"end":320}]}],"key_findings":[{"title":"No ideal enrichment rule yet","text":"Higher event rates generally came with lower biomarker prevalence. Saßmannshausen argues for spatially matched structure–function analysis rather than relying only on whole-eye biomarker presence.","evidence":[{"start":333,"end":444},{"start":506,"end":559}]}],"limitations":[{"text":"Subgroup selection remains exploratory, with screening burden, biological heterogeneity and generalisability unresolved.","evidence":[{"start":447,"end":505},{"start":569,"end":608}]}]},{"start_seconds":681,"title":"Defining the Onset of End-Stage Atrophic AMD","speaker":"Robyn Guymer","overview":[{"text":"A modified Delphi exercise used two rounds and an 80% consensus threshold. Experts supported incident end-stage atrophy as an early-intervention endpoint (82%) and anatomical changes previously associated with marked functional loss (95%).","evidence":[{"start":884,"end":921},{"start":1121,"end":1197}]}],"key_findings":[{"title":"Atrophy does not guarantee an absolute scotoma","text":"Targeted microperimetry challenged the assumption that every conventionally defined atrophic lesion is non-seeing. A specific repeatable ≤10 dB criterion approached, but did not reach, consensus.","evidence":[{"start":1073,"end":1118},{"start":1182,"end":1197}]}],"limitations":[{"text":"Clinical consensus does not itself establish an accepted regulatory endpoint.","evidence":[{"start":1228,"end":1264}]}]},{"start_seconds":1301,"title":"High-Risk OCT Signs for Future Atrophic AMD Onset","speaker":"Zhichao Wu","overview":[{"text":"Wu compares nascent GA, iRORA, cRORA and large hypertransmission using a prospective cohort of 280 eyes in 140 people, examined six-monthly for up to three years. Nascent GA comprises outer plexiform/inner nuclear layer subsidence or a hyporeflective wedge in Henle’s fibre layer; definitions overlap.","evidence":[{"start":1430,"end":1452},{"start":1490},{"start":1543,"end":1555},{"start":1718}]}],"key_findings":[{"title":"Different markers imply different timelines","text":"The comparison slide reports GA onset within two years of 38% after nascent GA, 3% after iRORA, 26% after cRORA and 17% after large hypertransmission. These are cohort-level associations, not individual prognoses.","evidence":[{"start":1718}]}],"limitations":[{"text":"The comparisons derive from one multicentre longitudinal cohort and photograph-defined GA. Validation against a functionally meaningful endpoint in other cohorts is needed.","evidence":[{"start":1741,"end":1776}]}]},{"start_seconds":1801,"title":"Photoreceptor Degeneration in Intermediate AMD","speaker":"Justis Ehlers","overview":[{"text":"Ehlers reviews ellipsoid-zone (EZ) reflectivity, EZ loss and outer nuclear layer measurements. Natural-history analyses linked these measures to function and progression; EZ measures were particularly informative in his cohort’s multivariable models.","evidence":[{"start":1861,"end":1912},{"start":1962,"end":2004},{"start":2119,"end":2179}]}],"key_findings":[{"title":"Preservation, measurement and trial design","text":"He proposes measuring the rate of photoreceptor loss, with careful handling of confounding anatomy and baseline damage. He described total EZ-loss slope as potentially approvable through FDA interactions, while acknowledging no dry-AMD approval using this endpoint yet.","evidence":[{"start":1834,"end":1861},{"start":2226,"end":2257},{"start":2444,"end":2532}]}],"limitations":[]},{"start_seconds":2637,"title":"Visual Function Deficits in Intermediate AMD Progression","speaker":"Robert Finger","overview":[{"text":"In MACUSTAR, roughly 70% had a measurable visual deficit relative to healthy controls. Several baseline deficits predicted late AMD over four years; reading performance and rod-intercept time were exceptions in the presented age-adjusted analysis.","evidence":[{"start":2670,"end":2686},{"start":2760,"end":2798}]}],"key_findings":[{"title":"A toolbox of endpoints","text":"Combining structure and function may improve enrichment, but reduces eligible subgroup size. Finger favours selecting complementary outcomes to suit each trial rather than a universal endpoint.","evidence":[{"start":2840,"end":2909},{"start":2996,"end":3062}]}],"limitations":[]},{"start_seconds":3074,"title":"Discussion","speaker":"Panel","overview":[{"text":"The panel proposes validating functionally meaningful OCT-defined atrophy first, then testing earlier surrogates. Targeted microperimetry, scotomatous-point counts and concurrent structural/functional outcomes were discussed as practical options; independent replication and prespecified measurements remain priorities.","evidence":[{"start":3150,"end":3227},{"start":3351,"end":3449},{"start":3546,"end":3616}]}],"key_findings":[],"limitations":[]}],"review_notes":[{"text":"Key percentages and technical terms were checked against selected slides. The nascent-GA talk rounds its two-year estimate to about 40%; the comparison slide gives 38%.","evidence":[{"start":1490},{"start":1718}]},{"text":"Slide-verified spellings at 03:30: MACUSTAR and PROM. These terms can be misrecognized by automated speech transcription.","evidence":[{"start":210}]},{"text":"Slide-verified abbreviations at 04:10: HRF, iRORA and cRORA. Check these terms and associated numerical results against the recording.","evidence":[{"start":250}]}]},{"id":"94966","title":"Optimizing patient selection with geographic atrophy for potential current and future therapies","date":"2026-10-01","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","source_url_kind":"official personal programme","session_number":"RETINA26-SS7","recording_status":"downloaded","topic":"AMD/CSC","type":"Instructional Course","speakers":[{"name":"Roberto Gallego-Pinazo","role":"Chair"},{"name":"Jordi Monés","role":"Chair"},{"name":"Rosa Dolz-Marco","role":"Speaker"},{"name":"Frank Holz","role":"Speaker"}],"duration_minutes":60,"start_time":"12:00","end_time":"13:00","timezone":"CEST","recording_duration_seconds":3544.797333,"chapters":[{"start_seconds":0,"end_seconds":56,"title":"Optimizing patient selection with geographic atrophy for potential current and future therapies","speaker":null},{"start_seconds":56,"end_seconds":738,"title":"Clinicopathological correlates of geographic atrophy ","speaker":"Rosa Dolz-Marco"},{"start_seconds":738,"end_seconds":1563,"title":"Implications of the CAM nomenclature in the identification of optimal candidates for current and future GA therapies ","speaker":"Roberto Gallego-Pinazo"},{"start_seconds":1563,"end_seconds":2582,"title":"Optimizing patient selection in the routine clinical practice according to GA trials results","speaker":"Frank Holz"},{"start_seconds":2582,"end_seconds":3201,"title":"Optimizing patient selection in the routine clinical practice according to particular multimodal imaging findings","speaker":"Jordi Monés"},{"start_seconds":3201,"end_seconds":3544.797333,"title":"Interactive discussion about case studies","speaker":"Roberto Gallego-Pinazo"}],"summary":{"overview":[{"text":"This course links GA histology and multimodal imaging to treatment selection. The speakers’ central argument is that the potential value of slowing atrophy depends on the tissue still functioning, the direction and speed of lesion growth, and the patient’s ability to sustain treatment.","evidence":[{"start":132,"end":176},{"start":2089,"end":2126},{"start":2696,"end":2784}]}],"key_findings":[{"title":"Measure the threat to useful vision","text":"Historical imaging, foveal proximity, lesion phenotype and fellow-eye status were prioritised over a simple GA diagnosis or lesion-size cutoff. OCT and fundus autofluorescence provide complementary information.","evidence":[{"start":1911,"end":1975},{"start":2840,"end":2963}]},{"title":"Counsel for slowing rather than recovery","text":"Complement inhibition was presented as a way to delay further tissue loss, with continuing injections and surveillance. The discussion explicitly addresses neovascular conversion and rare severe inflammation.","evidence":[{"start":2096,"end":2126},{"start":2211,"end":2228},{"start":2284,"end":2354}]}],"limitations":[{"text":"The course combines trial evidence, observational imaging studies, individual cases and speakers’ own selection strategies. These are not interchangeable evidence levels or universal prescribing criteria; availability and regulatory statements are as reported at the meeting.","evidence":[{"start":1733,"end":1829},{"start":1985,"end":2016},{"start":2696,"end":2784}]}],"source_note":"Original summary based on the complete automated transcript, official chapter metadata and targeted slide checks. Not a full manual audio audit, current prescribing guidance or independent clinical validation."},"chapter_summaries":[{"start_seconds":0,"title":"Optimizing patient selection with geographic atrophy for potential current and future therapies","speaker":"Course chairs","overview":[{"text":"The chairs introduce patient selection as an increasingly important challenge as GA treatments and earlier-intervention research develop.","evidence":[{"start":0,"end":42}]}],"key_findings":[],"limitations":[]},{"start_seconds":56,"title":"Clinicopathological correlates of geographic atrophy","speaker":"Rosa Dolz-Marco","overview":[{"text":"Histology–OCT comparisons show that the photoreceptor boundary and the RPE/hypertransmission boundary need not coincide. External limiting membrane (ELM) descent can mark photoreceptor atrophy; scrolling may precede outer retinal tubulation, an advanced degenerative change.","evidence":[{"start":96,"end":293}]}],"key_findings":[{"title":"Read imaging signals in their tissue context","text":"Calcified drusen indicate advanced change. Autofluorescence reflects photoreceptors, dysmorphic RPE and tissue geometry as well as RPE survival, so a bright or dark signal alone cannot fully characterise the lesion.","evidence":[{"start":357,"end":439},{"start":498,"end":581},{"start":634,"end":687}]}],"limitations":[{"text":"ELM visibility depends on OCT quality; the talk illustrates clinicopathological correlations rather than a treatment-response test.","evidence":[{"start":155,"end":176},{"start":199,"end":236}]}]},{"start_seconds":738,"title":"Implications of the CAM nomenclature in the identification of optimal candidates for current and future GA therapies","speaker":"Roberto Gallego-Pinazo","overview":[{"text":"Gallego-Pinazo highlights intraretinal hyperreflective foci, reticular pseudodrusen/subretinal drusenoid deposits, calcified drusen and larger drusen volume as risk-stratification features. Infrared imaging and OCT can reveal findings missed on colour photographs.","evidence":[{"start":800,"end":1044}]}],"key_findings":[{"title":"Look beyond drusen presence","text":"He presents nascent GA as a potential earlier therapeutic or trial window and basal laminar deposits as an emerging research feature that can complicate autofluorescence-based boundaries.","evidence":[{"start":1044,"end":1197}]}],"limitations":[{"text":"Risk associations and a proposed intervention window do not establish efficacy for treating these features. The panel acknowledges substantial uncertainty about subretinal drusenoid-deposit biology and therapeutic targets.","evidence":[{"start":1131,"end":1164},{"start":1384,"end":1393}]}]},{"start_seconds":1563,"title":"Optimizing patient selection in the routine clinical practice according to GA trials results","speaker":"Frank Holz","overview":[{"text":"Holz reviews complement-inhibitor evidence and stresses that pivotal trials enrolled selected populations. OAKS/DERBY and GATHER differed in foveal involvement and neovascular-AMD eligibility, limiting direct comparisons and extrapolation to all GA.","evidence":[{"start":1733,"end":1807},{"start":1780}]}],"key_findings":[{"title":"Long-term data need the comparator explained","text":"The five-year pegcetacoplan slide reports continued slowing against a projected sham trajectory after month 24, rather than an observed untreated control throughout five years.","evidence":[{"start":1684}]},{"title":"Selection and monitoring","text":"He favours faster progression with useful central vision to preserve, excludes non-AMD masquerades and emphasises managing expectations and monitoring for exudation or inflammation.","evidence":[{"start":2089,"end":2228}]}],"limitations":[{"text":"The Q\u0026A notes limited Asian representation in pivotal studies and no demonstrated prospective equivalence for treating atrophy after neovascular AMD.","evidence":[{"start":2413,"end":2433},{"start":2506,"end":2524}]}]},{"start_seconds":2582,"title":"Optimizing patient selection in the routine clinical practice according to particular multimodal imaging findings","speaker":"Jordi Monés","overview":[{"text":"Monés weighs near-term risk to meaningful vision against modest treatment effect, long-term injection burden and comorbidity. Location matters beyond the subfoveal/extrafoveal label: a small central lesion or nearby extrafoveal border may threaten remaining vision more than distant atrophy.","evidence":[{"start":2667,"end":2784},{"start":2840,"end":2891}]}],"key_findings":[{"title":"Phenotype plus measured growth","text":"His examples contrast slow soft-drusen-associated lesions with rapidly progressing reticular/multifocal phenotypes. He prioritises prior measured growth and, where uncertainty permits, repeat measurement before committing to treatment.","evidence":[{"start":2892,"end":3047},{"start":3102,"end":3145}]}],"limitations":[{"text":"These are a clinician’s selection framework and illustrative cases, not validated treatment thresholds.","evidence":[{"start":2710,"end":2784},{"start":2810,"end":2836}]}]},{"start_seconds":3201,"title":"Interactive discussion about case studies","speaker":"Roberto Gallego-Pinazo and panel","overview":[{"text":"The panel favours treatment discussion for two reticular-drusen, fovea-preserving cases judged at high risk. For small soft-drusen-associated lesions, they favour observation and remeasurement. The contrast illustrates individualised assessment rather than treating every atrophic lesion identically.","evidence":[{"start":3250,"end":3357},{"start":3357,"end":3455},{"start":3455,"end":3522}]}],"key_findings":[],"limitations":[]}],"review_notes":[{"text":"A South Korea approval statement is corrected during the Q\u0026A to Australia. The summary does not use the initial statement as an approval fact.","evidence":[{"start":2354,"end":2413}]}]},{"id":"95184","title":"Setting Up a Clinical Trial in AMD: Key Methodological and Clinical Considerations","date":"2026-10-02","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","source_url_kind":"official personal programme","session_number":"RETINA26-SS217","recording_status":"downloaded","topic":"AMD/CSC","type":"Instructional Course","speakers":[{"name":"Enrico Borrelli","role":"Chair"},{"name":"Usha Chakravarthy","role":"Chair"},{"name":"Jay Chhablani","role":"Speaker"},{"name":"Gemmy Cheung","role":"Speaker"},{"name":"Giulia Corradetti","role":"Speaker"},{"name":"Sobha Sivaprasad","role":"Speaker"},{"name":"Roy Schwartz","role":"Speaker"}],"duration_minutes":60,"start_time":"08:30","end_time":"09:30","timezone":"CEST","recording_duration_seconds":3736.157333,"chapters":[{"start_seconds":0,"end_seconds":29,"title":"Setting Up a Clinical Trial in AMD: Key Methodological and Clinical Considerations","speaker":null},{"start_seconds":29,"end_seconds":617,"title":"Two critical challenges: underrepresentation and screen failure in AMD trials","speaker":"Jay Chhablani"},{"start_seconds":617,"end_seconds":1215,"title":"Gender and ethnic diversity: implications for AMD presentation and clinical trial design","speaker":"Gemmy Cheung"},{"start_seconds":1215,"end_seconds":1667,"title":"Choosing the right study sample and ensuring adequate sample size","speaker":"Giulia Corradetti"},{"start_seconds":1667,"end_seconds":2283,"title":"Ensuring accurate AMD diagnosis before enrollment","speaker":"Enrico Borrelli"},{"start_seconds":2283,"end_seconds":2783,"title":"Phenotypic diversity: more than just AMD stage","speaker":"Sobha Sivaprasad"},{"start_seconds":2783,"end_seconds":3274,"title":"When visual acuity is not enough: exploring alternative functional endpoints","speaker":"Usha Chakravarthy"},{"start_seconds":3274,"end_seconds":3685,"title":"Why did they fail? insights from previous unsuccessful studies","speaker":"Roy Schwartz"},{"start_seconds":3685,"end_seconds":3736.157333,"title":"Discussion","speaker":null}],"summary":{"overview":[{"text":"This course treats AMD trial design as a connected problem: recruit a representative population, confirm the diagnosis, characterise biological risk, and choose an endpoint and sample size that can detect a meaningful effect. Lessons from unsuccessful programmes caution against carrying weak exploratory signals into confirmatory trials.","evidence":[{"start":29,"end":50},{"start":1455,"end":1538},{"start":3660,"end":3678}]}],"key_findings":[{"title":"Align eligibility with the question","text":"Imaging improves diagnostic accuracy and risk enrichment, but restrictive eligibility can make recruitment difficult and reduce generalisability.","evidence":[{"start":1820,"end":1954},{"start":2550,"end":2607}]},{"title":"Specify what success means","text":"A structural treatment effect, a prognostic biomarker and a patient-perceived functional benefit are different claims. The speakers repeatedly distinguish early-phase exploration from validated late-phase endpoints.","evidence":[{"start":1384,"end":1455},{"start":2669,"end":2714},{"start":3152,"end":3190}]}],"limitations":[{"text":"The session combines reviews, retrospective studies, illustrative cases and proposed designs. Its explanations for failed programmes are interpretations, not proof that any single design choice caused failure.","evidence":[{"start":269,"end":289},{"start":1692,"end":1816},{"start":3316,"end":3408}]}],"source_note":"Original summary based on the complete automated transcript, official chapter metadata and targeted slide checks. Not a full manual audio audit, current clinical guidance or independent regulatory validation."},"chapter_summaries":[{"start_seconds":0,"title":"Setting Up a Clinical Trial in AMD: Key Methodological and Clinical Considerations","speaker":"Course chairs","overview":[{"text":"The chairs introduce the course and its focus on methodological and clinical choices in AMD trials.","evidence":[{"start":0,"end":27}]}],"key_findings":[],"limitations":[]},{"start_seconds":29,"title":"Two critical challenges: underrepresentation and screen failure in AMD trials","speaker":"Jay Chhablani","overview":[{"text":"Chhablani reports improved race reporting between successive decades, but persistent minority underrepresentation. A separate retrospective study of 87 retina trials across six centres did not identify disproportionate minority exclusion at screening; imaging and visual-acuity criteria were important reasons for screen failure.","evidence":[{"start":178,"end":249},{"start":269,"end":372}]}],"key_findings":[],"limitations":[{"text":"The screening analysis did not resolve which individual imaging requirements drove exclusions, and predominantly reflected neovascular-AMD trials.","evidence":[{"start":536,"end":577}]}]},{"start_seconds":617,"title":"Gender and ethnic diversity: implications for AMD presentation and clinical trial design","speaker":"Gemmy Cheung","overview":[{"text":"Cheung shows how sex distribution, ethnicity and phenotype interact: Asian neovascular-AMD trial subgroups were often younger and predominantly male. She discusses PCV representation, transport and language support, and community outreach. Planned subgroup analyses can identify where dedicated follow-up studies are justified.","evidence":[{"start":710,"end":848},{"start":985,"end":1017},{"start":1107,"end":1197}]}],"key_findings":[],"limitations":[{"text":"Clinical observations about participation barriers are not established biological explanations for group differences.","evidence":[{"start":773,"end":848}]}]},{"start_seconds":1215,"title":"Choosing the right study sample and ensuring adequate sample size","speaker":"Giulia Corradetti","overview":[{"text":"Corradetti connects power to effect size, variability, sample size and significance level. Functional-outcome trials need endpoint-specific planning that incorporates lesion location, focality and measurement method; anatomical efficacy alone does not establish functional benefit.","evidence":[{"start":1245,"end":1362},{"start":1384,"end":1476},{"start":1516,"end":1570}]}],"key_findings":[],"limitations":[]},{"start_seconds":1667,"title":"Ensuring accurate AMD diagnosis before enrollment","speaker":"Enrico Borrelli","overview":[{"text":"Borrelli uses multimodal imaging cases to distinguish AMD from inherited or mitochondrial retinal disease, drug toxicity, myopia and pachychoroid disease. History, age, OCT, autofluorescence and angiography can change eligibility. He does not estimate the proportion of pivotal-trial participants misdiagnosed.","evidence":[{"start":1692,"end":1816},{"start":1820,"end":2147},{"start":2177,"end":2214}]}],"key_findings":[],"limitations":[]},{"start_seconds":2283,"title":"Phenotypic diversity: more than just AMD stage","speaker":"Sobha Sivaprasad","overview":[{"text":"Sivaprasad argues that intermediate AMD contains markedly different progression risks. She proposes OCT-informed enrichment using drusen burden and hyperreflective foci, while warning that rare-marker requirements can undermine recruitment. Enrollment, endpoint and follow-up must be designed together.","evidence":[{"start":2365,"end":2506},{"start":2550,"end":2649},{"start":2570,"end":2571}]}],"key_findings":[],"limitations":[{"text":"Earlier structural endpoints were presented as exploratory options requiring validation for late-phase use.","evidence":[{"start":2654,"end":2714}]}]},{"start_seconds":2783,"title":"When visual acuity is not enough: exploring alternative functional endpoints","speaker":"Usha Chakravarthy","overview":[{"text":"Chakravarthy explains why BCVA may track GA enlargement poorly: foveal location, ceiling and floor effects, shifting fixation and slow average change weaken sensitivity. Lesion topography can reveal subgroups with clearer functional decline. Low-luminance acuity and other functional tests also need longitudinal validation.","evidence":[{"start":2827,"end":2904},{"start":2904,"end":3061},{"start":3062,"end":3190},{"start":3230,"end":3262}]}],"key_findings":[],"limitations":[]},{"start_seconds":3274,"title":"Why did they fail? insights from previous unsuccessful studies","speaker":"Roy Schwartz","overview":[{"text":"Schwartz contrasts three failure patterns: a fragile phase-II signal with lampalizumab, changed eligibility with Fovista, and target engagement without demonstrated disease modification with emixustat. He recommends prospectively confirming subgroup hypotheses and establishing a disease-progression signal before phase III.","evidence":[{"start":3316,"end":3408},{"start":3498,"end":3576},{"start":3576,"end":3678}]}],"key_findings":[{"title":"Interrogate exploratory evidence","text":"The MAHALO slide reports p=.117 against a prespecified phase-II threshold of .20. A retrospective AI-adjusted reanalysis is presented as a caution about baseline prognostic imbalance, not a prospectively validated way to avert failure.","evidence":[{"start":3348,"end":3349},{"start":3409,"end":3498}]}],"limitations":[]},{"start_seconds":3685,"title":"Discussion","speaker":"Panel","overview":[{"text":"The closing advice is to resist rushing into phase III before testing the robustness of subgroup findings and potential regression to the mean.","evidence":[{"start":3685,"end":3722}]}],"key_findings":[],"limitations":[]}],"review_notes":[{"text":"Selected slides confirm trial-reporting figures, the distinction between screening and earlier recruitment barriers, proposed enrichment criteria, and the lampalizumab/emixustat examples. Unclear ASR arithmetic and unverified subgroup percentages are omitted.","evidence":[{"start":185,"end":186},{"start":318,"end":319},{"start":2570,"end":2571},{"start":3348,"end":3349},{"start":3598,"end":3599}]}]},{"id":"95496","title":"Industry Satellite Symposium - Valeda PBM in Dry AMD: Biological Rationale to Clinical Findings","date":"2026-10-02","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","source_url_kind":"official personal programme","session_number":null,"recording_status":"not_exposed","type":"Industry Satellite Symposium\nSESSION POSTER\nClick to view full poster","speakers":[{"name":"Laurent Kodjikian","role":"Chair"}],"duration_minutes":60,"start_time":"13:45","end_time":"14:45","timezone":"CEST","recording_duration_seconds":null,"chapters":[],"summary":{"overview":[],"key_findings":[],"limitations":[],"coverage_note":"No on-demand recording was exposed on the authenticated session page at collection time. This Valeda PBM entry is programme-only; no findings have been inferred from its title or session-announcement poster."},"chapter_summaries":[],"review_notes":[]},{"id":"95615","title":"Free Paper 28 - AMD/CSC","date":"2026-10-03","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","source_url_kind":"official personal programme","session_number":null,"recording_status":"downloaded","topic":"AMD/CSC","type":"Free Paper Session","speakers":[{"name":"Thomas Ach","role":"Chair"},{"name":"Elisabetta Pilotto","role":"Chair"},{"name":"Ursula Schmidt-Erfurth","role":"Speaker"},{"name":"Edward Adams","role":"Speaker"},{"name":"Sophie Frank-Publig","role":"Speaker"},{"name":"Mattia Tomasoni","role":"Speaker"},{"name":"Lukas Kuchernig","role":"Speaker"},{"name":"Siqing Yu","role":"Speaker"},{"name":"Bernardo Souza Mendes","role":"Speaker"},{"name":"Yiu Wai Chan","role":"Speaker"},{"name":"Oliver Leingang","role":"Speaker"},{"name":"David Eichenbaum","role":"Speaker"}],"duration_minutes":60,"start_time":"09:00","end_time":"10:00","timezone":"CEST","recording_duration_seconds":4136.301333,"chapters":[{"start_seconds":0,"end_seconds":76,"title":"Free Paper 28 - AMD/CSC","speaker":null},{"start_seconds":76,"end_seconds":653,"title":"Predicting Retinal Sensitivity in Geographic Atrophy (GA) from optical coherence tomography (OCT) morphology","speaker":"Ursula Schmidt-Erfurth"},{"start_seconds":653,"end_seconds":1075,"title":"Transfer learning improves automated OCT segmentation of atrophy biomarkers across earlier stages of age-related macular degeneration","speaker":"Edward Adams"},{"start_seconds":1075,"end_seconds":1497,"title":"Longitudinal Progression Patterns of Drusen Phenotypes in Intermediate Age-related Macular Degeneration in the PINNACLE Study","speaker":"Sophie Frank-Publig"},{"start_seconds":1497,"end_seconds":1909,"title":"Genetic architecture of choroidal vascularity revealed by population-scale OCT imaging","speaker":"Mattia Tomasoni"},{"start_seconds":1909,"end_seconds":2295,"title":"Spatio-temporal choriocapillaris flow deficits predict outer retinal degeneration patterns in geographic atrophy","speaker":"Lukas Kuchernig"},{"start_seconds":2295,"end_seconds":2656,"title":"Topographical association between subretinal hyperreflective material (SHRM) morphological changes and best-corrected visual acuity (BCVA) in neovascular age-related macular degeneration (nAMD)","speaker":"Siqing Yu"},{"start_seconds":2656,"end_seconds":3015,"title":"Point-wise Analysis Deciphers the Focal Impact of Subretinal Drusenoid Deposits","speaker":"Bernardo Souza Mendes"},{"start_seconds":3015,"end_seconds":3370,"title":"Topographic Spatial Agreement Between Fundus Autofluorescence and SD-OCT Features of Geographic Atrophy: Analysis in the eDREAMS Trial","speaker":"Yiu Wai Chan"},{"start_seconds":3370,"end_seconds":3715,"title":"Artificial Intelligence-based lesion growth predictions as prognostic covariate adjustment to improve analyses in geographic atrophy clinical trials","speaker":"Oliver Leingang"},{"start_seconds":3715,"end_seconds":4136.301333,"title":"A Proof-of-Concept Study for Candidate Identification in Geographic Atrophy: Potential for Enrollment Efficiency and Enrichment using an Artificial Intelligence (AI)-Driven Workflow","speaker":"David Eichenbaum"}],"summary":{"overview":[{"text":"Ten research presentations examine spatially resolved AMD biomarkers and AI-assisted measurement, prediction and trial operations. A recurring theme is that local tissue relationships contain information lost when anatomy or function is reduced to whole-eye averages.","evidence":[{"start":202,"end":268},{"start":1938,"end":1994},{"start":2725,"end":2839}]}],"key_findings":[{"title":"Test what the model actually adds","text":"OCT-based models can estimate function and progression, but correlation, segmentation accuracy, biological association and added predictive value are separate tests. Several talks expose gaps between those measures.","evidence":[{"start":293,"end":380},{"start":853,"end":918},{"start":2138,"end":2250}]},{"title":"Promising trial tools remain provisional","text":"AI may help trial recruitment and statistical efficiency, but the presented covariate-adjustment simulations and retrospective candidate search require prospective confirmation.","evidence":[{"start":3600,"end":3689},{"start":4017,"end":4062}]}],"limitations":[{"text":"These are heterogeneous free papers, including observational cohorts, post-hoc trial analyses, cross-sectional imaging, genetic inference and simulations. Findings should not be combined as if they were one validation study or evidence of treatment benefit.","evidence":[{"start":1107,"end":1191},{"start":1789,"end":1854},{"start":2345,"end":2359},{"start":2956,"end":2973},{"start":3600,"end":3630}]}],"source_note":"Original summary based on the complete automated transcript, official chapter metadata and targeted slide checks. Not a full manual audio audit or independent clinical validation."},"chapter_summaries":[{"start_seconds":0,"title":"Free Paper 28 - AMD/CSC","speaker":"Chairs","overview":[{"text":"The chairs introduce the free-paper session. Scientific presentations begin at 01:16.","evidence":[{"start":0,"end":35}]}],"key_findings":[],"limitations":[]},{"start_seconds":76,"title":"Predicting Retinal Sensitivity in Geographic Atrophy (GA) from optical coherence tomography (OCT) morphology","speaker":"Ursula Schmidt-Erfurth","overview":[{"text":"Schmidt-Erfurth models targeted microperimetry from OCT in 61 eyes of 43 patients. Five-fold cross-validation yielded mean correlation r=.66 and mean absolute error 4.48 dB. EZ/RPE status and lesion-border distance dominated prediction; measurement variability remains substantial relative to slow functional decline.","evidence":[{"start":268,"end":380},{"start":295,"end":296}]}],"key_findings":[],"limitations":[]},{"start_seconds":653,"title":"Transfer learning improves automated OCT segmentation of atrophy biomarkers across earlier stages of age-related macular degeneration","speaker":"Edward Adams","overview":[{"text":"Adams adapts a GA-trained segmentation model to earlier AMD with a small additional annotated dataset. Transfer learning and RETFound improve some features, especially hypertransmission, but performance varies by dataset and feature. Strong Dice overlap does not guarantee accurate lesion-area measurements.","evidence":[{"start":738,"end":849},{"start":853,"end":957}]}],"key_findings":[],"limitations":[]},{"start_seconds":1075,"title":"Longitudinal Progression Patterns of Drusen Phenotypes in Intermediate Age-related Macular Degeneration in the PINNACLE Study","speaker":"Sophie Frank-Publig","overview":[{"text":"Frank-Publig’s PINNACLE analysis links refractile drusen to faster EZ thinning and the highest cRORA conversion. Hyporeflective-core drusen show faster drusen and outer-nuclear-layer thinning. Subretinal drusenoid deposits add risk in some phenotypes, illustrating heterogeneity within intermediate AMD.","evidence":[{"start":1107,"end":1208},{"start":1252,"end":1384},{"start":1350,"end":1351}]}],"key_findings":[],"limitations":[]},{"start_seconds":1497,"title":"Genetic architecture of choroidal vascularity revealed by population-scale OCT imaging","speaker":"Mattia Tomasoni","overview":[{"text":"Tomasoni presents a UK Biobank OCT genome-wide association study of choroidal vascularity. A Mendelian-randomisation analysis supports a direction from AMD genetic liability toward lower vascularity metrics, without significant reverse association. Threshold-dependent image measurements and possible pigmentation-related optical effects complicate biological interpretation.","evidence":[{"start":1564,"end":1629},{"start":1738,"end":1877},{"start":1848,"end":1849}]}],"key_findings":[],"limitations":[]},{"start_seconds":1909,"title":"Spatio-temporal choriocapillaris flow deficits predict outer retinal degeneration patterns in geographic atrophy","speaker":"Lukas Kuchernig","overview":[{"text":"Kuchernig follows 102 eyes with OCT/OCTA. Higher choriocapillaris flow deficits associate with faster local degeneration and visual decline in fovea-sparing eyes, but do not improve short-term prediction beyond structural OCT. Annual imaging identifies observed transitions, not necessarily the true biological sequence.","evidence":[{"start":2010,"end":2078},{"start":2138,"end":2250}]}],"key_findings":[],"limitations":[]},{"start_seconds":2295,"title":"Topographical association between subretinal hyperreflective material (SHRM) morphological changes and best-corrected visual acuity (BCVA) in neovascular age-related macular degeneration (nAMD)","speaker":"Siqing Yu","overview":[{"text":"Yu’s treatment-agnostic, post-hoc TENAYA/LUCERNE analysis maps transitions between well-defined, undefined and absent SHRM. Resolution associates with better BCVA; new SHRM has the strongest adverse association despite low prevalence. The work describes associations, without establishing histological equivalence or causality.","evidence":[{"start":2321,"end":2406},{"start":2475,"end":2637}]}],"key_findings":[],"limitations":[]},{"start_seconds":2656,"title":"Point-wise Analysis Deciphers the Focal Impact of Subretinal Drusenoid Deposits","speaker":"Bernardo Souza Mendes","overview":[{"text":"Souza Mendes analyses subretinal drusenoid deposits point by point rather than averaging across whole eyes. Age-normalised local measurements associate thicker deposits with thinner ONL, EZ and choroid, alongside greater vessel thickness. The cross-sectional design cannot establish whether these changes cause or follow deposits.","evidence":[{"start":2725,"end":2897},{"start":2920,"end":2984}]}],"key_findings":[],"limitations":[]},{"start_seconds":3015,"title":"Topographic Spatial Agreement Between Fundus Autofluorescence and SD-OCT Features of Geographic Atrophy: Analysis in the eDREAMS Trial","speaker":"Yiu Wai Chan","overview":[{"text":"Chan compares same-day FAF and OCT in 34 eDREAMS eyes. FAF-defined GA aligns closely with OCT RPE loss but misses substantial photoreceptor degeneration extending outside that boundary. He presents the modalities as complementary measures of different tissue changes.","evidence":[{"start":3031,"end":3188},{"start":3198,"end":3289},{"start":3307,"end":3348}]}],"key_findings":[],"limitations":[]},{"start_seconds":3370,"title":"Artificial Intelligence-based lesion growth predictions as prognostic covariate adjustment to improve analyses in geographic atrophy clinical trials","speaker":"Oliver Leingang","overview":[{"text":"Leingang uses AI-predicted GA growth as a prognostic covariate in analyses of 52 FILLY sham eyes. RPE-loss precision improves more than EZ-loss precision. Simulations suggest fewer eyes per arm, but these are model-derived efficiency estimates, not results from a prospectively AI-adjusted therapeutic trial.","evidence":[{"start":3484,"end":3589},{"start":3589,"end":3689}]}],"key_findings":[{"title":"Keep simulations distinct from clinical results","text":"An 18-month simulated trial targeting 25% slowing at 80% power falls from approximately 74 eyes per arm to 47 with one AI factor or 42 with two exploratory factors.","evidence":[{"start":3615,"end":3616}]}],"limitations":[]},{"start_seconds":3715,"title":"A Proof-of-Concept Study for Candidate Identification in Geographic Atrophy: Potential for Enrollment Efficiency and Enrichment using an Artificial Intelligence (AI)-Driven Workflow","speaker":"David Eichenbaum","overview":[{"text":"Eichenbaum’s retrospective single-site GATHER screening exercise filters 10,421 charts by imaging and then EMR review, identifying 24 potential candidates. Historical recruitment enrolled six of 26 screened. The proposed efficiency gain is hypothetical: the 24 candidates were never prospectively screened or enrolled.","evidence":[{"start":3822,"end":3944},{"start":4017,"end":4062},{"start":3938,"end":3939}]}],"key_findings":[],"limitations":[]}],"review_notes":[{"text":"Slides establish hyporeflective-core drusen, despite repeated ASR substitutions of hyperreflective. They also distinguish potential recruitment from actual enrollment and one-factor from two-factor simulation results.","evidence":[{"start":1350,"end":1351},{"start":3615,"end":3616},{"start":3938,"end":3939},{"start":3970,"end":3971}]}]},{"id":"95078","title":"Microperimetry in Retinal Diseases: Diagnostic Role, Clinical Utility, and Future as a Regulatory Endpoint","date":"2026-10-03","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","source_url_kind":"official personal programme","session_number":"RETINA26-SS112","recording_status":"downloaded","topic":"Imaging","type":"Instructional Course","speakers":[{"name":"Gregor Reiter","role":"Chair"},{"name":"Rosa Dolz-Marco","role":"Chair"},{"name":"Enrico Borrelli","role":"Speaker"},{"name":"Roy Schwartz","role":"Speaker"},{"name":"Stela Vujosevic","role":"Speaker"},{"name":"Maria Vittoria Cicinelli","role":"Speaker"},{"name":"Maximilian Pfau","role":"Speaker"}],"duration_minutes":60,"start_time":"09:00","end_time":"10:00","timezone":"CEST","recording_duration_seconds":3750.858667,"chapters":[{"start_seconds":0,"end_seconds":36,"title":"Introduction","speaker":null},{"start_seconds":36,"end_seconds":539,"title":"Microperimetry basics: Principles, technology and role in diagnostics","speaker":"Rosa Dolz-Marco"},{"start_seconds":539,"end_seconds":994,"title":"Integration of microperimetry into multimodal imaging and new applications","speaker":"Enrico Borrelli"},{"start_seconds":994,"end_seconds":1412,"title":"Microperimetry as a functional endpoint in clinical studies and regulatory considerations","speaker":"Roy Schwartz"},{"start_seconds":1412,"end_seconds":1846,"title":"Microperimetry in retinal vascular diseases","speaker":"Stela Vujosevic"},{"start_seconds":1846,"end_seconds":2256,"title":"Implications of microperimetry in uveitic diseases","speaker":"Maria Vittoria Cicinelli"},{"start_seconds":2256,"end_seconds":2704,"title":"Microperimetry in inherited macular diseases","speaker":"Maximilian Pfau"},{"start_seconds":2704,"end_seconds":3239,"title":"Artificial intelligence for identifying structure-function relationships in retinal diseases","speaker":"Gregor Reiter"},{"start_seconds":3239,"end_seconds":3750.858667,"title":"Discussion","speaker":null}],"summary":{"overview":[{"text":"The course presents microperimetry as spatially resolved functional testing that complements acuity and imaging. Its usefulness depends on asking the right biological question, sampling the relevant retinal area and controlling measurement variability; the same protocol is not suitable for every disease or trial.","evidence":[{"start":57,"end":136},{"start":214,"end":243},{"start":2262,"end":2299},{"start":2661,"end":2683}]}],"key_findings":[{"title":"Choose the test around the disease","text":"GA trial measurements may be more sensitive when focused near changing lesion borders, while inherited and vascular disorders can call for different spatial and photoreceptor-specific strategies.","evidence":[{"start":1115,"end":1293},{"start":2303,"end":2431},{"start":2566,"end":2683}]},{"title":"Regulatory relevance requires more than a threshold","text":"Detectable change must also be repeatable and meaningful to patients. Proposed numerical benchmarks remain debated; the session does not establish a universal approved endpoint.","evidence":[{"start":1293,"end":1385},{"start":1760,"end":1825},{"start":3640,"end":3720}]}],"limitations":[{"text":"The talks mix reviews, clinical cases, observational correlations and methodological proposals. Illustrative recovery or structure–function association does not itself validate an endpoint or prove treatment efficacy.","evidence":[{"start":1850,"end":1867},{"start":1990,"end":2233},{"start":2932,"end":3066}]}],"source_note":"Original summary based on the complete automated transcript, official chapter metadata and targeted slide checks. Not a full manual audio audit, current clinical guidance or independent regulatory verification."},"chapter_summaries":[{"start_seconds":0,"title":"Introduction","speaker":"Chairs","overview":[{"text":"The chairs frame growing interest in microperimetry as a reason to connect practical testing choices with clinical and research applications.","evidence":[{"start":0,"end":35}]}],"key_findings":[],"limitations":[]},{"start_seconds":36,"title":"Microperimetry basics: Principles, technology and role in diagnostics","speaker":"Rosa Dolz-Marco","overview":[{"text":"Dolz-Marco explains fundus-controlled perimetry: retinal imaging and eye tracking locate sensitivity measurements and quantify fixation. Stimulus size, luminance, threshold algorithm and grid all affect results. She introduces fixation metrics, including bivariate contour ellipse area, and possible biofeedback applications.","evidence":[{"start":57,"end":214},{"start":295,"end":350},{"start":411,"end":491}]}],"key_findings":[],"limitations":[{"text":"Device and protocol differences limit direct comparison; excessive customisation also complicates comparisons between patients.","evidence":[{"start":157,"end":186},{"start":214,"end":243},{"start":496,"end":508}]}]},{"start_seconds":539,"title":"Integration of microperimetry into multimodal imaging and new applications","speaker":"Enrico Borrelli","overview":[{"text":"Borrelli shows how OCT thickness/reflectivity and OCTA perfusion measurements support structure–function analysis. Segmentation errors, tissue-related floor effects, shadowing, threshold choices and slab position can materially change the apparent association. Accurate imaging is part of a valid functional analysis.","evidence":[{"start":575,"end":668},{"start":668,"end":767},{"start":767,"end":968}]}],"key_findings":[],"limitations":[]},{"start_seconds":994,"title":"Microperimetry as a functional endpoint in clinical studies and regulatory considerations","speaker":"Roy Schwartz","overview":[{"text":"Schwartz argues that conventional GA grids can undersample slowly moving lesion boundaries. Options include junctional-zone analysis, patient-tailored grids, OCT-guided targeting and faster single-intensity defect mapping. Their suitability depends on the endpoint and follow-up interval.","evidence":[{"start":1057,"end":1293}]}],"key_findings":[{"title":"Feasibility matters alongside meaningful change","text":"He discusses an FDA-presentation benchmark of at least 7 dB mean change across at least five loci. In the cited CHROMA/SPECTRI analysis, only 11.6% of participants reached the loss event by week 72; the estimated requirement was about 2,700 per group under the stated trial assumptions.","evidence":[{"start":1293,"end":1367},{"start":1358,"end":1359}]}],"limitations":[]},{"start_seconds":1412,"title":"Microperimetry in retinal vascular diseases","speaker":"Stela Vujosevic","overview":[{"text":"Vujosevic reviews sensitivity and fixation in diabetic retinal disease and vein occlusion. Local sensitivity can reveal dysfunction that acuity misses and relate to ischemia, disorganisation of retinal layers, edema and patient-reported difficulties. Disease-specific thresholds and standardised protocols remain necessary for endpoint validation.","evidence":[{"start":1467,"end":1542},{"start":1586,"end":1760},{"start":1760,"end":1825}]}],"key_findings":[],"limitations":[]},{"start_seconds":1846,"title":"Implications of microperimetry in uveitic diseases","speaker":"Maria Vittoria Cicinelli","overview":[{"text":"Cicinelli uses inflammatory-retinal cases to show diagnostic localisation and recovery tracking. Functional defects sometimes preceded visible OCT changes; MEWDS examples improved as outer retinal structure recovered. Cases with RPE/Bruch’s membrane damage illustrate persistent scotoma. Evidence for uveitis endpoints is still at an early stage.","evidence":[{"start":1850,"end":1867},{"start":1990,"end":2168},{"start":2168,"end":2233}]}],"key_findings":[],"limitations":[]},{"start_seconds":2256,"title":"Microperimetry in inherited macular diseases","speaker":"Maximilian Pfau","overview":[{"text":"Pfau recommends matching the grid to disease geometry: broad grids for overall macular function, profiles for suitable inherited disorders, and tailored patterns for focal progression. Mesopic testing can retain rod-mediated sensitivity despite severe cone dysfunction in achromatopsia; photoreceptor-specific questions need appropriate stimulus and adaptation conditions.","evidence":[{"start":2272,"end":2431},{"start":2451,"end":2489},{"start":2566,"end":2683}]}],"key_findings":[],"limitations":[]},{"start_seconds":2704,"title":"Artificial intelligence for identifying structure-function relationships in retinal diseases","speaker":"Gregor Reiter","overview":[{"text":"Reiter uses AI to quantify structural biomarkers at microperimetry locations, emphasising precise image registration and eccentricity. Outer-retinal integrity repeatedly associates with sensitivity across diseases. Adding OCTA to structural models contributes little extra predictive performance in the presented GA analysis.","evidence":[{"start":2776,"end":2867},{"start":2906,"end":3066},{"start":3108,"end":3212}]}],"key_findings":[],"limitations":[]},{"start_seconds":3239,"title":"Discussion","speaker":"Panel and audience","overview":[{"text":"Discussion addresses functional abnormalities without visible routine imaging changes, volumetric sensitivity measures, foveal sampling and the clinical meaning of decibel thresholds. Participants favour linking endpoint changes to daily-life benefit. An industry attendee describes regulator discussions about alternative thresholds, but this is anecdotal development experience, not verified general policy.","evidence":[{"start":3239,"end":3328},{"start":3342,"end":3545},{"start":3550,"end":3618},{"start":3623,"end":3720}]}],"key_findings":[],"limitations":[]}],"review_notes":[{"text":"The 7 dB benchmark and feasibility slide were checked directly: 11.6% refers to participants reaching a predefined loss event, not 11.6% of test points. MEWDS and fixation terminology were also checked.","evidence":[{"start":309,"end":310},{"start":1308,"end":1309},{"start":1358,"end":1359},{"start":2074,"end":2075}]}]},{"id":"95222","title":"From Data to Insights: Harnessing the Power of AI to Transform Drug Development and Clinical Care","date":"2026-10-03","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","source_url_kind":"official personal programme","session_number":"RETINA26-SS255","recording_status":"downloaded","topic":"Imaging","type":"Symposium","speakers":[{"name":"Daniela Ferrara","role":"Chair"},{"name":"Pearse Keane","role":"Chair"},{"name":"Josef Christian Huemer","role":"Speaker"},{"name":"David Merle","role":"Speaker"},{"name":"Stela Vujosevic","role":"Speaker"}],"duration_minutes":60,"start_time":"14:15","end_time":"15:15","timezone":"CEST","recording_duration_seconds":3779.557333,"chapters":[{"start_seconds":0,"end_seconds":225,"title":"Introduction","speaker":null},{"start_seconds":225,"end_seconds":816,"title":"Fundamental concepts in artificial intelligence for healthcare","speaker":"Josef Christian Huemer"},{"start_seconds":816,"end_seconds":1491,"title":"Artificial-intelligence based retinal imaging analysis","speaker":"Daniela Ferrara"},{"start_seconds":1491,"end_seconds":1963,"title":"Artificial intelligence-powered drug development","speaker":"David Merle"},{"start_seconds":1963,"end_seconds":2549,"title":"Real-world applications of artificial intelligence in retinal diseases","speaker":"Stela Vujosevic"},{"start_seconds":2549,"end_seconds":3207,"title":"The new field of oculomics research","speaker":"Pearse Keane"},{"start_seconds":3207,"end_seconds":3779.557333,"title":"Discussion","speaker":null}],"summary":{"overview":[{"text":"The symposium follows AI from image measurement and drug development to clinical implementation and systemic-disease research. Its strongest shared message is that technical performance must be converted into a useful, trustworthy workflow with evidence of benefit and continuing oversight.","evidence":[{"start":59,"end":79},{"start":636,"end":734},{"start":2063,"end":2122},{"start":3031,"end":3117}]}],"key_findings":[{"title":"Separate capability from demonstrated utility","text":"AI can make detailed retinal measurements and combine information at a scale impractical for manual review. Prediction and trial-design applications are promising, but many remain exploratory and need external or prospective confirmation.","evidence":[{"start":897,"end":960},{"start":1125,"end":1137},{"start":1920,"end":1941}]},{"title":"A prediction needs a care pathway","text":"Oculomics creates a responsibility to define what happens after a risk report: who interprets it, where referral goes and whether acting improves health.","evidence":[{"start":2885,"end":2982},{"start":3077,"end":3117}]}],"limitations":[{"text":"This is an expert symposium with research examples, selected cases and product illustrations, not a comparative validation of the products mentioned. Regulatory, availability and commercial-performance statements should not be treated as independently verified current facts.","evidence":[{"start":1310,"end":1456},{"start":2744,"end":2937},{"start":3744,"end":3767}]}],"source_note":"Original summary based on the complete automated transcript, official chapter metadata and targeted slide checks. Some audience questions are incompletely captured; discussion summaries rely on intelligible responses. Not a full manual audio audit or independent clinical/regulatory verification."},"chapter_summaries":[{"start_seconds":0,"title":"Introduction","speaker":"Daniela Ferrara","overview":[{"text":"Ferrara introduces the ambition to use comparable quantitative imaging tools in trials and everyday practice, while examining both the promise and practical risks of AI.","evidence":[{"start":59,"end":79},{"start":114,"end":173}]}],"key_findings":[],"limitations":[]},{"start_seconds":225,"title":"Fundamental concepts in artificial intelligence for healthcare","speaker":"Josef Christian Huemer","overview":[{"text":"Huemer traces the move from traditional machine learning to deep learning and foundation models. Model-development papers still outweigh evaluation studies, and single-modality work predominates. He argues for progression from retrospective validation to prospective studies, outcome trials and implementation research.","evidence":[{"start":321,"end":456},{"start":506,"end":570},{"start":636,"end":687}]}],"key_findings":[{"title":"Close the implementation gap","text":"Clinicians should co-design tools around real decisions, with auditable thresholds, safety/equity checks and usability testing. A strong laboratory model is insufficient if it does not fit the clinical pathway.","evidence":[{"start":695,"end":734}]}],"limitations":[]},{"start_seconds":816,"title":"Artificial-intelligence based retinal imaging analysis","speaker":"Daniela Ferrara","overview":[{"text":"Ferrara illustrates automated quantification of photoreceptor and RPE damage, longitudinal tracking, GA forecasting and targeted microperimetry. EZ damage outside the RPE-loss boundary can carry prognostic information; possible treatment-response relationships require independent confirmation. OCT-derived sensitivity maps are presented as an early-stage extension, not direct measurements of vision.","evidence":[{"start":1038,"end":1137},{"start":1170,"end":1248},{"start":1252,"end":1408}]}],"key_findings":[],"limitations":[{"text":"Individual longitudinal examples demonstrate possibilities, not guaranteed prediction accuracy for every patient.","evidence":[{"start":1310,"end":1456}]}]},{"start_seconds":1491,"title":"Artificial intelligence-powered drug development","speaker":"David Merle","overview":[{"text":"Merle surveys AI across target discovery, recruitment, trial design and post-marketing evidence. An OCT-derived continuous AMD score supports genetic discovery; segmentation and language models could jointly identify imaging and record-based eligibility criteria.","evidence":[{"start":1532,"end":1601},{"start":1605,"end":1674}]}],"key_findings":[{"title":"Distinguish different trial-design roles","text":"He separates prognostic enrichment for likely progression from predictive enrichment for likely treatment response, and discusses balanced allocation, external controls and richer imaging endpoints. Most proposed retinal applications remain proof of concept and must demonstrate real-world value.","evidence":[{"start":1717,"end":1875},{"start":1920,"end":1941}]}],"limitations":[]},{"start_seconds":1963,"title":"Real-world applications of artificial intelligence in retinal diseases","speaker":"Stela Vujosevic","overview":[{"text":"Vujosevic recommends starting with a clinical need and specifying the user, decision and downstream action. Examples include compartment-specific fluid monitoring and AMD phenotyping. Deployment requires local validation, clear responsibility and continuing checks for performance deterioration; success should include access, equity and patient benefit rather than accuracy alone.","evidence":[{"start":2063,"end":2122},{"start":2247,"end":2379},{"start":2424,"end":2510}]}],"key_findings":[],"limitations":[]},{"start_seconds":2549,"title":"The new field of oculomics research","speaker":"Pearse Keane","overview":[{"text":"Keane describes oculomics as combining retinal imaging, large datasets and AI to investigate systemic health. Commercial risk reports already reach clinicians, sometimes without a clear referral pathway. He questions whether performance, calibration, feasibility and acceptability are adequate, especially when prediction offers little actionable benefit.","evidence":[{"start":2572,"end":2692},{"start":2744,"end":2982}]}],"key_findings":[{"title":"Define the useful product before building it","text":"Target product profiles begin with intended use and define required clinical utility, data governance, cost, safety, acceptability and infrastructure. The community-oculomics programme is using evidence synthesis and stakeholder consensus to prioritise useful applications.","evidence":[{"start":3031,"end":3148},{"start":3088,"end":3089}]}],"limitations":[]},{"start_seconds":3207,"title":"Discussion","speaker":"Panel","overview":[{"text":"The panel emphasises trust, usable products, shared OCT/data standards and collaboration across medical specialties. It closes with a warning to scrutinise commercial claims and distinguish attractive demonstrations from evidence that supports deployment.","evidence":[{"start":3367,"end":3514},{"start":3554,"end":3579},{"start":3637,"end":3667},{"start":3736,"end":3767}]}],"key_findings":[],"limitations":[]}],"review_notes":[{"text":"Slides confirm the evidence hierarchy, the difference between prognostic and predictive enrichment, and target-product-profile domains. Commercial accuracy figures and uncertain device-approval counts are intentionally not repeated.","evidence":[{"start":665,"end":666},{"start":1738,"end":1739},{"start":2864,"end":2865},{"start":3088,"end":3089}]}]},{"id":"95185","title":"From Structure to Function Course","date":"2026-10-04","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","source_url_kind":"official personal programme","session_number":"RETINA26-SS218","recording_status":"downloaded","topic":"Imaging","type":"Instructional Course","speakers":[{"name":"Anat Loewenstein","role":"Chair"},{"name":"Omer Trivizki","role":"Chair"},{"name":"Steffen Schmitz-Valckenberg","role":"Speaker"},{"name":"Gregor Reiter","role":"Speaker"},{"name":"Stela Vujosevic","role":"Speaker"},{"name":"Sobha Sivaprasad","role":"Speaker"},{"name":"Marion R. Munk","role":"Speaker"},{"name":"Maximilian Pfau","role":"Speaker"},{"name":"Roy Schwartz","role":"Speaker"}],"duration_minutes":60,"start_time":"09:00","end_time":"10:00","timezone":"CEST","recording_duration_seconds":3910.986667,"chapters":[{"start_seconds":0,"end_seconds":38,"title":"From Structure to Function Course","speaker":null},{"start_seconds":38,"end_seconds":383,"title":"Real-World Structure-Based Clinical Trials: Why Functional Endpoints Matter","speaker":"Omer Trivizki"},{"start_seconds":383,"end_seconds":884,"title":"Grid-Based Microperimetry: Designing Functional Maps That Fit Anatomy","speaker":"Steffen Schmitz-Valckenberg"},{"start_seconds":884,"end_seconds":1322,"title":"Microperimetry from Healthy Eyes to Intermdiate AMD","speaker":"Gregor Reiter"},{"start_seconds":1322,"end_seconds":1828,"title":"DME: Function Beyond Thickness – Linking Ischemia, Sensitivity, and Structure","speaker":"Stela Vujosevic"},{"start_seconds":1828,"end_seconds":2440,"title":"BCVA Is Not Gone: Re-defining Vision Endpoints in the Era of Functional Mapping","speaker":"Sobha Sivaprasad"},{"start_seconds":2440,"end_seconds":2956,"title":"Dark Adaptation Across Diseases: Protocols, Pitfalls, and Promise","speaker":"Marion R. Munk"},{"start_seconds":2956,"end_seconds":3490,"title":"Inferring Microperimetry from OCT: AI-Based Functional Prediction","speaker":"Maximilian Pfau"},{"start_seconds":3490,"end_seconds":3855,"title":"Functional Testing in SDD Patients","speaker":"Roy Schwartz"},{"start_seconds":3855,"end_seconds":3910.986667,"title":"Discussion","speaker":null}],"summary":{"overview":[{"text":"This course asks how retinal measurements can capture vision that matters to patients. The speakers connect anatomy-guided microperimetry, acuity, dark adaptation and AI-derived functional estimates, while showing why measurement precision, disease stage and clinical meaning must be considered together.","evidence":[{"start":43,"end":69},{"start":478,"end":486},{"start":2205,"end":2289},{"start":3363,"end":3388}]}],"key_findings":[{"title":"Spatial detail needs measurement discipline","text":"Dense measurements near relevant lesions can reveal local change hidden by whole-eye averages, but require reproducible registration, appropriate normative data and control of fatigue and test–retest variability.","evidence":[{"start":533,"end":560},{"start":949,"end":1061},{"start":1170,"end":1204}]},{"title":"Preserve the distinction between structure and function","text":"An imaging association, a forecast of sensitivity and a directly measured patient benefit are different evidence levels. Emerging methods should complement established tests until their intended use is validated.","evidence":[{"start":2139,"end":2267},{"start":3321,"end":3388},{"start":3731,"end":3805}]}],"limitations":[{"text":"The course mixes methodological studies, trial reanalyses, clinical examples and proposals. Reported treatment and regulatory interpretations are the speakers’ congress accounts; this summary does not independently establish efficacy or regulatory acceptance.","evidence":[{"start":69,"end":190},{"start":2205,"end":2316},{"start":3321,"end":3435}]}],"source_note":"Original summary based on the complete automated transcript, official chapter metadata and targeted slide checks. Not a full manual audio audit, current clinical guidance or independent regulatory verification."},"chapter_summaries":[{"start_seconds":0,"title":"From Structure to Function Course","speaker":"Chairs","overview":[{"text":"The chairs introduce a course linking retinal anatomy to function, with particular emphasis on atrophic disease.","evidence":[{"start":0,"end":34}]}],"key_findings":[],"limitations":[]},{"start_seconds":38,"title":"Real-World Structure-Based Clinical Trials: Why Functional Endpoints Matter","speaker":"Omer Trivizki","overview":[{"text":"Trivizki contrasts anatomical slowing with outcomes patients recognise, such as reading and mobility. He uses GA trial and real-world examples to argue for spatially targeted function and explores home VR testing and simulated daily tasks as emerging approaches, rather than established replacements for trial endpoints.","evidence":[{"start":43,"end":218},{"start":222,"end":356}]}],"key_findings":[],"limitations":[]},{"start_seconds":383,"title":"Grid-Based Microperimetry: Designing Functional Maps That Fit Anatomy","speaker":"Steffen Schmitz-Valckenberg","overview":[{"text":"Schmitz-Valckenberg distinguishes targeted testing, which individually positions a fixed grid, from patient-tailored grids shaped around each lesion. Both concentrate limited testing time on relevant regions. Density, area covered, accuracy and fatigue must be balanced; lesion-border sampling can reveal change diluted in standard grids.","evidence":[{"start":418,"end":552},{"start":588,"end":740},{"start":787,"end":865}]}],"key_findings":[],"limitations":[]},{"start_seconds":884,"title":"Microperimetry from Healthy Eyes to Intermdiate AMD","speaker":"Gregor Reiter","overview":[{"text":"Reiter stresses age-, device- and eccentricity-aware normal references, repeatability and accurate image registration. Intermediate-AMD mean sensitivity shifts modestly, while focal deficits track ONL/EZ thinning, drusen, hyperreflective foci and subretinal drusenoid deposits. Whole-eye averages can obscure these local relationships.","evidence":[{"start":949,"end":1061},{"start":1065,"end":1204}]}],"key_findings":[],"limitations":[]},{"start_seconds":1322,"title":"DME: Function Beyond Thickness – Linking Ischemia, Sensitivity, and Structure","speaker":"Stela Vujosevic","overview":[{"text":"Vujosevic argues that DME cannot be explained by central thickness alone. Fluid compartments, ischemia, retinal-layer disorganisation and outer-retinal integrity contribute different information about function and prognosis. Microperimetry and other stage-appropriate tests may complement acuity; prospective treatment-linked validation remains important.","evidence":[{"start":1328,"end":1497},{"start":1560,"end":1717},{"start":1754,"end":1797}]}],"key_findings":[],"limitations":[]},{"start_seconds":1828,"title":"BCVA Is Not Gone: Re-defining Vision Endpoints in the Era of Functional Mapping","speaker":"Sobha Sivaprasad","overview":[{"text":"Sivaprasad defends BCVA as an interpretable measure of central function while acknowledging its limitations for fovea-sparing GA and intermediate AMD. New endpoints must establish reliability, longitudinal sensitivity and patient relevance. She favours complementary or composite functional assessment and early regulator engagement rather than assuming microperimetry can immediately replace acuity.","evidence":[{"start":1848,"end":1953},{"start":2090,"end":2316},{"start":2383,"end":2419}]}],"key_findings":[],"limitations":[]},{"start_seconds":2440,"title":"Dark Adaptation Across Diseases: Protocols, Pitfalls, and Promise","speaker":"Marion R. Munk","overview":[{"text":"Munk presents dark adaptation as a promising early-AMD measure of rod dysfunction. Rod-intercept time depends on bleach location and protocol; different maximum test durations censor severely delayed recovery. Natural-history evidence is stronger than intervention evidence, and many advanced or SDD eyes exceed testing limits.","evidence":[{"start":2482,"end":2576},{"start":2587,"end":2743},{"start":2749,"end":2929}]}],"key_findings":[{"title":"Match the endpoint to the mechanism","text":"Visual-cycle modulators directly delay dark adaptation, complicating its interpretation as a measure of therapeutic benefit.","evidence":[{"start":2847,"end":2864}]}],"limitations":[]},{"start_seconds":2956,"title":"Inferring Microperimetry from OCT: AI-Based Functional Prediction","speaker":"Maximilian Pfau","overview":[{"text":"Pfau explains OCT-based functional inference through segmented features or end-to-end learning. With patient-level cross-validation, mean pointwise prediction errors are around 4–5 dB in the presented work; adding limited patient-specific functional data lowers error toward 3 dB. Models require disease-specific validation.","evidence":[{"start":3089,"end":3209},{"start":3295,"end":3318}]}],"key_findings":[{"title":"Estimated function remains an estimate","text":"The OAKS/DERBY examples are inferred sensitivity estimates derived from structure. They should not be confused with directly measured functional benefit; drugs that alter function without visible structural change can invalidate the mapping.","evidence":[{"start":3321,"end":3388},{"start":3345,"end":3346}]}],"limitations":[]},{"start_seconds":3490,"title":"Functional Testing in SDD Patients","speaker":"Roy Schwartz","overview":[{"text":"Schwartz argues for measuring SDD/reticular pseudodrusen burden rather than presence alone. Greater extent or volume associates with worse function and progression risk. Evidence is most promising for baseline enrichment/stratification; treatment-response prediction, monitoring and surrogate-endpoint claims require progressively more validation.","evidence":[{"start":3545,"end":3669},{"start":3674,"end":3847}]}],"key_findings":[],"limitations":[]},{"start_seconds":3855,"title":"Discussion","speaker":"Panel","overview":[{"text":"The final exchange leaves area versus volume, OCT scan density and cross-device agreement as unresolved measurement questions for SDD burden.","evidence":[{"start":3855,"end":3903}]}],"key_findings":[],"limitations":[]}],"review_notes":[{"text":"Slide checks confirm the two grid concepts, protocol-dependent dark-adaptation limits, and the separate patient-level versus patient-informed prediction scenarios. OAKS/DERBY functional estimates are explicitly labelled inferred.","evidence":[{"start":612,"end":613},{"start":700,"end":701},{"start":2618,"end":2619},{"start":3180,"end":3181},{"start":3202,"end":3203},{"start":3345,"end":3346}]}]},{"id":"95623","title":"Free Paper 42 - AMD/CSC","date":"2026-10-04","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","source_url_kind":"official personal programme","session_number":null,"recording_status":"downloaded","topic":"AMD/CSC","type":"Free Paper Session","speakers":[{"name":"Camiel J.F. Boon","role":"Chair"},{"name":"Timothy Jackson","role":"Chair"},{"name":"Glenn Jaffe","role":"Speaker"},{"name":"Ritesh Narula","role":"Speaker"},{"name":"Ferhina S. Ali","role":"Speaker"},{"name":"Yaniv Barkana","role":"Speaker"},{"name":"Nora Dimon","role":"Speaker"},{"name":"Andrea Cusumano","role":"Speaker"},{"name":"Jordi Monés","role":"Speaker"},{"name":"Roberto Gallego-Pinazo","role":"Speaker"}],"duration_minutes":60,"start_time":"10:15","end_time":"11:15","timezone":"CEST","recording_duration_seconds":3129.266667,"chapters":[{"start_seconds":0,"end_seconds":18,"title":"Free Paper 42 - AMD/CSC","speaker":null},{"start_seconds":18,"end_seconds":398,"title":"Correlation of Foveal Invasion with Visual Function at Baseline in the Phase 3 SIENNA Trial of Pozelimab in Combination with Cemdisiran or Cemdisiran Alone for Geographic Atrophy","speaker":"Glenn Jaffe"},{"start_seconds":398,"end_seconds":778,"title":"Results of Phase 1/2a Trial of Eyecyte-RPE for the Treatment of Geographic atrophy associated with Age-related Macular Degeneration","speaker":"Ritesh Narula"},{"start_seconds":778,"end_seconds":1036,"title":"Vision Outcomes from the DAVIO 2 Phase 2 Trial: Bioerodible EYP-1901 (vorolanib intravitreal insert) in Wet Age-Related Macular Degeneration","speaker":"Ferhina S. Ali"},{"start_seconds":1036,"end_seconds":1391,"title":"Repeatability and Test–Retest Characteristics of Personalized Microperimetry Endpoints in Non-Foveal Geographic Atrophy: Findings from Baseline Triplicate Testing in the eDREAM Trial","speaker":"Yaniv Barkana"},{"start_seconds":1391,"end_seconds":1753,"title":"Sustained dual VEGF and Ang-2 inhibition through suprachoroidal AAV gene therapy for retinal vascular diseases","speaker":"Nora Dimon"},{"start_seconds":1753,"end_seconds":2168,"title":"Multimodal Retinal Imaging Before and After Subretinal Implantation of the PRIMA Photovoltaic Chip in Geographic Atrophy","speaker":"Andrea Cusumano"},{"start_seconds":2168,"end_seconds":2546,"title":"Vision Improvement in Macular Degeneration with Sonpiretigene Isteparvovec Optogenetic Therapy: First Direct-to-Phase 2 Randomized, Controlled Trial","speaker":"Jordi Monés"},{"start_seconds":2546,"end_seconds":2865,"title":"Baseline Characteristics of Participants in ARCHER II: A Phase 3 Study of Vision Protection of Vonaprument, a C1q inhibitor, in Dry AMD with GA","speaker":"Roberto Gallego-Pinazo"},{"start_seconds":2865,"end_seconds":3129.266667,"title":"Stereotactic radiotherapy for neovascular age related macular degeneration (STAR): year 3 and 4 results of a randomised, double-masked, sham-controlled, post-primary device trial.","speaker":"Timothy Jackson"}],"summary":{"overview":[{"text":"This session combines ongoing-trial baseline analyses, functional-test methodology, early therapeutic studies and longer-term outcomes. The maturity of evidence varies sharply: some presentations concern trial readiness or preclinical promise, while STAR supplies a cautionary example of delayed clinical harm.","evidence":[{"start":90,"end":168},{"start":1144,"end":1185},{"start":1701,"end":1719},{"start":2984,"end":3050}]}],"key_findings":[{"title":"Distinguish baseline findings from efficacy","text":"Screening correlations and repeatable baseline testing can support trial design, but do not establish that an intervention preserves vision. SIENNA, eDREAM and ARCHER II presentations should be read in that context.","evidence":[{"start":90,"end":102},{"start":1042,"end":1071},{"start":2549,"end":2556}]},{"title":"Follow-up and denominators change the interpretation","text":"Early vision-restoration signals need careful attention to controls, sample size, excluded adverse-event cases and the disease actually studied. Long-term follow-up can change the benefit–risk interpretation.","evidence":[{"start":562,"end":637},{"start":2297,"end":2465},{"start":2984,"end":3050}]}],"limitations":[{"text":"These congress reports are not head-to-head comparisons. Several analyses are exploratory, pooled, post-hoc or preclinical; treatment and regulatory claims remain attributed to presenters rather than independently confirmed.","evidence":[{"start":562,"end":637},{"start":903,"end":911},{"start":1502,"end":1517},{"start":2778,"end":2851}]}],"source_note":"Original summary based on the complete automated transcript, official chapter metadata and targeted slide checks. Not a full manual audio audit, clinical recommendation or independent verification of efficacy, safety attribution or regulatory status."},"chapter_summaries":[{"start_seconds":0,"title":"Free Paper 42 - AMD/CSC","speaker":"Chairs","overview":[{"text":"The chairs introduce nine free papers spanning trial methodology, investigational therapies and long-term follow-up.","evidence":[{"start":0,"end":14}]}],"key_findings":[],"limitations":[]},{"start_seconds":18,"title":"Correlation of Foveal Invasion with Visual Function at Baseline in the Phase 3 SIENNA Trial of Pozelimab in Combination with Cemdisiran or Cemdisiran Alone for Geographic Atrophy","speaker":"Glenn Jaffe","overview":[{"text":"Jaffe presents SIENNA screening data, not treatment efficacy. Greater foveal atrophic burden associates with worse acuity and contrast sensitivity, while baseline total GA area correlates only weakly with subsequent growth. These measures may help stratification; the trial remains ongoing.","evidence":[{"start":81,"end":168},{"start":197,"end":313}]}],"key_findings":[],"limitations":[]},{"start_seconds":398,"title":"Results of Phase 1/2a Trial of Eyecyte-RPE for the Treatment of Geographic atrophy associated with Age-related Macular Degeneration","speaker":"Ritesh Narula","overview":[{"text":"Narula reports exploratory visual gains after subretinal Eyecyte-RPE in a small uncontrolled phase-I cohort and early phase-II follow-up. Pooled summaries have small, changing denominators. Phase II includes macular hole and endophthalmitis; the latter patient is excluded from the presented efficacy analysis.","evidence":[{"start":444,"end":499},{"start":531,"end":637},{"start":545,"end":546},{"start":615,"end":616}]}],"key_findings":[],"limitations":[{"text":"The speaker reports endophthalmitis as unrelated to the investigational product; that attribution does not remove the event from the overall treatment experience.","evidence":[{"start":545,"end":546}]}]},{"start_seconds":778,"title":"Vision Outcomes from the DAVIO 2 Phase 2 Trial: Bioerodible EYP-1901 (vorolanib intravitreal insert) in Wet Age-Related Macular Degeneration","speaker":"Ferhina S. Ali","overview":[{"text":"Ali reports DAVIO 2 BCVA noninferiority for single-dose EYP-1901 versus aflibercept 2 mg every eight weeks at the month-7/8 average. Previously treated nAMD patients received loading treatment and could receive supplemental injections. Supplement-free and time-in-range analyses are secondary/post-hoc evidence, not proof every patient needs no rescue.","evidence":[{"start":815,"end":903},{"start":903,"end":989},{"start":850,"end":851}]}],"key_findings":[],"limitations":[]},{"start_seconds":1036,"title":"Repeatability and Test–Retest Characteristics of Personalized Microperimetry Endpoints in Non-Foveal Geographic Atrophy: Findings from Baseline Triplicate Testing in the eDREAM Trial","speaker":"Yaniv Barkana","overview":[{"text":"Barkana describes personalised baseline microperimetry in 58 eDREAM participants: 55 points and three tests across two testing days about two weeks apart. Mean-sensitivity correlations were .97 within-day and .92 between days. Training, grid preparation and rules for non-seeing points matter; these are baseline measurement findings, not GAL-101 efficacy results.","evidence":[{"start":1033,"end":1145},{"start":1175,"end":1294},{"start":1184,"end":1185}]}],"key_findings":[],"limitations":[]},{"start_seconds":1391,"title":"Sustained dual VEGF and Ang-2 inhibition through suprachoroidal AAV gene therapy for retinal vascular diseases","speaker":"Nora Dimon","overview":[{"text":"Dimon presents Coave’s engineered suprachoroidal AAV platform intended to deliver VEGF-trap and anti-Ang-2 activity. Primate studies show transduction, protein expression and favourable immunogenicity comparisons. Human safety, durable disease control and a single-treatment clinical benefit remain unestablished in this preclinical presentation.","evidence":[{"start":1439,"end":1517},{"start":1522,"end":1719},{"start":1640,"end":1641}]}],"key_findings":[],"limitations":[]},{"start_seconds":1753,"title":"Multimodal Retinal Imaging Before and After Subretinal Implantation of the PRIMA Photovoltaic Chip in Geographic Atrophy","speaker":"Andrea Cusumano","overview":[{"text":"Cusumano reports 12-month imaging after PRIMA implantation in 38 eyes, with generally preserved overlying inner retina. Important complications include full-thickness macular holes in four eyes and neovascularisation in two. Thin-retina selection and surgical placement require care; anatomical stability is not equivalent to absence of risk.","evidence":[{"start":1849,"end":1948},{"start":1939,"end":1940},{"start":1986,"end":2067},{"start":2113,"end":2144}]}],"key_findings":[],"limitations":[]},{"start_seconds":2168,"title":"Vision Improvement in Macular Degeneration with Sonpiretigene Isteparvovec Optogenetic Therapy: First Direct-to-Phase 2 Randomized, Controlled Trial","speaker":"Jordi
