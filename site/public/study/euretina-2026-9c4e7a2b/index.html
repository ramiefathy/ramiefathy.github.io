Monés","overview":[{"text":"Monés reviews bipolar-cell-targeted optogenetic therapy using prior retinitis-pigmentosa findings, a six-patient Stargardt study and a non-human-primate model. The macular Stargardt subgroup shows reported gains, but this talk does not provide completed randomised GA efficacy results; a GA trial is described as a future step.","evidence":[{"start":2222,"end":2316},{"start":2329,"end":2465},{"start":2338,"end":2339}]}],"key_findings":[],"limitations":[]},{"start_seconds":2546,"title":"Baseline Characteristics of Participants in ARCHER II: A Phase 3 Study of Vision Protection of Vonaprument, a C1q inhibitor, in Dry AMD with GA","speaker":"Roberto Gallego-Pinazo","overview":[{"text":"Gallego-Pinazo compares ARCHER II baseline characteristics with phase II. The phase-III trial randomises 659 participants 2:1 to monthly vonaprument or sham, with confirmed ≥15-letter BCVA loss as its primary endpoint. Prior phase-II functional signals motivated the design; phase-III efficacy was not yet reported.","evidence":[{"start":2549,"end":2602},{"start":2651,"end":2795},{"start":2670,"end":2671}]}],"key_findings":[],"limitations":[]},{"start_seconds":2865,"title":"Stereotactic radiotherapy for neovascular age related macular degeneration (STAR): year 3 and 4 results of a randomised, double-masked, sham-controlled, post-primary device trial.","speaker":"Timothy Jackson","overview":[{"text":"Jackson’s STAR follow-up reverses the reassuring two-year impression. The initial injection reduction did not continue to widen after return to standard care; at year four radiotherapy eyes were 8.3 letters worse than sham (95% CI −12.7 to −4.0). He argues for masked follow-up beyond primary endpoints.","evidence":[{"start":2888,"end":3050},{"start":3018,"end":3019}]}],"key_findings":[],"limitations":[]}],"review_notes":[{"text":"Slides confirm Eyecyte-RPE adverse events and efficacy exclusion, PRIMA’s four macular holes among 38 eyes, ARCHER II’s confirmed ≥15-letter-loss endpoint and STAR’s year-four acuity difference. Optogenetic GA efficacy is not inferred from the programme title.","evidence":[{"start":545,"end":546},{"start":615,"end":616},{"start":1939,"end":1940},{"start":2670,"end":2671},{"start":3018,"end":3019},{"start":2455,"end":2465}]}]},{"id":"95261","title":"Choroidal Circulation: Anatomy, Imaging, Clinical Applications, and Management Strategies","date":"2026-10-04","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","source_url_kind":"official personal programme","session_number":"RETINA26-SS294","recording_status":"downloaded","topic":"Imaging","type":"Instructional Course","speakers":[{"name":"Mario Saravia","role":"Chair"},{"name":"Nancy Holekamp","role":"Speaker"},{"name":"Jordi Monés","role":"Speaker"},{"name":"Christine Curcio","role":"Speaker"},{"name":"Enrico Borrelli","role":"Speaker"},{"name":"MARÍA PAZ USUNA","role":"Speaker"}],"duration_minutes":70,"start_time":"10:15","end_time":"11:25","timezone":"CEST","recording_duration_seconds":3628.458667,"chapters":[{"start_seconds":0,"end_seconds":27,"title":"Choroidal Circulation: Anatomy, Imaging, Clinical Applications, and Management Strategies","speaker":null},{"start_seconds":27,"end_seconds":697,"title":"Introduction to Choroidal Anatomy and Circulation (8 min)","speaker":"Nancy Holekamp"},{"start_seconds":697,"end_seconds":1161,"title":"The Choroidal Case","speaker":"Jordi Monés"},{"start_seconds":1161,"end_seconds":1916,"title":"Choriocapillaris flow deficit as a marker on early AMD","speaker":"Christine Curcio"},{"start_seconds":1916,"end_seconds":2474,"title":"Qualitative and Quantitative Assessment of the Choroid: Influencing Factors","speaker":"Enrico Borrelli"},{"start_seconds":2474,"end_seconds":3131,"title":"Lessons on Choroidal Perfusion from Ophthalmic Artery Angioplasty in Geographic Atrophy","speaker":"Mario Saravia"},{"start_seconds":3131,"end_seconds":3628.458667,"title":"ICG-AI Choroidal Perfusion Assessment: Old dog, new trick","speaker":"MARÍA PAZ USUNA"}],"summary":{"overview":[{"text":"The course argues for closer study of choroidal circulation in AMD, connecting vascular anatomy, metabolic transport, OCTA findings and exploratory dynamic-perfusion methods. It also exposes a central measurement problem: structural thickness, thresholded flow signals and actual perfusion are different quantities.","evidence":[{"start":195,"end":307},{"start":1202,"end":1240},{"start":2379,"end":2447},{"start":2921,"end":3095}]}],"key_findings":[{"title":"Measurement choices shape the finding","text":"An apparent vascular deficit depends on both biology and measurement. Device settings, segmentation, shadowing and threshold choices can change conclusions, so comparisons need carefully standardised methods.","evidence":[{"start":2111,"end":2174},{"start":2186,"end":2350},{"start":2400,"end":2436}]},{"title":"Keep mechanistic promise separate from treatment proof","text":"Vascular hypotheses may explain selected phenotypes and guide research, but clinical associations and small intervention series cannot establish that increasing blood flow treats AMD.","evidence":[{"start":1025,"end":1067},{"start":1740,"end":1798},{"start":2885,"end":2886}]}],"limitations":[{"text":"Evidence ranges from historical physiology and models to observational cohorts, illustrative cases, an exploratory angioplasty series and preliminary AI analysis. The session does not establish a validated perfusion biomarker, universal vascular cause of AMD or routine indication for angioplasty.","evidence":[{"start":487,"end":589},{"start":1385,"end":1417},{"start":2885,"end":2886},{"start":3468,"end":3504}]}],"source_note":"Original summary based on the complete automated transcript, official chapter metadata and targeted slide checks. Not a full manual audio audit, clinical recommendation or independent verification of causal and therapeutic claims."},"chapter_summaries":[{"start_seconds":0,"title":"Choroidal Circulation: Anatomy, Imaging, Clinical Applications, and Management Strategies","speaker":"Chairs","overview":[{"text":"The chairs introduce a course focused on the choroidal circulation and its possible contribution to retinal disease.","evidence":[{"start":0,"end":25}]}],"key_findings":[],"limitations":[]},{"start_seconds":27,"title":"Introduction to Choroidal Anatomy and Circulation (8 min)","speaker":"Nancy Holekamp","overview":[{"text":"Holekamp revisits the high metabolic demands of photoreceptors and their dependence on choroidal supply. Drawing on historical angiography and modelling, she emphasises lobular architecture and vulnerable watershed regions, arguing that hypoperfusion deserves renewed attention in AMD. This is a mechanistic framework, not proof of a single cause.","evidence":[{"start":195,"end":307},{"start":310,"end":477},{"start":487,"end":674}]}],"key_findings":[],"limitations":[]},{"start_seconds":697,"title":"The Choroidal Case","speaker":"Jordi Monés","overview":[{"text":"Monés focuses on rapidly progressing diffuse-trickling GA with reticular pseudodrusen and a thin choroid. Case asymmetry and variation in common risk alleles motivate his hypothesis that vascular insufficiency can dominate some phenotypes. He calls for treatment-response analyses by phenotype; reduced complement-inhibitor benefit is a hypothesis here, not a demonstrated result.","evidence":[{"start":723,"end":821},{"start":846,"end":1067}]}],"key_findings":[],"limitations":[]},{"start_seconds":1161,"title":"Choriocapillaris flow deficit as a marker on early AMD","speaker":"Christine Curcio","overview":[{"text":"Curcio links rod-mediated dark adaptation to transport between the circulation and photoreceptors. In ALSTAR2, greater foveal OCTA flow-signal deficit associates with worse rod recovery measured at five degrees and with early-AMD progression over three years. Histology informs interpretation of capillary gaps; multiple transport steps may contribute to dysfunction.","evidence":[{"start":1202,"end":1240},{"start":1385,"end":1487},{"start":1531,"end":1615},{"start":1660,"end":1798},{"start":1868,"end":1893}]}],"key_findings":[],"limitations":[{"text":"The progression effect is modest and observational. Correlation with dark adaptation does not isolate oxygen, retinoids or blood flow as the sole mechanism.","evidence":[{"start":1740,"end":1768},{"start":1827,"end":1893}]}]},{"start_seconds":1916,"title":"Qualitative and Quantitative Assessment of the Choroid: Influencing Factors","speaker":"Enrico Borrelli","overview":[{"text":"Borrelli compares ICG, structural OCT and OCTA. Choroidal thickness varies with age, axial length, location and physiological conditions; vascularity estimates depend on image processing. OCTA studies differ substantially in device, scan, slab, compensation and threshold, making standardisation essential.","evidence":[{"start":1930,"end":2111},{"start":2186,"end":2350}]}],"key_findings":[{"title":"Interpret flow deficits cautiously","text":"A dark OCTA region can reflect shadowing or flow below the detection threshold. It cannot automatically be equated with absent perfusion or a direct flow-volume measurement.","evidence":[{"start":2379,"end":2447}]}],"limitations":[]},{"start_seconds":2474,"title":"Lessons on Choroidal Perfusion from Ophthalmic Artery Angioplasty in Geographic Atrophy","speaker":"Mario Saravia","overview":[{"text":"Saravia presents ophthalmic-artery angioplasty observations in GA, including angiographic perfusion changes and exploratory acuity gains. The slide reports +7.5 letters at three months in 11 eyes and +6.7 at 12 months in nine, compared with baseline; fellow eyes are shown but there is no randomised control comparison.","evidence":[{"start":2478,"end":2561},{"start":2738,"end":2864},{"start":2885,"end":2886}]}],"key_findings":[{"title":"A measurement lesson, not established treatment evidence","text":"Choroidal thickness and vascularity index did not parallel the reported functional gains, motivating dynamic perfusion measurements. This small series does not establish angioplasty’s efficacy or overall benefit–risk for GA.","evidence":[{"start":2921,"end":3095},{"start":2955,"end":2956}]}],"limitations":[]},{"start_seconds":3131,"title":"ICG-AI Choroidal Perfusion Assessment: Old dog, new trick","speaker":"MARÍA PAZ USUNA","overview":[{"text":"Usuna presents pixelwise analysis of ICG arrival, persistence and clearance to group regions with similar perfusion behaviour. Early examples show fewer, larger patches in AMD; a viscosity/perfusion explanation is proposed. The authors describe preliminary findings and an ongoing larger study. Discussion questions how segmented patches correspond to anatomical lobules; a rough size comparison is offered without definitive validation.","evidence":[{"start":3202,"end":3334},{"start":3343,"end":3507},{"start":3521,"end":3610}]}],"key_findings":[],"limitations":[]}],"review_notes":[{"text":"Slides confirm arterial hypoperfusion, correcting an ASR substitution of hyperperfusion. Angioplasty denominators and within-eye comparisons were checked. The ICG patch counts are illustrative examples, not established diagnostic cutoffs.","evidence":[{"start":1035,"end":1036},{"start":2885,"end":2886},{"start":2955,"end":2956},{"start":3450,"end":3451}]}]}],"starred":[{"inventory_index":1,"presentation_id":"poster-568001","official_presentation_id":"568001","title":"Device Dependency in Hyperreflective Foci Quantification: A Multi-Device Comparison of Manual and Automated Volumetric Metrics in AMD","type":"poster","speaker":"Florian Mayer","session_title":"AMD/CSC ePosters","scheduled_time":"08:00 - 08:00","status":"ready","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","session_id":"95721","poster_id":"RETINA26-655","methods":"Matched multi-device OCT; 27 GA and 25 iAMD patients; fovea-centered 1, 3 and 6 mm circles; expert annotation and deep-learning segmentation; Friedman/Wilcoxon device comparisons, ICC(2,1) absolute agreement and Spearman ranking correlations.","interpretation":"Useful evidence for device-specific validation and harmonization in multi-center OCT biomarker studies. This is measurement-validation evidence, not evidence that the algorithm predicts clinical outcomes or improves care.","abstract_summary":"The abstract agrees with the main poster findings: significant device effects on absolute HRF volume, preserved patient rankings, and device-dependent agreement of automated with manual segmentation.","source_basis":"Official authenticated EURETINA 2026 ePoster slide images and Abstract-button PDF, downloaded through supported browser controls. No spoken audio transcript.","summary":{"overview":[{"text":"Hyperreflective-foci (HRF) measurements depend on the OCT device, even when the same eye is scanned at a matched foveal position. This small multi-device study compared 27 geographic-atrophy patients imaged on Cirrus, Maestro2 and Spectralis, and 25 intermediate-AMD patients imaged on Maestro2 and Spectralis. Experts annotated HRF, while a deep-learning system provided automated segmentations; native voxel spacing was retained when converting segmentations to physical volumes. Absolute HRF volumes differed significantly across devices, with Spectralis generally giving higher values. Relative ordering of patients was substantially preserved, so HRF burden may still support stratification within a carefully controlled imaging workflow. Automated measurements tracked expert annotation, but agreement varied by instrument. The practical message is to avoid treating HRF volumes from different OCT systems as interchangeable and to validate an automated pipeline for the specific device and disease stage."}],"key_findings":[{"text":"In the central 3 mm, absolute HRF volumes differed across devices in GA (Friedman p\u003c0.001) and iAMD (Wilcoxon p=0.004). Slide medians were 1.03, 1.25 and 1.98 ×10^-3 mm³ for GA on Cirrus, Maestro2 and Spectralis; iAMD medians were 0.21 and 0.46 ×10^-3 mm³ on Maestro2 and Spectralis.","source":"slide 6; abstract Results"},{"text":"GA patient ranking was preserved across device pairs: Spearman rho 0.824 (Cirrus–Maestro2), 0.831 (Cirrus–Spectralis) and 0.659 (Maestro2–Spectralis), all p\u003c0.001. The slide reports iAMD rho 0.61 for Maestro2–Spectralis.","source":"slide 7; abstract Results"},{"text":"Algorithm-versus-expert ICC was 0.814 for Spectralis GA and 0.809 for Spectralis iAMD; Maestro2 values were 0.739 and 0.698, while Cirrus GA was 0.618. Strong rank correlation does not eliminate imperfect absolute agreement.","source":"slide 8; abstract Results"}],"limitations":[{"text":"Small cohorts and a limited set of instruments; the study does not establish universal conversion factors between device measurements."},{"text":"The poster recommends 3 mm as the main cross-device region. Its iAMD ICC table actually lists 1 mm=0.954 and 3 mm=0.951, despite prose calling 3 mm strongest. Preserve that small internal inconsistency rather than repeat the superlative."},{"text":"Images and the abstract were recovered; these are slide/abstract reading notes, not a spoken-word transcript."}]},"basis":"poster"},{"inventory_index":2,"presentation_id":"poster-568068","official_presentation_id":"568068","title":"Structural and Functional Characteristics in Early and Intermediate Age-Related Macular Degeneration: Baseline Results from the SUDETES Study in the I-SCEEN Study","type":"poster","speaker":"Johannes Schrittwieser","session_title":"AMD/CSC ePosters","scheduled_time":"08:00 - 08:00","status":"ready","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","session_id":"95721","poster_id":"RETINA26-1243","methods":"Standardized BCVA and OCT; AI-derived structural biomarkers in 1- and 6-mm regions. The poster describes age/sex-corrected univariable linear mixed-effects models for a subgroup recruited until March 2025; the abstract uses broader linear-regression language.","interpretation":"Preserved acuity does not imply structurally uniform early AMD. Imaging biomarkers may define subclinical risk phenotypes, but progression prediction and clinical endpoint relevance require the planned follow-up.","abstract_summary":"The abstract provides the same baseline cohort and broad conclusions as the poster. Its central HRF correlations and age–SDD coefficient add detail beyond the summarized slide conclusions.","source_basis":"Official authenticated EURETINA 2026 ePoster slide images and Abstract-button PDF, downloaded through supported browser controls. No spoken audio transcript.","summary":{"overview":[{"text":"The SUDETES baseline analysis characterizes early and intermediate AMD in people with preserved or minimally impaired visual acuity. Across 472 eyes of 316 patients, automated OCT analysis measured drusen, ellipsoid-zone (EZ) and outer-nuclear-layer (ONL) thickness, hyperreflective foci and subretinal drusenoid deposits. Central structural abnormalities were present without a corresponding significant association with best-corrected visual acuity. Drusen burden instead co-localized with EZ thinning and HRF burden. Older age was associated with more subretinal drusenoid deposits. These results explain why BCVA alone may be insensitive to disease-stage heterogeneity in an early-disease cohort and establish an imaging baseline for later longitudinal analyses. They do not yet demonstrate individual prediction of future progression: that is the study’s planned purpose, rather than a completed baseline result."}],"key_findings":[{"text":"The analyzed baseline sample comprised 472 eyes from 316 patients, mean age 74.31±7.91 years; 212 were female and 104 male. SUDETES is a two-year prospective observational study across seven sites in six European countries (NCT06351670).","source":"slides 3 and 5; abstract Methods/Results"},{"text":"Median drusen volume was 0.94 nL centrally (1 mm) and 11.41 nL within 6 mm. Mean EZ thickness was 30.61 and 30.05 μm, and ONL thickness 120.06 and 82.45 μm, in those respective regions. Central-6-mm HRF and SDD median volumes were 3.81 and 4.89 nL.","source":"slide 5; abstract Results"},{"text":"Central-1-mm drusen volume, EZ thickness and ONL thickness showed no significant association with BCVA (all p\u003e0.05). Age was associated with SDD volume, 0.81 nL/year (p\u003c0.001).","source":"slides 6–7; abstract Results"},{"text":"Drusen volume correlated negatively with EZ thickness (r=-0.20 at 1 mm; r=-0.31 at 6 mm, both p\u003c0.001) and positively with HRF volume (r=0.53 at 1 mm; r=0.24 at 6 mm, both p\u003c0.001).","source":"slide 6; abstract Results"}],"limitations":[{"text":"Preliminary cross-sectional baseline analysis; no longitudinal conversion or treatment-effect results are presented."},{"text":"The abstract calls the 6-mm drusen–ONL association absent while reporting r=-0.07, p=0.016. This is a very small association and internally inconsistent significance wording; it should not be presented as a clean negative finding."},{"text":"The official programme/abstract title spells I-SCEEN; the actual consortium and slides say I-SCREEN. The inventory title is retained verbatim."}]},"basis":"poster"},{"inventory_index":3,"presentation_id":"poster-567996","official_presentation_id":"567996","title":"Long-term development of key morphological biomarkers in intermediate AMD contributing to conversion to geographic atrophy over a 3-year observation period: Insights from the PINNACLE Study","type":"poster","speaker":"Ursula Schmidt-Erfurth","session_title":"AMD/CSC ePosters","scheduled_time":"08:00 - 08:00","status":"ready","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","session_id":"95721","poster_id":"RETINA26-580","methods":"Prospective multicenter PINNACLE cohort; standardized imaging at four-month intervals for up to three years; expert cRORA grading and deep-learning structural quantification. The displayed poster includes longitudinal mixed-effects analyses and multivariable Cox models at baseline and first EZL+HT.","interpretation":"Structural change can be quantified well before overt cRORA. The slides support combining multiple OCT measurements and distinguishing baseline risk from risk after an early focal atrophy event.","abstract_summary":"The separate abstract analyzes 546 eyes/426 patients, excluding 60 nAMD-converting eyes. It reports 76 cRORA eyes and 410 non-progressing eyes; larger drusen and EZ-loss measures were present 24 months before conversion, and significant EZ thinning at 12 months. Its logistic-regression risk estimates and group counts differ materially from the displayed poster, so this abstract remains a separate source version.","source_basis":"Official authenticated EURETINA 2026 ePoster slide images and Abstract-button PDF, downloaded through supported browser controls. No spoken audio transcript.","summary":{"overview":[{"text":"This PINNACLE analysis follows quantitative OCT biomarkers before progression from intermediate AMD to complete RPE and outer-retinal atrophy (cRORA). The displayed poster analyzes 486 eyes after excluding 60 eyes converting to neovascular AMD and six with OCT/processing problems. At three years, 128 eyes had cRORA, 71 remained in an ellipsoid-zone-loss-with-hypertransmission (EZL+HT) state, and 287 had neither state. Larger EZ-loss area, greater drusen burden and HRF volume were already evident two years before cRORA detection; lower global EZ thickness emerged 16 months beforehand in the slide analysis. Multivariable models emphasized HRF, reticular pseudodrusen and EZ measures, while drusen volume was not independently significant in the displayed Cox models. Once a first EZL+HT event was detected, its size was especially informative about time to cRORA. The main contribution is a longitudinal, quantitative view of the pre-atrophic pathway; it does not establish causation or a validated individual clinical decision rule."}],"key_findings":[{"text":"Displayed-slide cohort: 486 eyes/377 patients; 128 eyes/116 patients with cRORA, 71 eyes/64 patients remaining EZL+HT, and 287 eyes/235 patients with neither endpoint. Median time to first EZL+HT was 12 months; median time to cRORA was 20 months; the median interval from EZL+HT detection to cRORA was 4 months.","source":"slides 5–6"},{"text":"At 24 months before cRORA, square-root EZ-loss area was 0.95 versus 0.49 mm (p\u003c0.001), drusen volume 0.19 versus 0.10 mm³ (p\u003c0.001), and HRF volume 2.58 versus 1.02 nL (p\u003c0.001), comparing converters with non-converters. Global EZ thickness differed from 16 months before conversion; ONL thickness did not differ significantly at any displayed time point.","source":"slides 7–8"},{"text":"Baseline Cox model including EZ-loss area: HRF HR 1.23 per nL (95% CI 1.12–1.34), RPD HR 1.20 per mm² (1.11–1.30), and EZ-loss area HR 1.16 per mm² (1.05–1.28). The alternative model gave EZ-thickness HR 0.79 per μm (0.69–0.89).","source":"slide 9"},{"text":"After first EZL+HT, event area carried HR 1.25 per 0.01 mm² (95% CI 1.17–1.34) in both displayed models. HRF and RPD remained independent predictors; EZ-loss area remained significant in the model containing it.","source":"slide 10"}],"limitations":[{"text":"Material source-version mismatch: the abstract reports 76 cRORA-converting eyes and 410 non-progressing eyes after nAMD exclusions, whereas the displayed poster reports 128 cRORA, 71 EZL+HT and 287 non-converter eyes. The exact reason for the difference is not stated."},{"text":"The abstract reports logistic-regression odds ratios, including baseline EZ-loss OR 6.87 per mm² and drusen-volume OR 1.22 per 0.01 mm³; the poster uses multivariable Cox hazard ratios. These are distinct analyses and must not be pooled or substituted."},{"text":"The abstract locates significant EZ thinning 12 months before conversion; the slides say 16 months. Summary results above are explicitly from the displayed slides."},{"text":"Observational associations and selected exclusion of nAMD-converting eyes limit generalization to all routes of late-AMD progression."}]},"basis":"poster"},{"inventory_index":4,"presentation_id":"poster-569474","official_presentation_id":"569474","title":"A Predictive Model for Progression from Intermediate Age-Related Macular Degeneration to Focal Events: PINNACLE Study report 13","type":"poster","speaker":"Andrew Lotery","session_title":"LBA ePosters","scheduled_time":"08:00 - 08:00","status":"ready","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","session_id":"95725","poster_id":"LB-RETINA-82","methods":"Prospective 12-center observational cohort, four-monthly imaging for up to 36 months; automatically detected and clinically confirmed focal events; multivariable Cox model with clustered standard errors, backward selection, bootstrap internal validation and shrinkage.","interpretation":"Combining local OCT structure and fellow-eye disease appears more informative for near-term event risk than demographic, genetic and functional variables alone. Potential trial-enrichment use requires external validation and demonstration of links to meaningful late-AMD outcomes.","abstract_summary":"The abstract supplies the exact analyzed cohort, event distribution and internal model validation metrics, whereas the slides focus on the rationale for early focal events and prevention-trial design.","source_basis":"Official authenticated EURETINA 2026 ePoster slide images and Abstract-button PDF, downloaded through supported browser controls. No spoken audio transcript.","summary":{"overview":[{"text":"PINNACLE report 13 develops a model for time to an early OCT-defined focal event in intermediate AMD, rather than waiting for geographic atrophy or macular neovascularization. Focal events include EZ loss with hypertransmission, focal drusen regression, and intra/subretinal fluid. In the abstract’s analyzed cohort of 417 participants and 536 eyes, 250 eyes developed an event over follow-up. A six-predictor Cox model combined fellow-eye late AMD, EZ thickness, reticular pseudodrusen area, HRF volume, drusen volume and AREDS score. Discrimination remained around 0.73 after internal validation, with a calibration slope close to one. The authors propose such models and early focal events for trial enrichment and more tailored monitoring. These are promising candidate tools, but the work has internal validation only and does not establish focal events as accepted regulatory surrogate endpoints or prove that an intervention preventing them also prevents late AMD."}],"key_findings":[{"text":"Abstract cohort: 417 participants, 536 eyes, 1,041 eye-years; 250/536 eyes (46.6%) had a focal event. EZ loss with hypertransmission accounted for 70.4%, drusen regression 15.6%, and subretinal fluid 14.0%.","source":"abstract Results"},{"text":"Abstract cumulative risk was 22.8% at one year, 36.6% at two years and 53.9% at three years. The slide deck summarizes approximately 23%, 37% and 50%, respectively.","source":"abstract Results; slide 6"},{"text":"The final model (506 eyes; 235 events) retained fellow-eye late AMD HR 1.84, EZ thickness HR 0.84, RPD area HR 1.01, HRF volume HR 1.34, drusen volume HR 1.27 and AREDS score HR 1.22. The slide explicitly interprets EZ thickness per μm; scaling for the other continuous predictors is not specified in the displayed table.","source":"abstract Results; slide 7"},{"text":"Harrell C-statistic was 0.734, internally validated C-statistic 0.727 and calibration slope 0.942. The slides say approximately 10% progressed to MNV, with 64% having a preceding focal event.","source":"abstract Results; slide 8"}],"limitations":[{"text":"No external validation is reported. Candidate surrogate endpoints should not be described as established clinical or regulatory substitutes for late AMD."},{"text":"The slides list 429 study participants while the abstract specifies 417 analyzed participants. The distinction between recruited and analyzed populations should be retained."},{"text":"The abstract’s three-year cumulative incidence is 53.9%; the slide approximates it as 50%. Continuous-predictor HRs should not be applied quantitatively without confirming model scaling."}]},"basis":"poster"},{"inventory_index":5,"presentation_id":"poster-568823","official_presentation_id":"568823","title":"Locus-level test-retest repeatability of MAIA microperimetry in geographic atrophy: implications for trial endpoint design from the eDREAM randomised trial","type":"poster","speaker":"Dun Jack Fu","session_title":"Imaging ePosters","scheduled_time":"08:00 - 08:00","status":"ready","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","session_id":"95723","poster_id":"RETINA26-1306","methods":"Reading-center test–retest study of tailored-grid MAIA from screening to baseline; Bland–Altman limits of agreement and coefficient of repeatability; stratification by sensitivity and OCT photoreceptor degeneration. Slides distinguish deep (\u003c0 dB), relative (0–10 dB) and non-scotomatous (\u003e10 dB) loci.","interpretation":"A single-locus shift of a few dB can be ordinary measurement noise, including near an atrophic lesion. Structurally targeted grids can enrich at-risk loci without a dramatic loss of repeatability, but threshold endpoints need confirmation and prespecified handling of test–retest noise.","abstract_summary":"The abstract reports 25 eyes and 1,394 paired loci: CoR 7.48 dB overall and 7.53 dB in scotomatous loci; PRD-associated CoR 7.72 dB versus 7.09 dB without PRD. It describes 11.5% unconfirmed threshold crossings overall (15.2% with PRD, 7.0% without) and recommends two-visit confirmation for time-to-≤10-dB endpoints.","source_basis":"Official authenticated EURETINA 2026 ePoster slide images and Abstract-button PDF, downloaded through supported browser controls. No spoken audio transcript.","summary":{"overview":[{"text":"This eDREAM analysis asks how large a change in MAIA sensitivity at one retinal locus must be before it exceeds ordinary test–retest variability. The patient-tailored grid is registered to the FAF-defined GA boundary, with points at several peri-lesional distances. The displayed slides contain 34 study eyes and 1,867 paired loci retested after a mean 14.5 days, while the separate abstract reports an earlier or different 25-eye, 1,394-locus analysis. Both support a practical pointwise repeatability benchmark of roughly 7–8 dB. Loci with photoreceptor degeneration were somewhat noisier than structurally unaffected loci, but remained in a similar range. Threshold classifications are imperfectly stable, particularly in the relative-scotoma category, so a one-visit crossing can reflect noise. This is important for designing functional endpoints and confirmation rules; it is not evidence of GAL-101 treatment efficacy and the pointwise benchmark must not be directly substituted for the precision of an averaged multi-locus endpoint."}],"key_findings":[{"text":"Displayed-slide cohort: 34 participants/study eyes, 1,867 paired MAIA loci, test–retest interval 14.5±8.9 days. The trial is described as phase II, double-masked, randomized GAL-101 2% ophthalmic solution versus placebo in non-foveal GA (NCT06659549).","source":"slide 2"},{"text":"For loci outside FAF-defined GA, those with no PRD had CoR 7.05 dB (n=779; limits of agreement -7.86 to 6.24 dB). PRD-in-isolation loci had CoR 7.81 dB (n=521; limits -8.83 to 6.80 dB).","source":"slide 5"},{"text":"At peri-lesional 1.29° (~0.375 mm), the captured animation state reports n=461, CoR 7.31 dB and 95% limits -8.41 to 6.20 dB. The slides conclude repeatability was similar across peri-lesional distances.","source":"slide 3 animation state; slide 7"},{"text":"The abstract’s separate 25-eye analysis reports overall ICC 0.88 (95% CI 0.85–0.90), CoR 7.48 dB and limits -8.48 to 6.49 dB. It reports 11.5% noise-associated crossing of the 10-dB threshold and supports a two-visit confirmation rule.","source":"abstract Results"}],"limitations":[{"text":"Material source-version mismatch: slides report 34 eyes/1,867 loci and a 14.5-day mean interval, while the abstract reports 25 eyes/1,394 loci approximately three weeks apart. The reason is not stated; results are labeled by source."},{"text":"The abstract’s binary ≤10/\u003e10-dB stability figures and the slide’s three-category stability figures address different classifications and should not be treated as direct contradictions."},{"text":"This is a repeatability analysis, not a treatment-effect analysis. CoR at an individual locus is not a minimal clinically important difference or the standard error of a multi-locus mean."},{"text":"One slide uses animation states. All 12 available image assets were recovered; a base slide contains a title only, while its animation image contains substantive chart content."}]},"basis":"poster"},{"inventory_index":6,"presentation_id":"starred-06","official_presentation_id":"564044","title":"Structural Biomarkers in Intermediate AMD","type":"talk","session_title":"Intermediate AMD – New Approaches for Characterising Disease Severity and Progression","scheduled_time":"12:02 - 12:12","status":"ready","session_id":"95066","start_seconds":81,"end_seconds":681,"speaker":"Marlene Saßmannshausen","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","summary_ref":{"session_id":"95066","start_seconds":81},"basis":"reused"},{"inventory_index":7,"presentation_id":"starred-07","official_presentation_id":"564045","title":"Defining the Onset of End-Stage Atrophic AMD","type":"talk","session_title":"Intermediate AMD – New Approaches for Characterising Disease Severity and Progression","scheduled_time":"12:12 - 12:22","status":"ready","session_id":"95066","start_seconds":681,"end_seconds":1301,"speaker":"Robyn Guymer","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","summary_ref":{"session_id":"95066","start_seconds":681},"basis":"reused"},{"inventory_index":8,"presentation_id":"starred-08","official_presentation_id":"564046","title":"High-Risk OCT Signs for Future Atrophic AMD Onset","type":"talk","session_title":"Intermediate AMD – New Approaches for Characterising Disease Severity and Progression","scheduled_time":"12:22 - 12:32","status":"ready","session_id":"95066","start_seconds":1301,"end_seconds":1801,"speaker":"Zhichao Wu","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","summary_ref":{"session_id":"95066","start_seconds":1301},"basis":"reused"},{"inventory_index":9,"presentation_id":"starred-09","official_presentation_id":"564047","title":"Photoreceptor Degeneration in Intermediate AMD","type":"talk","session_title":"Intermediate AMD – New Approaches for Characterising Disease Severity and Progression","scheduled_time":"12:32 - 12:42","status":"ready","session_id":"95066","start_seconds":1801,"end_seconds":2637,"speaker":"Justis Ehlers","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","summary_ref":{"session_id":"95066","start_seconds":1801},"basis":"reused"},{"inventory_index":10,"presentation_id":"starred-10","official_presentation_id":"564048","title":"Visual Function Deficits in Intermediate AMD Progression","type":"talk","session_title":"Intermediate AMD – New Approaches for Characterising Disease Severity and Progression","scheduled_time":"12:42 - 12:52","status":"ready","session_id":"95066","start_seconds":2637,"end_seconds":3074,"speaker":"Robert Finger","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","summary_ref":{"session_id":"95066","start_seconds":2637},"basis":"reused"},{"inventory_index":11,"presentation_id":"starred-11","official_presentation_id":"563644","title":"Clinicopathological correlates of geographic atrophy ","type":"talk","session_title":"Optimizing patient selection with geographic atrophy for potential current and future therapies","scheduled_time":"12:03 - 12:13","status":"ready","session_id":"94966","start_seconds":56,"end_seconds":738,"speaker":"Rosa Dolz-Marco","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","summary_ref":{"session_id":"94966","start_seconds":56},"basis":"reused"},{"inventory_index":12,"presentation_id":"starred-12","official_presentation_id":"563645","title":"Implications of the CAM nomenclature in the identification of optimal candidates for current and future GA therapies ","type":"talk","session_title":"Optimizing patient selection with geographic atrophy for potential current and future therapies","scheduled_time":"12:13 - 12:23","status":"ready","session_id":"94966","start_seconds":738,"end_seconds":1563,"speaker":"Roberto Gallego-Pinazo","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","summary_ref":{"session_id":"94966","start_seconds":738},"basis":"reused"},{"inventory_index":13,"presentation_id":"talk-566627","official_presentation_id":"566627","title":"Oral Gildeuretinol for Slowing Disease Progression in Stargardt Disease: The TEASE and Phase 3 Studies","type":"talk","speaker":"Philip Ferrone","session_title":"Free Paper 5 - Inherited Retinal Disease","scheduled_time":"12:18 - 12:24","status":"ready","session_id":"95584","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag/session/95584?view=list\u0026day=2026-10-02\u0026segment=sessions\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":1065,"end_seconds":1443,"summary":{"overview":[{"text":"Ferrone reviews investigational oral gildeuretinol, a deuterated vitamin A designed to reduce toxic dimer formation without inhibiting the visual cycle. He presents the phase 2 TEASE programme in Stargardt disease and the enrolling phase 3 NORTHSTAR trial; SAGA concerns a separate population with geographic atrophy secondary to AMD.","evidence":[{"start":1104,"end":1169},{"start":1302,"end":1344}]}],"key_findings":[{"title":"TEASE structural results need separate interpretation","text":"TEASE-1 reported 21.6% slower square-root-transformed atrophic-lesion growth (29.5% untransformed; both P\u003c0.001) over months 6–24. Its displayed comparison combined placebo and natural-history controls, and the treated group included crossover participants. In TEASE-2, the primary ellipsoid-zone (EZ) area-loss rate was 28% slower, but the result was not statistically significant (P=0.238).","evidence":[{"start":1171,"end":1198}]},{"title":"A functional signal, with nominal and post-hoc analyses","text":"At 24 months, TEASE-2 showed a 2.6-letter between-group difference in low-luminance visual acuity (LLVA; nominal P=0.0279). In a post-hoc eye-level analysis, ≥10-letter LLVA loss occurred in 2.6% of treated versus 14.7% of placebo eyes (nominal P=0.0132); the ≥5- and ≥15-letter comparisons were not significant. The separate SAGA AMD/GA study showed a 4.4-letter LLVA difference (nominal P=0.0314), not a Stargardt result.","evidence":[{"start":1202,"end":1281}]},{"title":"NORTHSTAR is the confirmatory next step","text":"The phase 3 trial was enrolling at the congress. Its planned approximately 230 participants, aged 8–45 with atrophic lesions on fundus autofluorescence, are randomized 1:1 to gildeuretinol 14 mg daily or placebo. The primary endpoint is annualized lesion growth from months 6–24; the key secondary endpoint is LLVA change from baseline to month 24. No phase 3 efficacy result was presented.","evidence":[{"start":1302,"end":1344}]},{"title":"Reported tolerability still requires context","text":"Ferrone reports no clinically meaningful laboratory-panel differences versus placebo and no reports of chromatopsia, delayed dark adaptation or night blindness. Adverse events did occur, and the open-label TEASE-3 and TEASE-4 safety data had no placebo comparator.","evidence":[{"start":1281,"end":1300}]}],"limitations":[{"text":"The slides identify gildeuretinol as investigational and unapproved at the time of presentation. These congress results do not establish clinical benefit: TEASE-2 missed statistical significance on its displayed primary endpoint, the LLVA P values are nominal, and the categorical LLVA analyses are post hoc. TEASE-1’s mixed comparator also matters when interpreting its effect estimate.","evidence":[{"start":1184,"end":1185},{"start":1213,"end":1214},{"start":1258,"end":1259}]},{"text":"The Q\u0026A raises presymptomatic treatment and variable ABCA4 penetrance, but supplies no validated treatment-selection rule. Ferrone’s discussion of earlier diagnosis and genetically supported treatment is a future-facing clinical opinion, not an established indication.","evidence":[{"start":1362,"end":1425}]}]},"review_notes":[{"text":"Checked drug and trial names, study populations, primary-endpoint statistics, nominal/post-hoc qualifiers and NORTHSTAR design against the displayed slides. The slide values replace rounded spoken percentages where needed.","evidence":[{"start":1129,"end":1130},{"start":1156,"end":1157},{"start":1184,"end":1185},{"start":1213,"end":1214},{"start":1258,"end":1259},{"start":1332,"end":1333}]},{"text":"Original summary from the complete locally generated transcript and targeted slide inspection; not an independent clinical or regulatory validation. Ferrone disclosed a consultant and principal-investigator relationship with the developer.","evidence":[{"start":1065,"end":1079}]}],"basis":"new"},{"inventory_index":14,"presentation_id":"talk-566663","official_presentation_id":"566663","title":"Two-stage LLM- and OCT-based clinical trial eligibility pre-screening for Stargardt disease in a real-world dataset","type":"talk","speaker":"Fionn Byrne","session_title":"Free Paper 3 - Miscellaneous","scheduled_time":"12:12 - 12:18","status":"pending","session_id":"95582","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":910,"end_seconds":1359},{"inventory_index":15,"presentation_id":"talk-567860","official_presentation_id":"567860","title":"Learn about the key take aways from the recent European Medicines Regulatory Network (EMRN) workshop on geographic atrophy endpoints.","type":"talk","speaker":"Tanya Moutray","session_title":"EMA Regulatory course – Basic principles and current clinical/methodological topics in medicines regulation in the EU","scheduled_time":"15:36 - 15:48","status":"pending","session_id":"95572","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":2039,"end_seconds":2519},{"inventory_index":16,"presentation_id":"talk-566237","official_presentation_id":"566237","title":"Longitudinal Change of Retinal Sensitivity in Targeted Microperimetry in Early Atrophic Age-Related Macular Degeneration","type":"talk","speaker":"Georg Ansari","session_title":"Free Paper 8 - AMD/CSC","scheduled_time":"15:42 - 15:48","status":"pending","session_id":"95587","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":2927,"end_seconds":3329},{"inventory_index":17,"presentation_id":"talk-566973","official_presentation_id":"566973","title":"The Dark Side of the Moon: New Horizons in Dry AMD","type":"talk","speaker":"Frank Holz","session_title":"Opening Ceremony","scheduled_time":"16:28 - 16:48","status":"pending","session_id":"95545","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":1046,"end_seconds":1831},{"inventory_index":18,"presentation_id":"starred-18","official_presentation_id":"564477","title":"Choosing the right study sample and ensuring adequate sample size","type":"talk","session_title":"Setting Up a Clinical Trial in AMD: Key Methodological and Clinical Considerations","scheduled_time":"08:44 - 08:51","status":"ready","session_id":"95184","start_seconds":1215,"end_seconds":1667,"speaker":"Giulia Corradetti","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","summary_ref":{"session_id":"95184","start_seconds":1215},"basis":"reused"},{"inventory_index":19,"presentation_id":"starred-19","official_presentation_id":"564481","title":"Phenotypic diversity: more than just AMD stage","type":"talk","session_title":"Setting Up a Clinical Trial in AMD: Key Methodological and Clinical Considerations","scheduled_time":"08:58 - 09:05","status":"ready","session_id":"95184","start_seconds":2283,"end_seconds":2783,"speaker":"Sobha Sivaprasad","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","summary_ref":{"session_id":"95184","start_seconds":2283},"basis":"reused"},{"inventory_index":20,"presentation_id":"starred-20","official_presentation_id":"564482","title":"When visual acuity is not enough: exploring alternative functional endpoints","type":"talk","session_title":"Setting Up a Clinical Trial in AMD: Key Methodological and Clinical Considerations","scheduled_time":"09:05 - 09:12","status":"ready","session_id":"95184","start_seconds":2783,"end_seconds":3274,"speaker":"Usha Chakravarthy","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","summary_ref":{"session_id":"95184","start_seconds":2783},"basis":"reused"},{"inventory_index":21,"presentation_id":"starred-21","official_presentation_id":"564484","title":"Why did they fail? insights from previous unsuccessful studies","type":"talk","session_title":"Setting Up a Clinical Trial in AMD: Key Methodological and Clinical Considerations","scheduled_time":"09:12 - 09:19","status":"ready","session_id":"95184","start_seconds":3274,"end_seconds":3685,"speaker":"Roy Schwartz","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","summary_ref":{"session_id":"95184","start_seconds":3274},"basis":"reused"},{"inventory_index":22,"presentation_id":"talk-566592","official_presentation_id":"566592","title":"A Fully Automated OCT- and Fundus Autofluorescence–Guided Microperimetry Platform for Spatial Structure-Function Mapping in Geographic Atrophy and Stargardt Disease: Results from the GAZE and Opti-Gain Studies","type":"talk","speaker":"Muhammad Najam Dar","session_title":"Free Paper 13 - Imaging","scheduled_time":"08:54 - 09:00","status":"pending","session_id":"95592","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":1571,"end_seconds":1998},{"inventory_index":23,"presentation_id":"talk-567869","official_presentation_id":"567869","title":"Enriched Trial Designs and the Patients Left Behind","type":"talk","speaker":"Gregor Reiter","session_title":"Mentorship Programme","scheduled_time":"11:09 - 11:15","status":"pending","session_id":"95595","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":1925,"end_seconds":2405},{"inventory_index":24,"presentation_id":"talk-566224","official_presentation_id":"566224","title":"Avacincaptad Pegol for Geographic Atrophy: 3.5-Year Results From the GATHER2 Open-Label Extension Trial","type":"talk","speaker":"Arshad M. Khanani","session_title":"Free Paper 14 - AMD/CSC","scheduled_time":"11:24 - 11:30","status":"pending","session_id":"95593","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":1558,"end_seconds":1907},{"inventory_index":25,"presentation_id":"talk-566258","official_presentation_id":"566258","title":"Patient-Reported Outcomes Complement Functional Testing in Intermediate Age-Related Macular Degeneration – Insights from the MACUSTAR Study","type":"talk","speaker":"Jan Henrik Terheyden","session_title":"Free Paper 18 - AMD/CSC","scheduled_time":"12:00 - 12:06","status":"ready","session_id":"95600","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":44,"end_seconds":430,"source_url_kind":"official programme","summary":{"overview":[{"text":"Terheyden examines whether patient reports add information to objective visual testing in MACUSTAR. The primary analysis uses four-year data from 539 people with bilateral intermediate AMD, combining the 33-item Vision Impairment in Low Luminance (VILL) questionnaire with acuity and contrast-sensitivity tests from both eyes.","evidence":[{"start":134,"end":199}]}],"key_findings":[{"title":"Related measurements, with different strengths","text":"VILL scores were associated with best-corrected and low-luminance acuity, Moorfields acuity and Pelli–Robson contrast sensitivity. The descriptive correlation heatmap uses a larger 662-person cohort spanning AMD stages: associations were stronger for reading (absolute correlations 0.39–0.54) than emotional well-being (0.23–0.29). These measurements overlap without being interchangeable.","evidence":[{"start":199,"end":264}]},{"title":"Reading and mobility worsen beyond measured visual function","text":"In the displayed age- and sex-adjusted longitudinal models, Reading scores declined by approximately 0.14–0.16 score units per year and Mobility by 0.12–0.14, with p\u003c0.001 for each time effect despite adjustment for the corresponding functional measure. The table does not show comparable consistent worsening in Emotional well-being.","evidence":[{"start":264,"end":304}]},{"title":"A complementary trial endpoint","text":"The results support collecting patient-reported functioning alongside objective endpoints in future intermediate-AMD trials. A low-luminance questionnaire should not be assumed to correlate more strongly with low-luminance acuity than standard acuity; this was raised in discussion, and the speaker described richer contrast-sensitivity testing as a future analysis.","evidence":[{"start":304,"end":344},{"start":356,"end":415}]}],"limitations":[{"text":"This observational analysis demonstrates associations and residual longitudinal change, not treatment responsiveness or causal independence from visual disease. Statistical change in a questionnaire score also does not by itself establish a clinically meaningful treatment difference. The four-year analysis should be distinguished from the newly available six-year dataset, which was discussed as forthcoming work.","evidence":[{"start":134,"end":174},{"start":264,"end":332}]}]},"review_notes":[{"text":"The main bilateral-iAMD subgroup (539) is distinct from the 662-person descriptive correlation cohort shown on the slide. The spoken summary refers broadly to longitudinal decline across categories, but the displayed model table supports consistent decline specifically in Reading and Mobility; Emotional coefficients are mostly nonsignificant and positive. This summary follows the table rather than extending the claim to all domains.","evidence":[{"start":174,"end":224},{"start":264,"end":300}]},{"text":"The official abstract and slide report slightly different baseline acuity dispersions; those nonessential estimates are omitted. Original paraphrase based on the complete local transcript, targeted slide inspection and comparison with the official abstract, not a full manual audio audit or independent clinical validation.","evidence":[{"start":44,"end":430}]}],"basis":"new"},{"inventory_index":26,"presentation_id":"talk-566240","official_presentation_id":"566240","title":"Imaging and Functional Characteristics in Early Non-Foveal Geographic Atrophy (GA) in Age-Related Macular Degeneration without Visual Impairment: Baseline of the APENNINES Study in I-Screen","type":"talk","speaker":"Gregor Reiter","session_title":"Free Paper 18 - AMD/CSC","scheduled_time":"12:06 - 12:12","status":"ready","session_id":"95600","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":430,"end_seconds":801,"source_url_kind":"official programme","summary":{"overview":[{"text":"Reiter reports preliminary baseline findings from APENNINES, the prospective I-SCREEN study of early, foveal-sparing geographic atrophy. The analysis includes 104 eyes of 89 patients with preserved central acuity; the intended two-year study recruits through seven sites in six countries and uses AI-derived OCT measurements to prepare for later progression analyses.","evidence":[{"start":481,"end":618}]}],"key_findings":[{"title":"Acuity can remain good despite substantial outer-retinal damage","text":"Mean baseline acuity was approximately 79.5 letters. Within the central 6 mm, median ellipsoid-zone loss covered 6.04 mm² compared with 1.44 mm² of RPE loss. The disparity demonstrates that these structural measurements describe different extents of damage in this baseline cohort; it does not establish their temporal order.","evidence":[{"start":593,"end":657}]},{"title":"Central photoreceptor-layer thickness relates to acuity","text":"In the presented univariable mixed-effects models, thicker ellipsoid zone within the central 1 mm was associated with better BCVA (+0.36 letters/µm, p\u003c0.001), as was thicker outer nuclear layer (+0.10 letters/µm, p=0.013). These are cross-sectional associations within a selected foveal-sparing population.","evidence":[{"start":657,"end":680}]},{"title":"Loss-area associations remain uncertain","text":"The presented estimates for central 1-mm ellipsoid-zone loss (−4.71 letters/mm², p=0.078) and central 6-mm RPE loss (−0.27 letters/mm², p=0.051) did not meet the usual 0.05 threshold. Drusen and subretinal-drusenoid-deposit volumes also showed no statistically significant BCVA association in this preliminary analysis.","evidence":[{"start":680,"end":703}]}],"limitations":[{"text":"Recruitment was ongoing, and the speaker emphasized that this interim analysis was smaller than the planned 200-patient study. Baseline associations cannot yet validate individual prediction of visual decline. The cohort was selected for good acuity and no foveal-center RPE loss, and low-luminance visual acuity was not included in the trial design.","evidence":[{"start":503,"end":593},{"start":704,"end":756}]}]},"review_notes":[{"text":"The official abstract describes significant loss-area associations and gives different coefficients. The presented table and spoken explanation instead explicitly report nonsignificant EZ-loss and RPE-loss associations (p=0.078 and p=0.051); this summary uses the presentation values and preserves that discrepancy. The table specifies univariable mixed-effects models, so independent multivariable prediction is not claimed.","evidence":[{"start":657,"end":703}]},{"text":"Original paraphrase based on the complete local transcript, targeted slide inspection and comparison with the official abstract. No full manual audio audit or independent clinical validation was performed.","evidence":[{"start":430,"end":801}]}],"basis":"new"},{"inventory_index":27,"presentation_id":"talk-566725","official_presentation_id":"566725","title":"Longitudinal analysis of structural biomarkers for disease progression in intermediate age-related macular degeneration: a MACUSTAR study report","type":"talk","speaker":"Lukas Goerdt","session_title":"Free Paper 18 - AMD/CSC","scheduled_time":"12:12 - 12:18","status":"ready","session_id":"95600","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":801,"end_seconds":1149,"source_url_kind":"official programme","summary":{"overview":[{"text":"Goerdt studies how the location of structural abnormalities changes their prognostic association with late AMD in MACUSTAR. The presentation identifies 575 intermediate-AMD eyes from 575 patients, followed for a median of three years, and compares multimodal biomarkers across the full OCT field, central 3 mm and ETDRS central subfield using multivariable time-discrete hazard models.","evidence":[{"start":861,"end":964}]}],"key_findings":[{"title":"Atrophy and neovascular conversion have different marker profiles","text":"Within the central 3 mm, incomplete and complete RPE/outer-retinal atrophy (iRORA/cRORA) and pigmentary abnormalities were associated with subsequent GA. For example, cRORA had a GA hazard ratio of 19.87 (95% CI 7.76–50.85). Non-exudative CNV was associated with neovascular conversion, with HR 12.75 (3.53–46.05). The wide intervals are important when interpreting these large point estimates.","evidence":[{"start":1002,"end":1015},{"start":1030,"end":1043}]},{"title":"A biomarker’s analyzed region changes the conclusion","text":"The association depended on the spatial definition. For example, pigment epithelial detachment was associated with neovascular progression across the full OCT volume (HR 4.02, 95% CI 1.18–13.69), but its central-3-mm estimate was less certain (3.94, 0.91–17.09). Thus the abstract’s central-region finding that only non-exudative CNV was associated with MNV should not be generalized to every scan region.","evidence":[{"start":964,"end":1030}]},{"title":"Hyperreflective-foci area was not a clear independent signal","text":"The displayed adjusted models did not show a statistically significant association for hyperreflective-foci area. In discussion, Goerdt suggested possible overlap with pigmentary abnormalities as an explanation, but presented this as a hypothesis rather than a demonstrated mechanism.","evidence":[{"start":964,"end":1030},{"start":1082,"end":1129}]}],"limitations":[{"text":"These observational associations may help design risk-enriched studies, but the talk does not validate an individualized prediction tool or treatment-selection rule. Several estimates are imprecise. It also does not fully explain how baseline OCT-defined cRORA was distinguished from the later GA conversion endpoint, a relevant detail for interpreting the large atrophy-associated hazard ratios.","evidence":[{"start":915,"end":1030},{"start":1030,"end":1075}]}]},"review_notes":[{"text":"The slide and spoken cohort size agree at 575, whereas the official abstract says 577 and reports an internally inconsistent 82-event/9.01% total. The local transcript also renders the spoken progression count as approximately 84. The summary therefore uses the verified presented cohort size and does not quote a harmonized event count or conversion percentage.","evidence":[{"start":915,"end":934}]},{"text":"Region- and outcome-specific hazard ratios and 95% confidence intervals were checked on the presentation tables. Original paraphrase based on the complete local transcript, targeted slide inspection and comparison with the official abstract; not a full manual audio audit or independent clinical validation.","evidence":[{"start":801,"end":1149}]}],"basis":"new"},{"inventory_index":28,"presentation_id":"talk-566261","official_presentation_id":"566261","title":"Accelerating Functional Endpoints in Geographic Atrophy Trials via Morphology-based Perimetry Grids","type":"talk","speaker":"Giovanni Ometto","session_title":"Free Paper 18 - AMD/CSC","scheduled_time":"12:36 - 12:42","status":"ready","session_id":"95600","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":2261,"end_seconds":2654,"source_url_kind":"official programme","summary":{"overview":[{"text":"Ometto tests the Geographic Atrophy Morphology-based Mapping Algorithm (GAMMA), which places microperimetry locations using lesion shape. This is a simulation based on six GA lesions, with 32 growth histories and 32 response realizations per lesion, yielding 6,144 simulated realizations per grid/scenario rather than a clinical cohort of that size.","evidence":[{"start":2332,"end":2475}]}],"key_findings":[{"title":"Where points are placed matters","text":"GAMMA selects locations from a morphology-derived informativeness map. It was compared with the 68-location 10-2 grid and a uniformly spaced dense grid that controlled for the larger number of test points. The modeled endpoint required five prespecified locations each to lose at least 7 dB from baseline.","evidence":[{"start":2309,"end":2387},{"start":2613,"end":2638}]},{"title":"Earlier simulated event detection","text":"Median detection times for GAMMA were approximately 1.0, 1.25 and 1.5 years with full, partial and no prior knowledge of the preferential growth direction. The corresponding times were 1.25, 1.5 and 2.0 years for Dense, and 1.5, 2.0 and 2.75 years for 10-2. These times reflect modeled functional progression, not observed treatment benefit.","evidence":[{"start":2482,"end":2522}]},{"title":"Poor directional knowledge still limits detection","text":"With no prior knowledge, three-year detection was about 69.5% for GAMMA, 63.5% for Dense and 59.2% for 10-2, calculated as 100% minus the displayed non-detection percentages. None reached 75% detection. Morphology-informed sampling helped, but did not remove the importance of anticipating lesion growth.","evidence":[{"start":2510,"end":2555}]}],"limitations":[{"text":"Only six lesion masks and simplified growth/response models underlie these results. Shorter follow-up or smaller clinical trials remain potential benefits requiring validation. In discussion, a chair questioned whether targeted point selection establishes a functionally meaningful outcome acceptable to regulators; the response emphasized prespecified locations and possible addition to a standard grid, without demonstrating regulatory acceptance.","evidence":[{"start":2532,"end":2564},{"start":2586,"end":2639}]}]},"review_notes":[{"text":"The results plot is non-detection survival, so its percentages were inverted explicitly when reporting detection. Median times in the official abstract agree with the plotted crossings. The slide and abstract specify a ≥7 dB criterion; the local ASR rendering of a five-decibel threshold was not used.","evidence":[{"start":2310,"end":2326},{"start":2482,"end":2532}]},{"text":"The speaker disclosed a patent relevant to the algorithm. Original paraphrase based on the complete local transcript, selected slide inspection and comparison with the official abstract; no full manual audio audit or independent clinical/regulatory validation was performed.","evidence":[{"start":2280,"end":2289},{"start":2261,"end":2654}]}],"basis":"new"},{"inventory_index":29,"presentation_id":"talk-566744","official_presentation_id":"566744","title":"Baseline Characteristics Associated With Loss of BCVA ≥15 ETDRS Letters in Participants With Geographic Atrophy in the Phase 2 ARCHER Study","type":"talk","speaker":"Usha Chakravarthy","session_title":"Free Paper 20 - AMD/CSC","scheduled_time":"13:06 - 13:12","status":"pending","session_id":"95599","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":421,"end_seconds":808},{"inventory_index":30,"presentation_id":"talk-565906","official_presentation_id":"565906","title":"ERG basics - Maximilian","type":"talk","speaker":"Maximilian Pfau","session_title":"Euretina-EBO Subspecialty Exam Course 3: IRD","scheduled_time":"15:25 - 15:35","status":"pending","session_id":"95460","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":727,"end_seconds":1784},{"inventory_index":31,"presentation_id":"talk-566328","official_presentation_id":"566328","title":"Impact of drusen dynamics on outer retinal morphology and functional outcomes in the PINNACLE study","type":"talk","speaker":"Klaudia Birner","session_title":"Free Paper 21 - AMD/CSC","scheduled_time":"15:15 - 15:21","status":"pending","session_id":"95601","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":19,"end_seconds":418},{"inventory_index":32,"presentation_id":"talk-569782","official_presentation_id":"569782","title":"Phase 1 Results of APL-3007: A Novel Systemic C3 siRNA for Geographic Atrophy Secondary to AMD","type":"talk","speaker":"Dilsher S. Dhoot","session_title":"Free Paper 21 - AMD/CSC","scheduled_time":"15:33 - 15:39","status":"pending","session_id":"95601","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":1091,"end_seconds":1539},{"inventory_index":33,"presentation_id":"talk-566602","official_presentation_id":"566602","title":"Machine-Learning (ML) Ellipsoid Zone (EZ) Measurements of Volume and Loss in OCT Scans with Dry Macular Degeneration - The Necessary Next Steps towards Accurate EZ Identification in Clinical Trials and Introduction of a Novel Classification System","type":"talk","speaker":"Vlad Diaconita","session_title":"Free Paper 25 - Imaging","scheduled_time":"16:48 - 16:54","status":"pending","session_id":"95604","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":1208,"end_seconds":1726},{"inventory_index":34,"presentation_id":"talk-566273","official_presentation_id":"566273","title":"Deep-learning-based quantification and localisation of pseudodrusen in association with photoreceptor degeneration over 3 years in intermediate AMD in the PINNACLE trial","type":"talk","speaker":"Marie Louise Enzendorfer","session_title":"Free Paper 24 - AMD/CSC","scheduled_time":"16:30 - 16:36","status":"ready","session_id":"95620","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":40,"end_seconds":483,"source_url_kind":"official personal programme","summary":{"overview":[{"text":"Enzendorfer examines how reticular pseudodrusen (RPD) change and relate to photoreceptor degeneration in the observational PINNACLE study. AI quantified RPD and ellipsoid-zone (EZ) loss on OCT: 221 of 544 baseline eyes had RPD, and 179 RPD eyes from 152 patients contributed at least one year of longitudinal follow-up, up to three years.","evidence":[{"start":102,"end":170}]}],"key_findings":[{"title":"RPD disappearance is not necessarily improvement","text":"A stable cohort average concealed opposing trajectories: 60% of longitudinally analysed eyes gained RPD area and 40% lost it. Modelled rates were +0.73 mm²/year (95% CI 0.64–0.81) and −0.80 mm²/year (−0.94 to −0.66), respectively. Regressors began with greater RPD burden; RPD was concentrated in the perifovea.","evidence":[{"start":170,"end":216}]},{"title":"Dynamics track degeneration better than baseline area alone","text":"RPD regressors had faster growth of square-root-transformed EZ-loss area than progressors: 0.38 versus 0.12 mm/year (95% CIs 0.29–0.46 and 0.04–0.20; p\u003c0.001). Baseline RPD area alone was not significantly associated with the subsequent EZ-loss growth rate. RPD change and EZ loss were spatially dissociated, with EZ-loss expansion more parafoveal.","evidence":[{"start":217,"end":301}]},{"title":"Risk signal depends on the analysis","text":"For early atrophic focal events defined by EZ loss plus hypertransmission, continuous baseline RPD area showed a borderline association: HR 1.09 per mm² (95% CI 1.00–1.20; p=0.056). Relative to the lowest quartile, quartiles 3 and 4 had HRs 2.18 and 2.29; their lower boundary was 2.61 mm². RPD regression was associated with higher odds of an event (OR 2.54, 95% CI 1.28–5.07; p=0.008).","evidence":[{"start":302,"end":345}]}],"limitations":[{"text":"This observational analysis cannot establish that RPD regression causes atrophy. Forty-two RPD eyes left the analysis before year one, including 14 converting to neovascular AMD; follow-up also varied. The quartile boundary is not a validated clinical threshold, and the proposed metabolic explanation remains a hypothesis requiring further work.","evidence":[{"start":110,"end":135},{"start":315,"end":345},{"start":408,"end":454}]}]},"review_notes":[{"text":"Slide review verified denominators, units, confidence intervals and the distinction between hazard and odds ratios. The abstract describes baseline RPD area as a significant predictor; the presentation qualifies the continuous association as a trend (p=0.056). This summary follows the recording and retains the significant quartile comparisons without generalising them to the continuous model.","evidence":[{"start":110,"end":111},{"start":170,"end":171},{"start":230,"end":231},{"start":315,"end":316}]},{"text":"Original paraphrase based on the complete local transcript, targeted slide inspection and visual review of the official abstract’s illustrative figure. Not a full manual audio audit or independent clinical validation.","evidence":[{"start":40,"end":483}]}],"basis":"new"},{"inventory_index":35,"presentation_id":"talk-566275","official_presentation_id":"566275","title":"Cross-modal agreement between FAF and OCT in quantification of geographic atrophy for eyes enrolled in the eDREAM randomised trial","type":"talk","speaker":"Fangyao Tang","session_title":"Free Paper 24 - AMD/CSC","scheduled_time":"16:54 - 17:00","status":"ready","session_id":"95620","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":1725,"end_seconds":2143,"source_url_kind":"official personal programme","summary":{"overview":[{"text":"Tang compares fundus-autofluorescence (FAF) geographic-atrophy area with OCT-derived retinal pigment epithelium (RPE) loss and photoreceptor degeneration (PRD). This imaging analysis within the eDREAM phase 2 trial used 34 non-foveal GA eyes from 34 patients, with screening and baseline visits about six weeks apart. It benchmarks cross-modal differences against FAF grading variability rather than testing the eye-drop treatment.","evidence":[{"start":1746,"end":1821},{"start":1896,"end":1969}]}],"key_findings":[{"title":"RPE-loss area is a close cross-modal match","text":"OCT RPE-loss area closely matched FAF-defined GA: the displayed mean-difference magnitude was approximately 0.03 mm², with 95% limits of agreement from −0.87 to 0.81 mm². Tang describes this agreement as comparable to FAF grading variability. These limits describe differences in individual measurements, not a confidence interval around the mean.","evidence":[{"start":1986,"end":2012},{"start":2040,"end":2041}]},{"title":"Photoreceptor degeneration covers a different area","text":"OCT-defined PRD was systematically more extensive than FAF-defined GA, with a mean difference of 3.40 mm² and broad 95% limits of agreement (−0.30 to 7.10 mm²). Thus, agreement depends on which OCT tissue feature is measured: RPE loss and photoreceptor degeneration should not be treated as interchangeable GA areas.","evidence":[{"start":1876,"end":1894},{"start":2012,"end":2039}]},{"title":"Larger scan coverage did not remove the tissue difference","text":"Repeating the comparison with a larger 25×30-degree OCT scan rather than 20×20 degrees produced broadly similar agreement. The presentation concludes that capture-region differences had only a minor influence in this sample; RPE-loss agreement remained close while PRD remained larger than FAF-defined GA.","evidence":[{"start":2039,"end":2114}]}],"limitations":[{"text":"The sample is small and selected for non-foveal GA with specified lesion-size criteria and no choroidal neovascularisation. Results do not establish interchangeability for every eye, performance in foveal disease, agreement in longitudinal growth rates or treatment efficacy. Screening-to-baseline comparisons six weeks apart may include biological change as well as measurement variability.","evidence":[{"start":1908,"end":1939},{"start":1969,"end":2012}]}]},"review_notes":[{"text":"The recording updates the official abstract: 34 eyes/68 visits replace the abstract’s 25 baseline eyes, and the talk adds PRD comparisons and a larger-scan sensitivity analysis. Its conclusion of a minor capture-region effect differs from the abstract’s emphasis on improved agreement after restricting to the common footprint. Earlier abstract values were not mixed into the updated analysis.","evidence":[{"start":1927,"end":1939},{"start":1986,"end":2091}]},{"text":"The RPE-loss slide prints +0.03 mm² but its −0.87 to 0.81 limits centre on −0.03; the summary therefore reports the magnitude without asserting a sign. A larger-field PRD annotation also has a mean/limits inconsistency, so those exact values are omitted. Limits of agreement are not confidence intervals or a validation of a clinical equivalence margin.","evidence":[{"start":2005,"end":2006},{"start":2070,"end":2071}]},{"text":"Original paraphrase based on the complete local transcript, targeted slide inspection and the official abstract; not a full manual audio audit or independent clinical or regulatory validation.","evidence":[{"start":1725,"end":2143}]}],"basis":"new"},{"inventory_index":36,"presentation_id":"talk-566282","official_presentation_id":"566282","title":"Dynamics of functional change within OCT-defined focal events in intermediate AMD using targeted microperimetry in the PINNACLE trial","type":"talk","speaker":"Sina Arabi","session_title":"Free Paper 24 - AMD/CSC","scheduled_time":"17:00 - 17:06","status":"ready","session_id":"95620","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":2143,"end_seconds":2657,"source_url_kind":"official personal programme","summary":{"overview":[{"text":"Arabi studies immediate structure–function changes at newly detected OCT focal events in observational PINNACLE data. Five-point lesion-centred microperimetry was co-registered to local OCT biomarkers within 140-µm-diameter regions. The analysis included 56 patients, 61 eyes and 788 paired stimulus locations, giving 1,576 measurements across two visits separated by 29.1±4.1 days.","evidence":[{"start":2290,"end":2438}]}],"key_findings":[{"title":"Drusen collapse showed short-term improvement","text":"Drusen-collapse locations gained 1.05 dB of retinal sensitivity (p=0.01) alongside a 1.25-µm increase in EZ thickness (p=0.02). Locations with EZ loss plus hypertransmission and those with subretinal fluid had small, statistically non-significant sensitivity declines (−0.23 and −0.64 dB). The drusen-collapse and EZ-loss/hypertransmission groups had significantly different functional and structural trajectories.","evidence":[{"start":2438,"end":2511}]},{"title":"Local EZ integrity tracks local function","text":"In separate mixed-effects models, increasing EZ thickness was associated with sensitivity improvement (p=0.026), while expansion of EZ-loss area was associated with sensitivity decline (p=0.005). The displayed models adjust for baseline sensitivity, focal-event type and other OCT biomarkers, with patient and eye random intercepts. Drusen-volume change also reached nominal significance, so the results do not imply an exclusive EZ mechanism.","evidence":[{"start":2511,"end":2569},{"start":2530,"end":2531}]},{"title":"The location and event type matter","text":"Most paired test locations were in EZ-loss/hypertransmission events (540/788, 68.5%); 223 were in drusen collapse and 25 in subretinal fluid. No significant eccentricity-related difference in sensitivity change was detected across ETDRS regions. Targeting newly detected lesions therefore reveals heterogeneous short-term changes that a global average could obscure.","evidence":[{"start":2397,"end":2438},{"start":2569,"end":2622}]}],"limitations":[{"text":"These are one-month observational associations in a selected focal-event subset. The 1,576 measurements are not independent patients or lesions, and the subretinal-fluid group is especially small. Concurrent EZ thickening and sensitivity gain suggest possible recovery but do not prove photoreceptor regeneration, durable improvement or prediction of long-term outcomes.","evidence":[{"start":2310,"end":2438},{"start":
