2486,"end":2511},{"start":2569,"end":2622}]}]},"review_notes":[{"text":"The recording uses updated models and statistics compared with the abstract. Its between-group sensitivity p value is 0.019 rather than 0.04, and its EZ-thickness contrast is 1.74 µm (p=0.025) rather than 1.84 µm (p=0.007). The slide’s baseline-sensitivity/event-type adjustment and EZ p values (0.026 and 0.005) also differ from the abstract’s age/sex/drusen models. The summary follows the slides and does not combine the abstract’s coefficients or confidence intervals with those updated models.","evidence":[{"start":2440,"end":2441},{"start":2530,"end":2531}]},{"text":"Original paraphrase based on the complete local transcript, targeted slide inspection and visual review of the official abstract’s imaging figure. Automated-transcript renderings such as “EZ sickness” were resolved to EZ thickness from the slides. Not a full manual audio audit or independent clinical validation.","evidence":[{"start":2143,"end":2657}]}],"basis":"new"},{"inventory_index":37,"presentation_id":"talk-566266","official_presentation_id":"566266","title":"Artificial Intelligence in GA: Learnings from the Pegcetacoplan Clinical Program","type":"talk","speaker":"Aude Ambresin","session_title":"Free Paper 24 - AMD/CSC","scheduled_time":"17:18 - 17:24","status":"ready","session_id":"95620","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":3371,"end_seconds":3737,"source_url_kind":"official personal programme","summary":{"overview":[{"text":"Ambresin reviews exploratory AI-based anatomical analyses from the pegcetacoplan FILLY, OAKS and DERBY programmes. She argues that OCT can reveal local direction of geographic-atrophy growth and photoreceptor-layer changes that are obscured by a single global FAF lesion-area measurement. These are post-hoc imaging findings, rather than a new prospectively specified clinical endpoint trial.","evidence":[{"start":3382,"end":3448},{"start":3539,"end":3559}]}],"key_findings":[{"title":"Anatomical effects varied with location","text":"In FILLY, monthly treatment was associated with 44% less local GA growth than sham within 0–0.5 mm of the fovea over 12 months, versus 33% at 0.5–1.5 mm (nominal p=0.020 and 0.032). Corresponding every-other-month estimates were 29% and 21%, neither statistically significant (p=0.16 and 0.20). Additional OCT analyses suggested EZ-thickness preservation beyond the visible GA border.","evidence":[{"start":3437,"end":3539}]},{"title":"Photoreceptor-area loss separated from sham","text":"The pooled OAKS/DERBY Spectralis-OCT subset showed 50% less increase in EZ-loss area with monthly treatment and 46% less with every-other-month treatment than sham at month 24 (nominal p\u003c0.0001 for both). The displayed analysis included 289, 294 and 306 patients in the monthly, every-other-month and sham groups, respectively. This is preservation of an imaging biomarker, not a demonstrated 50% reduction in visual disability.","evidence":[{"start":3539,"end":3589}]},{"title":"A candidate marker of disease activity and response","text":"The talk’s EZ:RPE-loss measure was associated with faster RPE-loss growth in untreated eyes and larger treatment differences in the highest quartile. At month 24, EZ-loss reductions versus sham were 78% monthly and 65% every other month in quartile 4, versus 15% and 16% in quartile 1. The highest-quartile p values were \u003c0.0001; the lowest-quartile estimates were not significant (p=0.09 and 0.08).","evidence":[{"start":3589,"end":3664}]}],"limitations":[{"text":"These exploratory analyses use imaging-selected subsets and nominal p values, with no multiplicity adjustment established here. Quartile-specific effects do not by themselves validate an individual treatment-selection test or demonstrate a treatment-by-biomarker interaction. The presentation focuses on anatomy and does not establish patient-reported or measured visual-function benefit from these analyses.","evidence":[{"start":3470,"end":3471},{"start":3550,"end":3551},{"start":3660,"end":3661},{"start":3664,"end":3714}]}]},"review_notes":[{"text":"The presentation calls the EZ:RPE metric a ratio, but its sham-eye quartile slide labels the horizontal scale a baseline EZ:RPE difference in mm². This internal definition/units inconsistency is unresolved; numerical quartile cutoffs are deliberately not reproduced. Clinical use would require a confirmed metric definition and independent validation.","evidence":[{"start":3620,"end":3621},{"start":3628,"end":3664}]},{"text":"Slide review checked the treatment schedules, imaging-subset denominators, nominal p values and distinction between EZ thickness (µm) and EZ-loss area (mm²). The talk rounds the abstract’s 43.6% and 77.8% estimates to 44% and 78%. The abstract also includes GALE and OCT-F inferred sensitivity results that are not presented in this recorded chapter; those are not imported as recorded findings.","evidence":[{"start":3482,"end":3483},{"start":3525,"end":3526},{"start":3550,"end":3551},{"start":3660,"end":3661}]},{"text":"Original paraphrase based on the complete local transcript, targeted slide inspection and comparison with the official abstract. Not a full manual audio audit or independent clinical or regulatory validation.","evidence":[{"start":3371,"end":3737}]}],"basis":"new"},{"inventory_index":38,"presentation_id":"talk-564004","official_presentation_id":"564004","title":"OCTA nomenclature and minimum reporting standards","type":"talk","speaker":"Roy Schwartz","session_title":"Optimisation of acquisition and interpretation of optical coherence tomography angiography in neovascular AMD","scheduled_time":"17:02 - 17:10","status":"pending","session_id":"95060","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026 ,"scheduled_time":"09:54 - 10:00","status":"ready","session_id":"95615","start_seconds":3715,"end_seconds":4136.301333,"speaker":"David Eichenbaum","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","summary_ref":{"session_id":"95615","start_seconds":3715},"basis":"reused"},{"inventory_index":45,"presentation_id":"starred-45","official_presentation_id":"564074","title":"Artificial intelligence for identifying structure-function relationships in retinal diseases","type":"talk","session_title":"Microperimetry in Retinal Diseases: Diagnostic Role, Clinical Utility, and Future as a Regulatory Endpoint","scheduled_time":"09:45 - 09:52","status":"ready","session_id":"95078","start_seconds":2704,"end_seconds":3239,"speaker":"Gregor Reiter","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","summary_ref":{"session_id":"95078","start_seconds":2704},"basis":"reused"},{"inventory_index":46,"presentation_id":"talk-565012","official_presentation_id":"565012","title":"The Next Frontier: Future Needs for AI in GA Management","type":"talk","speaker":"Omer Trivizki","session_title":"AI in Clinical Practice: A Practical Patient-Centered Roadmap for Geographic Atrophy Management","scheduled_time":"12:00 - 12:06","status":"pending","session_id":"95287","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":1946,"end_seconds":3008.234667},{"inventory_index":47,"presentation_id":"talk-565590","official_presentation_id":"565590","title":"Functional assessments in nonneovascular AMD","type":"talk","speaker":"Usha Chakravarthy","session_title":"Euretina Session 10 - Non Neovascular Macular Degeneration","scheduled_time":"11:39 - 11:48","status":"ready","session_id":"95412","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":763,"end_seconds":1464,"source_url_kind":"official programme","summary":{"overview":[{"text":"Chakravarthy reviews why functional testing remains difficult across nonneovascular AMD: a test that separates disease stages may still be too noisy or insensitive to demonstrate a treatment effect over a typical trial. She links MACUSTAR findings with retrospective analyses of geographic-atrophy trials.","evidence":[{"start":773,"end":927},{"start":1090,"end":1127}]}],"key_findings":[{"title":"Early-stage discrimination remains limited","text":"Chart-based tests distinguished intermediate from late AMD more successfully than early from intermediate AMD. On the displayed MACUSTAR ROC plots, dark adaptation and mesopic/scotopic microperimetry separated intermediate AMD from controls only modestly (AUC 0.68–0.71); separation from early AMD was near chance (0.50–0.55).","evidence":[{"start":859,"end":927},{"start":1025,"end":1090}]},{"title":"GA enlargement and acuity change correlate weakly","text":"The CHROMA/SPECTRI slide reports correlations between GA growth and best-corrected visual-acuity change of −0.05 at week 24 to −0.17 at week 96. Chakravarthy argues that shallow average changes in chart-based function, relative to test–retest variability, make a functional treatment difference difficult to detect in heterogeneous GA populations.","evidence":[{"start":1188,"end":1256}]},{"title":"Lesion phenotype could improve trial selection","text":"A retrospective subgroup analysis showed clearer separation of acuity trajectories by growth rate in subfoveal, unifocal lesions. She proposes that selecting eyes at higher risk of vision loss could make a functional effect of slowing GA easier to detect; this is a trial-design hypothesis, not a demonstrated treatment benefit.","evidence":[{"start":1257,"end":1314}]},{"title":"A targeted microperimetry approach","text":"In discussion, she favours microperimetry as a primary functional assessment while anchoring interpretation to BCVA. Dense testing of the foveal territory and consideration of lesion occupancy are proposed to improve sensitivity compared with sparse standard sampling.","evidence":[{"start":1356,"end":1439}]}],"limitations":[{"text":"Dark adaptation and microperimetry require time, equipment and expertise. The evidence combines cross-sectional discrimination, retrospective trial analyses and proposed refinements; it does not establish that targeted microperimetry is a validated treatment-responsive endpoint or that a structural treatment effect guarantees functional benefit.","evidence":[{"start":1025,"end":1090},{"start":1314,"end":1348},{"start":1363,"end":1439}]}]},"review_notes":[{"text":"The ROC slide’s caption overstates early-stage separation; the plotted comparisons and spoken interpretation support the more cautious account above. The CHROMA/SPECTRI graphs show weeks 24–96, although the automated transcript renders a “48-month” visit. Correlations are taken from the graphs; the variance calculation in the transcript is not repeated.","evidence":[{"start":1045,"end":1046},{"start":1075,"end":1090},{"start":1195,"end":1209}]},{"text":"The repeatability slide labels a 13-letter threshold as low-luminance deficit (LLD), which should not be conflated with low-luminance visual acuity (LLVA). No talk-specific official abstract was available in the inspected programme.","evidence":[{"start":1255,"end":1256}]},{"text":"Original summary based on the complete local ASR transcript and targeted slide inspection; not a full manual audio audit or independent clinical validation. Chapter-end host remarks introduce the next speaker.","evidence":[{"start":763,"end":1464}]}],"basis":"new"},{"inventory_index":48,"presentation_id":"talk-565591","official_presentation_id":"565591","title":"Intermediate AMD: clinical trial endpoints and study designs","type":"talk","speaker":"Adnan Tufail","session_title":"Euretina Session 10 - Non Neovascular Macular Degeneration","scheduled_time":"11:48 - 11:57","status":"ready","session_id":"95412","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":2392,"end_seconds":2979,"source_url_kind":"official programme","summary":{"overview":[{"text":"Tufail examines how to test treatments before geographic atrophy develops, when progression and functional change can be slow. Drawing on MACUSTAR, he argues that useful intermediate-AMD endpoints must combine reliable measurement, prediction of meaningful visual loss and a credible route to regulatory and payer acceptance.","evidence":[{"start":2392,"end":2434},{"start":2487,"end":2554},{"start":2878,"end":2909}]}],"key_findings":[{"title":"A plausible marker is not a validated surrogate","text":"The presentation distinguishes biological plausibility, natural-history associations with future functional loss, and the stronger requirement that treatment effects on a marker predict treatment effects on vision. Tufail describes a circular challenge: robust trial-level validation needs effective treatments, while developing those treatments requires usable endpoints.","evidence":[{"start":2603,"end":2639}]},{"title":"Time-to-event and continuous change answer different questions","text":"Event analyses measure crossing a prespecified structural or functional threshold; trend analyses model continuous change, such as microperimetry sensitivity or ellipsoid-zone loss. Events are easier to interpret but can require long, large studies; trends use more observations and may be efficient in early-phase trials when measurement noise is low. He proposes combining these approaches rather than relying on one alone.","evidence":[{"start":2639,"end":2695}]},{"title":"Earlier OCT endpoints need a functional anchor","text":"Nascent GA, incomplete/complete RPE and outer retinal atrophy (iRORA/cRORA), and persistent hypertransmission defects can identify change before conventional GA endpoints. Earlier detection may shorten time to an event, but Tufail stresses that prediction of meaningful functional loss and endpoint validation remain unresolved. MACUSTAR also explores functional subphenotypes missed by colour-photograph-based staging.","evidence":[{"start":2724,"end":2806},{"start":2851,"end":2879}]},{"title":"Measurement noise can dominate sample size","text":"His illustrative power calculations show how design assumptions change recruitment needs. For a microperimetry slope endpoint targeting 30% slowing at 80% power, reducing the assumed between-person slope SD from 2.13 to 1.0 dB/year lowers the displayed total from 1,986 to 462 participants. Bilateral enrolment and risk enrichment are other options, while shorter follow-up can require more participants.","evidence":[{"start":2925,"end":2959},{"start":2944,"end":2945}]}],"limitations":[{"text":"The sample sizes are model-based design illustrations, not prescriptions for a particular trial. Risk enrichment can change the biological mix and potentially the response to treatment. Reading-centre or AI-derived structural measurements also need reproducibility and validation; statistical detectability alone does not establish patient benefit or health-economic value.","evidence":[{"start":2822,"end":2851},{"start":2878,"end":2909},{"start":2933,"end":2959}]}]},"review_notes":[{"text":"The surrogate-endpoint slide explicitly treats intermediate-AMD markers as candidates. Regulatory statements are retained as the speaker’s framework rather than independently verified qualification or approval claims. The proposed ≥7 dB loss at ≥5 microperimetry loci is an example threshold, not presented here as universally validated.","evidence":[{"start":2614,"end":2615},{"start":2644,"end":2645},{"start":2798,"end":2806},{"start":2910,"end":2925}]},{"text":"MACUSTAR, iRORA, cRORA and hypertransmission terminology and the sample-size assumptions were checked on slides. No talk-specific official abstract was available. Original summary uses the complete local ASR transcript and selected frames; it is not a full manual audio audit or independent clinical validation.","evidence":[{"start":2392,"end":2979}]}],"basis":"new"},{"inventory_index":49,"presentation_id":"talk-565593","official_presentation_id":"565593","title":"What’s in the treatment pipeline for dry AMD?","type":"talk","speaker":"Jordi Monés","session_title":"Euretina Session 10 - Non Neovascular Macular Degeneration","scheduled_time":"12:06 - 12:15","status":"ready","session_id":"95412","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":2979,"end_seconds":3595,"source_url_kind":"official programme","summary":{"overview":[{"text":"Monés surveys investigational approaches to dry AMD and geographic atrophy, spanning neuroprotection, amyloid and retinoid biology, RPE-cell replacement, immune modulation, lipid regulation and optogenetics. He presents a selective pipeline snapshot, including promising early signals and recent failures rather than a comprehensive or head-to-head treatment comparison.","evidence":[{"start":2979,"end":3049}]}],"key_findings":[{"title":"Photoreceptor protection and alternative drug targets","text":"Elamipretide’s phase 2 primary endpoint was not met, but an ellipsoid-zone preservation signal supported the phase 3 ReNEW programme described here. Other examples include the Fas-pathway inhibitor ONL-1204, topical GAL-101 targeting amyloid-beta oligomers, and oral tinlarebant targeting retinol transport. Tinlarebant’s cited efficacy signal came from Stargardt disease; its GA trial addresses a separate question.","evidence":[{"start":3052,"end":3101},{"start":3118,"end":3198}]},{"title":"Cell-replacement evidence remains early","text":"OpRegen, CPCB-RPE1, ASP7317 and RPESC-RPE-4W represent different subretinal RPE-cell approaches, including suspensions, a scaffold-mounted monolayer and adult-donor-derived cells. Reported visual or anatomical improvements arose from small, early cohorts; delivery coverage, dose escalation and retinal-sensitivity outcomes remain active study questions.","evidence":[{"start":3198,"end":3319}]},{"title":"Complement programmes pursue different outcomes","text":"For ANX007, the phase 2 GA-growth primary endpoint was not met, while a functional preservation signal motivated a phase 3 vision-loss endpoint. Systemic approaches include pozelimab plus cemdisiran and ADX-038, whose supporting pharmacology should not be mistaken for established GA efficacy. Oral iptacopan is presented as an earlier-stage programme for high-risk early/intermediate AMD.","evidence":[{"start":3319,"end":3446}]},{"title":"An inflammasome signal needs larger controlled testing","text":"For the sustained-release intravitreal implant kamuvudine-8 (K8), Monés reports a phase 2 growth-slowing signal and a planned pivotal programme. The slide specifies only 30 participants across doses and a six-month comparison using untreated fellow eyes, so the large apparent effect should be treated as preliminary.","evidence":[{"start":3446,"end":3469},{"start":3456,"end":3457}]},{"title":"Gene therapy and optogenetics are distinct strategies","text":"OCU410 is described as a subretinal gene-regulation approach addressing lipid, oxidative and inflammatory pathways, with phase 3 development following an early lesion-growth signal. The bipolar-cell optogenetic programme is presented as a future GA study; its cited functional observations came from retinitis pigmentosa and Stargardt disease, not a completed GA efficacy trial.","evidence":[{"start":3514,"end":3578}]},{"title":"Early signals and target engagement do not guarantee success","text":"The presentation reports stopped GA programmes for IONIS-FB-LRx, JNJ-1887/HMR59 and AVD-104. IONIS showed systemic factor-B suppression without meeting its GA endpoint; AVD-104 did not show a statistically significant GA-growth advantage over its active comparator. These examples temper interpretation of promising early-stage findings.","evidence":[{"start":3469,"end":3514}]}],"limitations":[{"text":"The programmes differ in disease stage, route, comparator, follow-up and endpoint. Small cohorts, fellow-eye comparisons, secondary outcomes and evidence borrowed from other retinal diseases cannot establish comparable GA efficacy, durable visual restoration or an approved treatment indication. Development stages and future dates are reported as presented at the congress, without independent registry or regulatory verification.","evidence":[{"start":3023,"end":3049},{"start":3171,"end":3198},{"start":3198,"end":3319},{"start":3446,"end":3469},{"start":3540,"end":3578}]}]},"review_notes":[{"text":"Source qualifications retained: the risuteganib slide compares treated week-28 responses with sham week-12 responses, and lists a planned pivotal programme while the speaker says no further news. The tinlarebant slide says enrolment complete while the transcript says enrolling. No definitive recruitment status or matched-time risuteganib effect is inferred.","evidence":[{"start":3101,"end":3118},{"start":3171,"end":3198}]},{"text":"The OCU410 slide gives 31% GA reduction in a bullet and 34% for a medium-dose comparison in its graphic; the summary avoids collapsing these into a single effect estimate. Drug and study names were checked on slides because the ASR frequently misrenders them.","evidence":[{"start":3531,"end":3540}]},{"text":"No talk-specific official abstract was available. Original summary uses the complete local ASR transcript plus contact sheets and targeted slide inspection; it is not a full manual audio audit or independent clinical validation.","evidence":[{"start":2979,"end":3595}]}],"basis":"new"},{"inventory_index":50,"presentation_id":"talk-564840","official_presentation_id":"564840","title":"OCT Biomarkers in Geographic Atrophy","type":"talk","speaker":"Katherine Talcott","session_title":"ASRS - The Best of the American Society of Retina Specialists (ASRS)","scheduled_time":"15:58 - 16:05","status":"pending","session_id":"95250","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":2447,"end_seconds":2978},{"inventory_index":51,"presentation_id":"talk-566748","official_presentation_id":"566748","title":"Geographic atrophy growth rates show modest and variable correlations between the two eyes of an individual in the Age-Related Eye Disease Study 2","type":"talk","speaker":"Usha Chakravarthy","session_title":"Free Paper 39 - AMD/CSC","scheduled_time":"17:03 - 17:09","status":"pending","session_id":"95619","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":1280,"end_seconds":1691},{"inventory_index":52,"presentation_id":"starred-52","official_presentation_id":"564489","title":"Dark Adaptation Across Diseases: Protocols, Pitfalls, and Promise","type":"talk","session_title":"From Structure to Function Course","scheduled_time":"09:00 - 09:00","status":"ready","session_id":"95185","start_seconds":2440,"end_seconds":2956,"speaker":"Marion R. Munk","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/ https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","summary_ref":{"session_id":"95623","start_seconds":18},"basis":"reused"},{"inventory_index":56,"presentation_id":"starred-56","official_presentation_id":"569799","title":"Repeatability and Test–Retest Characteristics of Personalized Microperimetry Endpoints in Non-Foveal Geographic Atrophy: Findings from Baseline Triplicate Testing in the eDREAM Trial","type":"talk","session_title":"Free Paper 42 - AMD/CSC","scheduled_time":"10:33 - 10:39","status":"ready","session_id":"95623","start_seconds":1036,"end_seconds":1391,"speaker":"Yaniv Barkana","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","summary_ref":{"session_id":"95623","start_seconds":1036},"basis":"reused"},{"inventory_index":57,"presentation_id":"starred-57","official_presentation_id":"566348","title":"Baseline Characteristics of Participants in ARCHER II: A Phase 3 Study of Vision Protection of Vonaprument, a C1q inhibitor, in Dry AMD with GA","type":"talk","session_title":"Free Paper 42 - AMD/CSC","scheduled_time":"10:57 - 11:03","status":"ready","session_id":"95623","start_seconds":2546,"end_seconds":2865,"speaker":"Roberto Gallego-Pinazo","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","summary_ref":{"session_id":"95623","start_seconds":2546},"basis":"reused"},{"inventory_index":58,"presentation_id":"starred-58","official_presentation_id":"567908","title":"Choriocapillaris flow deficit as a marker on early AMD","type":"talk","session_title":"Choroidal Circulation: Anatomy, Imaging, Clinical Applications, and Management Strategies","scheduled_time":"10:39 - 10:47","status":"ready","session_id":"95261","start_seconds":1161,"end_seconds":1916,"speaker":"Christine Curcio","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-01\u0026is_on_demand=1\u0026is_sponsored=-1\u0026segment=programme\u0026myprog=1\u0026sort=starts_at","summary_ref":{"session_id":"95261","start_seconds":1161},"basis":"reused"},{"inventory_index":59,"presentation_id":"talk-563796","official_presentation_id":"563796","title":"Update on EVICR.net Activities - the Eye Platform","type":"talk","speaker":"Daniel Sanches Fernandes","session_title":"EVICR.net – European Vision Clinical Research Network","scheduled_time":"10:15 - 10:21","status":"ready","session_id":"95018","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":103,"end_seconds":494,"source_url_kind":"official personal programme","summary":{"overview":[{"text":"Fernandes describes EVICR.net as a coordinating network for investigator-initiated multinational ophthalmic research. The Eye Platform extends that role by supporting secondary analysis of existing clinical-study data, with imaging as its main component.","evidence":[{"start":120,"end":176},{"start":277,"end":324}]}],"key_findings":[{"title":"A defined route for data reuse","text":"Clinical sites contribute data described as anonymised; academic, clinical and industry researchers can request access for a specific study or analysis. Registration provides a catalogue overview and a request route. The initiative is presented as long-term and non-exclusive.","evidence":[{"start":277,"end":345}]},{"title":"INTERCEPT-AMD is the initial resource","text":"At the time of the talk, INTERCEPT-AMD was the platform’s only dataset. The displayed overview lists 819 patients from 26 sites in eight countries, with imaging, visit-level visual-acuity records and demographic information. Availability varies by modality and visit; these repository counts should not be confused with the eligible analysis population in a particular report.","evidence":[{"start":343,"end":400}]},{"title":"Research support beyond the repository","text":"The network offers coordination for multinational observational and non-interventional studies, phase 4 research, natural-history studies, registries and surveys. Fernandes encourages both new studies and reuse of existing data rather than duplicated collection.","evidence":[{"start":403,"end":434}]}],"limitations":[{"text":"This is a research-infrastructure update, not a study-outcome report. Access requires a request, and the talk does not provide a complete data-use, approval or governance specification. Claims about anonymisation and platform capabilities are the presenter’s description, not an independent technical audit.","evidence":[{"start":277,"end":350}]}]},"review_notes":[{"text":"EVICR.net, Eye Platform and INTERCEPT-AMD spellings and the displayed repository counts were checked on slides. Repository availability is distinct from the eligible analytic cohort of a specific study report.","evidence":[{"start":253,"end":254},{"start":343,"end":344},{"start":388,"end":389}]},{"text":"Original summary based on the complete local transcript and targeted slide inspection.","evidence":[{"start":103,"end":494}]}],"basis":"new"},{"inventory_index":60,"presentation_id":"talk-563797","official_presentation_id":"563797","title":"INTERCEPT-AMD – An imaging study of Intermediate AMD","type":"talk","speaker":"Sobha Sivaprasad","session_title":"EVICR.net – European Vision Clinical Research Network","scheduled_time":"10:21 - 10:27","status":"ready","session_id":"95018","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":494,"end_seconds":1085,"source_url_kind":"official personal programme","summary":{"overview":[{"text":"Sivaprasad integrates three INTERCEPT-AMD reports on OCT phenotype, two-year visual acuity and progression to late AMD. The European observational analysis included 983 intermediate-AMD eyes from 805 participants, using routine best-recorded visual acuity (BRVA) rather than uniformly protocol-measured BCVA and accounting for participants contributing both eyes.","evidence":[{"start":510,"end":678}]}],"key_findings":[{"title":"Good baseline acuity makes improvement endpoints difficult","text":"Median baseline acuity was 80 ETDRS letters; 66.4% of eyes had ≥80 and 92.8% had ≥70 letters. This leaves limited room for acuity gain despite substantial OCT heterogeneity. The reports stratified eyes by incomplete RPE and outer retinal atrophy (iRORA) and subretinal drusenoid deposits (SDD); age and fellow-eye disease also affected interpretation.","evidence":[{"start":678,"end":788}]},{"title":"A small mean change hides a minority with substantial loss","text":"Model-estimated BRVA decline was 2.16 letters over 24 months. Among 935 eyes with baseline and two-year acuity data, 13.3% lost ≥10 letters and 6.2% lost ≥15. Sivaprasad argues that acuity alone therefore creates difficult sample-size and duration requirements for prevention trials.","evidence":[{"start":789,"end":858}]},{"title":"Structural progression and acuity loss are different outcomes","text":"Model-based cumulative incidence at 24 months was 13.1% for late AMD: 7.6% neovascular AMD and 5.5% cRORA. These are model estimates, not raw observed proportions. Fellow-eye neovascular AMD and baseline iRORA were associated with greater late-AMD hazard (adjusted HRs 3.23 and 1.50, respectively). Eyes transitioning to neovascular AMD had the largest mean BRVA loss, about six letters.","evidence":[{"start":881,"end":939}]},{"title":"Use complementary endpoints and careful enrichment","text":"She recommends stratification by acuity, age, OCT phenotype and fellow-eye status, consideration of distinct neovascular and atrophic outcomes, and additional spatial, low-light and reading-function measures alongside OCT biomarkers.","evidence":[{"start":959,"end":988}]}],"limitations":[{"text":"Retrospective components, heterogeneous routine acuity testing, regression to the mean and treatment after neovascular conversion complicate interpretation. Baseline associations with attained acuity should not be mistaken for predictors of subsequent decline. Proposed endpoint strategies are not evidence of treatment benefit or blanket regulatory requirements.","evidence":[{"start":625,"end":638},{"start":662,"end":678},{"start":849,"end":881},{"start":934,"end":935},{"start":989,"end":998}]}]},"review_notes":[{"text":"Slide checks verified denominators, the median baseline statistic and model-based incidence. The displayed 3.30 estimate concerns odds of baseline iRORA with fellow-eye GA, not risk of acuity loss; it was not used as the latter despite ambiguous narration. The late-AMD model labels 1.50 as an adjusted hazard ratio, not an odds ratio.","evidence":[{"start":644,"end":645},{"start":689,"end":690},{"start":779,"end":780},{"start":795,"end":796},{"start":824,"end":825},{"start":891,"end":892},{"start":914,"end":915}]},{"text":"Original summary based on the complete local transcript and targeted slide inspection; not a full manual audio audit or independent clinical or regulatory validation.","evidence":[{"start":494,"end":1085}]}],"basis":"new"},{"inventory_index":61,"presentation_id":"talk-563799","official_presentation_id":"563799","title":"Update on Age-Related Macular Degeneration EVICR.net clinical studies","type":"talk","speaker":"Francesco Bandello","session_title":"EVICR.net – European Vision Clinical Research Network","scheduled_time":"10:33 - 10:39","status":"ready","session_id":"95018","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":1391,"end_seconds":1728,"source_url_kind":"official personal programme","summary":{"overview":[{"text":"Bandello outlines the EVICR.net AMD research pipeline, concentrating on proposals under discussion rather than repeating the ongoing studies presented earlier in the session. The update sets out observational research questions and a prospective registry; it does not report new treatment-effect results.","evidence":[{"start":1460,"end":1482},{"start":1482,"end":1673}]}],"key_findings":[{"title":"Reanalyse existing images for atrophic and choroidal change","text":"Rufino Silva proposes a new analysis of INTERCEPT-AMD data, using algorithms to evaluate progression to geographic atrophy and choroidal change over two years. These are planned analyses, with no performance estimates or progression results presented.","evidence":[{"start":1482,"end":1523}]},{"title":"Describe distinct phenotypes and their course","text":"Alessandro Arrigo’s proposed multicentre observational studies include EU-ARPED, on the epidemiology and clinical features of age-related retinal pigment epithelium disease; Double-GA, on geographic-atrophy characteristics and course in eyes with different double-layer signs; and EU-EMAP, on extensive macular atrophy with pseudodrusen-like appearance. The presentation treats these as separate research questions.","evidence":[{"start":1496,"end":1497},{"start":1541,"end":1601}]},{"title":"Build epidemiological and practice-use evidence","text":"Other proposals are EuRVO, a European multicentre retinal-vein-occlusion study listed as submitted to industry, and a survey of nutraceutical use. Bandello frames these as attempts to address gaps in epidemiological information and current usage patterns.","evidence":[{"start":1600,"end":1641}]},{"title":"A prospective photobiomodulation registry","text":"N. Beare’s proposed registry would follow photobiomodulation in intermediate AMD. Bandello describes continuing debate about its role and hopes the registry will provide further information; no efficacy or safety findings from that registry are given.","evidence":[{"start":1631,"end":1632},{"start":1641,"end":1673}]}],"limitations":[{"text":"The slides explicitly label these projects as studies under discussion. Final protocols, recruitment, sample sizes and results are not supplied. Statements about gaps in retinal-vein-occlusion epidemiology and reliance on AREDS for nutraceutical data reflect the presenter’s rationale, rather than a systematic review establishing that no other evidence exists.","evidence":[{"start":1482,"end":1673}]}]},"review_notes":[{"text":"Study names, observational designs, the two-year imaging-analysis horizon, EuRVO’s submitted-to-industry status and the prospective registry description were checked against the slides. The official programme supplied no talk-specific abstract, so there was no abstract comparison.","evidence":[{"start":1496,"end":1497},{"start":1586,"end":1587},{"start":1631,"end":1632}]},{"text":"Original summary based on the complete local transcript and targeted slide inspection. The opening tribute and the subsequent introduction of the next speaker were excluded from the scientific findings; this was not a full manual audio audit or independent clinical validation.","evidence":[{"start":1391,"end":1728}]}],"basis":"new"},{"inventory_index":62,"presentation_id":"talk-563800","official_presentation_id":"563800","title":"MACUSTAR – A Multicenter, prospective, European clinical study: update","type":"talk","speaker":"Jan Henrik Terheyden","session_title":"EVICR.net – European Vision Clinical Research Network","scheduled_time":"10:39 - 10:45","status":"ready","session_id":"95018","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":1728,"end_seconds":2191,"source_url_kind":"official personal programme","summary":{"overview":[{"text":"Terheyden updates MACUSTAR’s prospective European work on intermediate-AMD endpoints and trial enrichment. He reports a completed six-year data cut whose results were not yet publicly available, and an extension to eight years of follow-up. This presentation concentrates on existing analyses that could help select higher-risk participants for feasible prevention trials.","evidence":[{"start":1736,"end":1793},{"start":1818,"end":1842}]}],"key_findings":[{"title":"Combine structural information without treating modalities as interchangeable","text":"The structural analysis compares OCT hyperreflective foci (HRF) with pigmentary abnormalities on colour fundus photography. The displayed Venn diagram places 33.0% of the analysed cohort in both groups and 63.6% in either or both. Their incomplete overlap supports considering complementary markers when designing enrichment strategies.","evidence":[{"start":1922,"end":1968}]},{"title":"Functional change is measurable before late-AMD conversion","text":"Low-luminance visual acuity (LLVA) was the strongest performer among the displayed global functional measures for crossing the worsening test–retest threshold. With a limit of 0.18 logMAR, the proportions exceeding it were 8.7% at 12 months, 17.1% at 24 months and 22.2% at 36 months. This is change beyond measured repeatability, not proof that the threshold is a validated treatment endpoint. Terheyden notes that targeted microperimetry may be more informative than a global average.","evidence":[{"start":1968,"end":2007}]},{"title":"Slow average loss can coexist with worsening around conversion","text":"The displayed acuity analysis indicates roughly one ETDRS letter of decline per year and approximately three letters of additional BCVA loss around conversion to late AMD. The talk uses this to argue that functional information belongs alongside structural risk markers, rather than waiting for late-stage disease alone to signal change.","evidence":[{"start":2006,"end":2025}]},{"title":"An illustrative enrichment strategy reduces modelled trial size","text":"In an exploratory analysis using imputed data, all 548 participants contributed 84 late-AMD events, an incidence of 5.5 per 100 person-years. Restricting to BCVA worse than 0.1 logMAR together with HRF selected 69 participants with 24 events and an incidence of 16.1 per 100 person-years. Under an assumed treatment hazard ratio of 0.70, the displayed calculation reduced required sample size per group for a 24-month trial from 657 to 245. These are sample-size projections under a hypothetical effect, not an observed treatment benefit.","evidence":[{"start":2028,"end":2063}]},{"title":"Higher event rates bring a screening trade-off","text":"Rarer high-risk marker combinations can reduce the number enrolled but increase prescreening work. More prevalent criteria may be easier to recruit yet require larger trial cohorts. Terheyden identifies no single best combination and recommends weighing structure, function, age and multicentre implementation together.","evidence":[{"start":2062,"end":2134},{"start":2148,"end":2149}]},{"title":"Regulatory discussions remain ongoing","text":"Terheyden reports that EMA discussions to date favoured time-to-event trials using progression to late AMD, while rate-of-change approaches remained under consideration. He describes the last interaction as occurring in 2024 and a further discussion based on six-year data as planned for the following year. This is the presenter’s account of the dialogue, not a binding regulatory requirement or endpoint approval.","evidence":[{"start":1857,"end":1883},{"start":2133,"end":2145}]}],"limitations":[{"text":"The risk relationships are observational, and the enrichment calculations use imputed data and an assumed intervention effect. They do not establish treatment efficacy or a prospectively validated eligibility rule. Six-year GA-specific and neovascular-AMD-specific prognostic analyses were described as forthcoming rather than reported results.","evidence":[{"start":1883,"end":1922},{"start":2028,"end":2063}]},{"text":"Functional threshold-crossing percentages are specific to the tests, thresholds and follow-up shown. They should not be treated as equivalent to patient-important benefit or as independent replication of the same MACUSTAR results presented elsewhere in the programme.","evidence":[{"start":1968,"end":2025}]}]},"review_notes":[{"text":"Material source discrepancy: narration describes approximately 63% “overlap” between pigmentary changes and HRF, but the slide labels 63.6% as HRF and/or pigmentary abnormalities; the intersection is 33.0%. The summary uses the explicit diagram definitions rather than the ambiguous spoken description.","evidence":[{"start":1923,"end":1924},{"start":1937,"end":1950}]},{"text":"Slide checks verified LLVA thresholds and percentages, the approximate acuity changes, and the imputed-data enrichment table. The unlabeled final column of the acuity-change table was not interpreted. Cohort quantities from different analyses were kept separate. The official programme supplied no talk-specific abstract for comparison.","evidence":[{"start":1968,"end":1969},{"start":2013,"end":2014},{"start":2058,"end":2059}]},{"text":"Original summary based on the complete local transcript and targeted slide inspection; not a full manual audio audit or independent clinical or regulatory validation. The chair’s introduction of the subsequent speaker was excluded.","evidence":[{"start":1728,"end":2191}]}],"basis":"new"},{"inventory_index":63,"presentation_id":"talk-566337","official_presentation_id":"566337","title":"Lesion-centered functional trajectories reveal early retinal sensitivity decline in intermediate AMD","type":"talk","speaker":"Stefan Futterknecht","session_title":"Free Paper 44 - AMD/CSC","scheduled_time":"11:30 - 11:36","status":"ready","session_id":"95625","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":36,"end_seconds":417,"source_url_kind":"official personal programme","summary":{"overview":[{"text":"Futterknecht uses the observational PINNACLE cohort to align retinal-sensitivity trajectories with newly detected OCT lesions in intermediate AMD. Routine 24-point microperimetry was supplemented by a lesion-centred five-point grid after a focal event; the slides report 338 events in 264 participants.","evidence":[{"start":59,"end":124}]}],"key_findings":[{"title":"EZ/IZ loss has a different functional trajectory","text":"At sites developing ellipsoid/interdigitation-zone (EZ/IZ) loss with hypertransmission, modelled sensitivity declined before OCT detection: −0.57 dB/year before detection, −1.11 dB/year during the first six months and −0.94 dB/year thereafter. Matched control sites and drusen-collapse locations were comparatively stable; subretinal-fluid sites showed decline with potential recovery.","evidence":[{"start":185,"end":244}]},{"title":"A single threshold crossing can be noise","text":"Within two years, the slides report ≥7 dB loss at 12.2% of foveal points and 45.0% of EZ/IZ-loss lesions. However, the standard-grid pointwise coefficient of repeatability was 7.61 dB, so an isolated 7 dB change need not represent true progression.","evidence":[{"start":125,"end":185}]},{"title":"Proposed trial design","text":"He recommends fovea-enriched sampling combined with targeted testing at newly detected EZ/IZ-loss lesions. Confirmed incident relative scotoma (\u003c10 dB) and model-based longitudinal sensitivity change are proposed to improve progression detection and potentially reduce trial size.","evidence":[{"start":244,"end":295}]}],"limitations":[{"text":"These are observational, model-derived trajectories and trial-design proposals, not validation of a treatment-responsive or regulator-accepted endpoint. Subretinal-fluid events were few (13). In discussion, Futterknecht notes that greater baseline foveal sensitivity offers more scope for absolute decline; subretinal drusenoid deposits were not addressed in this analysis.","evidence":[{"start":90,"end":91},{"start":334,"end":389}]}]},"review_notes":[{"text":"PINNACLE, event counts, trajectory slopes and repeatability were checked on slides. The methods slide gives 264 participants, while the automated transcript renders 246; the summary uses the displayed count. Earlier lesion-centre values are model-based estimates, not retrospectively measured targeted-grid data.","evidence":[{"start":90,"end":91},{"start":170,"end":171},{"start":210,"end":211}]},{"text":"Original summary based on the complete local transcript and targeted slide inspection; not a full manual audio audit or independent clinical validation.","evidence":[{"start":36,"end":417}]}],"basis":"new"},{"inventory_index":64,"presentation_id":"talk-566344","official_presentation_id":"566344","title":"Longitudinal Visual Function Decline in Intermediate Age-Related Macular Degeneration (iAMD): A MACUSTAR Report","type":"talk","speaker":"Hannah Dunbar","session_title":"Free Paper 44 - AMD/CSC","scheduled_time":"11:36 - 11:42","status":"ready","session_id":"95625","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":417,"end_seconds":813,"source_url_kind":"official personal programme","summary":{"overview":[{"text":"Dunbar reports the three-year MACUSTAR visual-function analysis in 585 participants with intermediate AMD, assessed every six months. Eighty-four progressed to late AMD (46 neovascular AMD and 38 geographic atrophy). The study asks whether measurable functional decline occurs before, and independently of, structural progression.","evidence":[{"start":443,"end":497}]}],"key_findings":[{"title":"Statistical change can still be too slow for an all-comer trial","text":"Age-, sex- and lens-status-adjusted models showed annual losses of about one BCVA letter, 1.5 low-luminance visual-acuity (LLVA) letters, 0.52 dB mesopic sensitivity and 0.54 dB scotopic sensitivity. Rod-intercept time did not change significantly. Small declines persisted after excluding progressors, leading Dunbar to question these average slopes as practical endpoints in broadly recruited intermediate-AMD trials.","evidence":[{"start":529,"end":586}]},{"title":"LLVA detects an accumulating subgroup with change beyond repeatability","text":"Using study-specific test–retest limits, the proportion whose LLVA worsened beyond 0.18 logMAR was 8.7% at one year, 17.1% at two years and 22.2% at three years. This identifies change exceeding measurement variability, rather than establishing that every such change has the same clinical importance.","evidence":[{"start":587,"end":634}]},{"title":"Function differs before the late-AMD event","text":"At the visit before progression, progressors were already worse than three-year nonprogressors by 6.5 LLVA letters, 2.5 dB mesopic sensitivity and 2.9 dB scotopic sensitivity. The corresponding gaps at progression were larger. These are descriptive between-group differences, supporting further study of low-light function and faster-declining phenotypes.","evidence":[{"start":639,"end":748}]}],"limitations":[{"text":"The progression analysis was not powered for detailed subgroup conclusions. GA and neovascular events were pooled, and foveal involvement was not separated in the presented analysis. Larger six-year analyses were planned; the findings do not yet establish a predictive threshold or a qualified treatment endpoint.","evidence":[{"start":698,"end":748},{"start":756,"end":788}]}]},"review_notes":[{"text":"Cohort counts, test names, annual units, LLVA repeatability proportions and pre-progression group differences were checked on slides. The pre-progression differences must not be interpreted as each patient’s measured loss from baseline.","evidence":[{"start":465,"end":466},{"start":505,"end":506},{"start":545,"end":546},{"start":585,"end":586},{"start":625,"end":626},{"start":665,"end":666},{"start":705,"end":706}]},{"text":"Original summary based on the complete local transcript and targeted slide inspection; not a full manual audio audit or independent clinical validation.","evidence":[{"start":417,"end":813}]}],"basis":"new"},{"inventory_index":65,"presentation_id":"talk-566257","official_presentation_id":"566257","title":"Risk of Progression of Nascent Geographic Atrophy in Intermediate AMD to Geographic Atrophy or Type 3 Macular Neovascularization and Predictive OCT biomarkers","type":"talk","speaker":"Federico Beretta","session_title":"Free Paper 44 - AMD/CSC","scheduled_time":"12:00 - 12:06","status":"ready","session_id":"95625","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":1838,"end_seconds":2248,"source_url_kind":"official personal programme","summary":{"overview":[{"text":"Beretta presents a multicentre tertiary-care cohort examining nascent geographic atrophy (nGA) as a precursor to either geographic atrophy or type 3 macular neovascularization (MNV). Among 1,312 intermediate-AMD eyes assessed, 124 (9.5%) had nGA and were followed for two years.","evidence":[{"start":1896,"end":1936}]}],"key_findings":[{"title":"Nascent atrophy can precede two different late outcomes","text":"Of the 124 nGA eyes, 59 developed GA, 45 developed type 3 MNV and 20 remained at intermediate AMD: 104/124 (83.9%) progressed to a late outcome. Reported time to type 3 MNV was about 13 months, versus 19 months for GA. These are outcomes in the selected nGA cohort, not risks for all intermediate-AMD eyes.","evidence":[{"start":1917,"end":1954},{"start":2165,"end":2182}]},{"title":"Cuticular drusen: an association requiring phenotype context","text":"Cuticular drusen were present in 75.0% of nonprogressors, 28.9% of type 3 MNV progressors and 37.3% of GA progressors (displayed P=0.002). These percentages describe drusen prevalence within outcome groups. Beretta hypothesizes a less aggressive short-term phenotype or greater representation of a lower-risk cuticular-drusen subtype; neither explanation was established.","evidence":[{"start":2019,"end":2088}]},{"title":"Other proposed predictors remain exploratory","text":"Reticular pseudodrusen in the cuticular-drusen subgroup showed a numerical association with earlier progression and type 3 MNV, without statistical significance. Hyperreflective foci were smaller in eyes subsequently developing type 3 MNV, also without a significant difference. The practical message is to watch for both neovascular and atrophic progression.","evidence":[{"start":2088,"end":2165}]}],"limitations":[{"text":"Tertiary-care selection and fellow-eye disease limit generalizability. Images were collected and graded across centres without a central reading centre; the Q\u0026A reports good grader agreement without a numerical reliability estimate. This observational report does not establish a protective effect of cuticular drusen or an individually validated prediction rule.","evidence":[{"start":1974,"end":2009},{"start":2209,"end":2235}]}]},"review_notes":[{"text":"Counts, follow-up and biomarker labels were checked on slides. The outcome slide labels 45/124 as 36.6%, which is arithmetically inconsistent; the summary retains the verified count rather than that percentage. Prior publications shown for context were kept separate from this cohort.","evidence":[{"start":1915,"end":1916},{"start":1930,"end":1931},{"start":1950,"end":1951},{"start":2045,"end":2046},{"start":2110,"end":2111},{"start":2140,"end":2141}]},{"text":"Original summary based on the complete local transcript and targeted slide inspection; not a full manual audio audit or independent clinical validation.","evidence":[{"start":1838,"end":2248}]}],"basis":"new"},{"inventory_index":66,"presentation_id":"talk-566301","official_presentation_id":"566301","title":"Imaging Biomarkers of Disease Progression in Intermediate AMD: Interim Results from the Prospective PROBE-IGA Study","type":"talk","speaker":"Shruti Chandra","session_title":"Free Paper 44 - AMD/CSC","scheduled_time":"12:06 - 12:12","status":"ready","session_id":"95625","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":2248,"end_seconds":2617,"source_url_kind":"official personal programme","summary":{"overview":[{"text":"Chandra presents an interim, single-centre prospective PROBE-IGA analysis of 52 intermediate-AMD eyes from 46 patients completing 12 months. Multimodal imaging and functional testing aim to identify early progression markers while central acuity remains relatively preserved; the wider study targets separate intermediate-AMD and GA cohorts.","evidence":[{"start":2283,"end":2408}]}],"key_findings":[{"title":"Early atrophic change was more frequent than late AMD","text":"Seven eyes developed new incomplete RPE and outer retinal atrophy (iRORA), presented as a 13.5% cumulative one-year incidence. One eye progressed to complete RPE and outer retinal atrophy (cRORA), and none developed exudative neovascular AMD. The cRORA lesion was extrafoveal and was reported not to affect acuity.","evidence":[{"start":2408,"end":2440}]},{"title":"Intraretinal hyperreflective foci are a candidate predictor","text":"Baseline intraretinal hyperreflective foci were associated with incident iRORA (hazard ratio 2.8; 95% CI 1.1–7.3; P=0.03). The wide interval and few events make this an early association requiring confirmation, rather than a precise individual risk estimate.","evidence":[{"start":2430,"end":2475}]},{"title":"Functional correlation is still to come","text":"The planned complete-cohort analysis will add microperimetry and dark-adaptation findings and examine combinations of structural risk markers. The short follow-up was chosen to test whether earlier structural or functional signals could support more efficient trial designs.","evidence":[{"start":2490,"end":2505},{"start":2522,"end":2580}]}],"limitations":[{"text":"This is an interim referral-centre analysis with seven new iRORA events and some participants contributing both eyes; the slide explicitly notes that eyes are not fully independent. It does not establish a treatment effect or show that the imaging change corresponds to important visual loss.","evidence":[{"start":2430,"end":2431},{"start":2490,"end":2505}]},{"text":"The Q\u0026A reports pre-existing, extrafoveal iRORA in 14 of the 52 eyes. The reported 13.5% uses all 52 eyes; the presentation does not explain the risk-set handling for baseline iRORA, so the incidence denominator warrants checking in the full analysis.","evidence":[{"start":2427,"end":2440},{"start":2581,"end":2599}]}]},"review_notes":[{"text":"PROBE-IGA, interim cohort size, new-event counts, hazard ratio and confidence interval were checked against the slides. The baseline-iRORA count comes from the spoken Q\u0026A and is retained with its denominator caveat.","evidence":[{"start":2390,"end":2391},{"start":2430,"end":2431},{"start":2470,"end":2471},{"start":2581,"end":2599}]},{"text":"Original summary based on the complete local transcript and targeted slide inspection; not a full manual audio audit or independent clinical validation.","evidence":[{"start":2248,"end":2617}]}],"basis":"new"},{"inventory_index":67,"presentation_id":"talk-566245","official_presentation_id":"566245","title":"Atrophic Age-Related Macular Degeneration Changes Associated with Deep Visual Sensitivity Losses: Evaluation in Multicenter Reader Studies","type":"talk","speaker":"Robyn Guymer","session_title":"Free Paper 44 - AMD/CSC","scheduled_time":"12:12 - 12:18","status":"ready","session_id":"95625","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":2617,"end_seconds":3088,"source_url_kind":"official personal programme","summary":{"overview":[{"text":"Guymer tests how well imaging-defined atrophy identifies repeatable deep retinal-sensitivity defects (≤10 dB), rather than assuming every atrophic region is non-seeing. The multicentre reader study used 60 eyes from 53 people, repeated high-density targeted microperimetry, and 171 image sets assessed by 12 senior readers from six centres.","evidence":[{"start":2623,"end":2662},{"start":2709,"end":2807}]}],"key_findings":[{"title":"Conventional atrophy definitions do not guarantee deep functional loss","text":"A repeatable ≤10 dB defect was found in 77% of colour-photograph GA lesions requiring visible underlying vessels, 67% without that requirement and 62% of autofluorescence-defined GA lesions. Only 60% of OCT cRORA lesions meeting the ≥250 µm definition had the defect. These are sensitivity thresholds, not losses of 10 dB from baseline.","evidence":[{"start":2830,"end":2882}]},{"title":"Lesion size and combined OCT signs improve functional correspondence","text":"At least 90% of lesions had the repeatable defect only above size thresholds of 625 µm for photograph-defined GA with visible vessels, 650 µm without, and 675 µm for autofluorescence. On OCT, hypertransmission and complete RPE loss both extending ≥500 µm, with overlying photoreceptor degeneration, yielded 92–98% correspondence. Alternative combinations of extensive hypertransmission with ELM disruption or nascent-GA features yielded 92–95%.","evidence":[{"start":2840,"end":2912}]},{"title":"A candidate endpoint grounded in function","text":"Guymer proposes these more functionally specific structural criteria as possible endpoints for end-stage atrophic AMD trials. The aim is an anatomical event associated with marked, reproducible functional loss; it does not require asserting that every point inside the lesion has no residual vision.","evidence":[{"start":2913,"end":2966},{"start":3050,"end":3073}]}],"limitations":[{"text":"The analysis evaluates imaging–function correspondence in selected atrophic regions, not treatment benefit or regulatory endpoint acceptance. Dense-grid alignment and repeatability were questioned in discussion. Guymer emphasizes repeated testing, while acknowledging these measurement issues; residual function within atrophy does not itself prove that a therapy can preserve or restore it.","evidence":[{"start":2733,"end":2807},{"start":2980,"end":3073}]}]},"review_notes":[{"text":"Current-study percentages, size cutoffs and the ≤10 dB criterion were checked on slides. Background figures of 82%/60% belong to earlier work and were not substituted for the multicentre results. The slides resolve a spoken/ASR reversal of the GA1/GA2 vessel labels.","evidence":[{"start":2680,"end":2681},{"start":2760,"end":2761},{"start":2840,"end":2841},{"start":2880,"end":2881}]},{"text":"Original summary based on the complete local transcript and targeted slide inspection; not a full manual audio audit or independent clinical validation.","evidence":[{"start":2617,"end":3088}]}],"basis":"new"},{"inventory_index":68,"presentation_id":"talk-566238","official_presentation_id":"566238","title":"Evaluation of Genes Responsible for the Etiology of Age-Related Macular Degeneration (AMD) via In Silico Analysis and Clinical Validation","type":"talk","speaker":"Işıl Kutlutürk","session_title":"Free Paper 46 - AMD/CSC","scheduled_time":"13:15 - 13:21","status":"pending","session_id":"95627","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":1888,"end_seconds":2285},{"inventory_index":69,"presentation_id":"talk-566621","official_presentation_id":"566621","title":"Topline Results from the Phase 3 DRAGON Study of Tinlarebant for Adolescent Stargardt Disease","type":"talk","speaker":"Michel Michaelides","session_title":"Free Paper 47 - Inherited Retinal Disease","scheduled_time":"13:27 - 13:34","status":"pending","session_id":"95628","source_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list\u0026day=2026-10-02\u0026segment=programme\u0026is_on_demand=1\u0026is_sponsored=1\u0026myprog=1\u0026sort=starts_at","start_seconds":2445,"end_seconds":2879}]}</script><script>(() => {
'use strict';
const FIGURES=[{"id":"tease-primary-endpoints","presentation_id":"566627","file":"tease-primary-endpoints-566627.webp","title":"Read the comparator before the percentage","caption":"TEASE-1 combines placebo and natural-history controls and includes crossover participants in the treated group. TEASE-2’s primary EZ-loss estimate was 28% slower, with P=0.238. The headline percentages therefore need separate interpretation.","explanation":"The two panels use different structural endpoints, populations and comparison groups. TEASE-1 reports a square-root-transformed lesion-growth reduction over months 6–24; TEASE-2 reports EZ area loss. The latter result did not reach statistical significance. These congress findings do not establish treatment benefit, and the slide identifies gildeuretinol as investigational at presentation.","alt":"Two original TEASE line charts. TEASE-1: treated N=40, including 10 placebo crossovers; untreated N=74, including 20 placebo and 54 natural-history participants; 21.6% slower square-root lesion growth, P<0.001. TEASE-2: treated N=40 versus placebo N=39; 28% slower EZ area loss, P=0.238.","kind":"talk","session_id":"95584","speaker":"Philip Ferrone","presentation_title":"Oral Gildeuretinol for Slowing Disease Progression in Stargardt Disease: The TEASE and Phase 3 Studies","source_programme_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag/session/95584?view=list&day=2026-10-02&segment=sessions&is_on_demand=1&is_sponsored=1&myprog=1&sort=starts_at","chapter_start":1065,"timestamp_label":"19:44","attribution":"Philip Ferrone and colleagues · EURETINA 2026 · session 95584, 19:44","width":1350,"height":674},{"id":"macustar-central3mm-hazards","presentation_id":"566725","file":"macustar-central3mm-hazards-566725.jpg","title":"Large hazard ratios still carry uncertainty","caption":"Within the central 3 mm, cRORA had a GA hazard ratio of 19.87 (95% CI 7.76–50.85); non-exudative CNV had an MNV hazard ratio of 12.75 (3.53–46.05). The wide intervals and distinct outcomes matter.","explanation":"This table reports prognostic associations, not treatment effects or a validated treatment-selection rule. Field of view also matters: the full OCT-volume analysis is a separate result. The presentation did not fully explain how baseline OCT-defined cRORA was distinguished from the later GA endpoint; that endpoint detail remains an uncertainty in the summary.","alt":"Original MACUSTAR central-3-mm forest plot and hazard-ratio table, separated into overall late AMD, GA and neovascular AMD. cRORA is strongly associated with GA with a wide confidence interval; non-exudative CNV is associated with neovascular conversion with a wide interval.","kind":"talk","session_id":"95600","speaker":"Lukas Goerdt","presentation_title":"Longitudinal analysis of structural biomarkers for disease progression in intermediate age-related macular degeneration: a MACUSTAR study report","source_programme_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list&day=2026-10-02&segment=programme&is_on_demand=1&is_sponsored=1&myprog=1&sort=starts_at","chapter_start":801,"timestamp_label":"16:47","attribution":"Lukas Goerdt and colleagues · EURETINA 2026 · session 95600, 16:47","width":1390,"height":803},{"id":"edream-faf-oct-agreement","presentation_id":"566275","file":"edream-faf-oct-agreement-566275.jpg","title":"Agreement limits are not confidence intervals","caption":"In 34 eyes, the RPE-loss/FAF mean-difference magnitude was about 0.03 mm²; the 95% limits of agreement were −0.87 to 0.81 mm². Those limits describe individual measurement differences. The slide’s mean sign is internally inconsistent.","explanation":"The printed mean is +0.03 mm², but the limits centre on −0.03 mm², so the summary preserves the magnitude without asserting direction. Neither the near-zero mean nor the non-significant Bland–Altman regression proves clinical equivalence. This figure concerns RPE loss; the talk’s separate photoreceptor-degeneration comparison covers a systematically larger area.","alt":"Original eDREAM area-agreement slide with distributions for FAF graders and OCT RPE loss, illustrative unlabelled fundus images, and a Bland–Altman plot. The displayed mean is 0.03 mm² and 95% limits of agreement are −0.87 to 0.81 mm²; the sign of the mean conflicts with their midpoint.","kind":"talk","session_id":"95620","speaker":"Fangyao Tang","presentation_title":"Cross-modal agreement between FAF and OCT in quantification of geographic atrophy for eyes enrolled in the eDREAM randomised trial","source_programme_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list&day=2026-10-02&segment=programme&is_on_demand=1&is_sponsored=1&myprog=1&sort=starts_at","chapter_start":1725,"timestamp_label":"33:25","attribution":"Fangyao Tang and colleagues · EURETINA 2026 · session 95620, 33:25","width":1449,"height":735},{"id":"edream-pointwise-repeatability","presentation_id":"568823","file":"edream-pointwise-repeatability-568823.jpg","title":"A few decibels can be measurement noise","caption":"Outside FAF-defined GA, pointwise repeatability was 7.05 dB without PRD and 7.81 dB with PRD in isolation. The n values are retinal loci, not patients. This is test–retest variability, not treatment efficacy or the precision of a multi-locus average.","explanation":"The fundus illustration locates sampled points relative to FAF-defined GA and photoreceptor degeneration (PRD); the plots show repeat-test differences. Use the roughly 7–8 dB scale to understand why a single threshold crossing needs caution. These displayed-slide results come from 34 eyes and 1,867 paired loci overall. The separate abstract used 25 eyes and 1,394 loci and must not be silently pooled with this version.","alt":"Original eDREAM poster slide 5. An anonymised fundus image marks GA in yellow, photoreceptor degeneration in blue and microperimetry locations in white. Two Bland–Altman plots show no-PRD loci, n=779 and CoR 7.05 dB, versus PRD-only loci, n=521 and CoR 7.81 dB.","kind":"poster","session_id":"95723","speaker":"Dun Jack Fu","presentation_title":"Locus-level test-retest repeatability of MAIA microperimetry in geographic atrophy: implications for trial endpoint design from the eDREAM randomised trial","source_programme_url":"https://pagv3.virtual-meeting.org/euretina/euretina2026/en-GB/pag?view=list&day=2026-10-02&segment=programme&is_on_demand=1&is_sponsored=1&myprog=1&sort=starts_at","chapter_start":null,"timestamp_label":"ePoster slide 5","attribution":"Dun Jack Fu and colleagues · EURETINA 2026 · poster RETINA26-1306, slide 5","width":1280,"height":720}];
const DATA=JSON.parse(document.getElementById('guide-data').textContent);
const sessions=DATA.sessions, items=DATA.starred, $=id=>document.getElementById(id);
const array=x=>Array.isArray(x)?x:x?[x]:[];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{n=Math.max(0,Math.floor(Number(n)||0));return n>=3600?`${Math.floor(n/3600)}:${String(Math.floor(n/60)%60).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`:`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;};
const textOf=b=>typeof b==='string'?b:[b?.title,b?.text].filter(Boolean).join(' ');
const safeUrl=u=>/^https:\/\/pagv3\.virtual-meeting\.org\/euretina\/euretina2026\//i.test(u||'')?esc(u):'';
const bySession=id=>sessions.find(s=>String(s.id)===String(id));
const chapterOf=i=>i.summary_ref?bySession(i.summary_ref.session_id)?.chapter_summaries.find(c=>c.start_seconds===i.summary_ref.start_seconds):null;
const summaryOf=x=>x.summary_ref?chapterOf(x):x.summary||{};
const hasSummary=x=>Boolean(summaryOf(x)?.overview?.length||summaryOf(x)?.key_findings?.length);
const isItem=x=>x.presentation_id!=null;
const route=(x,t=null)=>`#${isItem(x)?'item='+encodeURIComponent(x.presentation_id):'s='+encodeURIComponent(x.id)}${t!=null?'&t='+Number(t):''}`;
const chapterRoute=(id,t)=>`#s=${encodeURIComponent(id)}&chapter=${Number(t)}`;
const dateLabel=x=>x.date?new Date(x.date+'T12:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'}):'';
const statusLabel=x=>hasSummary(x)?(x.basis==='reused'?'Summary available · in full session':'Summary available'):(isItem(x)?'Summary pending':'Recording unavailable');
const badge=x=>`<span class="badge ${hasSummary(x)?'complete':'pending'}">${esc(statusLabel(x))}</span>`;
const officialLink=(x,label='Open official programme')=>safeUrl(x.source_url)?`<a class="button" href="${safeUrl(x.source_url)}" target="_blank" rel="noopener noreferrer">${label}</a>`:'';
let mode='starred',query='',coverage='all',kind='all',current=null;
let presentationMode=false,deckSlides=[],deckIndex=0,deckScope='starred',deckGroup='all';
const summaryBlocks=x=>[summaryOf(x),...array(x.chapter_summaries)].filter(Boolean).flatMap(s=>['overview','key_findings','limitations'].flatMap(k=>array(s[k])));
const searchText=x=>[x.title,x.session_title,x.topic,x.type,x.session_number,x.speaker,x.poster_id,x.official_presentation_id,x.methods,x.interpretation,x.abstract_summary,...array(x.speakers).map(s=>typeof s==='string'?s:s.name),...array(x.chapters).map(c=>c.title+' '+(c.speaker||'')),...summaryBlocks(x).map(textOf),...array(x.review_notes).map(textOf)].filter(Boolean).join('\n').toLowerCase();
const index=new Map([...sessions,...items].map(x=>[x,searchText(x)]));
const collection=()=>mode==='starred'?items:sessions;
function matches(x){return (!query||index.get(x).includes(query.toLowerCase()))&&(coverage==='all'||(coverage==='ready'?hasSummary(x):!hasSummary(x)))&&(mode==='sessions'||kind==='all'||x.type===kind);}
function highlight(value){
 const str=String(value??'');if(!query)return esc(str);let out='',offset=0,lower=str.toLowerCase(),needle=query.toLowerCase();
 for(let at=lower.indexOf(needle);at>=0;at=lower.indexOf(needle,offset)){out+=esc(str.slice(offset,at))+'<mark>'+esc(str.slice(at,at+needle.length))+'</mark>';offset=at+needle.length;}
 return out+esc(str.slice(offset));
}
function snippet(x){
 if(!query)return '';const texts=[...summaryBlocks(x).map(textOf),x.speaker||'',x.session_title||''];
 const str=texts.find(t=>t.toLowerCase().includes(query.toLowerCase()));if(!str)return '';
 const at=str.toLowerCase().indexOf(query.toLowerCase()),start=Math.max(0,at-25),end=Math.min(str.length,at+query.length+75);
 return (start?'…':'')+str.slice(start,end)+(end<str.length?'…':'');
}
function renderNav(){
 const source=collection(),shown=source.filter(matches);
 $('mode-starred').setAttribute('aria-current',mode==='starred'?'page':'false');$('mode-sessions').setAttribute('aria-current',mode==='sessions'?'page':'false');

 $('search-status').textContent=`${shown.length} of ${source.length} ${mode==='starred'?'starred items':'full sessions'}${query?' match':''}`;
 $('session-nav').innerHTML=shown.length?shown.map(x=>`<a class="nav-session" href="${route(x)}" ${current===x?'aria-current="page"':''}><div class="nav-top"><span class="status-dot ${hasSummary(x)?'ready':'pending'}" aria-hidden="true"></span>${isItem(x)?(x.type==='poster'?'POSTER':'TALK')+' · '+String(x.inventory_index).padStart(2,'0'):esc(dateLabel(x))}</div><div class="nav-title">${highlight(x.title)}</div>${snippet(x)?`<div class="nav-snippet">${highlight(snippet(x))}</div>`:''}</a>`).join(''):'<p class="no-results">No matches. Try a shorter phrase or clear the filters.</p>';

ording.</p></aside>`:''}</div><div class="pagination">${prev?'<a href="'+route(prev)+'"><span>← PREVIOUS SESSION</span>'+esc(prev.title)+'</a>':''}${next?'<a href="'+route(next)+'"><span>NEXT SESSION →</span>'+esc(next.title)+'</a>':''}</div>${footer()}`;

function slideParts(block,max=76){
 const original=typeof block==='string'?{text:block}:block;
 const str=original.text||'';
 const sentences=str.split(/(?<=[.!?])\s+(?=[A-Z0-9“"'(])/u);
 const chunks=[];let text='',count=0;
 for(const sentence of sentences){const n=sentence.trim().split(/\s+/).length;if(text&&count+n>max){chunks.push(text.trim());text='';count=0;}text+=(text?' ':'')+sentence;count+=n;}
 if(text.trim())chunks.push(text.trim());
 return chunks.length?chunks.map(t=>({...original,text:t})):[original];
}
function deckDocuments(scope,group){
 if(scope==='starred')return items.filter(x=>group==='all'||String(x.session_id)===group).map(x=>({key:x.presentation_id,title:x.title,speaker:x.speaker,group:x.session_title,type:x.type==='poster'?'Poster':'Talk',summary:summaryOf(x),x,link:route(x)}));
 return sessions.filter(x=>group==='all'||String(x.id)===group).flatMap(x=>[{key:x.id,title:x.title,group:'Full-session summary',type:'Session',summary:x.summary,x,link:route(x)},...x.chapter_summaries.map(c=>({key:x.id+'-'+c.start_seconds,title:c.title,speaker:c.speaker,group:x.title,type:'Chapter',summary:c,x,chapterStart:c.start_seconds,link:chapterRoute(x.id,c.start_seconds)}))]);
}
function makeSlides(scope,group){
 const docs=deckDocuments(scope,group),out=[];
 out.push({kind:'start',heading:scope==='starred'?'Your starred programme':'The full-session library',title:scope==='starred'?'51 summaries ready.\n18 talks still pending.':'9 reviewed sessions.\n76 chapter summaries.',group:'EURETINA 2026 · Study presentation',docs,blocks:[{text:'Read the findings alongside their limitations. All text is drawn from the reviewed reading guide. Each topic links back to its full summary and original source references.'},{text:'The 51 starred summaries include 25 reused chapters, 21 additional talks and 5 posters. The Valeda full-session recording remains unavailable.'}],link:scope==='starred'?'#collection=starred':'#collection=sessions'});
 for(const doc of docs){
  const sum=doc.summary||{},base={...doc,heading:doc.title};
  if(!array(sum.overview).length&&!array(sum.key_findings).length){out.push({...base,kind:'pending',title:doc.type==='Session'?'Recording unavailable':'Summary pending',blocks:[{text:doc.type==='Session'?(sum.coverage_note||'The recording was unavailable. No findings have been inferred from the programme title.'):'This talk is confirmed in the starred programme, but the source review is not finished. No findings have been inferred from its title.'}]});continue;}
  const parts=[...array(sum.overview).flatMap(b=>slideParts(b)).map(b=>({kind:'brief',title:'In brief',block:b})),...array(sum.key_findings).flatMap(b=>slideParts(b)).map(b=>({kind:'finding',title:b.title||'Key finding',block:b})),...array(sum.limitations).flatMap(b=>slideParts(b)).map(b=>({kind:'caution',title:'Limitations & interpretation',block:b}))];
  for(let i=0;i<parts.length;i++){const part=parts[i];out.push({...base,kind:part.kind,title:part.title,blocks:[part.block],topicIndex:i+1,topicTotal:parts.length});}
  for(const figure of matchingFigures(doc.x,doc.summary)){out.push({...base,kind:'figure',title:figure.title,blocks:[{text:figure.caption}],figure});}
  if(doc.type==='Poster'&&doc.x.methods)out.push({...base,kind:'method',title:'Study methods',blocks:[{text:doc.x.methods}]});
  if(doc.type==='Poster'&&doc.x.interpretation)out.push({...base,kind:'interpretation',title:'What it means',blocks:[{text:doc.x.interpretation}]});
  if(doc.type==='Poster'&&doc.x.abstract_summary)out.push({...base,kind:'source',title:'What the abstract adds',blocks:[{text:doc.x.abstract_summary}]});
 }
 return out;
}
function presentRoute(i,scope=deckScope,group=deckGroup){return '#view=presentation&scope='+scope+'&group='+encodeURIComponent(group)+'&slide='+Math.max(0,i);}
function renderPresentation(params){
