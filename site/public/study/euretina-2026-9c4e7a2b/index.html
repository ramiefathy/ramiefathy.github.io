 const activeDoc=[...docOptions].reverse().find(o=>o.i<=deckIndex);
 const figure=typeof deckFigure==='function'?deckFigure(slide):'';
 $('content').innerHTML=`<div class="deck-filters"><label>Collection<select id="deck-scope"><option value="starred" ${deckScope==='starred'?'selected':''}>Starred talks & posters</option><option value="sessions" ${deckScope==='sessions'?'selected':''}>Full sessions & chapters</option></select></label><label>Session<select id="deck-group"><option value="all">All sessions</option>${groups.map(([id,title])=>'<option value="'+esc(id)+'" '+(id===deckGroup?'selected':'')+'>'+esc(title)+'</option>').join('')}</select></label><label>Jump to a topic<select id="deck-topic">${docOptions.map(({d,i})=>'<option value="'+i+'" '+(i===activeDoc.i?'selected':'')+'>'+esc(i===0?'Coverage & how to read':d.heading)+'</option>').join('')}</select></label></div><section class="slide ${esc(slide.kind)} ${figure?'with-figure':''}" aria-label="Presentation slide"><div class="slide-top"><span>${esc(slide.group||'EURETINA 2026')}</span><span>${slide.kind==='pending'?'NOT REVIEWED':slide.type||'COVERAGE'}</span></div><div class="slide-main"><div class="slide-copy">${slide.kind!=='start'?'<p class="slide-topic">'+esc(slide.heading)+'</p>':''}<h1 class="slide-heading">${esc(slide.title).replace(/\n/g,'<br>')}</h1>${slide.speaker?'<p class="slide-speaker">'+esc(slide.speaker)+'</p>':''}<div class="slide-text">${slide.blocks.map(b=>'<p>'+esc(b.text||'')+'</p>').join('')}</div></div>${figure}</div><div class="slide-source">${slide.x?slide.blocks.map(b=>evidence(slide.x,b)).join(''):''}${slide.topicIndex?'<span>Topic part '+slide.topicIndex+' of '+slide.topicTotal+'</span>':''}</div><div class="slide-bottom"><span>${slide.kind==='caution'?'Read alongside the findings':slide.kind==='pending'?'Pending content is not presented as evidence':'Congress evidence · Verify before clinical use'}</span><a href="${esc(slide.link)}">Read full summary</a></div></section><div class="deck-controls"><button class="button" data-action="slide-prev" ${deckIndex===0?'disabled':''}>Previous</button><div class="deck-position"><strong aria-live="polite">Slide ${deckIndex+1} of ${deckSlides.length}</strong><span>Arrow keys or swipe to move</span></div><button class="button primary" data-action="slide-next" ${deckIndex===deckSlides.length-1?'disabled':''}>Next</button><button class="button fullscreen-button" data-action="fullscreen">Full screen</button></div><div class="deck-progress" role="progressbar" aria-label="Presentation progress" aria-valuemin="1" aria-valuemax="${deckSlides.length}" aria-valuenow="${deckIndex+1}"><span style="width:${progress}%"></span></div>`;
 $('reader-view').href=slide.link;$('presentation-view').href=presentRoute(deckIndex);document.title='Presentation · EURETINA 2026';
 $('deck-scope').addEventListener('change',e=>{location.hash=presentRoute(0,e.target.value,'all');});
 $('deck-group').addEventListener('change',e=>{location.hash=presentRoute(0,deckScope,e.target.value);});

 $('announcer').textContent='Slide '+(deckIndex+1)+' of '+deckSlides.length+'. '+slide.heading+'. '+slide.title;
}
function advanceSlide(delta){if(!presentationMode)return;const n=Math.max(0,Math.min(deckSlides.length-1,deckIndex+delta));if(n!==deckIndex)location.hash=presentRoute(n);}

 if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();advanceSlide(-1);}
 if(e.key==='Home'){e.preventDefault();location.hash=presentRoute(0);}
 if(e.key==='End'){e.preventDefault();location.hash=presentRoute(deckSlides.length-1);}
});
let touchStart=null;
document.addEventListener('touchstart',e=>{if(presentationMode&&e.target.closest('.slide'))touchStart={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};},{passive:true});
document.addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.8&&!window.getSelection()?.toString())advanceSlide(dx<0?1:-1);touchStart=null;},{passive:true});
document.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(action==='slide-prev')advanceSlide(-1);if(action==='slide-next')advanceSlide(1);if(action==='fullscreen'){if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});else document.documentElement.requestFullscreen?.().catch(()=>{$('announcer').textContent='Full screen is unavailable in this browser. The presentation remains usable.';});}});
$('search').addEventListener('input',e=>{query=e.target.value.trim();filterChanged();});
$('coverage-filter').addEventListener('change',e=>{coverage=e.target.value;filterChanged();});
$('type-filter').addEventListener('change',e=>{kind=e.target.value;filterChanged();});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('search').focus();}if(e.key==='Escape'&&document.activeElement===$('search')){$('search').value='';query='';filterChanged();}});
document.addEventListener('click',e=>{
 if(e.target.closest('.skip-link')){e.preventDefault();focusReader();return;}
 const sameLink=e.target.closest('a[href^="#"]');if(sameLink?.getAttribute('href')===location.hash){e.preventDefault();navigate();return;}
 const b=e.target.closest('[data-action]');if(!b)return;
 if(b.dataset.action==='print')window.print();
 if(b.dataset.action==='clear'){query='';coverage='all';kind='all';$('search').value='';$('coverage-filter').value='all';$('type-filter').value='all';filterChanged();}
 if(b.dataset.action==='expand-chapters'){const nodes=[...document.querySelectorAll('.talk-summary')],allOpen=nodes.every(n=>n.open);nodes.forEach(n=>n.open=!allOpen);b.textContent=allOpen?'Open all chapters':'Close all chapters';}
 if(b.dataset.action==='go-chapters'){document.querySelector('.talks-section')?.scrollIntoView({block:'start'});const first=document.querySelector('.talk-summary');if(first)first.open=true;}
});
window.addEventListener('hashchange',navigate);
navigate();
})();
</script></body></html>
