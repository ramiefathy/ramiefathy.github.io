  <script>
    const data = JSON.parse(document.getElementById('dashboard-data').textContent);
    const state = {
      activeTab: 'overall',
      selectedModelId: data.models[0] ? data.models[0].modelId : null,
      itemIndexByModel: Object.fromEntries(data.models.map((model) => [model.modelId, 0])),
      filtersByModel: Object.fromEntries(data.models.map((model) => [model.modelId, { query: '', superdomain: 'all', adjudication: 'all' }])),
    };

    const el = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    };

    const fmt = (value, suffix = '') => value === null || value === undefined || Number.isNaN(value) ? '—' : `${value}${suffix}`;
    const title = document.getElementById('title');
    title.textContent = data.title;
    document.getElementById('subtitle').textContent = `Generated ${new Date(data.generatedAt).toLocaleString()} · ${data.overall.models} model${data.overall.models === 1 ? '' : 's'} · ${data.overall.rows} judged outputs`;
    document.getElementById('sources').textContent = `Source artifacts: ${data.sourceFiles.join(', ')}`;

    function renderTabs() {
      const bar = document.getElementById('tab-bar');
      bar.innerHTML = '';
      const overall = el('button', `tab ${state.activeTab === 'overall' ? 'active' : ''}`, 'Overall');
      overall.onclick = () => { state.activeTab = 'overall'; render(); };
      bar.appendChild(overall);
      data.models.forEach((model) => {
        const button = el('button', `tab ${state.activeTab === model.modelId ? 'active' : ''}`, model.modelDisplayName);
        button.onclick = () => {
          state.activeTab = model.modelId;
          state.selectedModelId = model.modelId;
          render();
        };
        bar.appendChild(button);
      });
    }

    function kpiCard(label, value, sub = '') {
      const card = el('div', 'card kpi');
      card.appendChild(el('div', 'label', label));
      card.appendChild(el('div', 'value', value));
      if (sub) card.appendChild(el('div', 'sub', sub));
      return card;
    }

    function buildDistributionCard(distribution) {
      const card = el('div', 'card');
      card.appendChild(el('h3', null, 'Score distribution'));
      const max = Math.max(...distribution.map((item) => item.count), 1);
      const wrapper = el('div', 'distribution');
      distribution.forEach((item) => {
        const row = el('div', 'bar-row');
        row.appendChild(el('div', 'muted small', item.label));
        const track = el('div', 'bar-track');
        const fill = el('div', 'bar-fill');
        fill.style.width = `${(item.count / max) * 100}%`;
        track.appendChild(fill);
        row.appendChild(track);
        row.appendChild(el('div', 'small', String(item.count)));
        wrapper.appendChild(row);
      });
      card.appendChild(wrapper);
      return card;
    }

    function buildSummaryTable(titleText, rows, valueKey = 'meanScore') {
      const card = el('div', 'card');
      card.appendChild(el('h3', null, titleText));
      const table = el('table', 'metric-table');
      table.innerHTML = `<thead><tr><th>Bucket</th><th>Mean score</th><th>Count</th></tr></thead>`;
      const body = el('tbody');
      rows.forEach((row) => {
        const tr = el('tr');
        tr.innerHTML = `<td>${row.label}</td><td>${fmt(row[valueKey])}</td><td>${row.count}</td>`;
        body.appendChild(tr);
      });
      table.appendChild(body);
      card.appendChild(table);
      return card;
    }

    function buildCriterionTable(rows) {
      const card = el('div', 'card');
      card.appendChild(el('h3', null, 'Average criterion scores'));
      const table = el('table', 'metric-table');
      table.innerHTML = `<thead><tr><th>Criterion</th><th>Mean score</th><th>n</th></tr></thead>`;
      const body = el('tbody');
      rows.forEach((row) => {
        const tr = el('tr');
        tr.innerHTML = `<td>${row.criterion}</td><td>${fmt(row.meanScore)}</td><td>${row.count}</td>`;
        body.appendChild(tr);
      });
      table.appendChild(body);
      card.appendChild(table);
      return card;
    }

    function renderOverall() {
      const container = document.getElementById('overall-view');
      const models = [...data.models].sort((a, b) => (b.metrics.meanScore ?? -1) - (a.metrics.meanScore ?? -1));
      container.innerHTML = '';

      const kpis = el('div', 'grid kpi-grid');
      kpis.appendChild(kpiCard('Models', data.overall.models));
      kpis.appendChild(kpiCard('Judged rows', data.overall.rows));
      kpis.appendChild(kpiCard('Scored rows', data.overall.scored));
      kpis.appendChild(kpiCard('Mean score', fmt(data.overall.meanScore)));
      kpis.appendChild(kpiCard('Usable ≥70', data.overall.usable70, `${fmt(data.overall.usableRate, '%')} of outputs`));
      kpis.appendChild(kpiCard('Ready ≥85', data.overall.ready85, `${fmt(data.overall.readyRate, '%')} of outputs`));
      kpis.appendChild(kpiCard('Needs adjudication', data.overall.needsAdjudication));
      kpis.appendChild(kpiCard('Fatal flaws', data.overall.fatal));
      container.appendChild(kpis);

      const tableCard = el('div', 'card');
      tableCard.appendChild(el('h3', null, 'Model comparison'));
      const table = el('table', 'metric-table');
      table.innerHTML = '<thead><tr><th>Model</th><th>Mean</th><th>Scored</th><th>Usable ≥70</th><th>Ready ≥85</th><th>Needs adjudication</th><th>Fatal</th><th>Analysis summary</th></tr></thead>';
      const body = el('tbody');
      models.forEach((model) => {
        const tr = el('tr');
        const analysisLink = model.analysisSummary ? `<span class="small muted">${model.analysisSummary.summary_path}</span>` : '—';
        tr.innerHTML = `
          <td><strong>${model.modelDisplayName}</strong><div class="small muted">${model.modelApiId || model.modelId}</div></td>
          <td>${fmt(model.metrics.meanScore)}</td>
          <td>${model.metrics.scored}/${model.metrics.total}</td>
          <td>${model.metrics.usable70} <span class="small muted">(${fmt(model.metrics.usableRate, '%')})</span></td>
          <td>${model.metrics.ready85} <span class="small muted">(${fmt(model.metrics.readyRate, '%')})</span></td>
          <td>${model.metrics.needsAdjudication}</td>
          <td>${model.metrics.fatal}</td>
          <td>${analysisLink}</td>`;
        body.appendChild(tr);
      });
      table.appendChild(body);
      tableCard.appendChild(table);
      container.appendChild(tableCard);

      const grid = el('div', 'grid');
      grid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(320px, 1fr))';
      models.forEach((model) => {
        const panel = el('div', 'card');
        panel.appendChild(el('h3', null, model.modelDisplayName));
        panel.appendChild(el('p', 'muted small', `${model.backend} · ${model.modelApiId}`));
        const badgeRow = el('div', 'badge-row');
        badgeRow.appendChild(makeBadge(`Mean ${fmt(model.metrics.meanScore)}`, 'good'));
        badgeRow.appendChild(makeBadge(`Usable ${model.metrics.usable70}/${model.metrics.total}`, model.metrics.usableRate >= 50 ? 'good' : 'warn'));
        badgeRow.appendChild(makeBadge(`Needs adjudication ${model.metrics.needsAdjudication}`, model.metrics.needsAdjudication ? 'warn' : 'good'));
        panel.appendChild(badgeRow);
        panel.appendChild(buildMiniDistribution(model.distribution));
        const jump = el('button', 'tab', 'Open model review');
        jump.style.marginTop = '12px';
        jump.onclick = () => { state.activeTab = model.modelId; render(); };
        panel.appendChild(jump);
        grid.appendChild(panel);
      });
      container.appendChild(grid);
    }

    function buildMiniDistribution(distribution) {
      const wrapper = el('div', 'distribution');
      const max = Math.max(...distribution.map((item) => item.count), 1);
      distribution.forEach((item) => {
        const row = el('div', 'bar-row');
        row.appendChild(el('div', 'small muted', item.label));
        const track = el('div', 'bar-track');
        const fill = el('div', 'bar-fill');
        fill.style.width = `${(item.count / max) * 100}%`;
        track.appendChild(fill);
        row.appendChild(track);
        row.appendChild(el('div', 'small', String(item.count)));
        wrapper.appendChild(row);
      });
      return wrapper;
    }

    function makeBadge(text, tone = '') {
      return el('span', `badge ${tone}`.trim(), text);
    }

    function filteredItems(model) {
      const filters = state.filtersByModel[model.modelId];
      return model.items.filter((item) => {
        const query = filters.query.trim().toLowerCase();
        const haystack = [item.objectiveId, item.topic, item.subtopic, item.stem, item.correctAnswerText].join(' ').toLowerCase();
        if (query && !haystack.includes(query)) return false;
        if (filters.superdomain !== 'all' && item.superdomain !== filters.superdomain) return false;
        if (filters.adjudication === 'needs' && !item.needsAdjudication) return false;
        if (filters.adjudication === 'clean' && item.needsAdjudication) return false;
        return true;
      });
    }

    function renderModelView(model) {
      const container = document.getElementById('model-view');
      container.innerHTML = '';
      const topKpis = el('div', 'grid kpi-grid');
      topKpis.appendChild(kpiCard('Mean score', fmt(model.metrics.meanScore), `${model.metrics.scored}/${model.metrics.total} scored`));
      topKpis.appendChild(kpiCard('Usable ≥70', model.metrics.usable70, `${fmt(model.metrics.usableRate, '%')} of outputs`));
      topKpis.appendChild(kpiCard('Ready ≥85', model.metrics.ready85, `${fmt(model.metrics.readyRate, '%')} of outputs`));
      topKpis.appendChild(kpiCard('Needs adjudication', model.metrics.needsAdjudication));
      topKpis.appendChild(kpiCard('Fatal flaws', model.metrics.fatal));
      topKpis.appendChild(kpiCard('Format failures', model.metrics.formatFailures));
      container.appendChild(topKpis);

      const summaryGrid = el('div', 'grid');
      summaryGrid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(300px, 1fr))';
      summaryGrid.appendChild(buildDistributionCard(model.distribution));
      summaryGrid.appendChild(buildSummaryTable('Performance by superdomain', model.superdomainSummary));
      summaryGrid.appendChild(buildSummaryTable('Performance by difficulty', model.difficultySummary));
      summaryGrid.appendChild(buildCriterionTable(model.criterionSummary));
      container.appendChild(summaryGrid);

      const reviewShell = el('div', 'two-col');
      const listPanel = el('div', 'card list-panel');
      const titleRow = el('div', 'panel-title');
      const left = el('div');
      left.appendChild(el('h3', null, 'Interactive item review'));
      left.appendChild(el('div', 'muted small', 'Browse MCQs, explanations, and judge outputs item by item.'));
      titleRow.appendChild(left);
      listPanel.appendChild(titleRow);

      const controls = el('div', 'controls');
      const search = document.createElement('input');
      search.placeholder = 'Search objective, topic, stem, or answer';
      search.value = state.filtersByModel[model.modelId].query;
      search.oninput = (event) => {
        state.filtersByModel[model.modelId].query = event.target.value;
        state.itemIndexByModel[model.modelId] = 0;
        render();
      };
      controls.appendChild(search);

      const superdomains = ['all', ...new Set(model.items.map((item) => item.superdomain).filter(Boolean))];
      const select = document.createElement('select');
      select.innerHTML = superdomains.map((option) => `<option value="${option}">${option === 'all' ? 'All superdomains' : option}</option>`).join('');
      select.value = state.filtersByModel[model.modelId].superdomain;
      select.onchange = (event) => {
        state.filtersByModel[model.modelId].superdomain = event.target.value;
        state.itemIndexByModel[model.modelId] = 0;
        render();
      };
      controls.appendChild(select);

      const adjudication = document.createElement('select');
      adjudication.innerHTML = `
        <option value="all">All items</option>
        <option value="needs">Needs adjudication</option>
        <option value="clean">No adjudication flag</option>`;
      adjudication.value = state.filtersByModel[model.modelId].adjudication;
      adjudication.onchange = (event) => {
        state.filtersByModel[model.modelId].adjudication = event.target.value;
        state.itemIndexByModel[model.modelId] = 0;
        render();
      };
      controls.appendChild(adjudication);
      listPanel.appendChild(controls);

      const items = filteredItems(model);
      const list = el('div', 'item-list');
      const currentIndex = Math.min(state.itemIndexByModel[model.modelId] || 0, Math.max(items.length - 1, 0));
      state.itemIndexByModel[model.modelId] = currentIndex;
      items.forEach((item, index) => {
        const button = el('button', `item-button ${index === currentIndex ? 'active' : ''}`);
        button.onclick = () => { state.itemIndexByModel[model.modelId] = index; render(); };
        button.appendChild(el('div', null, `${item.objectiveId} · Seed ${item.seed}`));
        button.appendChild(el('div', 'item-meta', `${item.superdomain} · ${item.difficulty}`));
        button.appendChild(el('div', 'item-meta', `${fmt(item.score)} · ${item.subtopic || item.topic || 'No topic'}`));
        list.appendChild(button);
      });
      if (!items.length) {
        list.appendChild(el('div', 'muted small', 'No items match the current filters.'));
      }
      listPanel.appendChild(list);
      reviewShell.appendChild(listPanel);

      const detail = el('div', 'detail-grid');
      if (!items.length) {
        const empty = el('div', 'card');
        empty.appendChild(el('h3', null, 'No items to display'));
        detail.appendChild(empty);
      } else {
        detail.appendChild(buildItemDetail(items[currentIndex], items.length, currentIndex, model.modelId));
      }
      reviewShell.appendChild(detail);
      container.appendChild(reviewShell);
    }

    function buildItemDetail(item, total, index, modelId) {
      const wrapper = el('div');
      const card = el('div', 'card');
      const nav = el('div', 'nav-row');
      const prev = el('button', null, '← Previous');
      prev.disabled = index === 0;
      prev.onclick = () => { state.itemIndexByModel[modelId] = Math.max(0, index - 1); render(); };
      const next = el('button', null, 'Next →');
      next.disabled = index >= total - 1;
      next.onclick = () => { state.itemIndexByModel[modelId] = Math.min(total - 1, index + 1); render(); };
      nav.appendChild(prev);
      nav.appendChild(next);
      card.appendChild(nav);

      const header = el('div', 'panel-title');
      const left = el('div');
      left.appendChild(el('h2', null, `${item.objectiveId} · Seed ${item.seed}`));
      left.appendChild(el('p', 'muted', `${item.superdomain} · ${item.difficulty} · ${item.itemArchetype}`));
      header.appendChild(left);
      const right = el('div');
      right.appendChild(makeBadge(`Score ${fmt(item.score)}`, item.score >= 85 ? 'good' : item.score >= 70 ? 'warn' : 'bad'));
      header.appendChild(right);
      card.appendChild(header);

      const badges = el('div', 'badge-row');
      badges.appendChild(makeBadge(item.status || 'unknown'));
      badges.appendChild(makeBadge(item.ready85 ? 'Ready ≥85' : 'Below 85', item.ready85 ? 'good' : 'warn'));
      badges.appendChild(makeBadge(item.usable70 ? 'Usable ≥70' : 'Below 70', item.usable70 ? 'good' : 'bad'));
      if (item.needsAdjudication) badges.appendChild(makeBadge('Needs adjudication', 'warn'));
      if (item.fatal) badges.appendChild(makeBadge('Fatal flaw', 'bad'));
      if (item.formatFailure) badges.appendChild(makeBadge('Format failure', 'bad'));
      card.appendChild(badges);

      const metaTable = el('table', 'metric-table');
      metaTable.innerHTML = `
        <tbody>
          <tr><th>Topic</th><td>${item.topic || '—'}</td></tr>
          <tr><th>Subtopic</th><td>${item.subtopic || '—'}</td></tr>
          <tr><th>Learning objective</th><td>${item.learningObjective || '—'}</td></tr>
          <tr><th>Inter-run spread</th><td>${fmt(item.spread)}</td></tr>
          <tr><th>Source artifact</th><td><span class="small muted">${item.sourcePath || '—'}</span></td></tr>
        </tbody>`;
      card.appendChild(metaTable);

      const stemCard = el('div', 'card');
      stemCard.appendChild(el('h3', null, 'Question'));
      stemCard.appendChild(el('p', null, item.stem || 'No stem captured.'));
      if (item.leadIn) stemCard.appendChild(el('p', null, item.leadIn));
      (item.options || []).forEach((option) => {
        const node = el('div', `option ${option.label === item.correctAnswer ? 'correct' : ''}`);
        node.innerHTML = `<strong>${option.label}.</strong> ${option.text || ''}`;
        stemCard.appendChild(node);
      });
      stemCard.appendChild(el('p', null, `Correct answer: ${item.correctAnswer || '—'}${item.correctAnswerText ? ` · ${item.correctAnswerText}` : ''}`));
      wrapper.appendChild(card);
      wrapper.appendChild(stemCard);

      const explanationCard = el('div', 'card');
      explanationCard.appendChild(el('h3', null, 'Explanations'));
      const correct = el('div', 'explanation');
      correct.innerHTML = `<strong>Correct answer explanation</strong><p>${item.explanationCorrect || '—'}</p>`;
      explanationCard.appendChild(correct);
      (item.distractorExplanations || []).forEach((entry) => {
        const box = el('div', 'explanation');
        box.innerHTML = `<strong>${entry.label}</strong><p>${entry.text || '—'}</p>`;
        explanationCard.appendChild(box);
      });
      if (item.teachingPoint) {
        const teaching = el('div', 'explanation');
        teaching.innerHTML = `<strong>Teaching point</strong><p>${item.teachingPoint}</p>`;
        explanationCard.appendChild(teaching);
      }
      wrapper.appendChild(explanationCard);

      const avgCard = el('div', 'card');
      avgCard.appendChild(el('h3', null, 'Averaged criterion scores'));
      const scoreTable = el('table', 'score-table');
      scoreTable.innerHTML = '<thead><tr><th>Criterion</th><th>Average score</th></tr></thead>';
      const tbody = el('tbody');
      Object.entries(item.averagedCriteria || {}).forEach(([criterion, value]) => {
        const tr = el('tr');
        tr.innerHTML = `<td>${criterion}</td><td>${fmt(value)}</td>`;
        tbody.appendChild(tr);
      });
      scoreTable.appendChild(tbody);
      avgCard.appendChild(scoreTable);
      if ((item.validationErrors || []).length) {
        avgCard.appendChild(el('h4', null, 'Validation errors'));
        (item.validationErrors || []).forEach((error) => avgCard.appendChild(el('p', 'muted small', error)));
      }
      wrapper.appendChild(avgCard);

      const runsCard = el('div', 'card');
      runsCard.appendChild(el('h3', null, 'Judge run details'));
      (item.judgeRuns || []).forEach((run) => {
        const judge = el('div', 'judge-card');
        const title = el('div', 'panel-title');
        const leftTitle = el('div');
        leftTitle.appendChild(el('h4', null, `${run.judge} · seed ${run.seed}`));
        leftTitle.appendChild(el('div', 'small muted', `${run.meta?.model || 'unknown model'} · valid: ${run.valid}`));
        title.appendChild(leftTitle);
        title.appendChild(makeBadge(run.needsHumanReview ? 'Human review' : 'No review flag', run.needsHumanReview ? 'warn' : 'good'));
        judge.appendChild(title);
        if (run.globalComment) judge.appendChild(el('p', null, run.globalComment));
        if ((run.errors || []).length) {
          judge.appendChild(makeBadge('Errors present', 'bad'));
          run.errors.forEach((error) => judge.appendChild(el('p', 'small muted', error)));
        }
        if ((run.fatalFlawReasons || []).length) {
          judge.appendChild(el('h4', null, 'Fatal flaw reasons'));
          run.fatalFlawReasons.forEach((reason) => judge.appendChild(el('p', 'small muted', reason)));
        }
        const table = el('table', 'score-table');
        table.innerHTML = '<thead><tr><th>Criterion</th><th>Score</th><th>Rationale</th></tr></thead>';
        const body = el('tbody');
        (run.criterionScores || []).forEach((criterion) => {
          const tr = el('tr');
          tr.innerHTML = `<td>${criterion.criterion}</td><td>${fmt(criterion.score)}</td><td>${criterion.rationale || '—'}</td>`;
          body.appendChild(tr);
        });
        table.appendChild(body);
        judge.appendChild(table);
        runsCard.appendChild(judge);
      });
      wrapper.appendChild(runsCard);
      return wrapper;
    }

    function render() {
      renderTabs();
      const overallView = document.getElementById('overall-view');
      const modelView = document.getElementById('model-view');
      if (state.activeTab === 'overall') {
        overallView.classList.remove('hidden');
        modelView.classList.add('hidden');
        renderOverall();
      } else {
        overallView.classList.add('hidden');
        modelView.classList.remove('hidden');
        const model = data.models.find((entry) => entry.modelId === state.activeTab) || data.models[0];
        renderModelView(model);
      }
    }

    render();
  </script>
</body>
</html>
