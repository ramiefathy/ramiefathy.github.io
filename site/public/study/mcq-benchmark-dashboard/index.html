    :root {
      color-scheme: dark;
      --background: #081319;
      --foreground: #edf3f4;
      --primary: #0f766e;
      --accent: #164e63;
      --muted: #9bb0b5;
      --surface: #0f1d24;
      --surface-raised: #14262e;
      --surface-overlay: #19323b;
      --border: #27424b;
      --good: #52b788;
      --warn: #d6a13d;
      --bad: #d9736a;
      --radius: 12px;
      --radius-sm: 10px;
      --radius-lg: 16px;
      --shadow-surface: 0 1px 2px rgba(0, 0, 0, 0.24);
      --shadow-raised: 0 18px 36px rgba(0, 0, 0, 0.22);
      --shadow-overlay: 0 24px 52px rgba(0, 0, 0, 0.3);
      --font-heading: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --font-body: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--background); }
    body {
      margin: 0;
      font-family: var(--font-body);
      line-height: 1.6;
      background: var(--background);
      color: var(--foreground);
    }
    .page {
      max-width: 1560px;
      margin: 0 auto;
      padding: 24px;
    }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(220px, 0.7fr);
      gap: 18px;
      align-items: end;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-surface);
      margin-bottom: 20px;
    }
    .hero h1,
    .card h2,
    .card h3,
    .card h4,
    .section-title {
      font-family: var(--font-heading);
      color: var(--foreground);
      letter-spacing: -0.02em;
    }
    .hero h1 { margin: 0 0 8px; font-size: clamp(2rem, 3.8vw, 3.1rem); font-weight: 600; line-height: 1.05; }
    .hero p { margin: 6px 0; color: var(--muted); max-width: 68ch; }
    .tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 22px; }
    .tab {
      border: 1px solid var(--border);
      background: var(--surface-raised);
      color: var(--foreground);
      border-radius: var(--radius);
      padding: 10px 16px;
      cursor: pointer;
      transition: background-color 140ms ease-out, border-color 140ms ease-out, color 140ms ease-out;
    }
    .tab:hover, .tab:focus-visible { border-color: var(--primary); outline: none; }
    .tab.active { background: rgba(15, 118, 110, 0.16); border-color: var(--primary); color: var(--foreground); }
    .grid { display: grid; gap: 16px; }
    .kpi-grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .card {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-raised);
    }
    .card h2, .card h3, .card h4 { margin-top: 0; }
    .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
    .kpi .value { font-size: 2rem; font-weight: 600; margin-top: 6px; }
    .kpi .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .two-col { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
    .list-panel { position: sticky; top: 20px; }
    .controls { display: grid; gap: 10px; margin-bottom: 12px; }
    input, select {
      width: 100%;
      background: var(--surface-overlay);
      color: var(--foreground);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      font: inherit;
    }
    input:focus-visible, select:focus-visible, .item-button:focus-visible, .nav-row button:focus-visible {
      outline: 2px solid rgba(15, 118, 110, 0.55);
      outline-offset: 2px;
    }
    .item-list { display: grid; gap: 10px; max-height: 72vh; overflow: auto; }
    .item-button {
      text-align: left;
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface-overlay);
      color: var(--foreground);
      border-radius: var(--radius);
      padding: 12px;
      cursor: pointer;
      transition: border-color 140ms ease-out, background-color 140ms ease-out;
    }
    .item-button:hover { border-color: var(--primary); }
    .item-button.active { border-color: var(--primary); background: rgba(15, 118, 110, 0.14); }
    .item-meta { color: var(--muted); font-size: 12px; margin-top: 5px; }
    .badge-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 4px; }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: var(--radius-sm);
      padding: 5px 10px;
      font-size: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--foreground);
    }
    .badge.good { background: rgba(82, 183, 136, 0.14); color: #d7f4e7; border-color: rgba(82, 183, 136, 0.35); }
    .badge.warn { background: rgba(214, 161, 61, 0.14); color: #f8ebc8; border-color: rgba(214, 161, 61, 0.35); }
    .badge.bad { background: rgba(217, 115, 106, 0.14); color: #f9d8d5; border-color: rgba(217, 115, 106, 0.35); }
    .section-title { margin-bottom: 10px; font-size: 1.3rem; font-weight: 600; }
    .detail-grid { display: grid; gap: 16px; }
    .metric-table, .score-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .metric-table th, .metric-table td, .score-table th, .score-table td {
      border-bottom: 1px solid rgba(255,255,255,0.08);
      text-align: left;
      padding: 10px 8px;
      vertical-align: top;
    }
    .metric-table th, .score-table th { color: var(--muted); font-weight: 600; }
    .option, .explanation, .judge-card {
      background: var(--surface-overlay);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
    }
    .option.correct { border-color: rgba(82, 183, 136, 0.35); background: rgba(82, 183, 136, 0.09); }
    .distribution { display: grid; gap: 10px; }
    .bar-row { display: grid; grid-template-columns: 70px 1fr 48px; align-items: center; gap: 10px; }
    .bar-track { height: 12px; background: rgba(255,255,255,0.08); border-radius: var(--radius-sm); overflow: hidden; }
    .bar-fill { height: 100%; background: var(--primary); border-radius: var(--radius-sm); }
    .muted { color: var(--muted); }
    .hidden { display: none !important; }
    .panel-title { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
    .nav-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .nav-row button {
      border: 1px solid var(--border);
      background: var(--surface-overlay);
      color: var(--foreground);
      border-radius: var(--radius);
      padding: 10px 12px;
      cursor: pointer;
      transition: background-color 140ms ease-out, border-color 140ms ease-out;
    }
    .nav-row button:hover { border-color: var(--primary); }
    .small { font-size: 12px; }
    .footer { color: var(--muted); margin-top: 18px; font-size: 13px; }
    @media (max-width: 1080px) {
      .two-col, .hero { grid-template-columns: 1fr; }
      .list-panel { position: static; }
      .item-list { max-height: none; }
    }
  </style>

 his lower extremities. He denies fever, joint pain, or systemic symptoms. Physical examination reveals multiple 3-5 mm violaceous papules and plaques, predominantly on the distal lower legs, consistent with palpable purpura. Laboratory tests show normal renal function and a negative ANA. Given the clinical presentation, which biopsy strategy and expected histopathologic finding are most appropriate for diagnosing the likely underlying condition?", "leadIn": "The patient's presentation is most suggestive of:", "learningObjective": "Correlate palpable purpura with the optimal biopsy strategy and histopathologic pattern of leukocytoclastic vasculitis.", "correctAnswer": "B", "correctAnswerText": "Deep incisional biopsy including dermis and subcutis; leukocytoclastic vasculitis with fibrinoid necrosis.", "teachingPoint": "Palpable purpura indicates inflammation of small blood vessels in the dermis (vasculitis). Accurate diagnosis requires a deep biopsy (incisional or punch, >4mm) from an established lesion to capture vessel involvement. The hallmark histopathology is leukocytoclastic vasculitis, characterized by neutrophilic infiltrate, fibrinoid necrosis, and extravasation of red blood cells.", "explanationCorrect": "Palpable purpura strongly suggests small vessel vasculitis. The optimal biopsy technique for suspected vasculitis involves a deep incisional or punch biopsy (at least 4mm) that includes the dermis and potentially the subcutis, ideally from an established lesion (24-48 hours old) but not ulcerated. This depth is crucial to capture the involved vessels. The characteristic histopathology of leukocytoclastic vasculitis (LCV), the most common cause of palpable purpura, involves neutrophilic infiltration around and within small vessel walls (leukocytoclasis), endothelial cell swelling, fibrinoid necrosis, and extravasated red blood cells.", "options": [{"label": "A", "text": "Shallow shave biopsy; perivascular lymphocytic infiltrate."}, {"label": "B", "text": " pected in any inflammatory dermatosis that worsens or fails to respond appropriately to topical steroids, especially if annular or asymmetric.", "explanationCorrect": "The patient presents with annular plaques with central clearing and raised borders, which is characteristic of tinea corporis. However, the history of worsening after topical corticosteroid use is classic for tinea incognito, where the steroids modify the typical appearance of the fungal infection, often leading to less distinct borders, increased inflammation, pustules, and a more widespread eruption. The positive KOH preparation confirms the presence of fungus.", "options": [{"label": "A", "text": "Nummular eczema"}, {"label": "B", "text": "Tinea corporis"}, {"label": "C", "text": "Tinea incognito"}, {"label": "D", "text": "Contact dermatitis"}, {"label": "E", "text": "Psoriasis"}], "distractorExplanations": [{"label": "A", "text": "Nummular eczema typically presents as coin-shaped (nummular) plaques, often intensely pruritic and eczematous, but usually lacks the distinct annular configuration with central clearing seen here. While it can respond poorly to steroids, the KOH would be negative."}, {"label": "B", "text": "Tinea corporis is the underlying fungal infection, but the term 'tinea incognito' specifically describes the altered presentation due to corticosteroid use, which is a key feature of this vignette. Therefore, tinea incognito is a more precise diagnosis given the history."}, {"label": "C", "text": "Contact dermatitis usually presents with vesicles, bullae, or diffuse erythema and scaling in areas of contact with an allergen or irritant. While it can be pruritic and influenced by steroids, the distinct annular morphology and positive KOH are not typical."}, {"label": "D", "text": "Psoriasis typically presents as well-demarcated, erythematous plaques with silvery scales, often on extensor surfaces. Annular lesions can occur but are less common, and the positive KOH rules out psoriasis as the primary diagnosis."}, {"label": "E", "text": "Psoriasis typically presents as well-demarcated, erythematous plaques with silvery scales, often on extensor surfaces. Annular lesions can occur but are less common, and the positive KOH rules out psoriasis as the primary diagnosis."}], "judgeRuns": [{"judge": "primary", "seed": 701, "valid": false, "errors": ["json_decode"], "meta": {"usage": {"completion_tokens": 4096, "prompt_tokens": 1616, "total_tokens": 5712, "prompt_tokens_details": {"cached_tokens": 0}}, "timings": {"cache_n": 0, "prompt_n": 1616, "prompt_ms": 977.726, "prompt_per_token_ms": 0.6050284653465346, "prompt_per_second": 1652.8147967835569, "predicted_n": 4096, "predicted_ms": 48908.114, "predicted_per_token_ms": 11.94045751953125, "predicted_per_second": 83.74888469426566}, "model": "google_gemma-4-26B-A4B-it-Q4_K_M.gguf", "id": "chatcmpl-Qp01pTI7mEfGV1VBPO47QY9vZTjISdMT", "content_source": "content"}, "globalComment": null, "needsHumanReview": null, "fatalFlaw": null, "fatalFlawReasons": [], "criterionScores": []}, {"judge": "primary", "seed": 702, "valid": false, "errors": ["json_decode"], "meta": {"usage": {"completion_tokens": 4096, "prompt_tokens": 1616, "total_tokens": 5712, "prompt_tokens_details": {"cached_tokens": 1611}}, "timings": {"cache_n": 1611, "prompt_n": 5, "prompt_ms": 50.474, "prompt_per_token_ms": 10.0948, "prompt_per_second": 99.0609026429449, "predicted_n": 4096, "predicted_ms": 49706.269, "predicted_per_token_ms": 12.135319580078125, "predicted_per_second": 82.4040927312408}, "model": "google_gemma-4-26B-A4B-it-Q4_K_M.gguf", "id": "chatcmpl-yIUqYyA6vCAO5SUrgSJGEv5T8orvBfpT", "content_source": "content"}, "globalComment": null, "needsHumanReview": null, "fatalFlaw": null, "fatalFlawReasons": [], "criterionScores": []}]}, {"objectiveId": "T05-01", "phase": "pilot", "seed": 202, "sourcePath": "study/judging/generations_pilot.judged.jsonl", "superdomain": "Medical Dermatology", "difficulty": "lower_edge_board", "topic": "Hair / mmend biotin supplementation."}], "distractorExplanations": [{"label": "A", "text": "Topical minoxidil is sometimes used for TE, but it is not the first-line or most appropriate initial step, especially for a self-limiting condition like postpartum TE. Its efficacy in TE is debated, and it requires long-term use."}, {"label": "B", "text": "Oral finasteride is primarily used for androgenetic alopecia and is contraindicated in women of childbearing potential due to teratogenicity. It is not indicated for telogen effluvium."}, {"label": "C", "text": "While the hair loss is self-limiting, reassurance alone without mentioning the expected timeline or potential need for follow-up is incomplete. The correct answer provides specific reassurance about the natural course."}, {"label": "D", "text": "A scalp biopsy is indicated when scarring alopecia is suspected or the diagnosis is uncertain. This patient's presentation (diffuse non-scarring shedding) and negative workup strongly suggest TE, making a biopsy unnecessary at this point."}, {"label": "E", "text": "Biotin supplementation is often marketed for hair loss, but there is limited scientific evidence to support its efficacy in treating telogen effluvium. It is not a standard or recommended treatment."}], "judgeRuns": [{"judge": "primary", "seed": 701, "valid": true, "errors": [], "meta": {"usage": {"completion_tokens": 2932, "prompt_tokens": 1651, "total_tokens": 4583, "prompt_tokens_details": {"cached_tokens": 0}}, "timings": {"cache_n": 0, "prompt_n": 1651, "prompt_ms": 992.001, "prompt_per_token_ms": 0.6008485766202302, "prompt_per_second": 1664.3128383943163, "predicted_n": 2932, "predicted_ms": 34832.021, "predicted_per_token_ms": 11.879952592087312, "predicted_per_second": 84.17542008257287}, "model": "google_gemma-4-26B-A4B-it-Q4_K_M.gguf", "id": "chatcmpl-9O7ARXoSNVukLPxykTI2tQOIGk9Yu0HQ", "content_source": "content"}, "globalComment": "The clinical vignette, stem, and options are excellent and represent a high-qu  "Infantile atopic dermatitis typically presents between 2-6 months of age with intensely pruritic, erythematous papules and vesicles on the face (especially cheeks), scalp, and extensor surfaces. Seborrheic dermatitis usually occurs earlier, is less pruritic, involves different areas (scalp, folds, diaper area), and has greasy scales. The intense pruritus and distribution are key differentiating features in this vignette.", "explanationCorrect": "The clinical presentation is highly suggestive of infantile atopic dermatitis (eczema). Key features include the age of onset (typically 2-6 months), intense pruritus leading to fussiness and sleep disturbance, characteristic distribution involving the face (cheeks), scalp, and extensor surfaces, and morphology (erythematous papules, vesicles, weeping, crusting). While family history is often positive, its absence does not rule out AD.", "options": [{"label": "A", "text": "Seborrheic dermatitis"}, {"label": "B", "text": "Infantile atopic dermatitis"}, {"label": "C", "text": "Contact dermatitis"}, {"label": "D", "text": "Scabies"}, {"label": "E", "text": "Psoriasis"}], "distractorExplanations": [{"label": "A", "text": "Seborrheic dermatitis typically presents earlier (first few weeks of life), involves the scalp ('cradle cap'), face (eyebrows, nasolabial folds), diaper area, and intertriginous areas. It is usually less pruritic than AD and often has greasy scales rather than vesicles or intense weeping."}, {"label": "B", "text": "Contact dermatitis is possible but less likely given the widespread distribution and morphology. A specific allergen or irritant would need to be identified, and the pattern is often more localized or follows lines of contact."}, {"label": "C", "text": "Scabies in infants can present with eczematous lesions, including papules, vesicles, and burrows, often involving palms, soles, and interdigital areas, but typically presents with intense pruritus, especially at night, and often affects multiple family members. The distribution described is less typical for infantile scabies."}, {"label": "D", "text": "Infantile psoriasis is rare and typically presents as well-demarcated, erythematous plaques, often in the diaper area (napkin psoriasis) or intertriginous areas, sometimes with silvery scales. Vesicles and intense pruritus are less common than in AD."}, {"label": "E", "text": "Psoriasis"}], "judgeRuns": [{"judge": "primary", "seed": 701, "valid": true, "errors": [], "meta": {"usage": {"completion_tokens": 2847, "prompt_tokens": 1598, "total_tokens": 4445, "prompt_tokens_details": {"cached_tokens": 0}}, "timings": {"cache_n": 0, "prompt_n": 1598, "prompt_ms": 900.3, "prompt_per_token_ms": 0.5633917396745932, "prompt_per_second": 1774.963900921915, "predicted_n": 2847, "predicted_ms": 33141.988, "predicted_per_token_ms": 11.64102142606252, "predicted_per_second": 85.90311480409686}, "model": "google_gemma-4-26B-A4B-it-Q4_K_M.gguf", "id": "chatcmpl-3a7G0WkiSgOLHSPDMsAfWk23BGe8XsaF", "content_source": "content"}, "globalComment": "The clinical vignette and the correct answer are excellent and medically accurate. However, the item has a fatal flaw in the explanation section: the 'explanation_distractors' object is misaligned with the 'options' object. Specifically, the explanation for B describes option C, the explanation for C describes option D, and the explanation for D describes option E. This makes the explanation logically inconsistent and incorrect relative to the keyed answer.", "needsHumanReview": true, "fatalFlaw": true, "fatalFlawReasons": ["explanation contradicts the keyed answer"], "criterionScores": [{"criterion": "accuracy_key_correctness", "score": 3, "rationale": "The keyed answer (B: Infantile atopic dermatitis) is medically correct for the clinical vignette provided."}, {"criterion": "single_best_answer_integrity", "score": 4, "rationale": "There is only one clearly best answer based on the clinical presentation."}, {"criterion": "stem_clarity_suf nfection"}, {"label": "B", "text": "Allergic contact dermatitis to mupirocin"}, {"label": "C", "text": "Delayed wound healing"}, {"label": "D", "text": "Erythema multiforme"}, {"label": "E", "text": "Recurrent basal cell carcinoma"}], "distractorExplanations": [{"label": "A", "text": "Surgical site infection typically presents with increasing pain, erythema, warmth, purulent drainage, and potentially systemic symptoms like fever. This patient lacks these key features."}, {"label": "B", "text": "While ACD is the most likely diagnosis, this option is the correct answer."}, {"label": "C", "text": "Delayed wound healing usually manifests as slow granulation tissue formation or epithelialization, not acute eczematous changes with intense itching and vesiculation."}, {"label": "D", "text": "Erythema multiforme typically involves targetoid lesions, often affecting mucous membranes and extremities, and is not usually localized solely to a surgical site in this manner."}, {"label": "E", "text": "Recurrent basal cell carcinoma would present as new or growing nodule or ulceration within the scar, not an acute eczematous reaction around the suture line."}], "judgeRuns": [{"judge": "primary", "seed": 701, "valid": true, "errors": [], "meta": {"usage": {"completion_tokens": 1538, "prompt_tokens": 1543, "total_tokens": 3081, "prompt_tokens_details": {"cached_tokens": 0}}, "timings": {"cache_n": 0, "prompt_n": 1543, "prompt_ms": 1064.548, "prompt_per_token_ms": 0.6899209332469216, "prompt_per_second": 1449.4414530861925, "predicted_n": 1538, "predicted_ms": 20686.176, "predicted_per_token_ms": 13.450049414824447, "predicted_per_second": 74.3491692229632}, "model": "google_gemma-4-26B-A4B-it-Q4_K_M.gguf", "id": "chatcmpl-elBvQKzw1iqESyJrR2gy5IQieG7breGS", "content_source": "content"}, "globalComment": "This is a high-quality, well-written MCQ. The stem provides the precise clinical nuances (itching/vesicles vs. pain/purulence) necessary to make the question a fair test of knowledge er": 4.0, "explanation_distractors": 4.0, "dermatology_specificity_educational_value": 4.0, "technical_flaws_safety_originality": 4.0}, "stem": "A 65-year-old man presents with multiple erythematous papules and plaques on his chest, consistent with actinic keratoses. He desires treatment but is concerned about potential side effects. When discussing laser options, the dermatologist explains the underlying principle guiding laser selection for specific targets. Which of the following best describes the fundamental mechanism that allows lasers to selectively target chromophores within skin structures while minimizing damage to surrounding tissue?", "leadIn": "The fundamental principle guiding laser therapy is:", "learningObjective": "Identify the mechanistic principle of selective photothermolysis that explains why different lasers treat different lesions.", "correctAnswer": "A", "correctAnswerText": "Selective absorption of light energy by specific chromophores, leading to thermal destruction.", "teachingPoint": "Selective photothermolysis is the foundational principle of laser therapy, dictating that the choice of laser wavelength must match the absorption spectrum of the target chromophore (e.g., melanin in pigmented lesions, hemoglobin in vascular lesions, water in ablative procedures) to achieve selective tissue destruction while minimizing collateral damage.", "explanationCorrect": "Selective photothermolysis is the core principle of laser therapy. It relies on the differential absorption of specific wavelengths of light by target chromophores (e.g., melanin, hemoglobin, water) within tissues. When a laser with a wavelength that is strongly absorbed by the target chromophore is applied, the energy is converted to heat, causing thermal damage or destruction of the targeted structure while sparing surrounding tissue that does not absorb the specific wavelength as efficiently.", "options": [{"label": "A", "text": "Selective absorption of light energy by specific chromophores, leading to thermal destruction."}, {"label": "B", "text": "Generation of reactive oxygen species that selectively damage neoplastic cells."}, {"label": "C", "text": "Coagulation of dermal blood vessels, causing ischemic necrosis of overlying epidermis."}, {"label": "D", "text": "Stimulation of fibroblast proliferation and collagen synthesis through controlled thermal injury."}, {"label": "E", "text": "Photochemical reaction between the laser energy and endogenous porphyrins within the target tissue."}], "distractorExplanations": [{"label": "A", "text": "This describes selective photothermolysis, the correct mechanism. It highlights the key elements: selective absorption by chromophores and subsequent thermal effect."}, {"label": "B", "text": "This describes photodynamic therapy (PDT), not selective photothermolysis. PDT involves a photosensitizer drug that is activated by light to generate reactive oxygen species."}, {"label": "C", "text": "This describes the mechanism of pulsed dye lasers (PDL) primarily used for vascular lesions, but it's not the *fundamental* principle applicable to all laser treatments targeting different chromophores like melanin or water. It focuses on a specific application rather than the general principle."}, {"label": "D", "text": "This describes the mechanism behind ablative and some non-ablative fractional lasers used for skin resurfacing and scar treatment, focusing on stimulating wound healing. It is not the primary mechanism for targeting specific chromophores in lesions like AKs or vascular malformations."}, {"label": "E", "text": "This describes photodynamic therapy (PDT) using photosensitizers like porphyrins, activated by light, typically red light, to generate cytotoxic reactive oxygen species. This is distinct from selective photothermolysis."}], "judgeRuns": [{"judge": "primary", "seed": 701, "valid": true, "errors": [], "meta": {"usage": {"completion_tokens": 2114, "prompt_tokens": 1599, "total_tokens": 3713, "prom hingPoint": "Spongiosis (intercellular edema in the epidermis) is the hallmark histological feature of eczematous dermatitis. Recognizing this pattern allows correlation with various clinical presentations like allergic contact dermatitis, irritant contact dermatitis, atopic dermatitis, and dyshidrotic eczema, each having a specific differential diagnosis.", "explanationCorrect": "The clinical presentation (acute onset, pruritic papules/vesicles on hands/feet after exposure to a new product) combined with the histopathology (marked spongiosis, intraepidermal vesicles, mild superficial perivascular infiltrate with eosinophils) is classic for eczematous dermatitis, specifically acute allergic contact dermatitis. Dyshidrotic eczema (pompholyx) presents similarly clinically and histologically, making it a key differential.", "options": [{"label": "A", "text": "Eczematous dermatitis, likely allergic contact dermatitis; differential includes dyshidrotic eczema."}, {"label": "B", "text": "Psoriasiform dermatitis, likely plaque psoriasis; differential includes seborrheic dermatitis."}, {"label": "C", "text": "Interface dermatitis, likely lichen planus; differential includes lupus erythematosus."}, {"label": "D", "text": "Lichenoid dermatitis, likely drug eruption; differential includes graft-versus-host disease."}, {"label": "E", "text": "Bullous pemphigoid, likely autoimmune blistering disease; differential includes epidermolysis bullosa acquisita."}], "distractorExplanations": [{"label": "A", "text": "This is the correct answer, correlating clinical and histological findings."}, {"label": "B", "text": "Psoriasiform dermatitis is characterized by epidermal hyperplasia (acanthosis), parakeratosis, Munro's microabscesses, and dilated capillaries in dermal papillae, not marked spongiosis. Psoriasis typically presents as well-demarcated erythematous plaques with silvery scale."}, {"label": "C", "text": "Interface dermatitis involves inflammation at the dermoepidermal junction, often with vacuolar alteration of basal cells and a band-like lymphocytic infiltrate. This pattern is seen in lichen planus and lupus, which have different clinical presentations (e.g., violaceous papules, discoid lesions)."}, {"label": "D", "text": "Lichenoid dermatitis features interface changes similar to lichen planus, often with apoptotic keratinocytes (Civatte bodies). While drug eruptions can cause various patterns, this specific histology doesn't fit a typical lichenoid reaction."}, {"label": "E", "text": "Bullous pemphigoid is characterized by subepidermal blistering with eosinophils and neutrophils. The biopsy finding of intraepidermal vesicles and spongiosis rules out bullous pemphigoid."}], "judgeRuns": [{"judge": "primary", "seed": 701, "valid": false, "errors": ["json_decode"], "meta": {"usage": {"completion_tokens": 2048, "prompt_tokens": 1624, "total_tokens": 3672, "prompt_tokens_details": {"cached_tokens": 0}}, "timings": {"cache_n": 0, "prompt_n": 1624, "prompt_ms": 896.499, "prompt_per_token_ms": 0.5520314039408867, "prompt_per_second": 1811.4911449984886, "predicted_n": 2048, "predicted_ms": 23310.709, "predicted_per_token_ms": 11.38218212890625, "predicted_per_second": 87.85661560100982}, "model": "google_gemma-4-26B-A4B-it-Q4_K_M.gguf", "id": "chatcmpl-8WAFpcdJIG1Vx4K0x6BNaMxrCGXVWIrn", "content_source": "content"}, "globalComment": null, "needsHumanReview": null, "fatalFlaw": null, "fatalFlawReasons": [], "criterionScores": []}, {"judge": "primary", "seed": 702, "valid": true, "errors": [], "meta": {"usage": {"completion_tokens": 1894, "prompt_tokens": 1624, "total_tokens": 3518, "prompt_tokens_details": {"cached_tokens": 1623}}, "timings": {"cache_n": 1623, "prompt_n": 1, "prompt_ms": 26.31, "prompt_per_token_ms": 26.31, "prompt_per_second": 38.00836183960472, "predicted_n": 1894, "predicted_ms": 21567.349, "predicted_per_token_ms": 11.387195881731783, "predicted_per_second": 87.8179325609281}, "model": "google_gemma-4-26B-A4B-it-Q4_K_M.gguf  patient's tachycardia, hypotension, hypoalbuminemia, and subjective chills indicate hemodynamic instability and severe fluid/electrolyte/protein depletion. The safest immediate disposition is admission to the intensive care unit (ICU) for aggressive intravenous fluid resuscitation, electrolyte management, and active warming to prevent cardiovascular collapse. Stabilization of the patient's hemodynamic status takes precedence over initiating specific psoriasis therapies.", "options": [{"label": "A", "text": "Admit to a medical ward and initiate systemic corticosteroids"}, {"label": "B", "text": "Transfer to the intensive care unit for aggressive fluid resuscitation and active warming"}, {"label": "C", "text": "Initiate topical tacrolimus twice daily and discharge with close outpatient follow-up"}, {"label": "D", "text": "Start intravenous methotrexate after obtaining baseline renal and hepatic function tests"}, {"label": "E", "text": "Apply cool compresses and administer oral antihistamines for symptomatic relief"}], "distractorExplanations": [{"label": "A", "text": "Systemic corticosteroids are generally contraindicated in psoriasis due to the high risk of precipitating pustular psoriasis or causing severe rebound flares upon tapering. Furthermore, a medical ward may not provide the intensive monitoring required for hemodynamically unstable patients."}, {"label": "B", "text": "This is the correct answer. ICU admission allows for close hemodynamic monitoring, aggressive fluid and protein replacement, and temperature regulation, which are critical first steps before addressing the underlying dermatosis."}, {"label": "C", "text": "Topical therapies like tacrolimus are impractical and insufficient for erythrodermic psoriasis covering >90% of the body. Discharging a hemodynamically unstable patient with massive fluid loss and skin barrier failure is unsafe."}, {"label": "D", "text": "While systemic therapies like methotrexate or cyclosporine are used for erythrodermic p iginality": 4.0}, "stem": "A 42-year-old man presents with a diffuse, pruritic rash that began 10 days ago. He started trimethoprim-sulfamethoxazole for a urinary tract infection 14 days ago. He reports low-grade fevers and mild fatigue but no mucosal involvement, blistering, or targetoid lesions. Examination reveals a widespread morbilliform eruption on his trunk and extremities, with tender cervical lymphadenopathy. Laboratory studies show an absolute eosinophil count of 1,200/μL and an elevated alanine aminotransferase level of 85 U/L. Renal function is normal.", "leadIn": "Which of the following is the most likely diagnosis?", "learningObjective": "Differentiate DRESS from an uncomplicated morbilliform drug eruption in a recently medicated patient.", "correctAnswer": "B", "correctAnswerText": "DRESS syndrome", "teachingPoint": "DRESS syndrome is distinguished from an uncomplicated morbilliform drug eruption by the presence of systemic features, including prolonged latency (2-8 weeks), fever, lymphadenopathy, hematologic abnormalities (eosinophilia/atypical lymphocytosis), and internal organ involvement (most commonly hepatitis).", "explanationCorrect": "The correct answer is DRESS (Drug Reaction with Eosinophilia and Systemic Symptoms) syndrome. This patient's presentation is classic for DRESS: a morbilliform rash appearing 2 to 8 weeks after initiating a high-risk medication (trimethoprim-sulfamethoxazole), accompanied by systemic symptoms (fever, fatigue), lymphadenopathy, hematologic abnormalities (eosinophilia), and internal organ involvement (hepatitis). The combination of cutaneous findings with multisystem involvement distinguishes DRESS from a simple morbilliform eruption.", "options": [{"label": "A", "text": "Acute generalized exanthematous pustulosis"}, {"label": "B", "text": "DRESS syndrome"}, {"label": "C", "text": "Morbilliform drug eruption"}, {"label": "D", "text": "Serum sickness-like reaction"}, {"label": "E", "text": "Stevens-Johnson syndrome"} ic of trichillomania."}, {"label": "B", "text": "Tinea capitis usually presents with scaling, erythema, pustules, or kerion formation. Hair shafts are typically broken at the scalp surface (black dots) due to fungal invasion, rather than varying lengths of broken hairs protruding from the follicle."}, {"label": "C", "text": "Trichotillomania is characterized by broken hairs of varying lengths. The description provided matches this condition perfectly."}, {"label": "D", "text": "Discoid lupus erythematosus is a scarring alopecia. It typically presents with erythematous, scaly plaques that progress to atrophy, follicular plugging, and dyspigmentation. The normal-appearing scalp skin in this vignette rules out DLE."}, {"label": "E", "text": "Syphilitic alopecia classically presents as a 'moth-eaten' appearance with multiple small, irregular patches of hair loss rather than a single well-circumscribed patch. It is also typically associated with other systemic signs of secondary syphilis, which are absent here."}], "judgeRuns": [{"judge": "primary", "seed": 701, "valid": true, "errors": [], "meta": {"usage": {"prompt_tokens": 1578, "completion_tokens": 410, "total_tokens": 1988}, "timings": null, "model": "gemma3:27b", "id": "chatcmpl-221", "content_source": "content"}, "globalComment": "Excellent item. Well-written, clinically relevant, and educationally sound.", "needsHumanReview": false, "fatalFlaw": false, "fatalFlawReasons": [], "criterionScores": [{"criterion": "accuracy_key_correctness", "score": 4, "rationale": "Keyed answer and explanation are medically accurate and consistent."}, {"criterion": "single_best_answer_integrity", "score": 4, "rationale": "There is one clear best answer based on the clinical vignette."}, {"criterion": "stem_clarity_sufficiency", "score": 4, "rationale": "Stem is clear, concise, and provides sufficient information to answer the question."}, {"criterion": "distractor_quality_homogeneity", "score": 3, "rationale": "Distractors are gener orrect_answer": 4.0, "explanation_distractors": 4.0, "dermatology_specificity_educational_value": 4.0, "technical_flaws_safety_originality": 4.0}, "stem": "A 28-year-old woman presents with a 3-day history of intensely pruritic, erythematous, and edematous rash involving her scalp, posterior neck, eyelids, and ears after applying a new brand of temporary black hair dye for the first time. She reports mild stinging during application but denies severe burning or blistering. Physical examination shows well-demarcated erythema and papules on the hairline, posterior neck, and preauricular areas. The scalp itself shows mild erythema without significant scaling or crusting. She has no history of atopic dermatitis or prior reactions to hair products.", "leadIn": "Which of the following mechanisms is most likely responsible for this patient's presentation?", "learningObjective": "Differentiate allergic contact dermatitis to para-phenylenediamine from irritant dermatitis in a hair-dye reaction.", "correctAnswer": "B", "correctAnswerText": "T-cell-mediated hypersensitivity reaction to a hapten", "teachingPoint": "Allergic contact dermatitis to hair dye (typically PPD) is a Type IV delayed hypersensitivity reaction characterized by intense pruritus and eczematous changes in areas of contact, whereas irritant contact dermatitis typically presents with burning/stinging and signs of direct tissue damage like scaling or fissuring.", "explanationCorrect": "This patient's presentation is classic for allergic contact dermatitis (ACD) to para-phenylenediamine (PPD), a common sensitizer in hair dyes. PPD acts as a hapten that penetrates the stratum corneum, binds to skin proteins, and is recognized by Langerhans cells. This triggers a type IV delayed-type hypersensitivity reaction mediated by sensitized T-lymphocytes, resulting in the characteristic pruritic, eczematous eruption seen days after exposure. The distribution involving areas of high dye contact (hairline, neck, ears) and the delayed onset support this diagnosis.", "options": [{"label": "A", "text": "Direct cytotoxic damage to keratinocytes by oxidative chemicals"}, {"label": "B", "text": "T-cell-mediated hypersensitivity reaction to a hapten"}, {"label": "C", "text": "IgE-mediated mast cell degranulation upon UV exposure"}, {"label": "D", "text": "Complement activation by immune complex deposition"}, {"label": "E", "text": "Barrier disruption leading to non-specific inflammatory mediator release"}], "distractorExplanations": [{"label": "A", "text": "Direct cytotoxic damage describes irritant contact dermatitis (ICD). ICD typically presents with burning or stinging rather than intense pruritus, and often shows more scaling, fissuring, or erosions. While hair dyes can be irritating, the intense pruritus and classic distribution in a first-time user strongly favor ACD."}, {"label": "B", "text": "This is the correct answer. T-cell-mediated hypersensitivity to PPD causes ACD."}, {"label": "C", "text": "IgE-mediated reactions (Type I) occur rapidly, typically within minutes to hours, and present with urticaria or angioedema rather than eczematous plaques. Phototoxic reactions (often confused with photoallergic) are mediated by non-IgE mechanisms and typically resemble severe sunburn in sun-exposed areas."}, {"label": "D", "text": "Complement activation by immune complexes describes Type III hypersensitivity reactions, such as serum sickness or leukocytoclastic vasculitis. These present with palpable purpura, systemic symptoms, or arthritis, not localized eczematous dermatitis."}, {"label": "E", "text": "Non-specific inflammatory mediator release from barrier disruption is the primary mechanism of irritant contact dermatitis. While some irritation occurs with hair dyes, the clinical picture here is dominated by allergic sensitization rather than simple barrier damage."}], "judgeRuns": [{"judge": "primary", "seed": 701, "valid": true, "errors": [], "meta": {"usage": {"completion_tokens": 2663 ent."}, {"criterion": "single_best_answer_integrity", "score": 4, "rationale": "There is only one correct mechanism for the clinical presentation described (ACD). While A and E describe mechanisms of irritant contact dermatitis, they do not match the pruritic, delayed-onset clinical picture provided."}, {"criterion": "stem_clarity_sufficiency", "score": 4, "rationale": "The stem provides all necessary clinical clues to differentiate ACD from ICD: intense pruritus (vs. burning), delayed onset (3 days), and classic distribution (eyelids, ears, hairline)."}, {"criterion": "distractor_quality_homogeneity", "score": 4, "rationale": "The distractors are high-quality, representing different types of hypersensitivity or contact dermatitis mechanisms (Type I, Type III, ICD), making them plausible to an unknowledgeable examinee."}, {"criterion": "board_style_authenticity_application", "score": 4, "rationale": "The item follows the standard board format of presenting a clinical vignette and asking for the underlying pathophysiology/mechanism rather than a simple diagnosis."}, {"criterion": "difficulty_discrimination", "score": 4, "rationale": "The question appropriately targets the ability to distinguish between ACD and ICD, a fundamental concept that separates competent candidates from weaker ones."}, {"criterion": "explanation_correct_answer", "score": 4, "rationale": "The explanation clearly links the clinical findings to the mechanism of PPD acting as a hapten in a Type IV reaction."}, {"criterion": "explanation_distractors", "score": 4, "rationale": "Each distractor is correctly addressed and differentiated from the correct answer."}, {"criterion": "dermatology_specificity_educational_value", "score": 4, "rationale": "The item is highly specific to dermatology and addresses a high-yield clinical scenario."}, {"criterion": "technical_flaws_safety_originality", "score": 4, "rationale": "No technical flaws or safety issues identified."}]}]}, {"objectiveId": "T06-01", "phase": "pilot", "seed": 202, "sourcePath": "study/judging/generations_pilot.judged.jsonl", "superdomain": "Medical Dermatology", "difficulty": "lower_edge_board", "topic": "Contact / occupational / photoderm / therapeutics / systemic overlap", "subtopic": "Contact / occupational / photoderm / therapeutics / systemic overlap", "itemArchetype": "Diagnosis / best diagnosis", "formatFailure": false, "repairAttempted": false, "validationErrors": [], "score": 100.0, "status": "scored", "judgeFailure": false, "needsAdjudication": false, "fatal": false, "spread": 0.0, "ready85": true, "usable70": true, "averagedCriteria": {"accuracy_key_correctness": 4.0, "single_best_answer_integrity": 4.0, "stem_clarity_sufficiency": 4.0, "distractor_quality_homogeneity": 4.0, "board_style_authenticity_application": 4.0, "difficulty_discrimination": 4.0, "explanation_correct_answer": 4.0, "explanation_distractors": 4.0, "dermatology_specificity_educational_value": 4.0, "technical_flaws_safety_originality": 4.0}, "stem": "A 34-year-old woman presents with severe pruritus and erythema involving her eyelids, ears, posterior neck, and face. She reports applying a new permanent black hair dye 48 hours ago to cover her gray roots. The scalp skin itself appears relatively spared, though there is mild redness at the hairline where the dye may have dripped. She has no history of eczema or prior reactions to hair products. On examination, there is well-demarcated erythema with scattered vesicles and crusting on the exposed areas, while the hair-bearing scalp is clinically normal. She denies recent use of new soaps or lotions.", "leadIn": "Which of the following is the most likely diagnosis?", "learningObjective": "Differentiate allergic contact dermatitis to para-phenylenediamine from irritant dermatitis in a hair-dye reaction.", "correctAnswer": "A", "correctAnswerText": "Allergic contact dermatitis to para-phenylenediamine", "teachingPoint": "Allergic contact dermatitis to para-phenylenediamine in permanent hair dyes characteristically involves exposed areas (eyelids, ears, posterior neck) due to dripping or spreading of the dye, while sparing the hair-bearing scalp where direct contact is prevented by hair shafts. Differentiating this from irritant dermatitis relies on the distribution, presence of vesicles, and intense pruritus.", "explanationCorrect": "The clinical presentation is classic for allergic contact dermatitis (ACD) to para-phenylenediamine (PPD), the most common sensitizer in permanent hair dyes. ACD typically affects exposed areas (eyelids, ears, posterior neck) where the dye may drip or spread, while sparing the scalp where the hair shaft protects against direct contact. The presence of pruritus and vesicles further supports an allergic etiology over irritation.", "options": [{"label": "A", "text": "Allergic contact dermatitis to para-phenylenediamine"}, {"label": "B", "text": "Irritant contact dermatitis from hair dye"}, {"label": "C", "text": "Phototoxic reaction to hair dye ingredients"}, {"label": "D", "text": "Seborrheic dermatitis exacerbated by hair product"}, {"label": "E", "text": "Acute allergic contact dermatitis to thioglycolate"}], "distractorExplanations": [{"label": "A", "text": "Allergic contact dermatitis to para-phenylenediamine is the correct diagnosis. The sparing of the scalp and involvement of exposed areas with vesicles strongly supports PPD ACD."}, {"label": "B", "text": "Irritant contact dermatitis (ICD) usually presents with burning or stinging rather than intense pruritus and typically affects the area of direct contact (the scalp) more than exposed skin. ICD is less likely to cause vesiculation and severe facial involvement without significant scalp disease."}, {"label": "C", "text": "Phototoxic reactions require light exposure and typically present with exaggerated sunburn-like erythema in photodistributed areas. While PPD can cause photoallergy, the distribution here (eyelids, ears) is more consistent with direct contact from dripping dye rather than a photodistribution."}, {"label": "D", "text": "Seborrheic dermatitis typically involves the scalp, eyebrows, nasolabial folds, and retroauricular areas with greasy scales. It does not typically present acutely after hair dye use, nor does it spare the scalp while affecting other seborrheic areas."}, {"label": "E", "text": "Thioglycolate is a reducing agent used in hair *removal* (depilatory) creams, not permanent hair dyes. This patient used a dye to cover gray roots, making exposure to thioglycolate highly unlikely."}], "judgeRuns": [{"judge": "primary", "seed": 701, "valid": true, "errors": [], "meta": {"usage": {"completion_tokens": 2674, "prompt_tokens": 1646, "total_tokens": 4320, "prompt_tokens_details": {"cached_tokens": 0}}, "timings": {"cache_n": 0, "prompt_n": 1646, "prompt_ms": 620.271, "prompt_per_token_ms": 0.37683535844471444, "prompt_per_second": 2653.678795236276, "predicted_n": 2674, "predicted_ms": 27422.518, "predicted_per_token_ms": 10.255242333582649, "predicted_per_second": 97.51110383080065}, "model": "google_gemma-4-26B-A4B-it-Q4_K_M.gguf", "id": "chatcmpl-XgQBUUYLZxHR9DMiFBU9TTQWJW2L9xHF", "content_source": "content"}, "globalComment": "This is an excellent, high-quality MCQ. It uses the classic 'dripping dye' distribution pattern to test the ability to differentiate Allergic Contact Dermatitis from Irritant Contact Dermatitis, which is a high-yield topic for dermatology boards.", "needsHumanReview": false, "fatalFlaw": false, "fatalFlawReasons": [], "criterionScores": [{"criterion": "accuracy_key_correctness", "score": 4, "rationale": "The keyed answer is correct. PPD is the most common sensitizer in permanent hair dyes, and the clinical presentation (pruritus, vesicles, and specific distribution) is pathognomonic for ACD in this context."}, {"criterion": "single_best_answer_integrity", "score": 4, "rationale": "There is only one best answer. The distinction between ACD and ICD is clearly provided via the tterns (distribution and morphology) to differentiate between similar-looking conditions (ACD vs ICD)."}, {"criterion": "difficulty_discrimination", "score": 4, "rationale": "The question is appropriately calibrated for the lower edge of board difficulty. It rewards the student who knows the specific 'dripping' pattern of PPD ACD."}, {"criterion": "explanation_correct_answer", "score": 4, "rationale": "The explanation clearly links the clinical findings (distribution and pruritus) to the correct diagnosis."}, {"criterion": "explanation_distractors", "score": 4, "rationale": "Each distractor is thoroughly and correctly addressed, explaining why the clinical presentation does not fit."}, {"criterion": "dermatology_specificity_educational_value", "score": 4, "rationale": "The item is highly specific to dermatology and addresses a high-yield clinical scenario."}, {"criterion": "technical_flaws_safety_originality", "score": 4, "rationale": "No technical flaws or safety issues identified."}]}]}, {"objectiveId": "T06-08", "phase": "pilot", "seed": 101, "sourcePath": "study/judging/generations_pilot.judged.jsonl", "superdomain": "Medical Dermatology", "difficulty": "standard_board", "topic": "Contact / occupational / photoderm / therapeutics / systemic overlap", "subtopic": "Contact / occupational / photoderm / therapeutics / systemic overlap", "itemArchetype": "Mechanism / prognosis / discriminating feature", "formatFailure": false, "repairAttempted": false, "validationErrors": [], "score": 98.75, "status": "scored", "judgeFailure": false, "needsAdjudication": false, "fatal": false, "spread": 0.0, "ready85": true, "usable70": true, "averagedCriteria": {"accuracy_key_correctness": 4.0, "single_best_answer_integrity": 4.0, "stem_clarity_sufficiency": 4.0, "distractor_quality_homogeneity": 4.0, "board_style_authenticity_application": 4.0, "difficulty_discrimination": 4.0, "explanation_correct_answer": 4.0, "explanation_distractors": 3.0, "dermatology_specificity_educational_value": 4.0, "technical_flaws_safety_originality": 4.0}, "stem": "A 42-year-old landscaper presents with an intensely pruritic, eczematous eruption on his face and dorsal hands after starting a new sunscreen containing octocrylene three weeks ago. The rash initially appeared as widespread erythema and edema but has evolved into well-demarcated, vesicular plaques. The lesions are confined to sun-exposed areas but notably extend beyond the borders of where the sunscreen was applied, including the V-neck and ears. He denies taking any new systemic medications or supplements.", "leadIn": "Which of the following mechanisms best explains this patient's presentation?", "learningObjective": "Differentiate photoallergic dermatitis from phototoxicity using timing, morphology, and distribution.", "correctAnswer": "B", "correctAnswerText": "Type IV hypersensitivity reaction requiring prior sensitization to a photochemical antigen", "teachingPoint": "Photoallergic contact dermatitis is a type IV hypersensitivity reaction characterized by pruritus, eczematous morphology, delayed onset after sensitization, and a distribution that may extend beyond the application site. In contrast, phototoxicity is a non-immunologic, dose-dependent reaction resembling a sunburn that occurs rapidly and is strictly confined to the area of contact.", "explanationCorrect": "This patient's presentation is classic for photoallergic contact dermatitis. Key discriminating features include the intense pruritus, eczematous morphology (vesicular plaques), delayed onset (appearing after weeks of exposure, implying prior sensitization), and the distribution extending beyond the exact application site (due to UV activation of the allergen spreading or cross-reactivity). Photoallergy is a type IV delayed hypersensitivity reaction where the chemical acts as a hapten upon UV exposure, creating an antigen that triggers T-cell-mediated inflammation.", "options": [{"label": "A", "text": "Direct cytotoxic damage to keratinocytes by UV-absorbed chemical energy"}, {"label": "B", "text": "Type IV hypersensitivity reaction requiring prior sensitization to a photochemical antigen"}, {"label": "C", "text": "Immune-complex deposition in dermal blood vessels following UV exposure"}, {"label": "D", "text": "Autoantibody-mediated cleavage of hemidesmosomes triggered by solar radiation"}, {"label": "E", "text": "Direct inhibition of DNA repair enzymes by UV-induced free radicals"}], "distractorExplanations": [{"label": "A", "text": "This describes phototoxicity. Phototoxic reactions are non-immunologic, dose-dependent, and typically occur within hours to days of exposure. They present with burning pain rather than pruritus, resemble a severe sunburn (erythema, edema, sometimes bullae), and are strictly confined to the area of chemical application. The delayed onset and pruritic, eczematous nature in this case rule this out."}, {"label": "B", "text": "Correct answer. (No explanation needed here as it's the correct one, but the prompt asks for explanations for distractors. I will leave B empty or put a placeholder if required, but the schema implies explaining why distractors are wrong. I will follow standard practice: explain correct, then distractors."}, {"label": "C", "text": "This describes leukocytoclastic vasculitis or a serum sickness-like reaction, not a primary photodermatosis. While some drug eruptions can cause vasculitis, the clinical picture of eczema on sun-exposed skin is distinct. Vasculitis typically presents with palpable purpura, not vesicular eczema."}, {"label": "D", "text": "This describes epidermolysis bullosa acquisita or bullous pemphigoid, which are autoimmune blistering diseases. They do not present as eczematous eruptions strictly confined to sun-exposed areas with this specific timeline and morphology."}, {"label": "E", "text": "This describes the mechanism of UV-induced DNA damage leading to mutations or sunburn cell formation, but it does not account for the specific hypersensitivity response (pruritus, eczema) seen in photoallergy. It is a component of phototoxicity and carcinogenesis but not the primary mechanism for this allergic presentation."}], "judgeRuns": [{"judge": "primary", "seed": 701, "valid": false, "errors": ["json_decode"], "meta": {"usage": {"completion_tokens": 2048, "prompt_tokens": 1728, "total_tokens": 3776, "prompt_tokens_details": {"cached_tokens": 0}}, "timings": {"cache_n": 0, "prompt_n": 1728, "prompt_ms": 1550.87, "prompt_per_token_ms": 0.897494212962963, "prompt_per_second": 1114.2133125278071, "predicted_n": 2048, "predicted_ms": 21903.394, "predicted_per_token_ms": 10.6950166015625, "predicted_per_second": 93.50149113877055}, "model": "google_gemma-4-26B-A4B-it-Q4_K_M.gguf", "id": "chatcmpl-e4EcBFllvHsNPp3gnWr76gZx8og5eXE9", "content_source": "content"}, "globalComment": null, "needsHumanReview": null, "fatalFlaw": null, "fatalFlawReasons": [], "criterionScores": []}, {"judge": "primary", "seed": 702, "valid": true, "errors": [], "meta": {"usage": {"completion_tokens": 2004, "prompt_tokens": 1728, "total_tokens": 3732, "prompt_tokens_details": {"cached_tokens": 1727}}, "timings": {"cache_n": 1727, "prompt_n": 1, "prompt_ms": 12.737, "prompt_per_token_ms": 12.737, "prompt_per_second": 78.51142341210647, "predicted_n": 2004, "predicted_ms": 21591.207, "predicted_per_token_ms": 10.774055389221557, "predicted_per_second": 92.81556144591639}, "model": "google_gemma-4-26B-A4B-it-Q4_K_M.gguf", "id": "chatcmpl-WH6AjtV64NyyZYhlEEd1man9ctrm8RwQ", "content_source": "content"}, "globalComment": "This is an excellent, high-quality board-style question. It uses subtle but definitive clinical clues (pruritus vs. burning, eczema vs. sunburn, and distribution) to force a distinction between two commonly confused dermatologic entities. The only minor issue is the presence of meta-text within the explanation for option B.", "needsHumanReview": false, "fatalFlaw": false, "fatalFlawReasons": [], "criterionScores": [{"criterion": "accuracy_key_correctness", "score": 4, "rationale": "The keyed answer is correct. Octocrylene is a known photoallergen, and the clinical description (pruritus, eczema, delayed onset, and distribution extending beyond the application site) perfectly matches a Type IV photoallergic reaction."}, {"criterion": "single_best_answer_integrity", "score": 4, "rationale": "There is only one correct mechanism provided for the specific clinical presentation described."}, {"criterion": "stem_clarity_sufficiency", "score": 4, "rationale": "The stem provides all necessary clinical clues: the specific trigger (octocrylene), the timing (3 weeks), the morphology (vesicular/eczematous), the symptom (pruritus), and the distribution (extending beyond application site), which are essential to differentiate photoallergy from phototoxicity."}, {"criterion": "distractor_quality_homogeneity", "score": 4, "rationale": "The distractors are all plausible dermatologic mechanisms (phototoxicity, vasculitis, autoimmune blistering, DNA damage) and are homogeneous in style."}, {"criterion": "board_style_authenticity_application", "score": 4, "rationale": "This is a classic board-style question that requires the examinee to apply clinical differentiation skills rather than simply recalling a definition."}, {"criterion": "difficulty_discrimination", "score": 4, "rationale": "The distinction between photoallergy and phototoxicity is a high-yield topic that effectively separates candidates who understand the nuances of photodermatoses from those who do not."}, {"criterion": "explanation_correct_answer", "score": 4, "rationale": "The explanation clearly defines the mechanism and links it back to the clinical findings in the stem."}, {"criterion": "explanation_distractors", "score": 3, "rationale": "The explanations for the distractors are medically accurate and helpful. However, the explanation for option B contains meta-commentary/instructional text from the generator rather than a clea nning to desquamate. There is no mucosal involvement, and the remainder of the physical examination is unremarkable.", "leadIn": "Which of the following is the most likely diagnosis?", "learningObjective": "Differentiate erythema toxicum neonatorum from transient neonatal pustular melanosis and neonatal cephalic pustulosis.", "correctAnswer": "B", "correctAnswerText": "Erythema toxicum neonatorum", "teachingPoint": "Erythema toxicum neonatorum is a benign, self-limited rash characterized by erythematous macules and papules that evolve into pustules with an inflammatory halo, often leaving transient hyperpigmented macules. It is distinguished from other neonatal pustular conditions by its clinical appearance, distribution, and the well-appearing nature of the infant.", "explanationCorrect": "Erythema toxicum neonatorum is a benign, self-limited rash that typically presents in the first few days of life. The classic clinical presentation includes erythematous macules and papules that evolve into pustules with a surrounding erythematous halo, often described as having a \"flea-bitten\" appearance. Lesions may rupture and leave transient hyperpigmented macules that desquamate, as seen in this patient. This condition is common, affecting up to 50% of term newborns, and requires no treatment. The presence of eosinophils on a pustule smear is characteristic but not required for diagnosis.", "options": [{"label": "A", "text": "Transient neonatal pustular melanosis"}, {"label": "B", "text": "Erythema toxicum neonatorum"}, {"label": "C", "text": "Neonatal cephalic pustulosis"}, {"label": "D", "text": "Staphylococcal scalded skin syndrome"}, {"label": "E", "text": "Herpes simplex virus infection"}], "distractorExplanations": [{"label": "A", "text": "Transient neonatal pustular melanosis typically presents at birth with non-inflammatory vesicles and pustules that rupture easily, leaving collarettes of scale and hyperpigmented macules. Unlike erythema toxicum neonatorum, it lacks the prominent inflammatory halo and does not evolve through stages of macules and papules. It is also more common in darker-skinned infants."}, {"label": "B", "text": "This option is correct and explained above."}, {"label": "C", "text": "Neonatal cephalic pustulosis primarily affects the face, particularly the cheeks and forehead, and presents with monomorphic papules and pustules. It is associated with Malassezia species and typically appears in the first few weeks of life, not at 2 days of age. The widespread distribution and evolving lesions in this patient are inconsistent with this diagnosis."}, {"label": "D", "text": "Staphylococcal scalded skin syndrome presents with diffuse erythema, bullae, and widespread desquamation, often preceded by fever and irritability. This patient is well-appearing with localized lesions lacking systemic symptoms, making this diagnosis unlikely."}, {"label": "E", "text": "Herpes simplex virus infection typically presents with grouped vesicles on an erythematous base, often involving the oral mucosa or eyes. It may be associated with systemic symptoms such as fever and lethargy. The benign appearance, lack of mucosal involvement, and well-appearing infant in this case make HSV infection highly unlikely."}], "judgeRuns": [{"judge": "primary", "seed": 701, "valid": true, "errors": [], "meta": {"usage": {"completion_tokens": 2047, "prompt_tokens": 1701, "total_tokens": 3748, "prompt_tokens_details": {"cached_tokens": 0}}, "timings": {"cache_n": 0, "prompt_n": 1701, "prompt_ms": 866.686, "prompt_per_token_ms": 0.5095155790711346, "prompt_per_second": 1962.6485255328917, "predicted_n": 2047, "predicted_ms": 22759.15, "predicted_per_token_ms": 11.118295065950171, "predicted_per_second": 89.94184756460588}, "model": "google_gemma-4-26B-A4B-it-Q4_K_M.gguf", "id": "chatcmpl-AR1zAnWHPZK7sckk550mwTDZOuyWAnOD", "content_source": "content"}, "globalComment": "This is an excellent, high-quality MCQ. It uses classic clinical descriptors (the 'f us"}, {"label": "E", "text": "Lichen planus-like keratosis"}], "distractorExplanations": [{"label": "A", "text": "Dysplastic nevi can exhibit asymmetry, irregular borders, and color variegation. However, they are typically stable over time. The recent rapid enlargement and new symptoms (itching) strongly favor melanoma over a benign dysplastic nevus."}, {"label": "B", "text": "Seborrheic keratoses often have a 'stuck-on' waxy appearance and may appear in clusters. They typically do not present as a single, irregularly pigmented macule with significant recent growth and elevation on the back of a young adult."}, {"label": "C", "text": "Superficial spreading melanoma"}, {"label": "D", "text": "Compound nevi are usually symmetric, uniformly pigmented, and stable. They may be slightly elevated but lack the irregular borders, variegated colors, and recent rapid evolution seen in this patient."}, {"label": "E", "text": "Lichen planus-like keratoses are benign regressing solar lentigines or seborrheic keratoses that often present with a sudden onset of inflammation, scaling, or itching. They typically have a more uniform brownish-gray color and lack the distinct irregular borders and variegation of melanoma."}], "judgeRuns": [{"judge": "primary", "seed": 701, "valid": true, "errors": [], "meta": {"usage": {"prompt_tokens": 1491, "completion_tokens": 430, "total_tokens": 1921}, "timings": null, "model": "gemma3:27b", "id": "chatcmpl-277", "content_source": "content"}, "globalComment": "Excellent item. Well-written, clinically relevant, and educationally valuable.", "needsHumanReview": false, "fatalFlaw": false, "fatalFlawReasons": [], "criterionScores": [{"criterion": "accuracy_key_correctness", "score": 4, "rationale": "Keyed answer is medically correct and explanation is consistent."}, {"criterion": "single_best_answer_integrity", "score": 4, "rationale": "There is one clearly best answer given the clinical scenario."}, {"criterion": "stem_clarity_sufficiency", "score": 4
