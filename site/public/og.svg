<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ramie Fathy, MD – Dermatology & AI">
  <defs>
    <linearGradient id="bg" x1="1200" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B2750"/>
      <stop offset="0.55" stop-color="#041020"/>
      <stop offset="1" stop-color="#062E3B"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 140) rotate(38) scale(520 360)">
      <stop stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 70) rotate(120) scale(520 380)">
      <stop stop-color="#D946EF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#D946EF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="rgba(148, 163, 184, 0.16)" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <g filter="url(#soft)" opacity="0.65">
    <path d="M 980 540 C 820 560 700 510 620 430 C 540 350 540 240 640 190 C 740 140 890 170 1020 260 C 1150 350 1140 520 980 540 Z" fill="rgba(56, 189, 248, 0.22)"/>
    <path d="M 240 520 C 120 520 70 450 90 370 C 110 290 200 240 310 250 C 420 260 470 340 460 420 C 450 500 360 520 240 520 Z" fill="rgba(217, 70, 239, 0.14)"/>
  </g>

  <rect x="72" y="64" width="1056" height="502" rx="28" fill="rgba(2, 6, 23, 0.52)" stroke="rgba(148, 163, 184, 0.22)"/>
  <rect x="72" y="64" width="1056" height="502" rx="28" fill="url(#grid)" opacity="0.45"/>

  <g>
    <text x="132" y="242" fill="rgba(240, 249, 255, 0.95)" font-family="Playfair Display, DM Serif Display, ui-serif, Georgia, serif" font-size="64" font-weight="700" letter-spacing="-0.02em">
      Ramie Fathy, MD
    </text>
    <rect x="132" y="272" width="430" height="6" rx="3" fill="url(#accent)"/>
    <text x="132" y="336" fill="rgba(186, 230, 253, 0.86)" font-family="DM Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="600">
      Dermatology • AI • Research • Clinical Tools
    </text>
    <text x="132" y="392" fill="rgba(226, 232, 240, 0.7)" font-family="DM Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="500">
      Human-centered interfaces for complex medical dermatology.
    </text>
  </g>

  <g opacity="0.8">
    <text x="132" y="520" fill="rgba(148, 163, 184, 0.75)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" letter-spacing="0.18em">
      ramiefathy.com
    </text>
  </g>
</svg>
