<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ramie Fathy, MD – A working atlas">
  <defs>
    <radialGradient id="warm1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 140) rotate(38) scale(560 380)">
      <stop stop-color="#c2674a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2674a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 540) rotate(160) scale(560 400)">
      <stop stop-color="#a37b2a" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#a37b2a" stop-opacity="0"/>
