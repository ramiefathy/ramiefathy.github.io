<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ramie Fathy, MD — dermatology and clinical AI">
  <defs>
    <!-- Coral bloom where the cursor vortex would sit on the live site. -->
    <radialGradient id="bloom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 150) rotate(140) scale(560 420)">
      <stop stop-color="#ff6b4a" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ff6b4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 560) rotate(-40) scale(520 380)">
      <stop stop-color="#8a94a0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8a94a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b0e13"/>
  <rect width="1200" height="630" fill="url(#cool)"/>
  <rect width="1200" height="630" fill="url(#bloom)"/>

  <!-- Flow-field streaks: the hero canvas, frozen. -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#d6e2eb" stroke-opacity="0.16" stroke-width="1.2">
      <path d="M-40 96 C 180 60 360 140 560 108 C 760 76 900 12 1240 44"/>
      <path d="M-40 168 C 200 130 380 212 580 178 C 780 144 940 84 1240 118"/>
      <path d="M-40 512 C 200 552 420 470 620 508 C 820 546 980 600 1240 566"/>
      <path d="M-40 584 C 220 620 440 540 640 578 C 840 616 1000 660 1240 632"/>
      <path d="M-40 250 C 240 214 300 300 470 286"/>
      <path d="M700 430 C 880 470 1020 402 1240 436"/>
    </g>
    <g stroke="#ff6b4a" stroke-opacity="0.6" stroke-width="1.4">
      <path d="M-40 132 C 190 95 370 176 570 143 C 770 110 920 48 1240 81"/>
      <path d="M-40 548 C 210 586 430 505 630 543 C 830 581 990 630 1240 599"/>
    </g>
    <!-- The vortex the cursor leaves behind. -->
    <g stroke="#ff6b4a" stroke-opacity="0.5" stroke-width="1.3">
      <path d="M1012 196 C 1056 174 1092 200 1084 238 C 1076 276 1028 288 1000 262 C 972 236 984 196 1020 186"/>
      <path d="M1004 220 C 1026 208 1048 220 1046 240 C 1044 260 1020 268 1006 254"/>
    </g>
  </g>

  <!-- Status strip, echoing the live site's top bar. -->
  <g transform="translate(80 74)">
    <circle cx="5" cy="5" r="5" fill="#ff6b4a"/>
    <text x="22" y="10" fill="#f2f4f6" font-family="Space Mono, monospace" font-size="13" letter-spacing="1.6">ramie fathy, md</text>
    <text x="205" y="10" fill="#8a94a0" font-family="Space Mono, monospace" font-size="13" letter-spacing="1.6">· johns hopkins dermatology</text>
    <text x="1040" y="10" text-anchor="end" fill="#8a94a0" font-family="Space Mono, monospace" font-size="13" letter-spacing="1.6">ramiefathy.com</text>
  </g>
  <line x1="80" y1="98" x2="1120" y2="98" stroke="#1b222c" stroke-width="1"/>

  <text x="80" y="196" fill="#ff6b4a" font-family="Space Mono, monospace" font-size="14" font-weight="700" letter-spacing="3.4">DERMATOLOGY · CLINICAL AI · RESEARCH</text>

  <text x="80" y="316" font-family="Fraunces, Georgia, serif" font-size="104" letter-spacing="-3">
    <tspan fill="#f2f4f6">Ramie </tspan><tspan fill="#ff6b4a" font-style="italic">Fathy</tspan><tspan fill="#8a94a0" font-size="44">, MD</tspan>
  </text>

  <text x="80" y="386" fill="#8a94a0" font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="26" letter-spacing="-0.2">I build clinical AI tools and study how they should —</text>
  <text x="80" y="424" fill="#8a94a0" font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="26" letter-spacing="-0.2">and should not — be used at the bedside.</text>

  <!-- Activity console. -->
  <rect x="80" y="466" width="700" height="66" rx="8" fill="#11161d" fill-opacity="0.92" stroke="#232b36" stroke-width="1"/>
  <text x="104" y="492" fill="#8a94a0" font-family="Space Mono, monospace" font-size="11" letter-spacing="1.6">ACTIVITY</text>
  <text x="756" y="492" text-anchor="end" fill="#ff6b4a" font-family="Space Mono, monospace" font-size="11" letter-spacing="1.6">LIVE</text>
  <text x="104" y="518" font-family="Space Mono, monospace" font-size="14">
    <tspan fill="#ff6b4a">›</tspan><tspan fill="#f2f4f6" dx="8">evaluating vision-language models on dermoscopy…</tspan>
  </text>

  <line x1="80" y1="568" x2="1120" y2="568" stroke="#1b222c" stroke-width="1"/>
  <text x="80" y="596" fill="#8a94a0" font-family="Space Mono, monospace" font-size="12" letter-spacing="2">12 PAPERS · 12 BROWSER-BASED INSTRUMENTS · BALTIMORE</text>
</svg>
