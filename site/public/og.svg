  <text x="108" y="298" fill="#0a0a0a" font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="84" font-weight="600" letter-spacing="-3">Ramie Fathy, MD</text>
  <text x="108" y="384" fill="#0a0a0a" font-family="Newsreader, Georgia, serif" font-style="italic" font-weight="400" font-size="76" letter-spacing="-2.5">— a working <tspan fill="#c2674a">atlas.</tspan></text>

