                                    <div className="flex items-start justify-between">
                                        <div className="flex-1">
                                            <div className="flex items-center gap-2 mb-2">
                                                <span className={`px-2 py-1 text-xs rounded-full font-medium ${
                                                    rule.isActive ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'
                                                }`}>
                                                    {rule.isActive ? 'Active' : 'Inactive'}
                                                </span>
                                                <span className="text-xs text-gray-500">
                                                    Type: {rule.type.replace(/_/g, ' ')}
                                                </span>
                                            </div>
                                            <p className="font-medium text-gray-900">{rule.naturalLanguage}</p>
                                            <p className="text-sm text-gray-600 mt-1">{rule.explanation}</p>
                                            <div className="flex items-center gap-2 mt-3">
                                                <span className="text-xs text-gray-500">Confidence:</span>
                                                <div className="flex-1 max-w-xs bg-gray-200 rounded-full h-2">
                                                    <div
                                                        className={`h-2 rounded-full ${
                                                            rule.confidence > 0.8 ? 'bg-green-500' :
                                                            rule.confidence > 0.6 ? 'bg-yellow-500' : 'bg-red-500'
                                                        }`}
                                                        style={{ width: `${rule.confidence * 100}%` }}
                                                    />
                                                </div>
                                                <span className="text-xs font-medium">
                                                    {(rule.confidence * 100).toFixed(0)}%
                                                </span>
                                            </div>
                                        </div>
                                        <div className="flex gap-2 ml-4">
                                            <button
                                                onClick={() => {
                                                    store.updateRule(rule.id, { isActive: !rule.isActive });
                                                    toast.success(rule.isActive ? 'Rule deactivated' : 'Rule activated');
                                                }}
                                                className="p-2 hover:bg-gray-100 rounded-lg"
                                            >
                                                <Icon name={rule.isActive ? 'pause' : 'play'} size={16} />
                                            </button>
                                            <button
                                                onClick={() => {
                                                    if (confirm('Are you sure you want to delete this rule?')) {
                                                        store.deleteRule(rule.id);
                                                        toast.success('Rule deleted');
                                                    }
                                                }}
                                                className="p-2 hover:bg-red-50 text-red-600 rounded-lg"
                                            >
                                                <Icon name="trash-2" size={16} />
                                            </button>
                                        </div>
                                    </div>
                                </Card>
                            ))}
                        </div>
                    ) : (
                        <Card className="text-center py-12">
                            <Icon name="shield-check" size={48} className="mx-auto text-gray-400 mb-4" />
                            <h3 className="text-lg font-medium text-gray-900 mb-2">No Rules Yet</h3>
                            <p className="text-gray-600 mb-4">Create your first scheduling rule to ensure compliance</p>
                            <Button icon="plus" onClick={() => setShowModal(true)}>
                                Create First Rule
                            </Button>
                        </Card>
                    )}

                    <Modal
                        isOpen={showModal}
                        onClose={() => {
                            setShowModal(false);
                            setNaturalLanguage('');
                            setInterpretation(null);
                        }}
                        title="Natural Language Rule Builder"
                        size="lg"
                    >
                        <div className="space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Rule Templates
                                </label>
                                <div className="space-y-2">
                                    {templates.map((template, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => setNaturalLanguage(template)}
                                            className="w-full text-left p-3 bg-gray-50 hover:bg-gray-100 rounded-lg text-sm transition-colors"
                                        >
                                            {template}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Your Rule
                                </label>
                                <textarea
                                    value={naturalLanguage}
                                    onChange={(e) => setNaturalLanguage(e.target.value)}
                                    placeholder="e.g., Residents should not have back-to-back continuity clinics"
                                    className="w-full h-24 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent resize-none"
                                />
                            </div>

                            {!interpretation && (
                                <Button
                                    onClick={handleInterpret}
                                    disabled={loading || !naturalLanguage.trim()}
                                    className="w-full"
                                    icon="brain"
                                >
                                    {loading ? 'Interpreting...' : 'Interpret Rule'}
                                </Button>
                            )}

                            {interpretation && (
                                <motion.div
                                    initial={{ opacity: 0, y: 20 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    className="space-y-4"
                                >
                                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                                        <h4 className="font-semibold text-blue-900 mb-2">Interpretation</h4>
                                        <p className="text-sm text-blue-800">{interpretation.explanation}</p>
                                    </div>

                                    <div className="flex items-center gap-2">
                                        <span className="text-sm text-gray-600">Confidence:</span>
                                        <div className="flex-1 bg-gray-200 rounded-full h-2">
                                            <div
                                                className={`h-2 rounded-full ${
                                                    interpretation.confidence > 0.8 ? 'bg-green-500' :
                                                    interpretation.confidence > 0.6 ? 'bg-yellow-500' : 'bg-red-500'
                                                }`}
                                                style={{ width: `${interpretation.confidence * 100}%` }}
                                            />
                                        </div>
                                        <span className="text-sm font-medium">
                                            {(interpretation.confidence * 100).toFixed(0)}%
                                        </span>
                                    </div>

                                    <div className="flex gap-3">
                                        <Button
                                            variant="secondary"
                                            onClick={() => {
                                                setInterpretation(null);
                                                setNaturalLanguage('');
                                            }}
                                            className="flex-1"
                                        >
                                            Try Again
                                        </Button>
                                        <Button
                                            onClick={saveRule}
                                            className="flex-1"
                                            icon="save"
                                        >
                                            Save Rule
                                        </Button>
                                    </div>
                                </motion.div>
                            )}
                        </div>
                    </Modal>
                </div>
            );
        };

        // ==================== Main App Component ====================
        const App = () => {
            const [activeView, setActiveView] = useState('dashboard');

            const navItems = [
                { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                { id: 'schedule', label: 'Schedule', icon: 'calendar' },
                { id: 'attendings', label: 'Attendings', icon: 'users' },
                { id: 'residents', label: 'Residents', icon: 'user-check' },
                { id: 'rules', label: 'Rules', icon: 'shield-check' },
                { id: 'settings', label: 'Settings', icon: 'settings' }
            ];

            return (
                <AppProvider>
                    <div className="min-h-screen bg-gray-50">
                        {/* Navigation */}
                        <nav className="bg-white shadow-sm border-b border-gray-200">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                                <div className="flex justify-between h-16">
                                    <div className="flex items-center">
                                        <div className="flex items-center gap-3">
                                            <div className="p-2 bg-primary-100 rounded-lg">
                                                <Icon name="calendar-days" size={24} className="text-primary-600" />
                                            </div>
                                            <div>
                                                <h1 className="text-lg font-bold text-gray-900">Clinic Scheduler Pro</h1>
                                                <p className="text-xs text-gray-500">Intelligent Schedule Management</p>
                                            </div>
                                        </div>

                                        <div className="hidden md:flex ml-10 space-x-1">
                                            {navItems.map(item => (
                                                <button
                                                    key={item.id}
                                                    onClick={() => setActiveView(item.id)}
                                                    className={`
                                                        px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-all
                                                        ${activeView === item.id
                                                            ? 'bg-primary-50 text-primary-700'
                                                            : 'text-gray-600 hover:bg-gray-50'
                                                        }
                                                    `}
                                                >
                                                    <Icon name={item.icon} size={16} />
                                                    {item.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-4">
                                        <button className="p-2 hover:bg-gray-100 rounded-lg relative">
                                            <Icon name="bell" size={20} />
                                            <span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                                        </button>

                                        <div className="flex items-center gap-2">
                                            <div className="w-8 h-8 bg-primary-100 rounded-full flex items-center justify-center">
                                                <Icon name="user" size={16} className="text-primary-600" />
                                            </div>
                                            <div className="hidden sm:block">
                                                <p className="text-sm font-medium text-gray-900">Admin User</p>
                                                <p className="text-xs text-gray-500">Program Admin</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </nav>

                        {/* Main Content */}
                        <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                            {activeView === 'dashboard' && <Dashboard />}
                            {activeView === 'schedule' && <ScheduleCalendar />}
                            {activeView === 'settings' && <Settings />}

                            {activeView === 'attendings' && <AttendingsView />}
                            {activeView === 'residents' && <ResidentsView />}
                            {activeView === 'rules' && <RulesView />}
                        </main>

                        <Toaster
                            position="bottom-right"
                            toastOptions={{
                                className: 'font-medium',
                                duration: 3000,
                                style: {
                                    background: '#fff',
                                    color: '#363636',
                                },
                            }}
                        />
                    </div>
                </AppProvider>
            );
        };

        // Render the app
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
