    <script type="text/babel" data-type="module">
        const { useState, useEffect, useCallback, useMemo, useRef, createContext, useContext, useReducer } = React;
        const { createPortal } = ReactDOM;
        const { motion, AnimatePresence } = window['framer-motion'];
        const { toast, Toaster } = window['react-hot-toast'];
        const { format, parseISO, startOfWeek, endOfWeek, addWeeks, subWeeks, eachDayOfInterval, getDay, isWithinInterval, startOfMonth, endOfMonth, addMonths, subMonths, isSameDay } = window['date-fns'];
        const { LineChart, Line, BarChart, Bar, PieChart, Pie, Cell, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = window.Recharts;

        // ==================== Complete Data Store ====================
        class DataStore {
            constructor() {
                this.state = this.loadState();
                this.listeners = new Set();
            }

            loadState() {
                const saved = localStorage.getItem('clinic_scheduler_pro_v2');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        // Ensure all required fields exist
                        return {
                            ...this.getDefaultState(),
                            ...parsed
                        };
                    } catch (e) {
                        console.error('Failed to load state:', e);
                    }
                }
                return this.getDefaultState();
            }

            getDefaultState() {
                return {
                    currentUser: {
                        id: 'user_1',
                        name: 'Admin User',
                        email: 'admin@clinic.com',
                        role: 'program_admin'
                    },
                    institution: {
                        id: 'inst_1',
                        name: 'Johns Hopkins Dermatology',
                        settings: {
                            sites: [
                                { id: 'gss', name: 'GSS', code: 'GSS', color: '#10b981', address: '601 N Caroline St, Baltimore, MD' },
                                { id: 'jhoc', name: 'JHOC', code: 'JHOC', color: '#f59e0b', address: '6420 Rockledge Dr, Bethesda, MD' },
                                { id: 'hoco', name: 'HoCo', code: 'HOCO', color: '#ef4444', address: '10710 Charter Dr, Columbia, MD' }
                            ],
                            rotations: [
                                { id: 'gss', name: 'GSS Clinic', code: 'GSS', minSessions: 4 },
                                { id: 'jhoc', name: 'JHOC Clinic', code: 'JHOC', minSessions: 4 },
                                { id: 'hoco', name: 'HoCo Clinic', code: 'HOCO', minSessions: 3 },
                                { id: 'peds', name: 'Pediatric Dermatology', code: 'PEDS', minSessions: 2 },
                                { id: 'path', name: 'Dermatopathology', code: 'PATH', minSessions: 2 },
                                { id: 'mohs', name: 'Mohs Surgery', code: 'MOHS', minSessions: 1 },
                                { id: 'consults', name: 'Inpatient Consults', code: 'CONSULTS', minSessions: 2 }
                            ],
                            protectedTimes: [
                                {
                                    id: 'didactics',
                                    name: 'Didactics',
                                    dayOfWeek: 3, // Wednesday
                                    timeSlot: 'AM',
                                    startTime: '08:00',
                                    endTime: '12:00',
                                    mandatory: true,
                                    appliesTo: 'all'
                                },
                                {
                                    id: 'grand_rounds',
                                    name: 'Grand Rounds',
                                    dayOfWeek: 4, // Thursday
                                    timeSlot: 'AM',
                                    startTime: '07:00',
                                    endTime: '08:00',
                                    mandatory: true,
                                    appliesTo: 'all'
                                }
                            ],
                            holidays: [],
                            academicYear: {
                                start: '2024-07-01',
                                end: '2025-06-30'
                            }
                        }
                    },
                    attendings: [],
                    residents: [],
                    scheduleAssignments: {},
                    rules: [],
                    templates: [],
                    auditLog: []
                };
            }

            saveState() {
                try {
                    localStorage.setItem('clinic_scheduler_pro_v2', JSON.stringify(this.state));
                    this.notifyListeners();
                } catch (e) {
                    console.error('Failed to save state:', e);
                    toast.error('Failed to save changes');
                }
            }

            subscribe(listener) {
                this.listeners.add(listener);
                return () => this.listeners.delete(listener);
            }

            notifyListeners() {
                this.listeners.forEach(listener => listener(this.state));
            }

            // ===== Getters =====
            getState() {
                return this.state;
            }

            getAttending(id) {
                return this.state.attendings.find(a => a.id === id);
            }

            getResident(id) {
                return this.state.residents.find(r => r.id === id);
            }

            getAssignmentsForDate(date, timeSlot) {
                const key = `${date}_${timeSlot}`;
                return this.state.scheduleAssignments[key] || [];
            }

            getAssignmentsForResident(residentId, startDate, endDate) {
                const assignments = [];
                Object.entries(this.state.scheduleAssignments).forEach(([key, items]) => {
                    const [date] = key.split('_');
                    if ((!startDate || date >= startDate) && (!endDate || date <= endDate)) {
                        const residentAssignments = items.filter(a => a.residentId === residentId);
                        assignments.push(...residentAssignments);
                    }
                });
                return assignments;
            }

            // ===== Setters =====
            setState(updater) {
                this.state = typeof updater === 'function' ? updater(this.state) : updater;
                this.saveState();
            }

            addAttending(attending) {
                const newAttending = {
                    ...attending,
                    id: `att_${Date.now()}`,
                    createdAt: new Date().toISOString()
                };
                this.setState(state => ({
                    ...state,
                    attendings: [...state.attendings, newAttending]
                }));
                this.addAuditLog('attending_added', newAttending);
                return newAttending;
            }

            updateAttending(id, updates) {
                this.setState(state => ({
                    ...state,
                    attendings: state.attendings.map(att =>
                        att.id === id ? { ...att, ...updates, updatedAt: new Date().toISOString() } : att
                    )
                }));
                this.addAuditLog('attending_updated', { id, updates });
            }

            deleteAttending(id) {
                this.setState(state => ({
                    ...state,
                    attendings: state.attendings.filter(att => att.id !== id),
                    // Also remove related assignments
                    scheduleAssignments: Object.fromEntries(
                        Object.entries(state.scheduleAssignments).map(([key, assignments]) => [
                            key,
                            assignments.filter(a => a.attendingId !== id)
                        ])
                    )
                }));
                this.addAuditLog('attending_deleted', { id });
            }

            addResident(resident) {
                const newResident = {
                    ...resident,
                    id: `res_${Date.now()}`,
                    createdAt: new Date().toISOString()
                };
                this.setState(state => ({
                    ...state,
                    residents: [...state.residents, newResident]
                }));
                this.addAuditLog('resident_added', newResident);
                return newResident;
            }

            updateResident(id, updates) {
                this.setState(state => ({
                    ...state,
                    residents: state.residents.map(res =>
                        res.id === id ? { ...res, ...updates, updatedAt: new Date().toISOString() } : res
                    )
                }));
                this.addAuditLog('resident_updated', { id, updates });
            }

            deleteResident(id) {
                this.setState(state => ({
                    ...state,
                    residents: state.residents.filter(res => res.id !== id),
                    // Also remove related assignments
                    scheduleAssignments: Object.fromEntries(
                        Object.entries(state.scheduleAssignments).map(([key, assignments]) => [
                            key,
                            assignments.filter(a => a.residentId !== id)
                        ])
                    )
                }));
                this.addAuditLog('resident_deleted', { id });
            }

            addAssignment(date, timeSlot, assignment) {
                const key = `${date}_${timeSlot}`;
                const newAssignment = {
                    ...assignment,
                    id: `assign_${Date.now()}_${Math.random()}`,
                    date,
                    timeSlot,
                    createdAt: new Date().toISOString()
                };

                this.setState(state => ({
                    ...state,
                    scheduleAssignments: {
                        ...state.scheduleAssignments,
                        [key]: [...(state.scheduleAssignments[key] || []), newAssignment]
                    }
                }));
                this.addAuditLog('assignment_added', newAssignment);
                return newAssignment;
            }

            updateAssignment(assignmentId, updates) {
                this.setState(state => {
                    const newAssignments = { ...state.scheduleAssignments };
                    Object.keys(newAssignments).forEach(key => {
                        newAssignments[key] = newAssignments[key].map(a =>
                            a.id === assignmentId ? { ...a, ...updates } : a
                        );
                    });
                    return { ...state, scheduleAssignments: newAssignments };
                });
                this.addAuditLog('assignment_updated', { assignmentId, updates });
            }

            deleteAssignment(assignmentId) {
                this.setState(state => {
                    const newAssignments = { ...state.scheduleAssignments };
                    Object.keys(newAssignments).forEach(key => {
                        newAssignments[key] = newAssignments[key].filter(a => a.id !== assignmentId);
                    });
                    return { ...state, scheduleAssignments: newAssignments };
                });
                this.addAuditLog('assignment_deleted', { assignmentId });
            }

            moveAssignment(assignmentId, newDate, newTimeSlot) {
                let assignment = null;

                // Find and remove from old location
                this.setState(state => {
                    const newAssignments = { ...state.scheduleAssignments };
                    Object.keys(newAssignments).forEach(key => {
                        const found = newAssignments[key].find(a => a.id === assignmentId);
                        if (found) {
                            assignment = { ...found };
                            newAssignments[key] = newAssignments[key].filter(a => a.id !== assignmentId);
                        }
                    });

                    // Add to new location
                    if (assignment) {
                        const newKey = `${newDate}_${newTimeSlot}`;
                        assignment.date = newDate;
                        assignment.timeSlot = newTimeSlot;
                        newAssignments[newKey] = [...(newAssignments[newKey] || []), assignment];
                    }

                    return { ...state, scheduleAssignments: newAssignments };
                });

                this.addAuditLog('assignment_moved', { assignmentId, newDate, newTimeSlot });
            }

            addRule(rule) {
                const newRule = {
                    ...rule,
                    id: `rule_${Date.now()}`,
                    createdAt: new Date().toISOString(),
                    isActive: true
                };
                this.setState(state => ({
                    ...state,
                    rules: [...state.rules, newRule]
                }));
                this.addAuditLog('rule_added', newRule);
                return newRule;
            }

            updateRule(id, updates) {
                this.setState(state => ({
                    ...state,
                    rules: state.rules.map(rule =>
                        rule.id === id ? { ...rule, ...updates } : rule
                    )
                }));
                this.addAuditLog('rule_updated', { id, updates });
            }

            deleteRule(id) {
                this.setState(state => ({
                    ...state,
                    rules: state.rules.filter(rule => rule.id !== id)
                }));
                this.addAuditLog('rule_deleted', { id });
            }

            updateInstitutionSettings(updates) {
                this.setState(state => ({
                    ...state,
                    institution: {
                        ...state.institution,
                        settings: {
                            ...state.institution.settings,
                            ...updates
                        }
                    }
                }));
                this.addAuditLog('settings_updated', updates);
            }

            addAuditLog(action, data) {
                const entry = {
                    id: `audit_${Date.now()}`,
                    action,
                    data,
                    userId: this.state.currentUser?.id,
                    timestamp: new Date().toISOString()
                };
                this.setState(state => ({
                    ...state,
                    auditLog: [...(state.auditLog || []).slice(-999), entry] // Keep last 1000 entries
                }));
            }

            clearAllAssignments() {
                if (confirm('Are you sure you want to clear ALL schedule assignments? This cannot be undone.')) {
                    this.setState(state => ({
                        ...state,
                        scheduleAssignments: {}
                    }));
                    this.addAuditLog('assignments_cleared', { timestamp: new Date().toISOString() });
                    toast.success('All assignments cleared');
                }
            }
        }

        // ==================== Scheduling Engine ====================
        class SchedulingEngine {
            constructor(store) {
                this.store = store;
            }

            validateAssignment(assignment, existingAssignments = []) {
                const state = this.store.getState();

                // Check if resident is already assigned
                const residentConflict = existingAssignments.find(a =>
                    a.residentId === assignment.residentId && a.id !== assignment.id
                );
                if (residentConflict) {
                    return { valid: false, reason: 'Resident already assigned to this time slot' };
                }

                // Check attending capacity
                const attending = state.attendings.find(a => a.id === assignment.attendingId);
                if (!attending) {
                    return { valid: false, reason: 'Attending not found' };
                }

                const attendingAssignments = existingAssignments.filter(a =>
                    a.attendingId === assignment.attendingId && a.id !== assignment.id
                );
                const capacity = assignment.timeSlot === 'AM' ? attending.capacityAM : attending.capacityPM;
                if (attendingAssignments.length >= capacity) {
                    return { valid: false, reason: 'Attending capacity exceeded' };
                }

                // Check protected time
                const dayOfWeek = new Date(assignment.date).getDay();
                const protectedTime = state.institution.settings.protectedTimes.find(pt =>
                    pt.dayOfWeek === dayOfWeek && pt.timeSlot === assignment.timeSlot && pt.mandatory
                );
                if (protectedTime) {
                    return { valid: false, reason: `Protected time: ${protectedTime.name}` };
                }

                // Check active rules
                const violations = this.checkRuleViolations(assignment);
                if (violations.length > 0) {
                    return { valid: false, reason: violations[0] };
                }

                return { valid: true };
            }

            checkRuleViolations(assignment) {
                const violations = [];
                const state = this.store.getState();
                const activeRules = state.rules.filter(r => r.isActive);

                activeRules.forEach(rule => {
                    switch (rule.type) {
                        case 'continuity_separation': {
                            const resident = state.residents.find(r => r.id === assignment.residentId);
                            if (resident) {
                                // Check if this violates continuity separation
                                const recentAssignments = this.store.getAssignmentsForResident(
                                    assignment.residentId,
                                    format(subWeeks(new Date(assignment.date), 1), 'yyyy-MM-dd'),
                                    assignment.date
                                );
                                const continuityAssignments = recentAssignments.filter(a => a.type === 'continuity');
                                if (continuityAssignments.length > 0 && assignment.type === 'continuity') {
                                    const lastContinuity = continuityAssignments[continuityAssignments.length - 1];
                                    const daysBetween = Math.abs(
                                        new Date(assignment.date).getTime() - new Date(lastContinuity.date).getTime()
                                    ) / (1000 * 60 * 60 * 24);
                                    if (daysBetween < (rule.parameters?.minDays || 2)) {
                                        violations.push(`Continuity clinics must be at least ${rule.parameters?.minDays || 2} days apart`);
                                    }
                                }
                            }
                            break;
                        }
                        case 'max_consecutive': {
                            const maxDays = rule.parameters?.maxConsecutive || 3;
                            const checkDates = [];
                            for (let i = -maxDays; i <= maxDays; i++) {
                                if (i !== 0) {
                                    checkDates.push(format(addDays(new Date(assignment.date), i), 'yyyy-MM-dd'));
                                }
                            }
                            const nearbyAssignments = checkDates.map(date =>
                                Object.entries(state.scheduleAssignments)
                                    .filter(([key]) => key.startsWith(date))
                                    .flatMap(([, assignments]) => assignments.filter(a => a.residentId === assignment.residentId))
                            ).flat();

                            if (nearbyAssignments.length >= maxDays) {
                                violations.push(`Cannot schedule more than ${maxDays} consecutive clinic days`);
                            }
                            break;
                        }
                        case 'rotation_requirement': {
                            // This is more for validation/reporting than blocking
                            break;
                        }
                        case 'post_call_protection': {
                            // Would need call schedule integration
                            break;
                        }
                    }
                });

                return violations;
            }

            async generateAutoSchedule(params) {
                const { dateRange, optimizationGoals = [], respectRules = true } = params;
                const state = this.store.getState();
                const assignments = [];

                // Get all weekdays in range
                const dates = eachDayOfInterval(dateRange)
                    .filter(date => {
                        const day = getDay(date);
                        return day >= 1 && day <= 5; // Weekdays only
                    });

                // Process each date and time slot
                for (const date of dates) {
                    for (const timeSlot of ['AM', 'PM']) {
                        const dateStr = format(date, 'yyyy-MM-dd');
                        const dayOfWeek = getDay(date);

                        // Skip protected times
                        const protectedTime = state.institution.settings.protectedTimes.find(pt =>
                            pt.dayOfWeek === dayOfWeek && pt.timeSlot === timeSlot && pt.mandatory
                        );
                        if (protectedTime) continue;

                        // Assign each resident
                        for (const resident of state.residents) {
                            // Check for continuity clinic
                            const dayMap = { 1: 'monday', 2: 'tuesday', 3: 'wednesday', 4: 'thursday', 5: 'friday' };
                            const isontinuity = resident.continuityDay === dayMap[dayOfWeek] &&
                                               resident.continuityTime === timeSlot;

                            if (isontinuity) {
                                // Assign to continuity site with preferred attending
                                const continuityAttending = state.attendings.find(a =>
                                    a.site === resident.continuitySite &&
                                    this.getAttendingAvailability(a, dateStr, timeSlot, assignments) > 0
                                );

                                if (continuityAttending) {
                                    assignments.push({
                                        id: `auto_${Date.now()}_${Math.random()}`,
                                        date: dateStr,
                                        timeSlot,
                                        residentId: resident.id,
                                        attendingId: continuityAttending.id,
                                        siteId: resident.continuitySite,
                                        type: 'continuity',
                                        autoGenerated: true
                                    });
                                }
                            } else {
                                // Find best attending based on optimization goals
                                const bestAttending = this.findBestAttending(
                                    resident, dateStr, timeSlot, assignments, optimizationGoals
                                );

                                if (bestAttending) {
                                    const newAssignment = {
                                        id: `auto_${Date.now()}_${Math.random()}`,
                                        date: dateStr,
                                        timeSlot,
                                        residentId: resident.id,
                                        attendingId: bestAttending.id,
                                        siteId: bestAttending.site,
                                        type: 'clinical',
                                        autoGenerated: true
                                    };

                                    // Validate against rules if enabled
                                    if (!respectRules || this.validateAssignment(newAssignment, assignments).valid) {
                                        assignments.push(newAssignment);
                                    }
                                }
                            }
                        }
                    }
                }

                // Calculate metrics
                const metrics = this.calculateScheduleMetrics(assignments);

                return { assignments, metrics };
            }

            findBestAttending(resident, date, timeSlot, existingAssignments, optimizationGoals) {
                const state = this.store.getState();
                const availableAttendings = state.attendings.filter(att =>
                    this.getAttendingAvailability(att, date, timeSlot, existingAssignments) > 0
                );

                if (availableAttendings.length === 0) return null;

                // Score each attending based on optimization goals
                const scores = availableAttendings.map(att => {
                    let score = 0;

                    // Prefer rotation site match
                    if (optimizationGoals.includes('siteMatch') && att.site === resident.rotation) {
                        score += 10;
                    }

                    // Minimize travel (prefer same site as previous assignment)
                    if (optimizationGoals.includes('minimizeTravel')) {
                        const prevAssignment = existingAssignments
                            .filter(a => a.residentId === resident.id)
                            .sort((a, b) => b.date.localeCompare(a.date))[0];
                        if (prevAssignment && prevAssignment.siteId === att.site) {
                            score += 5;
                        }
                    }

                    // Balance workload (prefer less utilized attendings)
                    if (optimizationGoals.includes('balanceWorkload')) {
                        const utilization = existingAssignments.filter(a => a.attendingId === att.id).length;
                        score -= utilization * 2;
                    }

                    // Respect preferences
                    if (optimizationGoals.includes('respectPreferences')) {
                        if (resident.preferences?.preferredAttendings?.includes(att.id)) {
                            score += 8;
                        }
                        if (resident.preferences?.preferredSites?.includes(att.site)) {
                            score += 4;
                        }
                    }

                    return { attending: att, score };
                });

                // Return attending with highest score
                scores.sort((a, b) => b.score - a.score);
                return scores[0].attending;
            }

            getAttendingAvailability(attending, date, timeSlot, existingAssignments) {
                const capacity = timeSlot === 'AM' ? attending.capacityAM : attending.capacityPM;
                const assigned = existingAssignments.filter(a =>
                    a.attendingId === attending.id &&
                    a.date === date &&
                    a.timeSlot === timeSlot
                ).length;

                // Check availability pattern
                const dayOfWeek = new Date(date).getDay();
                const dayMap = { 1: 'monday', 2: 'tuesday', 3: 'wednesday', 4: 'thursday', 5: 'friday' };
                const dayKey = dayMap[dayOfWeek];

                if (attending.availabilityPattern?.[dayKey]?.[timeSlot.toLowerCase()] === false) {
                    return 0;
                }

                return Math.max(0, capacity - assigned);
            }

            calculateScheduleMetrics(assignments) {
                const state = this.store.getState();

                // Coverage rate
                const totalPossibleSlots = state.residents.length * assignments.length / state.residents.length * 2;
                const coverageRate = (assignments.length / totalPossibleSlots) * 100;

                // Utilization rate
                let totalCapacity = 0;
                let totalUsed = 0;
                const uniqueDateSlots = [...new Set(assignments.map(a => `${a.date}_${a.timeSlot}`))];
                uniqueDateSlots.forEach(slot => {
                    const [date, timeSlot] = slot.split('_');
                    state.attendings.forEach(att => {
                        const capacity = timeSlot === 'AM' ? att.capacityAM : att.capacityPM;
                        totalCapacity += capacity;
                        const used = assignments.filter(a =>
                            a.attendingId === att.id &&
                            a.date === date &&
                            a.timeSlot === timeSlot
                        ).length;
                        totalUsed += used;
                    });
                });
                const utilizationRate = totalCapacity > 0 ? (totalUsed / totalCapacity) * 100 : 0;

                // Continuity compliance
                const continuityAssignments = assignments.filter(a => a.type === 'continuity');
                const expectedContinuity = state.residents.length * Math.floor(uniqueDateSlots.length / 10); // Weekly
                const continuityCompliance = expectedContinuity > 0 ?
                    (continuityAssignments.length / expectedContinuity) * 100 : 100;

                // Workload balance
                const residentCounts = {};
                state.residents.forEach(r => {
                    residentCounts[r.id] = assignments.filter(a => a.residentId === r.id).length;
                });
                const counts = Object.values(residentCounts);
                const mean = counts.length > 0 ? counts.reduce((a, b) => a + b, 0) / counts.length : 0;
                const variance = counts.length > 0 ?
                    counts.reduce((sum, val) => sum + Math.pow(val - mean, 2), 0) / counts.length : 0;
                const stdDev = Math.sqrt(variance);
                const workloadBalance = mean > 0 ? Math.max(0, 100 - (stdDev / mean * 100)) : 100;

                // Rule compliance
                let ruleViolations = 0;
                assignments.forEach(assignment => {
                    const violations = this.checkRuleViolations(assignment);
                    ruleViolations += violations.length;
                });
                const ruleCompliance = assignments.length > 0 ?
                    ((assignments.length - ruleViolations) / assignments.length) * 100 : 100;

                return {
                    coverageRate: Math.round(coverageRate),
                    utilizationRate: Math.round(utilizationRate),
                    continuityCompliance: Math.round(continuityCompliance),
                    workloadBalance: Math.round(workloadBalance),
                    ruleCompliance: Math.round(ruleCompliance),
                    totalAssignments: assignments.length
                };
            }
        }

        // ==================== Natural Language Rule Interpreter ====================
        class RuleInterpreter {
            interpretRule(naturalLanguage) {
                const patterns = [
                    {
                        regex: /residents?\s+(?:must|should)\s+have\s+at\s+least\s+(\d+)\s+days?\s+between\s+continuity/i,
                        type: 'continuity_separation',
                        extract: (match) => ({ minDays: parseInt(match[1]) })
                    },
                    {
                        regex: /PGY[- ]?(\d)\s+residents?\s+(?:must|should)\s+(?:have|complete)\s+(?:at\s+least\s+)?(\d+)\s+(\w+)\s+sessions?\s+per\s+(\w+)/i,
                        type: 'rotation_requirement',
                        extract: (match) => ({
                            pgyLevel: parseInt(match[1]),
                            count: parseInt(match[2]),
                            rotation: match[3],
                            period: match[4]
                        })
                    },
                    {
                        regex: /(?:no|don't|do\s+not)\s+(?:schedule\s+)?(?:residents?\s+)?(?:for\s+)?(?:more\s+than\s+)?(\d+)\s+consecutive\s+(?:clinic\s+)?days?/i,
                        type: 'max_consecutive',
                        extract: (match) => ({
                            maxConsecutive: parseInt(match[1])
                        })
                    },
                    {
                        regex: /residents?\s+on\s+call\s+(?:cannot|should\s+not)\s+have\s+clinic\s+the\s+(?:next|following)\s+(\w+)/i,
                        type: 'post_call_protection',
                        extract: (match) => ({ timeframe: match[1] })
                    },
                    {
                        regex: /all\s+residents?\s+must\s+(?:be\s+)?(?:attend|free|available)\s+(?:for\s+)?(\w+)\s+on\s+(\w+)\s+(\w+)/i,
                        type: 'protected_time',
                        extract: (match) => ({
                            event: match[1],
                            day: match[2],
                            time: match[3]
                        })
                    }
                ];

                for (const pattern of patterns) {
                    const match = naturalLanguage.match(pattern.regex);
                    if (match) {
                        return {
                            success: true,
                            type: pattern.type,
                            parameters: pattern.extract(match),
                            confidence: 0.85 + Math.random() * 0.15,
                            originalText: naturalLanguage
                        };
                    }
                }

                return {
                    success: false,
                    type: 'unknown',
                    parameters: {},
                    confidence: 0.3,
                    originalText: naturalLanguage
                };
            }

            generateExplanation(rule) {
                const explanations = {
                    continuity_separation: `Ensures residents have at least ${rule.parameters.minDays} days between continuity clinic sessions`,
                    rotation_requirement: `PGY-${rule.parameters.pgyLevel} residents must complete ${rule.parameters.count} ${rule.parameters.rotation} sessions per ${rule.parameters.period}`,
                    max_consecutive: `Prevents scheduling more than ${rule.parameters.maxConsecutive} consecutive clinic days`,
                    post_call_protection: `Protects residents from clinic duties the ${rule.parameters.timeframe} after being on call`,
                    protected_time: `All residents must be available for ${rule.parameters.event} on ${rule.parameters.day} ${rule.parameters.time}`,
                    unknown: 'Custom rule - manual interpretation required'
                };

                return explanations[rule.type] || 'Rule interpretation pending';
            }
        }

        const ruleInterpreter = new RuleInterpreter();

                                                onDrop={!isProtected ? (e) => handleDrop(e, day, timeSlot) : undefined}
                                            >
                                                {isProtected ? (
                                                    <div className="p-3 text-center">
                                                        <Icon name="book-open" size={20} className="mx-auto text-indigo-600 mb-1" />
                                                        <p className="text-xs font-medium text-indigo-700">{protectedTime?.name}</p>
                                                    </div>
                                                ) : (
                                                    <div className="p-2">
                                                        {assignments.map(assignment => {
                                                            const resident = residents.find(r => r.id === assignment.residentId);
                                                            const attending = attendings.find(a => a.id === assignment.attendingId);
                                                            const isContinuity = assignment.type === 'continuity';

                                                            return (
                                                                <div
                                                                    key={assignment.id}
                                                                    className={`assignment-card site-${assignment.siteId} ${isContinuity ? 'bg-yellow-50' : ''}`}
                                                                    draggable
                                                                    onDragStart={(e) => handleDragStart(e, assignment)}
                                                                    onDragEnd={handleDragEnd}
                                                                >
                                                                    <div className="font-medium">{resident?.name}</div>
                                                                    <div className="text-gray-600">{attending?.name}</div>
                                                                    {isContinuity && (
                                                                        <span className="inline-block px-1 py-0.5 bg-yellow-200 text-yellow-800 rounded text-xs mt-1">
                                                                            Continuity
                                                                        </span>
                                                                    )}
                                                                </div>
                                                            );
                                                        })}
                                                        {assignments.length === 0 && (
                                                            <button
                                                                onClick={() => setSelectedCell({ date: day, timeSlot })}
                                                                className="w-full h-full flex items-center justify-center text-gray-400 hover:text-primary-600 transition-colors"
                                                            >
                                                                <Icon name="plus-circle" size={24} />
                                                            </button>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </React.Fragment>
                            ))}
                        </div>
                    </Card>

                    {/* Quick Add Panel */}
                    {selectedCell && (
                        <Card>
                            <h3 className="font-semibold text-gray-900 mb-3">
                                Quick Add: {format(selectedCell.date, 'EEEE, MMM d')} - {selectedCell.timeSlot}
                            </h3>
                            <div className="grid grid-cols-2 lg:grid-cols-3 gap-3">
                                {residents.map(resident => {
                                    const isContinuity = isContinuitySlot(selectedCell.date, selectedCell.timeSlot, resident.id);
                                    const preferredAttendings = attendings.filter(a =>
                                        isContinuity ? a.site === resident.continuitySite : true
                                    );

                                    return (
                                        <div key={resident.id} className="space-y-2">
                                            <div className="font-medium text-sm">
                                                {resident.name} (PGY-{resident.pgyLevel})
                                                {isContinuity && <span className="ml-2 text-yellow-600">Continuity</span>}
                                            </div>
                                            <div className="grid grid-cols-2 gap-1">
                                                {preferredAttendings.slice(0, 4).map(attending => (
                                                    <button
                                                        key={attending.id}
                                                        onClick={() => handleQuickAdd(
                                                            selectedCell.date,
                                                            selectedCell.timeSlot,
                                                            resident.id,
                                                            attending.id
                                                        )}
                                                        className="p-1 text-xs bg-gray-100 hover:bg-primary-100 rounded transition-colors"
                                                    >
                                                        {attending.name}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                            <button
                                onClick={() => setSelectedCell(null)}
                                className="mt-4 text-sm text-gray-600 hover:text-gray-900"
                            >
                                Cancel
                            </button>
                        </Card>
                    )}

                    {/* Auto-Scheduler Modal */}
                    <Modal
                        isOpen={showAutoScheduler}
                        onClose={() => setShowAutoScheduler(false)}
                        title="Auto-Schedule Generator"
                        size="lg"
                    >
                        <AutoSchedulerContent onClose={() => setShowAutoScheduler(false)} />
                    </Modal>
                </div>
            );
        };

        // Auto-Scheduler Component
        const AutoSchedulerContent = ({ onClose }) => {
            const { store, schedulingEngine } = useApp();
            const [loading, setLoading] = useState(false);
            const [preview, setPreview] = useState(null);
            const [dateRange, setDateRange] = useState({
                start: startOfWeek(new Date(), { weekStartsOn: 1 }),
                end: endOfWeek(new Date(), { weekStartsOn: 1 })
            });
            const [optimizationGoals, setOptimizationGoals] = useState(['balanceWorkload', 'siteMatch']);

            const goals = [
                { id: 'balanceWorkload', label: 'Balance Workload', icon: 'scale' },
                { id: 'minimizeTravel', label: 'Minimize Site Transitions', icon: 'map-pin' },
                { id: 'siteMatch', label: 'Match Rotation Sites', icon: 'building' },
                { id: 'respectPreferences', label: 'Respect Preferences', icon: 'heart' }
            ];

            const handleGenerate = async () => {
                setLoading(true);
                try {
                    const result = await schedulingEngine.generateAutoSchedule({
                        dateRange,
                        optimizationGoals,
                        respectRules: true
                    });
                    setPreview(result);
                } catch (error) {
                    toast.error('Failed to generate schedule');
                } finally {
                    setLoading(false);
                }
            };

            const handleApply = () => {
                if (!preview) return;

                preview.assignments.forEach(assignment => {
                    store.addAssignment(assignment.date, assignment.timeSlot, assignment);
                });

                toast.success(`Applied ${preview.assignments.length} assignments`);
                onClose();
            };

            return (
                <div className="space-y-6">
                    {!preview ? (
                        <>
                            <div>
                                <h4 className="font-semibold mb-3">Date Range</h4>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm text-gray-600 mb-1">Start Date</label>
                                        <input
                                            type="date"
                                            value={format(dateRange.start, 'yyyy-MM-dd')}
                                            onChange={(e) => setDateRange({
                                                ...dateRange,
                                                start: parseISO(e.target.value)
                                            })}
                                            className="w-full px-3 py-2 border rounded-lg"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm text-gray-600 mb-1">End Date</label>
                                        <input
                                            type="date"
                                            value={format(dateRange.end, 'yyyy-MM-dd')}
                                            onChange={(e) => setDateRange({
                                                ...dateRange,
                                                end: parseISO(e.target.value)
                                            })}
                                            className="w-full px-3 py-2 border rounded-lg"
                                        />
                                    </div>
                                </div>
                            </div>

                            <div>
                                <h4 className="font-semibold mb-3">Optimization Goals</h4>
                                <div className="space-y-2">
                                    {goals.map(goal => (
                                        <label key={goal.id} className="flex items-center gap-3 p-3 border rounded-lg hover:bg-gray-50 cursor-pointer">
                                            <input
                                                type="checkbox"
                                                checked={optimizationGoals.includes(goal.id)}
                                                onChange={(e) => {
                                                    if (e.target.checked) {
                                                        setOptimizationGoals([...optimizationGoals, goal.id]);
                                                    } else {
                                                        setOptimizationGoals(optimizationGoals.filter(g => g !== goal.id));
                                                    }
                                                }}
                                                className="w-4 h-4 text-primary-600"
                                            />
                                            <Icon name={goal.icon} size={20} />
                                            <span className="font-medium">{goal.label}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>

                            <Button
                                onClick={handleGenerate}
                                disabled={loading}
                                className="w-full"
                                icon={loading ? null : 'sparkles'}
                            >
                                {loading ? 'Generating...' : 'Generate Schedule'}
                            </Button>
                        </>
                    ) : (
                        <>
                            <div className="bg-green-50 border border-green-200 rounded-lg p-4">
                                <h4 className="font-semibold text-green-900 mb-2">Schedule Generated Successfully</h4>
                                <div className="grid grid-cols-2 gap-4 text-sm">
                                    <div>
                                        <span className="text-gray-600">Total Assignments:</span>
                                        <span className="ml-2 font-semibold">{preview.metrics.totalAssignments}</span>
                                    </div>
                                    <div>
                                        <span className="text-gray-600">Coverage Rate:</span>
                                        <span className="ml-2 font-semibold">{preview.metrics.coverageRate}%</span>
                                    </div>
                                    <div>
                                        <span className="text-gray-600">Utilization:</span>
                                        <span className="ml-2 font-semibold">{preview.metrics.utilizationRate}%</span>
                                    </div>
                                    <div>
                                        <span className="text-gray-600">Rule Compliance:</span>
                                        <span className="ml-2 font-semibold">{preview.metrics.ruleCompliance}%</span>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <h4 className="font-semibold mb-3">Preview (First 10)</h4>
                                <div className="bg-gray-50 rounded-lg p-4 max-h-64 overflow-y-auto space-y-1">
                                    {preview.assignments.slice(0, 10).map((assignment, idx) => {
                                        const resident = store.getState().residents.find(r => r.id === assignment.residentId);
                                        const attending = store.getState().attendings.find(a => a.id === assignment.attendingId);
                                        return (
                                            <div key={idx} className="text-sm flex items-center gap-2">
                                                <span className="text-gray-600">{assignment.date}</span>
                                                <span className="font-medium">{assignment.timeSlot}</span>
                                                <span>•</span>
                                                <span>{resident?.name}</span>
                                                <span>→</span>
                                                <span>{attending?.name}</span>
                                            </div>
                                        );
                                    })}
                                    {preview.assignments.length > 10 && (
                                        <p className="text-gray-500 mt-2">... and {preview.assignments.length - 10} more</p>
                                    )}
                                </div>
                            </div>

                            <div className="flex gap-3">
                                <Button variant="secondary" onClick={() => setPreview(null)} className="flex-1">
                                    Back
                                </Button>
                                <Button onClick={handleApply} className="flex-1" icon="check">
                                    Apply Schedule
                                </Button>
                            </div>
                        </>
                    )}
                </div>
            );
        };

        // ==================== Settings Component ====================
        const Settings = () => {
            const { institution, store } = useApp();
            const [activeTab, setActiveTab] = useState('general');
            const [editingSite, setEditingSite] = useState(null);
            const [editingRotation, setEditingRotation] = useState(null);
            const [editingProtectedTime, setEditingProtectedTime] = useState(null);

            const tabs = [
                { id: 'general', label: 'General', icon: 'settings' },
                { id: 'sites', label: 'Sites', icon: 'building' },
                { id: 'rotations', label: 'Rotations', icon: 'repeat' },
                { id: 'protected', label: 'Protected Time', icon: 'shield' },
                { id: 'import', label: 'Import/Export', icon: 'download' }
            ];

            const handleSiteSave = (site) => {
                const sites = [...institution.settings.sites];
                if (site.id) {
                    const index = sites.findIndex(s => s.id === site.id);
                    sites[index] = site;
                } else {
                    sites.push({ ...site, id: `site_${Date.now()}` });
                }
                store.updateInstitutionSettings({ sites });
                setEditingSite(null);
                toast.success('Site saved');
            };

            const handleRotationSave = (rotation) => {
                const rotations = [...institution.settings.rotations];
                if (rotation.id) {
                    const index = rotations.findIndex(r => r.id === rotation.id);
                    rotations[index] = rotation;
                } else {
                    rotations.push({ ...rotation, id: `rotation_${Date.now()}` });
                }
                store.updateInstitutionSettings({ rotations });
                setEditingRotation(null);
                toast.success('Rotation saved');
            };

            const handleProtectedTimeSave = (protectedTime) => {
                const protectedTimes = [...institution.settings.protectedTimes];
                if (protectedTime.id) {
                    const index = protectedTimes.findIndex(pt => pt.id === protectedTime.id);
                    protectedTimes[index] = protectedTime;
                } else {
                    protectedTimes.push({ ...protectedTime, id: `protected_${Date.now()}` });
                }
                store.updateInstitutionSettings({ protectedTimes });
                setEditingProtectedTime(null);
                toast.success('Protected time saved');
            };

            const exportData = () => {
                const data = {
                    version: '1.0',
                    exported: new Date().toISOString(),
                    institution: store.getState().institution,
                    attendings: store.getState().attendings,
                    residents: store.getState().residents,
                    rules: store.getState().rules
                };

                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `clinic_scheduler_backup_${format(new Date(), 'yyyy-MM-dd')}.json`;
                a.click();
                URL.revokeObjectURL(url);
                toast.success('Data exported');
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (confirm('This will replace all current data. Are you sure?')) {
                            store.setState({
                                ...store.getState(),
                                institution: data.institution,
                                attendings: data.attendings,
                                residents: data.residents,
                                rules: data.rules
                            });
                            toast.success('Data imported successfully');
                        }
                    } catch (error) {
                        toast.error('Failed to import data');
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold text-gray-900">Settings</h2>
                        <p className="text-gray-600">Configure your institution and scheduling preferences</p>
                    </div>

                    {/* Tab Navigation */}
                    <div className="flex space-x-1 bg-gray-100 p-1 rounded-lg">
                        {tabs.map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`
                                    flex-1 flex items-center justify-center gap-2 px-4 py-2 rounded-lg font-medium transition-all
                                    ${activeTab === tab.id
                                        ? 'bg-white text-primary-600 shadow-sm'
                                        : 'text-gray-600 hover:text-gray-900'
                                    }
                                `}
                            >
                                <Icon name={tab.icon} size={18} />
                                {tab.label}
                            </button>
                        ))}
                    </div>

                    {/* Tab Content */}
                    {activeTab === 'general' && (
                        <Card>
                            <h3 className="text-lg font-semibold mb-4">General Settings</h3>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Institution Name</label>
                                    <input
                                        type="text"
                                        value={institution.name}
                                        onChange={(e) => store.updateInstitutionSettings({ name: e.target.value })}
                                        className="w-full px-3 py-2 border rounded-lg"
                                    />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">Academic Year Start</label>
                                        <input
                                            type="date"
                                            value={institution.settings.academicYear?.start || ''}
                                            onChange={(e) => store.updateInstitutionSettings({
                                                academicYear: { ...institution.settings.academicYear, start: e.target.value }
                                            })}
                                            className="w-full px-3 py-2 border rounded-lg"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">Academic Year End</label>
                                        <input
                                            type="date"
                                            value={institution.settings.academicYear?.end || ''}
                                            onChange={(e) => store.updateInstitutionSettings({
                                                academicYear: { ...institution.settings.academicYear, end: e.target.value }
                                            })}
                                            className="w-full px-3 py-2 border rounded-lg"
                                        />
                                    </div>
                                </div>
                            </div>
                        </Card>
                    )}

                    {activeTab === 'sites' && (
                        <Card>
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-lg font-semibold">Clinic Sites</h3>
                                <Button size="sm" icon="plus" onClick={() => setEditingSite({})}>
                                    Add Site
                                </Button>
                            </div>
                            <div className="space-y-3">
                                {institution.settings.sites.map(site => (
                                    <div key={site.id} className="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                        <div className="flex items-center gap-3">
                                            <div className="w-4 h-4 rounded" style={{ backgroundColor: site.color }}></div>
                                            <div>
                                                <div className="font-medium">{site.name} ({site.code})</div>
                                                <div className="text-sm text-gray-600">{site.address}</div>
                                            </div>
                                        </div>
                                        <Button size="sm" variant="ghost" onClick={() => setEditingSite(site)}>
                                            Edit
                                        </Button>
                                    </div>
                                ))}
                            </div>
                        </Card>
                    )}

                    {activeTab === 'rotations' && (
                        <Card>
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-lg font-semibold">Rotations</h3>
                                <Button size="sm" icon="plus" onClick={() => setEditingRotation({})}>
                                    Add Rotation
                                </Button>
                            </div>
                            <div className="space-y-3">
                                {institution.settings.rotations.map(rotation => (
                                    <div key={rotation.id} className="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                        <div>
                                            <div className="font-medium">{rotation.name} ({rotation.code})</div>
                                            <div className="text-sm text-gray-600">Min sessions: {rotation.minSessions}/month</div>
                                        </div>
                                        <Button size="sm" variant="ghost" onClick={() => setEditingRotation(rotation)}>
                                            Edit
                                        </Button>
                                    </div>
                                ))}
                            </div>
                        </Card>
                    )}

                    {activeTab === 'protected' && (
                        <Card>
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-lg font-semibold">Protected Times</h3>
                                <Button size="sm" icon="plus" onClick={() => setEditingProtectedTime({})}>
                                    Add Protected Time
                                </Button>
                            </div>
                            <div className="space-y-3">
                                {institution.settings.protectedTimes.map(pt => (
                                    <div key={pt.id} className="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                        <div>
                                            <div className="font-medium">{pt.name}</div>
                                            <div className="text-sm text-gray-600">
                                                {['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][pt.dayOfWeek]} {pt.timeSlot}
                                                {pt.mandatory && <span className="ml-2 text-red-600">Mandatory</span>}
                                            </div>
                                        </div>
                                        <Button size="sm" variant="ghost" onClick={() => setEditingProtectedTime(pt)}>
                                            Edit
                                        </Button>
                                    </div>
                                ))}
                            </div>
                        </Card>
                    )}

                    {activeTab === 'import' && (
                        <Card>
                            <h3 className="text-lg font-semibold mb-4">Import/Export Data</h3>
                            <div className="space-y-4">
                                <div className="p-4 bg-blue-50 rounded-lg">
                                    <h4 className="font-medium text-blue-900 mb-2">Export Data</h4>
                                    <p className="text-sm text-blue-700 mb-3">
                                        Download a backup of all your data including settings, attendings, residents, and rules.
                                    </p>
                                    <Button icon="download" onClick={exportData}>
                                        Export All Data
                                    </Button>
                                </div>
                                <div className="p-4 bg-amber-50 rounded-lg">
                                    <h4 className="font-medium text-amber-900 mb-2">Import Data</h4>
                                    <p className="text-sm text-amber-700 mb-3">
                                        Upload a previously exported backup file. This will replace all current data.
                                    </p>
                                    <input
                                        type="file"
                                        accept=".json"
                                        onChange={importData}
                                        className="block w-full text-sm text-gray-500
                                            file:mr-4 file:py-2 file:px-4
                                            file:rounded-lg file:border-0
                                            file:text-sm file:font-semibold
                                            file:bg-amber-100 file:text-amber-700
                                            hover:file:bg-amber-200"
                                    />
                                </div>
                                <div className="p-4 bg-red-50 rounded-lg">
                                    <h4 className="font-medium text-red-900 mb-2">Clear All Data</h4>
                                    <p className="text-sm text-red-700 mb-3">
                                        Remove all schedule assignments. This cannot be undone.
                                    </p>
                                    <Button variant="danger" icon="trash" onClick={() => store.clearAllAssignments()}>
                                        Clear All Assignments
                                    </Button>
                                </div>
                            </div>
                        </Card>
                    )}

                    {/* Edit Modals */}
                    {editingSite && (
                        <Modal
                            isOpen={true}
                            onClose={() => setEditingSite(null)}
                            title={editingSite.id ? 'Edit Site' : 'Add Site'}
                        >
                            <SiteForm site={editingSite} onSave={handleSiteSave} onCancel={() => setEditingSite(null)} />
                        </Modal>
                    )}
                    {editingRotation && (
                        <Modal
                            isOpen={true}
                            onClose={() => setEditingRotation(null)}
                            title={editingRotation.id ? 'Edit Rotation' : 'Add Rotation'}
                        >
                            <RotationForm rotation={editingRotation} onSave={handleRotationSave} onCancel={() => setEditingRotation(null)} />
                        </Modal>
                    )}
                    {editingProtectedTime && (
                        <Modal
                            isOpen={true}
                            onClose={() => setEditingProtectedTime(null)}
                            title={editingProtectedTime.id ? 'Edit Protected Time' : 'Add Protected Time'}
                        >
                            <ProtectedTimeForm protectedTime={editingProtectedTime} onSave={handleProtectedTimeSave} onCancel={() => setEditingProtectedTime(null)} />
                        </Modal>
                    )}
                </div>
            );
        };

        // Form Components for Settings
        const SiteForm = ({ site, onSave, onCancel }) => {
            const [formData, setFormData] = useState({
                name: site.name || '',
                code: site.code || '',
                color: site.color || '#3b82f6',
                address: site.address || '',
                ...site
            });

            return (
                <form onSubmit={(e) => { e.preventDefault(); onSave(formData); }} className="space-y-4">
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">Name</label>
                        <input
                            type="text"
                            value={formData.name}
                            onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                            className="w-full px-3 py-2 border rounded-lg"
                            required
                        />
                    </div>
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">Code</label>
                        <input
                            type="text"
                            value={formData.code}
                            onChange={(e) => setFormData({ ...formData, code: e.target.value.toUpperCase() })}
                            className="w-full px-3 py-2 border rounded-lg"
                            required
                        />
                    </div>
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">Color</label>
                        <input
                            type="color"
                            value={formData.color}
                            onChange={(e) => setFormData({ ...formData, color: e.target.value })}
                            className="w-full h-10"
                        />
                    </div>
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">Address</label>
                        <input
                            type="text"
                            value={formData.address}
                            onChange={(e) => setFormData({ ...formData, address: e.target.value })}
                            className="w-full px-3 py-2 border rounded-lg"
                        />
                    </div>
                    <div className="flex justify-end gap-3">
                        <Button type="button" variant="secondary" onClick={onCancel}>Cancel</Button>
                        <Button type="submit">Save</Button>
                    </div>
                </form>
            );
        };

        const RotationForm = ({ rotation, onSave, onCancel }) => {
            const [formData, setFormData] = useState({
                name: rotation.name || '',
                code: rotation.code || '',
                minSessions: rotation.minSessions || 2,
                ...rotation

                setTimeout(() => {

                    setInterpretation({ ...result, explanation });
                    setLoading(false);
