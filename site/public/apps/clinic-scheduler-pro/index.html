<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Scheduler Pro - Premium Healthcare Edition</title>

    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Display:ital@0;1&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React and dependencies -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script type="module">
        import * as dateFns from 'https://esm.sh/date-fns@2.30.0?bundle';
        import * as Recharts from 'https://esm.sh/recharts@2.5.0?bundle';
        import Papa from 'https://esm.sh/papaparse@5.4.1?bundle';
        import * as lucide from 'https://esm.sh/lucide@0.462.0?bundle';
        import * as framerMotion from 'https://esm.sh/framer-motion@11.0.3?bundle';
        import * as paperShaders from 'https://esm.sh/@paper-design/shaders@1.0.0?bundle';
        import * as paperShadersReact from 'https://esm.sh/@paper-design/shaders-react@1.0.0?bundle';
        window['date-fns'] = dateFns;
        window.Recharts = Recharts;
        window.Papa = Papa;
        window.lucide = lucide;
        window['framer-motion'] = framerMotion;
        window['@paper-design/shaders'] = paperShaders;
        window['@paper-design/shaders-react'] = paperShadersReact;
    </script>

    <!-- Additional Libraries -->

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'display': ['Playfair Display', 'serif'],
                        'emphasis': ['DM Serif Display', 'serif'],
                        'body': ['DM Sans', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif']
                    },
                    colors: {
                        medical: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            200: '#99f6e4',
                            300: '#5eead4',
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#134e4a',
                            900: '#042f2e',
                            950: '#021817'
                        },
                        primary: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            200: '#99f6e4',
                            300: '#5eead4',
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#134e4a',
                            900: '#042f2e',
                            950: '#021817'
                        },
                        accent: {
                            coral: '#fb7185',
                            amber: '#fbbf24',
                            purple: '#a78bfa',
                            emerald: '#34d399'
                        }
                    },
                    animation: {
                        'gradient': 'gradient 8s ease infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'glow': 'glow 2s ease-in-out infinite',
                        'slide-up': 'slideUp 0.5s ease-out',
                        'slide-down': 'slideDown 0.3s ease-out',
                        'fade-in': 'fadeIn 0.5s ease-out'
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --body-bg: #f0fdfa;
            --surface-bg: rgba(255, 255, 255, 0.82);
            --surface-border: rgba(148, 163, 184, 0.18);
            --text-color: rgba(15, 60, 82, 0.86);
            --muted-text: rgba(71, 85, 105, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.18);
            --shadow-sm: 0 2px 4px rgba(15, 23, 42, 0.06);
            --shadow-md: 0 10px 20px rgba(15, 23, 42, 0.1);
            --shadow-lg: 0 20px 45px rgba(15, 23, 42, 0.15);
            --shadow-xl: 0 25px 50px rgba(15, 23, 42, 0.25);
        }

        * {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(180deg, #f0fdfa 0%, #ccfbf1 100%);
            min-height: 100vh;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text-color);
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
            letter-spacing: -0.01em;
        }

        /* Premium scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(20, 184, 166, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #14b8a6, #0d9488);
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #0d9488, #0f766e);
        }

        /* Premium Calendar styles */
        .calendar-grid {
            display: grid;
            grid-template-columns: 100px repeat(5, 1fr);
            grid-auto-rows: minmax(120px, auto);
            gap: 0;
            background: transparent;
            padding: 1rem;
            border-radius: 1.5rem;
            position: relative;
        }

        .time-slot {
            background: var(--surface-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--surface-border);
            position: relative;
            min-height: 120px;
            margin: 2px;
            border-radius: 0.75rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .time-slot:hover {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: rgba(20, 184, 166, 0.3);
        }

        .time-slot.continuity {
            background: linear-gradient(135deg,
                rgba(251, 191, 36, 0.1) 0%,
                rgba(251, 191, 36, 0.2) 100%);
            border-color: rgba(251, 191, 36, 0.3);
        }

        .time-slot.protected {
            background: linear-gradient(135deg,
                rgba(167, 139, 250, 0.1) 0%,
                rgba(167, 139, 250, 0.2) 100%);
            border-color: rgba(167, 139, 250, 0.3);
        }

        .assignment-card {
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.95),
                rgba(255, 255, 255, 0.85));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 0.75rem;
            padding: 0.75rem;
            margin: 0.5rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--surface-border);
            font-size: 0.8rem;
            line-height: 1.2rem;
            cursor: move;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .assignment-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--card-accent, #14b8a6);
        }

        .assignment-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-3px) scale(1.02);
            border-color: rgba(20, 184, 166, 0.3);
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 1),
                rgba(255, 255, 255, 0.95));
        }

        .assignment-card.dragging {
            opacity: 0.6;
            transform: rotate(2deg);
            box-shadow: var(--shadow-xl);
        }

        .drop-indicator {
            border: 2px dashed #14b8a6;
            background: linear-gradient(135deg,
                rgba(20, 184, 166, 0.05),
                rgba(20, 184, 166, 0.1));
            border-radius: 0.75rem;
        }

        /* Site colors with gradients */
        .site-gss { --card-accent: linear-gradient(180deg, #34d399, #10b981); }
        .site-jhoc { --card-accent: linear-gradient(180deg, #fbbf24, #f59e0b); }
        .site-hoco { --card-accent: linear-gradient(180deg, #fb7185, #ef4444); }


        /* Premium animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(20, 184, 166, 0.3); }
            50% { box-shadow: 0 0 30px rgba(20, 184, 166, 0.5); }
        }

        @keyframes slideUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes slideDown {
            0% { transform: translateY(-20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* Loading skeleton with gradient */
        .skeleton {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            background: linear-gradient(90deg,
                rgba(20, 184, 166, 0.1) 0%,
                rgba(20, 184, 166, 0.2) 50%,
                rgba(20, 184, 166, 0.1) 100%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite, pulse 2s infinite;
            border-radius: 0.5rem;
        }

        /* Premium glass morphism effects */
        .glass {
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.1),
                rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .glass-dark {
            background: linear-gradient(135deg,
                rgba(4, 47, 46, 0.8),
                rgba(19, 78, 74, 0.6));
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2);
        }

        .glass-card {
            background: var(--surface-bg);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--surface-border);
            border-radius: 1rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(20, 184, 166, 0.35);
        }

        /* Enhanced animations */
        .animate-slide-in {
            animation: slideIn 0.3s ease-out;
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        .animate-scale-in {
            animation: scaleIn 0.3s ease-out;
        }

        .animate-pulse-soft {
            animation: pulseSoft 2s infinite;
        }

        @keyframes slideIn {
            0% { transform: translateY(-20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes scaleIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pulseSoft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Loading shimmer effect */
        .shimmer {
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.2) 20%,
                rgba(255, 255, 255, 0.5) 60%,
                rgba(255, 255, 255, 0)
            );
            animation: shimmer 2s infinite;
            background-size: 200% 100%;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Modern focus styles */
        .focus-ring {
            transition: box-shadow 0.2s ease-in-out;
        }

        .focus-ring:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
        }

        /* Enhanced transitions */
        .transition-all {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Premium card styles */
        .card-shadow {
            box-shadow: var(--shadow-sm);
        }

        .card-shadow-hover {
            box-shadow: var(--shadow-md);
        }

        .card-shadow-lg {
            box-shadow: var(--shadow-lg);
        }

        /* Premium buttons */
        .btn-premium {
            background: linear-gradient(135deg, #14b8a6, #0d9488);
            color: white;
            border-radius: 999px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .btn-premium::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent);
            transition: left 0.5s;
        }

        .btn-premium:hover::before {
            left: 100%;
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--surface-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--surface-border);
            color: var(--text-color);
            border-radius: 999px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: rgba(20, 184, 166, 0.3);
        }

        /* Premium form inputs */
        .input-premium {
            background: var(--surface-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--surface-border);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'DM Sans', sans-serif;
        }

        .input-premium:focus {
            outline: none;
            border-color: rgba(20, 184, 166, 0.5);
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.1);
            background: rgba(255, 255, 255, 0.95);
        }

        /* Premium badges */
        .badge-premium {
            background: linear-gradient(135deg, #14b8a6, #0d9488);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .badge-live {
            background: linear-gradient(135deg, #34d399, #10b981);
            animation: glow 2s ease-in-out infinite;
        }

        /* Hero gradient background */
        .hero-gradient {
            background: linear-gradient(135deg,
                #042f2e 0%,
                #134e4a 50%,
                #042f2e 100%);
            background-size: 200% 200%;
            animation: gradient 8s ease infinite;
        }

        /* Stat card styles */
        .stat-card {
            background: var(--surface-bg);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--surface-border);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle,
                rgba(20, 184, 166, 0.1) 0%,
                transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(20, 184, 166, 0.3);
        }
    </style>
</head>
<body class="font-body">
    <div id="root"></div>
    <div id="modal-root"></div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import {
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            signOut,
            onAuthStateChanged,
            sendPasswordResetEmail
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import {
            initializeFirestore,
            getFirestore,
            persistentLocalCache,
            persistentMultipleTabManager,
            doc,
            setDoc,
            getDoc,
            getDocs,
            collection,
            query,
            where,
            orderBy,
            limit,
            onSnapshot,
            addDoc,
            updateDoc,
            deleteDoc,
            serverTimestamp,
            writeBatch,
            arrayUnion,
            arrayRemove,
            increment
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import {
            getFunctions,
            httpsCallable,
            connectFunctionsEmulator
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC-f7H_RLTbwaKOhwDiYPfF3knzPMKWVeQ",
            authDomain: "autoclinicscheduler.firebaseapp.com",
            projectId: "autoclinicscheduler",
            storageBucket: "autoclinicscheduler.firebasestorage.app",
            messagingSenderId: "1032685115214",
            appId: "1:1032685115214:web:fec2c2ed4999a8eb84701f",
            measurementId: "G-JHWKCQNPNR"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        let db;
        try {
            db = initializeFirestore(app, {
                localCache: persistentLocalCache({
                    tabManager: persistentMultipleTabManager()
                })
            });
        } catch (error) {
            console.warn('Falling back to in-memory Firestore cache', error);
            db = getFirestore(app);
        }
        const functions = getFunctions(app);

        // Connect to Functions emulator if in development
        if (location.hostname === 'localhost') {
            connectFunctionsEmulator(functions, 'localhost', 5001);
        }

        // Make Firebase available globally
        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebase = {
            auth: {
                signInWithEmailAndPassword,
                createUserWithEmailAndPassword,
                signOut,
                onAuthStateChanged,
                sendPasswordResetEmail
            },
            firestore: {
                doc,
                setDoc,
                getDoc,
                getDocs,
                collection,
                query,
                where,
                orderBy,
                limit,
                onSnapshot,
                addDoc,
                updateDoc,
                deleteDoc,
                serverTimestamp,
                writeBatch,
                arrayUnion,
                arrayRemove,
                increment
            },
            functions: {
                httpsCallable: (name) => httpsCallable(functions, name)
            }
        };
    </script>

        <script src="./assets/main.js" defer></script>
</body>
</html>
