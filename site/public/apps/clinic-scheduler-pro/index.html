    <!-- Load dependencies after React is available -->
    <script type="module">
        const supportsImportMap = typeof HTMLScriptElement !== 'undefined'

            }
            return { ...mod };
        };

        async function loadDependencies() {
            try {
                const [reactMod, reactDomMod, reactDomClientMod, dateFns, Recharts, Papa, lucide, framerMotion] = await Promise.all([
                    import(resolveSpec('react', 'https://esm.sh/stable/react@18.3.1/es2022/react.mjs')),
                    import(resolveSpec('react-dom', 'https://esm.sh/stable/react-dom@18.3.1/es2022/react-dom.mjs')),
                    import(resolveSpec('react-dom/client', 'https://esm.sh/stable/react-dom@18.3.1/es2022/client.mjs')),
                    import('https://esm.sh/stable/date-fns@2.30.0/es2022/date-fns.bundle.mjs'),
                    import('https://esm.sh/stable/recharts@2.5.0/es2022/recharts.mjs?external=react,react-dom'),
                    import('https://esm.sh/stable/papaparse@5.4.1/es2022/papaparse.bundle.mjs'),
                    import('https://esm.sh/stable/lucide@0.462.0/es2022/lucide.bundle.mjs'),
                    import('https://esm.sh/stable/framer-motion@11.0.3/es2022/framer-motion.mjs?external=react,react-dom')
                ]);

                const React = mergeModule(reactMod);
                const ReactDOM = mergeModule(reactDomMod);
                const ReactDOMClient = mergeModule(reactDomClientMod);

                if (!ReactDOM.createRoot && ReactDOMClient?.createRoot) {
                    ReactDOM.createRoot = ReactDOMClient.createRoot.bind(ReactDOMClient);
                }
                if (!ReactDOM.hydrateRoot && ReactDOMClient?.hydrateRoot) {
                    ReactDOM.hydrateRoot = ReactDOMClient.hydrateRoot.bind(ReactDOMClient);
                }

                window.React = React;
                window.ReactDOM = ReactDOM;
                window['date-fns'] = dateFns;
                window.dateFns = dateFns;
                window.Recharts = Recharts;
                window.Papa = Papa;
                window.lucide = lucide;
                window['framer-motion'] = framerMotion;

                const ensureReactIdentity = (target, fallbackKey) => {
                    if (!target) return;
                    const hasReactProp = Object.prototype.hasOwnProperty.call(target, 'React');
                    if (hasReactProp && target.React === React) {
                        return;
                    }
                    try {
                        if (!hasReactProp && Object.isExtensible(target)) {
                            Object.defineProperty(target, 'React', {
                                value: React,
                                configurable: true,
                                writable: false,
                                enumerable: false
                            });
                            return;
                        }
                        if (hasReactProp) {
                            Object.defineProperty(target, 'React', {
                                value: React,
                                configurable: true,
                                writable: false
                            });
                            return;
                        }
                    } catch (error) {
                        console.warn('Failed to tag React identity on dependency', fallbackKey, error);
                    }
                    if (fallbackKey) {
                        window[fallbackKey] = React;
                    }
                };

                ensureReactIdentity(window.Recharts, '__rechartsReact');
                ensureReactIdentity(window['framer-motion'], '__framerMotionReact');

                const identityChecks = {
                    rechartsSharesWindowReact: window.Recharts?.React === React || window.__rechartsReact === React,
                    framerMotionSharesWindowReact: window['framer-motion']?.React === React || window.__framerMotionReact === React
                };
                window.depsIdentity = identityChecks;

                window.depsLoaded = true;
                window.dispatchEvent(new Event('depsLoaded'));
                console.info('[deps] Loaded', {
                    supportsImportMap,
                    reactVersion: React?.version,
                    reactDomVersion: ReactDOM?.version,
                    framerMotionHasReact: typeof framerMotion?.motion === 'function',
                    identityChecks
                });
            } catch (error) {
                console.error('Failed to load dependencies', error);
            }
        }

        loadDependencies();

    <style>
        :root {
            --body-bg: #f0fdfa;
            --surface-bg: rgba(255, 255, 255, 0.82);
            --surface-border: rgba(148, 163, 184, 0.18);
            --text-color: rgba(15, 60, 82, 0.86);
            --muted-text: rgba(71, 85, 105, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.18);
            --shadow-sm: 0 2px 4px rgba(15, 23, 42, 0.06);
            --shadow-md: 0 10px 20px rgba(15, 23, 42, 0.1);
            --shadow-lg: 0 20px 45px rgba(15, 23, 42, 0.15);
            --shadow-xl: 0 25px 50px rgba(15, 23, 42, 0.25);
        }

        * {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(180deg, #f0fdfa 0%, #ccfbf1 100%);
            min-height: 100vh;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text-color);
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
            letter-spacing: -0.01em;
        }

        /* Premium scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(20, 184, 166, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #14b8a6, #0d9488);
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #0d9488, #0f766e);
        }

        /* Premium Calendar styles */
        .calendar-grid {
            display: grid;
            grid-template-columns: 100px repeat(5, 1fr);
            grid-auto-rows: minmax(120px, auto);
            gap: 0;
            background: transparent;
            padding: 1rem;
            border-radius: 1.5rem;
            position: relative;
        }

        /* Week View Grid - 7 days */
        .calendar-grid-week {
            display: grid;
            grid-template-columns: 80px repeat(7, 1fr);
            grid-auto-rows: auto;
            gap: 0;
            background: transparent;
            padding: 1rem;
            border-radius: 1.5rem;
            position: relative;
        }

        /* Month View Grid */
        .calendar-grid-month {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0;
            background: transparent;
            padding: 1rem;
            border-radius: 1.5rem;
            position: relative;
        }

        .month-day-cell {
            background: var(--surface-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--surface-border);
            min-height: 100px;
            margin: 2px;
            padding: 8px;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .month-day-cell:hover {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: rgba(20, 184, 166, 0.3);
        }

        @media (max-width: 768px) {
            .calendar-grid-month {
                grid-template-columns: repeat(1, 1fr);
            }

            .month-day-cell {
                min-height: 80px;
            }
        }

        .time-slot {
            background: var(--surface-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--surface-border);
            position: relative;
            min-height: 120px;
            margin: 2px;
            border-radius: 0.75rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .time-slot:hover {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: rgba(20, 184, 166, 0.3);
        }

        /* Weekend slots */
        .time-slot.weekend-slot {
            background: rgba(243, 244, 246, 0.8);
            border-color: rgba(209, 213, 219, 0.6);
            opacity: 0.7;
        }

        .time-slot.weekend-slot:hover {
            background: rgba(243, 244, 246, 0.9);
            opacity: 0.8;
        }

        /* Weekend month day cells */
        .month-day-cell.weekend-slot {
            background: rgba(243, 244, 246, 0.8);
            border-color: rgba(209, 213, 219, 0.6);
            opacity: 0.7;
        }

        .month-day-cell.weekend-slot:hover {
            background: rgba(243, 244, 246, 0.9);
            opacity: 0.8;
        }

        /* Today's slots */

            border: 2px solid rgba(20, 184, 166, 0.5);
            background: rgba(167, 243, 208, 0.05);
        }

        .time-slot.today-slot:hover {
            border-color: rgba(20, 184, 166, 0.7);
            background: rgba(167, 243, 208, 0.1);
        }

        .time-slot.continuity {
            background: linear-gradient(135deg,
                rgba(251, 191, 36, 0.1) 0%,
                rgba(251, 191, 36, 0.2) 100%);
            border-color: rgba(251, 191, 36, 0.3);
        }

        .time-slot.protected {
            background: linear-gradient(135deg,
                rgba(167, 139, 250, 0.1) 0%,
                rgba(167, 139, 250, 0.2) 100%);
            border-color: rgba(167, 139, 250, 0.3);
        }

        .assignment-card {
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.95),
                rgba(255, 255, 255, 0.85));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 0.75rem;
            padding: 0.75rem;
            margin: 0.5rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--surface-border);
            font-size: 0.8rem;
            line-height: 1.2rem;
            cursor: move;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .assignment-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--card-accent, #14b8a6);
        }

        .assignment-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-3px) scale(1.02);
            border-color: rgba(20, 184, 166, 0.3);
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 1),
                rgba(255, 255, 255, 0.95));
        }

        .assignment-card.dragging {
            opacity: 0.6;
            transform: rotate(2deg);
            box-shadow: var(--shadow-xl);
        }

        .drop-indicator {
            border: 2px dashed #14b8a6;
            background: linear-gradient(135deg,
                rgba(20, 184, 166, 0.05),
                rgba(20, 184, 166, 0.1));
            border-radius: 0.75rem;
        }

        /* Site colors with gradients */
        .site-gss { --card-accent: linear-gradient(180deg, #34d399, #10b981); }
        .site-jhoc { --card-accent: linear-gradient(180deg, #fbbf24, #f59e0b); }
        .site-hoco { --card-accent: linear-gradient(180deg, #fb7185, #ef4444); }


        /* Premium animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(20, 184, 166, 0.3); }
            50% { box-shadow: 0 0 30px rgba(20, 184, 166, 0.5); }
        }

        @keyframes slideUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes slideDown {
            0% { transform: translateY(-20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* Loading skeleton with gradient */
        .skeleton {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            background: linear-gradient(90deg,
                rgba(20, 184, 166, 0.1) 0%,
                rgba(20, 184, 166, 0.2) 50%,
                rgba(20, 184, 166, 0.1) 100%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite, pulse 2s infinite;
            border-radius: 0.5rem;
        }

        /* Premium glass morphism effects */
        .glass {
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.1),
                rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .glass-dark {
            background: linear-gradient(135deg,

                rgba(19, 78, 74, 0.6));
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2);
        }

        .glass-card {
            background: var(--surface-bg);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--surface-border);
            border-radius: 1rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(20, 184, 166, 0.35);
        }

        /* Enhanced animations */
        .animate-slide-in {
            animation: slideIn 0.3s ease-out;
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        .animate-scale-in {
            animation: scaleIn 0.3s ease-out;
        }

        .animate-pulse-soft {
            animation: pulseSoft 2s infinite;
        }

        @keyframes slideIn {
            0% { transform: translateY(-20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes scaleIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pulseSoft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Loading shimmer effect */
        .shimmer {
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.2) 20%,
                rgba(255, 255, 255, 0.5) 60%,
                rgba(255, 255, 255, 0)

            animation: shimmer 2s infinite;
            background-size: 200% 100%;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Modern focus styles */
        .focus-ring {
            transition: box-shadow 0.2s ease-in-out;
        }

        .focus-ring:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
        }

        /* Enhanced transitions */
        .transition-all {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Premium card styles */
        .card-shadow {
            box-shadow: var(--shadow-sm);
        }

        .card-shadow-hover {
            box-shadow: var(--shadow-md);
        }

        .card-shadow-lg {
            box-shadow: var(--shadow-lg);
        }

        /* Premium buttons */
        .btn-premium {
            background: linear-gradient(135deg, #14b8a6, #0d9488);
            color: white;
            border-radius: 999px;
            padding: 0.75rem 1.5rem;

        }

            content: '';

            outline: none;
            border-color: rgba(20, 184, 166, 0.5);

            background: rgba(255, 255, 255, 0.95);
        }

            background: linear-gradient(135deg, #14b8a6, #0d9488);

                #134e4a 50%,
                #042f2e 100%);
            background-size: 200% 200%;
            animation: gradient 8s ease infinite;
        }

        .stat-card {
            background: var(--surface-bg);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--surface-border);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;

            // Wait for all dependencies before loading main.js
            function appendMainBundle() {
                const script = document.createElement('script');
                script.src = `./assets/main.js?v=${CACHE_VERSION}`;
                script.type = 'module';
                script.crossOrigin = 'anonymous';
                document.body.appendChild(script);

                    window.addEventListener('depsLoaded', appendMainBundle, { once: true });

            // Start loading after DOM is ready
