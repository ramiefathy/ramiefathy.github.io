<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Professional local-first PDF Studio for organizing, extracting, assembling, stamping, OCR, and document cleanup workflows.">
  <title>PDF Studio</title>
  <link rel="stylesheet" href="./shared/legacy-tokens.css">
  <link rel="stylesheet" href="./shared/legacy-primitives.css">
  <link rel="stylesheet" href="./shared/legacy-shell.css">
  <link rel="stylesheet" href="./shared/legacy-workflow.css">
  <link rel="stylesheet" href="./shared/pdf-studio.css">
  <script src="./shared/legacy-shell.js" defer></script>
  <script src="./shared/legacy-status.js" defer></script>
  <script src="./shared/legacy-guidance.js" defer></script>
  <script src="./vendor/pdf-lib.min.js" defer></script>
  <script src="./vendor/pdf.min.js" defer></script>
</head>
<body class="legacy-focus-ring pdf-studio-page" data-legacy-shell="true" data-help-steps='["Pick a tool in the left panel.","Load your files and review preflight checks.","Run generation and use the single output panel to download results."]'>
  <main class="pdf-studio" data-workflow="pdf-studio">
    <aside class="pdf-studio__toolnav" id="pdf-studio-nav"></aside>

    <section class="pdf-studio__workspace">
      <section class="legacy-workflow__panel" aria-live="polite">
        <h1 id="pdf-studio-title">PDF Studio</h1>
        <p class="legacy-workflow__description" id="pdf-studio-subtitle">Local-first professional PDF workflows with shared preflight and output summaries.</p>
      </section>
      <section class="legacy-workflow pdf-studio__workflow" data-workflow="pdf">
        <section class="legacy-workflow__panel legacy-workflow__primary" id="pdf-studio-primary"></section>
        <aside class="legacy-workflow__panel legacy-workflow__secondary" id="pdf-studio-secondary"></aside>
      </section>
    </section>
  </main>

  <script type="module" src="./shared/pdf-studio/main.js"></script>
</body>
</html>
