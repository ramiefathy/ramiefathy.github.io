<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Scheduler Pro - Intelligent Residency Schedule Management</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React and Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Additional Libraries -->
    <script src="https://unpkg.com/immer@10.0.3/dist/immer.umd.production.min.js"></script>
    <script src="https://unpkg.com/zustand@4.4.7/vanilla.mjs" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@3.0.0/index.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.16/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/react-hot-toast@2.4.1/dist/index.umd.js"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <!-- Google Generative AI for Natural Language Processing -->
    <script type="importmap">
    {
        "imports": {
            "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
    }
    </script>

    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                            950: '#172554'
                        },
                        gray: {
                            850: '#18202f'
                        }
                    },
                    animation: {
                        'slide-in': 'slideIn 0.3s ease-out',
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'scale-in': 'scaleIn 0.3s ease-out',
                        'pulse-soft': 'pulseSoft 2s infinite'
                    },
                    keyframes: {
                        slideIn: {
                            '0%': { transform: 'translateY(-20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        scaleIn: {
                            '0%': { transform: 'scale(0.9)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' }
                        },
                        pulseSoft: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.5' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Modern glass morphism effects */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .glass-dark {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Modern scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Loading shimmer effect */
        .shimmer {
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.2) 20%,
                rgba(255, 255, 255, 0.5) 60%,
                rgba(255, 255, 255, 0)
            );
            animation: shimmer 2s infinite;
            background-size: 200% 100%;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Modern focus styles */
        .focus-ring {
            @apply focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2;
        }

        /* Smooth transitions */
        * {
            transition-property: background-color, border-color, color, fill, stroke, opacity, box-shadow, transform;
            transition-duration: 200ms;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>
    <div id="modal-root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useCallback, useMemo, useRef, createContext, useContext, Fragment } = React;
        const { createPortal } = ReactDOM;
        const { motion, AnimatePresence } = window['framer-motion'];
        const { toast, Toaster } = window['react-hot-toast'];
        const { format, addDays, startOfWeek, endOfWeek, isWithinInterval, differenceInDays, parseISO, startOfMonth, endOfMonth, eachDayOfInterval, getDay, isSameMonth, isSameDay } = window['date-fns'];

        // ==================== Data Store ====================
        class DataStore {
            constructor() {
                this.listeners = new Set();
                this.state = this.loadState();
            }

            loadState() {
                const saved = localStorage.getItem('clinic_scheduler_modern');
                if (saved) {
                    try {
                        return JSON.parse(saved);
                    } catch (e) {
                        console.error('Failed to load state:', e);
                    }
                }

                return {
                    institution: {
                        id: 'default',
                        name: 'Medical Center',
                        settings: {
                            sites: [
                                { id: 'gss', name: 'GSS', code: 'GSS', color: '#10b981' },
                                { id: 'jhoc', name: 'JHOC', code: 'JHOC', color: '#f59e0b' },
                                { id: 'hoco', name: 'HoCo', code: 'HOCO', color: '#ef4444' }
                            ],
                            rotations: [
                                { id: 'gss-rot', name: 'GSS', code: 'GSS' },
                                { id: 'jhoc-rot', name: 'JHOC', code: 'JHOC' },
                                { id: 'hoco-rot', name: 'HoCo', code: 'HOCO' },
                                { id: 'peds', name: 'Pediatrics', code: 'PEDS' },
                                { id: 'path', name: 'Dermatopathology', code: 'PATH' },
                                { id: 'consults', name: 'Consults', code: 'CONSULTS' }
                            ],
                            protectedTimes: [
                                {
                                    id: 'didactics',
                                    name: 'Didactics',
                                    dayOfWeek: 3, // Wednesday
                                    timeSlot: 'AM',
                                    applies: 'all'
                                }
                            ]
                        }
                    },
                    users: [
                        { id: 'admin', name: 'Admin', email: 'admin@clinic.com', role: 'program_admin' }
                    ],
                    currentUser: { id: 'admin', name: 'Admin', role: 'program_admin' },
                    attendings: [],
                    residents: [],
                    scheduleAssignments: {},
                    rules: [],
                    preferences: {}
                };
            }

            saveState() {
                localStorage.setItem('clinic_scheduler_modern', JSON.stringify(this.state));
                this.notifyListeners();
            }

            subscribe(listener) {
                this.listeners.add(listener);
                return () => this.listeners.delete(listener);
            }

            notifyListeners() {
                this.listeners.forEach(listener => listener(this.state));
            }

            getState() {
                return this.state;
            }

            setState(updater) {
                this.state = typeof updater === 'function' ? updater(this.state) : updater;
                this.saveState();
            }

            // Helper methods
            addAttending(attending) {
                this.setState(state => ({
                    ...state,
                    attendings: [...state.attendings, { ...attending, id: `att_${Date.now()}` }]
                }));
            }

            updateAttending(id, updates) {
                this.setState(state => ({
                    ...state,
                    attendings: state.attendings.map(att =>
                        att.id === id ? { ...att, ...updates } : att
                    )
                }));
            }

            deleteAttending(id) {
                this.setState(state => ({
                    ...state,
                    attendings: state.attendings.filter(att => att.id !== id)
                }));
            }

            addResident(resident) {
                this.setState(state => ({
                    ...state,
                    residents: [...state.residents, { ...resident, id: `res_${Date.now()}` }]
                }));
            }

            updateResident(id, updates) {
                this.setState(state => ({
                    ...state,
                    residents: state.residents.map(res =>
                        res.id === id ? { ...res, ...updates } : res
                    )
                }));
            }

            deleteResident(id) {
                this.setState(state => ({
                    ...state,
                    residents: state.residents.filter(res => res.id !== id)
                }));
            }

            setAssignment(date, timeSlot, residentId, assignment) {
                const key = `${date}_${timeSlot}_${residentId}`;
                this.setState(state => ({
                    ...state,
                    scheduleAssignments: {
                        ...state.scheduleAssignments,
                        [key]: assignment
                    }
                }));
            }

            addRule(rule) {
                this.setState(state => ({
                    ...state,
                    rules: [...state.rules, { ...rule, id: `rule_${Date.now()}` }]
                }));
            }

            updateRule(id, updates) {
                this.setState(state => ({
                    ...state,
                    rules: state.rules.map(rule =>
                        rule.id === id ? { ...rule, ...updates } : rule
                    )
                }));
            }

            deleteRule(id) {
                this.setState(state => ({
                    ...state,
                    rules: state.rules.filter(rule => rule.id !== id)
                }));
            }
        }

        const store = new DataStore();

        // ==================== Context ====================
        const AppContext = createContext();

        const AppProvider = ({ children }) => {
            const [state, setState] = useState(store.getState());

            useEffect(() => {
                return store.subscribe(setState);
            }, []);

            const value = {
                ...state,
                store
            };

            return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
        };

        const useApp = () => useContext(AppContext);

        // ==================== Components ====================

        // Icon component wrapper
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, []);

            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        // Modern button component
        const Button = ({ children, variant = 'primary', size = 'md', className = "", icon, ...props }) => {
            const baseClasses = "inline-flex items-center justify-center font-medium rounded-lg transition-all focus-ring";

            const variants = {
                primary: "bg-primary-600 text-white hover:bg-primary-700 shadow-lg shadow-primary-600/20",
                secondary: "bg-white text-gray-700 border border-gray-300 hover:bg-gray-50",
                ghost: "text-gray-600 hover:bg-gray-100",
                danger: "bg-red-600 text-white hover:bg-red-700",
                success: "bg-green-600 text-white hover:bg-green-700"
            };

            const sizes = {
                sm: "px-3 py-1.5 text-sm gap-1.5",
                md: "px-4 py-2 text-sm gap-2",
                lg: "px-6 py-3 text-base gap-2"
            };

            return (
                <motion.button
                    whileHover={{ scale: 1.02 }}
                    whileTap={{ scale: 0.98 }}
                    className={`${baseClasses} ${variants[variant]} ${sizes[size]} ${className}`}
                    {...props}
                >
                    {icon && <Icon name={icon} size={size === 'sm' ? 16 : size === 'lg' ? 20 : 18} />}
                    {children}
                </motion.button>
            );
        };

        // Card component
        const Card = ({ children, className = "", padding = true }) => {
            return (
                <motion.div
                    initial={{ opacity: 0, y: 20 }}
                    animate={{ opacity: 1, y: 0 }}
                    className={`bg-white rounded-xl shadow-sm border border-gray-200 ${padding ? 'p-6' : ''} ${className}`}
                >
                    {children}
                </motion.div>
            );
        };

        // Modal component
        const Modal = ({ isOpen, onClose, title, children, size = 'md' }) => {
            const sizes = {
                sm: 'max-w-md',
                md: 'max-w-2xl',
                lg: 'max-w-4xl',
                xl: 'max-w-6xl',
                full: 'max-w-full mx-4'
            };

            if (!isOpen) return null;

            return createPortal(
                <AnimatePresence>
                    <motion.div
                        initial={{ opacity: 0 }}
                        animate={{ opacity: 1 }}
                        exit={{ opacity: 0 }}
                        className="fixed inset-0 z-50 overflow-y-auto"
                    >
                        <div className="flex items-center justify-center min-h-screen p-4">
                            <motion.div
                                initial={{ opacity: 0 }}
                                animate={{ opacity: 1 }}
                                className="fixed inset-0 bg-black/50 backdrop-blur-sm"
                                onClick={onClose}
                            />
                            <motion.div
                                initial={{ opacity: 0, scale: 0.95, y: 20 }}
                                animate={{ opacity: 1, scale: 1, y: 0 }}
                                className={`relative bg-white rounded-2xl shadow-2xl ${sizes[size]} w-full max-h-[90vh] overflow-hidden`}
                            >
                                <div className="flex items-center justify-between p-6 border-b">
                                    <h3 className="text-xl font-semibold text-gray-900">{title}</h3>
                                    <button
                                        onClick={onClose}
                                        className="p-2 hover:bg-gray-100 rounded-lg transition-colors"
                                    >
                                        <Icon name="x" size={20} />
                                    </button>
                                </div>
                                <div className="p-6 overflow-y-auto max-h-[calc(90vh-80px)]">
                                    {children}
                                </div>
                            </motion.div>
                        </div>
                    </motion.div>
                </AnimatePresence>,
                document.getElementById('modal-root')
            );
        };

        // Tab component
        const Tabs = ({ tabs, activeTab, onChange }) => {
            return (
                <div className="flex space-x-1 bg-gray-100 p-1 rounded-lg">
                    {tabs.map(tab => (
                        <button
                            key={tab.id}
                            onClick={() => onChange(tab.id)}
                            className={`
                                flex-1 flex items-center justify-center gap-2 px-4 py-2 rounded-lg font-medium transition-all
                                ${activeTab === tab.id
                                    ? 'bg-white text-primary-600 shadow-sm'
                                    : 'text-gray-600 hover:text-gray-900'
                                }
                            `}
                        >
                            {tab.icon && <Icon name={tab.icon} size={18} />}
                            {tab.label}
                        </button>
                    ))}
                </div>
            );
        };

        // ==================== Main Navigation ====================
        const Navigation = ({ activeView, onViewChange }) => {
            const { currentUser } = useApp();

            const navItems = [
                { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                { id: 'schedule', label: 'Schedule', icon: 'calendar' },
                { id: 'attendings', label: 'Attendings', icon: 'users' },
                { id: 'residents', label: 'Residents', icon: 'user-check' },
                { id: 'rules', label: 'Rules', icon: 'shield-check' },
                { id: 'settings', label: 'Settings', icon: 'settings' }
            ];

            return (
                <nav className="bg-white shadow-sm border-b border-gray-200">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between h-16">
                            <div className="flex items-center">
                                <div className="flex items-center gap-3">
                                    <div className="p-2 bg-primary-100 rounded-lg">
                                        <Icon name="calendar-days" size={24} className="text-primary-600" />
                                    </div>
                                    <div>
                                        <h1 className="text-lg font-bold text-gray-900">Clinic Scheduler Pro</h1>
                                        <p className="text-xs text-gray-500">Intelligent Schedule Management</p>
                                    </div>
                                </div>

                                <div className="hidden md:flex ml-10 space-x-1">
                                    {navItems.map(item => (
                                        <button
                                            key={item.id}
                                            onClick={() => onViewChange(item.id)}
                                            className={`
                                                px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-all
                                                ${activeView === item.id
                                                    ? 'bg-primary-50 text-primary-700'
                                                    : 'text-gray-600 hover:bg-gray-50'
                                                }
                                            `}
                                        >
                                            <Icon name={item.icon} size={16} />
                                            {item.label}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="flex items-center gap-4">
                                <button className="p-2 hover:bg-gray-100 rounded-lg relative">
                                    <Icon name="bell" size={20} />
                                    <span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                                </button>

                                <div className="flex items-center gap-2">
                                    <div className="w-8 h-8 bg-primary-100 rounded-full flex items-center justify-center">
                                        <Icon name="user" size={16} className="text-primary-600" />
                                    </div>
                                    <div className="hidden sm:block">
                                        <p className="text-sm font-medium text-gray-900">{currentUser.name}</p>
                                        <p className="text-xs text-gray-500">{currentUser.role.replace('_', ' ')}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </nav>
            );
        };

        // ==================== Dashboard View ====================
        const Dashboard = () => {
            const { attendings, residents, scheduleAssignments } = useApp();

            const stats = [
                { label: 'Total Attendings', value: attendings.length, icon: 'users', color: 'blue' },
                { label: 'Total Residents', value: residents.length, icon: 'user-check', color: 'green' },
                { label: 'Scheduled Sessions', value: Object.keys(scheduleAssignments).length, icon: 'calendar-check', color: 'purple' },
                { label: 'Coverage Rate', value: '87%', icon: 'trending-up', color: 'amber' }
            ];

            const getColorClasses = (color) => {
                const colors = {
                    blue: 'bg-blue-100 text-blue-600',
                    green: 'bg-green-100 text-green-600',
                    purple: 'bg-purple-100 text-purple-600',
                    amber: 'bg-amber-100 text-amber-600'
                };
                return colors[color] || colors.blue;
            };

            return (
                <div className="space-y-6">
                    <div className="flex items-center justify-between">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-900">Dashboard</h2>
                            <p className="text-gray-600">Overview of your scheduling system</p>
                        </div>
                        <Button icon="download" variant="secondary">
                            Export Report
                        </Button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        {stats.map((stat, index) => (
                            <motion.div
                                key={stat.label}
                                initial={{ opacity: 0, y: 20 }}
                                animate={{ opacity: 1, y: 0 }}
                                transition={{ delay: index * 0.1 }}
                            >
                                <Card className="hover:shadow-lg transition-shadow">
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <p className="text-sm text-gray-600">{stat.label}</p>
                                            <p className="text-3xl font-bold text-gray-900 mt-1">{stat.value}</p>
                                        </div>
                                        <div className={`p-3 rounded-lg ${getColorClasses(stat.color)}`}>
                                            <Icon name={stat.icon} size={24} />
                                        </div>
                                    </div>
                                </Card>
                            </motion.div>
                        ))}
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <Card>
                            <h3 className="text-lg font-semibold text-gray-900 mb-4">Quick Actions</h3>
                            <div className="space-y-3">
                                <Button icon="plus" className="w-full justify-start" variant="secondary">
                                    Add New Resident
                                </Button>
                                <Button icon="calendar-plus" className="w-full justify-start" variant="secondary">
                                    Create Schedule Block
                                </Button>
                                <Button icon="sparkles" className="w-full justify-start" variant="secondary">
                                    Generate Auto-Schedule
                                </Button>
                                <Button icon="file-text" className="w-full justify-start" variant="secondary">
                                    Create New Rule
                                </Button>
                            </div>
                        </Card>

                        <Card>
                            <h3 className="text-lg font-semibold text-gray-900 mb-4">Recent Activity</h3>
                            <div className="space-y-3">
                                {[
                                    { action: 'Schedule updated', time: '2 hours ago', icon: 'calendar' },
                                    { action: 'New resident added', time: '5 hours ago', icon: 'user-plus' },
                                    { action: 'Rule created', time: '1 day ago', icon: 'shield' },
                                    { action: 'Report generated', time: '2 days ago', icon: 'file-text' }
                                ].map((activity, index) => (
                                    <div key={index} className="flex items-center gap-3 p-3 hover:bg-gray-50 rounded-lg">
                                        <div className="p-2 bg-gray-100 rounded-lg">
                                            <Icon name={activity.icon} size={16} className="text-gray-600" />
                                        </div>
                                        <div className="flex-1">
                                            <p className="text-sm font-medium text-gray-900">{activity.action}</p>
                                            <p className="text-xs text-gray-500">{activity.time}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </Card>
                    </div>
                </div>
            );
        };

        // ==================== Attendings Management ====================
        const AttendingsView = () => {
            const { attendings, institution, store } = useApp();
            const [showAddModal, setShowAddModal] = useState(false);
            const [editingAttending, setEditingAttending] = useState(null);

            const AttendingForm = ({ attending, onClose }) => {
                const [formData, setFormData] = useState(attending || {
                    name: '',
                    site: institution.settings.sites[0]?.id || '',
                    capacityAM: 1,
                    capacityPM: 1,
                    availabilityPattern: {
                        monday: { am: false, pm: false },
                        tuesday: { am: false, pm: false },
                        wednesday: { am: false, pm: false },
                        thursday: { am: false, pm: false },
                        friday: { am: false, pm: false }
                    }
                });

                const handleSubmit = (e) => {
                    e.preventDefault();
                    if (attending) {
                        store.updateAttending(attending.id, formData);
                        toast.success('Attending updated successfully');
                    } else {
                        store.addAttending(formData);
                        toast.success('Attending added successfully');
                    }
                    onClose();
                };

                const toggleAvailability = (day, period) => {
                    setFormData(prev => ({
                        ...prev,
                        availabilityPattern: {
                            ...prev.availabilityPattern,
                            [day]: {
                                ...prev.availabilityPattern[day],
                                [period]: !prev.availabilityPattern[day][period]
                            }
                        }
                    }));
                };

                const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday'];
                const dayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

                return (
                    <form onSubmit={handleSubmit} className="space-y-6">
                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Name</label>
                                <input
                                    type="text"
                                    value={formData.name}
                                    onChange={(e) => setFormData({...formData, name: e.target.value})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Primary Site</label>
                                <select
                                    value={formData.site}
                                    onChange={(e) => setFormData({...formData, site: e.target.value})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                >
                                    {institution.settings.sites.map(site => (
                                        <option key={site.id} value={site.id}>{site.name}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">AM Capacity</label>
                                <input
                                    type="number"
                                    min="0"
                                    max="10"
                                    value={formData.capacityAM}
                                    onChange={(e) => setFormData({...formData, capacityAM: parseInt(e.target.value)})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">PM Capacity</label>
                                <input
                                    type="number"
                                    min="0"
                                    max="10"
                                    value={formData.capacityPM}
                                    onChange={(e) => setFormData({...formData, capacityPM: parseInt(e.target.value)})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                />
                            </div>
                        </div>

                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-3">Default Availability Pattern</label>
                            <div className="bg-gray-50 rounded-lg p-4">
                                <div className="grid grid-cols-6 gap-2 text-center text-xs font-medium text-gray-600 mb-2">
                                    <div></div>
                                    {dayLabels.map(day => (
                                        <div key={day}>{day}</div>
                                    ))}
                                </div>
                                {['am', 'pm'].map(period => (
                                    <div key={period} className="grid grid-cols-6 gap-2 mb-2">
                                        <div className="text-xs font-medium text-gray-600 uppercase">{period}</div>
                                        {days.map((day, index) => (
                                            <button
                                                key={day}
                                                type="button"
                                                onClick={() => toggleAvailability(day, period)}
                                                className={`
                                                    p-2 rounded-lg transition-all
                                                    ${formData.availabilityPattern[day][period]
                                                        ? 'bg-primary-500 text-white'
                                                        : 'bg-white border border-gray-300 hover:bg-gray-100'
                                                    }
                                                `}
                                            >
                                                <Icon name={formData.availabilityPattern[day][period] ? 'check' : 'x'} size={14} />
                                            </button>
                                        ))}
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="flex justify-end gap-3">
                            <Button type="button" variant="secondary" onClick={onClose}>
                                Cancel
                            </Button>
                            <Button type="submit" icon="save">
                                {attending ? 'Update' : 'Add'} Attending
                            </Button>
                        </div>
                    </form>
                );
            };

            return (
                <div className="space-y-6">
                    <div className="flex items-center justify-between">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-900">Attendings</h2>
                            <p className="text-gray-600">Manage attending physicians and their availability</p>
                        </div>
                        <Button icon="plus" onClick={() => setShowAddModal(true)}>
                            Add Attending
                        </Button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {attendings.map(attending => {
                            const site = institution.settings.sites.find(s => s.id === attending.site);
                            return (
                                <motion.div
                                    key={attending.id}
                                    initial={{ opacity: 0, scale: 0.95 }}
                                    animate={{ opacity: 1, scale: 1 }}
                                    whileHover={{ scale: 1.02 }}
                                >
                                    <Card className="hover:shadow-lg transition-shadow">
                                        <div className="flex justify-between items-start mb-3">
                                            <div>
                                                <h3 className="font-semibold text-gray-900">{attending.name}</h3>
                                                <div className="flex items-center gap-2 mt-1">
                                                    <span
                                                        className="px-2 py-1 text-xs rounded-full font-medium"
                                                        style={{
                                                            backgroundColor: `${site?.color}20`,
                                                            color: site?.color
                                                        }}
                                                    >
                                                        {site?.name}
                                                    </span>
                                                </div>
                                            </div>
                                            <div className="flex gap-1">
                                                <button
                                                    onClick={() => {
                                                        setEditingAttending(attending);
                                                        setShowAddModal(true);
                                                    }}
                                                    className="p-1.5 hover:bg-gray-100 rounded-lg"
                                                >
                                                    <Icon name="edit" size={16} />
                                                </button>
                                                <button
                                                    onClick={() => {
                                                        if (confirm('Are you sure you want to delete this attending?')) {
                                                            store.deleteAttending(attending.id);
                                                            toast.success('Attending deleted');
                                                        }
                                                    }}
                                                    className="p-1.5 hover:bg-red-50 text-red-600 rounded-lg"
                                                >
                                                    <Icon name="trash-2" size={16} />
                                                </button>
                                            </div>
                                        </div>

                                        <div className="text-sm text-gray-600 space-y-1">
                                            <div className="flex justify-between">
                                                <span>AM Capacity:</span>
                                                <span className="font-medium">{attending.capacityAM}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span>PM Capacity:</span>
                                                <span className="font-medium">{attending.capacityPM}</span>
                                            </div>
                                        </div>

                                        <div className="mt-3 pt-3 border-t">
                                            <p className="text-xs text-gray-500 mb-2">Default Availability</p>
                                            <div className="grid grid-cols-5 gap-1 text-center">
                                                {['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].map((day, i) => {
                                                    const dayKey = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday'][i];
                                                    const pattern = attending.availabilityPattern?.[dayKey] || { am: false, pm: false };
                                                    return (
                                                        <div key={day} className="text-xs">
                                                            <div className="font-medium text-gray-600 mb-1">{day}</div>
                                                            <div className={`rounded px-1 py-0.5 mb-0.5 ${pattern.am ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-400'}`}>
                                                                AM
                                                            </div>
                                                            <div className={`rounded px-1 py-0.5 ${pattern.pm ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-400'}`}>
                                                                PM
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </Card>
                                </motion.div>
                            );
                        })}

                        {attendings.length === 0 && (
                            <div className="col-span-full">
                                <Card className="text-center py-12">
                                    <Icon name="users" size={48} className="mx-auto text-gray-400 mb-4" />
                                    <h3 className="text-lg font-medium text-gray-900 mb-2">No Attendings Yet</h3>
                                    <p className="text-gray-600 mb-4">Get started by adding your first attending physician</p>
                                    <Button icon="plus" onClick={() => setShowAddModal(true)}>
                                        Add First Attending
                                    </Button>
                                </Card>
                            </div>
                        )}
                    </div>

                    <Modal
                        isOpen={showAddModal}
                        onClose={() => {
                            setShowAddModal(false);
                            setEditingAttending(null);
                        }}
                        title={editingAttending ? 'Edit Attending' : 'Add New Attending'}
                    >
                        <AttendingForm
                            attending={editingAttending}
                            onClose={() => {
                                setShowAddModal(false);
                                setEditingAttending(null);
                            }}
                        />
                    </Modal>
                </div>
            );
        };

        // ==================== Residents Management ====================
        const ResidentsView = () => {
            const { residents, institution, store } = useApp();
            const [showAddModal, setShowAddModal] = useState(false);
            const [editingResident, setEditingResident] = useState(null);

            const ResidentForm = ({ resident, onClose }) => {
                const [formData, setFormData] = useState(resident || {
                    name: '',
                    pgyLevel: 2,
                    rotation: institution.settings.rotations[0]?.id || '',
                    continuitySite: institution.settings.sites[0]?.id || '',
                    continuityDay: 'monday',
                    continuityTime: 'AM',
                    preferences: {
                        preferredSites: [],
                        preferredAttendings: []
                    }
                });

                const handleSubmit = (e) => {
                    e.preventDefault();
                    if (resident) {
                        store.updateResident(resident.id, formData);
                        toast.success('Resident updated successfully');
                    } else {
                        store.addResident(formData);
                        toast.success('Resident added successfully');
                    }
                    onClose();
                };

                return (
                    <form onSubmit={handleSubmit} className="space-y-6">
                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Name</label>
                                <input
                                    type="text"
                                    value={formData.name}
                                    onChange={(e) => setFormData({...formData, name: e.target.value})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">PGY Level</label>
                                <select
                                    value={formData.pgyLevel}
                                    onChange={(e) => setFormData({...formData, pgyLevel: parseInt(e.target.value)})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                >
                                    <option value={2}>PGY-2</option>
                                    <option value={3}>PGY-3</option>
                                    <option value={4}>PGY-4</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Current Rotation</label>
                                <select
                                    value={formData.rotation}
                                    onChange={(e) => setFormData({...formData, rotation: e.target.value})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                >
                                    {institution.settings.rotations.map(rotation => (
                                        <option key={rotation.id} value={rotation.id}>{rotation.name}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Continuity Site</label>
                                <select
                                    value={formData.continuitySite}
                                    onChange={(e) => setFormData({...formData, continuitySite: e.target.value})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                >
                                    {institution.settings.sites.map(site => (
                                        <option key={site.id} value={site.id}>{site.name}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Continuity Day</label>
                                <select
                                    value={formData.continuityDay}
                                    onChange={(e) => setFormData({...formData, continuityDay: e.target.value})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                >
                                    <option value="monday">Monday</option>
                                    <option value="tuesday">Tuesday</option>
                                    <option value="wednesday">Wednesday</option>
                                    <option value="thursday">Thursday</option>
                                    <option value="friday">Friday</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Continuity Time</label>
                                <select
                                    value={formData.continuityTime}
                                    onChange={(e) => setFormData({...formData, continuityTime: e.target.value})}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                >
                                    <option value="AM">AM</option>
                                    <option value="PM">PM</option>
                                </select>
                            </div>
                        </div>

                        <div className="flex justify-end gap-3">
                            <Button type="button" variant="secondary" onClick={onClose}>
                                Cancel
                            </Button>
                            <Button type="submit" icon="save">
                                {resident ? 'Update' : 'Add'} Resident
                            </Button>
                        </div>
                    </form>
                );
            };

            const pgyColors = {
                2: { bg: 'bg-blue-100', text: 'text-blue-700' },
                3: { bg: 'bg-purple-100', text: 'text-purple-700' },
                4: { bg: 'bg-green-100', text: 'text-green-700' }
            };

            return (
                <div className="space-y-6">
                    <div className="flex items-center justify-between">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-900">Residents</h2>
                            <p className="text-gray-600">Manage residents and their schedules</p>
                        </div>
                        <Button icon="plus" onClick={() => setShowAddModal(true)}>
                            Add Resident
                        </Button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {residents.map(resident => {
                            const rotation = institution.settings.rotations.find(r => r.id === resident.rotation);
                            const continuitySite = institution.settings.sites.find(s => s.id === resident.continuitySite);
                            const colors = pgyColors[resident.pgyLevel] || pgyColors[2];

                            return (
                                <motion.div
                                    key={resident.id}
                                    initial={{ opacity: 0, scale: 0.95 }}
                                    animate={{ opacity: 1, scale: 1 }}
                                    whileHover={{ scale: 1.02 }}
                                >
                                    <Card className="hover:shadow-lg transition-shadow">
                                        <div className="flex justify-between items-start mb-3">
                                            <div>
                                                <h3 className="font-semibold text-gray-900">{resident.name}</h3>
                                                <div className="flex items-center gap-2 mt-1">
                                                    <span className={`px-2 py-1 text-xs rounded-full font-medium ${colors.bg} ${colors.text}`}>
                                                        PGY-{resident.pgyLevel}
                                                    </span>
                                                    <span className="text-xs text-gray-500">
                                                        {rotation?.name}
                                                    </span>
                                                </div>
                                            </div>
                                            <div className="flex gap-1">
                                                <button
                                                    onClick={() => {
                                                        setEditingResident(resident);
                                                        setShowAddModal(true);
                                                    }}
                                                    className="p-1.5 hover:bg-gray-100 rounded-lg"
                                                >
                                                    <Icon name="edit" size={16} />
                                                </button>
                                                <button
                                                    onClick={() => {
                                                        if (confirm('Are you sure you want to delete this resident?')) {
                                                            store.deleteResident(resident.id);
                                                            toast.success('Resident deleted');
                                                        }
                                                    }}
                                                    className="p-1.5 hover:bg-red-50 text-red-600 rounded-lg"
                                                >
                                                    <Icon name="trash-2" size={16} />
                                                </button>
                                            </div>
                                        </div>

                                        <div className="space-y-2 text-sm">
                                            <div className="flex items-center gap-2 text-gray-600">
                                                <Icon name="building-2" size={14} />
                                                <span>Continuity: {continuitySite?.name}</span>
                                            </div>
                                            <div className="flex items-center gap-2 text-gray-600">
                                                <Icon name="calendar" size={14} />
                                                <span className="capitalize">
                                                    {resident.continuityDay} {resident.continuityTime}
                                                </span>
                                            </div>
                                        </div>
                                    </Card>
                                </motion.div>
                            );
                        })}

                        {residents.length === 0 && (
                            <div className="col-span-full">
                                <Card className="text-center py-12">
                                    <Icon name="user-check" size={48} className="mx-auto text-gray-400 mb-4" />
                                    <h3 className="text-lg font-medium text-gray-900 mb-2">No Residents Yet</h3>
                                    <p className="text-gray-600 mb-4">Get started by adding your first resident</p>
                                    <Button icon="plus" onClick={() => setShowAddModal(true)}>
                                        Add First Resident
                                    </Button>
                                </Card>
                            </div>
                        )}
                    </div>

                    <Modal
                        isOpen={showAddModal}
                        onClose={() => {
                            setShowAddModal(false);
                            setEditingResident(null);
                        }}
                        title={editingResident ? 'Edit Resident' : 'Add New Resident'}
                        size="lg"
                    >
                        <ResidentForm
                            resident={editingResident}
                            onClose={() => {
                                setShowAddModal(false);
                                setEditingResident(null);
                            }}
                        />
                    </Modal>
                </div>
            );
        };

        // ==================== Main App ====================
        const App = () => {
            const [activeView, setActiveView] = useState('dashboard');

            return (
                <AppProvider>
                    <div className="min-h-screen bg-gray-50">
                        <Navigation activeView={activeView} onViewChange={setActiveView} />

                        <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                            {activeView === 'dashboard' && <Dashboard />}
                            {activeView === 'attendings' && <AttendingsView />}
                            {activeView === 'residents' && <ResidentsView />}
                            {activeView === 'schedule' && (
                                <Card className="text-center py-12">
                                    <Icon name="calendar" size={48} className="mx-auto text-gray-400 mb-4" />
                                    <h3 className="text-lg font-medium text-gray-900 mb-2">Schedule View</h3>
                                    <p className="text-gray-600">Interactive schedule calendar coming soon</p>
                                </Card>
                            )}
                            {activeView === 'rules' && (
                                <Card className="text-center py-12">
                                    <Icon name="shield-check" size={48} className="mx-auto text-gray-400 mb-4" />
                                    <h3 className="text-lg font-medium text-gray-900 mb-2">Natural Language Rules</h3>
                                    <p className="text-gray-600">AI-powered rule creation coming soon</p>
                                </Card>
                            )}
                            {activeView === 'settings' && (
                                <Card className="text-center py-12">
                                    <Icon name="settings" size={48} className="mx-auto text-gray-400 mb-4" />
                                    <h3 className="text-lg font-medium text-gray-900 mb-2">Institution Settings</h3>
                                    <p className="text-gray-600">Configuration management coming soon</p>
                                </Card>
                            )}
                        </main>

                        <Toaster
                            position="bottom-right"
                            toastOptions={{
                                className: 'font-medium',
                                style: {
                                    background: '#fff',
                                    color: '#363636',
                                },
                                success: {
                                    iconTheme: {
                                        primary: '#10b981',
                                        secondary: '#fff',
                                    },
                                },
                            }}
                        />
                    </div>
                </AppProvider>
            );
        };

        // Render the app
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
