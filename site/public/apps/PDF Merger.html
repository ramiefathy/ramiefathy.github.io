<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Merge multiple PDF files into a single document locally in your browser and download the combined PDF.">
    <title>PDF Merger Pro</title>
    <link rel="stylesheet" href="./shared/legacy-tokens.css">
    <link rel="stylesheet" href="./shared/legacy-primitives.css">
    <link rel="stylesheet" href="./shared/legacy-shell.css">
    <script src="./shared/legacy-shell.js" defer></script>
    <script src="./shared/legacy-status.js" defer></script>
    <script src="./shared/legacy-guidance.js" defer></script>
    <style>
        /* General body styling */
        body {
            margin: 0;
            padding: var(--legacy-space-6);
            background-color: var(--legacy-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Main container for the application */
        #app-container {
            background-color: var(--legacy-surface);
            padding: calc(var(--legacy-space-6) + var(--legacy-space-1));
            border-radius: calc(var(--radius) + 8px);
            box-shadow: var(--legacy-shadow-surface);
            border: 1px solid var(--legacy-border);
            text-align: center;
            width: 100%;
            max-width: 550px; /* Max width for larger screens */
            box-sizing: border-box;
        }

        /* Heading style */
        h1 {
            margin-bottom: 10px;
            font-size: 1.8rem;
            font-family: var(--font-heading, serif);
            color: var(--legacy-text);
        }

        /* Paragraph/description style */
        p {
            margin-bottom: 25px; /* Increased margin */
            font-size: 16px;
            line-height: 1.6;
            color: var(--legacy-text-muted);
        }

        /* File input styling */
        input[type="file"] {
            margin-bottom: 25px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            padding: 10px;
            border: 1px solid var(--legacy-border);
            border-radius: var(--radius);
            background-color: var(--legacy-surface-muted);
            cursor: pointer;
            width: calc(100% - 22px); /* Adjust width considering padding */
        }

        /* Button styling */
        #app-container button {
            transition: background-color var(--legacy-duration-fast) var(--legacy-ease-in-out), border-color var(--legacy-duration-fast) var(--legacy-ease-in-out);
        }

        /* Status message styling */
        #status {
            margin-top: 25px;
            font-size: 0.95em; /* Slightly larger status font */
            color: #333c4a;
            min-height: 20px; /* Reserve space to prevent layout shifts */
        }

        /* Loader animation */
        .loader {
            border: 4px solid color-mix(in oklab, var(--legacy-border), white 40%);
            border-radius: 50%;
            border-top: 4px solid var(--legacy-primary);
            width: 24px; /* Larger loader */
            height: 24px;
            -webkit-animation: spin 1.5s linear infinite; /* Safari */
            animation: spin 1.5s linear infinite;
            display: none; /* Hidden by default */
            margin: 15px auto 0;
        }

        /* Safari animation keyframes */
        @-webkit-keyframes spin {
            0% { -webkit-transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); }
        }

        /* Standard animation keyframes */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
    <script src="./vendor/pdf-lib.min.js"></script>
    <link rel="stylesheet" href="../../style.css" type="text/css" />
</head>
<body class="legacy-focus-ring" data-legacy-shell="true">
    <div id="app-container">
        <h1>PDF Merger Pro</h1>
        <p>Easily combine multiple PDF files into a single, organized document. Select your files below and click "Merge PDFs".</p>

        <input type="file" id="pdfFilesInput" accept=".pdf" multiple>
        <div id="preflight-summary" class="legacy-empty-state">Choose at least two PDF files to generate a preflight summary.</div>

        <button id="mergeButton" class="legacy-btn legacy-btn--primary legacy-focus-ring" onclick="handleMergePdfs()">Merge PDFs</button>

        <div id="status">Select your PDF files to begin.</div>

        <div class="loader" id="loader"></div>
    </div>

    <script>
        // Destructure PDFDocument from PDFLib for ease of use
        const { PDFDocument } = PDFLib;

        // Get references to DOM elements
        const pdfFilesInput = document.getElementById('pdfFilesInput');
        const mergeButton = document.getElementById('mergeButton');
        const statusDiv = document.getElementById('status');
        const loader = document.getElementById('loader');
        const preflightSummary = document.getElementById('preflight-summary');

        const statusHost = document.createElement('div');
        document.getElementById('app-container').appendChild(statusHost);

        function renderPreflight(files) {
            if (!files || files.length < 2) {
                preflightSummary.textContent = 'Choose at least two PDF files to generate a preflight summary.';
                return;
            }
            let estimatedSize = 0;
            const names = Array.from(files).map((file) => {
                estimatedSize += file.size;
                return file.name;
            });
            const estimatedSizeMb = (estimatedSize / 1024 / 1024).toFixed(2);
            preflightSummary.innerHTML = `<strong>Preflight</strong><br>${files.length} files selected (${estimatedSizeMb} MB total).<br>Output: merged_document.pdf<br>Files: ${names.join(', ')}`;
        }

        /**
         * Asynchronously handles the PDF merging process.
         * This function is called when the "Merge PDFs" button is clicked.
         */
        async function handleMergePdfs() {
            const files = pdfFilesInput.files;

            // Validate that at least two files are selected
            if (files.length < 2) {
                statusDiv.textContent = '⚠️ Please select at least two PDF files to merge.';
                statusDiv.style.color = '#dc3545'; // Error color
                window.LegacyStatus?.showError(statusHost, 'Need at least two PDFs before merge can run.')
                return;
            }

            // Disable button and show loader during processing
            mergeButton.disabled = true;
            loader.style.display = 'block';
            statusDiv.textContent = '🚀 Starting merge process...';
            statusDiv.style.color = '#007bff'; // Processing color
            window.LegacyStatus?.showLoading(statusHost, 'Validating selected PDFs and preparing merge.')

            try {
                // Create a new PDFDocument instance to hold the merged PDF
                const mergedPdf = await PDFDocument.create();

                // Iterate through each selected file
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    statusDiv.textContent = `⏳ Loading file ${i + 1} of ${files.length}: ${file.name}...`;

                    // Read the file content as an ArrayBuffer
                    const arrayBuffer = await file.arrayBuffer();

                    // Load the PDF document from the ArrayBuffer
                    // Added lenient options to handle a wider variety of PDF structures
                    const pdfToMerge = await PDFDocument.load(arrayBuffer, {
                        ignoreEncryption: true,      // Try to load even if encrypted (without password)
                        updateMetadata: false,       // Don't try to update metadata which can sometimes fail
                        parseSpeed: PDFLib.ParseSpeeds.Fast // Prioritize speed
                    });

                    statusDiv.textContent = `📄 Copying pages from ${file.name}...`;

                    // Get all page indices from the current PDF
                    const pageIndices = pdfToMerge.getPageIndices();

                    // Copy the pages from the current PDF to the merged PDF
                    const copiedPages = await mergedPdf.copyPages(pdfToMerge, pageIndices);

                    // Add the copied pages to the merged PDF
                    copiedPages.forEach((page) => {
                        mergedPdf.addPage(page);
                    });

                    console.log(`Appended pages from: ${file.name}`);
                }

                statusDiv.textContent = '💾 Saving merged PDF...';
                // Serialize the merged PDFDocument to bytes (a Uint8Array)
                const mergedPdfBytes = await mergedPdf.save();

                statusDiv.textContent = '✅ Merge complete! Initiating download...';
                statusDiv.style.color = '#28a745'; // Success color
                window.LegacyStatus?.showSuccess(statusHost, `Merged ${files.length} PDFs into merged_document.pdf.`)

                // Trigger the download of the merged PDF
                triggerDownload(mergedPdfBytes, "merged_document.pdf");

            } catch (error) {
                console.error('Error during PDF merging:', error);
                statusDiv.textContent = `❌ Error: ${error.message}. Some PDFs might be corrupted or incompatible. Please check console for details.`;
                statusDiv.style.color = '#dc3545'; // Error color
                window.LegacyStatus?.showRetry(statusHost, 'Merge failed. Verify files and retry.', () => handleMergePdfs())
            } finally {
                // Re-enable the button and hide the loader, regardless of success or failure
                mergeButton.disabled = false;
                loader.style.display = 'none';
                // Optionally reset the file input
                // pdfFilesInput.value = ''; // Uncomment to clear selected files after process
            }
        }

        /**
         * Triggers a browser download for the given byte array as a file.
         * @param {Uint8Array} bytes - The byte array of the file content.
         * @param {string} filename - The desired name for the downloaded file.
         */
        function triggerDownload(bytes, filename) {
            // Create a Blob from the PDF bytes with the correct MIME type
            const blob = new Blob([bytes], { type: 'application/pdf' });

            // Create an object URL for the Blob
            const url = URL.createObjectURL(blob);

            // Create a temporary anchor element to trigger the download
            const link = document.createElement('a');
            link.href = url;
            link.download = filename; // Set the download attribute to suggest a filename

            // Append the link to the body, click it, and then remove it
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // Revoke the object URL to free up resources
            URL.revokeObjectURL(url);
            console.log(`Download triggered for: ${filename}`);
        }

        // Add an event listener to the file input to clear status on new selection
        pdfFilesInput.addEventListener('change', () => {
            if (pdfFilesInput.files.length > 0) {
                statusDiv.textContent = `${pdfFilesInput.files.length} file(s) selected. Click "Merge PDFs" to combine.`;
                statusDiv.style.color = '#555e6e'; // Default text color
                renderPreflight(pdfFilesInput.files);
            } else {
                statusDiv.textContent = 'Select your PDF files to begin.';
                statusDiv.style.color = '#555e6e';
                renderPreflight(pdfFilesInput.files);
            }
        });

        window.LegacyGuidance?.maybeShow('pdf-merger', [
            'Select at least two PDF files from your device.',
            'Review the preflight summary before running merge.',
            'Use Merge PDFs and download the generated output.'
        ]);
    </script>
</body>
</html>
