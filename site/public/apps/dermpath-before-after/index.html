const LABEL_SIZE_PRESETS = { xs: 0.72, s: 0.86, m: 1.0, l: 1.22, xl: 1.45 };
const PRESET_STORE_KEY = 'dermpath-roi-size-preset-v2';
let initialPreset = "m";
try {
  const sp = localStorage.getItem(PRESET_STORE_KEY);
  if (sp && LABEL_SIZE_PRESETS[sp]) initialPreset = sp;
} catch {}

let state = {
  tab: "both",
  search: "",
  showRois: true,
  editRois: false,
  labelSizePreset: initialPreset,
  dragMode: "auto",
  selectedRoiByField: Object.create(null),
  lastRoiDragTime: 0,
  stacked: (typeof window !== "undefined" && window.innerWidth <= 640),
  lbPairs: [],
  lbIdx: 0
};

const ROI_EDITS_KEY = 'dermpath-roi-edits-v1';
let roiEdits = Object.create(null);
try {
  const rawEdits = JSON.parse(localStorage.getItem(ROI_EDITS_KEY) || 'null');
  if (rawEdits && typeof rawEdits === 'object' && !Array.isArray(rawEdits)) {
    roiEdits = { ...rawEdits };
  }
} catch {}

const CLOUD_ENDPOINTS = (typeof location !== 'undefined' && location.hostname === 'ramiefathy.com')
  ? ['/api/dermpath-edits', 'https://dermpath-edits-sync.ramiefathy.workers.dev/edits']
  : ['https://ramiefathy.com/api/dermpath-edits', 'https://dermpath-edits-sync.ramiefathy.workers.dev/edits'];

let cloudSyncState = 'saved';
const dirtyLocalKeys = new Set();
const pendingDeletedKeys = new Set();
let cloudPushTimer = null;

function getCloudSyncText() {
  const n = Object.keys(roiEdits).length;
  if (cloudSyncState === 'saving') return 'Cloud: Saving…';
  if (cloudSyncState === 'offline') return `Saved Locally (${n})`;
  return n > 0 ? `Cloud Saved (${n})` : 'Cloud Saved';
}

function updateCloudSyncBadges() {
  const txt = getCloudSyncText();
  document.querySelectorAll('[data-cloud-sync-pill]').forEach(el => {
    el.textContent = txt;
  });
}

async function callCloudApi(method, bodyObj, keepalive = false) {
  for (const base of CLOUD_ENDPOINTS) {
    try {
      const res = await fetch(`${base}?app=before-after`, {
        method,
        headers: method === 'GET' ? undefined : { 'Content-Type': 'application/json' },
        body: bodyObj ? JSON.stringify(bodyObj) : undefined,
        keepalive
      });
      if (res.ok) return await res.json();
    } catch {}
  }
  return null;
}

async function flushCloudPush(keepalive = false) {
  if (cloudPushTimer) {
    clearTimeout(cloudPushTimer);
    cloudPushTimer = null;
  }
  cloudSyncState = 'saving';
  updateCloudSyncBadges();
  const delList = Array.from(pendingDeletedKeys);
  pendingDeletedKeys.clear();
  const data = await callCloudApi('PUT', {
    app: 'before-after',
    edits: roiEdits,
    deletedKeys: delList,
    preset: state.labelSizePreset
  }, keepalive);
  if (data && data.ok) {
    cloudSyncState = 'saved';
  } else {
    delList.forEach(k => pendingDeletedKeys.add(k));
    cloudSyncState = 'offline';
  }
  updateCloudSyncBadges();
}

async function pullCloudRoiEdits() {
  const data = await callCloudApi('GET');
  if (!data || !data.ok || !data.edits || typeof data.edits !== 'object') {
    updateCloudSyncBadges();
    return;
  }
  const cloudMap = data.edits;
  const localBeforeKeys = Object.keys(roiEdits);
  const merged = { ...roiEdits, ...cloudMap };
  dirtyLocalKeys.forEach(k => {
    if (roiEdits[k]) merged[k] = roiEdits[k];
  });
  pendingDeletedKeys.forEach(k => {
    delete merged[k];
  });
  const changed = JSON.stringify(merged) !== JSON.stringify(roiEdits);
  roiEdits = merged;
  try { localStorage.setItem(ROI_EDITS_KEY, JSON.stringify(roiEdits)); } catch {}
  cloudSyncState = 'saved';
  updateCloudSyncBadges();
  if (changed && typeof renderAll === 'function') {
    renderAll();
    const lb = document.getElementById('lightbox');
    if (lb && lb.classList.contains('open') && typeof updateLightbox === 'function') updateLightbox();
  }
  const hasUnsyncedLocal = localBeforeKeys.some(k => !cloudMap[k]);
  if (hasUnsyncedLocal) {
    flushCloudPush();
  }
}

function saveRoiEditsStore(opts) {
  try { localStorage.setItem(ROI_EDITS_KEY, JSON.stringify(roiEdits)); } catch {}
  if (opts && opts.changedKey) {
    dirtyLocalKeys.add(opts.changedKey);
    pendingDeletedKeys.delete(opts.changedKey);
  }
  if (opts && opts.deletedKey) {
    dirtyLocalKeys.delete(opts.deletedKey);
    pendingDeletedKeys.add(opts.deletedKey);
  }
  cloudSyncState = 'saving';
  updateCloudSyncBadges();
  if (cloudPushTimer) clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(() => flushCloudPush(false), 220);
}

if (typeof window !== 'undefined') {
  window.addEventListener('pagehide', () => {
    if (cloudPushTimer) flushCloudPush(true);
  });
  setTimeout(pullCloudRoiEdits, 40);
}

const FIELD_REGISTRY = Object.create(null);
function fieldKey(f) {
  return (f && (f.id || f.deck_file || f.src)) || 'ba-field';
}

function getEffectiveRois(f) {
  if (!f) return [];
  const base = Array.isArray(f.rois) ? f.rois : [];
  const fk = fieldKey(f);

    svg += `<line class="roi-ptr roi-leader" data-roi-idx="${idx}" data-style="${style}" x1="${pAnc[0]}" y1="${pAnc[1]}" x2="${bAnc[0]}" y2="${bAnc[1]}" style="stroke:${col}" vector-effect="non-scaling-stroke"/>`;
    if (style === 'arrow') {
      const aPath = buildArrowHeadPath(pAnc[0], pAnc[1], bAnc[0], bAnc[1], Math.max(12, Math.round(16 * cssScale)));
      svg += `<path class="roi-arrow-head-halo" d="${aPath}" vector-effect="non-scaling-stroke"/>`;
      svg += `<path class="roi-arrow-head" data-roi-idx="${idx}" data-style="arrow" data-handle="target-move" d="${aPath}" fill="${col}" vector-effect="non-scaling-stroke"/>`;
    }
  });
  layout.forEach(({ idx, style, prect, lines, padX, col, fontTag, pScale, pillAngle }) => {
    const [px, py, px2, py2] = prect;
    const pw = px2 - px, ph = py2 - py;
    const pcx = px + pw / 2, pcy = py + ph / 2;
    const isSel = state.editRois && idx === selIdx;
    const pRotAttr = pillAngle ? ` transform="rotate(${pillAngle} ${pcx} ${pcy})"` : '';
    const pStemY = Math.round(py - 22 * cssScale);
    if (state.editRois) {
      svg += `<g class="roi-pill-hit-grp" data-roi-idx="${idx}"${pRotAttr}>`;
      svg += `<circle class="roi-hit-target" data-roi-idx="${idx}" data-handle="pill-rot" cx="${Math.round(pcx)}" cy="${pStemY}" r="${hitR}"/>`;
      svg += `<circle class="roi-hit-target" data-roi-idx="${idx}" data-handle="pill-scale" cx="${Math.round(px2)}" cy="${Math.round(py2)}" r="${hitR}"/>`;
      svg += `</g>`;
    }
    const txX = px + (padX || Math.round(9 * pxToSvg));
    const nLines = (lines && lines.length) ? lines.length : 1;
    svg += `<g class="roi-pill-grp" data-roi-idx="${idx}" data-style="${style}" data-handle="pill-move" data-px="${px}" data-py="${py}" data-pw="${pw}" data-ph="${ph}" data-pill-scale="${pScale}" data-pill-angle="${pillAngle}"${pRotAttr}>`;
    svg += `<rect class="roi-tag-halo" data-roi-idx="${idx}" data-handle="pill-move" x="${px}" y="${py}" width="${pw}" height="${ph}" vector-effect="non-scaling-stroke"/>`;
    svg += `<rect class="roi-tag-bg roi-pill-bg${isSel ? ' roi-selected' : ''}" data-roi-idx="${idx}" data-handle="pill-move" x="${px}" y="${py}" width="${pw}" height="${ph}" style="stroke:${col}" vector-effect="non-scaling-stroke"/>`;
    if (nLines > 1) {
      const lineStep = Math.round(fontTag * 1.28);
      const tspans = lines.map((ln, lIdx) => {
        const ly = Math.round(pcy + (lIdx - (nLines - 1) / 2) * lineStep);
        const sep = lIdx < nLines - 1 ? ' ' : '';
        return `<tspan x="${txX}" y="${ly}" dominant-baseline="central">${esc(ln)}${sep}</tspan>`;
      }).join('');
      const ly0 = Math.round(pcy - ((nLines - 1) / 2) * lineStep);
      svg += `<text class="roi-tag-txt" data-lines="${nLines}" x="${txX}" y="${ly0}" style="font-size:${fontTag}px">${tspans}</text>`;
    } else {
      const singleLine = (lines && lines[0]) || '';
      svg += `<text class="roi-tag-txt" data-lines="1" x="${txX}" y="${Math.round(pcy)}" style="font-size:${fontTag}px">${esc(singleLine)}</text>`;
    }
    svg += `</g>`;
    if (state.editRois) {
      svg += `<g class="roi-pill-handles-grp" data-roi-idx="${idx}"${pRotAttr}>`;
      svg += `<line class="roi-rot-stem" x1="${pcx}" y1="${py}" x2="${pcx}" y2="${pStemY}" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
      svg += `<circle class="roi-handle roi-handle-pill-rot" data-roi-idx="${idx}" data-handle="pill-rot" cx="${Math.round(pcx)}" cy="${pStemY}" r="${Math.max(5, hR - 1)}" fill="#0B0E14" stroke="${col}" stroke-width="2.2" vector-effect="non-scaling-stroke"/>`;
      svg += `<rect class="roi-handle roi-handle-pill-scale" data-roi-idx="${idx}" data-handle="pill-scale" x="${Math.round(px2 - hR)}" y="${Math.round(py2 - hR)}" width="${hR * 2}" height="${hR * 2}" rx="3" fill="${col}" stroke="#0B0E14" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
      svg += `</g>`;
    }
  });
  svg += `</svg>`;
  return svg;
}
function matchesSearch(hay) {
  const q = state.search.trim().toLowerCase();
  if (!q) return true;
  return hay.toLowerCase().includes(q);
}

function renderRoiEditBar(f) {

  FIELD_REGISTRY[fk] = f;
  const selIdx = Math.max(0, Math.min(rois.length - 1, state.selectedRoiByField[fk] || 0));
  const sel = rois[selIdx] || rois[0];
  const curStyle = sel.style || "box";
  const bAng = Math.round(Number(sel.boxAngle) || 0);
  const pAng = Math.round(Number(sel.pillAngle) || 0);

  let h = `<div class="roi-edit-bar" data-field-id="${esc(fk)}">`;
  h += `<div class="reb-row"><div class="reb-group"><span class="reb-lbl"> ROI:</span>`;

  h += `</div><div class="reb-group"><span class="reb-lbl">Style:</span>` +
       `<button type="button" class="btn${curStyle === "box" ? " active" : ""}" data-roi-action="set-style" data-style="box">▭ Box</button>` +
       `<button type="button" class="btn${curStyle === "arrow" ? " active" : ""}" data-roi-action="set-style" data-style="arrow">↗ Arrow</button>` +
       `<button type="button" class="btn${curStyle === "circle" ? " active" : ""}" data-roi-action="set-style" data-style="circle">◯ Circle</button>` +

       `<button type="button" class="btn${state.dragMode === "auto" ? " active" : ""}" data-drag-mode="auto"> Auto</button>` +
       `<button type="button" class="btn${state.dragMode === "move-label" ? " active" : ""}" data-drag-mode="move-label"> Move Label</button>` +
       `<button type="button" class="btn${state.dragMode === "move-target" ? " active" : ""}" data-drag-mode="move-target"> Move Tip/Box</button>` +
       `<button type="button" class="btn${state.dragMode === "resize" ? " active" : ""}" data-drag-mode="resize">⤡ Resize</button>` +
       `<button type="button" class="btn${state.dragMode === "rotate" ? " active" : ""}" data-drag-mode="rotate">⟳ Rotate</button></div></div>`;
  h += `<div class="reb-row"><div class="reb-group"><span class="reb-lbl">All Labels:</span>` +
       ["xs", "s", "m", "l", "xl"].map(sz => `<button type="button" class="btn${state.labelSizePreset === sz ? " active" : ""}" data-roi-action="preset-size" data-size="${sz}">${sz.toUpperCase()}</button>`).join("") +
       `<button type="button" class="btn" data-roi-action="fit-all">Fit All</button></div>` +
       `<div class="reb-group"><span class="reb-lbl">Label Size:</span>` +
       `<button type="button" class="btn" data-roi-action="label-size-down">−</button>` +

       `<input type="range" data-roi-prop="pillScale" min="0.4" max="2.0" step="0.05" value="${pScl}">` +

       `<div class="reb-group"><span class="reb-lbl">Box/Arrow:</span>` +
       `<button type="button" class="btn" data-roi-action="box-shrink">Shrink</button>` +
       `<button type="button" class="btn" data-roi-action="box-grow">Grow</button></div></div>`;
  h += `<div class="reb-row"><div class="reb-group"><span class="reb-lbl">Rotate:</span>` +
       `<button type="button" class="btn" data-roi-action="rot-step" data-step="-15">↺ -15°</button>` +

       `</div></div></div>`;
  return h;

function syncBaRoiSvgs() {
  if (typeof document === "undefined") return;
  document.querySelectorAll("svg.roisvg").forEach(svgEl => {
    const fk = svgEl.dataset.fieldId;
    const f = FIELD_REGISTRY[fk];
    if (!f) return;
    const wrap = svgEl.parentElement;
    const stage = wrap ? wrap.parentElement : null;
    const W = f.w || (f.dims && f.dims[0]) || (f.dimensions && f.dimensions[0]) || 1000;
    const H = f.h || (f.dims && f.dims[1]) || (f.dimensions && f.dimensions[1]) || 750;
    let dispW = 0, dispH = 0;
    const svgRect = svgEl.getBoundingClientRect();
    const imgEl = wrap ? wrap.querySelector("img") : null;
    if (svgRect.width > 40 && svgRect.height > 40) {
      dispW = svgRect.width;
      dispH = svgRect.height;
    } else if (imgEl && imgEl.complete && imgEl.getBoundingClientRect().width > 40) {
      const ir = imgEl.getBoundingClientRect();
      dispW = ir.width;
      dispH = ir.height;
    } else if (stage && stage.getBoundingClientRect().width > 40) {
      const sr = stage.getBoundingClientRect();
      const sc = Math.min((sr.width - 4) / W, (sr.height - 4) / H);
      dispW = Math.round(W * sc);
      dispH = Math.round(H * sc);
    }
    if (dispW > 40 && dispH > 40) {
      const prevW = Number(svgEl.dataset.dispW || 0);
      const prevH = Number(svgEl.dataset.dispH || 0);
      svgEl.dataset.dispW = String(Math.round(dispW));
      svgEl.dataset.dispH = String(Math.round(dispH));
      if (Math.abs(dispW - prevW) > 1.5 || Math.abs(dispH - prevH) > 1.5) {
        svgEl.outerHTML = buildRoiSvg({ ...f, _dispW: dispW, _dispH: dispH });
      }
    }
  });
}

function refreshBaField(f) {
  if (!f) return;
  const fk = fieldKey(f);
  const effRois = getEffectiveRois(f);
  document.querySelectorAll(`svg.roisvg[data-field-id="${CSS.escape(fk)}"]`).forEach(svgEl => {
    const wrap = svgEl.parentElement;
    const pr = wrap ? wrap.getBoundingClientRect() : svgEl.getBoundingClientRect();
    const fMeasured = (pr.width > 40 && pr.height > 40) ? { ...f, _dispW: pr.width, _dispH: pr.height } : f;
    svgEl.outerHTML = buildRoiSvg(fMeasured);
  });
  document.querySelectorAll(`.roi-callout-summary[data-field-id="${CSS.escape(fk)}"]`).forEach(el => {
    el.innerHTML = `<b>Deck ROI Callouts:</b> ${effRois.map(x => `#${x.n} ${esc(x.label)}`).join(" · ")}`;
  });
  const selIdx = Math.max(0, Math.min(effRois.length - 1, state.selectedRoiByField[fk] || 0));
  const sel = effRois[selIdx];
  if (sel) {
    document.querySelectorAll(`.roi-edit-bar[data-field-id="${CSS.escape(fk)}"]`).forEach(bar => {
      const bAng = Math.round(Number(sel.boxAngle) || 0);
      const pAng = Math.round(Number(sel.pillAngle) || 0);
      const pScl = Number(Number(sel.pillScale || 1).toFixed(2));
      const bVal = bar.querySelector('[data-roi-val="boxAngle"]');
      const pVal = bar.querySelector('[data-roi-val="pillAngle"]');
      const sVal = bar.querySelector('[data-roi-val="pillScale"]');
      if (bVal) bVal.textContent = bAng + "°";
      if (pVal) pVal.textContent = pAng + "°";
      if (sVal) sVal.textContent = Math.round(pScl * 100) + "%";
      const bRng = bar.querySelector('[data-roi-prop="boxAngle"]');
      const pRng = bar.querySelector('[data-roi-prop="pillAngle"]');
      const sRng = bar.querySelector('[data-roi-prop="pillScale"]');
      if (bRng && document.activeElement !== bRng) bRng.value = String(bAng);
      if (pRng && document.activeElement !== pRng) pRng.value = String(pAng);
      if (sRng && document.activeElement !== sRng) sRng.value = String(pScl);
      const txtIn = bar.querySelector('[data-roi-input="label"]');
      if (txtIn && document.activeElement !== txtIn) txtIn.value = sel.label || "";
    });
  }
}

function clientToSvgPt(svgEl, cx, cy) {
  const rect = svgEl.getBoundingClientRect();
  const W = Number(svgEl.dataset.w) || 1200;
  const H = Number(svgEl.dataset.h) || 900;
  if (!rect.width || !rect.height) return [0, 0, W, H];
  return [((cx - rect.left) / rect.width) * W, ((cy - rect.top) / rect.height) * H, W, H];
}

let baRoiDrag = null;
document.addEventListener("pointerdown", e => {
  const svgEl = e.target.closest("svg.roisvg");
  if (!svgEl) return;
  if (e.isPrimary === false) return;
  const hEl = e.target.closest("[data-handle]");
  const fk = svgEl.dataset.fieldId;
  const f = FIELD_REGISTRY[fk];
  if (!f) return;
  const rois = getEffectiveRois(f);
  if (!rois.length) return;
  let rIdx = state.selectedRoiByField[fk] || 0;
  let handle = null;
  if (state.editRois && state.dragMode !== "auto") {
    if (hEl && hEl.dataset.roiIdx !== undefined) rIdx = Number(hEl.dataset.roiIdx);
    rIdx = Math.max(0, Math.min(rois.length - 1, rIdx));
    if (hEl && !["pill-move", "box-move", "target-move"].includes(hEl.dataset.handle)) {
      handle = hEl.dataset.handle;
    } else {
      handle = "mode-" + state.dragMode;
    }
  } else {
    if (!hEl) return;
    rIdx = Number(hEl.dataset.roiIdx || 0);
    handle = hEl.dataset.handle;
  }
  if (!rois[rIdx] || !handle) return;
  e.stopPropagation();
  e.preventDefault();
  state.selectedRoiByField[fk] = rIdx;
  const pillGrp = svgEl.querySelector(`g.roi-pill-grp[data-roi-idx="${rIdx}"]`);
  const curPx = pillGrp ? Number(pillGrp.dataset.px) : (rois[rIdx].pill ? rois[rIdx].pill[0] : 40);
  const curPy = pillGrp ? Number(pillGrp.dataset.py) : (rois[rIdx].pill ? rois[rIdx].pill[1] : 40);
  const curPw = pillGrp ? Number(pillGrp.dataset.pw) : 140;
  const curPh = pillGrp ? Number(pillGrp.dataset.ph) : 28;
  const [sx, sy, W, H] = clientToSvgPt(svgEl, e.clientX, e.clientY);
  baRoiDrag = {
    fk,
    f,
    rIdx,
    handle,
    startClient: [e.clientX, e.clientY],
    startSvg: [sx, sy],
    W,
    H,
    moved: false,
    origRoi: JSON.parse(JSON.stringify(rois[rIdx])),
    origPill: [curPx, curPy, curPw, curPh]
  };
}, { capture: true, passive: false });

window.addEventListener("pointermove", e => {
  if (!baRoiDrag) return;
  const svgEls = document.querySelectorAll(`svg.roisvg[data-field-id="${CSS.escape(baRoiDrag.fk)}"]`);
  const svgEl = svgEls[svgEls.length - 1];
  if (!svgEl) return;
  if (Math.hypot(e.clientX - baRoiDrag.startClient[0], e.clientY - baRoiDrag.startClient[1]) >= 2) {
    baRoiDrag.moved = true;
    state.lastRoiDragTime = Date.now();
  }
  const [mx, my, W, H] = clientToSvgPt(svgEl, e.clientX, e.clientY);
  const dx = mx - baRoiDrag.startSvg[0], dy = my - baRoiDrag.startSvg[1];
  const rois = getEffectiveRois(baRoiDrag.f);
  const r = rois[baRoiDrag.rIdx];
  if (!r) return;
  const [ox1, oy1, ox2, oy2] = baRoiDrag.origRoi.box;
  const [opx, opy, opw, oph] = baRoiDrag.origPill;
  const h = baRoiDrag.handle;
  if (h === "pill-move" || h === "mode-move-label") {
    r.pill = [Math.round(Math.max(0, Math.min(W - opw, opx + dx))), Math.round(Math.max(0, Math.min(H - oph, opy + dy)))];
  } else if (h === "box-move") {
    const bw = ox2 - ox1, bh = oy2 - oy1;
    const nx1 = Math.round(Math.max(0, Math.min(W - bw, ox1 + dx)));
    const ny1 = Math.round(Math.max(0, Math.min(H - bh, oy1 + dy)));
    r.box = [nx1, ny1, nx1 + bw, ny1 + bh];
    if (Array.isArray(baRoiDrag.origRoi.target)) {
      r.target = [Math.round(baRoiDrag.origRoi.target[0] + (nx1 - ox1)), Math.round(baRoiDrag.origRoi.target[1] + (ny1 - oy1))];
    }
  } else if (h === "mode-move-target") {
    const bw = ox2 - ox1, bh = oy2 - oy1;
    const nx1 = Math.round(Math.max(0, Math.min(W - bw, ox1 + dx)));
    const ny1 = Math.round(Math.max(0, Math.min(H - bh, oy1 + dy)));
    r.box = [nx1, ny1, nx1 + bw, ny1 + bh];
    const otx = Array.isArray(baRoiDrag.origRoi.target) ? baRoiDrag.origRoi.target[0] : (ox1 + ox2) / 2;
    const oty = Array.isArray(baRoiDrag.origRoi.target) ? baRoiDrag.origRoi.target[1] : (oy1 + oy2) / 2;
    r.target = [Math.round(Math.max(0, Math.min(W, otx + dx))), Math.round(Math.max(0, Math.min(H, oty + dy)))];
    r.customTarget = true;
  } else if (h === "target-move") {
    r.target = [Math.round(Math.max(0, Math.min(W, mx))), Math.round(Math.max(0, Math.min(H, my)))];
    r.customTarget = true;
  } else if (h === "mode-resize") {
    const factor = Math.max(0.35, Math.min(2.6, 1 + (dx - dy * 0.5) / Math.max(120, W * 0.35)));
    const bcx = (ox1 + ox2) / 2, bcy = (oy1 + oy2) / 2;
    const hw = Math.max(10, ((ox2 - ox1) / 2) * factor);
    const hh = Math.max(10, ((oy2 - oy1) / 2) * factor);
    r.box = [Math.round(Math.max(0, bcx - hw)), Math.round(Math.max(0, bcy - hh)), Math.round(Math.min(W, bcx + hw)), Math.round(Math.min(H, bcy + hh))];
    r.pillScale = Math.max(0.4, Math.min(2.0, Number(((Number(baRoiDrag.origRoi.pillScale) || 1) * factor).toFixed(2))));
  } else if (h === "mode-rotate") {
    const deltaAng = Math.round((dx / Math.max(120, W * 0.35)) * 90);
    r.boxAngle = (((Number(baRoiDrag.origRoi.boxAngle) || 0) + deltaAng + 540) % 360) - 180;
    r.pillAngle = (((Number(baRoiDrag.origRoi.pillAngle) || 0) + deltaAng + 540) % 360) - 180;
    r.pill = [opx, opy];
  } else if (h === "box-rot") {
    const bcx = (ox1 + ox2) / 2, bcy = (oy1 + oy2) / 2;
    r.boxAngle = Math.round(Math.atan2(mx - bcx, -(my - bcy)) * 180 / Math.PI);
  } else if (h === "pill-rot") {
    const pcx = opx + opw / 2, pcy = opy + oph / 2;
    r.pill = [opx, opy];
    r.pillAngle = Math.round(Math.atan2(mx - pcx, -(my - pcy)) * 180 / Math.PI);
  } else if (h === "pill-scale") {
    r.pill = [opx, opy];
    const baseS = Number(baRoiDrag.origRoi.pillScale) || 1;
    const ratio = 1 + (dx / Math.max(50, opw)) + (dy / Math.max(30, oph)) * 0.4;
    r.pillScale = Math.max(0.4, Math.min(2.0, Number((baseS * ratio).toFixed(2))));
  } else {
    const rad = -((Number(baRoiDrag.origRoi.boxAngle) || 0) * Math.PI) / 180;
    const ldx = dx * Math.cos(rad) - dy * Math.sin(rad);
    const ldy = dx * Math.sin(rad) + dy * Math.cos(rad);
    let x1 = ox1, y1 = oy1, x2 = ox2, y2 = oy2;
    if (h.includes("w")) x1 = Math.min(ox2 - 14, Math.max(0, Math.round(ox1 + ldx)));
    if (h.includes("e")) x2 = Math.max(ox1 + 14, Math.min(W, Math.round(ox2 + ldx)));
    if (h.includes("n")) y1 = Math.min(oy2 - 14, Math.max(0, Math.round(oy1 + ldy)));
    if (h.includes("s")) y2 = Math.max(oy1 + 14, Math.min(H, Math.round(oy2 + ldy)));
    r.box = [x1, y1, x2, y2];
  }
  commitFieldRois(baRoiDrag.f, rois);
  refreshBaField(baRoiDrag.f);
});

window.addEventListener("pointerup", () => {
  if (!baRoiDrag) return;
  const wasMoved = baRoiDrag.moved;
  baRoiDrag = null;
  if (wasMoved) {
    state.lastRoiDragTime = Date.now();
  } else {
    if (!state.editRois) state.editRois = true;
    renderAll();
    if (document.getElementById("lightbox").classList.contains("open")) updateLightbox();
  }
});

function handleBaEditBar(e) {
  const bar = e.target.closest(".roi-edit-bar");
  if (!bar) return;
  const fk = bar.dataset.fieldId;
  const f = FIELD_REGISTRY[fk];
  if (!f) return;
  const rois = getEffectiveRois(f);
  const selIdx = Math.max(0, Math.min(rois.length - 1, state.selectedRoiByField[fk] || 0));
  const sel = rois[selIdx];
  if (e.type === "click") {
    const selBtn = e.target.closest("[data-roi-select]");
    if (selBtn) {
      e.stopPropagation();
      state.selectedRoiByField[fk] = Number(selBtn.dataset.roiSelect);
      renderAll();
      if (document.getElementById("lightbox").classList.contains("open")) updateLightbox();
      return;
    }
    const modeBtn = e.target.closest("[data-drag-mode]");
    if (modeBtn) {
      e.stopPropagation();
      state.dragMode = modeBtn.dataset.dragMode || "auto";
      renderAll();
      if (document.getElementById("lightbox").classList.contains("open")) updateLightbox();
      return;
    }
    const actBtn = e.target.closest("[data-roi-action]");
    if (actBtn) {
      e.stopPropagation();
      const act = actBtn.dataset.roiAction;
      const W = f.w || 1200, H = f.h || 900;
      if (act === "add") {
        rois.push({ n: rois.length + 1, style: sel ? (sel.style || "box") : "box", box: [Math.round(W * 0.4), Math.round(H * 0.4), Math.round(W * 0.56), Math.round(H * 0.56)], label: `Finding ${rois.length + 1}` });
        state.selectedRoiByField[fk] = rois.length - 1;
        commitFieldRois(f, rois);
      } else if (act === "delete" && rois.length > 1) {
        rois.splice(selIdx, 1);
        rois.forEach((r, idx) => { r.n = idx + 1; });
        state.selectedRoiByField[fk] = Math.max(0, selIdx - 1);
        commitFieldRois(f, rois);
      } else if (act === "set-style" && sel) {
        const st = actBtn.dataset.style || "box";
        sel.style = st;
        if (st === "arrow" && !Array.isArray(sel.target)) {
          sel.target = [Math.round((sel.box[0] + sel.box[2]) / 2), Math.round((sel.box[1] + sel.box[3]) / 2)];
          sel.customTarget = true;
        }
        commitFieldRois(f, rois);
      } else if (act === "all-style-arrow") {
        rois.forEach(r => {
          r.style = "arrow";
          if (!Array.isArray(r.target)) {
            r.target = [Math.round((r.box[0] + r.box[2]) / 2), Math.round((r.box[1] + r.box[3]) / 2)];
            r.customTarget = true;
          }
        });
        commitFieldRois(f, rois);
      } else if (act === "all-style-box") {
        rois.forEach(r => { r.style = "box"; });
        commitFieldRois(f, rois);
      } else if (act === "preset-size") {
        state.labelSizePreset = actBtn.dataset.size || "m";
        try { localStorage.setItem(PRESET_STORE_KEY, state.labelSizePreset); } catch {}
        rois.forEach(r => { r.pillScale = 1; });
        commitFieldRois(f, rois);
      } else if (act === "fit-all") {
        state.labelSizePreset = "m";
        try { localStorage.setItem(PRESET_STORE_KEY, state.labelSizePreset); } catch {}
        rois.forEach(r => { delete r.pill; r.pillScale = 1; r.pillAngle = 0; });
        commitFieldRois(f, rois);
      } else if ((act === "label-size-down" || act === "label-size-up") && sel) {
        const curS = Number(sel.pillScale) || 1;
        sel.pillScale = Math.max(0.4, Math.min(2.0, Number((curS + (act === "label-size-up" ? 0.15 : -0.15)).toFixed(2))));
        commitFieldRois(f, rois);
      } else if ((act === "box-shrink" || act === "box-grow") && sel) {
        const mult = act === "box-grow" ? 1.15 : 0.85;
        const [x1, y1, x2, y2] = sel.box;
        const bcx = (x1 + x2) / 2, bcy = (y1 + y2) / 2;
        const hw = Math.max(8, ((x2 - x1) / 2) * mult), hh = Math.max(8, ((y2 - y1) / 2) * mult);
        sel.box = [Math.round(Math.max(0, bcx - hw)), Math.round(Math.max(0, bcy - hh)), Math.round(Math.min(W, bcx + hw)), Math.round(Math.min(H, bcy + hh))];
        commitFieldRois(f, rois);
      } else if (act === "rot-step" && sel) {
        const stp = Number(actBtn.dataset.step) || 15;
        sel.boxAngle = (((Number(sel.boxAngle) || 0) + stp + 540) % 360) - 180;
        sel.pillAngle = (((Number(sel.pillAngle) || 0) + stp + 540) % 360) - 180;
        commitFieldRois(f, rois);
      } else if (act === "rot-zero" && sel) {
        sel.boxAngle = 0; sel.pillAngle = 0;
        commitFieldRois(f, rois);
      } else if (act === "rot-90" && sel) {
        sel.boxAngle = 90; sel.pillAngle = 90;
        commitFieldRois(f, rois);
      } else if (act === "reset-image") {
        delete roiEdits[fk];
        saveRoiEditsStore({ deletedKey: fk });
        state.selectedRoiByField[fk] = 0;
      } else if (act === "export-json") {
        const blob = new Blob([JSON.stringify(roiEdits, null, 2)], { type: "application/json" });
        const u = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = u;
        a.download = "dermpath-roi-edits.json";
        a.click();
        setTimeout(() => URL.revokeObjectURL(u), 1000);
        return;
      }
      renderAll();
      if (document.getElementById("lightbox").classList.contains("open")) updateLightbox();
      return;
    }
  } else if (e.type === "input" && sel) {
    if (e.target.dataset.roiInput === "label") {
      sel.label = e.target.value;
      commitFieldRois(f, rois);
      refreshBaField(f);
    } else if (e.target.dataset.roiProp) {
      sel[e.target.dataset.roiProp] = Number(e.target.value);
      commitFieldRois(f, rois);
      refreshBaField(f);
    }
  }
}
document.addEventListener("click", handleBaEditBar);
document.addEventListener("input", handleBaEditBar);

function toggleEditRoisMode() {
  state.editRois = !state.editRois;
  if (state.editRois) state.showRois = true;
  renderAll();
  if (document.getElementById("lightbox").classList.contains("open")) updateLightbox();
}

document.addEventListener("click", e => {
  if (Date.now() - state.lastRoiDragTime < 450) return;
  if (e.target.closest(".roi-edit-bar") || e.target.closest("[data-handle]")) return;
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn) { state.tab = tabBtn.dataset.tab; renderAll(); return; }
  const lbEl = e.target.closest("[data-lbpair]");
  if (lbEl) { openLightbox(parseInt(lbEl.dataset.lbpair, 10)); return; }
});
document.getElementById("search-in").addEventListener("input", e => { state.search = e.target.value; renderAll(); });
document.getElementById("btn-rois").addEventListener("click", () => { state.showRois = !state.showRois; renderAll(); if (document.getElementById("lightbox").classList.contains("open")) updateLightbox(); });
document.getElementById("mob-roi-btn").addEventListener("click", () => { state.showRois = !state.showRois; renderAll(); if (document.getElementById("lightbox").classList.contains("open")) updateLightbox(); });
document.getElementById("lb-roi-toggle").addEventListener("click", () => { state.showRois = !state.showRois; renderAll(); updateLightbox(); });
document.getElementById("btn-edit-rois").addEventListener("click", toggleEditRoisMode);
document.getElementById("mob-edit-roi-btn").addEventListener("click", toggleEditRoisMode);
document.getElementById("lb-edit-rois").addEventListener("click", toggleEditRoisMode);
document.getElementById("btn-layout").addEventListener("click", () => { state.stacked = !state.stacked; renderTopBar(); });
document.getElementById("mob-layout-btn").addEventListener("click", () => { state.stacked = !state.stacked; renderTopBar(); });
document.getElementById("mob-toggle-filters").addEventListener("click", () => {
  const tp = document.getElementById("top-panel");
  const isCol = tp.classList.toggle("mob-collapsed");
  document.getElementById("mob-toggle-filters").textContent = isCol ? "Tabs ▾" : "Hide ▴";
});
document.getElementById("lb-close").addEventListener("click", closeLightbox);
document.getElementById("lb-close-fab").addEventListener("click", closeLightbox);
document.getElementById("lb-prev").addEventListener("click", () => { state.lbIdx = (state.lbIdx - 1 + state.lbPairs.length) % state.lbPairs.length; updateLightbox(); });
document.getElementById("lb-next").addEventListener("click", () => { state.lbIdx = (state.lbIdx + 1) % state.lbPairs.length; updateLightbox(); });
document.addEventListener("keydown", e => {
  if (!document.getElementById("lightbox").classList.contains("open")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft") document.getElementById("lb-prev").click();
  if (e.key === "ArrowRight") document.getElementById("lb-next").click();
});
renderAll();


</script>
