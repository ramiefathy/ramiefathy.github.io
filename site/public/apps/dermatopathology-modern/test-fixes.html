<!DOCTYPE html>
<html>
<head>
    <title>Test Fixes - WebGL and Dark Mode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Internal test page for validating WebGL and dark-mode rendering behavior in the dermatopathology prototype.">
    <link rel="stylesheet" href="../shared/legacy-tokens.css">
    <link rel="stylesheet" href="../shared/legacy-primitives.css">
    <link rel="stylesheet" href="../shared/legacy-shell.css">
    <link rel="stylesheet" href="./clinical-reference.css">
    <script src="../shared/legacy-shell.js" defer></script>
    <script src="../shared/legacy-guidance.js" defer></script>
    <style>
        body {
            margin: 0;
            padding: var(--legacy-space-5);
            font-family: var(--font-body, var(--legacy-font-sans, ui-sans-serif));
            background: var(--legacy-bg);
            color: var(--legacy-text);
        }
        .test-section {
            margin: var(--legacy-space-4) 0;
            padding: var(--legacy-space-4);
            border: 1px solid var(--legacy-border);
            border-radius: var(--radius);
            background: var(--legacy-surface);
            box-shadow: var(--legacy-shadow-sm);
        }
        .status {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: calc(var(--radius) - 2px);
            font-size: 0.82rem;
            font-weight: 600;
        }
        .success { background: #22c55e; color: white; }
        .error { background: #ef4444; color: white; }
        .info { background: #0e7490; color: white; }
        #canvas-test {
            width: 400px;
            height: 200px;
            border: 2px solid var(--legacy-border);
            border-radius: calc(var(--radius) + 2px);
            display: block;
            margin: 0.75rem 0;
        }
        button {
            padding: 0.55rem 1rem;
            background: var(--legacy-primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: background-color 140ms ease-in-out;
        }
        button:hover {
            background: var(--legacy-primary-strong);
        }
        strong {
            color: var(--legacy-text);
        }
        .expected-hint {
            margin: 0.35rem 0 0.75rem;
            font-size: 0.95rem;
            color: var(--cl-text-muted, #475569);
        }
    </style>
</head>
<body class="clinical-reference clinical-reference--harness legacy-focus-ring" data-legacy-shell="true" data-help-steps='["Use the sections below to validate rendering behavior.","Toggle Theme and confirm colors update.","This page is for internal testing only."]'>
    <h1>Fix Verification Tests</h1>

    <div class="test-section">
        <h2>1. WebGL Shader Test</h2>
        <p class="expected-hint">Expected: black WebGL canvas with color cycling on button press.</p>
        <canvas id="canvas-test"></canvas>
        <div id="webgl-status"></div>
        <button onclick="testMouseMovement()">Test Color Animation</button>
    </div>

    <div class="test-section">
        <h2>2. Dark Mode Test</h2>
        <div id="theme-status"></div>
        <button onclick="testToggleTheme()">Toggle Theme</button>
        <div style="margin-top: 10px;">
            <strong>Current Theme:</strong> <span id="current-theme"></span><br>
            <strong>LocalStorage Theme:</strong> <span id="storage-theme"></span>
        </div>
    </div>

    <div class="test-section">
        <h2>3. Icon Test</h2>
        <div style="display: flex; gap: 10px; margin: 10px 0;">
            <div class="icon-test" data-lucide="grid"></div>
            <div class="icon-test" data-lucide="credit-card"></div>
            <div class="icon-test" data-lucide="share-2"></div>
            <div class="icon-test" data-lucide="brain"></div>
        </div>
        <div id="icon-status"></div>
    </div>

    <script src="../vendor/lucide.min.js"></script>
    <script>
        if (window.LegacyGuidance?.maybeShow) {
            window.LegacyGuidance.maybeShow('dermatopathology-modern-test-fixes', [
                'Run each test section in order and confirm status chips stay green.',
                'Use keyboard navigation to validate focus behavior on all controls.',
                'Use shell Reset to clear local state between manual verification runs.'
            ]);
        }

        // Test 1: WebGL Shader
        function testWebGL() {
            const canvas = document.getElementById('canvas-test');
            const gl = canvas.getContext('webgl2');
            const status = document.getElementById('webgl-status');

            if (!gl) {
                status.innerHTML = '<span class="status error">WebGL2 not supported</span>';
                return;
            }

            // Test clearColor (should be visible now)
            gl.clearColor(0.05, 0.03, 0.08, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);

            // Simple shader test
            const testColors = [
                { name: 'Slow', color: [30/255, 20/255, 60/255, 1.0] },
                { name: 'Medium', color: [60/255, 40/255, 100/255, 1.0] },
                { name: 'Fast', color: [100/255, 70/255, 150/255, 1.0] }
            ];

            let html = '<span class="status success">WebGL2 Supported</span><br>';
            html += 'Clear Color Set: rgba(0.05, 0.03, 0.08, 1.0)<br>';
            html += 'Color Brightness Test:<br>';

            testColors.forEach(test => {
                const brightness = (test.color[0] + test.color[1] + test.color[2]) / 3;
                html += `${test.name}: rgb(${Math.round(test.color[0]*255)}, ${Math.round(test.color[1]*255)}, ${Math.round(test.color[2]*255)}) - Brightness: ${(brightness*100).toFixed(1)}%<br>`;
            });

            status.innerHTML = html;
        }

        // Test 2: Dark Mode
        function updateThemeStatus() {
            document.getElementById('current-theme').textContent =
                document.documentElement.classList.contains('dark') ? 'dark' : 'light';
            document.getElementById('storage-theme').textContent =
                localStorage.getItem('theme') || 'not set';
        }

        function testToggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');

            if (isDark) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }

            updateThemeStatus();

            const status = document.getElementById('theme-status');
            status.innerHTML = '<span class="status success">Theme toggled successfully</span>';
        }

        // Test 3: Icons
        function testIcons() {
            lucide.createIcons();

            const icons = document.querySelectorAll('svg.lucide, .icon-test svg, .icon-test [data-lucide]');
            const status = document.getElementById('icon-status');

            if (icons.length >= 4) {
                status.innerHTML = '<span class="status success">All 4 icons rendered correctly</span>';
            } else {
                status.innerHTML = `<span class="status error">Only ${icons.length} of 4 icons rendered</span>`;
            }
        }

        // Mouse movement simulation
        function testMouseMovement() {
            const canvas = document.getElementById('canvas-test');
            const gl = canvas.getContext('webgl2');

            let t = 0;
            const animate = () => {
                t += 0.02;
                const speed = (Math.sin(t) + 1) / 2; // 0 to 1

                // Interpolate colors based on speed
                const r = 0.05 + speed * 0.35;
                const g = 0.03 + speed * 0.25;
                const b = 0.08 + speed * 0.45;

                gl.clearColor(r, g, b, 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT);

                if (t < Math.PI * 2) {
                    requestAnimationFrame(animate);
                }
            };
            animate();
        }

        // Run tests on load
        window.addEventListener('load', () => {
            testWebGL();
            updateThemeStatus();
            testIcons();
        });
    </script>
</body>
</html>
