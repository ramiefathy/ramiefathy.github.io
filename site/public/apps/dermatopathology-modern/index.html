            width: 8px;

            50% {

        /* Study Streak Fire */

    <!-- Shader Background Canvas -->
    <canvas id="shader-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></canvas>

    <!-- WebGL Shader Background -->
    <script>
        // Apply saved theme immediately to prevent flash
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.body.classList.add('bg-black', 'text-gray-100');
        } else {
            document.documentElement.classList.remove('dark');
            document.body.classList.add('bg-white', 'text-gray-900');
        }

        // WebGL Shader Background Implementation
        (function() {
            const canvas = document.getElementById('shader-canvas');
            const gl = canvas.getContext('webgl2', {
                alpha: true,
                preserveDrawingBuffer: false,
                antialias: false
            });

            if (!gl) {
                console.warn('WebGL2 not supported, falling back to gradient');
                canvas.style.display = 'none';
                return;
            }

            // Shader configuration with dynamic color sets
            const config = {
                // Color sets for different mouse speeds (normalized to 0-255 for RGB)
                colorSets: {
                    // Slow movement - deeper, subtle colors (brightened by 50%)
                    slow: [
                        [30, 20, 60, 1.0],    // Deep accent
                        [20, 40, 50, 1.0],    // Dark blue-green
                        [40, 30, 70, 1.0],    // Muted accent
                        [25, 45, 40, 1.0]     // Dark forest green
                    ],
                    // Medium movement - balanced colors (brightened by 30%)
                    medium: [
                        [60, 40, 100, 1.0],   // Medium accent
                        [40, 75, 60, 1.0],    // Teal-green
                        [75, 55, 110, 1.0],   // Vibrant accent
                        [45, 85, 50, 1.0]     // Emerald green
                    ],
                    // Fast movement - bright, vibrant colors
                    fast: [
                        [100, 70, 150, 1.0],  // Bright accent
                        [60, 130, 80, 1.0],   // Vivid green
                        [120, 90, 170, 1.0],  // Electric accent
                        [70, 150, 90, 1.0]    // Bright emerald
                    ]
                },
                // Current active colors (will be interpolated)
                colors: [
                    [30, 20, 60, 1.0],
                    [20, 40, 50, 1.0],
                    [40, 30, 70, 1.0],
                    [25, 45, 40, 1.0]
                ],
                distortion: 1.5,      // Increased from 1.35
                swirl: 0.65,         // Increased from 0.55
                speed: 0.6,
                rippleStrength: 0.3,  // Increased from 0.22
                rippleFrequency: 32,
                rippleCenter: [0.5, 0.5],
                colorTransitionSpeed: 0.08  // How fast colors transition
            };

            // Vertex shader
            const vertexShaderSource = `#version 300 es
                in vec4 a_position;
                out vec2 v_uv;

                void main() {
                    gl_Position = a_position;
                    v_uv = a_position.xy * 0.5 + 0.5;
                }
            `;

            // Fragment shader
            const fragmentShaderSource = `#version 300 es
                precision mediump float;

                uniform float u_time;
                uniform vec2 u_resolution;
                uniform vec2 u_rippleCenter;
                uniform float u_rippleStrength;
                uniform float u_rippleFrequency;
                uniform vec4 u_colors[4];
                uniform float u_distortion;
                uniform float u_swirl;

                in vec2 v_uv;
                out vec4 fragColor;

                const float PI = 3.14159265358979323846;

                mat2 rotate(float a) {
                    float s = sin(a);
                    float c = cos(a);
                    return mat2(c, s, -s, c);
                }

                vec2 getPosition(int i, float t) {
                    float a = float(i) * 0.37;
                    float b = 0.6 + mod(float(i), 3.0) * 0.3;
                    float c = 0.8 + mod(float(i + 1), 4.0) * 0.25;

                    float x = sin(t * b + a);
                    float y = cos(t * c + a * 1.5);

                    return 0.5 + 0.5 * vec2(x, y);
                }

                void main() {
                    vec2 uv = v_uv;

                    // Ripple effect
                    vec2 rippleVector = uv - u_rippleCenter;
                    float rippleDistance = length(rippleVector);
                    vec2 rippleDirection = rippleDistance > 0.0001 ? rippleVector / rippleDistance : vec2(0.0);
                    float rippleEnvelope = exp(-7.5 * rippleDistance);
                    float rippleWave = u_rippleStrength * rippleEnvelope * sin(u_rippleFrequency * rippleDistance - u_time * 1.6);
                    uv += rippleDirection * rippleWave;

                    // Distortion
                    float t = u_time * 0.5;
                    float radius = smoothstep(0.0, 1.0, length(uv - 0.5));
                    float center = 1.0 - radius;

                    for (float i = 1.0; i <= 2.0; i++) {
                        uv.x += u_distortion * center / i * sin(t + i * 0.4 * smoothstep(0.0, 1.0, uv.y)) * cos(0.2 * t + i * 2.4 * smoothstep(0.0, 1.0, uv.y));
                        uv.y += u_distortion * center / i * cos(t + i * 2.0 * smoothstep(0.0, 1.0, uv.x));
                    }

                    // Swirl
                    vec2 uvRotated = uv - vec2(0.5);
                    float angle = 3.0 * u_swirl * radius;
                    uvRotated = rotate(-angle) * uvRotated;
                    uvRotated += vec2(0.5);

                    // Color mixing
                    vec3 color = vec3(0.0);
                    float totalWeight = 0.0;

                    for (int i = 0; i < 4; i++) {
                        vec2 pos = getPosition(i, t);
                        vec3 colorRGB = u_colors[i].rgb;

                        float dist = length(uvRotated - pos);
                        dist = pow(dist, 3.5);
                        float weight = 1.0 / (dist + 0.001);

                        color += colorRGB * weight;
                        totalWeight += weight;
                    }

                    color /= totalWeight;

                    // Output with reduced opacity for subtlety
                    fragColor = vec4(color, 0.6);
                }
            `;

            // Compile shader
            function createShader(gl, type, source) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);

                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    console.error('Shader compile error:', gl.getShaderInfoLog(shader));
                    gl.deleteShader(shader);
                    return null;
                }

                return shader;
            }

            // Create program
            const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
            const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

            if (!vertexShader || !fragmentShader) {
                canvas.style.display = 'none';
                return;
            }

            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);

            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error('Program link error:', gl.getProgramInfoLog(program));
                canvas.style.display = 'none';
                return;
            }

            // Get uniform locations
            const uniforms = {
                time: gl.getUniformLocation(program, 'u_time'),
                resolution: gl.getUniformLocation(program, 'u_resolution'),
                rippleCenter: gl.getUniformLocation(program, 'u_rippleCenter'),
                rippleStrength: gl.getUniformLocation(program, 'u_rippleStrength'),
                rippleFrequency: gl.getUniformLocation(program, 'u_rippleFrequency'),
                distortion: gl.getUniformLocation(program, 'u_distortion'),
                swirl: gl.getUniformLocation(program, 'u_swirl')
            };

            // Get color uniform locations
            for (let i = 0; i < 4; i++) {
                uniforms[`color${i}`] = gl.getUniformLocation(program, `u_colors[${i}]`);
            }

            // Set up geometry
            const positionBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
                -1, -1,
                 1, -1,
                -1,  1,
                 1,  1,
            ]), gl.STATIC_DRAW);

            const positionLocation = gl.getAttribLocation(program, 'a_position');
            const vao = gl.createVertexArray();
            gl.bindVertexArray(vao);
            gl.enableVertexAttribArray(positionLocation);
            gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

            // Mouse tracking
            let mouse = { x: 0.5, y: 0.5 };
            let targetMouse = { x: 0.5, y: 0.5 };
            let mouseVelocity = 0;
            let colorVelocity = 0; // Smoothed velocity for color transitions
            let lastMouseTime = performance.now();
            let lastMousePos = { x: 0.5, y: 0.5 };

            // Helper function to interpolate between two colors
            function lerpColor(color1, color2, t) {
                return [
                    color1[0] + (color2[0] - color1[0]) * t,
                    color1[1] + (color2[1] - color1[1]) * t,
                    color1[2] + (color2[2] - color1[2]) * t,
                    color1[3] || 1.0
                ];
            }

            // Helper function to interpolate between color sets
            function interpolateColorSets(set1, set2, t) {
                const result = [];
                for (let i = 0; i < 4; i++) {
                    result.push(lerpColor(set1[i], set2[i], t));
                }
                return result;
            }

            function handleMouseMove(e) {
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                const y = (e.clientY - rect.top) / rect.height;

                const now = performance.now();
                const dt = Math.max(now - lastMouseTime, 16);
                const dx = x - lastMousePos.x;
                const dy = y - lastMousePos.y;
                const velocity = Math.sqrt(dx * dx + dy * dy) / (dt / 16.0);

                // Update ripple velocity
                mouseVelocity = Math.min(0.55, Math.max(0.12, velocity * 0.6));

                // Update color velocity with different scaling
                const rawColorVelocity = Math.min(1.0, velocity * 2.0); // More sensitive to movement
                colorVelocity += (rawColorVelocity - colorVelocity) * config.colorTransitionSpeed;

                targetMouse = { x: x, y: 1.0 - y };
                lastMousePos = { x, y };
                lastMouseTime = now;
            }

            function handleMouseLeave() {
                targetMouse = { x: 0.5, y: 0.5 };
                mouseVelocity = 0.12;
                colorVelocity = 0; // Reset to slow colors
            }

            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseleave', handleMouseLeave);

            // Touch support for mobile devices
            let touchStartTime = performance.now();
            let lastTouchPos = { x: 0.5, y: 0.5 };

            function handleTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                const x = (touch.clientX - rect.left) / rect.width;
                const y = (touch.clientY - rect.top) / rect.height;

                const now = performance.now();
                const dt = Math.max(now - touchStartTime, 16);
                const dx = x - lastTouchPos.x;
                const dy = y - lastTouchPos.y;
                const velocity = Math.sqrt(dx * dx + dy * dy) / (dt / 16.0);

                // Update velocities similar to mouse
                mouseVelocity = Math.min(0.55, Math.max(0.12, velocity * 0.8));
                const rawColorVelocity = Math.min(1.0, velocity * 3.0); // Even more sensitive for touch
                colorVelocity += (rawColorVelocity - colorVelocity) * config.colorTransitionSpeed * 1.5;

                targetMouse = { x: x, y: 1.0 - y };
                lastTouchPos = { x, y };
                touchStartTime = now;
            }

            function handleTouchEnd() {
                targetMouse = { x: 0.5, y: 0.5 };
                mouseVelocity = 0.12;
                colorVelocity *= 0.9; // Gradual slowdown
            }

            document.addEventListener('touchmove', handleTouchMove, { passive: false });
            document.addEventListener('touchend', handleTouchEnd);
            document.addEventListener('touchcancel', handleTouchEnd);

            // Performance optimization
            let frameCount = 0;
            let lastFpsUpdate = performance.now();
            let fps = 60;
            const targetFps = 60;
            const frameInterval = 1000 / targetFps;
            let lastFrameTime = performance.now();

            // Animation loop
            let startTime = performance.now() / 1000;

            function render(currentTime) {
                // FPS limiting
                const deltaTime = currentTime - lastFrameTime;

                if (deltaTime < frameInterval) {
                    requestAnimationFrame(render);
                    return;
                }

                lastFrameTime = currentTime - (deltaTime % frameInterval);

                // Calculate FPS
                frameCount++;
                if (currentTime - lastFpsUpdate >= 1000) {
                    fps = frameCount;
                    frameCount = 0;
                    lastFpsUpdate = currentTime;
                }

                // Skip frames if performance is poor
                if (fps < 30) {
                    config.distortion = Math.max(0.5, config.distortion * 0.95);
                }

                // Smooth mouse interpolation
                mouse.x += (targetMouse.x - mouse.x) * 0.1;
                mouse.y += (targetMouse.y - mouse.y) * 0.1;

                // Interpolate colors based on velocity
                let interpolatedColors;
                if (colorVelocity < 0.33) {
                    // Slow to medium
                    const t = colorVelocity / 0.33;
                    interpolatedColors = interpolateColorSets(config.colorSets.slow, config.colorSets.medium, t);
                } else if (colorVelocity < 0.66) {
                    // Medium to fast
                    const t = (colorVelocity - 0.33) / 0.33;
                    interpolatedColors = interpolateColorSets(config.colorSets.medium, config.colorSets.fast, t);
                } else {
                    // Stay at fast colors
                    interpolatedColors = config.colorSets.fast;
                }

                // Resize canvas
                const width = window.innerWidth;
                const height = window.innerHeight;

                if (canvas.width !== width || canvas.height !== height) {
                    canvas.width = width;
                    canvas.height = height;
                    gl.viewport(0, 0, width, height);
                }

                // Clear and draw
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.useProgram(program);
                gl.bindVertexArray(vao);

                // Update uniforms
                const time = (currentTime / 1000 - startTime) * config.speed;
                gl.uniform1f(uniforms.time, time);
                gl.uniform2f(uniforms.resolution, width, height);
                gl.uniform2f(uniforms.rippleCenter, mouse.x, mouse.y);
                gl.uniform1f(uniforms.rippleStrength, mouseVelocity);
                gl.uniform1f(uniforms.rippleFrequency, config.rippleFrequency);
                gl.uniform1f(uniforms.distortion, config.distortion);
                gl.uniform1f(uniforms.swirl, config.swirl);

                // Set colors - convert from 0-255 to 0-1 for shader
                for (let i = 0; i < 4; i++) {
                    const color = interpolatedColors[i];
                    const normalizedColor = [
                        color[0] / 255.0,
                        color[1] / 255.0,
                        color[2] / 255.0,
                        color[3] || 1.0
                    ];
                    gl.uniform4fv(uniforms[`color${i}`], normalizedColor);
                }

                // Draw
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                requestAnimationFrame(render);
            }

            // Detect mobile/low-end devices
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const isLowEnd = navigator.hardwareConcurrency <= 2 || isMobile;

            if (isLowEnd) {
                // Reduce complexity for mobile/low-end devices
                config.distortion = 0.8;
                config.swirl = 0.3;
                config.rippleFrequency = 20;
            }

            // Set clear color to a subtle dark accent
            gl.clearColor(0.05, 0.03, 0.08, 1.0);

            console.log('WebGL shader initialized successfully');
            console.log('Starting render loop with colors:', config.colors);

            // Start rendering
            requestAnimationFrame(render);

            // Cleanup on page unload
            window.addEventListener('unload', () => {
                document.removeEventListener('mousemove', handleMouseMove);
                document.removeEventListener('mouseleave', handleMouseLeave);
                gl.deleteProgram(program);
                gl.deleteShader(vertexShader);
                gl.deleteShader(fragmentShader);
            });
        })();
    </script>

    <!-- Main App Component -->
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext, useReducer } = React;
        const framerMotionApi = window.FramerMotion || window.Motion;
        const { motion, AnimatePresence } = framerMotionApi || {
            motion: {
                div: (props) => React.createElement('div', props),

        // Simple state management using useReducer

                case 'TOGGLE_COMMAND_PALETTE':

                case 'TOGGLE_FAVORITE':
                    const newFavorites = new Set(state.favorites);

                case 'SET_ACTIVE_TAB':

                case 'UPDATE_ANALYTICS':

                case 'TRACK_VIEW':
                    const views = { ...state.analytics.views };
                    const view = views[action.payload] || { count: 0 };
                    view.count++;
                    view.lastViewed = Date.now();
                    views[action.payload] = view;
                    return {

                case 'TRACK_TAB':
                    const tabUsage = { ...state.analytics.tabUsage };

                case 'INCREMENT_ACTION':

                case 'CHECK_ACHIEVEMENTS':

                case 'UPDATE_STUDY_STATS':
                    const updatedStats = { ...state.studyStats, ...action.payload };
                    // Track views used

                    // Check for night owl achievement
                    const hour = new Date().getHours();
                    if (hour >= 0 && hour < 6) {
                        updatedStats.nightStudySessions = (updatedStats.nightStudySessions || 0) + 1;

                    return { ...state, studyStats: updatedStats };
                case 'TRACK_ANALYTICS':
                    const newAnalyticsData = [...state.analyticsData, {

                    return { ...state, analyticsData: newAnalyticsData };
                // AI Assistant cases
                case 'TOGGLE_AI_CHAT':
                    return { ...state, showAIChat: !state.showAIChat, aiError: null };
                case 'TOGGLE_API_KEY_MODAL':
                    return { ...state, showApiKeyModal: !state.showApiKeyModal };
                case 'SET_GEMINI_API_KEY':

                default:

        // Spaced Repetition System Implementation
        class SpacedRepetitionSystem {
            constructor() {
                this.cards = new Map();
                this.loadFromStorage();
            }

            createCard(finding, diagnosis) {
                const cardId = `${finding}_${diagnosis}`.replace(/\s+/g, '_');

                if (!this.cards.has(cardId)) {
                    const cardData = {
                        id: cardId,
                        finding: finding,
                        diagnosis: diagnosis,
                        easeFactor: 2.5,
                        interval: 0,
                        repetitions: 0,
                        nextReviewDate: new Date(),
                        lastReviewDate: null,
                        lapses: 0,
                        reviewHistory: [],
                        status: 'new'
                    };

                    this.cards.set(cardId, cardData);
                    this.saveToStorage();
                }

                return this.cards.get(cardId);
            }

            reviewCard(cardId, quality) {
                const card = this.cards.get(cardId);
                if (!card) return null;

                const now = new Date();
                const review = {
                    date: now,
                    quality: quality,
                    interval: card.interval,
                    easeFactor: card.easeFactor
                };

                card.reviewHistory.push(review);
                card.lastReviewDate = now;
                card.reviewCount = (card.reviewCount || 0) + 1;

                if (quality < 3) {
                    // Failed card
                    card.repetitions = 0;
                    card.interval = 0;
                    card.lapses++;
                    card.status = card.lapses > 0 ? 'relearning' : 'learning';
                    card.nextReviewDate = new Date(now.getTime() + 10 * 60 * 1000);
                } else {
                    // Successful review
                    card.repetitions++;

                    // Calculate new ease factor
                    const newEaseFactor = card.easeFactor + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
                    card.easeFactor = Math.max(1.3, newEaseFactor);

                    // Calculate new interval
                    if (card.repetitions === 1) {
                        card.interval = 1;
                        card.status = 'learning';
                    } else if (card.repetitions === 2) {
                        card.interval = 6;
                        card.status = 'learning';
                    } else {
                        card.interval = Math.round(card.interval * card.easeFactor);
                        card.status = 'review';
                    }

                    // Add fuzz factor
                    const fuzz = this.getFuzzFactor(card.interval);
                    card.interval = Math.max(1, card.interval + fuzz);

                    card.nextReviewDate = new Date(now.getTime() + card.interval * 24 * 60 * 60 * 1000);
                }

                this.saveToStorage();
                return card;
            }

            getFuzzFactor(interval) {
                if (interval < 7) return 0;
                if (interval < 30) return Math.floor(Math.random() * 3) - 1;
                return Math.floor(Math.random() * 7) - 3;
            }

            getDueCards(finding = null) {
                const now = new Date();
                const dueCards = [];

                for (const [cardId, card] of this.cards) {
                    if (finding && card.finding !== finding) continue;
                    if (card.nextReviewDate <= now) {
                        dueCards.push(card);
                    }
                }

                dueCards.sort((a, b) => {
                    if (a.status === 'relearning' && b.status !== 'relearning') return -1;
                    if (b.status === 'relearning' && a.status !== 'relearning') return 1;
                    if (a.status === 'learning' && b.status === 'review') return -1;
                    if (b.status === 'learning' && a.status === 'review') return 1;
                    return a.interval - b.interval;
                });

                return dueCards;
            }

            getNewCards(finding = null, limit = 20) {
                const newCards = [];

                for (const [cardId, card] of this.cards) {
                    if (finding && card.finding !== finding) continue;
                    if (card.status === 'new' && card.repetitions === 0) {
                        newCards.push(card);
                        if (newCards.length >= limit) break;
                    }
                }

                return newCards;
            }

            getStatistics(finding = null) {
                let totalCards = 0;
                let newCards = 0;
                let learningCards = 0;
                let reviewCards = 0;
                let dueCards = 0;
                let totalReviews = 0;
                let correctReviews = 0;

                const now = new Date();

                for (const [cardId, card] of this.cards) {
                    if (finding && card.finding !== finding) continue;

                    totalCards++;

                    switch (card.status) {
                        case 'new': newCards++; break;
                        case 'learning':
                        case 'relearning': learningCards++; break;
                        case 'review': reviewCards++; break;
                    }

                    if (card.nextReviewDate <= now) {
                        dueCards++;
                    }

                    card.reviewHistory.forEach(review => {
                        totalReviews++;
                        if (review.quality >= 3) correctReviews++;
                    });
                }

                const retention = totalReviews > 0 ? (correctReviews / totalReviews * 100).toFixed(1) : 0;

                return {
                    totalCards,
                    newCards,
                    learningCards,
                    reviewCards,
                    dueCards,
                    totalReviews,
                    retention: `${retention}%`,
                    averageEase: this.getAverageEase(finding)
                };
            }

            getAverageEase(finding = null) {
                let totalEase = 0;
                let count = 0;

                for (const [cardId, card] of this.cards) {
                    if (finding && card.finding !== finding) continue;
                    if (card.repetitions > 0) {
                        totalEase += card.easeFactor;
                        count++;
                    }
                }

                return count > 0 ? (totalEase / count).toFixed(2) : 2.5;
            }

            getForecast(days = 30, finding = null) {
                const forecast = [];
                const now = new Date();

                for (let i = 0; i < days; i++) {
                    const date = new Date(now.getTime() + i * 24 * 60 * 60 * 1000);
                    let dueCount = 0;

                    for (const [cardId, card] of this.cards) {
                        if (finding && card.finding !== finding) continue;
                        const reviewDate = new Date(card.nextReviewDate);
                        if (reviewDate.toDateString() === date.toDateString()) {
                            dueCount++;
                        }
                    }

                    forecast.push({
                        date: date.toISOString().split('T')[0],
                        due: dueCount
                    });
                }

                return forecast;
            }

            resetCard(cardId) {
                const card = this.cards.get(cardId);
                if (!card) return null;

                card.easeFactor = 2.5;
                card.interval = 0;
                card.repetitions = 0;
                card.nextReviewDate = new Date();
                card.lastReviewDate = null;
                card.lapses = 0;
                card.reviewHistory = [];
                card.status = 'new';

                this.saveToStorage();
                return card;
            }

            saveToStorage() {
                try {
                    const data = Array.from(this.cards.entries()).map(([id, card]) => ({
                        ...card,
                        nextReviewDate: card.nextReviewDate.toISOString(),
                        lastReviewDate: card.lastReviewDate ? card.lastReviewDate.toISOString() : null,
                        reviewHistory: card.reviewHistory.map(r => ({
                            ...r,
                            date: r.date.toISOString()
                        }))
                    }));

                    localStorage.setItem('dermpath_srs_data', JSON.stringify(data));
                } catch (e) {
                    console.error('Failed to save SRS data:', e);
                }
            }

            loadFromStorage() {
                try {
                    const stored = localStorage.getItem('dermpath_srs_data');
                    if (stored) {
                        const data = JSON.parse(stored);
                        data.forEach(card => {
                            card.nextReviewDate = new Date(card.nextReviewDate);
                            card.lastReviewDate = card.lastReviewDate ? new Date(card.lastReviewDate) : null;
                            card.reviewHistory = card.reviewHistory.map(r => ({
                                ...r,
                                date: new Date(r.date)
                            }));
                            this.cards.set(card.id, card);
                        });
                    }
                } catch (e) {
                    console.error('Failed to load SRS data:', e);
                }
            }

            exportData() {
                const data = Array.from(this.cards.entries()).map(([id, card]) => card);
                return JSON.stringify(data, null, 2);
            }

            importData(jsonString) {
                try {
                    const data = JSON.parse(jsonString);
                    data.forEach(card => {
                        card.nextReviewDate = new Date(card.nextReviewDate);
                        card.lastReviewDate = card.lastReviewDate ? new Date(card.lastReviewDate) : null;
                        card.reviewHistory = card.reviewHistory.map(r => ({
                            ...r,
                            date: new Date(r.date)
                        }));
                        this.cards.set(card.id, card);
                    });
                    this.saveToStorage();
                    return true;
                } catch (e) {
                    console.error('Failed to import SRS data:', e);
                    return false;
                }
            }

            addCard(cardData) {
                const cardId = cardData.id || `${cardData.category}_${cardData.front}`.replace(/\s+/g, '_');
                const card = {
                    id: cardId,
                    front: cardData.front,
                    back: cardData.back,
                    category: cardData.category || 'default',
                    metadata: cardData.metadata || {},
                    easeFactor: 2.5,
                    interval: 0,
                    repetitions: 0,
                    nextReviewDate: new Date(),
                    lastReviewDate: null,
                    reviewCount: 0,
                    lapses: 0,
                    reviewHistory: [],
                    status: 'new'
                };
                this.cards.set(cardId, card);
                this.saveToStorage();
                return card;
            }

            getCardsForReview() {
                const now = new Date();
                const cards = [];

                this.cards.forEach(card => {
                    if (card.nextReviewDate <= now) {
                        cards.push(card);
                    }
                });

                // Sort by priority: failed cards first, then by interval
                return cards.sort((a, b) => {
                    if (a.interval === 0 && b.interval > 0) return -1;
                    if (b.interval === 0 && a.interval > 0) return 1;
                    return a.interval - b.interval;
                });
            }

            getAllCards() {
                return Array.from(this.cards.values());
            }
        }

        // Gemini AI Integration
        class GeminiAIAssistant {
            constructor() {
                this.baseURL = 'https://generativelanguage.googleapis.com/v1beta/models';
                this.model = 'gemini-1.5-flash-latest';
                this.maxTokens = 2048;
                this.temperature = 0.7;
                this.lastCallTime = 0;
                this.minCallInterval = 1000; // Rate limiting: 1 second between calls
            }

            async generateContent(prompt, apiKey, context = null) {
                // Rate limiting
                const now = Date.now();
                if (now - this.lastCallTime < this.minCallInterval) {
                    throw new Error('Please wait a moment before sending another message');
                }
                this.lastCallTime = now;

                if (!apiKey) {
                    throw new Error('API key is required. Please set your Gemini API key in settings.');
                }

                try {
                    const requestBody = {
                        contents: [{
                            parts: [{
                                text: this.buildPrompt(prompt, context)
                            }]
                        }],
                        generationConfig: {
                            temperature: this.temperature,
                            topK: 1,
                            topP: 1,
                            maxOutputTokens: this.maxTokens,
                        },
                        safetySettings: [
                            {
                                category: "HARM_CATEGORY_HARASSMENT",
                                threshold: "BLOCK_ONLY_HIGH"
                            },
                            {
                                category: "HARM_CATEGORY_HATE_SPEECH",
                                threshold: "BLOCK_ONLY_HIGH"
                            },
                            {
                                category: "HARM_CATEGORY_SEXUALLY_EXPLICIT",
                                threshold: "BLOCK_ONLY_HIGH"
                            },
                            {
                                category: "HARM_CATEGORY_DANGEROUS_CONTENT",
                                threshold: "BLOCK_ONLY_HIGH"
                            }
                        ]
                    };

                    const response = await fetch(
                        `${this.baseURL}/${this.model}:generateContent?key=${apiKey}`,
                        {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify(requestBody)
                        }
                    );

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.error?.message || `API Error: ${response.status}`);
                    }

                    const data = await response.json();

                    if (!data.candidates || !data.candidates[0]?.content?.parts?.[0]?.text) {
                        throw new Error('No response generated. Please try rephrasing your question.');
                    }

                    return data.candidates[0].content.parts[0].text;
                } catch (error) {
                    if (error.message.includes('API key')) {
                        throw error;
                    }
                    throw new Error(`Failed to get AI response: ${error.message}`);
                }
            }

            buildPrompt(userQuestion, context) {
                let systemPrompt = `You are an expert dermatopathology tutor helping medical students and residents learn.
                Be concise, accurate, and educational. Use medical terminology appropriately.
                Focus on key diagnostic features, differential diagnoses, and clinical correlations.`;

                if (context?.finding) {
                    systemPrompt += `\n\nCurrent Finding Context:
                    Finding: ${context.finding.finding}
                    Category: ${context.finding.category}
                    Alternative Names: ${context.finding.alternativeNames?.join(', ') || 'None'}
                    Sources: ${context.finding.sources?.join(', ') || 'Unknown'}`;

                    if (context.selectedDiagnosis) {
                        systemPrompt += `\n\nSelected Diagnosis: ${context.selectedDiagnosis.name}
                        Key Features: ${context.selectedDiagnosis.keyFeatures}
                        Source: ${context.selectedDiagnosis.sourceAttribution || 'Unknown'}`;
                    }

                    if (context.finding.diagnoses?.length > 0) {
                        systemPrompt += `\n\nRelated Diagnoses:`;
                        context.finding.diagnoses.slice(0, 5).forEach(dx => {
                            systemPrompt += `\n- ${dx.name}: ${dx.keyFeatures}`;
                        });
                    }
                }

                return `${systemPrompt}\n\nUser Question: ${userQuestion}`;
            }

            generateSmartQuestions(context) {
                if (!context?.finding) return [];

                const questions = [
                    `What are the key histological features of ${context.finding.finding}?`,
                    `How do I differentiate between the diagnoses associated with ${context.finding.finding}?`,
                    `What clinical correlations should I know about ${context.finding.finding}?`,
                    `Can you create a mnemonic for remembering ${context.finding.finding}?`,
                    `What are common pitfalls when diagnosing ${context.finding.finding}?`
                ];

                if (context.selectedDiagnosis) {
                    questions.push(
                        `Explain the key features: "${context.selectedDiagnosis.keyFeatures}"`,
                        `Compare ${context.selectedDiagnosis.name} with similar conditions`
                    );
                }

                return questions.slice(0, 3);
            }
        }

        // Lucide Icons Component - React-safe implementation
        const Icon = ({ name, className = "w-4 h-4" }) => {
            const iconRef = React.useRef(null);

            useEffect(() => {
                if (!iconRef.current || !name || !window.lucide) return;

                try {
                    // Map icon names that might be different
                    const iconMap = {
                        'arrows-up-down': 'chevrons-up-down',
                        'git-compare': 'git-branch'
                    };
                    const actualIconName = iconMap[name] || name;

                    // Use the data-lucide attribute method which is more reliable

            const [touchStart, setTouchStart] = useState(null);
            const [touchEnd, setTouchEnd] = useState(null);

            const minSwipeDistance = 50;

            const onTouchStart = (e) => {
                setTouchEnd(null);
                setTouchStart(e.targetTouches[0].clientX);
            };

            const onTouchMove = (e) => {
                setTouchEnd(e.targetTouches[0].clientX);
            };

            const onTouchEnd = () => {
                if (!touchStart || !touchEnd) return;
                const distance = touchStart - touchEnd;
                const isLeftSwipe = distance > minSwipeDistance;
                const isRightSwipe = distance < -minSwipeDistance;

                if (isLeftSwipe && currentIndex < diagnoses.length - 1) {
                    setCurrentIndex(currentIndex + 1);
                    setIsFlipped(false);
                }
                if (isRightSwipe && currentIndex > 0) {
                    setCurrentIndex(currentIndex - 1);
                    setIsFlipped(false);
                }
            };

            const currentCard = diagnoses[currentIndex];

            return (
                <div className="relative h-96 flex items-center justify-center">

                        className="w-full max-w-md"
                        onTouchStart={onTouchStart}
                        onTouchMove={onTouchMove}
                        onTouchEnd={onTouchEnd}

                            className="relative h-80 preserve-3d cursor-pointer"
                            style={{ transform: `rotateY(${isFlipped ? 180 : 0}deg)`, transition: 'transform 0.6s' }}

        // Network Visualization Component
        const NetworkGraph = ({ finding, diagnoses }) => {
            const svgRef = useRef(null);
            const [selectedNode, setSelectedNode] = useState(null);

            useEffect(() => {
                if (!svgRef.current || !diagnoses.length) return;

                const width = svgRef.current.clientWidth;
                const height = 600;

                // Clear previous graph
                d3.select(svgRef.current).selectAll("*").remove();

                const svg = d3.select(svgRef.current)
                    .attr("width", width)
                    .attr("height", height);

                // Create gradient definitions
                const defs = svg.append("defs");

                const gradient = defs.append("radialGradient")
                    .attr("id", "node-gradient")
                    .attr("cx", "50%")
                    .attr("cy", "50%")
                    .attr("r", "50%");

                gradient.append("stop")
                    .attr("offset", "0%")
                    .attr("stop-color", "#8b5cf6")
                    .attr("stop-opacity", 0.8);

                gradient.append("stop")
                    .attr("offset", "100%")
                    .attr("stop-color", "#6366f1")
                    .attr("stop-opacity", 0.6);

                // Create nodes
                const nodes = [
                    { id: finding, group: 0, r: 40 },
                    ...diagnoses.map((dx, i) => ({
                        id: dx.name,
                        group: 1 + (i % 5),
                        r: 25,
                        keyFeatures: dx.keyFeatures
                    }))
                ];

                // Create links
                const links = diagnoses.map(dx => ({
                    source: finding,
                    target: dx.name
                }));

                // Create simulation
                const simulation = d3.forceSimulation(nodes)
                    .force("link", d3.forceLink(links).id(d => d.id).distance(150))
                    .force("charge", d3.forceManyBody().strength(-300))
                    .force("center", d3.forceCenter(width / 2, height / 2))
                    .force("collision", d3.forceCollide().radius(d => d.r + 10));

                // Create links
                const link = svg.append("g")
                    .selectAll("line")
                    .data(links)
                    .join("line")
                    .attr("stroke", "#e5e7eb")
                    .attr("stroke-width", 2)
                    .attr("opacity", 0.6);

                // Create nodes
                const node = svg.append("g")
                    .selectAll("g")
                    .data(nodes)
                    .join("g")
                    .call(drag(simulation));

                // Add circles
                node.append("circle")
                    .attr("r", d => d.r)
                    .attr("fill", d => d.group === 0 ? "url(#node-gradient)" : "#e0e7ff")
                    .attr("stroke", d => d.group === 0 ? "#7c3aed" : "#6366f1")
                    .attr("stroke-width", 2)
                    .style("cursor", "pointer")
                    .on("click", (event, d) => {
                        setSelectedNode(d);
                    })
                    .on("mouseenter", function(event, d) {
                        d3.select(this)
                            .transition()
                            .duration(200)
                            .attr("r", d.r * 1.2);
                    })
                    .on("mouseleave", function(event, d) {
                        d3.select(this)
                            .transition()
                            .duration(200)
                            .attr("r", d.r);
                    });

                // Add labels
                node.append("text")
                    .text(d => d.id)
                    .attr("font-size", d => d.group === 0 ? "14px" : "12px")
                    .attr("font-weight", d => d.group === 0 ? "600" : "400")
                    .attr("text-anchor", "middle")
                    .attr("dy", d => d.r + 15)
                    .attr("fill", "white")
                    .style("pointer-events", "none");

                // Update positions on tick
                simulation.on("tick", () => {
                    link
                        .attr("x1", d => d.source.x)
                        .attr("y1", d => d.source.y)
                        .attr("x2", d => d.target.x)
                        .attr("y2", d => d.target.y);

                    node.attr("transform", d => `translate(${d.x},${d.y})`);
                });

                // Drag functionality
                function drag(simulation) {
                    function dragstarted(event, d) {
                        if (!event.active) simulation.alphaTarget(0.3).restart();
                        d.fx = d.x;
                        d.fy = d.y;
                    }

                    function dragged(event, d) {
                        d.fx = event.x;
                        d.fy = event.y;
                    }

                    function dragended(event, d) {
                        if (!event.active) simulation.alphaTarget(0);
                        d.fx = null;
                        d.fy = null;
                    }

                    return d3.drag()
                        .on("start", dragstarted)
                        .on("drag", dragged)
                        .on("end", dragended);
                }

                return () => {
                    simulation.stop();
                };
            }, [finding, diagnoses]);

                averageInterval: 0,
                cardsByCategory: {},
                reviewSchedule: {},
                performanceHistory: []
            });

            useEffect(() => {
                const cards = srsInstance.getAllCards();

                // Calculate statistics
                const totalCards = cards.length;
                const reviewedCards = cards.filter(c => c.reviewCount > 0);
                const cardsReviewed = reviewedCards.length;

                const averageEaseFactor = reviewedCards.length > 0
                    ? reviewedCards.reduce((sum, c) => sum + c.easeFactor, 0) / reviewedCards.length
                    : 2.5;

                const averageInterval = reviewedCards.length > 0
                    ? reviewedCards.reduce((sum, c) => sum + c.interval, 0) / reviewedCards.length
                    : 0;

                // Cards by category
                const cardsByCategory = cards.reduce((acc, card) => {
                    const category = card.category || 'Uncategorized';
                    acc[category] = (acc[category] || 0) + 1;
                    return acc;
                }, {});

                // Review schedule for next 7 days
                const reviewSchedule = {};
                const today = new Date();
                for (let i = 0; i < 7; i++) {
                    const date = new Date(today);
                    date.setDate(date.getDate() + i);
                    const dateStr = date.toDateString();
                    reviewSchedule[dateStr] = 0;
                }

                cards.forEach(card => {
                    const reviewDate = new Date(card.nextReviewDate);
                    const dateStr = reviewDate.toDateString();
                    if (reviewSchedule.hasOwnProperty(dateStr)) {
                        reviewSchedule[dateStr]++;
                    }
                });

                // Performance history (last 10 reviews)
                const allReviews = [];
                cards.forEach(card => {
                    card.reviewHistory.forEach(review => {
                        allReviews.push({
                            date: review.date,
                            quality: review.quality,
                            cardId: card.id
                        });
                    });
                });
                const performanceHistory = allReviews
                    .sort((a, b) => b.date - a.date)
                    .slice(0, 10);

                setStats({
                    totalCards,
                    cardsReviewed,
                    averageEaseFactor,
                    averageInterval,
                    cardsByCategory,
                    reviewSchedule,
                    performanceHistory
                });
            }, [srsInstance]);

        const exportToExcel = () => {
            if (!window.dermDifferentialData) return;

            // Create CSV content
            let csv = 'Finding,Diagnosis,Key Features\n';

            window.dermDifferentialData.forEach(item => {
                item.diagnoses.forEach(dx => {
                    // Escape quotes and wrap fields containing commas
                    const finding = `"${item.finding.replace(/"/g, '""')}"`;
                    const diagnosis = `"${dx.name.replace(/"/g, '""')}"`;
                    const features = `"${dx.keyFeatures.replace(/"/g, '""')}"`;

                    csv += `${finding},${diagnosis},${features}\n`;
                });
            });

            // Download CSV file
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);

            link.setAttribute('href', url);
            link.setAttribute('download', `dermatopathology_differentials_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            const { state, dispatch } = useGlobalState();
            const { showAIChat, aiChatHistory, aiChatLoading, aiError, geminiApiKey, selectedFinding } = state;
            const [inputValue, setInputValue] = useState('');
            const chatEndRef = useRef(null);
            const inputRef = useRef(null);

            useEffect(() => {
                if (showAIChat && inputRef.current) {
                    inputRef.current.focus();
                }
            }, [showAIChat]);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [aiChatHistory]);

            const handleSendMessage = async () => {
                if (!inputValue.trim() || aiChatLoading) return;

                if (!geminiApiKey) {
                    dispatch({ type: 'TOGGLE_API_KEY_MODAL' });
                    return;
                }

                const userMessage = {
                    id: Date.now(),
                    role: 'user',
                    content: inputValue,
                    timestamp: new Date()
                };

                dispatch({ type: 'ADD_AI_MESSAGE', payload: userMessage });
                dispatch({ type: 'SET_AI_LOADING', payload: true });
                setInputValue('');

                try {
                    const currentFinding = window.dermDifferentialData?.find(f => f.finding === selectedFinding);
                    const context = currentFinding ? {
                        finding: currentFinding,
                        selectedDiagnosis: null
                    } : null;

                    const response = await geminiAI.generateContent(inputValue, geminiApiKey, context);

                    const aiMessage = {
                        id: Date.now() + 1,
                        role: 'assistant',
                        content: response,
                        timestamp: new Date()
                    };

                    dispatch({ type: 'ADD_AI_MESSAGE', payload: aiMessage });
                } catch (error) {
                    dispatch({ type: 'SET_AI_ERROR', payload: error.message });
                } finally {
                    dispatch({ type: 'SET_AI_LOADING', payload: false });
                }
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSendMessage();
                }
            };

            const getSmartQuestions = () => {
                const currentFinding = window.dermDifferentialData?.find(f => f.finding === selectedFinding);
                if (!currentFinding) return [];
                return geminiAI.generateSmartQuestions({ finding: currentFinding });
            };

            if (!showAIChat) return null;

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-end justify-end p-4">
                    <div className="w-full max-w-md h-[600px] glass dark:glass-dark rounded-t-2xl flex flex-col animate-slide-up">
                        {/* Header */}
                        <div className="p-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-full bg-teal-700 flex items-center justify-center">
                                    <Icon name="sparkles" className="w-6 h-6 text-white" />
                                </div>
                                <div>
                                    <h3 className="font-semibold text-gray-900 dark:text-white">AI Study Assistant</h3>
                                    <p className="text-xs text-gray-500 dark:text-gray-400">
                                        {selectedFinding ? `Learning about ${selectedFinding}` : 'General dermatopathology help'}
                                    </p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-2">
                                <button
                                    onClick={() => dispatch({ type: 'TOGGLE_API_KEY_MODAL' })}
                                    className="p-2 glass dark:glass-dark rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800"
                                    title="API Settings"
                                >
                                    <Icon name="settings" className="w-4 h-4" />
                                </button>
                                <button
                                    onClick={() => dispatch({ type: 'TOGGLE_AI_CHAT' })}
                                    className="p-2 glass dark:glass-dark rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800"
                                >
                                    <Icon name="x" className="w-4 h-4" />
                                </button>
                            </div>
                        </div>

                        {/* Chat Messages */}
                        <div className="flex-1 overflow-y-auto p-4 space-y-4">
                            {aiChatHistory.length === 0 && (
                                <div className="text-center py-8">
                                    <Icon name="message-square" className="w-12 h-12 mx-auto text-gray-300 dark:text-gray-600 mb-3" />
                                    <p className="text-gray-500 dark:text-gray-400 mb-4">
                                        Ask me anything about dermatopathology!
                                    </p>
                                    {geminiApiKey && (
                                        <div className="space-y-2">
                                            <p className="text-sm text-gray-500 dark:text-gray-400 mb-2">Try these questions:</p>
                                            {getSmartQuestions().map((question, idx) => (
                                                <button
                                                    key={idx}
                                                    onClick={() => setInputValue(question)}
                                                    className="block w-full text-left p-3 glass dark:glass-dark rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors text-sm"
                                                >
                                                    <Icon name="sparkles" className="w-4 h-4 inline-block mr-2 text-teal-600" />
                                                    {question}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                            {aiChatHistory.map((message) => (
                                <div
                                    key={message.id}
                                    className={`flex ${message.role === 'user' ? 'justify-end' : 'justify-start'}`}
                                >
                                    <div
                                        className={`max-w-[80%] p-3 rounded-lg ${
                                            message.role === 'user'
                                                ? 'bg-teal-700 text-white'
                                                : 'glass dark:glass-dark'
                                        }`}
                                    >
                                        <p className="text-sm whitespace-pre-wrap">{message.content}</p>
                                        <p className={`text-xs mt-1 ${
                                            message.role === 'user' ? 'text-teal-100' : 'text-gray-500 dark:text-gray-400'
                                        }`}>
                                            {new Date(message.timestamp).toLocaleTimeString()}
                                        </p>
                                    </div>
                                </div>
                            ))}

                            {aiChatLoading && (
                                <div className="flex justify-start">
                                    <div className="glass dark:glass-dark p-3 rounded-lg">
                                        <div className="flex space-x-2">
                                            <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '0ms' }}></div>
                                            <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></div>
                                            <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {aiError && (
                                <div className="glass dark:glass-dark border-l-4 border-red-500 p-3 rounded-lg">
                                    <p className="text-sm text-red-600 dark:text-red-400">{aiError}</p>
                                </div>
                            )}

                            <div ref={chatEndRef} />
                        </div>

                        {/* Input Area */}
                        <div className="p-4 border-t border-gray-200 dark:border-gray-700">
                            {!geminiApiKey && (
                                <div className="mb-3 p-3 bg-yellow-50 dark:bg-yellow-900/20 rounded-lg">
                                    <p className="text-sm text-yellow-800 dark:text-yellow-200">
                                        <Icon name="alert-circle" className="w-4 h-4 inline-block mr-1" />
                                        Please set your Gemini API key to start chatting
                                    </p>
                                </div>
                            )}
                            <div className="flex space-x-2">
                                <input
                                    ref={inputRef}
                                    type="text"
                                    value={inputValue}
                                    onChange={(e) => setInputValue(e.target.value)}
                                    onKeyPress={handleKeyPress}
                                    placeholder={geminiApiKey ? "Ask a question..." : "Set API key first..."}
                                    disabled={!geminiApiKey || aiChatLoading}
                                    className="flex-1 px-4 py-2 glass dark:glass-dark rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 disabled:opacity-50"
                                />
                                <button
                                    onClick={handleSendMessage}
                                    disabled={!geminiApiKey || !inputValue.trim() || aiChatLoading}
                                    className="px-4 py-2 bg-teal-700 text-white rounded-lg hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed transition-opacity"
                                >
                                    <Icon name="send" className="w-4 h-4" />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // API Key Settings Modal Component
        const APIKeyModal = () => {
            const { state, dispatch } = useGlobalState();
            const { showApiKeyModal, geminiApiKey } = state;
            const [apiKeyInput, setApiKeyInput] = useState('');
            const [showKey, setShowKey] = useState(false);

            useEffect(() => {
                if (showApiKeyModal && geminiApiKey) {
                    setApiKeyInput(geminiApiKey);
                }
            }, [showApiKeyModal, geminiApiKey]);

            const handleSave = () => {
                if (apiKeyInput.trim()) {
                    dispatch({ type: 'SET_GEMINI_API_KEY', payload: apiKeyInput.trim() });
                }
            };

            const handleClear = () => {
                setApiKeyInput('');
                dispatch({ type: 'SET_GEMINI_API_KEY', payload: '' });
            };

            if (!showApiKeyModal) return null;

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div className="w-full max-w-md glass dark:glass-dark rounded-2xl p-6 animate-fade-in">
                        <h3 className="text-xl font-semibold text-gray-900 dark:text-white mb-4">
                            Gemini API Settings
                        </h3>

                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                    API Key
                                </label>
                                <div className="relative">
                                    <input
                                        type={showKey ? 'text' : 'password'}
                                        value={apiKeyInput}
                                        onChange={(e) => setApiKeyInput(e.target.value)}
                                        placeholder="Enter your Gemini API key"
                                        className="w-full px-4 py-2 pr-10 glass dark:glass-dark rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
                                    />
                                    <button
                                        type="button"
                                        onClick={() => setShowKey(!showKey)}
                                        className="absolute right-2 top-1/2 -translate-y-1/2 p-1 hover:bg-gray-200 dark:hover:bg-gray-700 rounded"
                                    >
                                        <Icon name={showKey ? 'eye-off' : 'eye'} className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>

                            <div className="p-4 bg-blue-50 dark:bg-blue-900/20 rounded-lg">
                                <h4 className="font-medium text-blue-900 dark:text-blue-100 mb-1">
                                    How to get a Gemini API key:
                                </h4>
                                <ol className="text-sm text-blue-700 dark:text-blue-200 space-y-1 list-decimal list-inside">
                                    <li>Visit <a href="https://makersuite.google.com/app/apikey" target="_blank" rel="noopener noreferrer" className="underline">Google AI Studio</a></li>
                                    <li>Sign in with your Google account</li>
                                    <li>Click "Create API key"</li>
                                    <li>Copy the key and paste it here</li>
                                </ol>
                            </div>

                            <div className="p-4 bg-yellow-50 dark:bg-yellow-900/20 rounded-lg">
                                <p className="text-sm text-yellow-800 dark:text-yellow-200">
                                    <Icon name="alert-triangle" className="w-4 h-4 inline-block mr-1" />
                                    <strong>Security Notice:</strong> Your API key is stored locally in your browser.
                                    Never share your API key or use it on public computers.
                                </p>
                            </div>
                        </div>

                        <div className="flex justify-end space-x-3 mt-6">
                            <button
                                onClick={handleClear}
                                className="px-4 py-2 glass dark:glass-dark rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
                            >
                                Clear
                            </button>
                            <button
                                onClick={() => dispatch({ type: 'TOGGLE_API_KEY_MODAL' })}
                                className="px-4 py-2 glass dark:glass-dark rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
                            >
                                Cancel
                            </button>
                            <button
                                onClick={handleSave}
                                disabled={!apiKeyInput.trim()}
                                className="px-4 py-2 bg-teal-700 text-white rounded-lg hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed transition-opacity"
                            >
                                Save
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <StateProvider>
                <App />
            </StateProvider>
        );
    </script>
    <script>
        if (window.LegacyGuidance?.maybeShow) {
            window.LegacyGuidance.maybeShow('dermatopathology-modern', [
                'Use search or categories first, then open a diagnosis card for details.',
                'Use keyboard Tab/Shift+Tab to move between controls and visible focus rings.',
                'Use the shell Help/Reset controls for quick recovery without leaving the page.'
            ]);
        }
    </script>
</body>
</html>
