<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dermatopathology Navigator: browse histopathologic patterns, their differential diagnoses, and the diagnoses shared across patterns.">
    <title>Dermatopathology Navigator</title>

    <script src="../vendor/react.production.min.js"></script>
    <script src="../vendor/react-dom.production.min.js"></script>
    <script src="../vendor/babel.min.js"></script>
    <script src="../vendor/fuse.min.js"></script>
    <script src="../vendor/d3.min.js"></script>
    <link rel="stylesheet" href="../shared/legacy-tokens.css">
    <link rel="stylesheet" href="../shared/legacy-primitives.css">
    <link rel="stylesheet" href="../shared/legacy-shell.css">
    <link rel="stylesheet" href="./clinical-reference.css">
    <script src="../shared/legacy-shell.js" defer></script>
    <script src="../shared/legacy-guidance.js" defer></script>
</head>
<body class="clinical-reference legacy-focus-ring" data-legacy-shell="true" data-help-steps='["Pick a pattern from the left-hand browser, or press Ctrl/⌘ K to search patterns, diagnoses and key features.","The network opens by default: the hub is the pattern, each node is a diagnosis in its differential. Larger, shaded nodes are listed under other patterns too; the number inside is how many.","Point at, tab to or select a node: its full name shows in the bar above the graph. Selecting it opens key features, a star, a note and links to other patterns that list it.","Drag a node to move it with a mouse, pen or finger (or nudge a focused node with the arrow keys); drag the background to pan. The reset button restores the ring.","Expand (top right of the graph) gives the network the full width and keeps details in a side drawer; Esc returns. On phones, a full-name list and the details sit directly under the graph.","Switch to List for a reading view or Flashcards for self-testing (arrow keys move, Space reveals).","Stars and notes are kept in this browser only. Reload reloads the page without deleting them."]'>
    <div id="root"><p class="dpn-loading">Loading reference…</p></div>

    <script type="module" src="./data-loader.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback, useLayoutEffect } = React;

        const DEFAULT_VIEW = 'network';
        const VIEWS = [
            { id: 'network', label: 'Network', icon: 'network' },
            { id: 'list', label: 'List', icon: 'list' },
            { id: 'flashcards', label: 'Flashcards', icon: 'layers' },
        ];
        const STORAGE_KEY = 'dermpath-navigator:v1';

        // ---------------------------------------------------------------- data

        /** Normalise a diagnosis name so the same entity matches across sources. */
        const normDx = (name) => String(name || '').toLowerCase().replace(/\s+/g, ' ').replace(/[.;,:]+$/, '').trim();

        /** Split "Regular acanthosis (Ko)" into a display label and its source tag. */
        function splitFinding(raw) {
            const match = String(raw).match(/^(.*?)\s*\(([^()]+)\)\s*$/);
            const source = match ? match[2].trim() : '';
            const label = match ? match[1].trim() : String(raw).trim();
            const group = source
                ? source.replace(/^Ref Sheet\s*-\s*/i, '').split(/\s+-\s+/)[0].replace(/\s+T\d+(?:\.\d+)?$/i, '').trim()
                : 'Other';
            return { label, source, group: group || 'Other' };
        }

        /** Build lookup structures from the raw reference array. Invalid rows are skipped, never thrown on. */
        function buildModel(raw) {
            const rows = Array.isArray(raw) ? raw : [];
            const findings = [];
            const seen = new Set();
            rows.forEach((row) => {
                if (!row || typeof row.finding !== 'string' || !Array.isArray(row.diagnoses) || seen.has(row.finding)) return;
                const diagnoses = row.diagnoses.filter((dx) => dx && typeof dx.name === 'string' && dx.name.trim());
                if (!diagnoses.length) return;
                seen.add(row.finding);
                findings.push({
                    id: row.finding,
                    ...splitFinding(row.finding),
                    citations: Array.isArray(row.sources) ? row.sources.filter((s) => typeof s === 'string') : [],
                    diagnoses,
                });
            });

            const byId = new Map(findings.map((f) => [f.id, f]));
            const dxIndex = new Map();
            findings.forEach((f) => f.diagnoses.forEach((dx) => {
                const key = normDx(dx.name);
                if (!dxIndex.has(key)) dxIndex.set(key, []);
                const list = dxIndex.get(key);
                if (!list.includes(f.id)) list.push(f.id);
            }));

            const groups = [];
            const groupMap = new Map();
            findings.forEach((f) => {
                if (!groupMap.has(f.group)) {
                    const g = { name: f.group, findings: [] };
                    groupMap.set(f.group, g);
                    groups.push(g);
                }
                groupMap.get(f.group).findings.push(f);
            });

            const entryCount = findings.reduce((n, f) => n + f.diagnoses.length, 0);
            return { findings, byId, dxIndex, groups, entryCount };
        }

        /** Other patterns (finding ids) whose differential also lists this diagnosis. */
        const alsoIn = (model, findingId, dxName) =>
            (model.dxIndex.get(normDx(dxName)) || []).filter((id) => id !== findingId);

        function loadStore() {
            try {
                const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                const favorites = Array.isArray(parsed?.favorites) ? parsed.favorites.filter((v) => typeof v === 'string') : [];
                const notes = {};
                if (parsed && parsed.notes && typeof parsed.notes === 'object') {
                    Object.entries(parsed.notes).forEach(([k, v]) => { if (typeof v === 'string' && v.trim()) notes[k] = v; });
                }
                return { favorites, notes };
            } catch (error) {
                return { favorites: [], notes: {} };
            }
        }

        function saveStore(favorites, notes) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ favorites: [...favorites], notes }));
            } catch (error) {
                /* storage may be unavailable (private mode); stars and notes then last for the session only */
            }
        }

        function readHash() {
            try {
                const params = new URLSearchParams(window.location.hash.replace(/^#/, ''));
                return { finding: params.get('f'), dx: params.get('dx') };
            } catch (error) {
                return { finding: null, dx: null };
            }
        }

        function writeHash(findingId, dxName) {
            const hash = '#f=' + encodeURIComponent(findingId) + (dxName ? '&dx=' + encodeURIComponent(dxName) : '');
            if (window.location.hash !== hash) history.replaceState(null, '', hash);
        }

        const truncate = (text, max) => (text.length > max ? text.slice(0, Math.max(1, max - 1)).trimEnd() + '…' : text);
        const isTypingTarget = (el) => !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);

        /** Track a CSS media query; used to move diagnosis details next to the graph on phones. */
        function useMediaQuery(query) {
            const get = () => (typeof window.matchMedia === 'function' ? window.matchMedia(query).matches : false);
            const [matches, setMatches] = useState(get);
            useEffect(() => {
                if (typeof window.matchMedia !== 'function') return undefined;
                const mql = window.matchMedia(query);
                const onChange = () => setMatches(mql.matches);
                onChange();
                mql.addEventListener ? mql.addEventListener('change', onChange) : mql.addListener(onChange);
                return () => (mql.removeEventListener ? mql.removeEventListener('change', onChange) : mql.removeListener(onChange));
            }, [query]);
            return matches;
        }

        // --------------------------------------------------------------- icons

        const ICON_PATHS = {
            search: <><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></>,
            star: <path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-2.9-5.4 2.9 1.1-6L3.2 9.4l6.1-.8Z" />,
            note: <><path d="M4 20h4L19 9l-4-4L4 16Z" /><path d="m13.5 6.5 4 4" /></>,
            network: <><circle cx="12" cy="12" r="2.5" /><circle cx="5" cy="5" r="1.8" /><circle cx="19" cy="5" r="1.8" /><circle cx="5" cy="19" r="1.8" /><circle cx="19" cy="19" r="1.8" /><path d="m6.4 6.4 3.8 3.8m3.6 0 3.8-3.8M6.4 17.6l3.8-3.8m3.6 0 3.8 3.8" /></>,
            list: <path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01" />,
            layers: <><path d="m12 3 9 5-9 5-9-5Z" /><path d="m3 13 9 5 9-5" /></>,
            plus: <path d="M12 5v14M5 12h14" />,
            minus: <path d="M5 12h14" />,
            fit: <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />,
            left: <path d="M15 6l-6 6 6 6" />,
            right: <path d="m9 6 6 6-6 6" />,
            eye: <><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /></>,
            arrow: <path d="M5 12h14m-6-6 6 6-6 6" />,
            expand: <path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7" />,
            collapse: <path d="M4 14h6v6M20 10h-6V4M10 14l-7 7M14 10l7-7" />,
        };

        const Icon = ({ name, filled = false }) => (
            <svg className={'dpn-icon' + (filled ? ' dpn-icon--filled' : '')} viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                {ICON_PATHS[name]}
            </svg>
        );

        // ------------------------------------------------------------ masthead

        const Masthead = ({ model, onSearch }) => {
            const isMac = /Mac|iPhone|iPad/.test(navigator.platform || '');
            return (
                <header className="dpn-masthead">
                    <div className="dpn-masthead__brand">
                        <svg className="dpn-mark" viewBox="0 0 44 44" aria-hidden="true">
                            <rect width="44" height="44" fill="var(--cl-ink)" />
                            <circle cx="22" cy="22" r="13" fill="none" stroke="var(--cl-bone)" strokeWidth="1.25" />
                            <circle cx="22" cy="22" r="6.5" fill="none" stroke="var(--cl-bone)" strokeWidth="1" strokeDasharray="2 2.5" />
                            <circle cx="22" cy="22" r="2.5" fill="var(--cl-terracotta)" />
                        </svg>
                        <div>
                            <h1>Dermatopathology Navigator</h1>
                            <p className="cl-page-subtitle">Clinical Dermatopathology Reference</p>
                        </div>
                    </div>
                    <div className="dpn-masthead__meta">
                        <dl className="dpn-stats">
                            <div><dt>Patterns</dt><dd>{model.findings.length}</dd></div>
                            <div><dt>Entries</dt><dd>{model.entryCount}</dd></div>
                            <div><dt>Diagnoses</dt><dd>{model.dxIndex.size}</dd></div>
                        </dl>
                        <button type="button" className="dpn-btn dpn-search-trigger" onClick={onSearch}>
                            <span style={{ display: 'inline-flex', gap: '0.5rem', alignItems: 'center' }}><Icon name="search" />Search reference</span>
                            <kbd className="dpn-kbd">{isMac ? '⌘K' : 'Ctrl K'}</kbd>
                        </button>
                    </div>
                </header>
            );
        };

        // ------------------------------------------------------ pattern browser

        const FindingBrowser = ({ model, activeId, onSelect }) => {
            const [query, setQuery] = useState('');
            const activeRef = useRef(null);
            const groupsRef = useRef(null);
            const q = query.trim().toLowerCase();
            const groups = useMemo(() => model.groups
                .map((g) => ({ ...g, findings: q ? g.findings.filter((f) => f.label.toLowerCase().includes(q)) : g.findings }))
                .filter((g) => g.findings.length), [model, q]);

            useEffect(() => {
                // Keep the active pattern in view when it changes from elsewhere (search, linked jump).
                // Scroll only the list container: scrollIntoView would also scroll the page under the shell bar.
                const item = activeRef.current;
                const box = groupsRef.current;
                if (!item || !box) return;
                const itemTop = item.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop;
                if (itemTop < box.scrollTop || itemTop + item.offsetHeight > box.scrollTop + box.clientHeight) {
                    box.scrollTop = Math.max(0, itemTop - box.clientHeight / 3);
                }
            }, [activeId]);

            return (
                <nav className="dpn-panel dpn-browser" aria-label="Patterns" data-testid="finding-browser">
                    <div className="dpn-panel__head">
                        <h2 className="dpn-panel__title">Patterns</h2>
                        <span className="dpn-kicker">{model.findings.length}</span>
                    </div>
                    <div className="dpn-filter">
                        <Icon name="search" />
                        <input
                            type="search"
                            className="dpn-input"
                            placeholder="Filter patterns"
                            aria-label="Filter patterns"
                            value={query}
                            onChange={(e) => setQuery(e.target.value)}
                        />
                    </div>
                    <div className="dpn-browser__groups" ref={groupsRef}>
                        {groups.length === 0 && <p className="dpn-empty">No pattern matches “{query}”.</p>}
                        {groups.map((g) => (
                            <section className="dpn-group" key={g.name} aria-label={g.name}>
                                <div className="dpn-group__head">
                                    <span className="dpn-kicker">{g.name}</span>
                                    <span className="dpn-kicker">{g.findings.length}</span>
                                </div>
                                <ul>
                                    {g.findings.map((f) => (
                                        <li key={f.id}>
                                            <button
                                                type="button"
                                                className="dpn-finding"
                                                data-finding={f.id}
                                                aria-current={f.id === activeId ? 'true' : undefined}
                                                ref={f.id === activeId ? activeRef : undefined}
                                                onClick={() => onSelect(f.id)}
                                                title={f.source ? `${f.label} — ${f.source}` : f.label}
                                            >
                                                <span>{f.label}</span>
                                                <span className="dpn-finding__count" aria-label={`${f.diagnoses.length} diagnoses`}>{f.diagnoses.length}</span>
                                            </button>
                                        </li>
                                    ))}
                                </ul>
                            </section>
                        ))}
                    </div>
                </nav>
            );
        };

        // ------------------------------------------------------------- network

        /** Label placement for a node at direction (cos, sin) from the hub: along the ray, or beside the node. */
        function labelFor(cos, sin, size, radial) {
            if (radial) {
                const deg = (Math.atan2(sin, cos) * 180) / Math.PI;
                const flip = cos < -1e-6;
                return { x: flip ? -(size + 7) : size + 7, y: 0, anchor: flip ? 'end' : 'start', rotate: flip ? deg + 180 : deg };
            }
            const anchor = cos > 0.25 ? 'start' : cos < -0.25 ? 'end' : 'middle';
            const dx = anchor === 'start' ? size + 8 : anchor === 'end' ? -(size + 8) : 0;
            const dy = anchor === 'middle' ? (sin < 0 ? -(size + 12) : size + 14) : 0;
            return { x: dx, y: dy, anchor, rotate: 0 };
        }

        /** Deterministic radial layout: hub in the centre, one ray per diagnosis. */
        function computeLayout(nodes, width, tall = false) {
            const narrow = width < 560;
            // Radial labels can only use (shorter side / 2 - ring radius), so expanded mode buys label room with height.
            const height = narrow
                ? Math.round(Math.max(360, width * 1.05))
                : tall
                    ? Math.round(Math.min(900, Math.max(560, width * 0.9)))
                    : Math.round(Math.min(660, Math.max(480, width * 0.8)));
            const n = nodes.length;
            const radial = n > 8;
            const charPx = narrow ? 6 : 6.6;
            const minR = Math.max(narrow ? 60 : 90, (n * (narrow ? 22 : 26)) / (2 * Math.PI));
            let chars = narrow ? 18 : tall ? 44 : 30;
            let r = 0;
            for (;;) {
                const labelRoom = chars * charPx + 20;
                // Radial labels run outward along their ray; horizontal labels (small differentials) only need side room.
                r = radial
                    ? Math.min(width, height) / 2 - labelRoom - 10
                    : Math.min(width / 2 - labelRoom - 10, height / 2 - 44);
                if (r >= minR || chars <= 10) break;
                chars -= 2;
            }
            // Node spacing wins over label room; any overflow this causes is absorbed by the fit-to-content viewBox.
            r = Math.max(r, minR);
            const cx = width / 2;
            const cy = height / 2;
            // Invisible tap targets may not reach a neighbour, or a tap on a dense ring selects the wrong diagnosis.
            const halfGap = n > 1 ? (2 * Math.PI * r) / n / 2 - 0.5 : Infinity;
            const placed = nodes.map((node, i) => {
                const angle = -Math.PI / 2 + (2 * Math.PI * i) / n;
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);
                // Dots never exceed half the gap to their neighbour, so neither dots nor tap targets collide.
                const size = Math.min(node.shared > 0 ? 8.5 + 1.1 * Math.min(node.shared - 1, 4) : 5.5, halfGap);
                const label = labelFor(cos, sin, size, radial);
                const hit = Math.max(size, Math.min(size + 8, halfGap));
                return { ...node, x: cx + r * cos, y: cy + r * sin, size, hit, label, text: truncate(node.name, chars) };
            });
            return { width, height, cx, cy, r, radial, nodes: placed, hubR: narrow ? 22 : 30 };
        }

        const NetworkGraph = ({ finding, model, selectedDx, favorites, onSelectDx, expanded = false, onToggleExpanded = null }) => {
            const wrapRef = useRef(null);
            const svgRef = useRef(null);
            const viewRef = useRef(null);
            const graphRef = useRef(null);
            const [fit, setFit] = useState(1);
            const zoomRef = useRef(null);
            const [width, setWidth] = useState(0);
            const [hover, setHover] = useState(null);
            // Nodes the user has moved, as offsets from their ring position. Cleared per pattern and on reset.
            const [offsets, setOffsets] = useState({});
            const baseRef = useRef({});
            const boundsRef = useRef(null);
            useEffect(() => { setOffsets({}); }, [finding.id]);
            const offsetsRef = useRef(offsets);
            offsetsRef.current = offsets;

            useLayoutEffect(() => {
                const el = wrapRef.current;
                if (!el) return undefined;
                setWidth(Math.floor(el.clientWidth));
                if (typeof ResizeObserver === 'undefined') return undefined;
                const ro = new ResizeObserver((entries) => {
                    const w = Math.floor(entries[0].contentRect.width);
                    setWidth((prev) => (Math.abs(prev - w) > 1 ? w : prev));
                });
                ro.observe(el);
                return () => ro.disconnect();
            }, []);

            const nodes = useMemo(() => finding.diagnoses.map((dx) => ({
                name: dx.name,
                key: normDx(dx.name),
                shared: alsoIn(model, finding.id, dx.name).length,
            })), [finding, model]);

            const layout = useMemo(() => (width > 0 ? computeLayout(nodes, width, expanded) : null), [nodes, width, expanded]);

            // Zoom the initial view out just enough that every label is inside the frame. Measured from the
            // rendered geometry (real font metrics), re-measured once web fonts finish loading.
            useLayoutEffect(() => {
                if (!layout) return undefined;
                let cancelled = false;
                const measure = () => {
                    const g = graphRef.current;
                    if (cancelled || !g) return;
                    const box = g.getBBox();
                    const pad = 18; // headroom for the bold label of a hovered or selected node
                    const halfW = Math.max(layout.cx - (box.x - pad), box.x + box.width + pad - layout.cx);
                    const halfH = Math.max(layout.cy - (box.y - pad), box.y + box.height + pad - layout.cy);
                    const next = Math.max(1, (2 * halfW) / layout.width, (2 * halfH) / layout.height);
                    setFit((prev) => (Math.abs(prev - next) > 0.005 ? next : prev));
                };
                measure();
                if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
                return () => { cancelled = true; };
            }, [layout]);

            useEffect(() => {
                if (!svgRef.current || !viewRef.current || !window.d3) return undefined;
                const svg = d3.select(svgRef.current);
                const zoom = d3.zoom()
                    .scaleExtent([0.5, 4])
                    // Wheel zoom only with a modifier so the page still scrolls; touch pans/zooms only with two fingers.
                    .filter((event) => {
                        if (event.type === 'wheel') return event.ctrlKey || event.metaKey;
                        if (event.type === 'touchstart') return event.touches && event.touches.length > 1;
                        return !event.button;
                    })
                    .on('zoom', (event) => {
                        if (viewRef.current) viewRef.current.setAttribute('transform', event.transform.toString());
                    });
                svg.call(zoom).on('dblclick.zoom', null);
                zoomRef.current = zoom;
                svg.call(zoom.transform, d3.zoomIdentity);
                return () => svg.on('.zoom', null);
            }, [finding.id, layout !== null]);

            /** Move a node by (dx, dy) in graph units, keeping its centre inside the visible frame. */
            const moveTo = useCallback((key, x, y) => {
                const base = baseRef.current[key];
                const b = boundsRef.current;
                if (!base || !b) return;
                let nx = x;
                let ny = y;
                // Keep a dropped node clear of the hub so it never hides the diagnosis count.
                const d = Math.hypot(nx - b.hubX, ny - b.hubY);
                const minD = b.hubR + base.size + 6;
                if (d < minD) {
                    const ux = d > 0.001 ? (nx - b.hubX) / d : (base.x - b.hubX) / (Math.hypot(base.x - b.hubX, base.y - b.hubY) || 1);
                    const uy = d > 0.001 ? (ny - b.hubY) / d : (base.y - b.hubY) / (Math.hypot(base.x - b.hubX, base.y - b.hubY) || 1);
                    nx = b.hubX + ux * minD;
                    ny = b.hubY + uy * minD;
                }
                nx = Math.min(b.x1, Math.max(b.x0, nx));
                ny = Math.min(b.y1, Math.max(b.y0, ny));
                setOffsets((prev) => ({ ...prev, [key]: { x: nx - base.x, y: ny - base.y } }));
            }, []);

            // Drag diagnosis nodes with a mouse, pen or one finger. A finger that lands on a node drags it
            // (.dpn-node has touch-action: none); a finger on the empty background still scrolls the page.
            // d3-drag stops the gesture reaching d3-zoom, so dragging a node never pans the graph, and a drag
            // longer than clickDistance does not count as a click (no accidental selection). Taps still select.
            useEffect(() => {
                const g = graphRef.current;
                if (!g || !window.d3 || !layout) return undefined;
                const nodesSel = d3.select(g).selectAll('.dpn-node');
                const drag = d3.drag()
                    .filter((event) => (event.type === 'mousedown' && !event.button && !event.ctrlKey)
                        || (event.type === 'touchstart' && event.touches && event.touches.length === 1))
                    .clickDistance(4)
                    .container(() => g)
                    .subject(function () {
                        const key = this.getAttribute('data-key');
                        const base = baseRef.current[key];
                        if (!base) return null;
                        const off = offsetsRef.current[key] || { x: 0, y: 0 };
                        return { x: base.x + off.x, y: base.y + off.y };
                    })
                    .on('start', function () { this.classList.add('is-dragging'); })
                    .on('drag', function (event) { moveTo(this.getAttribute('data-key'), event.x, event.y); })
                    .on('end', function () { this.classList.remove('is-dragging'); });
                nodesSel.call(drag);
                return () => nodesSel.on('.drag', null);
            }, [layout, moveTo]);

            const zoomBy = (k) => zoomRef.current && d3.select(svgRef.current).transition().duration(180).call(zoomRef.current.scaleBy, k);
            const zoomReset = () => zoomRef.current && d3.select(svgRef.current).transition().duration(180).call(zoomRef.current.transform, d3.zoomIdentity);

            if (layout) {
                const halfW = (layout.width * fit) / 2;
                const halfH = (layout.height * fit) / 2;
                boundsRef.current = {
                    x0: layout.cx - halfW + 12, x1: layout.cx + halfW - 12, y0: layout.cy - halfH + 12, y1: layout.cy + halfH - 12,
                    hubX: layout.cx, hubY: layout.cy, hubR: layout.hubR,
                };
                baseRef.current = Object.fromEntries(layout.nodes.map((n) => [n.key, { x: n.x, y: n.y, size: n.size }]));
            }
            /** Current position (ring position plus any user offset) and a label aimed away from the hub. */
            const placeOf = (node) => {
                const off = offsets[node.key];
                if (!off) return { x: node.x, y: node.y, label: node.label };
                const x = node.x + off.x;
                const y = node.y + off.y;
                const d = Math.hypot(x - layout.cx, y - layout.cy) || 1;
                return { x, y, label: labelFor((x - layout.cx) / d, (y - layout.cy) / d, node.size, layout.radial) };
            };
            const nudgeKeys = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };

            const selectedKey = selectedDx ? normDx(selectedDx) : null;
            const readKey = hover || selectedKey;
            const readNode = readKey ? nodes.find((n) => n.key === readKey) : null;

            return (
                <div>
                    {/* Full name of the highlighted or selected diagnosis, in page pixels so it never shrinks with the graph. */}
                    <div className="dpn-readout" data-testid="network-readout">
                        {readNode ? (
                            <>
                                <span className="dpn-kicker">{readNode.key === selectedKey ? 'Selected' : 'Highlighted'}</span>
                                <span className="dpn-readout__name" data-readout-name>{readNode.name}</span>
                                <span className="dpn-readout__meta">
                                    {readNode.shared > 0
                                        ? `Also listed in ${readNode.shared} other pattern${readNode.shared === 1 ? '' : 's'}`
                                        : 'Only listed here in this reference'}
                                </span>
                            </>
                        ) : (
                            <span className="dpn-readout__hint" data-readout-name>Select a diagnosis, or point at one, to see its full name here.</span>
                        )}
                    </div>
                    <div className="dpn-network" ref={wrapRef}>
                        {layout && (
                            <svg
                                ref={svgRef}
                                data-testid="dx-network"
                                viewBox={`${layout.cx - (layout.width * fit) / 2} ${layout.cy - (layout.height * fit) / 2} ${layout.width * fit} ${layout.height * fit}`}
                                height={layout.height}
                                role="group"
                                aria-label={`${finding.label}: ${nodes.length} diagnoses. Use Tab to move between diagnoses and Enter to open one.`}
                            >
                                <g ref={viewRef}>
                                    <g ref={graphRef} className={'dpn-graph' + (hover ? ' has-hover' : '')}>
                                        <circle className="dpn-orbit" cx={layout.cx} cy={layout.cy} r={layout.r} />
                                        {layout.nodes.map((node) => {
                                            const at = placeOf(node);
                                            return (
                                                <line
                                                    key={'e-' + node.key}
                                                    data-key={node.key}
                                                    className={'dpn-edge' + (node.key === selectedKey ? ' is-selected' : '') + (node.key === hover ? ' is-hover' : '')}
                                                    x1={layout.cx}
                                                    y1={layout.cy}
                                                    x2={at.x}
                                                    y2={at.y}
                                                />
                                            );
                                        })}
                                        <g className="dpn-hub" data-node="hub" transform={`translate(${layout.cx},${layout.cy})`}>
                                            <title>{finding.label}</title>
                                            <circle r={layout.hubR} />
                                            <text y={-2} fontSize={layout.hubR > 25 ? 18 : 15} dominantBaseline="middle">{nodes.length}</text>
                                            <text y={layout.hubR > 25 ? 13 : 11} fontSize="8" letterSpacing="1.2">DX</text>
                                        </g>
                                        {layout.nodes.map((node) => {
                                            const selected = node.key === selectedKey;
                                            const starred = favorites.has(node.key);
                                            const at = placeOf(node);
                                            const describe = node.shared > 0 ? `, also listed under ${node.shared} other pattern${node.shared === 1 ? '' : 's'}` : '';
                                            return (
                                                <g
                                                    key={'n-' + node.key}
                                                    className={'dpn-node' + (node.key === hover ? ' is-hover' : '')}
                                                    data-node="dx"
                                                    data-name={node.name}
                                                    data-key={node.key}
                                                    data-shared={node.shared > 0 ? 'true' : 'false'}
                                                    transform={`translate(${at.x},${at.y})`}
                                                    tabIndex={0}
                                                    role="button"
                                                    aria-pressed={selected ? 'true' : 'false'}
                                                    aria-label={`${node.name}${describe}${starred ? ', starred' : ''}`}
                                                    onClick={() => onSelectDx(node.name)}
                                                    onKeyDown={(e) => {
                                                        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onSelectDx(node.name); return; }
                                                        const dir = nudgeKeys[e.key];
                                                        if (dir && !e.altKey && !e.metaKey && !e.ctrlKey) {
                                                            // Keyboard equivalent of dragging: arrows nudge, Shift+arrows move further.
                                                            e.preventDefault();
                                                            const step = e.shiftKey ? 24 : 8;
                                                            moveTo(node.key, at.x + dir[0] * step, at.y + dir[1] * step);
                                                        }
                                                    }}
                                                    onMouseEnter={() => setHover(node.key)}
                                                    onMouseLeave={() => setHover(null)}
                                                    onFocus={() => setHover(node.key)}
                                                    onBlur={() => setHover(null)}
                                                >
                                                    <title>{node.name}</title>
                                                    <circle className="dpn-node__ring" r={node.size + 4} />
                                                    <circle r={node.hit} fill="transparent" />
                                                    <circle className="dpn-node__dot" r={node.size} />
                                                    {node.shared > 0 && node.size >= 8 && <text className="dpn-node__count">{node.shared > 9 ? '9+' : node.shared}</text>}
                                                    {starred && <circle className="dpn-node__star" cx={node.size * 0.75} cy={-node.size * 0.75} r={3.5} />}
                                                    <text
                                                        className="dpn-node__label"
                                                        x={at.label.x}
                                                        y={at.label.y}
                                                        textAnchor={at.label.anchor}
                                                        transform={at.label.rotate ? `rotate(${at.label.rotate})` : undefined}
                                                    >
                                                        {node.text}
                                                    </text>
                                                </g>
                                            );
                                        })}
                                    </g>
                                </g>
                            </svg>
                        )}
                        <div className="dpn-network__tools">
                            <button type="button" className="dpn-btn" onClick={() => zoomBy(1.3)} aria-label="Zoom in"><Icon name="plus" /></button>
                            <button type="button" className="dpn-btn" onClick={() => zoomBy(1 / 1.3)} aria-label="Zoom out"><Icon name="minus" /></button>
                            <button
                                type="button"
                                className="dpn-btn"
                                onClick={() => { zoomReset(); setOffsets({}); }}
                                aria-label="Reset view and node positions"
                                title="Reset view and node positions"
                            >
                                <Icon name="fit" />
                            </button>
                            {onToggleExpanded && (
                                <button
                                    type="button"
                                    className="dpn-btn"
                                    aria-pressed={expanded ? 'true' : 'false'}
                                    aria-label={expanded ? 'Exit expanded network (Esc)' : 'Expand network'}
                                    title={expanded ? 'Exit expanded network (Esc)' : 'Expand network'}
                                    onClick={onToggleExpanded}
                                >
                                    <Icon name={expanded ? 'collapse' : 'expand'} />{expanded ? 'Collapse' : 'Expand'}
                                </button>
                            )}
                        </div>
                    </div>
                    <ul className="dpn-legend" aria-label="Legend">
                        <li><svg viewBox="-9 -9 18 18"><circle r="5.5" fill="var(--cl-surface)" stroke="var(--cl-ink)" strokeWidth="1.25" /></svg>Unique to this pattern</li>
                        <li><svg viewBox="-9 -9 18 18"><circle r="8.5" fill="var(--cl-surface-alt)" stroke="var(--cl-ink)" strokeWidth="1.25" /><text fontSize="9" textAnchor="middle" dominantBaseline="central" fontFamily="var(--font-mono)" fontWeight="700">3</text></svg>Listed under n other patterns</li>
                        <li><svg viewBox="-9 -9 18 18"><circle r="3.5" fill="var(--cl-terracotta)" /></svg>Starred</li>
                        <li>Drag a node to move it (mouse, pen or finger; arrow keys when focused) · drag the background to pan · Ctrl/⌘ + scroll to zoom</li>
                    </ul>
                </div>
            );
        };

        // ---------------------------------------------------- phone diagnosis strip

        /** Phone-only list of full diagnosis names under the network, kept in sync with graph selection. */
        const DxStrip = ({ finding, model, selectedDx, onSelectDx }) => {
            const listRef = useRef(null);
            const selectedKey = selectedDx ? normDx(selectedDx) : null;
            useEffect(() => {
                // Scroll only the strip (never the page) so a graph tap reveals the matching row.
                const box = listRef.current;
                const item = box && box.querySelector('[aria-pressed="true"]');
                if (!box || !item) return;
                const top = item.offsetTop - box.offsetTop;
                if (top < box.scrollTop || top + item.offsetHeight > box.scrollTop + box.clientHeight) {
                    box.scrollTop = Math.max(0, top - box.clientHeight / 3);
                }
            }, [selectedKey, finding.id]);
            return (
                <nav className="dpn-strip" aria-label="Diagnoses in this pattern" data-testid="dx-strip">
                    <p className="dpn-kicker">All {finding.diagnoses.length} diagnoses</p>
                    <ul ref={listRef}>
                        {finding.diagnoses.map((dx) => {
                            const key = normDx(dx.name);
                            const shared = alsoIn(model, finding.id, dx.name).length;
                            return (
                                <li key={key}>
                                    <button type="button" aria-pressed={key === selectedKey ? 'true' : 'false'} onClick={() => onSelectDx(dx.name)}>
                                        <span>{dx.name}</span>
                                        {shared > 0 && <span className="dpn-strip__n" aria-hidden="true">+{shared}</span>}
                                    </button>
                                </li>
                            );
                        })}
                    </ul>
                </nav>
            );
        };

        // ---------------------------------------------------------------- list

        const DiagnosisList = ({ finding, model, selectedDx, favorites, notes, onSelectDx, onToggleFavorite, onGoTo }) => {
            const selectedKey = selectedDx ? normDx(selectedDx) : null;
            return (
                <ol className="dpn-list" data-testid="dx-list">
                    {finding.diagnoses.map((dx, i) => {
                        const key = normDx(dx.name);
                        const others = alsoIn(model, finding.id, dx.name);
                        const starred = favorites.has(key);
                        return (
                            <li key={key}>
                                <article className="dpn-dx" aria-current={key === selectedKey ? 'true' : undefined}>
                                    <span className="dpn-dx__index">{String(i + 1).padStart(2, '0')}</span>
                                    <div>
                                        <h3>
                                            <button
                                                type="button"
                                                className="dpn-dx__select"
                                                aria-pressed={key === selectedKey ? 'true' : 'false'}
                                                onClick={() => onSelectDx(dx.name)}
                                            >
                                                {dx.name}
                                            </button>
                                        </h3>
                                        <p>{dx.keyFeatures || 'No key features recorded for this entry.'}</p>
                                        {notes[key] && <div className="dpn-note-inline"><strong>Note:</strong> {notes[key]}</div>}
                                        {others.length > 0 && (
                                            <div className="dpn-dx__meta">
                                                <span className="dpn-kicker" style={{ alignSelf: 'center' }}>Also under</span>
                                                {others.slice(0, 4).map((id) => {
                                                    const f = model.byId.get(id);
                                                    return (
                                                        <button type="button" className="dpn-chip" key={id} onClick={() => onGoTo(id, dx.name)}>
                                                            {f.label}{f.group !== 'Other' && <span className="dpn-chip__src">{f.group}</span>}
                                                        </button>
                                                    );
                                                })}
                                                {others.length > 4 && <span className="dpn-kicker" style={{ alignSelf: 'center' }}>+{others.length - 4} more</span>}
                                            </div>
                                        )}
                                    </div>
                                    <div className="dpn-dx__actions">
                                        <button
                                            type="button"
                                            className="dpn-btn dpn-btn--ghost dpn-btn--star"
                                            aria-pressed={starred ? 'true' : 'false'}
                                            aria-label={(starred ? 'Unstar ' : 'Star ') + dx.name}
                                            onClick={() => onToggleFavorite(dx.name)}
                                        >
                                            <Icon name="star" filled={starred} />
                                        </button>
                                    </div>
                                </article>
                            </li>
                        );
                    })}
                </ol>
            );
        };

        // ---------------------------------------------------------- flashcards

        const FlashcardDeck = ({ finding, model, revealed, onReveal }) => {
            const [index, setIndex] = useState(0);
            const [shown, setShown] = useState(false);
            const deckRef = useRef(null);
            const total = finding.diagnoses.length;
            const card = finding.diagnoses[Math.min(index, total - 1)];
            const others = alsoIn(model, finding.id, card.name);

            const go = useCallback((delta) => {
                setIndex((i) => Math.min(total - 1, Math.max(0, i + delta)));
                setShown(false);
            }, [total]);

            const reveal = useCallback(() => {
                if (!shown) onReveal(card.name);
                setShown(!shown);
            }, [shown, card.name, onReveal]);

            useEffect(() => {
                const onKey = (e) => {
                    if (isTypingTarget(document.activeElement) || e.metaKey || e.ctrlKey || e.altKey) return;
                    if (document.querySelector('.dpn-overlay')) return;
                    if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
                    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
                    else if (e.key === ' ' && document.activeElement?.tagName !== 'BUTTON' && (document.activeElement === document.body || deckRef.current?.contains(document.activeElement))) {
                        e.preventDefault();
                        reveal();
                    }
                };
                document.addEventListener('keydown', onKey);
                return () => document.removeEventListener('keydown', onKey);
            }, [go, reveal]);

            return (
                <div className="dpn-deck" data-testid="flashcards" ref={deckRef}>
                    <div className="dpn-deck__bar">
                        <span>{index + 1} / {total}</span>
                        <div className="dpn-progress" aria-hidden="true"><span style={{ width: `${((index + 1) / total) * 100}%` }} /></div>
                        <span>{revealed} revealed</span>
                    </div>
                    <div className="dpn-card" aria-live="polite">
                        <p className="dpn-kicker">Under “{finding.label}”</p>
                        <h3>{card.name}</h3>
                        {!shown && <p className="dpn-card__prompt">Recall the key histologic features, then reveal.</p>}
                        {shown && (
                            <div className="dpn-card__answer">
                                <p style={{ margin: 0 }}>{card.keyFeatures || 'No key features recorded for this entry.'}</p>
                                {others.length > 0 && (
                                    <p className="dpn-footnote">Also under: {others.map((id) => model.byId.get(id).label).join(' · ')}</p>
                                )}
                            </div>
                        )}
                    </div>
                    <div className="dpn-deck__controls">
                        <button type="button" className="dpn-btn" onClick={() => go(-1)} disabled={index === 0} aria-label="Previous card"><Icon name="left" />Previous</button>
                        <button type="button" className="dpn-btn dpn-btn--primary" onClick={reveal}><Icon name="eye" />{shown ? 'Hide answer' : 'Reveal answer'}</button>
                        <button type="button" className="dpn-btn" onClick={() => go(1)} disabled={index >= total - 1} aria-label="Next card">Next<Icon name="right" /></button>
                    </div>
                    <p className="dpn-deck__hint">← → to move · Space to reveal</p>
                </div>
            );
        };

        // ----------------------------------------------------------- inspector

        const DiagnosisDetail = ({ finding, model, dx, starred, note, onToggleFavorite, onSaveNote, onGoTo }) => {
            const [editing, setEditing] = useState(false);
            const [draft, setDraft] = useState(note || '');
            useEffect(() => { setEditing(false); setDraft(note || ''); }, [dx && dx.name, finding.id]);

            if (!dx) {
                return (
                    <section className="dpn-panel" data-testid="dx-detail-empty">
                        <p className="dpn-kicker">Diagnosis</p>
                        <p className="dpn-empty" style={{ marginTop: '0.5rem' }}>Select a diagnosis in the network or list to read its key features here.</p>
                    </section>
                );
            }
            const others = alsoIn(model, finding.id, dx.name);
            return (
                <section className="dpn-panel dpn-detail" data-testid="dx-detail" aria-live="polite">
                    <p className="dpn-kicker">Diagnosis · {finding.label}</p>
                    <h3>{dx.name}</h3>
                    <p className="dpn-detail__features">{dx.keyFeatures || 'No key features recorded for this entry.'}</p>

                    <div className="dpn-detail__actions">
                        <button
                            type="button"
                            className="dpn-btn dpn-btn--star"
                            aria-pressed={starred ? 'true' : 'false'}
                            onClick={() => onToggleFavorite(dx.name)}
                        >
                            <Icon name="star" filled={starred} />{starred ? 'Starred' : 'Star'}
                        </button>
                        {!editing && (
                            <button type="button" className="dpn-btn" onClick={() => setEditing(true)}>
                                <Icon name="note" />{note ? 'Edit note' : 'Add note'}
                            </button>
                        )}
                    </div>

                    {(editing || note) && (
                        <div className="dpn-detail__section dpn-note">
                            <p className="dpn-kicker">Your note</p>
                            {editing ? (
                                <>
                                    <textarea
                                        className="dpn-input"
                                        aria-label={`Note for ${dx.name}`}
                                        value={draft}
                                        autoFocus
                                        onChange={(e) => setDraft(e.target.value)}
                                    />
                                    <div className="dpn-note__row">
                                        <button type="button" className="dpn-btn dpn-btn--ghost" onClick={() => { setDraft(note || ''); setEditing(false); }}>Cancel</button>
                                        <button type="button" className="dpn-btn dpn-btn--primary" onClick={() => { onSaveNote(dx.name, draft); setEditing(false); }}>Save note</button>
                                    </div>
                                </>
                            ) : (
                                <p className="dpn-note__saved">{note}</p>
                            )}
                        </div>
                    )}

                    <div className="dpn-detail__section" data-testid="dx-also-in">
                        <p className="dpn-kicker">{others.length ? `Also listed under ${others.length} pattern${others.length === 1 ? '' : 's'}` : 'Listed only under this pattern'}</p>
                        {others.length > 0 && (
                            <div className="dpn-chiplist">
                                {others.map((id) => {
                                    const f = model.byId.get(id);
                                    return (
                                        <button type="button" className="dpn-chip" key={id} data-finding={id} onClick={() => onGoTo(id, dx.name)}>
                                            {f.label}{f.group !== 'Other' && <span className="dpn-chip__src">{f.group}</span>}
                                        </button>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </section>
            );
        };

        const Correlations = ({ finding, model, selectedDx, onSelectDx }) => {
            const shared = useMemo(() => finding.diagnoses
                .map((dx) => ({ name: dx.name, n: alsoIn(model, finding.id, dx.name).length }))
                .filter((d) => d.n > 0)
                .sort((a, b) => b.n - a.n || a.name.localeCompare(b.name)), [finding, model]);
            const selectedKey = selectedDx ? normDx(selectedDx) : null;
            return (
                <section className="dpn-panel" data-testid="correlations">
                    <div className="dpn-panel__head">
                        <h3 className="dpn-panel__title">Clinical Correlations</h3>
                        <span className="dpn-kicker">{shared.length} / {finding.diagnoses.length}</span>
                    </div>
                    {shared.length === 0 ? (
                        <p className="dpn-empty">No diagnosis in this differential is listed under another pattern in the reference.</p>
                    ) : (
                        <>
                            <p className="dpn-footnote" style={{ marginTop: 0, marginBottom: '0.5rem' }}>Diagnoses here that recur under other patterns — the overlaps worth separating on histology.</p>
                            <ul className="dpn-correlations">
                                {shared.map((d) => (
                                    <li key={d.name}>
                                        <button
                                            type="button"
                                            aria-current={normDx(d.name) === selectedKey ? 'true' : undefined}
                                            onClick={() => onSelectDx(d.name)}
                                        >
                                            <span>{d.name}</span>
                                            <span className="dpn-correlations__n">+{d.n} {d.n === 1 ? 'pattern' : 'patterns'}</span>
                                        </button>
                                    </li>
                                ))}
                            </ul>
                        </>
                    )}
                </section>
            );
        };

        const ReviewPanel = ({ finding, favorites, notes, revealedHere }) => (
            <section className="dpn-panel">
                <div className="dpn-panel__head">
                    <h3 className="dpn-panel__title">Your review</h3>
                </div>
                <dl className="dpn-review">
                    <div><dt>Diagnoses in this pattern</dt><dd>{finding.diagnoses.length}</dd></div>
                    <div><dt>Cards revealed here</dt><dd data-testid="review-revealed">{revealedHere} / {finding.diagnoses.length}</dd></div>
                    <div><dt>Starred (all patterns)</dt><dd data-testid="review-starred">{favorites.size}</dd></div>
                    <div><dt>Notes (all patterns)</dt><dd>{Object.keys(notes).length}</dd></div>
                </dl>
                <p className="dpn-footnote">Stars and notes are saved in this browser only.</p>
            </section>
        );

        // ------------------------------------------------------ command palette

        const CommandPalette = ({ model, onClose, onGoTo }) => {
            const [query, setQuery] = useState('');
            const [active, setActive] = useState(0);
            const inputRef = useRef(null);
            const listRef = useRef(null);

            const fuse = useMemo(() => {
                const items = [];
                model.findings.forEach((f) => {
                    items.push({ type: 'pattern', name: f.label, findingId: f.id, sub: f.source ? `${f.diagnoses.length} diagnoses · ${f.source}` : `${f.diagnoses.length} diagnoses` });
                    f.diagnoses.forEach((dx) => items.push({ type: 'diagnosis', name: dx.name, findingId: f.id, sub: `Under ${f.label}${f.group !== 'Other' ? ' (' + f.group + ')' : ''}`, features: dx.keyFeatures || '' }));
                });
                return new Fuse(items, {
                    includeScore: true,
                    ignoreLocation: true,
                    threshold: 0.32,
                    keys: [{ name: 'name', weight: 3 }, { name: 'features', weight: 1 }],
                });
            }, [model]);

            const results = useMemo(() => (query.trim() ? fuse.search(query.trim()).slice(0, 30).map((r) => r.item) : []), [fuse, query]);

            useEffect(() => { inputRef.current && inputRef.current.focus(); }, []);
            useEffect(() => { setActive(0); }, [query]);
            useEffect(() => {
                const el = listRef.current && listRef.current.querySelector('[aria-selected="true"]');
                if (el) el.scrollIntoView({ block: 'nearest' });
            }, [active]);

            const choose = (item) => {
                if (!item) return;
                onGoTo(item.findingId, item.type === 'diagnosis' ? item.name : null);
                onClose();
            };

            const onKeyDown = (e) => {
                if (e.key === 'Escape') { e.preventDefault(); onClose(); }
                else if (e.key === 'ArrowDown') { e.preventDefault(); setActive((a) => Math.min(results.length - 1, a + 1)); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); setActive((a) => Math.max(0, a - 1)); }
                else if (e.key === 'Enter') { e.preventDefault(); choose(results[active]); }
            };

            return (
                <div className="dpn-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className="dpn-palette" role="dialog" aria-modal="true" aria-label="Search the reference">
                        <div className="dpn-palette__field">
                            <Icon name="search" />
                            <input
                                ref={inputRef}
                                type="text"
                                role="combobox"
                                aria-expanded={results.length > 0 ? 'true' : 'false'}
                                aria-controls="dpn-palette-results"
                                aria-activedescendant={results.length ? `dpn-opt-${active}` : undefined}
                                aria-autocomplete="list"
                                placeholder="Search patterns, diagnoses, key features…"
                                value={query}
                                onChange={(e) => setQuery(e.target.value)}
                                onKeyDown={onKeyDown}
                            />
                            <kbd className="dpn-kbd">Esc</kbd>
                        </div>
                        <ul className="dpn-palette__results" id="dpn-palette-results" role="listbox" ref={listRef} aria-label="Results">
                            {results.map((item, i) => (
                                <li
                                    key={item.type + item.findingId + item.name}
                                    id={`dpn-opt-${i}`}
                                    role="option"
                                    aria-selected={i === active ? 'true' : 'false'}
                                    className="dpn-palette__option"
                                    onMouseMove={() => setActive(i)}
                                    onClick={() => choose(item)}
                                >
                                    <span className="dpn-palette__type">{item.type}</span>
                                    <span className="dpn-palette__name">{item.name}</span>
                                    <span className="dpn-palette__sub">{item.sub}</span>
                                </li>
                            ))}
                        </ul>
                        {!results.length && (
                            <p className="dpn-palette__empty">{query.trim() ? `Nothing in the reference matches “${query.trim()}”.` : 'Type a pattern (e.g. spongiosis), a diagnosis, or a feature (e.g. eyeliner).'}</p>
                        )}
                        <div className="dpn-palette__foot"><span>↑↓ move</span><span>↵ open</span><span>Esc close</span></div>
                    </div>
                </div>
            );
        };

        // ----------------------------------------------------------------- app

        const App = ({ model }) => {
            const initial = useMemo(() => {
                const fromHash = readHash();
                const finding = model.byId.get(fromHash.finding) || model.findings[0];
                const dx = fromHash.dx && finding.diagnoses.find((d) => normDx(d.name) === normDx(fromHash.dx));
                return { findingId: finding.id, dx: dx ? dx.name : null };
            }, [model]);
            const stored = useMemo(loadStore, []);

            const [findingId, setFindingId] = useState(initial.findingId);
            const [selectedDx, setSelectedDx] = useState(initial.dx);
            const [view, setView] = useState(DEFAULT_VIEW);
            const [paletteOpen, setPaletteOpen] = useState(false);
            const [favorites, setFavorites] = useState(() => new Set(stored.favorites));
            const [notes, setNotes] = useState(stored.notes);
            const [revealed, setRevealed] = useState(() => new Set());
            const [expandedPref, setExpandedPref] = useState(false);
            const compact = useMediaQuery('(max-width: 760px)');
            const expanded = expandedPref && view === 'network' && !compact;
            const detailsInStage = compact && view === 'network';

            const finding = model.byId.get(findingId) || model.findings[0];
            const dx = selectedDx ? finding.diagnoses.find((d) => normDx(d.name) === normDx(selectedDx)) || null : null;

            useEffect(() => { writeHash(finding.id, dx ? dx.name : null); }, [finding.id, dx && dx.name]);
            useEffect(() => { saveStore(favorites, notes); }, [favorites, notes]);

            const goTo = useCallback((id, dxName = null) => {
                const target = model.byId.get(id);
                if (!target) return;
                const match = dxName ? target.diagnoses.find((d) => normDx(d.name) === normDx(dxName)) : null;
                setFindingId(target.id);
                setSelectedDx(match ? match.name : null);
            }, [model]);

            useEffect(() => {
                const onHash = () => {
                    const h = readHash();
                    if (h.finding && model.byId.has(h.finding)) goTo(h.finding, h.dx);
                };
                const onKey = (e) => {
                    if (e.key === 'Escape' && !e.defaultPrevented && !document.querySelector('.dpn-overlay')) {
                        setExpandedPref(false);
                    } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                        e.preventDefault();
                        setPaletteOpen((o) => !o);
                    } else if (e.key === '/' && !isTypingTarget(document.activeElement)) {
                        e.preventDefault();
                        setPaletteOpen(true);
                    }
                };
                window.addEventListener('hashchange', onHash);
                document.addEventListener('keydown', onKey);
                return () => {
                    window.removeEventListener('hashchange', onHash);
                    document.removeEventListener('keydown', onKey);
                };
            }, [model, goTo]);

            const toggleFavorite = useCallback((name) => {
                setFavorites((prev) => {
                    const next = new Set(prev);
                    const key = normDx(name);
                    next.has(key) ? next.delete(key) : next.add(key);
                    return next;
                });
            }, []);

            const saveNote = useCallback((name, text) => {
                setNotes((prev) => {
                    const next = { ...prev };
                    const key = normDx(name);
                    if (text && text.trim()) next[key] = text.trim(); else delete next[key];
                    return next;
                });
            }, []);

            const markRevealed = useCallback((name) => {
                setRevealed((prev) => new Set(prev).add(finding.id + '::' + normDx(name)));
            }, [finding.id]);

            const revealedHere = finding.diagnoses.filter((d) => revealed.has(finding.id + '::' + normDx(d.name))).length;
            const citation = [finding.source, ...finding.citations].filter(Boolean);
            const detailPanel = (
                <DiagnosisDetail
                    finding={finding}
                    model={model}
                    dx={dx}
                    starred={dx ? favorites.has(normDx(dx.name)) : false}
                    note={dx ? notes[normDx(dx.name)] || '' : ''}
                    onToggleFavorite={toggleFavorite}
                    onSaveNote={saveNote}
                    onGoTo={goTo}
                />
            );

            return (
                <div className="dpn-app">
                    <Masthead model={model} onSearch={() => setPaletteOpen(true)} />
                    {paletteOpen && <CommandPalette model={model} onClose={() => setPaletteOpen(false)} onGoTo={goTo} />}

                    <div className={'dpn-layout' + (expanded ? ' is-expanded' : '')}>
                        {!expanded && (
                            <aside className="dpn-sidebar">
                                <FindingBrowser model={model} activeId={finding.id} onSelect={(id) => goTo(id)} />
                            </aside>
                        )}

                        <main className="dpn-main">
                            <section className="dpn-stage" aria-labelledby="dpn-finding-title">
                                <div className="dpn-stage__head">
                                    <div className="dpn-stage__title">
                                        <p className="dpn-kicker">Pattern · {finding.diagnoses.length} diagnoses in the differential</p>
                                        <h2 id="dpn-finding-title" data-testid="finding-title">{finding.label}</h2>
                                        {citation.length > 0 && <p className="dpn-stage__cite">{[...new Set(citation)].join(' · ')}</p>}
                                    </div>
                                    <div className="dpn-segmented" role="group" aria-label="View">
                                        {VIEWS.map((v) => (
                                            <button key={v.id} type="button" data-view={v.id} aria-pressed={view === v.id ? 'true' : 'false'} onClick={() => setView(v.id)}>
                                                <Icon name={v.icon} />{v.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="dpn-stage__body">
                                    {view === 'network' && (
                                        <>
                                            <NetworkGraph
                                                finding={finding}
                                                model={model}
                                                selectedDx={dx ? dx.name : null}
                                                favorites={favorites}
                                                onSelectDx={setSelectedDx}
                                                expanded={expanded}
                                                onToggleExpanded={compact ? null : () => setExpandedPref((v) => !v)}
                                            />
                                            {detailsInStage && (
                                                <div className="dpn-stage__details">
                                                    <DxStrip finding={finding} model={model} selectedDx={dx ? dx.name : null} onSelectDx={setSelectedDx} />
                                                    {detailPanel}
                                                </div>
                                            )}
                                        </>
                                    )}
                                    {view === 'list' && (
                                        <DiagnosisList
                                            finding={finding}
                                            model={model}
                                            selectedDx={dx ? dx.name : null}
                                            favorites={favorites}
                                            notes={notes}
                                            onSelectDx={setSelectedDx}
                                            onToggleFavorite={toggleFavorite}
                                            onGoTo={goTo}
                                        />
                                    )}
                                    {view === 'flashcards' && (
                                        <FlashcardDeck key={finding.id} finding={finding} model={model} revealed={revealedHere} onReveal={markRevealed} />
                                    )}
                                </div>
                            </section>
                        </main>

                        <aside className={'dpn-inspector' + (expanded ? ' dpn-inspector--drawer' : '')} aria-label="Details">
                            {!detailsInStage && detailPanel}
                            {!expanded && (
                                <>
                                    <Correlations finding={finding} model={model} selectedDx={dx ? dx.name : null} onSelectDx={setSelectedDx} />
                                    <ReviewPanel finding={finding} favorites={favorites} notes={notes} revealedHere={revealedHere} />
                                </>
                            )}
                        </aside>
                    </div>
                </div>
            );
        };

        const Boot = () => {
            const [data, setData] = useState(() => window.dermDifferentialData || null);
            useEffect(() => {
                if (data) return undefined;
                const onLoaded = () => setData(window.dermDifferentialData || []);
                window.addEventListener('dermDataLoaded', onLoaded);
                if (window.dermDifferentialData) onLoaded();
                return () => window.removeEventListener('dermDataLoaded', onLoaded);
            }, [data]);
            const model = useMemo(() => (data ? buildModel(data) : null), [data]);

            if (!model) return <p className="dpn-loading">Loading reference…</p>;
            if (!model.findings.length) {
                return <p className="dpn-loading" role="alert">The reference data could not be loaded. Use Reload to try again.</p>;
            }
            return <App model={model} />;
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<Boot />);
    </script>
    <script>
        if (window.LegacyGuidance?.maybeShow) {
            window.LegacyGuidance.maybeShow('dermatopathology-modern-fixed', [
                'The network view opens first: the hub is the pattern and each node is a diagnosis in its differential.',
                'Select a node to read its key features and jump to other patterns that list the same diagnosis.',
                'Press Ctrl/⌘ K to search; use Reload to reload the page if it looks stuck. Stars and notes are not deleted.'
            ]);
        }
    </script>
</body>
</html>
