ons:"Myelosuppression, hepatotoxicity, pancreatitis, infection and malignancy risk.",notes:"Pregnancy-compatible in many rheumatic-disease contexts when clinically needed; metabolite interactions matter.",regulatoryStatus:"Mixed: US-labeled for renal transplantation and rheumatoid arthritis; mapped Behçet and other rheum–derm uses are off-label.",source:"Current DailyMed Imuran label",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=606101a0-6244-7eff-e053-2a91aa0acadd",sources:[{label:"Current DailyMed Imuran label",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=606101a0-6244-7eff-e053-2a91aa0acadd"},{label:"ACR reproductive-health guideline",url:"https://rheumatology.org/reproductive-health-rheumatic-diseases-guideline"}],tags:["immunosuppressant","antimetabolite"]},{id:"cyclosporine",name:"Cyclosporine",className:"Calcineurin inhibitor",routes:"PO",dosing:"Labeled severe-plaque-psoriasis dosing (Neoral): start 2.5 mg/kg/day in two divided doses; if needed, increase by about 0.5 mg/kg/day at 2-week intervals to a maximum of 4 mg/kg/day. Off-label pyoderma-gangrenosum trial regimen: 4 mg/kg/day. Use the lowest effective dose and limit duration because of cumulative renal and blood-pressure toxicity.",monitoring:"Two baseline BP readings, creatinine/eGFR, electrolytes, lipids, uric acid; frequent BP and renal monitoring during titration.",avoid:"Uncontrolled hypertension, abnormal renal function, malignancy; product- and indication-specific restrictions apply.",cautions:"Nephrotoxicity, hypertension, hyperkalemia, dyslipidemia and extensive CYP3A/P-gp interactions.",notes:"Rapid onset can be valuable in severe psoriasis or pyoderma gangrenosum, but cumulative renal toxicity limits long-term use.",regulatoryStatus:"Mixed: US-labeled for severe plaque psoriasis; pyoderma gangrenosum use is off-label.",source:"Current DailyMed Neoral label",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=94461af3-11f1-4670-95d4-2965b9538ae3",sources:[{label:"Current DailyMed Neoral label",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=94461af3-11f1-4670-95d4-2965b9538ae3"},{label:"STOP GAP pyoderma-gangrenosum trial",url:"https://www.bmj.com/content/350/bmj.h2958"}],tags:["immunosuppressant","calcineurin"]},{id:"ivig",name:"Intravenous immunoglobulin",className:"Pooled immunoglobulin",routes:"IV",dosing:"Dermatomyositis regimen with trial/label precedent: 2 g/kg per cycle divided over 2–5 days, commonly every 4 weeks; product and indication matter.",monitoring:"Renal function, volume status, thrombosis risk, hemolysis; IgA deficiency history; infusion reactions.",avoid:"Product-specific contraindications, including some patients with IgA deficiency and anti-IgA antibodies.",cautions:"Thrombosis, renal injury (product/excipient dependent), hemolysis, aseptic meningitis, fluid load.",notes:"Can be attractive when rapid effect is needed or infection risk makes additional broad immunosuppression undesirable.",regulatoryStatus:"Octagam 10% is US-labeled for adult dermatomyositis; other products and uses are indication-specific.",source:"Current DailyMed Octagam 10% label",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/fda/fdaDrugXsl.cfm?setid=eb4c342b-122c-0072-1428-1747882e6c00&type=display",sources:[{label:"Current DailyMed Octagam 10% label",url:"https://dailymed.nlm.nih.gov/dailymed/fda/fdaDrugXsl.cfm?setid=eb4c342b-122c-0072-1428-1747882e6c00&type=display"},{label:"ProDERM primary trial",url:"https://www.nejm.org/doi/full/10.1056/NEJMoa2117912"}],tags:["immunomodulator","infusion"]},{id:"cyclophosphamide",name:"Cyclophosphamide",className:"Alkylating agent",routes:"IV or PO",dosing:"Labeled dosing is indication-specific and does not include AAV or SSc-ILD. Off-label AAV/SSc-ILD induction uses protocol-specific IV-pulse or daily-oral regimens with age, renal-function, leukocyte and cumulative-exposure adjustments; follow the disease protocol rather than this summary.",monitorin ral B-cell depletion.",regulatoryStatus:"Mixed: US-labeled for GPA/MPA and RA; dermatomyositis, SSc and refractory CTD skin use is off-label.",source:"Current DailyMed Truxima label",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=9af3ddc7-4217-417a-ac89-8704edc5bc44",sources:[{label:"Current DailyMed Truxima label",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=9af3ddc7-4217-417a-ac89-8704edc5bc44"},{label:"EULAR AAV recommendations",url:"https://ard.bmj.com/content/83/1/30"},{label:"BSR idiopathic-inflammatory-myopathy guideline",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC9398208/"},{label:"EULAR systemic-sclerosis recommendations",url:"https://ard.bmj.com/content/early/2024/10/17/ard-2024-226430"}],tags:["biologic","b-cell"]},{id:"belimumab",name:"Belimumab",className:"BAFF/BLyS inhibitor",routes:"IV or SC",dosing:"SLE: 10 mg/kg IV on days 0, 14, 28 then every 28 days, or 200 mg SC weekly in adults.",monitoring:"Infection, hypersensitivity, mood/suicidality; assess response over months.",avoid:"Prior anaphylaxis to belimumab.",cautions:"Severe active infection; depression/suicidality; live vaccines.",notes:"FDA-labeled for active SLE and active lupus nephritis in patients receiving standard therapy. Pivotal SLE trials enrolled autoantibody-positive patients; do not rewrite that trial criterion as the current US indication. Cutaneous benefit is considered within systemic SLE management.",regulatoryStatus:"US-labeled for active SLE and active lupus nephritis in patients receiving standard therapy.",source:"Current DailyMed Benlysta label",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=2fa3c528-1777-4628-8a55-a69dae2381a3",sources:[{label:"Current DailyMed Benlysta label",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=2fa3c528-1777-4628-8a55-a69dae2381a3"},{label:"EULAR SLE recommendations",url:"https://ard.bmj.com/content/83/1/15"}],tags:["biologic","b-cell","lupus"]},{id:"anifrolumab",name:"Anifrolumab",className:"Type I interferon receptor antagonist",routes:"IV or SC",dosing:"Adult moderate-to-severe SLE receiving standard therapy: 300 mg IV over 30 minutes every 4 weeks, or 120 mg SC once weekly. The label does not recommend use for severe active lupus nephritis or severe active CNS lupus because efficacy has not been evaluated.",monitoring:"Infection, especially herpes zoster and respiratory infections; administration-related/hypersensitivity reactions.",avoid:"History of anaphylaxis to anifrolumab-fnia.",cautions:"Severe active infection; live vaccines; concomitant biologics not studied/recommended.",notes:"Often considered when cutaneous disease is prominent in systemic SLE, while matching use to the approved population and current formulation.",regulatoryStatus:"US-labeled for adults with moderate-to-severe SLE receiving standard therapy.",source:"Current DailyMed Saphnelo label",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=d6203302-2128-41a7-b0b4-0e6c0704d4dc",sources:[{label:"Current DailyMed Saphnelo label",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=d6203302-2128-41a7-b0b4-0e6c0704d4dc"}],tags:["biologic","interferon","lupus"]},{id:"dapsone",name:"Dapsone",className:"Sulfone / neutrophil-modulating agent",routes:"PO",dosing:"Labeled oral uses include dermatitis herpetiformis (commonly start 50 mg/day, then individualize) and leprosy regimens. Off-label rheum–derm use: often 25–50 mg/day initially, titrated commonly to 50–150 mg/day by phenotype, response and hematologic tolerance.",monitoring:"Check G6PD before treatment; obtain baseline CBC/differential and liver tests, then frequent CBC monitoring early in therapy and periodically thereafter; check methemoglobin when symptomatic.",avoid:"Prior severe dapsone hypersensitivity; inability to monitor serious hematologic toxicity.",cautions:"G6PD deficiency, anemia, cardiopulmonary disease; hemolysis and methemoglobinemia can occur even with normal G6PD.",notes:"Best fit for neutrophil-predominant disease. Dapsone hypersensitivity syndrome is a medical emergency.",regulatoryStatus:"US-labeled for dermatitis herpetiformis and leprosy; CLE and neutrophilic-dermatosis uses are off-label.",source:"Current DailyMed dapsone label",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=839d7440-ba0e-4c56-b648-d374b155cf03",sources:[{label:"Current DailyMed dapsone label",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=839d7440-ba0e-4c56-b648-d374b155cf03"},{label:"International CLE guideline",url:"https://pubmed.ncbi.nlm.nih.gov/34364171/"}],tags:["neutrophil","antimicrobial"]},{id:"colchicine",name:"Colchicine",className:"Microtubule inhibitor / neutrophil modulator",routes:"PO",dosing:"Common inflammatory-dermatology use 0.6 mg once or twice daily; adjust for renal/hepatic function and interactions.",monitoring:"CBC, renal/hepatic function; neuromuscular toxicity when clinically indicated.",avoid:"Renal or hepatic impairment combined with strong CYP3A4 or P-gp inhibitors.",cautions:"GI toxicity, cytopenias, myopathy/neuropathy; major interaction with clarithromycin and some azoles/calcineurin inhibitors.",notes:"Useful for selected neutrophilic and vasculitic phenotypes; the interaction check is as important as the dose.",regulatoryStatus:"US-labeled for gout and familial Mediterranean fever; Behçet and dermatologic uses are off-label.",source:"Current DailyMed colchicine label",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=72984aa2-6df9-4460-9926-399ffed30e36",sources:[{label:"Current DailyMed colchicine label",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=72984aa2-6df9-4460-9926-399ffed30e36"},{label:"EULAR Behçet recommendations",url:"https://ard.bmj.com/content/77/6/808"}],tags:["neutrophil","anti-inflammatory"]},{id:"nintedanib",name:"Nintedanib",className:"Tyrosine kinase inhibitor / antifibrotic",routes:"PO",dosing:"150 mg twice daily with food; 100 mg twice daily may be used for adverse effects or selected hepatic impairment.",monitoring:"Liver tests before treatment and early during therapy; diarrhea, bleeding and thrombotic risk.",avoid:"No labeled absolute contraindication; avoid in pregnancy because of embryo-fetal toxicity.",cautions:"Hepatic impairment, anticoagulation/bleeding risk, arterial thrombosis, GI perforation.",notes:"Slows FVC decline in systemic-sclerosis-associated ILD; it is not primarily a skin-softening drug.",regulatoryStatus:"US-labeled to slow pulmonary-function decline in systemic-sclerosis-associated ILD.",source:"Current DailyMed Ofev label",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=da1c9f37-779e-4682-816f-93d0faa4cfc9",sources:[{label:"Current DailyMed Ofev label",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=da1c9f37-779e-4682-816f-93d0faa4cfc9"}],tags:["antifibrotic","ild"]},{id:"tocilizumab",name:"Tocilizumab",className:"IL-6 receptor inhibitor",routes:"SC or IV",dosing:"For systemic-sclerosis-associated ILD: 162 mg SC weekly. Other indications have weight/route-specific regimens.",monitoring:"CBC, liver tests, lipids, TB and infection screening; GI symptoms.",avoid:"Labeled contraindication: known hypersensitivity to tocilizumab. Do not administer during an active infection, including localized infection; interrupt treatment if a serious infection develops.",cautions:"Neutropenia, transaminitis, dyslipidemia, GI perforation, CYP normalization affecting co-medications.",notes:"Approved to slow decline in pulmonary function in adults with SSc-ILD; skin effects are not the labeled endpoint.",regulatoryStatus:"US-labeled to slow pulmonary-function decline in adults with SSc-ILD; SSc skin positioning is off-label.",source:"Current DailyMed Actemra label",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=2e5365ff-cb2a-4b16-b2c7-e35c6bf2de13",sources:[{label:"Current DailyMed Actemra label",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=2e5365ff-cb2a-4b16-b2c7-e35c6bf2de13"}],tags:["biologic","il-6","ild"]},{id:"nifedipine",name:"Nifedipine ER",className:"Dihydropyridine calcium-channel blocker",routes:"PO",dosing:"Labeled ER dosing is for hypertension/angina. Off-label Raynaud practice commonly starts nifedipine ER 30 mg once daily and titrates to response and blood pressure within formulation-specific limits.",monitoring:"BP, edema, headache, dizziness.",avoid:"Labeled contraindication (selected current ER label): known hypersensitivity to nifedipine. Avoid clinically significant hypotension; use particular caution with severe aortic stenosis.",cautions:"Hypotension, edema, severe aortic stenosis; CYP3A4 interactions.",notes:"A common first oral vasodilator for Raynaud phenomenon; use extended-release formulations for tolerability.",regulatoryStatus:"US-labeled for hypertension and angina; Raynaud use is off-label.",source:"Current DailyMed Procardia XL label",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=8ebcb33c-f43b-4b36-9f94-9774b2a59e06",sources:[{label:"Current DailyMed Procardia XL label",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=8ebcb33c-f43b-4b36-9f94-9774b2a59e06"},{label:"EULAR systemic-sclerosis recommendations",url:"https://ard.bmj.com/content/early/2024/10/17/ard-2024-226430"}],tags:["vascular","ccb"]},{id:"sildenafil",name:"Sildenafil",className:"PDE-5 inhibitor",routes:"PO",dosing:"Raynaud/digital ischemia use is off-label and protocol-dependent; commonly 20 mg two or three times daily. PAH labeling differs.",monitoring:"BP, headache, visual symptoms; drug interactions.",avoid:"Nitrates; riociguat; hypersensitivity.",cautions:"Hypotension, alpha-blockers, strong CYP3A inhibitors, retinitis pigmentosa; priapism.",notes:"Consider when CCB response is inadequate, especially with digital ischemia. Never combine with nitrates.",regulatoryStatus:"US-labeled for pulmonary arterial hypertension; Raynaud and digital-isch tis"]},{id:"baricitinib",name:"Baricitinib",className:"JAK1/2 inhibitor",routes:"PO",dosing:"Labeled RA: 2 mg once daily. Severe alopecia areata: 2 mg once daily; increase to 4 mg if inadequate, consider 4 mg initially for near-complete/complete scalp loss, then reduce to 2 mg after adequate response. Off-label trials: LE panniculitis 4 mg daily for 20 weeks; DM 4 mg daily for 24 weeks.",monitoring:"TB/hepatitis, CBC, liver tests, lipids, renal function, infection/zoster, and CV/VTE/malignancy risk. Do not initiate RA/AA use with ALC <500, ANC <1,000 or hemoglobin <8 g/dL.",avoid:"No labeled absolute contraindications. Do not combine with another JAK inhibitor, biologic immunomodulator, cyclosporine or potent immunosuppressant.",cautions:"Active serious infection, eGFR <30 for RA/AA, severe hepatic impairment, cytopenias, CV/VTE/malignancy risk, pregnancy and live vaccines.",notes:"CLE/DM placement is Emerging/off-label; SLE evidence is inconsistent and VEXAS evidence does not justify peer status with ruxolitinib.",regulatoryStatus:"US-approved for RA after TNF failure, severe alopecia areata and selected hospitalized COVID-19; not approved for CLE, DM, VEXAS, psoriasis or PsA.",source:"DailyMed — OLUMIANT",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=866e9f35-9035-4581-a4b1-75a621ab55cf",sources:[{label:"Current DailyMed OLUMIANT label",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=866e9f35-9035-4581-a4b1-75a621ab55cf"},{label:"LE panniculitis pilot",url:"https://pubmed.ncbi.nlm.nih.gov/39031307/"},{label:"DM trial NCT04972760",url:"https://clinicaltrials.gov/study/NCT04972760"}],tags:["jak","targeted synthetic","lupus","dermatomyositis"]},{id:"deucravacitinib",name:"Deucravacitinib",className:"TYK2 inhibitor",routes:"PO",dosing:"6 mg once daily with or without food for plaque psoriasis or PsA; swallow whole. No renal adjustment. Not recommended in severe hepatic impairment (Child-Pugh C); no adjustment for Child-Pugh A/B.",monitoring:"TB; infection; vaccines; periodic triglycerides; CPK for muscle symptoms; liver enzymes at baseline/during treatment if liver disease is known or suspected; malignancy surveillance by risk.",avoid:"History of hypersensitivity to deucravacitinib or excipients. Not recommended with other potent immunosuppressants.",cautions:"Active/serious infection, untreated latent TB, malignancy risk, liver disease, myopathy and live vaccines.",notes:"Oral non-titrated cross-domain option. Avoid another JAK/TYK2 inhibitor or biologic; long-term comparative PsA placement is still maturing.",regulatoryStatus:"US-approved for adult moderate-to-severe plaque psoriasis and, since March 2026, active PsA.",source:"DailyMed — SOTYKTU",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=ff4d7258-5068-4cdf-9692-8cae04c3198e",sources:[{label:"Current DailyMed SOTYKTU label",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=ff4d7258-5068-4cdf-9692-8cae04c3198e"},{label:"POETYK PsA-1 NCT04908202",url:"https://clinicaltrials.gov/study/NCT04908202"},{label:"POETYK PsA-2 NCT04908189",url:"https://clinicaltrials.gov/study/NCT04908189"},u],tags:["jak","tyk2","targeted synthetic","psoriasis","psa"]},{id:"ruxolitinib-oral",name:"Ruxolitinib (oral)",className:"JAK1/2 inhibitor",routes:"PO",dosing:"No approved/standardized VEXAS dose. Observational regimens commonly start 5–10 mg twice daily with reported escalation to 20 mg twice daily; many reviewed cases used 10–20 mg twice daily. Labeled reference regimens include cGVHD 10 mg BID and acute GVHD 5 mg BID, with platelet/renal/hepatic/CYP3A modification.",monitoring:"CBC before treatment and every 2–4 weeks until stable; infection/TB/HBV/zoster history; lipids at 8–12 weeks; renal/hepatic function; skin examination; VTE/MACE and malignancy risk.",avoid:"No labeled absolute contraindications. Avoid unstructured combination with another JAK inhibitor, biologic or potent immunosuppressant.",cautions:"Anemia, thrombocytopenia or neutropenia; active serious infection; strong CYP3A4 inhibitors/fluconazole; abrupt interruption syndrome; pregnancy/lactation.",notes:"Strongest JAK-class observational signal in VEXAS but still nonrandomized and hematologically hazardous; hematology co-management is required. Do not generalize from topical ruxolitinib.",regulatoryStatus:"Oral ruxolitinib is US-approved for myelofibrosis, polycythemia vera and acute/chronic GVHD; VEXAS use is off-label.",source:"DailyMed — JAKAFI/JAKAFI XR",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=f1c82580-87ae-11e0-bc84-0002a5d5c51b",sources:[{label:"Current DailyMed JAKAFI/JAKAFI XR label",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=f1c82580-87ae-11e0-bc84-0002a5d5c51b"},{label:"Primary VEXAS multicenter study",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC9412002/"},{label:"VEXAS JAK-inhibitor systematic review",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC12449113/"}],tags:["jak","targeted synthetic","vexas","hematologic"]},{id:"anakinra",name:"Anakinra",className:"IL-1 receptor antagonist",routes:"SC",dosing:"RA: 100 mg daily. NOMID/CAPS and DIRA: start 1–2 mg/kg daily; increase by 0.5–1 mg/kg increments to a maximum 8 mg/kg/day and may split BID. If CrCl <30 mL/min or ESRD, consider every-other-day dosing. AOSD commonly 100 mg daily; severe/impending MAS may use 100 mg BID in expert care (off-label).",monitoring:"CBC/ANC before treatment, monthly for 3 months, then quarterly through 1 year; renal function; infection/TB risk; injection reactions; inflammatory markers and organ damage.",avoid:"Hypersensitivity to E. coli-derived proteins, anakinra or components. Do not combine with TNF inhibitors, another IL-1 blocker, other biologics or JAK/TYK2 inhibitors.",cautions:"Active serious infection, neutropenia, severe renal impairment and live vaccines.",notes:"Short half-life and IL-1α/β receptor blockade favor rapid reversibility and severe CAPS/CNS disease.",regulatoryStatus:"US-approved for active RA, NOMID/CAPS and DIRA; AOSD, Schnitzler syndrome, neutrophilic disease and VEXAS uses are off-label in the US.",source:"DailyMed — KINERET",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=d9d74915-6606-4570-9c52-c4001d3177de",sources:[{label:"Current DailyMed KINERET label",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=d9d74915-6606-4570-9c52-c4001d3177de"},d,{label:"2024 EULAR/PReS Still-disease recommendations",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC11672000/"}],tags:["biologic","il-1","autoinflammatory"]},{id:"canakinumab",name:"Canakinumab",className:"IL-1β inhibitor",routes:"SC",dosing:"CAPS if >40 kg: 150 mg every 8 weeks. TRAPS/HIDS-MKD/FMF if >40 kg: 150 mg every 4 weeks; increase to 300 mg every 4 weeks if inadequate. Still disease: 4 mg/kg (maximum 300 mg) every 4 weeks. Gout flare: 150 mg once, with ≥12 weeks before retreatment.",monitoring:"Infection/TB risk; CBC/LFTs as indicated; hypersensitivity/DRESS; inflammatory markers and organ damage; MAS vigilance in Still disease; vaccines.",avoid:"Confirmed hypersensitivity to canakinumab or excipients. Do not combine with TNF inhibitors, another IL-1 blocker, other biologics or JAK/TYK2 inhibitors.",cautions:"Active infection requiring intervention, recurrent/opportunistic infection, latent TB and live vaccines.",notes:"Long interval supports adherence and has label-supported use across multiple periodic-fever syndromes.",regulatoryStatus:"US-approved for CAPS, TRAPS, HIDS/MKD, FMF, active Still disease and selected gout flares.",source:"DailyMed — ILARIS",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=7d271f3b-e4f9-4d80-8dcf-28d49123f80e",sources:[{label:"Current DailyMed ILARIS label",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=7d271f3b-e4f9-4d80-8dcf-28d49123f80e"},d,{label:"2024 EULAR/PReS Still-disease recommendations",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC11672000/"}],tags:["biologic","il-1","autoinflammatory","still"]},{id:"rilonacept",name:"Rilonacept",className:"IL-1 trap",routes:"SC",dosing:"CAPS or recurrent pericarditis: 320 mg loading dose as two 160-mg injections at separate sites, then 160 mg weekly. Adult DIRA: 320 mg once weekly as two 160-mg injections; do not dose more often than weekly. When switching IL-1 blockers, start when the next dose would be due.",monitoring:"Infection/TB risk; lipid profile; vaccines; injection reactions; inflammatory markers and disease-specific organ assessment.",avoid:"No labeled absolute contraindications. Do not combine with another IL-1 blocker, TNF inhibitor, other biologic or JAK/TYK2 inhibitor.",cautions:"Active/chronic infection, latent TB risk, hyperlipidemia and live vaccines.",notes:"Weekly IL-1 trap with label-supported CAPS, DIRA and recurrent-pericarditis utility.",regulatoryStatus:"US-approved for CAPS (FCAS/Muckle–Wells), DIRA and recurrent pericarditis in adults and patients ≥12 years.",source:"DailyMed — ARCALYST",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=ad965f38-dd22-4607-a673-2fb92f3b527a",sources:[{label:"Current DailyMed ARCALYST label",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=ad965f38-dd22-4607-a673-2fb92f3b527a"},d,{label:"RHAPSODY NCT03737110",url:"https://clinicaltrials.gov/study/NCT03737110"}],tags:["biologic","il-1","autoinflammatory","pericarditis"]},{id:"acitretin",name:"Acitretin",className:"Systemic retinoid",routes:"PO",dosing:"Psoriasis: start 25–50 mg once daily with the main meal; maintenance 25–50 mg once daily, individualized. Reduce phototherapy dose when combined. Historical CLE trial: 50 mg daily for 8 weeks (off-label trial regimen).",monitoring:"Pregnancy testing/contraception per label through 3 years after stopping; fasting lipids and LFTs; glucose in diabetes; bone, mood, visual and neurologic symptoms.",avoid:"Pregnancy; severe hepatic/renal impairment; chronic hyperlipidemia; concomitant methotrexate or tetracyclines; retinoid hypersensitivity.",cautions:"Avoid ethanol during and for 2 months after therapy in patients who can become pregnant; hepatotoxicity, pancreatitis, pseudotumor cerebri, skeletal effects; no blood donation for 3 years after treatment.",notes:"Non-immunosuppressive skin-only option for severe plaque/pustular/palmoplantar phenotypes; no joint benefit. Avoid vitamin A and other systemic retinoids.",regulatoryStatus:"US-approved for severe adult psoriasis; CLE use is off-label.",source:"DailyMed — acitretin",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=a6546625-acb8-460e-b34e-f795bfb3680a",sources:[{label:"Current DailyMed acitretin label",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=a6546625-acb8-460e-b34e-f795bfb3680a"},c,{label:"2021 international CLE guideline",url:"https://pubmed.ncbi.nlm.nih.gov/34364171/"}],tags:["retinoid","psoriasis"]},{id:"isotretinoin",name:"Isotretinoin (ABSORICA/ABSORICA LD)",className:"Systemic retinoid",routes:"PO",dosing:"ABSORICA: 0.5–1 mg/kg/day in two divided doses for 15–20 weeks; very severe acne up to 2 mg/kg/day. ABSORICA LD: 0.4–0.8 mg/kg/day divided for 15–20 weeks; very severe acne up to 1.6 mg/kg/day. Formulations are not substitutable. Refractory CLE reports generally use 0.5–1 mg/kg/day (off-label; no validated CLE course/cumulative target).",monitoring:"iPLEDGE pregnancy testing/contraception; fasting lipids and LFTs; psychiatric, pancreatitis, hearing/vision, musculoskeletal and intracranial-hypertension symptoms.",avoid:"Pregnancy and hypersensitivity to isotretinoin, vitamin A or components.",cautions:"Tetracyclines, vitamin A/other retinoids, uncontrolled hypertriglyceridemia, hepatic disease, psychiatric history, IBD symptoms and bone disease.",notes:"Reserve for selected hyperkeratotic/refractory CLE; relapse is common. Do not combine with acitretin, vitamin A or tetracyclines.",regulatoryStatus:"US-approved for severe recalcitrant nodular acne; all CLE use is off-label.",source:"DailyMed — ABSORICA/ABSORICA LD",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=3ef0cff8-19c1-4441-b780-fca6c7ee1615",sources:[{label:"Current DailyMed ABSORICA/ABSORICA LD label",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=3ef0cff8-19c1-4441-b780-fca6c7ee1615"},{label:"2021 international CLE guideline",url:"https://pubmed.ncbi.nlm.nih.gov/34364171/"},{label:"2021 BAD CLE guideline record",url:"https://pubmed.ncbi.nlm.nih.gov/34170012/"}],tags:["retinoid","lupus"]},{id:"thalidomide",name:"Thalidomide",className:"Immunomodulatory imide drug",routes:"PO",dosing:"Cutaneous ENL: 100–300 mg once daily at bedtime ≥1 hour after the evening meal; severe ENL may require up to 400 mg/day. Continue until active signs resolve (usually ≥2 weeks), then taper by 50 mg every 2–4 weeks; use minimum maintenance and attempt taper every 3–6 months. Refractory CLE: generally 50–100 mg nightly, then taper to lowest effective dose/stop (off-label).",monitoring:"THALOMID REMS and pregnancy testing; baseline/serial neurologic examination; CBC; renal/hepatic function; VTE, sedation, constipation, bradycardia, rash and thyroid surveillance.",avoid:"Pregnancy and hypersensitivity to thalidomide/components.",cautions:"Pre-existing neuropathy, major VTE/antiphospholipid risk, sedation/falls, bradycardia, cytopenia and seizure disorder; neuropathy can be irreversible.",notes:"Late rescue for multiply refractory CLE. Do not combine with lenalidomide; individualize thromboprophylaxis when combined with thrombogenic drugs.",regulatoryStatus:"US-approved for cutaneous ENL and, with dexamethasone, newly diagnosed myeloma; CLE use is off-label.",source:"DailyMed — THALOMID",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=2eda833b-1357-4ed4-a093-194524fcb061",sources:[{label:"Current DailyMed THALOMID label",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=2eda833b-1357-4ed4-a093-194524fcb061"},{label:"2025 ACR SLE guideline hub",url:"https://rheumatology.org/lupus-guideline"},{label:"2023 EULAR SLE recommendations record",url:"https://pubmed.ncbi.nlm.nih.gov/37827694/"}],tags:["imid","lupus","rems"]},{id:"lenalidomide",name:"Lenalidomide",className:"Immunomodulatory imide drug",routes:"PO",dosing:"Off-label CLE pilot: 5 mg once daily for 4 weeks; if no improvement, increase to 10 mg daily; continue 5 mg for partial response or taper monthly after complete response. A second trial used 5 mg daily for 6 weeks, then 5 mg every other day for responders or 10 mg daily for nonresponders. Renal adjustment is mandatory per label.",monitoring:"Lenalidomide REMS and pregnancy testing; CBC frequently during initiation and by risk; renal function; LFTs; thyroid; VTE/arterial thrombosis; rash, neuropathy, infection and secondary malignancy risk.",avoid:"Pregnancy and demonstrated severe hypersensitivity to lenalidomide.",cautions:"Cytopenias, prior VTE/arterial event or antiphospholipid antibodies, renal impairment without adjustment, hepatotoxicity and severe cutaneous reactions.",notes:"Late rescue for refractory CLE; lower neuropathy incidence than thalidomide does not mean low overall risk. Do not combine with thalidomide; individualize thromboprophylaxis.",regulatoryStatus:"US-approved for several hematologic malignancies; CLE use is off-label.",source:"DailyMed — REVLIMID",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=5fa97bf5-28a2-48f1-8955-f56012d296be",sources:[{label:"Current DailyMed REVLIMID label",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=5fa97bf5-28a2-48f1-8955-f56012d296be"},{label:"CLE pilot NCT01408199",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC3674591/"},{label:"52-week CLE trial",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC4333148/"}],tags:["imid","lupus","rems"]},{id:"amlodipine",name:"Amlodipine",className:"Dihydropyridine calcium-channel blocker",routes:"PO",dosing:"Raynaud: 2.5–5 mg daily; titrate after 7–14 days by BP/tolerability to 10 mg daily maximum.",monitoring:"Seated/standing BP, dizziness, edema/weight, headache/flushing, palpitations and Raynaud burden; titrate slowly in hepatic impairment.",avoid:"Amlodipine hypersensitivity.",cautions:"Symptomatic hypotension, severe aortic stenosis, hepatic impairment, marked edema or severe obstructive CAD. Additive hypotension with PDE5 inhibitors, nitrates, riociguat, prostacyclins and other antihypertensives; limit simvastatin to 20 mg/day and monitor tacrolimus/cyclosporine levels.",notes:"Off-label alternative for uncomplicated Raynaud; not a digital-ulcer healing drug and not evidence-equivalent to first-line nifedipine.",regulatoryStatus:"U.S.: FDA-approved for hypertension/CAD indications; Raynaud use is off-label.",source:"DailyMed amlodipine label; EULAR systemic-sclerosis recommendations",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=829aad05-7f21-41c2-b80b-2da793ae70d7",sources:[{label:"DailyMed — amlodipine",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=829aad05-7f21-41c2-b80b-2da793ae70d7"},{label:"EULAR recommendations for systemic sclerosis",url:b}],tags:["vascular","ccb","raynaud","off-label"]},{id:"felodipine-er",name:"Felodipine extended release",className:"Dihydropyridine calcium-channel blocker",routes:"PO",dosing:"Raynaud: 5 mg ER daily; adjust no faster than every 2 weeks to 2.5–10 mg daily. Start 2.5 mg in older adults/hepatic impairment; swallow whole.",monitoring:"BP, pulse, edema, headache/flushing, dizziness/syncope, angina, gingival hyperplasia and Raynaud burden.",avoid:"Felodipine hypersensitivity.",cautions:"Hypotension/syncope, susceptible CAD, ventricular dysfunction, hepatic impairment and edema. Avoid grapefruit; CYP3A4 inhibitors raise and inducers lower exposure; monitor tacrolimus. Other vasodilators add hypotension.",notes:"Off-label Raynaud alternative with limited direct evidence; not a digital-ulcer healing drug. Keep the current U.S. label ceiling of 10 mg/day.",regulatoryStatus:"U.S.: FDA-approved for hypertension; Raynaud use is off-label.",source:"DailyMed felodipine label; controlled Raynaud trial; EULAR recommendations",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=57fb4217-00f6-4112-bc63-81fcbe2ea903",sources:[{label:"DailyMed — felodipine ER",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=57fb4217-00f6-4112-bc63-81fcbe2ea903"},{label:"Felodipine Raynaud trial",url:"https://pubmed.ncbi.nlm.nih.gov/2060571/"},{label:"EULAR recommendations for systemic sclerosis",url:b}],tags:["vascular","ccb","raynaud","off-label"]},{id:"tadalafil-vascular",name:"Tadalafil",className:"PDE-5 inhibitor",routes:"PO",dosing:"Refractory secondary Raynaud/digital-ulcer trial regimen: 20 mg every other day for 6–8 weeks as add-on (off-label). PAH: 40 mg once daily, not divided; label-directed renal/hepatic adjustment applies.",monitoring:"BP/orthostasis, headache, flushing, dyspepsia, myalgia, Raynaud/ulcer response, renal/hepatic function, vision or hearing loss and priapism; specialist PAH response.",avoid:"Any organic nitrate, riociguat/another sGC stimulator or serious hypersensitivity. No nitrate until at least 48 hours after tadalafil.",cautions:"Baseline hypotension, hazardous cardiovascular disease, PVOD, severe renal/hepatic disease, prior NAION and bleeding/priapism risk. Do not combine with another PDE5 inhibitor; strong CYP3A modifiers require label review. Vasodilators add hypotension.",notes:"Tadalafil-specific SSc-Raynaud trials conflict; never display the PAH dose as a Raynaud dose. Ambrisentan plus tadalafil is labeled for PAH, not uncomplicated Raynaud.",regulatoryStatus:"U.S.: FDA-approved for WHO group 1 PAH; Raynaud/digital-ulcer use is off-label.",source:"DailyMed tadalafil PAH label; positive and negative randomized Raynaud trials",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=ff61b237-be8e-461b-8114-78c52a8ad0ae",sources:[{label:"DailyMed — tadalafil for PAH",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=ff61b237-be8e-461b-8114-78c52a8ad0ae"},{label:"Positive refractory secondary-Raynaud RCT",url:"https://pubmed.ncbi.nlm.nih.gov/20837499/"},{label:"Negative SSc-Raynaud RCT",url:"https://pubmed.ncbi.nlm.nih.gov/19755613/"},{label:"EULAR recommendations for systemic sclerosis",url:b}],tags:["vascular","pde5","raynaud","digital-ulcer","pah","off-label-rp"]},{id:"iloprost-iv",name:"Iloprost, intravenous",className:"Prostacyclin analogue",routes:"IV",dosing:"SSc severe Raynaud/active digital ulcer: 0.5 ng/kg/min; increase by 0.5 ng/kg/min every 30 minutes as tolerated to 2 ng/kg/min, 6 hours daily for 5 days (representative off-label trial course).",monitoring:"Correct hypotension first; monitor BP/pulse/symptoms before infusion and each increase, bleeding, line complications, digit perfusion, ulcer infection and ischemic progression.",avoid:"Current Aurlumyn label lists no formal contraindication; stop for product hypersensitivity.",cautions:"Uncorrected hypotension, unstable ischemic heart disease, decompensated HF/arrhythmia, active bleeding, severe renal/hepatic disease and pregnancy/lactation uncertainty. Other vasodilators add hypotension; antithrombotics add bleeding.",notes:"Use after oral failure for severe SSc-Raynaud/active DU under specialist monitoring. Inhaled iloprost is a separate PAH product and regimen.",regulatoryStatus:"U.S.: IV iloprost (Aurlumyn) is FDA-approved for severe frostbite; SSc-Raynaud/digital-ulcer use is off-label.",source:"Aurlumyn label; FDA approval; randomized SSc-Raynaud trial",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=34036fc0-6832-d066-e063-6394a90a18a4",sources:[{label:"DailyMed — Aurlumyn",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=34036fc0-6832-d066-e063-6394a90a18a4"},{label:"FDA severe-frostbite approval",url:"https://www.fda.gov/news-events/press-announcements/fda-approves-first-medication-treat-severe-frostbite"},{label:"IV iloprost SSc-Raynaud RCT",url:"https://pubmed.ncbi.nlm.nih.gov/7506013/"},{label:"EULAR recommendations for systemic sclerosis",url:b}],tags:["vascular","prostacyclin","raynaud","digital-ulcer","off-label"]},{id:"epoprostenol-iv",name:"Epoprostenol, intravenous",className:"Prostacyclin",routes:"Continuous IV",dosing:"PAH: start 2 ng/kg/min continuous IV; adjust by 1–2 ng/kg/min no more often than every 15 minutes, then individualize. Critical digital ischemia rescue: titrate to 2 ng/kg/min over 30 hours continuously or 6 hours/day for 5 days (off-label institutional protocols).",monitoring:"Monitored initiation; BP, pulse, oxygenation, pulmonary edema, bleeding, high-output HF, pump/line integrity and sepsis. For ischemia, monitor perfusion, pain, ulcer, gangrene and infection.",avoid:"Heart failure caused by reduced LVEF; hypersensitivity.",cautions:"PVOD/pulmonary edema, systemic hypotension, bleeding and inability to maintain pump/line. Never bolus, mix with other parenteral drugs or abruptly stop/reduce chronic infusion; transition only under continuous specialist observation.",notes:"PAH approval does not validate ordinary-Raynaud treatment. Limit the off-label peripheral indication to inpatient rescue of threatened/refractory digital ischemia.",regulatoryStatus:"U.S.: FDA-approved for WHO group 1 PAH; critical digital-ischemia rescue is off-label.",source:"FLOLAN label; institutional digital-ischemia protocol study",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?lang=en&setid=8e4b636e-ee9c-4111-779d-28c8369d283b",sources:[{label:"DailyMed — FLOLAN",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?lang=en&setid=8e4b636e-ee9c-4111-779d-28c8369d283b"},{label:"Epoprostenol digital-ischemia protocol study",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC11561961/"}],tags:["vascular","prostacyclin","pah","critical-digital-ischemia","off-label-digital"]},{id:"treprostinil-parenteral",name:"Treprostinil, parenteral",className:"Prostacyclin analogue",routes:"Continuous SC; continuous IV if SC is not tolerated",dosing:"Start 1.25 ng/kg/min; reduce to 0.625 ng/kg/min if systemic effects. Increase by 1.25 ng/kg/min/week for 4 weeks, then 2.5 ng/kg/min/week. Start 0.625 ng/kg/min in mild–moderate hepatic impairment.",monitoring:"PAH response, BP, edema, headache/flushing, jaw pain, GI effects, bleeding, SC-site reaction, pump integrity and IV catheter infection/sepsis.",avoid:"Current Remodulin label lists no formal contraindication.",cautions:"Hypotension, bleeding, severe hepatic impairment and inability to maintain infusion. Never abruptly stop; reassess with CYP2C8 inhibitors/inducers. Routes/products are not dose-interchangeable.",notes:"PAH-only in this expansion. Do not use routinely for Raynaud/digital ulcers: the oral treprostinil DISTOL-1 RCT did not significantly improve ulcer burden, healing or prevention.",regulatoryStatus:"U.S.: FDA-approved for PAH; no FDA Raynaud or digital-ulcer indication.",source:"Remodulin label; DISTOL-1 SSc digital-ulcer trial",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=6c80bb38-e8db-4138-9f0d-dbbf9c673185",sources:[{label:"DailyMed — Remodulin",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=6c80bb38-e8db-4138-9f0d-dbbf9c673185"},{label:"DISTOL-1 trial report",url:"https://discovery.ucl.ac.uk/10072256/3/Denton%20DISTOL%20UCL%202017.pdf"}],tags:["vascular","prostacyclin","pah","pah-only","negative-evidence-du"]},{id:"selexipag",name:"Selexipag",className:"Selective prostacyclin IP-receptor agonist",routes:"PO",dosing:"PAH: 200 mcg twice daily, preferably with food; increase by 200 mcg twice daily, usually weekly, to the highest tolerated dose, maximum 1,600 mcg twice daily. Moderate hepatic impairment requires once-daily titration.",monitoring:"PAH response, headache, diarrhea, jaw pain, nausea/vomiting, myalgia, extremity pain, flushing, pulmonary edema/PVOD, hepatic function and CYP2C8 drugs.",avoid:"Strong CYP2C8 inhibitor; hypersensitivity.",cautions:"Avoid severe hepatic impairment; use caution with PVOD, significant hypotension or intolerable prostacyclin effects. Moderate CYP2C8 inhibitors require once-daily dosing; inducers lower exposure.",notes:"PAH-only. Do not use for Raynaud: a randomized SSc-Raynaud phase II trial showed no benefit for attack frequency, Raynaud Condition Score or attack duration.",regulatoryStatus:"U.S.: FDA-approved for WHO group 1 PAH; no FDA Raynaud or digital-ulcer indication.",source:"Uptravi label; negative randomized SSc-Raynaud trial",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=a7a23b87-f892-4e2c-8e2e-ebf841220f90",sources:[{label:"DailyMed — Uptravi",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=a7a23b87-f892-4e2c-8e2e-ebf841220f90"},{label:"Negative selexipag SSc-Raynaud RCT",url:"https://pubmed.ncbi.nlm.nih.gov/29193819/"}],tags:["vascular","prostacyclin-pathway","pah","pah-only","negative-evidence-rp"]},{id:"ambrisentan",name:"Ambrisentan",className:"Endothelin-A receptor antagonist",routes:"PO",dosing:"PAH: 5 mg daily, with or without tadalafil 20 mg daily; at 4-week intervals titrate as needed/tolerated to ambrisentan 10 mg and tadalafil 40 mg.",monitoring:"Pregnancy status before treatment and contraception during/1 month after; hemoglobin baseline, at 1 month and periodically; edema/weight/HF, liver injury, PAH response and PVOD/pulmonary edema.",avoid:"Pregnancy; idiopathic pulmonary fibrosis, including IPF-associated WHO group 3 PH.",cautions:"Anemia, moderate/severe hepatic impairment, fluid retention/LV failure, PVOD and fertility concerns. Cyclosporine limits dose to 5 mg daily; do not combine two ERAs. Tadalafil nitrate/riociguat prohibitions remain.",notes:"PAH-only. A small uncontrolled digital-ulcer pilot is insufficient for a Raynaud/digital-ulcer indication badge.",regulatoryStatus:"U.S.: FDA-approved for WHO group 1 PAH, including labeled use with tadalafil; no FDA Raynaud/digital-ulcer indication.",source:"Letairis label; uncontrolled SSc digital-ulcer pilot",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=725d4e73-6c83-477a-adc6-0ae4a133a844",sources:[{label:"DailyMed — Letairis",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=725d4e73-6c83-477a-adc6-0ae4a133a844"},{label:"Ambrisentan SSc digital-ulcer pilot",url:"https://pubmed.ncbi.nlm.nih.gov/25037794/"}],tags:["vascular","endothelin","pah","pah-only","insufficient-evidence-du"]},{id:"macitentan",name:"Macitentan",className:"Dual endothelin-receptor antagonist",routes:"PO",dosing:"PAH: 10 mg once daily; do not exceed.",monitoring:"Pregnancy status before treatment and contraception during/1 month after; baseline LFTs and hemoglobin, then as clinically indicated; edema/weight/HF, PAH response and PVOD/pulmonary edema.",avoid:"Pregnancy; hypersensitivity.",cautions:"Severe anemia, active hepatic injury, major fluid retention/LV dysfunction, PVOD and fertility concerns. Avoid strong CYP3A4 inducers/inhibitors and relevant combined CYP3A4/CYP2C9 inhibitors; do not combine two ERAs.",notes:"PAH-only. Do not use for SSc digital-ulcer prevention: DUAL-1/2 were negative. Bosentan digital-ulcer evidence is not an ERA class effect.",regulatoryStatus:"U.S.: FDA-approved for WHO group 1 PAH; no FDA Raynaud/digital-ulcer indication.",source:"Opsumit label; negative DUAL-1 and DUAL-2 trials",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=1e484a50-55db-4b85-8c57-6cd1b0353abd",sources:[{label:"DailyMed — Opsumit",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=1e484a50-55db-4b85-8c57-6cd1b0353abd"},{label:"DUAL-1 and DUAL-2 trials",url:"https://jamanetwork.com/journals/jama/fullarticle/2520629"}],tags:["vascular","endothelin","pah","pah-only","negative-evidence-du"]},{id:"riociguat",name:"Riociguat",className:"Soluble guanylate-cyclase stimulator",routes:"PO",dosing:"PAH/eligible CTEPH: 1 mg three times daily; use 0.5 mg TID if hypotension risk. If SBP is above 95 mm Hg without symptoms, increase by 0.5 mg TID no sooner than every 2 weeks to 2.5 mg TID maximum; re-titrate after interruption of 3 days or more.",monitoring:"BP/ischemic symptoms, PAH/CTEPH response, bleeding/hemoptysis, pulmonary edema/PVOD, pregnancy status, renal/hepatic function and smoking status.",avoid:"Pregnancy; any nitrate/NO donor; any PDE5 inhibitor; another sGC stimulator; PH associated with idiopathic interstitial pneumonias.",cautions:"Hypotension/hypovolemia, LV outflow obstruction, bleeding/hemoptysis, PVOD, CrCl below 15/dialysis or Child-Pugh C. Stop sildenafil at least 24 hours or tadalafil at least 48 hours before riociguat; stop riociguat at least 24 hours before a PDE5 inhibitor.",notes:"PAH/selected CTEPH only. Never show for Raynaud, digital ulcers or unclassified SSc pulmonary hypertension; require WHO-group classification and right-heart-catheterization confirmation.",regulatoryStatus:"U.S.: FDA-approved for WHO group 1 PAH and specified persistent/recurrent or inoperable CTEPH; no FDA Raynaud/digital-ulcer indication.",source:"Adempas label; EULAR systemic-sclerosis recommendations",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/lookup.cfm?setid=7b57509a-3d5d-41d4-8fed-1471e26372a3&version=28",sources:[{label:"DailyMed — Adempas, revised December 2025",url:"https://dailymed.nlm.nih.gov/dailymed/lookup.cfm?setid=7b57509a-3d5d-41d4-8fed-1471e26372a3&version=28"},{label:"EULAR recommendations for systemic sclerosis",url:b}],tags:["vascular","sgc-stimulator","pah","ctepH","pah-only"]},{id:"nitroglycerin-topical",name:"Nitroglycerin 2% ointment, topical",className:"Organic nitrate / local vasodilator",routes:"Topical",dosing:"Raynaud adjunct: apply 0.5 inch (7.5 mg) at the base of the affected digit on rising; a second 0.5-inch dose may be used 6 hours later, followed by a 10–12-hour nitrate-free interval. This is label extrapolation, not a validated SSc outcome dose.",monitoring:"BP/orthostasis, headache, flushing, dizziness, palpitations, local irritation, Raynaud response and tolerance. Escalate persistent rest pain, ischemia or ulcer progression urgently.",avoid:"Any PDE5 inhibitor, riociguat/another sGC stimulator or nitrate hypersensitivity. No nitrate until at least 48 hours after tadalafil.",cautions:"Hypotension, hypovolemia, severe anemia, raised intracranial pressure, preload-dependent states and extensive application. CCBs, prostacyclins, alcohol and other antihypertensives add hypotension; topical use does not bypass nitrate interaction stops.",notes:"Off-label local Raynaud adjunct; not digital-ulcer monotherapy or rescue for a threatened digit. Investigational MQX-503 gel is not a marketed equivalent.",regulatoryStatus:"U.S.: 2% nitroglycerin ointment is FDA-approved for prevention of angina; Raynaud/digital use is off-label.",source:"DailyMed nitroglycerin ointment label; SSc digital-flow study",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=c17c997b-0e90-4105-888b-2de22d2bf697",sources:[{label:"DailyMed — nitroglycerin 2% ointment",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=c17c997b-0e90-4105-888b-2de22d2bf697"},{label:"Glyceryl trinitrate SSc digital-flow study",url:"https://pubmed.ncbi.nlm.nih.gov/11934971/"},{label:"MQX-503 trial methods",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC3529989/"}],tags:["vascular","nitrate","raynaud","adjunct","off-label"]},{id:"captopril-src",name:"Captopril / ACE inhibitors for scleroderma renal crisis",className:"Angiotensin-converting-enzyme inhibitor",routes:"PO",dosing:"Established SRC: monitored hospital start captopril 6.25–12.5 mg every 8 hours; increase by 12.5–25 mg/dose every 4–8 hours as needed/tolerated toward pre-crisis BP over about 2–3 days. Continue through AKI/dialysis unless truly contraindicated or intolerable.",monitoring:"Frequent BP, urine output, creatinine/BUN/eGFR, potassium, volume and end-organ injury; ECG if hyperkalemia; CBC/platelets/hemolysis and urinalysis/proteinuria. Monitor WBC/differential in scleroderma with renal impairment.",avoid:"Pregnancy; prior ACE-inhibitor angioedema/hypersensitivity; sacubitril/neprilysin inhibitor without a 36-hour washout; aliskiren in diabetes.",cautions:"Hyperkalemia, renal-artery stenosis, profound hypotension/volume depletion, severe aortic stenosis and high-flux dialysis. Avoid ACEI plus ARB/aliskiren dual blockade; potassium products, potassium-sparing diuretics and NSAIDs require explicit review. Rising creatinine alone in established SRC is not an automatic stop.",notes:"Start an ACE inhibitor immediately when SRC is diagnosed; add-on antihypertensives do not replace it. Do not use prophylactic ACE inhibition solely to prevent SRC: pre-crisis associations are concerning but confounded.",regulatoryStatus:"U.S.: ACE-inhibitor treatment of SRC is standard-of-care/off-label; captopril has no FDA SRC indication.",source:"Captopril label; EULAR recommendations; SRC review and observational cohorts",sourceUrl:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=1fbc9b28-ff10-4b17-a359-e12b4330747e",sources:[{label:"DailyMed — captopril",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=1fbc9b28-ff10-4b17-a359-e12b4330747e"},{label:"EULAR recommendations for systemic sclerosis",url:b},{label:"SRC titration review",url:"https://www.sciencedirect.com/science/article/pii/S0755498221000026"},{label:"Early ACE-inhibitor SRC cohort",url:"https://pubmed.ncbi.nlm.nih.gov/37458488/"},{label:"Pre-crisis ACE-inhibitor survey",url:"https://pubmed.ncbi.nlm.nih.gov/24176729/"}],tags:["vascular","ace-inhibitor","ssc","renal-crisis","off-label"]}],S=(e,t,n,i,a)=>({drug:e,tier:t,phenotype:n,pearl:i,useStatus:a}),k=[{id:"lupus",name:"Cutaneous lupus / SLE",group:"Connective tissue disease",summary:"Photoprotection, smoking cessation and topical therapy sit beneath the systemic ladder. Match escalation to CLE subtype, systemic activity and pregnancy plans.",urgent:"Escalate immediately for organ-threatening SLE; do not treat isolated skin scores as a proxy for renal, neurologic or hematologic activity.",options:[S("hcq","Anchor","Most CLE phenotypes","Foundation systemic therapy when not contraindicated.","US-labeled for SLE and chronic discoid lupus"),S("mtx","Alternative","Inflammatory/refractory CLE","Useful with arthritis; weekly safety discipline is critical.","Off-label for CLE"),S("mmf","Alternative","Refractory CLE or concurrent nephritis/ILD","Especially attractive when systemic indications overlap.","Off-label for CLE and lupus nephritis"),S("belimumab","Refractory","Active SLE receiving standard therapy","FDA-labeled systemic option; pivotal trials enrolled autoantibody-positive patients, and cutaneous benefit is assessed within whole-patient SLE control.","US-labeled for active SLE and lupus nephritis"),S("anifrolumab","Refractory","Moderate-to-severe SLE with prominent skin disease","Type-I interferon pathway targeting; zoster risk matters.","US-labeled for moderate-to-severe SLE"),S("dapsone","Adjunct","Bullous lupus / neutrophilic phenotype","Phenotype-specific; verify G6PD and monitor hematologic toxicity.","Off-label for bullous/CLE phenotypes")]},{id:"dm",name:"Dermatomyositis / IIM",group:"Connective tissue disease",summary:"Treat muscle, skin, lung and vasculopathic disease as linked but distinct domains. Cancer and ILD risk may dominate selection.",urgent:"Rapidly progressive ILD, dysphagia, myocarditis or severe weakness requires multidisciplinary urgent induction.",options:[S("prednisone","Anchor","Active muscle/organ disease","Rapid induction bridge; pair early with a steroid-sparing plan.","Off-label disease-protocol regimen"),S("mtx","Anchor","Skin + muscle without significant ILD","Avoid when lung toxicity/ILD uncertainty dominates.","Off-label for IIM"),S("mmf","Anchor","Skin disease with ILD overlap","Common cross-domain steroid-sparing option.","Off-label for IIM/ILD"),S("ivig","Refractory","Severe skin, dysphagia or weakness","Fast, non-cytotoxic option; infusion/thrombosis burden.","Octagam 10% is US-labeled for adult dermatomyositis"),S("rituximab","Refractory","Refractory systemic disease","Often phenotype/antibody informed in specialty care.","Off-label for dermatomyositis/IIM")]},{id:"ssc-skin",name:"Systemic sclerosis — skin",group:"Connective tissue disease",summary:"Clarify diffuse vs limited disease, trajectory, early inflammatory phase and organ involvement before interpreting skin-directed benefit.",urgent:"Avoid high-dose glucocorticoid exposure when possible because of renal-crisis risk; monitor BP/renal signals.",options:[S("mtx","Alternative","Early inflammatory skin disease","Consider when skin/joint disease predominates and ILD is not the main driver.","Off-label for SSc skin fibrosis"),S("mmf","Anchor","Progressive skin disease with ILD overlap","Common first systemic strategy across skin/lung domains.","Off-label for SSc skin fibrosis"),S("rituximab","Alternative","Progressive skin fibrosis","Guideline-supported off-label option; use specialist selection rather than implying a mandatory refractory-only sequence.","Off-label for SSc skin fibrosis"),S("tocilizumab","Alternative","Early diffuse inflammatory disease with SSc-ILD risk","Pulmonary-function indication is the clearest regulatory anchor.","Skin positioning is off-label; SSc-ILD is US-labeled")]},{id:"ssc-ild",name:"Systemic sclerosis–associated ILD",group:"Fibrosing lung disease",summary:"Separate immunosuppression for inflammatory disease from antifibrotic slowing of FVC decline; combination decisions require pulmonary/rheumatology oversight.",urgent:"New oxygen need, rapid FVC/DLCO decline or acute respiratory deterioration requires urgent ILD evaluation.",options:[S("mmf","Anchor","Inflammatory/progressive SSc-ILD","Common first-line immunosuppressive backbone.","Off-label for SSc-ILD"),S("nintedanib","Anchor","Progressive fibrosing phenotype","Antifibrotic; can be combined with background MMF in selected patients.","US-labeled for SSc-ILD"),S("tocilizumab","Alternative","Early diffuse inflammatory SSc-ILD","Approved to slow pulmonary-function decline.","US-labeled for SSc-ILD"),S("cyclophosphamide","Alternative","Severe or progressive SSc-ILD","Conditional guideline-supported finite induction option when expected benefit justifies marrow, fertility, infection, bladder and malignancy toxicity.","Off-label for SSc-ILD"),S("rituximab","Alternative","Progressive SSc-ILD","Conditional guideline-supported off-label option; often used after progression on mycophenolate, but sequencing is individualized.","Off-label for SSc-ILD")]},{id:"raynaud",name:"Raynaud phenomenon / digital ischemia",group:"Vascular rheum-derm",summary:"Warmth, trigger avoidance and vascular-risk control precede stepwise vasodilation. Distinguish uncomplicated attacks from threatened digit.",urgent:"Persistent pallor/cyanosis, severe rest pain, ulcer infection or evolving necrosis is an emergency; do not wait for routine follow-up.",options:[S("nifedipine","Anchor","Frequent uncomplicated attacks","Common first oral vasodilator.","Off-label for Raynaud phenomenon"),S("sildenafil","Alternative","Refractory attacks or digital ischemia","Never combine with nitrates.","Off-label for Raynaud/digital ischemia"),S("bosentan","Refractory","Recurrent SSc digital ulcers","Prevention of new ulcers rather than healing an active ulcer.","Off-label in the US for SSc digital-ulcer prevention")]},{id:"aav",name:"ANCA-associated vasculitis",group:"Vasculitis",summary:"Induction intensity depends on organ threat. Dermatologic findings may be the visible edge of renal, pulmonary or neurologic disease.",urgent:"Pulmonary hemorrhage, rapidly progressive glomerulonephritis, mononeuritis multiplex or mesenteric ischemia requires emergency induction.",options:[S("prednisone","Anchor","Active systemic disease","Use a protocolized taper with definitive induction.","Guideline-based AAV regimen; no universal label dose"),S("rituximab","Anchor","Severe GPA/MPA; relapsing disease","Major induction and maintenance option.","US-labeled for GPA/MPA"),S("cyclophosphamide","Anchor","Organ-threatening induction","Finite exposure with fertility/urotoxicity planning.","Off-label for AAV"),S("mepolizumab","Alternative","Relapsing/refractory non–organ-threatening EGPA","Targets eosinophilic biology; not interchangeable with GPA/MPA induction.","US-labeled for EGPA")]},{id:"behcet",name:"Behçet disease",group:"Vasculitis / autoinflammatory",summary:"Choose by organ domain: mucocutaneous, ocular, neurologic, gastrointestinal and major-vessel disease require different intensity.",urgent:"Posterior uveitis, neurologic disease, arterial aneurysm or major venous thrombosis requires urgent specialty treatment.",options:[S("colchicine","Anchor","Genital ulcers, erythema-nodosum-like lesions and articular disease","Useful for recurrent mucocutaneous/articular disease; oral-ulcer benefit is less consistent, so do not promise control of oral ulcers.","Off-label for Behçet disease"),S("apremilast","Alternative","Recurrent oral ulcers","Approved for oral ulcers in adults with Behçet disease.","US-labeled for Behçet-associated oral ulcers"),S("aza","Alternative","Mucocutaneous plus ocular/systemic disease","Steroid-sparing cross-domain option.","Off-label for Behçet disease"),S("infliximab","Refractory","Severe ocular, vascular, neurologic or GI disease","Rapid high-intensity biologic option in expert care.","Off-label for Behçet disease"),S("adalimumab","Refractory","Severe multisystem disease","SC TNF-inhibitor alternative.","Off-label for Behçet disease")]},{id:"psopsa",name:"Psoriasis / psoriatic arthritis",group:"Psoriatic disease",summary:"Joint, axial, skin, nail, IBD and uveitis domains—plus cardiometabolic risk—should drive a shared drug choice.",urgent:"Acutely ill pustular or erythrodermic psoriasis requires urgent systemic assessment and rescue planning.",options:[S("mtx","Alternative","P
